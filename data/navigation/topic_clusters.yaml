clusters:
  - id: known-direction-ternary-search
    title_ru: "Одна фальшивая известного знака: три исхода за ход"
    description_ru: "Задачи, где один ход обычно дает три ответа: левая чаша тяжелее, правая тяжелее или равновесие. Стратегия делит подозреваемые монеты на три почти равные группы; заранее известно, легче фальшивая монета или тяжелее."
    inclusion_criteria_ru:
      - "Есть один скрытый объект или позиция из N кандидатов."
      - "Один ход имеет три содержательных исхода, обычно левая чаша тяжелее, равновесие или правая чаша тяжелее."
      - "Цель - найти объект, а не заранее составить таблицу для случая, когда неизвестно, легче фальшивая монета или тяжелее."
      - "Нижняя оценка обычно имеет вид N <= 3^q или считается по листьям дерева с тремя исходами на каждом шаге."
    exclusion_criteria_ru:
      - "Если нужно одновременно определить, легче или тяжелее монета, см. кластер про фальшивую монету с неизвестным направлением отличия."
      - "Если тесты заранее заданы таблицей исходов, см. кластеры про неизвестное направление отличия или числа и суммы."
      - "Если ключевой ход - двоичное деление пополам, это не этот кластер."
    core_problem_ids:
      - heavier-9-coins-2-weighings
      - lighter-25-coins-3-weighings
      - problems-ru-34945-27-light-coins
      - kvant-2013-one-light-coin-information-bound
      - sasmo-2020-g9-q10-2019-light-coin
    problem_ids:
      - heavier-9-coins-2-weighings
      - lighter-25-coins-3-weighings
      - problems-ru-34945-27-light-coins
      - kvant-2013-one-light-coin-information-bound
      - sasmo-2020-g9-q10-2019-light-coin
      - nrich-spot-the-fake-two-weighings
      - one-counterfeit-among-27-three-ternary-questions
    candidate_rules:
      tags_any: [ternary_search]
      profile_hints:
        - "weighing_profile.counterfeit_count == 1"
        - "weighing_profile.counterfeit_type содержит known/heavier_known/lighter_known"
        - "outcome_count_per_weighing == 3"
      reject_if_tags_any: [nonadaptive_strategy, weighted_sum_encoding]
    local_facets:
      - weighing_count
      - outcome_alphabet
      - hidden_state_count
      - known_direction
      - adaptive
      - lower_bound_tight
      - balanced_split
    notes_ru: "Это наиболее чистый учебный кластер для объяснения того, сколько вариантов различает дерево с тремя исходами. Не стоит расширять его на любую задачу с чашечными весами."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: heavy-or-light-ternary-signatures
    title_ru: "Фальшивая монета: легче или тяжелее неизвестно"
    description_ru: "Фальшивка может оказаться легче или тяжелее обычной монеты. Нужно найти монету и по взвешиваниям понять, в какую сторону она отличается."
    inclusion_criteria_ru:
      - "Возможный ответ включает сам предмет и то, легче он или тяжелее обычного."
      - "Легкий и тяжелый варианты одной монеты дают противоположные результаты взвешиваний или симметричные ветви рассуждения."
      - "Из-за неизвестного направления отличия случаев почти вдвое больше, чем в задаче, где фальшивая монета заранее известна легкой или тяжелой."
    exclusion_criteria_ru:
      - "Если заранее известно, легче фальшивая монета или тяжелее, см. кластер про поиск по трем исходам."
      - "Если числовое показание само является читаемой суммой, см. кластер про числа и суммы."
      - "Если цель - определить только легче/тяжелее без поиска объекта, держать как кандидат, а не как ядро."
    core_problem_ids:
      - counterfeit-12-coins-3-weighings
      - counterfeit-12-coins-3-preassigned-weighings
      - thirteen-coins-preassigned-identify-only-three-weighings
      - ternary-signature-code-heavy-or-light
      - thirteen-coins-known-genuine-three-weighings
      - komal-2010-a512-nonadaptive-counterfeit-code
      - ukmt-open-ended-2013-task-four-42-counterfeit-coins
    problem_ids:
      - counterfeit-12-coins-3-weighings
      - counterfeit-12-coins-3-preassigned-weighings
      - thirteen-coins-preassigned-identify-only-three-weighings
      - ternary-signature-code-heavy-or-light
      - thirteen-coins-known-genuine-three-weighings
      - komal-2010-a512-nonadaptive-counterfeit-code
      - ukmt-open-ended-2013-task-four-42-counterfeit-coins
      - kvant-2003-04-four-coins-standard-two-weighings
      - nrich-nine-weights-two-three-weighings
      - problems-ru-32820-sign-only-two-weighings
      - kvantik-2013-fake-coin-direction-101
      - knop-saladin-14-known-genuine-identify-only
      - knop-saladin-four-weighings-one-spare
      - knop-six-coins-two-weighings-identify-only-impossible
    candidate_rules:
      tags_all_or_near: [balance_scale, ternary_code]
      profile_hints:
        - "counterfeit_type содержит heavier_or_lighter/unknown_direction/unknown_sign"
        - "objective содержит identify_coin_and_sign или determine_whether_counterfeit_is_heavier_or_lighter"
    local_facets:
      - primary_family
      - weighing_count
      - adaptive
      - known_genuine_available
      - signature_balance_required
      - objective
      - state_multiplier
      - impossible_or_capacity_bound
    notes_ru: "Кластер соединяет классическую задачу о 12 монетах с заранее составленными таблицами взвешиваний; внутри полезно различать дерево решений и фиксированную таблицу результатов."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: preassigned-and-erasure-weighing-codes
    title_ru: "Заранее назначенные взвешивания и запасные планы"
    description_ru: "Задачи, где все взвешивания назначаются до первого результата. Скрытые случаи различаются таблицей исходов, а в запасных планах одно или несколько взвешиваний можно потерять."
    inclusion_criteria_ru:
      - "Взвешивания задаются таблицей заранее и не зависят от предыдущих исходов."
      - "Решение проверяет, что наборы исходов различают случаи, строки таблицы уравновешены, а план выдерживает удаление одной или нескольких строк."
      - "Сюда входят варианты с известным знаком фальшивки, неизвестным знаком, возможным отсутствием фальшивки и типами монет, меняющими знак отклонения."
    exclusion_criteria_ru:
      - "Адаптивный поиск по дереву решений без заранее фиксированной таблицы остается в поисковых кластерах."
      - "Чистые числовые суммы без таблицы трехисходных взвешиваний относятся к кластеру чисел и сумм."
    core_problem_ids:
      - knop-2011-known-light-coin-preassigned-ternary-code
      - counterfeit-12-coins-3-preassigned-weighings
      - knop-2011-nine-light-coins-one-erasure-reserve-plan
      - knop-2011-nine-light-coins-two-erasure-reserve-plan
      - knop-2011-gold-silver-27-preassigned-three-weighings
      - knop-2011-gold-silver-24-half-half-preassigned
    problem_ids:
      - knop-2011-known-light-coin-preassigned-ternary-code
      - counterfeit-12-coins-3-preassigned-weighings
      - thirteen-coins-preassigned-identify-only-three-weighings
      - komal-2010-a512-nonadaptive-counterfeit-code
      - knop-2011-possible-no-light-coin-25-nonadaptive-impossible
      - knop-2011-nine-light-coins-one-erasure-reserve-plan
      - knop-2011-nine-light-coins-two-erasure-reserve-plan
      - knop-saladin-four-weighings-one-spare
      - knop-saladin-14-known-genuine-identify-only
      - knop-2011-gold-silver-27-preassigned-three-weighings
      - knop-2011-gold-silver-24-half-half-preassigned
    candidate_rules:
      tags_all_or_near: [balance_scale, nonadaptive_strategy]
      profile_hints:
        - "strategy_type содержит nonadaptive_strategy и ternary_code"
        - "keywords содержат preassigned_weighings, reserve_plan, erasure_code или mixed_signs"
    local_facets:
      - primary_family
      - weighing_count
      - known_genuine_available
      - objective
      - counterfeit_model
      - signature_type
      - proof_method
    notes_ru: "Это навигационный слой для таблиц исходов и планов с запасом, а не новый fragment: все карточки остаются во фрагменте weighings."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: numeric-linear-signatures
    title_ru: "Числовые веса и суммы"
    description_ru: "Ответ читается из одного или нескольких чисел: суммы, разности, показания весов, медианы или заранее выбранных коэффициентов. Разные скрытые случаи специально дают разные числовые результаты."
    inclusion_criteria_ru:
      - "Мы видим число или несколько чисел, а не только ответ «левая чаша тяжелее / равновесие / правая чаша тяжелее» или «да/нет»."
      - "Выбранные веса, номиналы или группы заранее устроены так, чтобы разные варианты давали разные числовые подсказки."
      - "Ответ читается по числу или набору чисел, а не по обычному делению вариантов на ветки."
    exclusion_criteria_ru:
      - "Обычные чашечные весы без чтения числовой суммы не входят."
      - "Четность или остаток как маленький набор ответов относятся к кластеру четности и остатков, если линейная величина не является основной."
      - "Если порядок предметов передает сообщение, см. кластер про порядок карт и предметов."
    core_problem_ids:
      - counterfeit-stack-one-weighing
      - tournament-towns-2005-six-coins-pointer-scale
      - poland-omg-2005-five-coins-48g-three-digital-weighings
      - matprazdnik-2024-six-boxes-one-sum
      - problems-ru-78572-eleven-bags-two-numeric-balance-weighings
    problem_ids:
      - counterfeit-stack-one-weighing
      - tournament-towns-2005-six-coins-pointer-scale
      - poland-omg-2005-five-coins-48g-three-digital-weighings
      - matprazdnik-2024-six-boxes-one-sum
      - problems-ru-78572-eleven-bags-two-numeric-balance-weighings
      - problems-ru-65817-six-coins-digital-scale-unknown-weights
      - problems-ru-88304-denomination-coins
      - matprazdnik-2022-digits-five-questions
      - matprazdnik-2023-seven-bags-two-weighings
      - kvantik-2021-three-by-three-fake-line-one-weighing
      - kvantik-2013-four-magic-balls-three-tests
      - mmo-2019-wise-men-seven-numbers-median
      - nrich-balance-power-balanced-ternary
      - kvantik-2016-divisibility-knights-liars
      - tournament-towns-2008-four-stones-one-error
      - knop-2011-marked-ingots-55-expert-judge-27-weighings
      - knop-coin-uniformity-verification
      - knop-zero-or-k-counterfeits-verification
    candidate_rules:
      tags_any: [linear_signature, digital_scale, weighted_sum_encoding]
      profile_hints:
        - "outcome_count_per_weighing numeric/numeric_weight/numeric_difference"
        - "ideas содержат weight/ratio/code/coefficient/sum"
    local_facets:
      - primary_family
      - observation_dimension
      - coefficient_system
      - numeric_alphabet
      - delta_known
      - sign_known
      - adaptive
      - decoding_rule
