clusters:
  - id: known-direction-ternary-search
    title_ru: "Фальшивая монета: каждый раз три исхода"
    description_ru: "Задачи, где один ход обычно дает три ответа: левая чаша тяжелее, правая тяжелее или равновесие. Стратегия делит подозреваемые монеты на три почти равные группы; заранее известно, легче фальшивка или тяжелее."
    inclusion_criteria_ru:
      - "Есть один скрытый объект или позиция из N кандидатов."
      - "Наблюдение за ход имеет три содержательных исхода, обычно левее/равно/правее или один из трех ответов."
      - "Цель - найти объект, а не заранее составить таблицу для случая, когда неизвестно, легче фальшивка или тяжелее."
      - "Нижняя оценка обычно имеет вид N <= 3^q или считается по листьям дерева с тремя исходами на каждом шаге."
    exclusion_criteria_ru:
      - "Если нужно одновременно определить, легче или тяжелее монета, см. heavy-or-light-ternary-signatures."
      - "Если тесты заранее заданы таблицей кодов, см. heavy-or-light-ternary-signatures или numeric-linear-signatures."
      - "Если ключевой ход - двоичное деление пополам, это не этот кластер."
    core_problem_ids:
      - heavier-9-coins-2-weighings
      - lighter-25-coins-3-weighings
      - problems-ru-34945-27-light-coins
      - kvant-2013-one-light-coin-information-bound
      - sasmo-2020-g9-q10-2019-light-coin
    problem_ids:
      - heavier-9-coins-2-weighings
      - lighter-25-coins-3-weighings
      - problems-ru-34945-27-light-coins
      - kvant-2013-one-light-coin-information-bound
      - sasmo-2020-g9-q10-2019-light-coin
      - nrich-spot-the-fake-two-weighings
      - one-counterfeit-among-27-three-ternary-questions
    candidate_rules:
      tags_any: [ternary_search]
      profile_hints:
        - "weighing_profile.counterfeit_count == 1"
        - "weighing_profile.counterfeit_type содержит known/heavier_known/lighter_known"
        - "outcome_count_per_weighing == 3"
      reject_if_tags_any: [nonadaptive_strategy, weighted_sum_encoding]
    local_facets:
      - weighing_count
      - outcome_alphabet
      - hidden_state_count
      - known_direction
      - adaptive
      - lower_bound_tight
      - balanced_split
    notes_ru: "Это наиболее чистый учебный кластер для объяснения того, сколько вариантов различает дерево с тремя исходами. Не стоит расширять его на любую задачу с чашечными весами."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: heavy-or-light-ternary-signatures
    title_ru: "Монета легче или тяжелее: код результатов"
    description_ru: "Фальшивая монета может оказаться и легче, и тяжелее. Нужно не только найти монету, но и прочитать по результатам взвешиваний, в какую сторону она отличается."
    inclusion_criteria_ru:
      - "Скрытое состояние включает сам объект и то, легче он или тяжелее нормы."
      - "Тяжелая и легкая версии одной монеты дают противоположные коды исходов или симметричные ветви дерева."
      - "Важны не только три исхода взвешивания, но и удвоение числа случаев из-за неизвестного направления отличия."
    exclusion_criteria_ru:
      - "Если заранее известно, легче фальшивка или тяжелее, см. known-direction-ternary-search."
      - "Если числовое показание само является декодируемой суммой, см. numeric-linear-signatures."
      - "Если цель - определить только легче/тяжелее без поиска объекта, держать как кандидат, а не как ядро."
    core_problem_ids:
      - counterfeit-12-coins-3-weighings
      - ternary-signature-code-heavy-or-light
      - thirteen-coins-known-genuine-three-weighings
      - komal-2010-a512-nonadaptive-counterfeit-code
      - ukmt-open-ended-2013-task-four-42-counterfeit-coins
    problem_ids:
      - counterfeit-12-coins-3-weighings
      - ternary-signature-code-heavy-or-light
      - thirteen-coins-known-genuine-three-weighings
      - komal-2010-a512-nonadaptive-counterfeit-code
      - ukmt-open-ended-2013-task-four-42-counterfeit-coins
      - kvant-2003-04-four-coins-standard-two-weighings
      - nrich-nine-weights-two-three-weighings
      - problems-ru-32820-sign-only-two-weighings
      - kvantik-2013-fake-coin-direction-101
    candidate_rules:
      tags_all_or_near: [balance_scale, ternary_code]
      profile_hints:
        - "counterfeit_type содержит heavier_or_lighter/unknown_direction/unknown_sign"
        - "objective содержит identify_coin_and_sign или determine_whether_counterfeit_is_heavier_or_lighter"
    local_facets:
      - weighing_count
      - adaptive
      - known_genuine_available
      - signature_balance_required
      - objective
      - state_multiplier
      - impossible_or_capacity_bound
    notes_ru: "Кластер соединяет классическую задачу о 12 монетах с заранее составленными таблицами взвешиваний; внутри полезно различать дерево решений и фиксированную таблицу кодов."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: numeric-linear-signatures
    title_ru: "Числа и суммы, которые выдают ответ"
    description_ru: "Один или несколько числовых результатов заранее устроены так, что итоговая сумма, разность, медиана или выбранные коэффициенты показывают, какой скрытый случай произошел."
    inclusion_criteria_ru:
      - "Наблюдение имеет числовое значение или интерпретируется как линейная статистика."
      - "Коэффициенты, номиналы или выбранные группы заранее создают разные отклонения для разных скрытых состояний."
      - "Декодирование идет по числу или набору чисел, а не по веткам обычного дерева решений."
    exclusion_criteria_ru:
      - "Обычные чашечные весы без числового декодирования не входят."
      - "Четность или остаток по модулю как маленький набор ответов относятся к binary-parity-and-modular-codes, если линейная величина не является основной."
      - "Если порядок предметов передает сообщение, см. permutation-order-channels."
    core_problem_ids:
      - counterfeit-stack-one-weighing
      - tournament-towns-2005-six-coins-pointer-scale
      - poland-omg-2005-five-coins-48g-three-digital-weighings
      - matprazdnik-2024-six-boxes-one-sum
      - problems-ru-78572-eleven-bags-two-numeric-balance-weighings
    problem_ids:
      - counterfeit-stack-one-weighing
      - tournament-towns-2005-six-coins-pointer-scale
      - poland-omg-2005-five-coins-48g-three-digital-weighings
      - matprazdnik-2024-six-boxes-one-sum
      - problems-ru-78572-eleven-bags-two-numeric-balance-weighings
      - problems-ru-65817-six-coins-digital-scale-unknown-weights
      - problems-ru-88304-denomination-coins
      - matprazdnik-2023-seven-bags-two-weighings
      - kvantik-2021-three-by-three-fake-line-one-weighing
      - kvantik-2013-four-magic-balls-three-tests
      - mmo-2019-wise-men-seven-numbers-median
      - nrich-balance-power-balanced-ternary
      - kvantik-2016-divisibility-knights-liars
      - tournament-towns-2008-four-stones-one-error
    candidate_rules:
      tags_any: [linear_signature, digital_scale, weighted_sum_encoding]
      profile_hints:
        - "outcome_count_per_weighing numeric/numeric_weight/numeric_difference"
        - "ideas содержат weight/ratio/code/coefficient/sum"
    local_facets:
      - observation_dimension
      - coefficient_system
      - numeric_alphabet
      - delta_known
      - sign_known
      - adaptive
      - decoding_rule
      - privacy_goal
    notes_ru: "Здесь есть два подтипа: цифровые весы/массы и более абстрактные числовые сообщения. Оба лучше искать вместе, потому что прием один и тот же."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: faulty-or-reduced-observation-channels
    title_ru: "Сломанные весы и неполные ответы"
    description_ru: "Задачи, где трудность не в обычном счете вариантов, а в ненадежном приборе, потерянном исходе, сломанных весах или наблюдателе, который может исказить результат."
    inclusion_criteria_ru:
      - "Есть явная поломка способа наблюдения: сломанные весы, ненадежное равновесие, ложный тестер, испорченный прибор."
      - "Стратегия должна либо обнаружить дефект, либо быть устойчивой к нему."
      - "Нижняя оценка часто строится через неразличимость или потерю полезного первого теста."
    exclusion_criteria_ru:
      - "Систематические лжецы как персонажи сами по себе не входят; см. кластеры про рыцарей и лжецов."
      - "Обычные ошибки в да/нет ответах с хэмминговой упаковкой относятся к hamming-and-lie-resilient-codes."
      - "Просто неизвестно, легче фальшивка или тяжелее, не считается поломкой наблюдения."
    core_problem_ids:
      - lktg-2008-broken-balances-ternary-lower-bound
      - lktg-2008-three-balances-one-broken-nine-coins
      - kvant-2003-01-three-scales-two-weighings
      - kvant-2019-m2565-one-broken-scale
      - problems-ru-35224-noisy-balance-four-coins
    problem_ids:
      - lktg-2008-broken-balances-ternary-lower-bound
      - lktg-2008-three-balances-one-broken-nine-coins
      - kvant-2003-01-three-scales-two-weighings
      - kvant-2019-m2565-one-broken-scale
      - problems-ru-35224-noisy-balance-four-coins
      - kvantik-2016-baron-table-fake-verification
    candidate_rules:
      title_or_id_contains_any: [broken, noisy, faulty, unreliable, сломан, неисправ]
      tags_any: [indistinguishability_argument]
      profile_hints:
        - "counterfeit_type содержит faulty_instrument/one_faulty_scale"
        - "outcome_count_per_weighing уменьшен относительно нормальной модели"
    local_facets:
      - fault_model
      - faulty_actor_or_instrument
      - outcome_reliability
      - adversarial_or_stochastic
      - detectable_fault
      - robust_strategy
      - lower_bound_method
    notes_ru: "Не смешивать с обычными задачами про рыцарей и лжецов: здесь 'ложь' является свойством измерения, а не типом персонажа."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: structural-weighing-constraints
    title_ru: "Монеты стоят в ряд, круг или группы"
    description_ru: "Взвешивания, где важно не только сколько ответов дают весы, но и как устроены монеты: соседние фальшивки, круг, ряд, поворот, лимит участий, группы или поиск заведомо настоящих монет."
    inclusion_criteria_ru:
      - "Скрытые состояния имеют геометрическую, групповую или локальную структуру."
      - "Ограничение существенно меняет стратегию по сравнению с независимыми кандидатами."
      - "Решение использует окна, блоки, симметрию, ряды, круги, парные копии или ограничения участия."
    exclusion_criteria_ru:
      - "Если структура только задает количество монет, а решение является чистым поиском по трем исходам взвешивания, см. known-direction-ternary-search."
      - "Если структура нужна только для числового кода, см. numeric-linear-signatures."
      - "Если задача является чистой вероятностью после одного результата, оставить вне ядра до отдельного probability-кластера."
    core_problem_ids:
      - kvant-2002-05-eight-circle-three-heavy
      - mmo-2006-nine-circle-coins-four-fakes
      - yumt-2014-sensitive-scales-17-coins
      - problems-ru-107826-light-coin-limited-two-uses
      - mmo-2026-row-of-12-fakes-110-genuine
    problem_ids:
      - kvant-2002-05-eight-circle-three-heavy
      - mmo-2006-nine-circle-coins-four-fakes
      - yumt-2014-sensitive-scales-17-coins
      - problems-ru-107826-light-coin-limited-two-uses
      - mmo-2026-row-of-12-fakes-110-genuine
      - problems-ru-65055-paid-weighings-genuine-coin
      - mmo-2022-two-traders-six-coins-four-weighings
      - matprazdnik-2025-eighteen-coins-rotated-tray
      - savin-12-six-coins-two-fakes-two-weighings
      - problems-ru-64498-five-coins-two-opposite-fakes
    candidate_rules:
      tags_any: [structural_constraint, symmetry_breaking, symmetry]
      fragment: weighings
      profile_hints:
        - "counterfeit_count > 1 или object_count задан формулой/структурой"
        - "counterfeit_type содержит adjacent/consecutive/row/circle/group/limited"
    local_facets:
      - topology
      - counterfeit_pattern
      - participation_limit
      - object_grouping
      - symmetry_breaking
      - certification_goal
      - adaptive
    notes_ru: "Это рабочий контейнер для весовых задач, которые плохо ложатся в чистые code/search-кластеры. Его стоит дробить, когда появится больше карточек каждого подтипа."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: truth-liar-normalization
    title_ru: "Как спросить рыцаря или лжеца"
    description_ru: "Вопрос устроен так, что рыцарь и лжец дают одинаково полезный ответ для решателя: ложь заранее обезврежена или сразу понятна."
    inclusion_criteria_ru:
      - "Есть рыцарь, лжец или похожий тип отвечающего с постоянным правилом."
      - "Ключевой прием - задать вопрос о вопросе, о чужом ответе, о собственном типе или о сертифицированном объекте."
      - "После правильного вопроса ответ можно использовать как надежный бит или ветвь дерева."
    exclusion_criteria_ru:
      - "Если решение просто перебирает совместимые истинности публичных фраз, см. local-truth-constraints или truth-count-fixed-points."
      - "Если ложь является ошибкой в коде ответов, см. hamming-and-lie-resilient-codes."
      - "Если вопрос не устраняет ложь, а только выявляет один совместимый сценарий, не включать в ядро."
    core_problem_ids:
      - truth-liar-universal-yes-no
      - two-doors-two-guards-one-question
      - boolos-hardest-logic-puzzle
      - amc-2010-12a-p12-frogs-toads-truth-lie
      - utyum-1993-logos-road-one-question
    problem_ids:
