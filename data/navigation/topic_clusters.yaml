schema_version: 1
status: draft_v1
updated: "2026-05-18"
notes_ru:
  - "Кластеры являются навигационным слоем поверх карточек, тегов и relations, а не новым фрагментом или обязательной классификацией каждой задачи."
  - "Принадлежность кластерам в этой версии указана явно и может быть неполной. Задача может оставаться вне кластеров, если механизм пока не выделен достаточно надежно."
  - "Кластеры не обязаны быть строго непересекающимися: при генерации счетчиков следует считать уникальные problem_id."
  - "Более детальные локальные признаки, если они есть, лежат в data/navigation/cluster_facets/ и считаются вспомогательным слоем для проверки."
