schema_version: 1
status: draft_v1
updated: "2026-05-18"
notes_ru:
  - "Кластеры являются навигационным слоем поверх карточек, тегов и relations, а не новым фрагментом или обязательной классификацией каждой задачи."
  - "Membership в этой версии явный и может быть неполным. Задача может оставаться вне кластеров, если механизм пока не выделен достаточно надежно."
  - "Кластеры не обязаны быть строго непересекающимися: при генерации счетчиков следует считать уникальные problem_id."
  - "Более детальные локальные фасеты, если они есть, лежат в data/navigation/cluster_facets/ и считаются вспомогательным review-слоем."
clusters:
  - id: known-direction-ternary-search
    title_ru: "Тернарный поиск при известном направлении фальшивки"
    description_ru: "Задачи, где каждый ход дает три исхода и стратегия последовательно делит кандидатов на три почти равные части; знак отклонения известен или не является частью скрытого состояния."
    inclusion_criteria_ru:
      - "Есть один скрытый объект или позиция из N кандидатов."
      - "Наблюдение за ход имеет три содержательных исхода, обычно левее/равно/правее или один из трех ответов."
      - "Цель - найти объект, а не построить заранее фиксированный код для неизвестного знака."
      - "Нижняя оценка обычно имеет вид N <= 3^q или leaf-count для трехисходного дерева."
    exclusion_criteria_ru:
      - "Если нужно одновременно определить, легче или тяжелее монета, см. heavy-or-light-ternary-signatures."
      - "Если тесты фиксируются заранее как таблица подписей, см. heavy-or-light-ternary-signatures или numeric-linear-signatures."
      - "Если ключевой ход - двоичное деление пополам, это не этот кластер."
    core_problem_ids:
      - heavier-9-coins-2-weighings
      - lighter-25-coins-3-weighings
      - problems-ru-34945-27-light-coins
      - kvant-2013-one-light-coin-information-bound
      - sasmo-2020-g9-q10-2019-light-coin
    problem_ids:
      - heavier-9-coins-2-weighings
      - lighter-25-coins-3-weighings
      - problems-ru-34945-27-light-coins
      - kvant-2013-one-light-coin-information-bound
      - sasmo-2020-g9-q10-2019-light-coin
      - nrich-spot-the-fake-two-weighings
      - one-counterfeit-among-27-three-ternary-questions
    candidate_rules:
      tags_any: [ternary_search]
      profile_hints:
        - "weighing_profile.counterfeit_count == 1"
        - "weighing_profile.counterfeit_type содержит known/heavier_known/lighter_known"
        - "outcome_count_per_weighing == 3"
      reject_if_tags_any: [nonadaptive_strategy, weighted_sum_encoding]
    local_facets:
      - weighing_count
      - outcome_alphabet
      - hidden_state_count
      - known_direction
      - adaptive
      - lower_bound_tight
      - balanced_split
    notes_ru: "Это наиболее чистый учебный кластер для объяснения емкости трехисходного дерева. Не стоит расширять его на любую задачу с чашечными весами."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: heavy-or-light-ternary-signatures
    title_ru: "Тернарные подписи для неизвестного знака"
    description_ru: "Фальшивая монета может быть легче или тяжелее; стратегия должна различить пару состояний 'монета, знак' через тернарные слова или дерево исходов."
    inclusion_criteria_ru:
      - "Скрытое состояние включает идентичность объекта и знак отклонения."
      - "Противоположные знаки дают противоположные тернарные подписи или симметричные ветви дерева."
      - "Важны не только три исхода, но и удвоение пространства состояний из-за неизвестного знака."
    exclusion_criteria_ru:
      - "Если знак известен, см. known-direction-ternary-search."
      - "Если числовое показание само является декодируемой суммой, см. numeric-linear-signatures."
      - "Если цель - определить только знак без идентификации объекта, держать как кандидат, а не как ядро."
    core_problem_ids:
      - counterfeit-12-coins-3-weighings
      - ternary-signature-code-heavy-or-light
      - thirteen-coins-known-genuine-three-weighings
      - komal-2010-a512-nonadaptive-counterfeit-code
      - ukmt-open-ended-2013-task-four-42-counterfeit-coins
    problem_ids:
      - counterfeit-12-coins-3-weighings
      - ternary-signature-code-heavy-or-light
      - thirteen-coins-known-genuine-three-weighings
      - komal-2010-a512-nonadaptive-counterfeit-code
      - ukmt-open-ended-2013-task-four-42-counterfeit-coins
      - kvant-2003-04-four-coins-standard-two-weighings
      - nrich-nine-weights-two-three-weighings
      - problems-ru-32820-sign-only-two-weighings
      - kvantik-2013-fake-coin-direction-101
    candidate_rules:
      tags_all_or_near: [balance_scale, ternary_code]
      profile_hints:
        - "counterfeit_type содержит heavier_or_lighter/unknown_direction/unknown_sign"
        - "objective содержит identify_coin_and_sign или determine_whether_counterfeit_is_heavier_or_lighter"
    local_facets:
      - weighing_count
      - adaptive
      - known_genuine_available
      - signature_balance_required
      - objective
      - state_multiplier
      - impossible_or_capacity_bound
    notes_ru: "Кластер соединяет классическую задачу о 12 монетах с неадаптивными сигнатурными таблицами; внутри полезно различать adaptive tree и fixed signature table."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: numeric-linear-signatures
    title_ru: "Числовые и линейные подписи"
    description_ru: "Один или несколько числовых результатов устроены как линейная подпись скрытого источника: сумма, взвешенная сумма, разность, медиана или выбранный коэффициент декодируют состояние."
    inclusion_criteria_ru:
      - "Наблюдение имеет числовое значение или интерпретируется как линейная статистика."
      - "Коэффициенты, номиналы или выбранные группы заранее создают разные отклонения для разных скрытых состояний."
      - "Декодирование идет по числу/вектору чисел, а не по веткам обычного дерева решений."
    exclusion_criteria_ru:
      - "Обычные чашечные весы без числового декодирования не входят."
      - "Паритет или модульная сумма как маленький алфавит относятся к binary-parity-and-modular-codes, если линейная величина не является основной."
      - "Если порядок объектов является каналом, см. permutation-order-channels."
    core_problem_ids:
      - counterfeit-stack-one-weighing
      - tournament-towns-2005-six-coins-pointer-scale
      - poland-omg-2005-five-coins-48g-three-digital-weighings
      - matprazdnik-2024-six-boxes-one-sum
      - problems-ru-78572-eleven-bags-two-numeric-balance-weighings
    problem_ids:
      - counterfeit-stack-one-weighing
      - tournament-towns-2005-six-coins-pointer-scale
      - poland-omg-2005-five-coins-48g-three-digital-weighings
      - matprazdnik-2024-six-boxes-one-sum
      - problems-ru-78572-eleven-bags-two-numeric-balance-weighings
      - problems-ru-65817-six-coins-digital-scale-unknown-weights
      - problems-ru-88304-denomination-coins
      - matprazdnik-2023-seven-bags-two-weighings
      - kvantik-2021-three-by-three-fake-line-one-weighing
      - kvantik-2013-four-magic-balls-three-tests
      - mmo-2019-wise-men-seven-numbers-median
      - nrich-balance-power-balanced-ternary
      - kvantik-2016-divisibility-knights-liars
    candidate_rules:
      tags_any: [linear_signature, digital_scale, weighted_sum_encoding]
      profile_hints:
        - "outcome_count_per_weighing numeric/numeric_weight/numeric_difference"
        - "ideas содержат weight/ratio/signature/coefficient/sum"
    local_facets:
      - observation_dimension
      - coefficient_system
      - numeric_alphabet
      - delta_known
      - sign_known
      - adaptive
      - decoding_rule
      - privacy_goal
    notes_ru: "Здесь есть два подтипа: цифровые весы/массы и более абстрактные линейные сообщения. Оба лучше искать вместе, потому что прием один и тот же."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: faulty-or-reduced-observation-channels
    title_ru: "Неисправные, шумные и урезанные каналы наблюдения"
    description_ru: "Задачи, где трудность создается не обычной емкостью тестов, а ненадежным прибором, потерянным исходом, сломанными весами или наблюдателем, который может искажать сигнал."
    inclusion_criteria_ru:
      - "Есть явный дефект канала: сломанные весы, ненадежное равновесие, ложный тестер, испорченный прибор."
      - "Стратегия должна либо обнаружить дефект, либо быть устойчивой к нему."
      - "Нижняя оценка часто строится через неразличимость или потерю полезного первого теста."
    exclusion_criteria_ru:
      - "Систематические лжецы как логические агенты сами по себе не входят; см. truth-liar-*."
      - "Обычные ошибки в да/нет ответах с хэмминговой упаковкой относятся к hamming-and-lie-resilient-codes."
      - "Просто неизвестный знак фальшивки не считается дефектом канала."
    core_problem_ids:
      - lktg-2008-broken-balances-ternary-lower-bound
      - lktg-2008-three-balances-one-broken-nine-coins
      - kvant-2003-01-three-scales-two-weighings
      - kvant-2019-m2565-one-broken-scale
      - problems-ru-35224-noisy-balance-four-coins
    problem_ids:
      - lktg-2008-broken-balances-ternary-lower-bound
      - lktg-2008-three-balances-one-broken-nine-coins
      - kvant-2003-01-three-scales-two-weighings
      - kvant-2019-m2565-one-broken-scale
      - problems-ru-35224-noisy-balance-four-coins
      - kvantik-2016-baron-table-fake-verification
    candidate_rules:
      title_or_id_contains_any: [broken, noisy, faulty, unreliable, сломан, неисправ]
      tags_any: [indistinguishability_argument]
      profile_hints:
        - "counterfeit_type содержит faulty_instrument/one_faulty_scale"
        - "outcome_count_per_weighing уменьшен относительно нормальной модели"
    local_facets:
      - fault_model
      - faulty_actor_or_instrument
      - outcome_reliability
      - adversarial_or_stochastic
      - detectable_fault
      - robust_strategy
      - lower_bound_method
    notes_ru: "Не смешивать с обычными задачами про лжецов: здесь 'ложь' является свойством канала измерения, а не типом персонажа."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: structural-weighing-constraints
    title_ru: "Структурные ограничения во взвешиваниях"
    description_ru: "Взвешивания, где главное не емкость алфавита, а геометрия/структура скрытого множества: соседние фальшивки, круг, ряд, поворот, лимит участий, группы или обязанность сертифицировать настоящие монеты."
    inclusion_criteria_ru:
      - "Скрытые состояния имеют геометрическую, групповую или локальную структуру."
      - "Ограничение существенно меняет стратегию по сравнению с независимыми кандидатами."
      - "Решение использует окна, блоки, симметрию, ряды, круги, парные копии или ограничения участия."
    exclusion_criteria_ru:
      - "Если структура только задает количество монет, а решение является чистым тернарным поиском, см. known-direction-ternary-search."
      - "Если структура нужна только для линейной подписи, см. numeric-linear-signatures."
      - "Если задача является чистой вероятностью после одного результата, оставить вне ядра до отдельного probability-кластера."
    core_problem_ids:
      - kvant-2002-05-eight-circle-three-heavy
      - mmo-2006-nine-circle-coins-four-fakes
      - yumt-2014-sensitive-scales-17-coins
      - problems-ru-107826-light-coin-limited-two-uses
      - mmo-2026-row-of-12-fakes-110-genuine
    problem_ids:
      - kvant-2002-05-eight-circle-three-heavy
      - mmo-2006-nine-circle-coins-four-fakes
      - yumt-2014-sensitive-scales-17-coins
      - problems-ru-107826-light-coin-limited-two-uses
      - mmo-2026-row-of-12-fakes-110-genuine
      - problems-ru-65055-paid-weighings-genuine-coin
      - mmo-2022-two-traders-six-coins-four-weighings
      - matprazdnik-2025-eighteen-coins-rotated-tray
      - savin-12-six-coins-two-fakes-two-weighings
      - problems-ru-64498-five-coins-two-opposite-fakes
    candidate_rules:
      tags_any: [structural_constraint, symmetry_breaking, symmetry]
      fragment: weighings
      profile_hints:
        - "counterfeit_count > 1 или object_count задан формулой/структурой"
        - "counterfeit_type содержит adjacent/consecutive/row/circle/group/limited"
    local_facets:
      - topology
      - counterfeit_pattern
      - participation_limit
      - object_grouping
      - symmetry_breaking
      - certification_goal
      - adaptive
    notes_ru: "Это рабочий контейнер для весовых задач, которые плохо ложатся в чистые code/search-кластеры. Его стоит дробить, когда появится больше карточек каждого подтипа."
    facet_file: data/navigation/cluster_facets/weighings.yaml

  - id: truth-liar-normalization
    title_ru: "Нормализация ответов правдивца и лжеца"
    description_ru: "Вопрос или протокол устроен так, что предсказуемая ложь превращается в тот же полезный сигнал, который дал бы правдивец, либо явно нейтрализуется."
    inclusion_criteria_ru:
      - "Есть систематический правдивец/лжец или аналогичный тип отвечающего."
      - "Ключевой прием - задать вопрос о вопросе, о чужом ответе, о собственном типе или о сертифицированном объекте."
      - "После нормализации ответ можно использовать как надежный бит/ветвь дерева."
    exclusion_criteria_ru:
      - "Если решение просто перебирает совместимые истинности публичных фраз, см. local-truth-constraints или truth-count-fixed-points."
      - "Если ложь является ошибкой канала в коде, см. hamming-and-lie-resilient-codes."
      - "Если вопрос не устраняет ложь, а только выявляет один совместимый сценарий, не включать в ядро."
    core_problem_ids:
      - truth-liar-universal-yes-no
      - two-doors-two-guards-one-question
      - boolos-hardest-logic-puzzle
      - amc-2010-12a-p12-frogs-toads-truth-lie
      - utyum-1993-logos-road-one-question
    problem_ids:
      - truth-liar-universal-yes-no
      - two-doors-two-guards-one-question
      - boolos-hardest-logic-puzzle
      - amc-2010-12a-p12-frogs-toads-truth-lie
      - utyum-1993-logos-road-one-question
      - wajo-2015-knaves-unheard-answer
      - estonian-1995-96-round2-fire-streets-truth-lie-alternate
      - komal-2023-k749-aladdin-abu-lying-coin
      - sms-medley-1997-governor-liars-min-days
      - matprazdnik-2025-yog-bulldog-rhino-truth-liar
    candidate_rules:
      tags_any: [truth_liar_normalization, self_reference_question, guard_paradox]
      profile_hints:
        - "questions_profile.question_count > 0"
        - "lies_allowed содержит systematic liar/respondent type"
    local_facets:
      - respondent_types
      - question_count
      - adaptive
      - self_reference
      - language_unknown
      - normalized_signal
      - objective
    notes_ru: "Тег truth_liar_normalization шире ядра. В кластер стоит включать только те задачи, где нормализация является главным механизмом, а не побочной формулировкой."
    facet_file: data/navigation/cluster_facets/truth_liar_systems.yaml

  - id: truth-count-fixed-points
    title_ru: "Самосогласованный счет правдивцев и лжецов"
    description_ru: "Сценарии, где число правдивых/лжецов или истинных высказываний само определяет, какие высказывания истинны, и решение ищет фиксированную точку этого счета."
    inclusion_criteria_ru:
      - "Фразы утверждают число правдивых, лжецов, истинных фраз или близкую агрегированную величину."
      - "Решение предполагает счет и проверяет, сколько утверждений при нем истинны."
      - "Возможны хитрецы/чередующие типы, если центральный шаг остается счетной самосогласованностью."
    exclusion_criteria_ru:
      - "Локальные утверждения о соседях, цепях или окнах без глобального счетного fixed point относятся к local-truth-constraints."
      - "Один вопрос, нормализующий ложь, относится к truth-liar-normalization."
      - "Самоссылочные карточки без персонажей могут быть кандидатами, но не ядром."
    core_problem_ids:
      - wajo-2015-knaves-three-counts
      - ukmt-imc-2019-q14-truth-tellers-count
      - mathcounts-2020-state-island-census-truth-liars
      - sasmo-2019-g9-q12-number-clues-truth-tellers
      - kvant-2022-09-island-honest-liars-tricksters
    problem_ids:
      - wajo-2015-knaves-three-counts
      - ukmt-imc-2019-q14-truth-tellers-count
      - mathcounts-2020-state-island-census-truth-liars
      - sasmo-2019-g9-q12-number-clues-truth-tellers
      - kvant-2022-09-island-honest-liars-tricksters
      - kvant-2000-duma-knights-liars-removal
      - nrich-knights-and-knaves-queue
      - estonian-2003-04-liarians-2004-days
      - yumt-2014-false-statements-cards
      - kvantik-2016-window-two-truths
    candidate_rules:
      title_or_objective_contains_any: [count, number_of_truth, number_of_liars, true_statements]
      tags_any: [lie_detection, self_reference_truth]
      profile_hints:
        - "objective содержит count/maximize/determine_number"
    local_facets:
      - counted_quantity
      - speaker_types
      - statement_form
      - fixed_point_domain
      - uniqueness
      - extremal_or_exact
      - self_reference_depth
    notes_ru: "Этот кластер нужен, потому что общий lie_detection смешивает fixed-point счет с локальными графовыми ограничениями и обычным перебором."
    facet_file: data/navigation/cluster_facets/truth_liar_systems.yaml

  - id: local-truth-constraints
    title_ru: "Локальные ограничения истинности"
    description_ru: "Рыцари/лжецы и похожие системы, где каждое высказывание накладывает локальное ограничение на соседей, цепь, круг, окно, день недели, таблицу или малую группу."
    inclusion_criteria_ru:
      - "Истинность фразы зависит от локального окружения, соседнего элемента, предыдущей фразы, дня, позиции или небольшой группы."
      - "Решение агрегирует локальные запреты или строит совместимую конфигурацию."
      - "Глобальный счет может присутствовать, но не является основным fixed point."
    exclusion_criteria_ru:
      - "Если основной механизм - самосогласованный счет всех правдивцев, см. truth-count-fixed-points."
      - "Если основной механизм - один нормализующий вопрос, см. truth-liar-normalization."
      - "Если нет локальной структуры, оставлять в общем lie_detection вне кластеров."
    core_problem_ids:
      - amc-au-2016-intermediate-q17-truth-liars-circle
      - problems-ru-66436-sixty-knights-next-five
      - kvantik-2016-round-table-right-liar-count
      - ukmt-jmc-2015-q17-knaves-truth-chain
      - utyum-2010-vasya-two-liars-line
    problem_ids:
      - amc-au-2016-intermediate-q17-truth-liars-circle
      - problems-ru-66436-sixty-knights-next-five
