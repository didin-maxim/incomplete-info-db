id: prearranged_protocols
title: "Prearranged protocols under limited communication"
reviewed_on: "2026-05-18"
member_count: 10
description: >
  Problems where cooperating agents can agree on a rule, codebook, or role
  assignment before the trial, and after the trial starts they must act through
  a restricted channel, silence, public statements, or private observations.
scope:
  include:
    - "multiple cooperating roles using a shared pre-trial rule"
    - "magician-assistant and sender-receiver pairs when the code is the point"
    - "public protocols with no secret code if the public rule is designed"
    - "no-communication team strategies chosen before the trial"
  exclude:
    - "ordinary adaptive search by one solver"
    - "common-knowledge puzzles where agents only announce true knowledge states"
    - "single-controller code design without cooperating roles"
    - "public processes whose speakers are not following an agreed strategy"
reviewed_areas:
  - communication
  - card_tricks
  - wise_people
  - prisoners
  - hats
  - cards
  - public_communication
  - permutation_channels
  - parity_and_modular_codes
local_facets:
  participants:
    values:
      - magician_assistant_pair
      - prisoner_team
      - hat_team
      - sender_receiver_pair
      - public_card_players
      - robust_wise_people_line
  prearrangement_type:
    values:
      - shared_codebook
      - role_assignment
      - deterministic_team_protocol
      - probabilistic_team_strategy
      - public_protocol_no_secret_code
      - robust_protocol_with_corrupt_agents
  communication_channel:
    values:
      - silence
      - no_post_start_communication
      - public_statement
      - order_permutation
      - single_bit
      - persistent_single_bit
      - parity
      - xor_checksum
      - modular_sum
      - private_observation
      - pass_or_guess
      - numeric_side_channel
  privacy_constraint:
    values:
      - none
      - hidden_from_receiver
      - no_direct_communication
      - observer_privacy
      - no_wrong_guess
      - corrupted_speakers
  success_goal:
    values:
      - communicate_hidden_card
      - communicate_hidden_message
      - communicate_hidden_square
      - certify_all_visited
      - maximize_correct_hats
      - team_survival
      - mutual_identification_with_privacy
      - win_without_wrong_guess
  simultaneous_or_sequential:
    values:
      - one_message
      - sequential_public
      - asynchronous_repeated
      - independent_sequential
      - simultaneous
      - two_round_public
  guarantee_type:
    values:
      - deterministic
      - deterministic_all_but_one
      - deterministic_eventual
      - probabilistic
      - probabilistic_no_wrong_guess
      - deterministic_with_privacy
      - deterministic_except_corrupted_and_one
  code_family:
    values:
      - permutation_offset_code
      - factorial_order_code
      - parity_accumulator
      - modular_sum_code
      - xor_checksum_code
      - persistent_bit_counter
      - permutation_cycle_following
      - hamming_covering_code
      - modular_privacy_code
      - robust_oracle_code
