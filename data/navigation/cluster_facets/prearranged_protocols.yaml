id: prearranged_protocols
title: "Команда заранее договорилась о подсказке"
reviewed_on: "2026-05-18"
member_count: 15
description: >
  Задачи, где участники заранее договариваются о правиле или ролях, а после
  начала испытания могут передать совсем мало: промолчать, сказать фразу вслух,
  показать порядок предметов, сделать один ход или использовать личное наблюдение.
scope:
  include:
    - "несколько сотрудничающих ролей используют общее правило, выбранное до испытания"
    - "пары фокусник-помощник и отправитель-получатель, если главное в задаче - заранее согласованная подсказка"
    - "публичные правила без тайного шифра, если они специально придуманы заранее"
    - "командные стратегии без общения после начала испытания"
  exclude:
    - "обычный адаптивный поиск одним решателем"
    - "задачи на общее знание, где участники только объявляют истинные состояния своего знания"
    - "проектирование подсказки одним управляющим без сотрудничающих ролей"
    - "публичные процессы, где говорящие не следуют заранее согласованной стратегии"
reviewed_areas:
  - communication
  - card_tricks
  - wise_people
  - prisoners
  - hats
  - cards
  - public_communication
  - permutation_channels
  - parity_and_modular_codes
local_facets:
  participants:
    values:
      - magician_assistant_pair
      - prisoner_team
      - hat_team
      - sender_receiver_pair
      - public_card_players
      - robust_wise_people_line
  prearrangement_type:
    values:
      - shared_codebook
      - role_assignment
      - deterministic_team_protocol
      - probabilistic_team_strategy
      - public_protocol_no_secret_code
      - robust_protocol_with_corrupt_agents
  communication_channel:
    values:
      - silence
      - no_post_start_communication
      - public_statement
      - order_permutation
      - single_bit
      - persistent_single_bit
      - parity
      - xor_checksum
      - modular_sum
      - private_observation
      - pass_or_guess
      - numeric_side_channel
  privacy_constraint:
    values:
      - none
      - hidden_from_receiver
      - no_direct_communication
      - observer_privacy
      - no_wrong_guess
      - corrupted_speakers
  success_goal:
    values:
      - communicate_hidden_card
      - communicate_hidden_message
      - communicate_hidden_square
      - certify_all_visited
      - maximize_correct_hats
      - team_survival
      - mutual_identification_with_privacy
      - win_without_wrong_guess
  simultaneous_or_sequential:
    values:
      - one_message
      - sequential_public
      - asynchronous_repeated
      - independent_sequential
      - simultaneous
      - two_round_public
  guarantee_type:
    values:
      - deterministic
      - deterministic_all_but_one
      - deterministic_eventual
      - probabilistic
      - probabilistic_no_wrong_guess
      - deterministic_with_privacy
      - deterministic_except_corrupted_and_one
  code_family:
    values:
      - permutation_offset_code
      - factorial_order_code
      - parity_accumulator
      - modular_sum_code
      - xor_checksum_code
      - persistent_bit_counter
      - permutation_cycle_following
      - hamming_covering_code
      - modular_privacy_code
      - permutation_parity_split
      - balanced_pair_choice
      - robust_oracle_code
