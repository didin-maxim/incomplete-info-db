review_date: "2026-05-18"
scope: "публичное знание / публичное незнание и вопросы с ложью / запас против ошибок"
decision:
  split_into_two_clusters: true
  rationale: >
    Задачи на публичное знание описывают обновление состояния знания после
    публичных фраз, молчания или ответов «я не знаю». Задачи на ложь и ошибки
    описывают ответы с шумом и требуют запаса между ответами, повторений,
    упаковки, покрытия или устойчивости к стираниям. Пересечение в основном
    словарное: в обоих случаях есть сообщения, но инварианты и полезные
    признаки разные.

