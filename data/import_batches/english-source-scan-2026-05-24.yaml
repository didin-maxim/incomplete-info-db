  "source_notes": [
    "MathCircles/MfA Utah, Mathematical Magic for Muggles: богатый листок с условиями и решениями. Добавлены Fingers That Can See и Concentration; Mind-Reader распознан как дубль Fitch Cheney и добавлен источником к существующей карточке; More Hats распознан как дубль линейного протокола с колпаками; Buried in the Sand не добавлялся как слишком классический короткий дубль ожидания/молчания.",
    "Tanya Khovanova's Math Blog, category Weighings: крупный блоговый архив с 34 постами категории Weighings и 446 постами категории Puzzles. Добавлена свежая задача Gold, Silver, and Bronze Coins, потому что у нее есть условие, атрибуция и подробное обсуждение решения в комментариях. Alternator/chameleon/random-scale posts оставлены на отдельный проход: они богаты, но требуют сверки с уже покрытыми материалами Кнопа и LKTG.",
    "UKMT competition papers and extended solutions: источник крупный и официальный, но ближайшие найденные truth/liar задачи в основном уже покрыты текущими UKMT/AMC карточками или являются короткими арифметическими вариациями. Новых карточек из UKMT в этом проходе не добавлялось.",
    "AoPS Wiki KGS math club: источник большой и тематически богатый, но неоднородный по качеству. Обнаружены 100 prisoners boxes и infinite hats/dwarfs; первая задача уже есть как классическая, вторая требует отдельного аккуратного анализа бесконечного протокола.",
    "MAA review of The Mathematics of Coordinated Inference: полезная карта темы coordinated inference/hat guessing, но не отдельный задачник с самостоятельными условиями и решениями. Использовать как библиографический ориентир, не как источник карточки без первичного текста задачи."
  ],
