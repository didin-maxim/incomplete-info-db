  "statements": {"original": [{"id": "stmt-original", "title": "Да, нет или не знаю", "text": "Перед Андреем и Сережей на столе лежат три перевернутые карточки, под одной из которых написано «1», под второй «2» и под третьей «3». Андрей их перемешал и вытащил одну из них, но какую - Сереже не сказал. Сережа может задать ему только один вопрос, на который тот, подумав, должен честно ответить «Да», «Нет» или «Не знаю», после чего Сережа должен наверняка отгадать число, которое вытащил Андрей. Как ему это сделать?", "source_ids": ["src-kvantik-math-contest-2013"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-use-unknown-as-third-symbol", "title": "Ответ «не знаю» становится третьим информационным символом", "text": "Нужно спросить о событии, которое при одной карточке точно истинно, при другой точно ложно, а при третьей зависит от случайного выбора из двух оставшихся карточек.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-random-remaining-card-question", "title": "Спросить про случайно открытую оставшуюся карточку", "text": "Сережа спрашивает: «Если я наугад открою одну из двух оставшихся на столе карточек, будет ли на ней число меньше твоего?»\n\nЕсли Андрей вытащил 1, обе оставшиеся карточки больше, поэтому честный ответ - «Нет». Если он вытащил 3, обе оставшиеся карточки меньше, поэтому ответ - «Да». Если он вытащил 2, среди оставшихся карточек есть 1 и 3, так что ответ зависит от того, какая из них будет открыта; Андрей должен ответить «Не знаю».", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
