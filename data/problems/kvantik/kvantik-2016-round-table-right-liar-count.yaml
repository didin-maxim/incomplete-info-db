  "statements": {"original": [{"id": "stmt-original", "title": "Десять рыцарей и лжецов за кругом", "text": "За круглым столом сидят десять человек: рыцари и лжецы, и те, и другие присутствуют. Рыцари всегда говорят правду, а лжецы всегда лгут. Каждого спросили, кто сидит справа от него - рыцарь или лжец. Могло ли число ответов «справа от меня сидит лжец» равняться а) двум; б) одному?", "source_ids": ["src-kvantik-math-contest-2016"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["truth_teller", "liar"]}]},
  "ideas": [{"id": "idea-yes-means-type-change", "title": "Ответ «справа лжец» отмечает смену типа", "text": "Рыцарь говорит такой ответ ровно перед лжецом, а лжец - ровно перед рыцарем, потому что ложный ответ на вопрос о правом соседе меняет истину на противоположную.", "standard_idea_ids": ["truth_liar_normalization"], "status": "ai_checked"}],
  "strategies": [{"id": "str-count-color-changes-on-cycle", "title": "Свести ответы к границам между типами", "text": "Если человек и его правый сосед одного типа, ответ «справа лжец» не прозвучит: рыцарь перед рыцарем честно скажет «рыцарь», а лжец перед лжецом соврет и тоже скажет «рыцарь». Если типы разные, такой ответ прозвучит: рыцарь перед лжецом скажет правду, а лжец перед рыцарем соврет.\n\nЗначит, нужное число равно числу переходов между рыцарями и лжецами при обходе круга. На круге число переходов между двумя типами всегда четно. Так как присутствуют и рыцари, и лжецы, переходов как минимум два. Поэтому два ответа возможны, например если все рыцари сидят подряд и все лжецы подряд, а один ответ невозможен.", "standard_idea_ids": ["truth_liar_normalization"], "status": "ai_checked", "definition_ids": ["truth_teller", "liar"]}],
