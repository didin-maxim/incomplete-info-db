  "strategies": [{"id": "str-compare-with-leftover", "title": "Разбить 100 монет пополам", "text": "Отложим одну монету и взвесим 50 монет против других 50. Если весы в равновесии, фальшивая монета отложенная; вторым взвешиванием сравним ее с любой монетой из уравновешенных ста и узнаем, легче она или тяжелее.\n\nЕсли первое взвешивание не уравновесилось, отложенная монета настоящая. Возьмем одну монету с более тяжелой чаши и сравним ее с отложенной. Если она тяжелее настоящей, значит фальшивая монета тяжелая. Если она равна настоящей, то фальшивая лежала на более легкой чаше, значит она легче настоящих.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["balance_scale"]}],
