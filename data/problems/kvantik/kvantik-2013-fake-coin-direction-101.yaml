  "statements": {"original": [{"id": "stmt-original", "title": "101 монета и два взвешивания", "text": "Есть 101 монета. 100 из них одинаковые настоящие, а одна фальшивая, отличающаяся от настоящих по весу. Как с помощью двух взвешиваний на чашечных весах без гирь узнать, легче или тяжелее фальшивая монета, чем настоящая? Находить фальшивую монету не требуется.", "source_ids": ["src-kvantik-math-contest-2013", "src-lmo-1990-pdmi"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "hidden_state"]}]},
