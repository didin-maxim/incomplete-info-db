  "statements": {"original": [{"id": "stmt-original", "title": "Детектор считает волшебные шарики", "text": "Имеются красный, синий, зеленый и черный шарики, среди которых могут быть волшебные. Детектор позволяет определить, сколько из помещенных в него шариков волшебны. Как узнать, какие шарики волшебные, а какие - нет, всего за три измерения?", "source_ids": ["src-kvantik-math-contest-2013"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["hidden_state"]}]},
  "ideas": [{"id": "idea-binary-signature-subset-sums", "title": "Дать каждому шарику свой трехмерный код", "text": "Каждый шарик участвует в некоторых из трех измерений. Тройка полученных чисел равна сумме кодов всех волшебных шариков, поэтому коды надо выбрать так, чтобы разные наборы давали разные суммы.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-three-detector-subsets", "title": "Измерить три специально выбранных набора", "text": "Обозначим шарики К, С, З, Ч: красный, синий, зеленый, черный. Проведем такие измерения: 1) З и Ч; 2) С и Ч; 3) К, С и З.\n\nТогда волшебный красный шарик добавляет к тройке результатов (0, 0, 1), синий - (0, 1, 1), зеленый - (1, 0, 1), черный - (1, 1, 0). Для этих четырех кодов все суммы по подмножествам различны, поэтому тройка показаний однозначно задает набор волшебных шариков. Например, (0, 0, 0) означает, что волшебных нет, (0, 0, 1) - только красный, (1, 1, 0) - только черный, а (2, 2, 3) - все четыре.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["hidden_state"]}],
