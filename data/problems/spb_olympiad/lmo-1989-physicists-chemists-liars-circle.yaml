        "title": "Все отвечают, что сосед справа - химик",
        "text": "За круглым столом сидят 2n человек: n физиков и n химиков. Некоторые из них всегда говорят правду, остальные всегда лгут. Известно, что количество химиков-лжецов равно количеству физиков-лжецов. На вопрос: «Кто ваш сосед справа?» все сидящие за столом ответили: «Химик». Докажите, что n четно.",
