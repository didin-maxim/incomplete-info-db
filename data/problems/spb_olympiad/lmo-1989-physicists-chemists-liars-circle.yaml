      "title": "Посчитать пары перед физиком",
      "text": "Рассмотрим всех людей, чей сосед справа - физик. Таких людей ровно n, потому что всего физиков n. Все эти люди солгали, так как ответили «Химик».\n\nРазделим их на две группы: химики-лжецы перед физиком и физики-лжецы перед физиком. По условию общее число химиков-лжецов равно общему числу физиков-лжецов; других лжецов нет, ведь лжец обязательно стоит перед физиком. Значит эти две группы равны по размеру. Их сумма равна n, поэтому n - сумма двух равных чисел и, следовательно, четно.",
