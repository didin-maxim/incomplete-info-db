      "id": "str-five-bit-sidon-code",
      "title": "Пять контрольных групп",
      "text": "Пронумеруем монеты и назначим им коды:\n1: 00000, 2: 00001, 3: 00010, 4: 00100, 5: 00111, 6: 01000, 7: 10000, 8: 11001, 9: 11110.\n\nВ j-м взвешивании кладем на весы те монеты, у которых j-й бит равен 1. Если в группе k монет и вес оказался W граммов, то число фальшивых в этой группе равно W-10k. Так после пяти взвешиваний получается покоординатная сумма кодов двух фальшивых монет.\n\nДля приведенного набора кодов суммы кодов любых двух разных монет различны. Значит полученная пятикомпонентная сумма однозначно указывает пару фальшивых монет.",
