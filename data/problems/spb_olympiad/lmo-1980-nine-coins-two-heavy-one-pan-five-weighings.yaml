      "title": "Дать монетам разные наборы пяти отметок",
      "text": "Каждое взвешивание на одночашечных весах сообщает, сколько фальшивых монет лежало в выбранной группе: нужно вычесть известный вес настоящих монет. Поэтому пяти взвешиваний достаточно, если девяти монетам назначить такие наборы из пяти нулей и единиц, что суммы любых двух наборов различны.",
