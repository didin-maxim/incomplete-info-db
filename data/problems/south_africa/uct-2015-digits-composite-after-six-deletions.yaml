    }
  ],
  "strategies": [
    {
      "id": "str-place-1397-first",
      "title": "Поставить в начало составное число из нечетных цифр",
      "text": "Один работающий порядок начинается с цифр 1, 3, 9, 7, после чего идут остальные шесть цифр в любом порядке, например 0, 2, 4, 5, 6, 8. Если удалены ровно последние шесть цифр, остается 1397, а это \\(11\\cdot127\\), то есть составное число. Во всех остальных случаях среди оставшихся четырех цифр есть хотя бы одна из последних шести; последняя оставшаяся из них стоит правее первых четырех и равна 0, 5 или четной цифре, поэтому полученное четырехзначное число делится на 2 или 5.",
