        "title": "Любые четыре оставшиеся цифры дают составное число",
        "text": "Нужно расположить десять цифр 0, 1, 2, ..., 9 в ряд так, чтобы после удаления любых шести цифр оставшиеся четыре цифры, записанные в прежнем порядке, образовывали составное число.",
