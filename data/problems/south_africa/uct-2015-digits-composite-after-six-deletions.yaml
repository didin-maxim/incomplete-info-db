  "ideas": [
    {
      "id": "idea-protect-one-exceptional-subsequence",
      "title": "Нужно контролировать единственный опасный случай",
      "text": "Если первые четыре цифры образуют составное число, а все остальные цифры делают последнюю цифру оставшегося числа четной, равной 0 или равной 5, то любой выбор с хотя бы одной поздней цифрой автоматически дает составное число.",
