      "id": "idea-one-subject-separates-a-pair",
      "title": "Для каждой пары учеников достаточно закрепить один различающий предмет",
      "text": "Скрытое состояние - личность ученика. Чтобы выбранные предметы различали всех, нужно для каждой пары оставить хотя бы один предмет, по которому их оценки различаются.",
