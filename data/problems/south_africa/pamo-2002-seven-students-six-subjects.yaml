        "title": "Выбрать шесть различающих предметов",
        "text": "Семь учеников сравнили свои оценки по двенадцати предметам и заметили, что никакие два ученика не имеют одинаковые оценки по всем двенадцати предметам. Докажите, что можно выбрать шесть предметов так, чтобы любые два ученика отличались оценкой хотя бы по одному из выбранных предметов.",
