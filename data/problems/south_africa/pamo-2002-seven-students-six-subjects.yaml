  "strategies": [
    {
      "id": "str-pick-minimal-separating-set",
      "title": "Последовательно уточнять разбиение учеников по выбранным предметам",
      "text": "Начнем с пустого набора выбранных предметов: все 7 учеников пока лежат в одном классе, потому что по выбранным предметам они не различаются. Если текущее разбиение еще не состоит из одноэлементных классов, то в некотором классе есть два разных ученика. По условию их полные 12-мерные наборы оценок различаются, значит существует предмет, который разделяет хотя бы один текущий класс на две непустые части. Добавим такой предмет.\n\nКаждый добавленный предмет увеличивает число классов разбиения хотя бы на 1. Был 1 класс, а нужно получить 7 одноэлементных классов, поэтому достаточно не более 6 добавлений. После этого любые два ученика различаются хотя бы по одному из выбранных предметов. Если предметов получилось меньше 6, можно добавить произвольные оставшиеся предметы до ровно шести.",
