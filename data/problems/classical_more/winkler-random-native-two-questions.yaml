      "id": "str-ask-more-likely-truthful",
      "title": "Сначала выбрать надежного, затем спросить стандартно",
      "text": "Обозначим туземцев A, B и C. Сначала спросим A: «B чаще говорит правду, чем C?» Если A отвечает «да», вторым вопросом обращаемся к C; если A отвечает «нет», обращаемся к B.\n\nПочему выбранный второй собеседник неслучаен? Если A правдивец, он честно сравнивает B и C: при ответе «да» B надежнее C, значит C - лжец; при ответе «нет» C надежнее B, значит B - лжец. Если A лжец, он переворачивает это сравнение: при ответе «да» на самом деле B не надежнее C, значит C - правдивец; при ответе «нет» на самом деле B надежнее C, значит B - правдивец. Если A сам случайный, то B и C оба неслучайны, и любой выбор между ними подходит.\n\nИтак, второй вопрос задается правдивцу или лжецу. Ему можно задать стандартный вопрос: «Если бы я спросил тебя, ведет ли эта дорога в деревню, ты ответил бы да?» У правдивца ответ совпадает с истинным ответом. У лжеца внутренний ответ на прямой вопрос был бы ложным, но лжец лжет и о нем, поэтому внешний ответ снова совпадает с истинным. Значит, по второму ответу логик выбирает правильную дорогу.",
