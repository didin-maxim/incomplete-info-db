        "id": "stmt-random-native-two-questions",
        "title": "Найти дорогу при одном случайном отвечающем",
        "text": "Логик стоит на развилке: одна дорога ведет в деревню, другая нет. Рядом находятся трое туземцев: один всегда говорит правду, один всегда лжет, а один отвечает случайно. Логик не знает, кто есть кто. Можно задать только два вопроса с ответом да/нет; каждый вопрос адресуется одному туземцу, второй вопрос можно выбирать после ответа на первый. Можно ли гарантированно узнать, какая дорога ведет в деревню?",
        "source_ids": ["src-winkler-seven-puzzles"],
        "status": "source_verified",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["truth_teller", "liar", "strategy"]
      }
    ]
