      "title": "Первый вопрос нужен не про дорогу, а про надежного собеседника",
      "text": "Если второй вопрос задать неслучайному туземцу, то обычная нормализация лжеца уже решит задачу о дороге. Поэтому первый вопрос должен гарантированно выбрать среди двух оставшихся неслучайного отвечающего.",
      "standard_idea_ids": ["truth_liar_normalization", "partition_state_space"],
