  "strategies": [
    {
      "id": "str-hamming-losing-codewords",
      "title": "Назначить слова ответов проигрышными",
      "text": "Отождествим цвета колпаков с битами и заранее выберем двоичный совершенный код длины \\(2^m-1\\) с минимальным расстоянием 3. Эти кодовые слова объявим проигрышными. Для семи участников это код \\([7,4,3]\\): 16 слов длины 7, каждое двоичное слово длины 7 находится на расстоянии не более 1 ровно от одного кодового слова.\n\nСтратегия каждого игрока такая. Он смотрит на чужие биты и рассматривает две возможные полные конфигурации: с его битом 0 и с его битом 1. Если ровно одна из этих двух конфигураций является кодовым словом, игрок называет другой цвет - тот, при котором полная конфигурация не является кодовым словом. Если кодового слова среди двух вариантов нет, он молчит.\n\nЕсли реальная конфигурация не является кодовым словом, то по свойству совершенного кода она отличается ровно в одной координате от единственного кодового слова. Игрок в этой координате увидит, что противоположный его реальному цвету вариант является кодовым, и назовет реальный цвет. Все остальные игроки молчат: при изменении любой другой координаты получилась бы строка на расстоянии 2 от того же кодового слова, а значит не кодовое слово. Если реальная конфигурация сама является кодовым словом, каждый игрок называет противоположный своему реальному цвет, и команда проигрывает. Для семи участников таких конфигураций 16 из 128, поэтому вероятность успеха равна \\(1-16/128=7/8\\); в общем случае получается \\(1-2^{-m}\\).",
