        "text": "Семь участников получают черные или белые колпаки. Каждый видит колпаки всех остальных, но не свой. После предварительного сговора они одновременно либо называют цвет своего колпака, либо молчат. Команда выигрывает, если хотя бы один участник назвал свой цвет верно и никто не ошибся. Постройте стратегию с вероятностью успеха \\(7/8\\) при равновероятных независимых цветах.",
