        "id": "stmt-13-preassigned-identify-only",
        "title": "План нельзя менять после результатов",
        "text": "Даны 13 одинаковых на вид монет. Ровно одна из них фальшивая: она отличается по весу от остальных, но неизвестно, легче она или тяжелее. Нужно за три взвешивания на чашечных весах определить номер фальшивой монеты. Определять, легче она или тяжелее, не требуется. Все три взвешивания надо объявить заранее, до получения первого результата.",
