  "strategies": [{"id": "str-eliminate-by-common-knowledge", "title": "Последовательное исключение дат", "text": "Уникальные числа в исходном списке - 18 и 19. Если бы месяц был май или июнь, Альберт не мог бы заранее знать, что Бернард не знает: при мае возможен день 19, при июне - день 18. Значит первая реплика Альберта публично исключает май и июнь.\n\nОстаются даты 14, 16 июля и 14, 15, 17 августа. Бернард слышит это исключение. Если бы его число было 14, у него все еще оставались бы две даты: 14 июля и 14 августа. Но Бернард говорит, что теперь знает дату, значит число не 14. Остаются 16 июля, 15 августа и 17 августа.\n\nАльберт слышит вторую реплику. Если бы его месяц был август, у него оставались бы две возможные даты: 15 и 17 августа. Он не смог бы сказать, что теперь знает дату. Поэтому месяц Альберта - июль, и единственная оставшаяся дата - 16 июля.", "standard_idea_ids": ["public_announcement_induction"], "status": "ai_checked", "definition_ids": ["common_knowledge", "public_announcement"]}],
