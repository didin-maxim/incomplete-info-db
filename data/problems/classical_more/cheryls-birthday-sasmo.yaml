  "statements": {"original": [{"id": "stmt-sasmo-2015", "title": "Альберт знает месяц, Бернард знает день", "text": "Шерил называет Альберту и Бернарду десять возможных дат своего дня рождения: 15, 16, 19 мая; 17, 18 июня; 14, 16 июля; 14, 15, 17 августа. Затем она сообщает Альберту только месяц, а Бернарду только число. Альберт говорит: «Я не знаю, когда день рождения Шерил, но я знаю, что Бернард тоже не знает». Бернард отвечает: «Сначала я не знал, но теперь знаю». Альберт говорит: «Теперь и я знаю». Когда день рождения Шерил?", "source_ids": ["src-sasmo-2015-grade-9-solutions"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["common_knowledge", "public_announcement"]}]},
