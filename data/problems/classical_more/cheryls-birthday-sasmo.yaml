  "statements": {"original": [{"id": "stmt-sasmo-2015", "title": "Петя знает месяц, Вася знает день", "text": "Маша называет Пете и Васе десять возможных дат своего дня рождения: 15, 16, 19 мая; 17, 18 июня; 14, 16 июля; 14, 15, 17 августа. Затем она сообщает Пете только месяц, а Васе только число. Петя говорит: «Я не знаю, когда день рождения Маши, но я знаю, что Вася тоже не знает». Вася отвечает: «Сначала я не знал, но теперь знаю». Петя говорит: «Теперь и я знаю». Когда день рождения Маши?", "source_ids": ["src-sasmo-2015-grade-9-solutions"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["common_knowledge", "public_announcement"]}]},
  "ideas": [{"id": "idea-public-replies-delete-dates", "title": "Каждая реплика удаляет невозможные даты", "text": "Реплики участников становятся публичными фактами. Поэтому удаляются не только даты, которые противоречат словам говорящего, но и даты, при которых говорящий не мог бы быть уверен в знаниях другого.", "standard_idea_ids": ["public_announcement_induction"], "status": "ai_checked"}],
  "strategies": [{"id": "str-eliminate-by-common-knowledge", "title": "Последовательное исключение дат", "text": "Уникальные числа в исходном списке - 18 и 19. Если бы месяц был май или июнь, Петя не мог бы заранее знать, что Вася не знает: при мае возможен день 19, при июне - день 18. Значит первая реплика Пети публично исключает май и июнь.\n\nОстаются даты 14, 16 июля и 14, 15, 17 августа. Вася слышит это исключение. Если бы его число было 14, у него все еще оставались бы две даты: 14 июля и 14 августа. Но Вася говорит, что теперь знает дату, значит число не 14. Остаются 16 июля, 15 августа и 17 августа.\n\nПетя слышит вторую реплику. Если бы его месяц был август, у него оставались бы две возможные даты: 15 и 17 августа. Он не смог бы сказать, что теперь знает дату. Поэтому месяц Пети - июль, и единственная оставшаяся дата - 16 июля.", "standard_idea_ids": ["public_announcement_induction"], "status": "ai_checked", "definition_ids": ["common_knowledge", "public_announcement"]}],
