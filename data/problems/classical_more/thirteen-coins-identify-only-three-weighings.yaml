  "strategies": [
    {
      "id": "str-first-four-against-four",
      "title": "Стратегия с разбором двух веток",
      "text": "Пронумеруем монеты от 1 до 13. В первом взвешивании сравним \\(1,2,3,4\\) с \\(5,6,7,8\\). Будем писать \\(+\\), если левая чаша тяжелее, \\(-\\), если правая чаша тяжелее, и \\(0\\), если равновесие.\n\nЕсли первое взвешивание дало равновесие, то монеты 1-8 настоящие, а фальшивая среди 9-13. Оставшиеся два взвешивания делаем так:\n\n| взвешивание | левая чаша | правая чаша |\n|---|---|---|\n| 2 | 10, 11, 12 | 1, 2, 3 |\n| 3 | 10, 13 | 12, 1 |\n\nПосле этих двух взвешиваний читаем пару исходов. Пары \\(00\\), \\(++\\) или \\(--\\), \\(+0\\) или \\(-0\\), \\(+-\\) или \\(-+\\), \\(0+\\) или \\(0-\\) указывают соответственно монеты 9, 10, 11, 12, 13. Например, если монета 12 тяжелая, получим \\(+-\\), а если легкая, получим \\(-+\\); в обоих случаях номер найден.\n\nТеперь пусть первое взвешивание не дало равновесия. Обозначим через \\(A_1,A_2,A_3,A_4\\) четыре монеты с более тяжелой чаши первого взвешивания, а через \\(B_1,B_2,B_3,B_4\\) - четыре монеты с более легкой чаши. Тогда возможны только такие случаи: одна из монет \\(A\\) тяжелая или одна из монет \\(B\\) легкая. Любые две монеты из 9-13 теперь заведомо настоящие; назовем их \\(G_1\\) и \\(G_2\\). Оставшиеся два взвешивания:\n\n| взвешивание | левая чаша | правая чаша |\n|---|---|---|\n| 2 | \\(A_4, B_1, G_1\\) | \\(A_1, A_2, B_4\\) |\n| 3 | \\(B_2, B_4, G_2\\) | \\(A_1, B_1, B_3\\) |\n\nТаблица расшифровки пары исходов второго и третьего взвешиваний:\n\n| исходы | фальшивая монета |\n|---|---|\n| \\(--\\) | \\(A_1\\) |\n| \\(-0\\) | \\(A_2\\) |\n| \\(00\\) | \\(A_3\\) |\n| \\(+0\\) | \\(A_4\\) |\n| \\(-+\\) | \\(B_1\\) |\n| \\(0-\\) | \\(B_2\\) |\n| \\(0+\\) | \\(B_3\\) |\n| \\(+-\\) | \\(B_4\\) |\n\nПочему таблица работает: тяжелая монета из группы \\(A\\) тянет вниз ту чашу, на которой лежит; легкая монета из группы \\(B\\) дает противоположный исход. Выбранные положения восьми кандидатов дают восемь разных пар исходов. Случай, когда в первом взвешивании правая чаша тяжелее, обрабатывается той же таблицей: просто группой \\(A\\) называем монеты 5-8, а группой \\(B\\) - монеты 1-4.",
