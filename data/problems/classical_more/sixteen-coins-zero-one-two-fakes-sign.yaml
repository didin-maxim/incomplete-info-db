        "title": "0, 1 или 2 фальшивые монеты одного знака",
        "text": "Даны 16 одинаковых на вид монет. Среди них может быть 0, 1 или 2 фальшивые. Если фальшивые монеты есть, все они одного знака: либо все легче настоящих, либо все тяжелее настоящих. За три взвешивания на чашечных весах без гирь нужно определить только один из трех ответов: фальшивых нет; фальшивые есть и легче настоящих; фальшивые есть и тяжелее настоящих. Номера и количество фальшивых монет определять не требуется.",
