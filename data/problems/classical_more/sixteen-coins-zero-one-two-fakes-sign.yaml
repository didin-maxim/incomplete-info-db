      "id": "str-kuhn-scout-plan",
      "title": "Трехвзвешивательный план разведчика",
      "text": "Пронумеруем монеты от 1 до 16. Первое взвешивание: \\(1,2,3,4,5,6,7,8\\) против \\(9,10,11,12,13,14,15,16\\).\n\nЕсли первое взвешивание дало равновесие, второе взвешивание: \\(8,9,11,13,16\\) против \\(1,10,12,14,15\\). Если второе взвешивание дало равновесие, третье: \\(1,8,9\\) против \\(4,5,7\\). В этой подветви равновесие означает, что фальшивых нет; левая чаша тяжелее означает тяжелые фальшивые; правая чаша тяжелее означает легкие фальшивые. Если второе взвешивание в равновесной первой ветви дало перекос, третье взвешивание: \\(11,16\\) против \\(9,13\\). При втором перекосе влево исходы третьего взвешивания читаются так: перекос или влево, или вправо означает тяжелые фальшивые, равновесие означает легкие. При втором перекосе вправо наоборот: перекос или влево, или вправо означает легкие, равновесие означает тяжелые.\n\nЕсли первое взвешивание дало перекос, назовем \\(H_1,\\ldots,H_8\\) монеты с более тяжелой чаши первого взвешивания, а \\(L_1,\\ldots,L_8\\) - монеты с более легкой чаши, сохраняя порядок внутри соответствующей восьмерки. Второе взвешивание: \\(H_4,H_5,H_6,H_7,L_3,L_4,L_5,L_7\\) против \\(H_1,H_2,H_3,H_8,L_1,L_2,L_6,L_8\\). Если оно дало равновесие, третье взвешивание: \\(L_1,L_2\\) против \\(L_6,L_8\\); равновесие означает тяжелые фальшивые, любой перекос означает легкие. Если второе взвешивание дало перекос влево, третье: \\(H_4,H_5,H_6,H_7,L_1\\) против \\(H_1,H_2,H_3,L_4,L_7\\); перекос влево означает тяжелые, а перекос вправо или равновесие - легкие. Если второе взвешивание дало перекос вправо, третье: \\(H_4,H_5,H_7,L_2,L_6,L_8\\) против \\(H_1,H_2,H_3,H_8,L_3,L_7\\); перекос вправо означает тяжелые, а перекос влево или равновесие - легкие.\n\nПлан проверяется перебором всех допустимых скрытых состояний: пустого состояния, 32 состояний с одной фальшивой монетой и 240 состояний с двумя фальшивыми монетами одного знака. В каждой листовой ветви все совместимые состояния принадлежат одному и тому же классу ответа.",
