      "title": "Совместимые состояния группируются в три класса",
      "text": "После каждого взвешивания можно хранить все подробные состояния: нет фальшивых, одна легкая или тяжелая монета, две легкие или две тяжелые монеты. Но выигрывает не тот момент, когда осталось одно подробное состояние, а тот момент, когда все оставшиеся состояния имеют один и тот же ответный класс.",
