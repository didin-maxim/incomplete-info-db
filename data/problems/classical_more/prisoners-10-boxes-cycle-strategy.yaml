        "id": "stmt-ten-prisoners-ten-boxes",
        "title": "Найти свой номер за 5 открытий",
        "text": "Есть 10 заключенных и 10 ящиков. В ящиках лежат номера заключенных от 1 до 10, по одному номеру в каждом ящике, в случайном порядке. Заключенные могут заранее договориться о стратегии, потом заходят в комнату по одному, не общаются и не оставляют следов. Каждый может открыть не более 5 ящиков. Все выигрывают, если каждый заключенный нашел свой номер. Какой простой заранее согласованный способ дает заметную вероятность общего успеха?",
        "source_ids": [
          "src-winkler-seven-puzzles",
          "src-aops-wiki-kgs-math-club"
        ],
