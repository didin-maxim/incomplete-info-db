  },
  "ideas": [
    {
      "id": "idea-boxes-as-permutation-cycles",
      "title": "Ящики задают перестановку",
      "text": "Если из ящика с номером \\(i\\) достали номер \\(j\\), будем считать, что стрелка идет из \\(i\\) в \\(j\\). Так все ящики разбиваются на циклы. Заключенный, который каждый раз идет в ящик с только что найденным номером, двигается по своему циклу.",
      "standard_idea_ids": [
        "partition_state_space"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-follow-own-cycle",
      "title": "Идти по цепочке номеров",
      "text": "До испытания заключенные договариваются: заключенный \\(i\\) сначала открывает ящик \\(i\\). Если внутри номер \\(i\\), он сразу закончил. Если внутри номер \\(j\\), следующим он открывает ящик \\(j\\), затем ящик с номером, который нашел там, и так далее, пока не найдет свой номер или не сделает 5 открытий.\n\nПочему это работает именно так: в перестановке «номер ящика ? номер внутри» заключенный \\(i\\) идет по тому циклу, где находится \\(i\\). Если длина этого цикла не больше 5, он обязательно за один оборот дойдет до своего номера. Если есть цикл длины 6 или больше, все заключенные из этого длинного цикла не успеют пройти его целиком, и общий успех невозможен для этой стратегии.\n\nЗначит, критерий успеха для всех десяти заключенных простой: в перестановке не должно быть цикла длины больше 5. Для случайной перестановки вероятность успеха равна \\(1-(1/6+1/7+1/8+1/9+1/10)\\), примерно \\(0.354\\). Это намного лучше, чем независимые случайные попытки, потому что заключенные не ищут вслепую: каждый проверяет ровно свой цикл.",
      "standard_idea_ids": [
        "partition_state_space"
      ],
      "status": "ai_checked",
