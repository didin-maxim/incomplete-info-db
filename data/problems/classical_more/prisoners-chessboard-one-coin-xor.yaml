      "id": "str-xor-single-flip",
      "title": "Перевернуть клетку с нужной разностью контрольных сумм",
      "text": "Заранее присвоим 64 клеткам номера \\(0,1,\\ldots,63\\), то есть записи из шести нулей и единиц. Договоримся считать орел значением 1, решку значением 0. Для любой позиции доски вычислим \\(S\\): сложим без переносов номера всех клеток, на которых лежит орел.\n\nПусть ключ лежит под клеткой с номером \\(K\\). Первый заключенный видит исходную сумму \\(S\\). Если он перевернет монету на клетке \\(F\\), то новая сумма станет суммой \\(S\\) и \\(F\\) без переносов: номер \\(F\\) либо добавится, либо удалится, но при таком сложении это одна и та же операция. Поэтому нужно выбрать \\(F\\) так, чтобы сумма \\(S\\) и \\(F\\) без переносов равнялась \\(K\\). Такая клетка всегда существует и единственна среди 64 номеров.\n\nПосле переворота второй заключенный снова складывает без переносов номера клеток с орлами на итоговой доске. Он получает \\(K\\), то есть номер клетки с ключом. Условие «ровно одну монету» не мешает даже когда \\(S=K\\): тогда переворачивается заранее выбранная клетка с номером 0, которая не меняет контрольную сумму.",
