  "strategies": [
    {
      "id": "str-xor-single-flip",
      "title": "Перевернуть клетку с нужной разностью контрольных сумм",
      "text": "Заранее присвоим 64 клеткам номера \\(0,1,\\ldots,63\\), то есть шестибитные векторы. Договоримся считать орел значением 1, решку значением 0. Для любой позиции доски вычислим \\(S\\): XOR номеров всех клеток, на которых лежит орел.\n\nПусть ключ лежит под клеткой с номером \\(K\\). Первый заключенный видит исходную сумму \\(S\\). Если он перевернет монету на клетке \\(F\\), то новая сумма станет \\(S \\oplus F\\): номер \\(F\\) либо добавится в XOR, либо удалится, но в обоих случаях операция с XOR одинакова. Поэтому нужно выбрать \\(F = S \\oplus K\\). Такая клетка всегда существует и единственна среди 64 номеров.\n\nПосле переворота второй заключенный вычисляет XOR номеров клеток с орлами на итоговой доске. Он получает \\(S \\oplus F = S \\oplus (S \\oplus K)=K\\), то есть номер клетки с ключом. Условие «ровно одну монету» не мешает даже когда \\(S=K\\): тогда \\(F=0\\), и переворачивается заранее выбранная нулевая клетка, которая не меняет код кроме обязательной операции с номером 0.",
      "standard_idea_ids": [
        "modular_sum_encoding"
      ],
