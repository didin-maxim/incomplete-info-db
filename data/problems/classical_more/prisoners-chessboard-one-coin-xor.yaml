        "text": "На 64 клетках шахматной доски лежат монеты, каждая орлом или решкой вверх. Два заключенных заранее договариваются о стратегии. Затем первый видит доску и клетку, под которой спрятан ключ, и обязан перевернуть ровно одну монету. После этого второй видит только итоговую доску и должен указать клетку с ключом. Как гарантировать успех при любом исходном расположении монет и любой клетке с ключом?",
