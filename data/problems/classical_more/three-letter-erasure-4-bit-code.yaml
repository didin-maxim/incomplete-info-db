      "id": "idea-erasure-shadows-disjoint",
      "title": "У каждого слова есть три тени после стирания",
      "text": "Для кодового слова посмотрим на три строки, которые получаются после стирания всех А, всех Б или всех В. Если две разные строки-кода имеют общую тень, фокусник не сможет различить соответствующие сообщения. Поэтому достаточно выбрать 16 слов так, чтобы множества их теней не пересекались.",
