      "id": "str-explicit-16-codewords",
      "title": "Использовать проверенную таблицу из 16 слов",
      "text": "Договоримся о такой таблице, где номер сообщения записан слева:\n\n0: АББАВВАБ\n1: АБВБВВВА\n2: АВААВББВ\n3: АВАВВБВБ\n4: АВБББВАВ\n5: АВББВВАБ\n6: АВВББАББ\n7: ББВААВАВ\n8: БВААВББВ\n9: БВВААВБВ\n10: ВААБАББВ\n11: ВАБАВВБА\n12: ВАВВАБББ\n13: ВБААВААБ\n14: ВБВБВААВ\n15: ВВБАБААА\n\nФокусник заранее знает эту таблицу. После стирания он ищет оставшуюся строку среди всех 48 возможных теней таблицы. Встроенная проверка перебирает все 16 сообщений и все 3 стирания: ни одна видимая строка не относится к двум разным сообщениям. Значит поиск по таблице всегда дает единственный номер.",
