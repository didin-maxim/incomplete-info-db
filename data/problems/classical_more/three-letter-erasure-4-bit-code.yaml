        "title": "Передать одно из 16 сообщений после стирания всех одинаковых букв",
        "text": "Помощник и фокусник заранее договариваются о таблице. Потом помощник должен передать одно из 16 сообщений, записав строку длины 8 из букв А, Б, В. Зритель выбирает одну из этих трех букв и стирает все ее вхождения. Фокусник видит только оставшуюся строку и не знает, какая буква была стерта. Можно ли заранее выбрать 16 кодовых слов так, чтобы фокусник всегда восстанавливал сообщение?",
