      "id": "str-xor-8-single-flip",
      "title": "Перевернуть позицию с нужной разностью",
      "text": "Договоримся считать орел единицей, а решку нулем. Для любой раскладки вычислим число \\(S\\): сложим без переносов номера всех позиций, где лежит орел. Например, если орлы лежат на позициях 3, 5 и 6, то \\(S=3\\oplus5\\oplus6\\), где знак \\(\\oplus\\) означает сложение двоичных записей без переносов.\n\nПусть ключ лежит под позицией \\(K\\). Первый заключенный видит исходную сумму \\(S\\). Ему нужно выбрать позицию \\(F\\), для которой \\(S\\oplus F=K\\). Такая позиция ровно одна: \\(F=S\\oplus K\\). Он переворачивает монету на позиции \\(F\\).\n\nПочему это работает? Если монета на позиции \\(F\\) была решкой, ее номер добавится в сумму. Если была орлом, ее номер исчезнет из суммы. В сложении без переносов оба случая меняют сумму одинаково: новая сумма становится \\(S\\oplus F\\), то есть \\(K\\). Второй заключенный складывает без переносов номера позиций с орлами на итоговой раскладке и получает номер ключа. Если \\(S=K\\), первый переворачивает позицию 0: ее номер ничего не меняет, но условие «ровно одну монету» выполнено.",
      "standard_idea_ids": [
        "modular_sum_encoding"
      ],
