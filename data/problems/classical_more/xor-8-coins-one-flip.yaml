        "id": "stmt-eight-coins-one-flip",
        "title": "Передать одну из восьми позиций одним переворотом",
        "text": "Есть 8 позиций с номерами 0, 1, 2, 3, 4, 5, 6, 7. На каждой позиции лежит монета: орел или решка. Два заключенных заранее договариваются о стратегии. Потом первый заключенный видит исходную раскладку монет и знает, под какой позицией спрятан ключ. Он обязан перевернуть ровно одну монету. Второй заключенный видит только итоговую раскладку и должен назвать позицию ключа. Как им договориться, чтобы второй всегда угадывал правильно?",
