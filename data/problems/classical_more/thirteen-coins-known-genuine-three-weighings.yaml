      "text": "Три взвешивания дают цепочку из трех результатов. Монета со схемой \\(v\\) при тяжелой фальшивости дает результаты \\(v\\), а при легкой - противоположные результаты. Нужно выбрать 13 представителей из 13 пар ненулевых противоположных цепочек.",
