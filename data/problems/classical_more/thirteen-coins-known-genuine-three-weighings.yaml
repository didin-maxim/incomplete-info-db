    "original": [{"id": "stmt-13-with-known-good", "title": "Фальшивая монета легче или тяжелее", "text": "Есть 13 подозрительных монет и одна заведомо настоящая монета. Среди 13 подозрительных ровно одна фальшивая; неизвестно, легче она настоящих или тяжелее. Нужно за три взвешивания на чашечных весах определить фальшивую монету и сказать, легче она или тяжелее.", "source_ids": ["src-balance-puzzle-reference"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "decision_tree"]}],
    "reformulation": [{"id": "stmt-as-q-signature-code", "title": "q=3 в коде противоположных тернарных подписей", "text": "С эталонной монетой задача становится точным случаем общей сигнатурной схемы: \\(q\\) взвешиваний дают \\((3^q-1)/2\\) пар противоположных ненулевых тернарных слов, каждая пара кодирует одну подозрительную монету и два возможных знака отклонения. При \\(q=3\\) это ровно 13 монет.", "source_ids": ["src-balance-puzzle-reference"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "information_lower_bound"]}]
