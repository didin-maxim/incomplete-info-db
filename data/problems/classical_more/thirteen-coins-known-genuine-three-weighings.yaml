        "title": "Три взвешивания и пары противоположных результатов",
        "text": "Даны \\(q\\) взвешиваний на чашечных весах, одна заведомо настоящая монета и несколько подозрительных монет, среди которых ровно одна фальшивая; она может быть как легче, так и тяжелее настоящих. За \\(q\\) взвешиваний нужно найти фальшивую монету и определить направление отличия. Докажите, что по методу противоположных ненулевых цепочек результатов можно обработать \\((3^q-1)/2\\) подозрительных монет. В частности, при \\(q=3\\) это дает 13 подозрительных монет.",
