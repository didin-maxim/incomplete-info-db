      "id": "lb-13-is-capacity-with-known-good",
      "title": "Почему больше 13 монет не получится",
      "text": "Три взвешивания имеют \\(3^3=27\\) исходов. Сценарии «монета \\(i\\) тяжелая» и «монета \\(i\\) легкая» должны давать разные ненулевые исходы, причем они естественно идут противоположными парами. Ненулевых исходов 26, то есть 13 пар. Поэтому с известной настоящей монетой можно различить не больше 13 подозрительных монет.",
