        "text": "Есть 13 подозрительных монет и одна заведомо настоящая монета. Среди 13 подозрительных ровно одна фальшивая; неизвестно, легче она настоящих или тяжелее. Нужно за три взвешивания на чашечных весах определить фальшивую монету и сказать, легче она или тяжелее.",
