  "strategies": [
    {
      "id": "str-balanced-ternary-signature-table",
      "title": "Таблица трех взвешиваний",
      "text": "Обозначим результат каждого взвешивания как \\(+\\), если левая чаша тяжелее, \\(-\\), если правая тяжелее, и \\(0\\), если равновесие. Для каждой подозрительной монеты выберем ненулевую строку длины 3 над \\(\\{-,0,+\\}\\), причем никакие две строки не должны быть противоположными. Если монета стоит слева в данном взвешивании, пишем \\(+\\); справа - \\(-\\); не участвует - \\(0\\). Точно настоящую монету добавляем там, где нужно уравнять число монет на чашах.\n\nОдин сбалансированный набор строк для монет 1-13: \\((+++),(--0),(++-),(+0+),(+00),(-0+),(-+-),(-+0),(-++),(0--),(0-0),(0-+),(00-)\\). В каждом из трех взвешиваний кладем на левую чашу монеты со знаком \\(+\\), на правую - со знаком \\(-\\). В первом взвешивании справа на одну подозрительную монету больше, поэтому точно настоящую монету кладем слева; во втором и третьем слева на одну подозрительную монету больше, поэтому точно настоящую монету кладем справа.\n\nПосле трех взвешиваний получаем цепочку результатов \\(w\\). Если \\(w\\) совпала со строкой монеты, эта монета тяжелее настоящих. Если \\(w\\) противоположна строке монеты, эта монета легче настоящих. Нулевая цепочка невозможна, потому что по условию одна из 13 подозрительных монет фальшивая и каждая имеет ненулевую строку. Точно настоящая монета не создает нового случая: она нужна только для балансировки чаш.",
      "standard_idea_ids": [
        "ternary_weighing_code"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "balance_scale",
        "decision_tree"
      ]
    }
  ],
  "impossibility_proofs": [
