  "ideas": [{"id": "idea-nonzero-ternary-signatures", "title": "Монетам назначаются противоположные тернарные подписи", "text": "Три взвешивания дают тернарное слово. Монета с подписью \\(v\\) при тяжелой фальшивости дает исходы \\(v\\), а при легкой - противоположные исходы. Нужно выбрать 13 представителей из 13 пар ненулевых противоположных тернарных слов.", "standard_idea_ids": ["ternary_weighing_code"], "status": "ai_checked"}],
  "strategies": [{"id": "str-balanced-ternary-signature-table", "title": "Таблица трех взвешиваний", "text": "Обозначим исход каждого взвешивания как \\(+\\), если левая чаша тяжелее, \\(-\\), если правая тяжелее, и \\(0\\), если равновесие. Для каждой подозрительной монеты выберем ненулевую подпись длины 3 над \\(\\{-,0,+\\}\\), причем никакие две подписи не должны быть противоположными. Если монета стоит слева в данном взвешивании, пишем \\(+\\); справа - \\(-\\); не участвует - \\(0\\). Эталонную монету добавляем там, где нужно уравнять число монет на чашах.\n\nОдин сбалансированный набор подписей для монет 1-13: \\((+++),(--0),(++-),(+0+),(+00),(-0+),(-+-),(-+0),(-++),(0--),(0-0),(0-+),(00-)\\). В каждом из трех взвешиваний кладем на левую чашу монеты со знаком \\(+\\), на правую - со знаком \\(-\\). В первом взвешивании справа на одну подозрительную монету больше, поэтому эталонную монету кладем слева; во втором и третьем слева на одну подозрительную монету больше, поэтому эталонную монету кладем справа.\n\nПосле трех взвешиваний получаем исходное слово \\(w\\). Если \\(w\\) совпало с подписью монеты, эта монета тяжелее настоящих. Если \\(w\\) противоположно подписи монеты, эта монета легче настоящих. Нулевое слово невозможно, потому что по условию одна из 13 подозрительных монет фальшивая и каждая имеет ненулевую подпись. Эталонная монета не создает скрытого состояния: она нужна только для балансировки чаш.", "standard_idea_ids": ["ternary_weighing_code"], "status": "ai_checked", "definition_ids": ["balance_scale", "decision_tree"]}],
  "impossibility_proofs": [{"id": "lb-13-is-capacity-with-known-good", "title": "Почему 13 - предельная емкость для трех взвешиваний", "text": "Три взвешивания имеют \\(3^3=27\\) исходов. Сценарии «монета \\(i\\) тяжелая» и «монета \\(i\\) легкая» должны давать разные ненулевые исходы, причем они естественно идут противоположными парами. Ненулевых исходов 26, то есть 13 пар. Поэтому с известной настоящей монетой можно закодировать не больше 13 подозрительных монет.", "standard_idea_ids": ["decision_tree_lower_bound"], "status": "ai_checked", "definition_ids": ["information_lower_bound"]}],
