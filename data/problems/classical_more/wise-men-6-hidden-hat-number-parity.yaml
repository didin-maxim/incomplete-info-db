        "id": "stmt-six-wise-men-hidden-hat-number",
        "title": "Назвать номера колпаков без повторов",
        "text": "Шесть мудрецов стоят в колонне. Есть колпаки с номерами 1, 2, 3, 4, 5, 6, 7. Один колпак спрятали, а остальные шесть в случайном порядке надели на мудрецов. Каждый мудрец видит только номера на колпаках всех впереди стоящих. Затем мудрецы по очереди, от заднего к переднему, называют вслух числа от 1 до 7; число, уже названное раньше, повторять нельзя. Мудрецы заранее знают правила и могут договориться о стратегии. Докажите, что они могут гарантировать не меньше пяти правильных ответов.",
