  "strategies": [
    {
      "id": "str-even-permutation-small-case",
      "title": "Договориться о четной перестановке",
      "text": "Занумеруем позиции так: сначала идет спрятанный колпак, затем шесть мест мудрецов от заднего к переднему. До испытания мудрецы договариваются поддерживать, например, четную перестановку номеров 1..7 на этих семи позициях.\n\nПервый, задний мудрец видит пять номеров впереди. Неизвестны только два номера: его собственный и спрятанный. Если поставить эти два номера двумя возможными способами, получатся две перестановки, отличающиеся перестановкой двух элементов, значит одна из них четная, а другая нечетная. Задний мудрец называет тот номер, который стоял бы на его голове в четном варианте. Он может ошибиться: если настоящая перестановка нечетная, он фактически назовет спрятанный номер. Но повторов при этом нет.\n\nТеперь каждый следующий мудрец знает все уже названные числа и видит все номера впереди. Снова остаются ровно два неразмещенных номера: его собственный и тот, который в поддерживаемой гипотезе находится на спрятанном месте. Из двух способов поставить эти два номера только один сохраняет заранее выбранную четность. Мудрец называет номер, который получается на его месте в этом способе.\n\nПосле первого ответа поддерживаемая четная гипотеза зафиксирована публично. Для всех остальных мудрецов их настоящее место входит в эту гипотезу правильно: если первый ответ совпал с его настоящим номером, то гипотеза совпала с реальностью; если первый ответ был спрятанным номером, то гипотеза отличается от реальности только обменом первого и спрятанного мест. Поэтому второй, третий, четвертый, пятый и шестой мудрецы называют свои настоящие номера. Гарантированы как минимум пять правильных ответов.",
