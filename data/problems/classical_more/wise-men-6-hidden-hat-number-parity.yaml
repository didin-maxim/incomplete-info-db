      "id": "idea-hidden-place-parity",
      "title": "Спрятанный колпак сделать дополнительным местом",
      "text": "Если считать спрятанный колпак еще одной позицией за спиной заднего мудреца, то семь номеров образуют перестановку на семи местах. У двух вариантов для пары «мой номер и спрятанный номер» всегда разная четность, поэтому заранее выбранная четность подсказывает единственный ответ.",
