  "statements": {"original": [{"id": "stmt-boolos-1996", "title": "Три вопроса на неизвестном языке", "text": "Перед вами три бога A, B и C. Один из них Правдивый и всегда говорит правду, один Лжец и всегда лжет, один Случайный; Случайный при каждом ответе случайно ведет себя как Правдивый или как Лжец. Боги понимают русский, но отвечают только словами «da» и «ja», причем вы не знаете, какое из них означает «да». Можно задать три вопроса, каждый ровно одному богу, и следующие вопросы могут зависеть от предыдущих ответов. Как определить, кто есть кто?", "source_ids": ["src-boolos-hardest-logic-puzzle"], "status": "ai_checked", "self_contained": {"status": "ai_checked", "note": "Используется версия, где Случайный на каждый вопрос произвольно отвечает как Правдивый или как Лжец; стратегия не полагается на содержательность его ответа."}, "definition_ids": ["decision_tree"]}]},
  "ideas": [{"id": "idea-embedded-question-normalizes-language-and-lie", "title": "Вопрос внутри вопроса делает ответ понятным", "text": "Вопрос вида «Если бы я спросил тебя Q, сказал бы ты ja?» позволяет получить предсказуемый ответ от неслучайного бога, не зная, означает ли ja «да».", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-find-non-random-then-identify", "title": "Сначала найти неслучайного бога", "text": "Будем использовать вопрос-ловушку \\(N(Q)\\): «Если бы я спросил тебя \\(Q\\), сказал бы ты ja?» Для Правдивого и Лжеца ответ на \\(N(Q)\\) читается одинаково: ответ ja означает, что \\(Q\\) истинно, а ответ da означает, что \\(Q\\) ложно. Это работает потому, что лжец лжет и о своем возможном ответе, а неизвестность значения ja/da компенсируется тем, что спрашивается именно о слове ja.\n\nПервый вопрос зададим A: \\(N(\\text{B является Случайным})\\). Если A сам не Случайный, ответ сообщает, является ли B Случайным; тогда один из B и C точно не Случайный. Если A является Случайным, то B и C оба не Случайные, и независимо от ответа можно выбрать одного из них как неслучайного по правилу: при ответе ja далее работаем с C, при ответе da далее работаем с B. Это правило гарантирует, что выбранный бог не Случайный.\n\nПусть выбранный неслучайный бог обозначен X, а два остальных - Y и Z. Второй вопрос X: \\(N(\\text{X является Правдивым})\\). По ответу узнаем, Правдивый он или Лжец. Третий вопрос X: \\(N(\\text{Y является Случайным})\\). Теперь известно, кто из Y и Z Случайный; оставшийся неслучайный имеет тип, противоположный X. Так определяются все три роли.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["decision_tree"]}],
