  "statements": {"original": [{"id": "stmt-boolos-1996", "title": "Три вопроса на неизвестном языке", "text": "Перед вами три бога A, B и C. Один из них True и всегда говорит правду, один False и всегда лжет, один Random; Random при каждом ответе случайно ведет себя как правдивый или как лжец. Боги понимают русский, но отвечают только словами «da» и «ja», причем вы не знаете, какое из них означает «да». Можно задать три вопроса, каждый ровно одному богу, и следующие вопросы могут зависеть от предыдущих ответов. Как определить, кто есть кто?", "source_ids": ["src-boolos-hardest-logic-puzzle"], "status": "ai_checked", "self_contained": {"status": "ai_checked", "note": "Используется версия, где Random на каждый вопрос произвольно отвечает как правдивый или как лжец; стратегия не полагается на содержательность его ответа."}, "definition_ids": ["decision_tree"]}]},
  "ideas": [{"id": "idea-embedded-question-normalizes-language-and-lie", "title": "Вложенный вопрос нормализует и ложь, и неизвестные слова", "text": "Вопрос вида «Если бы я спросил тебя Q, сказал бы ты ja?» позволяет получить предсказуемый ответ от неслучайного бога, не зная, означает ли ja «да».", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-find-non-random-then-identify", "title": "Сначала найти неслучайного бога", "text": "Будем использовать нормализующий шаблон \\(N(Q)\\): «Если бы я спросил тебя \\(Q\\), сказал бы ты ja?» Для True и False ответ на \\(N(Q)\\) одинаково интерпретируется: ответ ja означает, что \\(Q\\) истинно, а ответ da означает, что \\(Q\\) ложно. Это работает потому, что лжец лжет и о своем гипотетическом ответе, а неизвестность значения ja/da компенсируется тем, что спрашивается именно о слове ja.\n\nПервый вопрос зададим A: \\(N(\\text{B является Random})\\). Если A сам не Random, ответ сообщает, является ли B Random; тогда один из B и C точно не Random. Если A является Random, то B и C оба не Random, и независимо от ответа можно выбрать одного из них как неслучайного по правилу: при ответе ja далее работаем с C, при ответе da далее работаем с B. Это правило гарантирует, что выбранный бог не Random.\n\nПусть выбранный неслучайный бог обозначен X, а два остальных - Y и Z. Второй вопрос X: \\(N(\\text{X является True})\\). По ответу узнаем, True он или False. Третий вопрос X: \\(N(\\text{Y является Random})\\). Теперь известно, кто из Y и Z Random; оставшийся неслучайный имеет тип, противоположный X. Так определяются все три роли.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["decision_tree"]}],
