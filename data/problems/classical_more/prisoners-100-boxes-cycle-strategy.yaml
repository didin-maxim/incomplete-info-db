    "original": [{"id": "stmt-names-in-boxes", "title": "Найти свое имя за 50 открытий", "text": "Имена 100 заключенных лежат в 100 ящиках, по одному имени в каждом. Заключенные могут заранее договориться о стратегии, затем заходят в комнату по одному. Каждый может открыть не более 50 ящиков, должен оставить комнату как была и после начала испытания не может общаться с остальными. Все выживают, если каждый находит свое имя. Найдите стратегию, вероятность успеха которой больше 30%.", "source_ids": ["src-winkler-seven-puzzles"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}],
    "generalized": [{"id": "stmt-general-n-boxes-half-openings", "title": "n заключенных и n/2 открытий", "text": "Есть четное число \\(n\\) заключенных и \\(n\\) ящиков; в ящиках лежат имена заключенных, по одному имени в каждом. Каждый заключенный может открыть не более \\(n/2\\) ящиков и должен найти свое имя. Если заключенные заранее нумеруют ящики своими именами и каждый идет по циклу перестановки имен, то все выигрывают ровно в тех случаях, когда в случайной перестановке нет цикла длины больше \\(n/2\\).", "source_ids": ["src-winkler-seven-puzzles"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]
  },
  "ideas": [{"id": "idea-follow-permutation-cycles", "title": "Перестановка разбивается на циклы", "text": "Если ящики заранее пронумерованы именами заключенных, содержимое ящиков задает перестановку. Следование из своего ящика к ящику с найденным именем идет ровно по циклу этой перестановки.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-cycle-following", "title": "Идти по своему циклу", "text": "До испытания заключенные нумеруют ящики своими именами. Заключенный \\(i\\) сначала открывает ящик с номером \\(i\\). Если там лежит его имя, он закончил. Если там имя \\(j\\), следующим он открывает ящик \\(j\\), затем ящик с номером найденного там имени и так далее, пока не найдет свое имя или не сделает 50 открытий.\n\nЭто не независимые случайные попытки. Все заключенные выигрывают тогда и только тогда, когда в перестановке «номер ящика -> имя внутри» нет цикла длины больше 50. Если цикл длины \\(m \\le 50\\), каждый заключенный из этого цикла, начав со своего ящика, найдет свое имя ровно за \\(m\\) шагов или раньше. Если есть цикл длины \\(m>50\\), все участники этого цикла не успеют пройти его целиком, и стратегия проиграет.\n\nВероятность не иметь цикла длины больше 50 равна \\(1 - \\sum_{m=51}^{100} 1/m\\), потому что для каждого \\(m>50\\) в перестановке не может быть двух таких длинных циклов, а вероятность, что фиксированная перестановка содержит цикл длины \\(m\\), равна \\(1/m\\). Численно это примерно 0.3118, то есть больше 30%.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
