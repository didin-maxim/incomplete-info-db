      "id": "str-two-cases-for-a",
      "title": "Разобрать, кто такой A",
      "text": "Если A рыцарь, то его фраза верна, значит B и C одного типа. Тогда A и B одного типа ровно в том случае, когда C рыцарь: если C рыцарь, он честно ответит «да», а если C лжец, истинный ответ был бы «нет», и C соврет, тоже сказав «да».\n\nЕсли A лжец, то его фраза ложна, значит B и C разных типов. Тогда A и B одного типа снова ровно в том случае, когда C рыцарь: если C рыцарь, то B лжец, как и A, и C честно ответит «да»; если C лжец, то B рыцарь, A и B разных типов, и C соврет, снова сказав «да».\n\nВо всех возможных случаях C ответит «да».",
