        "title": "Трое островитян и вопрос к C",
        "text": "На острове каждый житель либо рыцарь, который всегда говорит правду, либо лжец, который всегда лжет. Вы встретили трех островитян A, B и C. Два островитянина называются одного типа, если они оба рыцари или оба лжецы.\n\nA говорит: «B и C одного типа». После этого вы спрашиваете C: «A и B одного типа?» Можно ли заранее определить, что ответит C?",
