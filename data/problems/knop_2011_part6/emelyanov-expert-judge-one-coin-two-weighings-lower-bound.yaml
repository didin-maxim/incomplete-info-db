        "id": "stmt-knop-d44",
        "title": "Судья не знает знак фальшивости",
        "text": "Из 100 монет ровно одна фальшивая, и эксперт знает, какая именно. Судья знает, что фальшивая монета одна, но не знает, легче она или тяжелее настоящих. Докажите, что эксперту потребуется не меньше двух взвешиваний, чтобы убедить судью в фальшивости данной монеты.",
