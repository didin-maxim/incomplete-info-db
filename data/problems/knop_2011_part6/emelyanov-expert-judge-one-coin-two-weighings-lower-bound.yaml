        "symmetry_breaking",
        "parity_argument"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-two-weighings-suffice",
      "title": "Два взвешивания действительно достаточно",
      "text": "Если эксперт знает фальшивую монету, он может сравнить ее с двумя разными настоящими монетами. В обоих взвешиваниях указанная монета окажется на одной и той же стороне неравенства: либо тяжелее обеих настоящих, либо легче обеих настоящих. Если бы указанная монета была настоящей, то для двух таких неравенств потребовались бы две разные фальшивые монеты среди эталонов, что противоречит условию о ровно одной фальшивой. Поэтому два результата убеждают судью, что именно выбранная монета фальшивая.",
      "standard_idea_ids": [
        "certificate"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "balance_scale"
      ]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "proof-one-weighing-not-enough",
      "title": "Одно взвешивание не дает однозначного сертификата",
      "text": "В одном взвешивании эксперт либо предъявляет неравенство, либо равенство. При неравенстве обе чаши симметричны для судьи: без знания знака он не может заключить, что фальшивая монета находится на указанной стороне. При равенстве фальшивая монета должна быть вне весов; поскольку всего монет 100, число отложенных монет четно и не может быть равно 1. Значит одно взвешивание не может доказать, что фальшива именно данная монета.",
