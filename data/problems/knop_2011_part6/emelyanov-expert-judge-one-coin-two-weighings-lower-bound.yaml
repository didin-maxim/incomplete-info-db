    {
      "id": "idea-one-weighing-parity",
      "title": "Одно взвешивание оставляет симметричную неопределенность",
      "text": "Если эксперт показывает неравенство, судья не может понять, на какой чаше находится фальшивая монета. Если показывает равенство, фальшивая монета может быть любой из отложенных, а их четное число и потому больше одной.",
