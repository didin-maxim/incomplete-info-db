      "id": "str-two-light-fakes",
      "title": "Доказательство для двух легких фальшивых",
      "text": "Пусть эксперт знает, что монеты 1 и 2 - легкие фальшивые, а монеты 3, 4, 5 настоящие. Он показывает два неравенства: \\(1<3\\) и \\(2+3<4+5\\). Первое неравенство сразу доказывает две вещи: фальшивые монеты именно легче настоящих, монета 1 фальшивая, а монета 3 настоящая.\n\nПосле этого среди монет, кроме 1, остается ровно одна фальшивая легкая монета. Рассмотрим второе неравенство. Если монета 2 была бы настоящей, то левая чаша весила бы как две настоящие монеты, а правая - не больше двух настоящих монет; строгого неравенства \\(2+3<4+5\\) быть не могло. Значит, монета 2 - вторая легкая фальшивая. Тогда монеты 4 и 5 уже не могут быть фальшивыми, потому что фальшивых всего две. Так судья узнает и пару фальшивых монет, и направление отличия.\n\nЕсли настоящие фальшивые монеты тяжелее, эксперт использует ту же схему с обратными знаками: показывает \\(1>3\\) и \\(2+3>4+5\\). Рассуждение полностью симметрично.",
