        "title": "Судья знает, что фальшивых две",
        "text": "Судья знает, что среди 100 монет ровно две фальшивые, их веса равны и отличаются от веса настоящих монет. Эксперт знает, какие именно монеты фальшивы и в какую сторону отличается их вес. Как ему за два взвешивания убедить судью во всей этой информации?",
