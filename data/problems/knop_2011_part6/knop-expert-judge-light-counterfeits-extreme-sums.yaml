      "id": "str-three-and-six-light-fakes",
      "title": "Сертификаты из книги",
      "text": "Для трех легких фальшивых пусть монеты 1-3 фальшивые, а 4-6 настоящие. Эксперт показывает \\(1<4\\) и \\(2+3+4<1+5+6\\).\n\nДля шести легких фальшивых достаточно использовать 13 монет: 1-6 фальшивые, 7-13 настоящие. Эксперт показывает \\(1<7\\), затем \\(2+3+7<1+8+9\\), затем \\(4+5+6+7+8+9<2+3+10+11+12+13\\).",
