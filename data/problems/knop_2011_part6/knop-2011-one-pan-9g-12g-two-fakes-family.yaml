        "id": "stmt-d34-d36",
        "title": "Две фальшивые среди 10-граммовых монет",
        "text": "Среди данных 10-граммовых монет ровно две фальшивые: одна весит 9 г, другая - 12 г. Нужно определить обе фальшивые монеты при помощи одночашечных весов со стрелкой. В книге поставлены три задачи: Д.34 - найти обе фальшивые из четырех монет за два взвешивания; Д.35 - решить, можно ли найти обе фальшивые из девяти монет за три взвешивания; Д.36 - найти обе такие фальшивые из \\(2^n\\) монет за \\(n\\) взвешиваний.",
        "source_ids": [
          "src-knop-2011-weighings-algorithms"
        ],
        "status": "source_verified",
        "self_contained": {
          "status": "ai_checked"
        },
