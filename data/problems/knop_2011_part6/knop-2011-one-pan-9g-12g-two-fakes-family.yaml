          "decision_tree"
        ]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-four-outcomes-one-pan",
      "title": "Одно взвешивание сообщает попадание каждой фальшивки",
      "text": "Если на весы положено \\(k\\) монет, то нормальный вес равен \\(10k\\). Отклонения от него равны 0, \\(-1\\), \\(+2\\) или \\(+1\\) граммам в четырех случаях: на чаше нет фальшивых, лежит только 9-граммовая, лежит только 12-граммовая, лежат обе. Значит одно взвешивание дает два двоичных ответа: попала ли в выбранное множество легкая фальшивая и попала ли тяжелая.",
      "standard_idea_ids": [
        "binary_encoding",
        "partition_state_space"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-binary-labels-for-two-special-coins",
      "title": "Биты выбранных множеств становятся номерами двух монет",
      "text": "Если заранее сопоставить каждой монете двоичный номер, то взвешивание по очередному биту сообщает этот бит отдельно для 9-граммовой и для 12-граммовой фальшивой монеты.",
      "standard_idea_ids": [
        "binary_encoding"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-d34-four-coins",
      "title": "Д.34: два взвешивания для четырех монет",
      "text": "Взвесим монеты 1 и 2, затем монеты 1 и 3. В каждом взвешивании по отклонению от нормального веса узнаем, какие из двух фальшивых монет попали на чашу: 9-граммовая, 12-граммовая, обе или ни одна.\n\nДля каждой из двух фальшивых монет получаем пару ответов о попадании в множества \\(\\{1,2\\}\\) и \\(\\{1,3\\}\\). Пара «да, да» означает монету 1, «да, нет» - монету 2, «нет, да» - монету 3, «нет, нет» - монету 4. Так определяются и 9-граммовая, и 12-граммовая монеты.",
      "standard_idea_ids": [
        "binary_encoding"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "decision_tree"
      ]
    },
    {
      "id": "str-d36-binary-code",
      "title": "Д.36: двоичные номера для \\(2^n\\) монет",
      "text": "Пронумеруем монеты всеми двоичными словами длины \\(n\\). В \\(j\\)-м взвешивании положим на чашу все монеты, у которых \\(j\\)-й бит номера равен 1. Отклонение от нормального веса сообщает, лежит ли среди этих монет 9-граммовая фальшивая и лежит ли 12-граммовая. После \\(n\\) взвешиваний мы знаем все биты номера каждой из двух фальшивых монет.\n\nЭто та же индукция, что в книге: первое взвешивание половины монет сообщает, в какой половине находится каждая фальшивая монета; дальше подозрительные множества либо совпадают, либо не пересекаются, и каждое из них делится пополам на следующем шаге.",
      "standard_idea_ids": [
        "binary_encoding",
        "partition_state_space"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "decision_tree"
      ]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "imp-d35-nine-coins-three-weighings",
      "title": "Д.35: девять монет за три взвешивания невозможны",
      "text": "Скрытое состояние задается выбором 9-граммовой и 12-граммовой монеты. Таких состояний \\(9\\cdot8=72\\). Одно взвешивание на одночашечных весах в этой задаче имеет не более четырех информативных исходов: ни одной фальшивой на чаше, только 9-граммовая, только 12-граммовая, обе. Поэтому три взвешивания различают не более \\(4^3=64\\) исходовых слов. Так как \\(72>64\\), гарантированно определить обе фальшивые монеты невозможно.",
      "standard_idea_ids": [
        "decision_tree_lower_bound"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "information_lower_bound"
      ]
    }
