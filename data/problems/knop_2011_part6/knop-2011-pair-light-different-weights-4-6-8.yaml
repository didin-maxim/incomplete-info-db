  "ideas": [
    {
      "id": "idea-equality-means-two-genuine",
      "title": "Равенство двух монет означает две настоящие",
      "text": "Две фальшивые монеты имеют разные веса, поэтому равенство при сравнении одной монеты с одной возможно только для двух настоящих монет. Это позволяет склеивать случаи: равная пара сразу исключается, а неравная пара часто содержит ровно одну фальшивую монету.",
      "standard_idea_ids": [
        "partition_state_space"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-four-coin-block",
      "title": "Четырехмонетный блок распадается по двум парам",
      "text": "Сравнение двух пар внутри блока из четырех монет либо находит две настоящие монеты, либо разбивает фальшивые по двум неравным парам. Поэтому блок из четырех можно закрыть двумя простыми сравнениями, а более крупные случаи сводятся к одному или двум таким блокам.",
      "standard_idea_ids": [
        "partition_state_space"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-d31-four-coins",
      "title": "Д.31: четыре монеты",
      "text": "Сравним монеты 1 и 2, затем монеты 3 и 4. Если одно из сравнений дало равенство, то эта пара состоит из двух настоящих монет, а две оставшиеся монеты фальшивые. Если оба сравнения дали неравенство, то в каждой паре ровно одна фальшивая монета; это более легкая монета в своей паре.",
      "standard_idea_ids": [
        "partition_state_space"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "balance_scale",
        "decision_tree"
      ]
    },
    {
      "id": "str-d32-six-coins",
      "title": "Д.32: шесть монет",
      "text": "Сначала сравним монеты 1 и 2. Если они равны, то обе настоящие, и среди монет 3, 4, 5, 6 остается задача Д.31.\n\nЕсли, например, монета 1 легче монеты 2, то фальшива монета 1, а вторая фальшивая либо монета 2, либо одна из монет 3, 4, 5, 6. Сравним \\(2+3\\) с \\(4+5\\). Если равновесие, то вторая фальшивая монета - 6. Если левая чаша легче, то вторая фальшивая среди 2 и 3; сравним 2 и 3 и выберем более легкую. Если правая чаша легче, то вторая фальшивая среди 4 и 5; сравним 4 и 5 и выберем более легкую. Случай, когда монета 2 легче монеты 1, симметричен.",
      "standard_idea_ids": [
        "partition_state_space"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "balance_scale",
        "decision_tree"
      ]
    },
    {
      "id": "str-d33-eight-coins",
      "title": "Д.33: восемь монет",
      "text": "Сравним \\(1+2\\) с \\(3+4\\), а также \\(5+6\\) с \\(7+8\\). Два равновесия невозможны.\n\nЕсли оба сравнения дали неравенство, то в каждом четырехмонетном блоке есть ровно одна фальшивая монета, и она лежит на более легкой чаше своего сравнения. Оставшимися двумя взвешиваниями сравним монеты внутри каждой из двух более легких пар; более легкая монета в каждой паре фальшивая.\n\nЕсли одно сравнение дало равновесие, то обе фальшивые монеты находятся в другом блоке из четырех монет. Пусть в этом блоке одна пара тяжелее другой. Сравним две монеты из более тяжелой пары. Если они равны, то они настоящие, а обе монеты более легкой пары фальшивые. Если они не равны, то более легкая из них фальшивая; последним взвешиванием сравним две монеты из другой пары и выберем более легкую из них.",
      "standard_idea_ids": [
        "partition_state_space"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "balance_scale",
        "decision_tree"
      ]
    }
