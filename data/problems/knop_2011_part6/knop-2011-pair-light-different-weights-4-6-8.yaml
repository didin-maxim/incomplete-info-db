        "id": "stmt-d31-d33",
        "title": "Две фальшивые легче настоящих, но между собой не равны",
        "text": "Среди внешне одинаковых монет ровно две фальшивые. Обе они легче настоящих монет, но одна фальшивая монета легче другой. Нужно найти обе фальшивые монеты на чашечных весах: Д.31 - из четырех монет за два взвешивания; Д.32 - из шести монет за три взвешивания; Д.33 - из восьми монет за четыре взвешивания. В первых двух задачах не требуется выяснять, какая из двух фальшивых монет легче.",
