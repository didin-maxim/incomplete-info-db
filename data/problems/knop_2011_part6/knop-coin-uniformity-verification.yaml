        ]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-verification-is-nonadaptive",
      "title": "Неравенство сразу дает отрицательный ответ",
      "text": "Если хотя бы одно взвешивание дало неравенство, одинаковость всех монет уже опровергнута. Поэтому доказательство одинаковости должно состоять из заранее заданной системы равенств, из которой логически следует равенство весов всех монет.",
      "standard_idea_ids": [
        "linear_constraints"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-small-and-parametric-cases",
      "title": "Системы равенств для случаев из книги",
      "text": "Для 4 монет разделим их на две пары, проверим равенство пар, затем проверим равенство двух монет внутри одной пары. Для 8 монет повторим деление пополам три раза.\n\nДля 10 монет разделим их на группы размеров 1, 2, 3 и 4. Достаточно проверить равенства \\(1+2=3\\), \\(1+3=4\\) и \\(2+3=1+4\\). Если все три равенства выполнены, то веса всех групп совпадают с их размерами в общей единице, а значит все десять монет одного веса.\n\nСлучай \\(10^n\\) получается индукцией: рассматриваем десять блоков по \\(10^{n-1}\\) монет как десять больших монет и применяем схему для 10 объектов, а внутри каждого блока используем ту же проверку. Для 30 монет Кноп дает систему групп размеров 2, 5, 6, 8 и 9 с четырьмя проверками: \\(2+6=8\\), \\(5+6=2+9\\), \\(5+9=6+8\\), \\(2+5+8=6+9\\).",
      "standard_idea_ids": [
        "linear_constraints",
        "induction"
      ],
