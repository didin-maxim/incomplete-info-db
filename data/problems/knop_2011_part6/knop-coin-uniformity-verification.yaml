        "id": "stmt-knop-d37-d40",
        "title": "Четыре задания на проверку",
        "text": "Среди данных монет могут быть монеты двух весов: если фальшивые есть, то все они весят одинаково. Нужно с помощью заранее спланированных чашечных взвешиваний убедиться, что на самом деле все данные монеты весят одинаково. В книге предложены случаи: 4 монеты за 2 взвешивания, 8 монет за 3 взвешивания, 10 монет за 3 взвешивания, \\(10^n\\) монет за \\(3n\\) взвешиваний и 30 монет за 4 взвешивания.",
        "source_ids": [
          "src-knop-2011-weighings-algorithms"
        ],
        "status": "source_verified",
        "self_contained": {
