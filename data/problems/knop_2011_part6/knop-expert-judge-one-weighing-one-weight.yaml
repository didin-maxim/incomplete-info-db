    {
      "id": "idea-one-role-forced-by-extreme-sums",
      "title": "Один предмет получает вынужденный вес через крайние суммы",
      "text": "Судье не нужно восстановить всю перестановку весов. Достаточно устроить равенство или строгий перевес так, чтобы при известных весах \\(1,2,\\ldots,N\\) только один вес мог находиться в особой роли: на одиночной чаше или вне весов.",
      "standard_idea_ids": ["knowledge_elimination"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-four-extreme-certificates",
      "title": "Четыре одноходовых сертификата",
      "text": "Для \\(N=3\\) эксперт кладет гирьку 3 г на одну чашу, а гирьки 1 г и 2 г - на другую. Равенство возможно единственным образом: одиночная гирька весит 3 г.\n\nДля \\(N=7\\) эксперт кладет гирьку 7 г на одну чашу, а гирьки 1 г, 2 г и 3 г - на другую. Одиночная гирька может перевесить три другие только в случае \\(7>1+2+3\\); если бы одиночная гирька весила 6 г или меньше, три другие весили бы не меньше 6 г. Поэтому судья узнает гирьку 7 г.\n\nДля \\(N=8\\) эксперт оставляет гирьку 6 г вне весов и показывает равенство \\(7+8=1+2+3+4+5\\). Сумма всех весов равна 36. Если вне весов лежит вес \\(x\\), то при равенстве сумма каждой чаши равна \\((36-x)/2\\). Для двух гирек на левой чаше такая сумма возможна только при \\(x=6\\): тогда это \\(15=7+8\\). Значит, судья определяет невзвешенную гирьку 6 г.\n\nДля \\(N=25\\) эксперт оставляет гирьку 18 г вне весов и кладет \\(19+20+21+22+23+24+25\\) против \\(1+2+\\cdots+17\\). Левая чаша перевешивает: \\(154>153\\). Если невзвешенная гирька имела бы вес не больше 17, то минимальная сумма 17 гирек на другой чаше была бы не меньше 154. Если бы она имела вес не меньше 19, то максимальная сумма 7 гирек на левой чаше была бы не больше 153. Поэтому строгий перевес возможен только при невзвешенной гирьке 18 г.",
      "standard_idea_ids": ["knowledge_elimination"],
      "status": "ai_checked",
      "definition_ids": ["balance_scale"]
    }
  ],
