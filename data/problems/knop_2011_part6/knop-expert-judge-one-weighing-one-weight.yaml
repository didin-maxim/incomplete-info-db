        "id": "stmt-knop-d16",
        "title": "Судья должен узнать вес одной гирьки",
        "text": "У эксперта есть затейливый набор из \\(N\\) гирек весами 1, 2, ..., \\(N\\) г. Эксперт знает, какая гирька сколько весит, и хочет убедить в этом судью. Он берется так провести одно взвешивание на чашечных весах без других гирь, чтобы судья сам смог определить вес одной из гирек. Как это сделать, если а) \\(N=3\\); б) \\(N=7\\); в) \\(N=8\\); г) \\(N=25\\)?",
        "source_ids": ["src-knop-2011-weighings-algorithms"],
        "status": "source_verified",
