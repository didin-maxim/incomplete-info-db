        "id": "stmt-knop-d41-d43",
        "title": "Три задачи на альтернативу 0 или k",
        "text": "Даны внешне одинаковые монеты, и известно, что возможны только два случая: фальшивых монет нет или их ровно \\(k\\). Нужно за несколько чашечных взвешиваний выяснить, какой случай имеет место. В книге приведены случаи: 12 монет и \\(k=6\\) за 2 взвешивания; 17 монет и \\(k=5\\) за 2 взвешивания; 96 монет и \\(k=48\\) за 3 взвешивания.",
        "source_ids": [
          "src-knop-2011-weighings-algorithms"
        ],
        "status": "source_verified",
        "self_contained": {
