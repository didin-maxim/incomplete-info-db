  },
  "ideas": [
    {
      "id": "idea-divisibility-after-equalities",
      "title": "Равенства навязывают делимость числа фальшивых",
      "text": "Положительный ответ «фальшивых нет» получается, когда все заранее выбранные сравнения дают равенство. Эти равенства заставляют число фальшивых в проверяемых группах быть кратным некоторому числу; выбранное \\(k\\) этой кратности не удовлетворяет.",
      "standard_idea_ids": [
        "divisibility_argument",
        "linear_constraints"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-three-knop-cases",
      "title": "Группировки из решений Кнопа",
      "text": "Для 12 монет разделим их на четыре группы по 3 монеты и за два взвешивания проверим, что все четыре группы весят одинаково. Тогда число фальшивых должно быть кратно 4, а значит случай с 6 фальшивыми невозможен.\n\nДля 17 монет разделим монеты на группы размеров 2, 3, 5 и 7. Если взвешивания дают \\(2+3=5\\) и \\(2+5=7\\), то пять фальшивых невозможны.\n\nДля 96 монет отложим одну монету, остальные разделим на группы 19, 19, 19 и 38. Если три группы по 19 весят поровну, а группа из 38 весит вдвое больше, то число фальшивых среди 95 монет кратно 5; с учетом отложенной монеты это исключает как 48, так и 47 фальшивых среди этих 95.",
      "standard_idea_ids": [
        "divisibility_argument",
        "linear_constraints"
      ],
