  "ideas": [
    {
      "id": "idea-maximal-3g-sum",
      "title": "Четыре трехграммовые монеты имеют ту же сумму, что три четырехграммовые",
      "text": "Если эксперт кладет на одну чашу четыре заявленные монеты по 3 г, а на другую три заявленные монеты по 4 г и получает равенство, то левая сумма не может быть больше 12 г, а правая не может быть меньше 12 г. Равенство заставляет все выбранные монеты иметь заявленные веса.",
      "standard_idea_ids": [
        "extreme_sum_argument"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-four-threes-equal-three-fours",
      "title": "Показать равенство \\(3+3+3+3=4+4+4\\)",
      "text": "Эксперт кладет на левую чашу четыре монеты, которые он объявляет трехграммовыми, а на правую три монеты, которые он объявляет четырехграммовыми. Равенство весов дает сумму 12 г на каждой чаше. Четыре монеты слева не могут весить меньше 12 г, если каждая весит 3 или 4 г, поэтому все они весят по 3 г. Три монеты справа не могут весить больше 12 г, поэтому все они весят по 4 г. Оставшаяся восьмая монета имеет последний неиспользованный вес по известному судье составу.",
