        "title": "Четыре монеты по 3 г и четыре по 4 г",
        "text": "Эксперт предъявляет судье 8 одинаковых по внешнему виду монет. Судья знает, что половина из них весит по 3 г, а остальные по 4 г. Как эксперт может за одно взвешивание доказать судье вес каждой монеты?",
