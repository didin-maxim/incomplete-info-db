  "ideas": [
    {
      "id": "idea-repeated-weights-extreme-sums",
      "title": "Крайние равенства и неравенства выделяют блоки весов",
      "text": "Сравнения подбираются так, чтобы равенство или строгое неравенство было возможно только при самых легких гирях на одной стороне и самых тяжелых на другой. После этого задача распадается на меньшие блоки.",
      "standard_idea_ids": [
        "extreme_sum_argument"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-knop-repeated-weights-hints",
      "title": "Сертификаты из кратких решений",
      "text": "Для 8 гирь книга дает три уровня сертификатов: четыре взвешивания \\(1=1\\), \\(2=2\\), \\(1+1+2+2=3+3\\), \\(3+3<4+4\\); три взвешивания \\(1+1=2\\), \\(2+2=4\\), \\(4=4\\); два взвешивания \\(1+1+2_1=4_1\\), \\(1+1+2_2=4_2\\).\n\nДля 10 гирь используются два взвешивания: \\(1+1+2+2+3<5+5\\), затем \\(1+1+3_2+5<3_1+4+4\\). Первое выделяет обе гири 5 г и два блока, второе выбирает в каждом блоке крайние элементы.\n\nДля 45 гирь минимум равен 2. Первое взвешивание сравнивает \\(9\\times1+8\\times2+7\\times3\\) с \\(1\\times9+2\\times8+3\\times7\\). Второе сравнивает \\(9\\times1+6\\times4+3\\times7\\) с \\(1\\times9+4\\times6+7\\times3\\). Эти равенства выделяют группы 1-3 г, 4-6 г и 7-9 г и затем окончательно определяют веса.",
      "standard_idea_ids": [
        "extreme_sum_argument",
        "certificate"
      ],
      "status": "needs_human_review",
      "definition_ids": [
        "balance_scale"
      ]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-45-at-least-two",
      "title": "Почему для 45 гирь не может хватить одного взвешивания",
      "text": "Книга указывает ответ «за 2» для задачи о 45 гирях. Нижняя оценка в этой карточке оставлена для ручной проверки: одно равенство или неравенство должно исключать слишком мало перестановок мультимножества весов, чтобы полностью восстановить все 45 подписей.",
