        "text": "Нужно предложить план решения задачи Саладина для 12 монет, состоящий из четырех заранее указанных взвешиваний. После этого исполнитель может отказаться от любого одного взвешивания, провести три остальных и сообщить, какое взвешивание отброшено и какие три результата получились. Требуется, чтобы по этим данным всё равно можно было найти фальшивую монету и определить, легче она или тяжелее.",
