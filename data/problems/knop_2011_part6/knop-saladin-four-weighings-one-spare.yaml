      "title": "План Кнопа для монет 1-9, A, B, C",
      "text": "Обозначим 12 монет символами \\(1,2,\\ldots,9,A,B,C\\). Заранее объявим четыре взвешивания:\n\n1. \\(1+2+3+A\\) против \\(4+5+6+B\\);\n2. \\(4+5+6+A\\) против \\(7+8+9+B\\);\n3. \\(1+4+7+B\\) против \\(2+5+8+C\\);\n4. \\(2+5+8+B\\) против \\(3+6+9+C\\).\n\nЕсли отброшена одна строка, среди трех оставшихся есть либо строки 1 и 2, либо строки 3 и 4. В каждой такой паре монеты распределяются по трем группам возможных результатов как в стандартной схеме решения задачи Саладина; оставшаяся строка разделяет монеты внутри соответствующих групп. Поэтому любые три из четырех строк дают полноценный трехходовый план для 12 монет неизвестного знака.",
