      "text": "Возьмем любой план для задачи: 13 подозрительных монет, одна точно настоящая монета, одна фальшивая неизвестного знака, три взвешивания должны найти монету и знак. Четырнадцатую подозрительную монету не будем класть ни в одно из трех взвешиваний.\n\nЕсли среди первых 13 монет есть фальшивая, результаты будут ненулевой цепочкой и читаются по прежней таблице. Если все три результата равны, то фальшивая монета не участвовала ни в одном взвешивании, значит это четырнадцатая монета. В этом единственном случае знак отличия действительно не определяется, но по условию он и не нужен.",
