      "id": "idea-extreme-sums-six-weights",
      "title": "Равенство и неравенство фиксируют крайние веса",
      "text": "Первое равенство выделяет гирю 6 г как сумму 1+2+3. После этого второе строгое неравенство вынуждает, какая из оставшихся гирь весит 5 г, а какая из трех малых гирь весит 1 г и 3 г.",
