      "title": "Равенство и неравенство фиксируют крайние веса",
      "text": "Первое равенство выделяет гирю 6 г как сумму 1+2+3. Второе строгое неравенство отделяет оставшиеся веса так, что альтернативная перестановка невозможна.",
