      "title": "Два взвешивания из решения",
      "text": "Если эксперт называет гири их истинными весами, он показывает равенство \\(1+2+3=6\\), а затем неравенство \\(1+6<3+5\\). Эти два публичных результата должны позволить судье восстановить соответствие гирь весам 1, 2, 3, 4, 5, 6.",
