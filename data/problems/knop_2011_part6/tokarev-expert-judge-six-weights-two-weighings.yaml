  "strategies": [
    {
      "id": "str-tokarev-two-weighings",
      "title": "Два взвешивания из решения",
      "text": "Эксперт сначала называет гири их истинными весами и показывает равенство \\(1+2+3=6\\). Судья знает, что веса - это числа от 1 до 6. Сумма трех разных положительных весов может равняться весу одной другой гири только как \\(1+2+3=6\\): если в тройке есть 4 или 5, сумма уже больше 6. Значит, гиря, названная 6-граммовой, действительно весит 6 г, а гири, названные 1, 2, 3 г, имеют веса 1, 2, 3 в некотором порядке.\n\nОсталось отличить их порядок и веса 4, 5. Вторым взвешиванием эксперт показывает строгий перевес \\(1+6<3+5\\). Если гиря, названная 5-граммовой, весила бы 4 г, правая чаша весила бы не больше \\(3+4=7\\), а левая не меньше \\(1+6=7\\), так что строгий перевес был бы невозможен. Значит, эта гиря действительно весит 5 г, а оставшаяся неназванная в формулах гиря весит 4 г. Теперь неравенство имеет вид \\(w_1+6<w_3+5\\), то есть \\(w_3-w_1>1\\). Среди весов \\(1,2,3\\) это возможно только при \\(w_1=1\\) и \\(w_3=3\\); оставшаяся гиря из первой тройки весит 2 г. Все шесть весов восстановлены единственно.",
      "standard_idea_ids": [
        "extreme_sum_argument",
        "certificate"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "balance_scale"
      ]
    }
