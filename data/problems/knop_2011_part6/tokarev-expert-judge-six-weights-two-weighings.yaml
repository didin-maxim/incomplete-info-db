        "id": "stmt-knop-d49",
        "title": "Шесть последовательных весов",
        "text": "Эксперт предъявил суду 6 гирь. Он знает вес каждой гири, а судья знает только то, что веса гирь - последовательные целые числа от 1 до 6 г. Как эксперт должен проделать два взвешивания, чтобы доказать судье вес каждой гири?",
