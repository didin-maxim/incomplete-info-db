        "title": "Смешанный знак для 27 монет",
        "text": "Есть 27 монет, часть из них серебряные, остальные золотые. Ровно одна монета фальшивая, остальные настоящие; настоящая серебряная монета отличается по весу от настоящей золотой. Серебряная фальшивая монета легче настоящей серебряной, а золотая фальшивая тяжелее настоящей золотой. Нужно найти фальшивую монету за три взвешивания.",
