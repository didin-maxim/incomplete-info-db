      "id": "str-paired-trisection",
      "title": "Трижды оставить треть подозрительных состояний",
      "text": "Разобьем монеты на пары одного металла, кроме, возможно, одной непарной монеты. Для первого взвешивания выберем девять таких пар и разложим каждую пару по разным чашам. Если весы равны, подозрительны девять отложенных монет. Если есть перекос, подозрительны серебряные монеты с легкой чаши и золотые монеты с тяжелой чаши; их тоже ровно девять.\n\nВо втором взвешивании применим тот же прием к девяти подозрительным монетам: выделим четыре пары одного металла, три пары разложим по чашам, а остальные монеты отложим. После результата останется три подозрительные монеты, причем среди них есть пара одного металла. Третьим взвешиванием сравним эту пару: если одна монета проявляет нужный для своего металла перекос, она фальшивая; если пара равна, фальшива третья подозрительная монета.",
