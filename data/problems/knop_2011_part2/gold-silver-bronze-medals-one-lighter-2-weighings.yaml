      "text": "Чтобы исход взвешивания говорил о фальшивой медали, при настоящих медалях чаши должны быть равны: одинаковое число серебряных и одинаковое число бронзовых медалей на каждой чаше. После равенства часть медалей становится надежным балластом для второго взвешивания.",
