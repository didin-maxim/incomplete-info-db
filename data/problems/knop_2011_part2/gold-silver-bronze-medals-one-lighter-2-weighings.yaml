      "id": "str-first-weigh-one-silver-two-bronze",
      "title": "Первым взвешиванием оставить три подозрительные медали",
      "text": "Обозначим серебряные медали \\(S_1,S_2,S_3\\), бронзовые \\(B_1,\\ldots,B_5\\), золотую \\(G\\). Сравним \\(S_1+B_1+B_2\\) и \\(S_2+B_3+B_4\\). Если одна чаша легче, то подозрительны серебряная и две бронзовые медали с этой чаши; сравнение двух бронзовых медалей со второй чаши находит фальшивую, а равновесие в этом втором взвешивании указывает на серебряную. Если первое взвешивание дало равновесие, подозрительны \\(G,S_3,B_5\\), а остальные медали настоящие. Тогда сравним \\(S_3+B_1\\) и \\(S_1+B_5\\): равновесие указывает на золотую медаль, а перекос показывает, какая из двух подозрительных медалей легче своей настоящей пары.",
