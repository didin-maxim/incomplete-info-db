        "title": "Одна фальшивая медаль среди трех металлов",
        "text": "Есть одна золотая, три серебряные и пять бронзовых медалей. Известно, что одна медаль фальшивая и весит легче настоящей медали того же металла. Настоящие медали одного металла весят одинаково, а настоящие медали разных металлов весят по-разному. Нужно за два взвешивания на чашечных весах без гирь найти фальшивую медаль.",
