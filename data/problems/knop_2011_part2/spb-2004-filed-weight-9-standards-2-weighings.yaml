      "title": "Сравнить две равносуммные тройки",
      "text": "Первым взвешиванием сравним гирьки 100 г, 300 г и 700 г с гирьками 200 г, 400 г и 500 г. Номинальные суммы равны: 1100 г на каждой чаше. Если одна чаша легче, подпиленная гирька находится на ней; если равновесие, она среди гирек 600 г, 800 г и 900 г.\n\nПосле первого взвешивания есть три подозрительные гирьки, а остальные заведомо настоящие. Вторым взвешиванием сравним две подозрительные гирьки, уравновесив номинальные веса настоящими гирьками, если сами подозрительные имеют разные номиналы. Более легкий по сравнению с номинальным балансом вариант указывает подпиленную гирьку; равновесие указывает на третью подозрительную.",
