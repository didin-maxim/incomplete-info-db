        "id": "stmt-knop-d18",
        "title": "Доказать или опровергнуть ровно две фальшивые",
        "text": "В коллекции есть четыре гинеи. Нужно проверить, то есть доказать или опровергнуть, что среди них есть ровно две фальшивые гинеи, причем фальшивые равны друг другу и отличаются по весу от настоящих. Можно ли сделать это за два взвешивания на чашечных весах без гирь?",
        "source_ids": [
          "src-knop-2011-weighings-algorithms"
        ],
        "status": "source_verified",
        "self_contained": {
          "status": "ai_checked"
        },
