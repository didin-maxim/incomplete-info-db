  "ideas": [
    {
      "id": "idea-parity-after-pair-weighing",
      "title": "Первый результат подсказывает, какую проверку сделать второй",
      "text": "Если две гинеи против двух равны, то достаточно проверить одну пару внутри чаши. Если равенства нет, полезно поменять местами по одной гинее с разных чаш: изменение результата проверяет, была ли на каждой чаше ровно одна фальшивая.",
      "standard_idea_ids": [
        "parity_argument",
        "case_analysis"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-two-pairs-then-swap-or-compare",
      "title": "Сначала взвесить две против двух",
      "text": "Разделим гинеи на пары \\(A,B\\) и \\(C,D\\), сравним \\(A+B\\) с \\(C+D\\). Если чаши равны, вторым взвешиванием сравним \\(A\\) и \\(B\\). При равенстве все четыре гинеи одного веса, значит ровно двух фальшивых нет; при неравенстве в первой паре одна гинея одного веса и одна другого, и из равенства сумм следует то же для второй пары. Значит, гинеи разбиваются на две пары равного веса, то есть фальшивых ровно две.\n\nЕсли первое взвешивание не равно, вторым взвешиванием поменяем местами по одной гинее с разных чаш: сравним \\(A+C\\) с \\(B+D\\). Если теперь чаши равны, то в исходном неравном взвешивании каждая пара была однородной по весу: две гинеи одного веса против двух гиней другого веса. Это как раз случай ровно двух фальшивых. Если равенства снова нет, то при двух возможных весах остается только распределение \\(1+3\\) или \\(3+1\\), поэтому условие «ровно две фальшивые» ложно.",
      "standard_idea_ids": [
        "case_analysis"
      ],
