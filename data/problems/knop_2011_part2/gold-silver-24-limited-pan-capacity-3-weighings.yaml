      "id": "str-capacity-8-then-6",
      "title": "Использовать полный лимит, затем отделить тип фальшивки",
      "text": "В первом взвешивании положим на каждую чашу по четыре золотые и четыре серебряные монеты. При равновесии подозрительны четыре отложенные золотые и четыре отложенные серебряные; при перекосе подозрительны четыре золотые монеты с тяжелой чаши и четыре серебряные с легкой. Во всех случаях остаются восемь подозрительных монет: четыре каждого типа.\n\nВо втором взвешивании положим на одну чашу три подозрительные золотые и три подозрительные серебряные, а на другую - три уже известные настоящие золотые и три настоящие серебряные. Если перевесила чаша с подозрительными, фальшивая среди трех золотых; если она легче, фальшивая среди трех серебряных; если равновесие, фальшива одна из двух отложенных подозрительных монет. Третьим взвешиванием сравним две монеты нужного типа или одну подозрительную с настоящей монетой того же типа.",
