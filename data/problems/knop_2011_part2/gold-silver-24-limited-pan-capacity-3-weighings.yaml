        "text": "Среди 24 монет ровно половина золотые, остальные серебряные. Ровно одна монета фальшивая. Серебряная фальшивая монета легче настоящей серебряной, а золотая фальшивая тяжелее настоящей золотой. Если на чашу весов положить больше четырех золотых монет или больше четырех серебряных монет, весы сломаются; ровно по четыре монеты каждого типа на чаше весы выдерживают. Нужно найти фальшивую монету за три взвешивания.",
