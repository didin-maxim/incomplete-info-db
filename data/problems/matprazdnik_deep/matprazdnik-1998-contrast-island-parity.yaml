      "id": "str-odd-total-equivalence",
      "title": "Проверить эквивалентность двух заявлений",
      "text": "Пусть всего жителей нечетное число N, рыцарей R, лжецов L. Тогда R+L=N, поэтому R и L имеют разную четность. Значит, фразы «R четно» и «L нечетно» одновременно истинны или одновременно ложны.\n\nНо по условию каждый житель сказал одну из этих двух фраз. Если обе фразы истинны, то все сказавшие любую из них были бы рыцарями, и лжецов не осталось бы, что противоречит ложности лжецов только при отсутствии ложных фраз. Если обе фразы ложны, то все жители были бы лжецами, но тогда число рыцарей равно 0 и первая фраза стала бы истинной. В обоих случаях согласовать типы нельзя. Следовательно, нечетного числа жителей быть не может.",
