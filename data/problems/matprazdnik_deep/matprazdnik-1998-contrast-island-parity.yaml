      "id": "str-odd-total-equivalence",
      "title": "Проверить эквивалентность двух заявлений",
      "text": "Пусть всего жителей нечетное число \\(N\\), рыцарей \\(R\\), лжецов \\(L\\). Тогда \\(R+L=N\\), поэтому \\(R\\) и \\(L\\) имеют разную четность. Значит, фразы «\\(R\\) четно» и «\\(L\\) нечетно» одновременно истинны или одновременно ложны.\n\nПо условию каждый житель сказал одну из этих двух фраз. Если обе фразы истинны, то все жители сказали правду, то есть все они рыцари. Тогда \\(L=0\\), и фраза «\\(L\\) нечетно» ложна - противоречие. Если обе фразы ложны, то все жители солгали, то есть все они лжецы. Тогда \\(R=0\\), и фраза «\\(R\\) четно» истинна - снова противоречие. Поэтому нечетного числа жителей быть не может.",
      "standard_idea_ids": ["knowledge_elimination", "parity_encoding"],
      "status": "ai_checked",
      "definition_ids": ["truth_teller", "liar"]
