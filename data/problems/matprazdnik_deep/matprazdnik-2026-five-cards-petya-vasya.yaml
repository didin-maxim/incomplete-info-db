        "text": "Петя и Вася хотят показать фокус. У зрителей есть пять карточек с числами 1, 2, 3, 4, 5. Две из них зрители отдают Пете, одну - Васе, а две оставляют себе. Затем Петя называет число на одной из своих карточек, после чего Вася должен угадать одно из чисел, которые есть на руках у зрителей. Как договориться Пете и Васе, чтобы фокус всегда удавался?",
