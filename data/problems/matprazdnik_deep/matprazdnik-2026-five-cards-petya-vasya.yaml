      "text": "Заранее расположим числа по кругу в порядке 1,2,3,4,5. Для двух Петиних карточек выберем направление по кругу, в котором от одной до другой нужно сделать один или два шага; Петя называет вторую карточку этой дуги.\n\nПусть названо число E. Тогда Вася знает, что другая Петина карточка - одна из двух предыдущих по кругу позиций. Две следующие после E позиции не могут обе принадлежать Пете; из них максимум одна находится у Васи. Поэтому хотя бы одна из них точно у зрителей, и Вася называет такую карточку.",
