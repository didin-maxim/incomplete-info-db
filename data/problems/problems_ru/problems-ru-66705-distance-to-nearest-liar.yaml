    "original": [{"id": "stmt-original", "title": "Десять человек в вершинах правильного десятиугольника", "text": "В стране рыцарей и лжецов за круглым столом в вершинах правильного десятиугольника сидят 10 человек, среди них есть лжецы. Путешественник может выбрать точку вне стола и спросить всех: каково расстояние от меня до ближайшего лжеца среди вас? Все точно измеряют расстояния; рыцари отвечают правду, лжецы лгут. Нужно найти минимальное число вопросов, достаточное, чтобы гарантированно определить всех лжецов.", "source_ids": ["src-problems-ru-66705"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}],
    "generalized": [{"id": "stmt-general-regular-n-gon", "title": "Правильный n-угольник", "text": "Та же двухвопросная калибровка переносится на правильный \\(n\\)-угольник: после первого вопроса либо все ответы одинаковы, либо разные ответы дают пару, среди которой есть лжец; вторую точку выбирают рядом с этой парой так, чтобы ближайшие вершины были именно они. Тогда истинное расстояние до ближайшего лжеца известно и все ответы классифицируются.", "source_ids": ["src-problems-ru-66705"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]
