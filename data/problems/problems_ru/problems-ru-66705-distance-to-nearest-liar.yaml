  "strategies": [{"id": "str-two-questions", "title": "Первый вопрос ищет различающихся соседей, второй классифицирует всех", "text": "Зададим первый вопрос из произвольной разрешенной точки. Если все ответы одинаковы, то все сидящие лжецы: рыцарь и лжец не могли бы дать один и тот же ответ на вопрос с фиксированным истинным расстоянием. Иначе найдутся соседи, ответившие по-разному. Встанем в середину дуги между ними и зададим тот же вопрос. Среди этих двух соседей есть лжец, поэтому истинное расстояние до ближайшего лжеца теперь известно. Все, кто называют это расстояние, рыцари; остальные лжецы.\n\nОдного вопроса недостаточно: если точка вопроса разбивает вершины на несколько классов равных расстояний, можно построить две разные расстановки типов, дающие одинаковую картину ответов.", "standard_idea_ids": ["partition_state_space", "decision_tree_lower_bound"], "status": "ai_checked", "definition_ids": ["state_space"]}],
