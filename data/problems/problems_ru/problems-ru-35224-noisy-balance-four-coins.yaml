  "ideas": [{"id": "idea-avoid-equality-as-signal", "title": "Не полагаться на равновесие как на исход", "text": "Поскольку равные массы дают произвольный перекос, стратегия должна строиться только на знаке сравнения в заведомо неравных состояниях. Парные сравнения создают для каждой монеты свой рисунок участия.", "standard_idea_ids": ["ternary_weighing_code"], "status": "ai_checked"}],
