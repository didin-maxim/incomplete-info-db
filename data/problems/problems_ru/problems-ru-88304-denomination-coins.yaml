  "statements": {"original": [{"id": "stmt-original", "title": "Один номинал испорчен", "text": "Есть четыре бронзовые монеты номиналами 1, 2, 3 и 5 копеек. Настоящие монеты этих номиналов весят соответственно 1, 2, 3 и 5 граммов. Ровно одна монета фальшивая и отличается от своего настоящего веса. Нужно двумя взвешиваниями на чашечных весах без гирь определить, какая монета фальшивая.", "source_ids": ["src-problems-ru-88304"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "state_space"]}]},
  "ideas": [{"id": "idea-use-nominal-linear-relation", "title": "Использовать равенство настоящих весов 2 + 3 = 5", "text": "Первое взвешивание проверяет линейное соотношение между номинальными весами. Равновесие сразу исключает фальшь в участвующих монетах, а перекос оставляет малый набор направленных случаев.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-23-vs-5-then-21-vs-3", "title": "Сначала 2 и 3 против 5", "text": "Сравним монеты 2 и 3 копейки с монетой 5 копеек. Если равновесие, то все три участвующие монеты имеют правильные веса, значит фальшива монета 1 копейка.\n\nЕсли чаша с 5 копейками тяжелее, вторым взвешиванием сравним 2 + 1 с 3. При равновесии фальшива 5-копеечная монета. Если тяжелее 3, то фальшива 2-копеечная монета и она легче нормы. Если тяжелее 2 + 1, то фальшива 3-копеечная монета и она легче нормы. Случай, когда в первом взвешивании 5-копеечная монета легче, разбирается тем же вторым взвешиванием с обратными направлениями: равновесие указывает на 5 копеек, перекосы различают тяжелые 2 или 3 копейки.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["balance_scale"]}],
