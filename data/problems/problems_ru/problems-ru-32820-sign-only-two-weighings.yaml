  "statements": {"original": [{"id": "stmt-original", "title": "Легче или тяжелее, но не какая монета", "text": "Среди нескольких монет ровно одна фальшивая, которая отличается по весу от настоящих. За два взвешивания на чашечных весах без гирь нужно определить, легче или тяжелее фальшивая монета настоящей, не обязательно находя саму монету. Рассмотреть случаи 100, 99 и 98 монет.", "source_ids": ["src-problems-ru-32820"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "state_space"]}]},
  "ideas": [{"id": "idea-identify-side-not-coin", "title": "Достаточно отличить знак отклонения, а не монету", "text": "Первое взвешивание выбирает большую группу, в которой знак фальши проявляется по-разному: если фальшивая внутри тяжелой половины, она тяжелая; если вне нее, то она легкая. Второе взвешивание проверяет, сохранился ли перекос при разбиении или сравнении с третьей группой.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-three-cases-100-99-98", "title": "Разбор 100, 99 и 98 монет", "text": "Для 100 монет сравним 50 и 50. Затем более тяжелую половину разобьем на две группы по 25 и сравним их. Если второе взвешивание дает равновесие, фальшивая монета была в другой половине и она легче; если нет, она в более тяжелой четверти и тяжелее.\n\nДля 99 монет разделим монеты на три группы по 33 и сравним две группы. При равновесии сравним одну из них с третьей: если третья легче, фальшивая легкая, иначе тяжелая. При неравенстве сравним более тяжелую из первых двух групп с третьей: равновесие означает легкую фальшивую в более легкой первой группе, новый перекос - тяжелую фальшивую.\n\nДля 98 монет отложим две монеты, остальные разделим на две группы по 48 и сравним. Если равновесие, сравним две отложенные монеты с любыми двумя уже уравновешенными: направление второго перекоса дает знак. Если первое взвешивание дало неравенство, разобьем более тяжелую группу на две группы по 24 и сравним их; равновесие означает легкую фальшивую вне этой группы, неравенство - тяжелую внутри нее.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["balance_scale"]}],
