    "original": [{"id": "stmt-original", "title": "Две фразы соседям слева и справа", "text": "За круглым столом сидят 100 представителей трех племен: рыцари всегда говорят правду, лжецы всегда лгут, хитрецы могут говорить как правду, так и ложь. Каждый произнес две фразы: слева от него сидит лжец; справа от него сидит хитрец. Известно, что половина присутствующих - хитрецы. Нужно найти число рыцарей и число лжецов.", "source_ids": ["src-problems-ru-66431"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}],
    "generalized": [{"id": "stmt-general-n-t-tricksters", "title": "n мест и t хитрецов", "text": "Тот же аргумент не использует число 100, кроме итогового подсчета: если за круглым столом \\(n\\) людей и известно, что хитрецов \\(t\\), то все не-хитрецы разбиваются на пары «лжец справа от рыцаря». Поэтому при четном \\(n-t\\) рыцарей и лжецов по \\((n-t)/2\\).", "source_ids": ["src-problems-ru-66431"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]
  },
  "ideas": [{"id": "idea-local-pairing", "title": "Локальные высказывания образуют пары лжец-рыцарь", "text": "Правдивость двух соседних утверждений запрещает лжецу иметь справа лжеца или хитреца; справа от каждого лжеца должен стоять рыцарь, а слева от каждого рыцаря - лжец.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-pair-liars-and-knights", "title": "Спарить всех не-хитрецов", "text": "Если человек рыцарь, его первая фраза истинна, значит слева от него сидит лжец. Если человек лжец, его вторая фраза ложна, поэтому справа от него не хитрец; справа от него также не может сидеть лжец, иначе тот правдиво сказал бы, что слева лжец. Значит справа от каждого лжеца сидит рыцарь. Получается взаимное соответствие между лжецами и рыцарями среди 50 не-хитрецов, поэтому тех и других по 25.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
