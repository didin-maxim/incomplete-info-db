    "original": [{"id": "stmt-original", "title": "Взвешивания с расходом монет", "text": "Есть чашечные весы и 100 монет. Среди них есть фальшивые монеты, но их больше 0 и меньше 99. Все фальшивые одинаковы и легче настоящих, все настоящие одинаковы. Перед каждым взвешиванием нужно заплатить одну из монет, после чего она больше не участвует. Нужно доказать, что можно гарантированно обнаружить настоящую монету.", "source_ids": ["src-problems-ru-65055"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "strategy"]}],
    "generalized": [{"id": "stmt-general-n-paid-weighings", "title": "n монет, не все фальшивые и не единственная настоящая", "text": "Тот же протокол работает для любого \\(n\\ge 3\\), если фальшивых от 1 до \\(n-2\\): отложить одну монету как первую плату, а остальные \\(n-1\\) сравнивать соседней цепочкой, платя уже исключенными или предыдущими монетами. Первый перекос дает настоящую как более тяжелую, а цепочка равенств доказывает, что весь большой набор настоящий.", "source_ids": ["src-problems-ru-65055"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "strategy"]}]
  },
  "ideas": [{"id": "idea-chain-equalities", "title": "Цепочка равенств либо находит тяжелую, либо доказывает одинаковость большого набора", "text": "Так как настоящих монет не меньше двух, среди 99 монет после отложения одной платы есть настоящая. Последовательные сравнения соседних монет либо сразу дают настоящую как более тяжелую, либо показывают, что весь большой набор имеет один вес.", "standard_idea_ids": ["knowledge_elimination"], "status": "ai_checked"}],
  "strategies": [{"id": "str-pay-previous-coin", "title": "Отложить плату и сравнивать соседние монеты", "text": "Сначала отложим одну монету. Среди оставшихся 99 есть хотя бы одна настоящая. Пронумеруем эти 99 монет. Сравним первую со второй, заплатив отложенной монетой. Если одна из них тяжелее, она настоящая.\n\nЕсли они равны, сравним вторую с третьей, заплатив первой; затем третью с четвертой, заплатив второй, и так далее. При первом неравенстве более тяжелая из двух сравниваемых монет настоящая. Если все такие сравнения дали равенство, то все 99 пронумерованных монет весят одинаково. Среди них есть настоящая, значит все они настоящие, и любую оставшуюся из них можно указать.", "standard_idea_ids": ["knowledge_elimination"], "status": "ai_checked", "definition_ids": ["balance_scale"]}],
