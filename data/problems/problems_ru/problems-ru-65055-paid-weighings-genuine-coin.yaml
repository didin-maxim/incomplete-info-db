    "generalized": [{"id": "stmt-general-n-paid-weighings", "title": "n монет, не все фальшивые и не единственная настоящая", "text": "Есть чашечные весы и \\(n\\ge 3\\) монет. Среди них есть фальшивые монеты, но их больше 0 и меньше \\(n-1\\); все фальшивые одинаковы и легче настоящих, все настоящие одинаковы. Перед каждым взвешиванием нужно заплатить одну из монет, после чего она больше не участвует. Докажите, что можно гарантированно обнаружить настоящую монету.", "source_ids": ["src-problems-ru-65055"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "strategy"]}],
