    {
      "id": "str-fifty-moves-color-class",
      "title": "Проверить клетки одного цвета, начиная с внутренних",
      "text": "Раскрасим доску в два цвета и выберем тот цвет, у которого две угловые клетки. Проверяем клетки этого цвета в таком порядке: сначала все внутренние клетки, затем неугловые клетки на краю, затем одну из угловых клеток. Второй угол этого цвета оставляем непроверенным.\n\nЕсли в какой-то момент выбранная клетка оказалась с сокровищем, то вторая клетка должна быть среди ее соседей другого цвета. У внутренней клетки таких соседей 4, у краевой неугловой - 3, у угловой - 2. Внутренние клетки мы проверяем не позднее 32-го хода, краевые неугловые - не позднее 48-го, а проверяемый угол - 49-м ходом. После первого найденного сокровища можно по очереди спрашивать соседние клетки; последнюю из них спрашивать не надо, она определяется по отрицательным ответам. Поэтому общее число ходов не превысит 50.\n\nЕсли же первые 49 ответов были отрицательными, то клетка с сокровищем выбранного цвета - это оставленный угол. У него только две соседние клетки. Спрашиваем одну из них 50-м ходом: если ответ положительный, обе клетки найдены; если отрицательный, вторая клетка - другой сосед угла.",
      "standard_idea_ids": ["partition_state_space", "adaptive_questions", "adversary_strategy"],
      "status": "ai_checked",
      "definition_ids": ["state_space", "adaptive_strategy"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-forty-nine-not-enough",
      "title": "49 ходов не могут гарантировать ответ",
      "text": "Докажем, что после 49 отрицательных ответов всегда могут остаться по крайней мере две возможные соседние пары. Для этого достаточно заметить: любые 51 клетка доски \\(10\\times 10\\) содержат хотя бы две пары соседних клеток.\n\nВ самом деле, если в каждой строке выбрано не больше 5 клеток, всего выбрано не больше 50 клеток. Значит, среди 51 выбранной клетки есть строка, в которой выбрано не меньше 6 клеток. В такой строке есть соседняя по горизонтали пара. Если бы это была единственная соседняя пара среди всех выбранных клеток, то в соседних строках нельзя было бы выбирать клетки в тех же столбцах: иначе появилась бы вертикальная соседняя пара. Но строка с 6 выбранными клетками оставляет только 4 свободных столбца для каждой соседней строки. Если эта строка не крайняя, всего можно выбрать не больше \\(6+4+4+7\\cdot5=49\\) клеток; если она крайняя, не больше \\(6+4+8\\cdot5=50\\) клеток. Противоречие. При 7 или большем числе клеток в строке оценка только усиливается, а две разные строки с горизонтальными парами сразу дают две соседние пары.\n\nТеперь пусть Петя сделал 49 ходов, и на все был получен ответ «нет». Непроверенными остаются 51 клетка. Среди них есть хотя бы две соседние пары, и каждая из этих пар могла быть настоящим положением сокровища. Полученная информация не различает эти варианты, значит, 49 ходов недостаточно.",
      "standard_idea_ids": ["adversary_strategy", "indistinguishable_states"],
      "status": "ai_checked",
      "definition_ids": ["state_space"]
    }
