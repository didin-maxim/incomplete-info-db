      "title": "Сначала зафиксировать общий третий ответ",
      "text": "Если третий правильный ответ не равен 24, то все три ученика ошиблись в третьем вопросе. Тогда, поскольку у каждого ровно одна ошибка, все трое должны были бы правильно ответить на второй вопрос. Но во втором вопросе их ответы разные: 36, 38 и 54. Это невозможно. Значит, третий правильный ответ равен 24.\n\nТеперь предположим, что первый правильный ответ не равен 15. Тогда ученики A и C ошиблись бы в первом вопросе, а значит оба должны были бы правильно ответить на второй. Но у них во втором вопросе разные ответы, 36 и 54. Это невозможно. Значит, первый правильный ответ равен 15.\n\nУченик B ошибся в первом вопросе, поэтому его ответы на второй и третий вопросы верны. Второй правильный ответ равен 38. Сумма правильных ответов: \\(15+38+24=77\\).",
