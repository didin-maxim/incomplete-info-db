      "text": "Официальный разбор начинает с клеток, цвет которых принудительно задается симметрией: в нижнем левом углу должна стоять желтая кепка, над ней синяя, а в первой клетке второго ряда - красная. Затем рассматриваются две детали с желтой кепкой. Одна начальная постановка приводит к тупику: оставшиеся синие кепки не могут одновременно лечь либо на ось симметрии, либо в зеркальные клетки. Значит, нужно выбрать другую желтую деталь. После этого последовательно вынуждаются деталь с верхней красной кепкой, затем положение детали с синей и зеленой кепками, и оставшиеся детали встают однозначно. По официальному решению нижний ряд получается: желтая, красная, синяя, желтая.",
