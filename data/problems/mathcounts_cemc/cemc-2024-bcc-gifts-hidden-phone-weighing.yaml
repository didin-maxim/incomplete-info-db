        "id": "stmt-bcc-2024-gifts",
        "title": "В каком случае взвешиваний будет меньше всего",
        "text": "Бернард упаковал подарки для 14 учеников и пронумеровал их от 1 до 14. Он знает вес каждого подарка, но после упаковки понял, что случайно уронил телефон в один из подарков. Чтобы не распаковывать много подарков, он действует так. Сначала делит подарки на две стопки: 1-7 и 8-14. Взвешивает первую стопку. Если она тяжелее ожидаемого, оставляет ее, иначе оставляет вторую. Затем снова делит оставленную стопку на две части, насколько возможно равные; если число подарков нечетное, первая часть меньше второй, и меньшие номера идут в первую часть. Он повторяет процедуру, пока не останется один подарок. Среди вариантов: телефон в подарке 3, 13, 8 или 6. В каком случае Бернард взвесит меньше всего стопок?",
