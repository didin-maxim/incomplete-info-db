      "title": "Проследить дерево оставленных стопок",
      "text": "После первого взвешивания остаются либо \\(1-7\\), либо \\(8-14\\). Если телефон в подарке 8, первая стопка \\(1-7\\) не тяжелее ожидаемого, поэтому остается \\(8-14\\). При делении \\(8-14\\) первая часть \\(8,9,10\\), вторая \\(11,12,13,14\\). Телефон в 8 делает первую часть тяжелее, остается \\(8,9,10\\). Далее первая часть - только подарок 8, вторая - \\(9,10\\). Одно взвешивание подарка 8 сразу обнаруживает, что он тяжелее ожидаемого, и поиск заканчивается после трех взвешиваний.\n\nОфициальный разбор показывает, что за три взвешивания находятся только подарки 1 и 8. Среди предложенных вариантов это только подарок 8; остальные требуют четырех взвешиваний.",
