      "id": "str-check-parity-route-to-c",
      "title": "Проверить четности на трех уровнях",
      "text": "Для правильного варианта A всего в восьми горшках 6 цветов, это четное число, поэтому выбирается левая половина \\(A,B,C,D\\). В этих четырех горшках 3 цветка, это нечетное число, поэтому выбирается правая половина \\(C,D\\). В горшках \\(C,D\\) 2 цветка, это четное число, поэтому выбирается левая половина, то есть \\(C\\).\n\nВ остальных вариантах первые два шага также доводят до пары \\(C,D\\), но в этой паре ровно 1 цветок. Тогда последний шаг ведет вправо, к \\(D\\), а не к \\(C\\). Поэтому подходит только вариант A.",
