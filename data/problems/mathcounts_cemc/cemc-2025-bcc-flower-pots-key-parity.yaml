      "id": "idea-parity-bits-select-halves",
      "title": "Каждая четность дает один бит маршрута",
      "text": "Чтобы попасть в \\(C\\), путь деления пополам должен быть: левая половина \\(A-D\\), затем правая половина \\(C-D\\), затем левая половина \\(C\\). Значит, нужные проверки четности должны дать последовательность: четно, нечетно, четно.",
