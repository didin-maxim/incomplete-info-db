        "id": "stmt-bcc-2025-flower-pots",
        "title": "Четность цветов направляет поиск ключа",
        "text": "Бобр ставит в ряд восемь горшков \\(A,B,C,D,E,F,G,H\\) и прячет ключ под одним из них. В некоторые горшки он сажает по одному цветку, чтобы друг мог найти ключ по правилу: если в рассматриваемом отрезке горшков общее число цветов четно, ключ в левой половине; если нечетно, ключ в правой половине. Затем рассматривается только выбранная половина, и правило повторяется, пока не останется один горшок. Ключ спрятан под горшком \\(C\\). Нужно выбрать такой ряд цветов из предложенных вариантов, который приведет друга к горшку \\(C\\). Варианты можно записать по горшкам с цветами: (A) \\(A,C,D,E,F,H\\); (B) \\(A,B,D,E,F,H\\); (C) \\(C,F\\); (D) \\(D,G\\).",
