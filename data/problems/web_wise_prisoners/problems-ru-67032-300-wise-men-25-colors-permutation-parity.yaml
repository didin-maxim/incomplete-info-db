      "title": "У каждого мудреца ровно два кандидата, различающиеся четностью",
      "text": "Так как 0+1+...+24=300, истинные количества цветов равны числам от 0 до 24. Каждый мудрец видит два цвета с одинаковыми видимыми количествами; его собственный колпак одного из этих двух цветов.",
