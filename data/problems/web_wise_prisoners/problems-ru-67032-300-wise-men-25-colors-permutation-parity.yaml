        "id": "stmt-problems-ru-67032",
        "title": "Гарантировать хотя бы 150 правильных ответов",
        "text": "Султан собрал 300 мудрецов. Есть колпаки 25 заранее известных цветов. На каждого мудреца наденут один колпак, причем количества колпаков разных цветов попарно различны. Каждый видит колпаки остальных, но не свой. Затем все одновременно называют предполагаемый цвет своего колпака. Могут ли мудрецы заранее договориться так, чтобы при любом распределении гарантированно хотя бы 150 из них назвали свой цвет верно?",
