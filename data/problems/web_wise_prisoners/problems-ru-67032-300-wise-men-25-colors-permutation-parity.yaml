    {
      "id": "str-half-even-half-odd-permutation",
      "title": "Половина выбирает четную перестановку, половина - нечетную",
      "text": "Занумеруем цвета числами от 0 до 24. В истинном распределении количества цветов образуют перестановку чисел \\(0,1,\\ldots,24\\): каждому цвету соответствует свое количество.\n\nЛюбой мудрец видит все колпаки, кроме своего. Поэтому для цветов, не равных его цвету, он видит истинные количества, а для своего цвета - на один меньше. Из-за того что истинные количества все различны и равны \\(0,1,\\ldots,24\\), в видимой таблице ровно два цвета имеют одинаковое количество \\(k\\). Мудрец понимает: его колпак одного из этих двух цветов, а истинные количества у них должны быть \\(k\\) и \\(k+1\\).\n\nДве возможные таблицы отличаются только обменом двух значений \\(k\\) и \\(k+1\\) между этими цветами. Поэтому соответствующие перестановки имеют разную четность. До испытания договоримся: 150 заранее выбранных мудрецов всегда выбирают тот из двух цветов, при котором получилась бы четная перестановка, а остальные 150 - тот, при котором получилась бы нечетная. Истинная перестановка либо четная, либо нечетная. В первом случае правы ровно первая группа из 150 мудрецов, во втором - ровно вторая группа. Значит, 150 правильных ответов гарантированы.",
