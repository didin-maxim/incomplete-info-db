        "id": "stmt-problems-ru-116064",
        "title": "Хотя бы трое должны угадать спрятанный цвет",
        "text": "У дракона есть семь колпаков семи цветов радуги. Шестерым гномам наденут по колпаку, а один колпак спрячут. После этого каждый гном увидит колпаки остальных, но не свой и не спрятанный, и без общения с другими тайно назовет дракону цвет спрятанного колпака. Если хотя бы трое угадают, всех отпустят. Как гномам заранее договориться, чтобы гарантированно спастись?",
        "source_ids": ["src-matprazdnik-2011-blank6", "src-problems-ru-116064"],
        "status": "ai_checked",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["state_space"]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-orient-complete-graph-cycle",
      "title": "Каждый выбирает один из двух невидимых цветов по заранее заданному правилу",
      "text": "Каждый гном видит пять цветов, значит не видит ровно два: свой и спрятанный. Нужно заранее выбрать для каждой пары цветов, какой цвет из пары называть, так чтобы у каждого спрятанного цвета ровно три другие цвета указывали на него.",
      "standard_idea_ids": ["balanced_pair_choice_protocol"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-seven-cycle-tournament",
      "title": "Расположить цвета по кругу из семи вершин",
      "text": "Заранее расположим семь цветов по кругу. Каждый гном видит пять цветов, поэтому два цвета для него неизвестны: цвет его собственного колпака и цвет спрятанного колпака. Договоримся: из этих двух цветов он называет тот, до которого от другого цвета ближе идти по часовой стрелке по кругу. Так как в круге 7 цветов, расстояния по часовой стрелке в две стороны имеют суммы 7, поэтому одно из них равно 1, 2 или 3, а другое равно 4, 5 или 6; выбор однозначен.\n\nПусть спрятан некоторый цвет \\(H\\). Рассмотрим шесть гномов с колпаками остальных цветов. Гном с цветом \\(X\\) выбирает между \\(X\\) и \\(H\\). Он назовет \\(H\\) ровно тогда, когда от \\(X\\) до \\(H\\) по часовой стрелке расстояние 1, 2 или 3. На семиугольнике таких цветов \\(X\\) ровно три: три предыдущих перед \\(H\\) по кругу. Поэтому при любом спрятанном цвете ровно три гнома называют его верно, и условие дракона выполнено.",
      "standard_idea_ids": ["balanced_pair_choice_protocol"],
      "status": "ai_checked",
      "definition_ids": ["state_space"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "ub-at-most-half-note",
      "title": "Больше половины гарантировать нельзя",
      "text": "Любая договоренность задает ориентацию каждой пары цветов: если гном не видит ровно цвета \\(A\\) и \\(B\\), он заранее решает, какой из них назвать. Зафиксируем спрятанный цвет \\(H\\). Правильно отвечают ровно те гномы, чьи собственные цвета \\(X\\) направлены правилом в сторону \\(H\\), то есть входящие в \\(H\\) ребра этого турнира на 7 цветах.\n\nСумма входящих степеней всех 7 вершин равна числу пар цветов, то есть \\(\\binom{7}{2}=21\\). Если бы для каждого спрятанного цвета можно было гарантировать хотя бы 4 правильных ответа, сумма входящих степеней была бы не меньше \\(7\\cdot4=28\\), что невозможно. Значит, гарантировать больше трех правильных ответов нельзя.",
      "standard_idea_ids": ["counting_bound"],
      "status": "ai_checked"
    }
