        "title": "Все видят всех, кроме себя, и не общаются",
        "text": "Бесконечно много заключенных пронумерованы числами \\(1,2,3,\\ldots\\). Каждому надевают красную или черную шляпу. По сигналу каждый видит цвета шляп всех остальных заключенных, но не своей, и после этого общаться нельзя. Затем каждый должен назвать цвет своей шляпы. Всех освободят, если ошибутся только конечное число заключенных. Могут ли они заранее договориться о стратегии, которая гарантирует освобождение при любой раскраске шляп?",
