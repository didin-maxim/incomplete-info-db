  "strategies": [
    {
      "id": "str-choose-class-representative",
      "title": "Выбрать представителя каждого класса эквивалентности",
      "text": "Назовем две бесконечные раскраски эквивалентными, если они отличаются только в конечном числе позиций. Это действительно отношение эквивалентности: каждая раскраска эквивалентна себе, порядок сравнения не важен, а если первая отличается от второй лишь в конечных местах и вторая от третьей лишь в конечных местах, то первая от третьей отличается не более чем в объединении двух конечных множеств.\n\nДо испытания заключенные договариваются выбрать по одной эталонной раскраске из каждого класса эквивалентности. Это самый старший шаг решения: для произвольного семейства бесконечных классов такой выбор обычно формулируют через аксиому выбора.\n\nПосле надевания шляп заключенный \\(i\\) видит все цвета, кроме своего. Для него возможны только две полные раскраски: одна с красной шляпой на месте \\(i\\), другая с черной. Эти две раскраски отличаются ровно в одной позиции, значит лежат в одном классе эквивалентности. Поэтому заключенный может определить этот класс по видимым шляпам, найти заранее выбранного представителя класса и назвать цвет, который у представителя стоит на позиции \\(i\\).\n\nПусть истинная раскраска равна \\(X\\), а выбранный представитель ее класса равен \\(R\\). По определению класса \\(X\\) и \\(R\\) отличаются только в конечном числе позиций. Все заключенные, у которых цвета в \\(X\\) и \\(R\\) совпадают, угадают правильно; ошибутся только позиции, где они отличаются. Таких позиций конечно много. Значит, стратегия гарантирует освобождение.",
