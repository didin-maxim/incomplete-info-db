      "id": "str-three-even-three-odd",
      "title": "Трое выбирают одну половину таблиц, трое - другую",
      "text": "Занумеруем цвета числами 1, 2, 3, 4. В полной расстановке количеств у цветов стоит некоторая перестановка чисел 0, 1, 2, 3.\n\nДо испытания разделим мудрецов на две группы по три человека. Первая группа всегда выбирает из двух своих вариантов тот цвет, при котором таблица количеств получается четной перестановкой чисел 0, 1, 2, 3. Вторая группа выбирает вариант с нечетной перестановкой.\n\nДля каждого мудреца две возможные таблицы отличаются только обменом двух соседних количеств между двумя цветами, поэтому одна из них четная, а другая нечетная. Настоящая таблица тоже либо четная, либо нечетная. Если она четная, верно отвечают все трое из первой группы; если нечетная, верно отвечают все трое из второй группы. Значит, при любой расстановке гарантированы три правильных ответа.",
