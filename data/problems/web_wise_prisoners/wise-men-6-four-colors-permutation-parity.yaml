        "text": "Есть шесть мудрецов и колпаки четырех заранее известных цветов. Колпаков этих цветов надето соответственно 0, 1, 2 и 3 штуки, но неизвестно, какому цвету какое количество досталось. Каждый мудрец видит колпаки остальных пяти, но не видит свой. Затем все одновременно называют цвет своего колпака. Могут ли мудрецы заранее договориться так, чтобы при любой допустимой расстановке не меньше трех из них ответили верно?",
