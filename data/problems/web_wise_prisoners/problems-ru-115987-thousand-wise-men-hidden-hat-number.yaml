      "id": "str-modulo-sum-more-than-500",
      "title": "Для пункта а: передать сумму видимых номеров",
      "text": "Пусть задний мудрец называет остаток по модулю 1001 от суммы номеров, которые видит; остаток 0 договоримся записывать как 1001. Следующий мудрец видит всех впереди и по этому остатку вычисляет свой номер. Дальше каждый следующий вычитает из исходного остатка уже правильно названные номера позади и видимые номера впереди.\n\nЕдинственная помеха - запрет повторять сказанное число: может случиться, что вычисленный номер совпал с числом, которое назвал задний мудрец как код. Тогда этот мудрец не может произнести свой номер. По договоренности он вместо него называет номер самого переднего мудреца; остальные понимают, что произошел такой сбой, и продолжают расчеты. В итоге ошибиться могут только задний мудрец, один мудрец в момент сбоя и самый передний. Значит, гарантируется как минимум 997 правильных ответов, в частности больше 500.",
      "standard_idea_ids": ["modular_sum_encoding"],
      "status": "ai_checked",
      "definition_ids": ["state_space"]
    },
    {
      "id": "str-even-permutation-999",
      "title": "Для пункта б: поддерживать четную перестановку",
      "text": "Добавим спрятанный колпак как позицию за спиной заднего мудреца. Тогда все номера от 1 до 1001 образуют перестановку по 1001 позиции: спрятанная позиция и 1000 мест в колонне.\n\nЗадний мудрец не видит только два номера: свой и спрятанный. Есть два варианта расставить эти два номера, и соответствующие перестановки имеют разную четность. Он называет свой номер так, как если бы истинной была, например, четная перестановка. Его ответ может быть неверным, но после этого все остальные будут поддерживать именно четную гипотезу.\n\nСледующий мудрец знает все уже названное и видит всех впереди; неизвестны снова ровно два номера: его собственный и тот, который по текущей гипотезе находится в спрятанной позиции. Из двух вариантов только один сохраняет четность перестановки, и он однозначно определяет номер мудреца. Так же рассуждает каждый следующий. Поэтому все, кроме, возможно, заднего, называют свои номера правильно, то есть гарантируется не менее 999 правильных ответов.",
