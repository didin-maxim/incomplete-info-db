        "title": "Назвать номера колпаков с запретом повторов",
        "text": "Тысячу мудрецов выстраивают в колонну. Есть колпаки с номерами от 1 до 1001; один колпак прячут, остальные в случайном порядке надевают на мудрецов. Каждый видит только номера на колпаках всех впереди стоящих. Затем мудрецы по порядку от заднего к переднему называют вслух целые числа от 1 до 1001, причем нельзя называть число, уже сказанное ранее. Результат теста - число мудрецов, назвавших номер своего колпака. Мудрецы заранее знают правила и могут договориться. Могут ли они гарантировать результат более 500? Могут ли гарантировать результат не менее 999?",
