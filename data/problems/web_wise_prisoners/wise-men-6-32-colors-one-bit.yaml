      "id": "idea-32-even-six-bit-words",
      "title": "32 цвета можно записать четными словами длины 6",
      "text": "Из всех строк из шести нулей и единиц ровно половина имеет четное число единиц. Таких строк 32. Поэтому каждому цвету можно заранее дать свой шестибитный код с четным числом единиц.",
      "standard_idea_ids": ["parity_encoding"],
      "status": "ai_checked"
    }
