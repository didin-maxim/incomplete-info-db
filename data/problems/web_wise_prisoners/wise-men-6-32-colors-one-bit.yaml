        "title": "Каждый показывает ноль или единицу",
        "text": "Шести мудрецам надевают колпаки. Цвет каждого колпака - один из 32 заранее известных цветов. Потом каждый видит все колпаки, кроме своего. Сначала все одновременно показывают один бит: 0 или 1. Затем все одновременно называют цвет своего колпака. Могут ли они заранее договориться так, чтобы каждый всегда называл свой цвет верно?",
        "source_ids": ["src-problems-ru-64616"],
        "status": "ai_checked",
