  "strategies": [
    {
      "id": "str-six-coordinate-parity",
      "title": "Каждый отвечает за один разряд",
      "text": "Заранее сопоставим 32 цветам все шестибитные слова с четным числом единиц. Разряды с первого по шестой закрепим за мудрецами.\n\nМудрец номер \\(k\\) смотрит на пять чужих колпаков и считает, четно или нечетно число единиц в \\(k\\)-м разряде их кодов. Этот один бит он и показывает.\n\nТеперь любой мудрец восстанавливает свой код. Чтобы узнать разряд \\(k\\), где \\(k\\) - не его номер, он берет бит, показанный \\(k\\)-м мудрецом, и вычитает из него видимые ему вклады остальных четырех колпаков. Остается его собственный \\(k\\)-й разряд. Так находятся пять разрядов. Шестой, закрепленный за ним самим, его собственный ответ не сообщает, но весь код должен иметь четное число единиц, поэтому последний разряд определяется из четности. Получается полный код, а значит и цвет.",
      "standard_idea_ids": ["parity_encoding"],
      "status": "ai_checked",
      "definition_ids": ["strategy", "state_space"]
    }
