        "id": "stmt-problems-ru-64616",
        "title": "Каждый показывает один бит, потом все угадывают свой цвет",
        "text": "Одиннадцати мудрецам завязывают глаза и надевают каждому колпак одного из 1000 заранее известных цветов. Потом повязки снимают: каждый видит все колпаки, кроме своего. Сначала все одновременно показывают остальным одну из двух карточек, белую или черную. Затем все одновременно называют цвет своего колпака. Могут ли мудрецы заранее договориться так, чтобы все гарантированно угадали?",
