      "id": "str-coordinate-parity-broadcast",
      "title": "Каждый сообщает четность одного разряда",
      "text": "Заранее сопоставим каждому цвету свое 11-битное слово с четным числом единиц. Разряды с первого по одиннадцатый закрепим за мудрецами. Мудрец номер \\(k\\) смотрит на десять видимых ему колпаков и считает, сколько в их кодах единиц в \\(k\\)-м разряде. Если это число четно, он показывает, скажем, черную карточку, а если нечетно - белую.\n\nТеперь рассмотрим любого мудреца. Чтобы узнать \\(k\\)-й разряд собственного цвета, он берет карточку \\(k\\)-го мудреца. Если \\(k\\)-й мудрец не он сам, то он видит остальные девять кодов, участвовавшие в подсчете этого разряда, кроме своего. Значит, по объявленной четности он восстанавливает свой \\(k\\)-й бит. Так он находит все разряды, кроме разряда, закрепленного за ним самим: свою карточку он выбирал, не видя своего колпака, и она этого бита не сообщает.\n\nПоследний бит находится из условия, что код цвета имеет четное число единиц. Поэтому каждый восстанавливает все 11 битов своего цвета и называет его правильно.",
