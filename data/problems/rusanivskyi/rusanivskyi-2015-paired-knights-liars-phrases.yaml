        "title": "Поровну двух фраз",
        "text": "На острове живут 1234 человека, каждый из которых либо рыцарь, всегда говорящий правду, либо лжец, всегда лгущий. Однажды все жители разбились на пары, и каждый сказал о своем партнере одну из двух фраз: «Он рыцарь!» или «Он лжец!». Могло ли оказаться, что всего фраз первого и второго вида было сказано поровну?",
