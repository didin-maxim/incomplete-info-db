      "id": "idea-each-pair-says-same-kind",
      "title": "В каждой паре звучат две одинаковые фразы",
      "text": "Если в паре люди одного типа, оба называют партнера рыцарем. Если типы разные, оба называют партнера лжецом. Значит, пары дают фразы только двойками одного вида.",
      "standard_idea_ids": ["parity_encoding"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-count-odd-number-of-pairs",
      "title": "Посчитать пары",
      "text": "Рассмотрим одну пару. Если это два рыцаря, каждый правдиво говорит о партнере: «Он рыцарь». Если это два лжеца, каждый лжет; правда была бы «Он лжец», поэтому оба говорят: «Он рыцарь». Если в паре рыцарь и лжец, рыцарь правдиво говорит: «Он лжец», а лжец лжет о рыцаре и тоже говорит: «Он лжец».\n\nЗначит каждая пара дает либо две фразы «Он рыцарь», либо две фразы «Он лжец». Всего пар \\(1234:2=617\\), а это нечетное число. Чтобы общее число фраз двух видов было поровну, число пар первого вида должно равняться числу пар второго вида. Нечетные 617 пар так разделить нельзя. Поэтому такая ситуация невозможна.",
      "standard_idea_ids": ["parity_encoding"],
      "status": "ai_checked",
      "definition_ids": ["truth_teller", "liar"]
    }
