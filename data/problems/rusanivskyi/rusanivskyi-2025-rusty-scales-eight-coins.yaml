      "id": "str-pair-blocks",
      "title": "Сначала сравнить две четверки",
      "text": "Пронумеруем монеты от 1 до 8, их массы обозначим \\(m_1,\\ldots,m_8\\). Первым взвешиванием сравним \\(1,2,3,4\\) с \\(5,6,7,8\\), вторым - \\(1,2,5,6\\) с \\(3,4,7,8\\). В этих взвешиваниях сравниваются по четыре монеты, поэтому отсутствие надежного перекоса означает настоящее равенство масс.\n\nСлучай 1: первые два взвешивания не дали надежного перекоса. Тогда \\(m_1+m_2=m_7+m_8\\) и \\(m_3+m_4=m_5+m_6\\). Значит либо в каждой из пар \\((1,2),(3,4),(5,6),(7,8)\\) по одной настоящей и одной фальшивой монете, либо монеты \\(1,2,7,8\\) одного типа, а монеты \\(3,4,5,6\\) другого типа. Сравним третьим взвешиванием \\(1+7\\) с \\(2+8\\), а четвертым \\(1+8\\) с \\(2+7\\). Если оба раза нет надежного перекоса, то четверки \\(1,2,7,8\\) и \\(3,4,5,6\\) однородны; пятым взвешиванием сравним эти четверки и узнаем, какая вся фальшивая. Если хотя бы одно из третьего и четвертого взвешиваний дает надежный перекос, то среди \\(1,2,7,8\\) уже найдены две настоящие и две фальшивые монеты; тем же приемом за пятое и шестое взвешивания разбираем \\(3,4,5,6\\).\n\nСлучай 2: среди первых двух взвешиваний был надежный перекос. Третьим взвешиванием сравним \\(1,2,7,8\\) с \\(3,4,5,6\\). После этих трех сравнений четверок пары \\((1,2),(3,4),(5,6),(7,8)\\) имеют массы либо \\(20,20,18,18\\), либо \\(20,19,19,18\\) в некотором порядке; вариант \\(19,19,19,19\\) невозможен, потому что тогда первые два сравнения не дали бы надежного перекоса. По трем сравнениям четверок либо сразу известны все настоящие и фальшивые пары, либо остаются две смешанные пары, в каждой из которых одна монета настоящая и одна фальшивая. Пусть это пары \\((2i-1,2i)\\) и \\((2j-1,2j)\\). Тогда четвертым взвешиванием сравним \\((2i-1)+(2j)\\) с \\((2i)+(2j-1)\\), а пятым - \\((2i-1)+(2j-1)\\) с \\((2i)+(2j)\\). Одно из этих сравнений обязательно покажет разницу 2 г и тем самым определит обе оставшиеся пары. Во всех ветвях хватает не более шести взвешиваний.",
