        "id": "stmt-rusanivskyi-2021-mafia",
        "title": "Кто мафия, комиссар и мирные жители",
        "text": "Пять человек A, B, C, D, E играют в «Мафию». Среди них 2 мирных жителя, 2 представителя мафии и 1 комиссар. Мафия знает друг друга, комиссар знает, кто мафия, а мирные жители знают только свои роли. Представители мафии всегда лгут, а мирные жители и комиссар всегда говорят правду. Во время игры последовательно прозвучали реплики:\n\nA: «Я знаю, кто B».\nB: «Я знаю, кто комиссар».\nC: «Я знаю, кто B».\nD: «Я знаю, кто E».\n\nОпределите, кто кем является.",
        "source_ids": ["src-rusanivskyi-2021-official"],
