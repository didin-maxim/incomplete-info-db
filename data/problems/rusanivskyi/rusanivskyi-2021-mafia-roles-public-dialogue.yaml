  },
  "ideas": [
    {
      "id": "idea-knowledge-depends-on-role-and-previous-dialogue",
      "title": "Учитывать, что игроки тоже слышат предыдущие реплики",
      "text": "Фраза «я знаю» истинна только если игрок может вывести роль названного человека из своей роли и уже прозвучавшего диалога. Поэтому каждая новая реплика добавляет публичную информацию.",
      "standard_idea_ids": ["public_announcement_induction", "knowledge_elimination"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-sequential-role-elimination",
      "title": "Идти по репликам",
      "text": "A не может быть мирным жителем: мирный житель в самом начале знает только собственную роль и не знает, кто B, а мирные жители говорят правду.\n\nПредположим, что A - комиссар. Тогда A правдиво знает, кто B. Игрок B не может быть комиссаром и не может быть мирным жителем: мирный житель не знал бы, кто комиссар. Значит, B был бы мафией. Но мафия знает друг друга; кроме того, из первой реплики B понял бы, что A не мирный житель, и знал бы, что A не мафия, иначе A знал бы B как мафию и должен был бы солгать. Тогда B знал бы, что A - комиссар, и его фраза оказалась бы правдивой, хотя мафия должна лгать. Противоречие.\n\nЗначит, A - мафия. Его фраза ложна, поэтому он не знает, кто B; следовательно, B не мафия. Тогда B говорит правду. Мирный житель после первой реплики еще не знал бы комиссара, значит B - комиссар.\n\nКогда C говорит третьим, он слышал первые две реплики и, как и мы, уже может вывести, что B - комиссар. Его фраза истинна, значит C - мирный житель. Когда D говорит четвертым, уже известно, что A - мафия, B - комиссар, C - мирный житель. Зная собственную роль, D может определить, кто E: если D мирный, то E мафия; если D мафия, то E мирный. Его фраза истинна, значит D - мирный житель. Оставшийся E - мафия.",
      "standard_idea_ids": ["public_announcement_induction", "knowledge_elimination"],
      "status": "ai_checked",
      "definition_ids": ["truth_teller", "liar", "state_space"]
    }
