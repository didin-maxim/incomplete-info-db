      "id": "str-three-nominal-relations",
      "title": "Сравнить 2+3+5 с 10",
      "text": "Первым взвешиванием сравним монеты 2, 3 и 5 динаров с монетой 10 динаров. Если равновесие, то все эти четыре монеты имеют правильные массы, значит фальшивая монета - 1 динар.\n\nЕсли равновесия нет, вторым взвешиванием сравним 2 и 3 динара с 5 динарами. Если равновесие, то монеты 2, 3 и 5 настоящие, а из первого взвешивания следует, что фальшивая монета - 10 динаров.\n\nОстается случай, когда оба первых взвешивания не дали равновесия. Тогда монета 10 настоящая, а фальшивая среди 2, 3 и 5. По первому взвешиванию мы знаем, легче она своего номинала или тяжелее: если чаша с 2+3+5 была легче, фальшивая монета легче нормы; если тяжелее - тяжелее нормы. Рассмотрим для определенности легкий случай. Во втором взвешивании, если чаша с монетой 5 динаров легче, фальшива она. Если легче чаша с 2 и 3 динарами, то фальшивая среди 2 и 3. Третьим взвешиванием сравним 2 динара с 3 динарами: более легкая из них и есть фальшивая. В тяжелом случае все направления перекосов меняются на противоположные, но рассуждение то же самое.",
