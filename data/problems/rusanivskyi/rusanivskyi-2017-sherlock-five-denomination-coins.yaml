        "title": "Номинал не совпадает с массой",
        "text": "Шерлок Холмс нашел пять монет номиналами 1, 2, 3, 5 и 10 динаров. Он быстро понял, что одна из них фальшивая: число на этой монете не равно ее массе в граммах. Как найти фальшивую монету за три взвешивания на чашечных весах без гирь?",
