        "id": "stmt-rusanivskyi-2025-spider-fly",
        "title": "Проверять по три вершины",
        "text": "В одной из вершин куба сидит муха. За один ход паук может проверить три вершины куба. Если муха находится в одной из них, паук ее ловит; иначе муха перелетает в одну из соседних вершин, и все повторяется. Докажите, что паук может гарантированно поймать муху за конечное число ходов.",
        "source_ids": ["src-rusanivskyi-2025-official"],
        "status": "ai_checked",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["strategy", "state_space"]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-bipartite-cube-colors",
      "title": "Муха каждый ход меняет цвет вершины",
      "text": "Вершины куба делятся на две доли шахматной раскраски. После каждого непойманного хода муха переходит в соседнюю вершину, значит обязательно меняет цвет.",
      "standard_idea_ids": ["partition_state_space"],
