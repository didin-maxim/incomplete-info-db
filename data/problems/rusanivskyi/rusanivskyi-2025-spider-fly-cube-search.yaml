  "strategies": [
    {
      "id": "str-four-step-color-trap",
      "title": "Проверить три вершины одного цвета, затем три соседние",
      "text": "Покрасим вершины куба в два цвета. Обозначим одну вершину первого цвета через \\(A\\), три остальные вершины первого цвета через \\(C,F,H\\), а три соседние с \\(A\\) вершины второго цвета через \\(B,D,E\\). Оставшаяся вершина второго цвета нам отдельно не понадобится.\n\nПервым ходом паук проверяет \\(C,F,H\\). Если муха была в одной из этих вершин, она поймана. Если муха была в вершине \\(A\\), то после неудачной проверки она перелетит в одну из вершин \\(B,D,E\\); вторым ходом паук проверяет именно \\(B,D,E\\) и ловит ее.\n\nЕсли после двух ходов муха не поймана, значит изначально она была во второй доле раскраски. После первого хода она перешла в первую долю, после второго - снова во вторую. Третьим ходом паук проверяет \\(B,D,E\\). Если муха там, она поймана; если нет, она находится в оставшейся вершине второго цвета и после хода перелетает в одну из \\(C,F,H\\). Четвертым ходом паук проверяет \\(C,F,H\\) и ловит муху. Значит четырех ходов достаточно.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["strategy", "state_space"]
    }
