      "text": "Рассмотрим произвольного жителя. Если он рыцарь, то оба его заявления истинны: среди друзей нечетное число рыцарей и четное число лжецов. Поэтому всего друзей у него нечетное число. Если он лжец, то каждое из двух заявлений ложно: рыцарей среди его друзей четное число, а лжецов нечетное число. Сумма опять нечетна.\n\nЗначит, у каждого жителя нечетное число друзей. Теперь посчитаем все дружбы с двух сторон: каждая дружба добавляет 2 к общей сумме чисел друзей. Поэтому сумма всех этих чисел четна. Сумма нечетных чисел четна только тогда, когда самих слагаемых четное число. Следовательно, число жителей острова четно.",
