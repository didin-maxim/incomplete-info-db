  "strategies": [
    {
      "id": "str-prove-one-knight-in-each-four",
      "title": "Доказать ровно одного рыцаря в каждой четверке",
      "text": "Сначала докажем, что среди любых 12 подряд сидящих людей не может быть больше 3 рыцарей. Иначе возьмем первого рыцаря в такой группе: после него внутри этих 12 осталось бы еще как минимум 3 рыцаря, то есть среди 11 следующих было бы меньше 9 лжецов, и его утверждение оказалось бы ложным.\n\nТеперь покажем, что четырех лжецов подряд быть не может. Пусть такие лжецы стоят на местах 1, 2, 3, 4. Первый из них солгал, значит среди мест 2--12 не может быть 9 или больше лжецов; следовательно, там есть хотя бы 3 рыцаря. Но в любых 12 подряд рыцарей не больше 3, а места 2, 3, 4 уже лжецы, поэтому среди мест 5--12 ровно 3 рыцаря. Тогда в группе 5--16 больше рыцарей быть не может, значит места 13--16 снова образуют четверку лжецов. Повторяя сдвиг на 12 мест, получаем четверки лжецов во всех классах по модулю 4, то есть все 80 человек стали бы лжецами; это противоречит исходной ситуации, потому что тогда каждое утверждение было бы истинным.\n\nЗначит, в каждой четверке подряд есть хотя бы один рыцарь. Вместе с уже доказанным ограничением «не больше 3 рыцарей в 12 подряд» это дает ровно одного рыцаря в каждой четверке подряд. Поэтому всего рыцарей \\(80/4=20\\). Пример достигается, если каждое четвертое место занято рыцарем, а остальные три места в каждом блоке - лжецами.",
