        "title": "Хотя бы 9 лжецов среди следующих 11",
        "text": "За круглым столом сидят 80 островитян. Каждый из них либо рыцарь, который всегда говорит правду, либо лжец, который всегда лжет. Каждый сказал: «Среди 11 человек, сидящих сразу после меня по часовой стрелке, есть хотя бы 9 лжецов». Сколько рыцарей может быть за столом?",
