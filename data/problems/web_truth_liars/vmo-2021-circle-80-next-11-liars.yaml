      "id": "idea-window-12-forces-period-four",
      "title": "Окна длины 12 и четверки подряд",
      "text": "Фраза каждого рыцаря говорит, что в окне из него и 11 следующих людей не больше 3 рыцарей. Если где-то есть четыре лжеца подряд, это вынуждает такую же четверку через 12 мест; из-за \\(\\gcd(80,12)=4\\) такое распространение сделало бы всех лжецами, что невозможно.",
      "standard_idea_ids": ["partition_state_space"],
