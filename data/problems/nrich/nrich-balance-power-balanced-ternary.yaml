      "standard_idea_ids": ["partition_state_space"],
      "status": "needs_human_review"
    },
    {
      "id": "idea-balanced-ternary-two-pans",
      "title": "Две стороны дают цифры -1, 0, 1",
      "text": "Если гирю можно положить и к предмету, и на противоположную чашу, ее вклад становится отрицательным, нулевым или положительным. Поэтому естественный набор масс - степени тройки, а представление массы становится сбалансированной троичной записью.",
      "standard_idea_ids": ["ternary_weighing_code"],
      "status": "needs_human_review"
    }
  ],
  "strategies": [
    {
      "id": "str-powers-two-and-three",
      "title": "Степени 2 для одной чаши, степени 3 для двух чаш",
      "text": "Если гири разрешено класть только на чашу, противоположную предмету, то шесть гирь \\(1,2,4,8,16,32\\) взвешивают все массы от 1 до 63, значит и от 1 до 60. Для масс до 1000 достаточно десяти гирь \\(1,2,4,\\ldots,512\\), потому что ими покрываются массы до \\(2^{10}-1=1023\\).\n\nЕсли гири можно класть на обе чаши, каждая гиря получает коэффициент \\(-1,0\\) или \\(1\\). Тогда массы \\(1,3,9,27,81\\) покрывают весь диапазон от 1 до 121 по абсолютной величине, в частности 1-60. Например, 8 можно получить как \\(9-1\\), положив гирю 9 на чашу против предмета, а гирю 1 - вместе с предметом. В общем случае степени тройки работают потому, что каждая новая гиря \\(3^k\\) перекрывает весь предыдущий диапазон и добавляет соседний без разрывов.",
