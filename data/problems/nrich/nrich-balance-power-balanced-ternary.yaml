        "id": "stmt-nrich-balance-power",
        "title": "Какими гирями взвесить все целые массы",
        "text": "Нужно подобрать как можно меньше гирь, чтобы на чашечных весах взвешивать все целые массы от 1 до 60, если гири кладутся только на одну чашу, противоположную предмету. Затем тот же вопрос задается для всех масс от 1 до 1000 и от 1 до \\(n\\). Как изменится ответ, если гири разрешено класть на обе чаши, то есть часть гирь может лежать на той же чаше, что и предмет?",
        "source_ids": ["src-nrich-balance-power"],
        "status": "source_verified",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["balance_scale"]
      }
