  "strategies": [
    {
      "id": "str-powers-two-and-three",
      "title": "Степени 2 для одной чаши, степени 3 для двух чаш",
      "text": "Если гири разрешено класть только на чашу, противоположную предмету, то шесть гирь \\(1,2,4,8,16,32\\) взвешивают все массы от 1 до 63, значит и от 1 до 60. Для масс до 1000 достаточно десяти гирь \\(1,2,4,\\ldots,512\\), потому что ими покрываются массы до \\(2^{10}-1=1023\\). В общем случае нужны \\(k=\\lceil\\log_2(n+1)\\rceil\\) гирь: степени двойки дают все суммы от 0 до \\(2^k-1\\).\n\nЕсли гири можно класть на обе чаши, каждая гиря получает коэффициент \\(-1,0\\) или \\(1\\). Тогда массы \\(1,3,9,27,81\\) покрывают весь диапазон от 1 до \\((1+3+9+27+81)=121\\), в частности 1-60. Например, 8 можно получить как \\(9-1\\), положив гирю 9 на чашу против предмета, а гирю 1 - вместе с предметом. В общем случае степени тройки работают потому, что если уже покрыт диапазон \\([-S,S]\\) и новая гиря имеет массу \\(2S+1\\), то с коэффициентами \\(-1,0,1\\) получается сплошной диапазон \\([-(3S+1),3S+1]\\). Для степеней тройки это дает все массы до \\((3^k-1)/2\\); минимальное число гирь для 1..n равно \\(\\lceil\\log_3(2n+1)\\rceil\\).",
      "standard_idea_ids": ["ternary_weighing_code", "partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["balance_scale"]
    }
  ],
  "impossibility_proofs": [
