      "title": "Две стороны дают цифры -1, 0, 1",
      "text": "Если гирю можно положить и к предмету, и на противоположную чашу, ее вклад становится отрицательным, нулевым или положительным. Поэтому естественный набор масс - степени тройки, а представление массы становится сбалансированной троичной записью.",
