      "title": "Сначала проверить первое утверждение",
      "text": "Если бы первый был рыцарем, то все остальные были бы лжецами. Но тогда второй, называя первого лжецом, действительно лгал бы, а третий, называя второго лжецом, говорил бы правду. Значит, все после первого не могут быть лжецами одновременно.",
