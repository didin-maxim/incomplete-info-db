      "id": "str-alternating-queue",
      "title": "Разбор очереди слева направо",
      "text": "Первый не может быть рыцарем: иначе все 24 человека позади него были бы лжецами, но тогда среди их фраз о предыдущем человеке неизбежно появилась бы правдивая фраза. Значит, первый - лжец.\n\nВторой говорит, что первый - лжец, и это правда, поэтому второй - рыцарь. Третий говорит, что второй - лжец, это неправда, поэтому третий - лжец. Дальше рассуждение повторяется: после первого идут попеременно рыцарь, лжец, рыцарь, лжец.\n\nВ 25 местах нечетные позиции заняты лжецами, а четные - рыцарями. Четных позиций от 1 до 25 ровно 12, поэтому в очереди 12 рыцарей.",
