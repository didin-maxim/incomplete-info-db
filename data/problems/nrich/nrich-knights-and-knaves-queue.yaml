        "title": "Очередь из 25 островитян",
        "text": "На острове каждый житель либо рыцарь, который всегда говорит правду, либо лжец, который всегда лжет. В очереди стоят 25 островитян. Первый сказал: \"Все, кто стоит за мной, лжецы\". Каждый из остальных сказал: \"Человек прямо передо мной - лжец\". Сколько рыцарей стоит в очереди?",
