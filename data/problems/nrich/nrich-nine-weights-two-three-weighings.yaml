      "text": "Для 10 грузиков сначала сравним \\(1,2,3,4\\) с \\(5,6,7,8\\). Если равновесие, то 1-8 нормальны, а необычный грузик среди 9 и 10; двумя оставшимися взвешиваниями это легко проверить сравнением 9 с нормальным грузиком и, если нужно, 10 с нормальным грузиком.\n\nПусть в первом взвешивании левая чаша тяжелее. Тогда возможны состояния: 1,2,3,4 тяжелые или 5,6,7,8 легкие, а 9 и 10 нормальны. Проведем два заранее заданных сравнения: во втором взвешивании \\(2,6,9\\) против \\(3,4,8\\), в третьем - \\(1,4,6,7\\) против \\(2,8,9,10\\). Для состояний «1 тяжелый», «2 тяжелый», «3 тяжелый», «4 тяжелый», «5 легкий», «6 легкий», «7 легкий», «8 легкий» пары исходов второго и третьего взвешиваний соответственно равны \\((0,+),(+,-),(-,0),(-,+),(0,0),(-,-),(0,-),(+,+)\\). Они все различны. Если в первом взвешивании правая чаша тяжелее, используем симметричный разбор. Поэтому для 10 грузиков при неизвестном направлении отличия трех взвешиваний достаточно.",
