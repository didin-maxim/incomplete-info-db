      "text": "Для 9 грузиков сначала взвесим \\(1,2,3\\) против \\(4,5,6\\). Если равновесие, необычный грузик среди \\(7,8,9\\), а первые шесть заведомо нормальны. Тогда вторым взвешиванием сравним 7 с 8. Если одна сторона тяжелее, остались два варианта: левый грузик тяжелый или правый легкий; третьим сравнением одного из них с нормальным грузиком определяем, какой вариант верен. Если 7 и 8 равны, необычный грузик - 9, и третьим сравнением 9 с нормальным грузиком определяем, тяжелее он или легче.\n\nЕсли первое взвешивание показало, что левая чаша тяжелее, возможны только шесть состояний: 1,2,3 тяжелые или 4,5,6 легкие; грузики 7,8,9 нормальны. Вторым взвешиванием сравним \\(1,4,7\\) против \\(2,5,8\\). Если левая чаша тяжелее, остались варианты «1 тяжелый» или «5 легкий»; если правая тяжелее - «2 тяжелый» или «4 легкий»; если равновесие - «3 тяжелый» или «6 легкий». Третье взвешивание сравнивает один из двух подозреваемых с нормальным грузиком и различает пару вариантов. Случай, когда в первом взвешивании правая чаша тяжелее, полностью симметричен.",
