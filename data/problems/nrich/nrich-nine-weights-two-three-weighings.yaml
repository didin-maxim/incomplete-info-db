        "title": "Девять, двадцать семь и неизвестное направление отличия",
        "text": "Даны 9 внешне одинаковых грузиков, один из которых немного тяжелее остальных. Можно ли всегда найти тяжелый грузик за два взвешивания на чашечных весах? Можно ли сделать то же самое для 10 грузиков? Затем дано 27 грузиков, один из которых тяжелее остальных: можно ли найти его за три взвешивания? Наконец, снова даны 9 грузиков, но известно только, что один отличается по весу, и неизвестно, тяжелее он или легче. Можно ли за три взвешивания найти отличающийся грузик и определить направление отличия? Можно ли так же гарантировать успех для 10 грузиков?",
