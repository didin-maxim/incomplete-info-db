      "text": "Для 9 грузиков разделим их на три тройки. Взвесим первую тройку против второй. Если одна сторона тяжелее, искомый грузик в этой тройке; если равновесие, он в третьей. Вторым взвешиванием сравним два грузика из найденной тройки: более тяжелый и есть искомый, а при равновесии искомый - третий.\n\nДля 27 грузиков сначала разделим их на три девятки и одним взвешиванием найдем девятку, где лежит тяжелый грузик. Оставшиеся два взвешивания применяют предыдущую стратегию для 9 грузиков. Для 10 грузиков за два взвешивания гарантии нет: дерево имеет только \\(3^2=9\\) конечных исходов.",
