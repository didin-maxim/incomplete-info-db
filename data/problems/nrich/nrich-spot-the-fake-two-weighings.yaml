        "id": "stmt-nrich-spot-fake",
        "title": "Одна более тяжелая фальшивая монета",
        "text": "Среди \\(N\\) внешне одинаковых монет ровно одна фальшивая, и она немного тяжелее остальных. Есть чашечные весы: можно сравнивать две группы с одинаковым числом монет и получать один из трех исходов. Каково наибольшее \\(N\\), при котором фальшивую монету всегда можно определить не более чем за два взвешивания?",
