      "id": "idea-three-outcomes-two-levels",
      "title": "Два взвешивания дают не больше девяти листьев",
      "text": "У каждого взвешивания три исхода: левая чаша тяжелее, правая тяжелее или равновесие. Поэтому дерево из двух взвешиваний имеет не больше \\(3^2=9\\) конечных ответов.",
      "standard_idea_ids": ["decision_tree_lower_bound"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-nine-coins-by-thirds",
      "title": "Разделить монеты на тройки",
      "text": "Сначала докажем верхнюю оценку. После двух взвешиваний возможно не больше девяти разных последовательностей исходов, а каждая монета должна соответствовать своему конечному ответу. Значит, \\(N\\le 9\\).\n\nДля девяти монет стратегия есть. Разделим их на группы \\(1,2,3\\), \\(4,5,6\\), \\(7,8,9\\). Сначала взвесим первую тройку против второй. Если одна тройка тяжелее, фальшивая монета в ней; если равновесие, фальшивая в третьей тройке. Вторым взвешиванием сравним две монеты из найденной тройки: если одна тяжелее, она фальшивая, а если равновесие, фальшивая третья. Поэтому максимальное значение \\(N\\) равно 9.",
      "standard_idea_ids": ["decision_tree_lower_bound", "partition_state_space"],
      "status": "ai_checked",
