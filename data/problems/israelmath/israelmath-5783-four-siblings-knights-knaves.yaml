      "text": "Пусть всего лжецов \\(k\\). Если \\(k=0\\), то Асаф и Бар оба рыцари, но их фразы ложны; невозможно.\n\nЕсли \\(k=1\\), то обе фразы ложны. Тогда и Асаф, и Бар должны быть лжецами, то есть лжецов уже как минимум двое; невозможно.\n\nЕсли \\(k=2\\), фраза Асафа истинна, а фраза Бара ложна. Значит, Асаф рыцарь, Бар лжец, и еще один из двух оставшихся - лжец. Это возможно.\n\nЕсли \\(k=3\\), обе фразы истинны. Тогда Асаф и Бар рыцари, а лжецами могут быть только Кармель и Дрор, то есть лжецов не больше двух; невозможно.\n\nЕсли \\(k=4\\), обе фразы истинны, но Асаф и Бар были бы лжецами; невозможно. Остается единственный вариант: лжецов ровно двое.",
