        "text": "Асаф, Бар, Кармель и Дрор - братья и сестры. Каждый из них либо рыцарь, который всегда говорит правду, либо лжец, который всегда лжет.\n\nОднажды Асаф сказал: «Среди нас четверых есть хотя бы два лжеца». Затем Бар сказал: «Среди нас есть хотя бы три лжеца».\n\nСколько среди них лжецов?",
