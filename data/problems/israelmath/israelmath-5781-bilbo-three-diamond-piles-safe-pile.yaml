    {
      "id": "idea-equality-certifies-untouched-pile",
      "title": "Равенство и неравенство дают разные безопасные кучки",
      "text": "Нужно не найти фальшивый алмаз, а только гарантированно выбрать кучку без него. Поэтому достаточно устроить взвешивание так, чтобы при равенстве была безопасна одна кучка, а при неравенстве - другая.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-17-against-17",
      "title": "Сравнить кучку из 17 с частью кучки из 21",
      "text": "Назовем кучки \\(A,B,C\\), где в них соответственно 17, 21 и 27 алмазов. Положим на левую чашу все 17 алмазов из \\(A\\), а на правую - любые 17 алмазов из \\(B\\).\n\nЕсли весы в равновесии, то среди этих 34 взвешенных алмазов фальшивого нет: один фальшивый алмаз, более легкий или более тяжелый, нарушил бы равенство. Значит, вся кучка \\(A\\) безопасна, и Бильбо выбирает ее.\n\nЕсли весы не в равновесии, то фальшивый алмаз лежит среди взвешенных алмазов из \\(A\\) или \\(B\\). Кучка \\(C\\) вообще не участвовала во взвешивании, поэтому в этой ветви она точно не содержит фальшивого алмаза. Бильбо выбирает \\(C\\).",
