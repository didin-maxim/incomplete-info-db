        "id": "stmt-israelmath-5781-bilbo-diamonds",
        "title": "Три кучки алмазов и одно взвешивание",
        "text": "Дракон положил перед Бильбо три кучки алмазов и чашечные весы. В кучках 17, 21 и 27 алмазов. Все алмазы выглядят одинаково, но один из них фальшивый, и его вес отличается от веса настоящего алмаза. Как Бильбо с помощью одного взвешивания выбрать кучку, в которой точно нет фальшивого алмаза?",
        "source_ids": ["src-israelmath-5781-final-en-56"],
