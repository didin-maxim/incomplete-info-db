      "id": "str-two-balanced-signatures",
      "title": "Два сравнения с разными ролями мешков",
      "text": "Обозначим мешки по написанным на них весам: 1, 2, 3, 4, 5, 6.\n\nПервое взвешивание: сравним мешок 6 с мешками 1, 2 и 3 вместе. По написанным весам обе стороны весят 6 кг.\n\nВторое взвешивание: сравним мешки 2 и 4 вместе с мешками 1 и 5 вместе. По написанным весам обе стороны тоже весят 6 кг.\n\nЕсли конфеты пропали из некоторого мешка, то в каждом из этих взвешиваний результат показывает роль этого мешка: левая сторона легче, если мешок был слева; правая сторона легче, если мешок был справа; равновесие, если мешок не участвовал. Получаются такие пары результатов:\n\n\\(1\\): правая легче, правая легче; \\(2\\): правая легче, левая легче; \\(3\\): правая легче, равновесие; \\(4\\): равновесие, левая легче; \\(5\\): равновесие, правая легче; \\(6\\): левая легче, равновесие.\n\nВсе шесть пар различны. Если оба раза равновесие, значит недостачи нет: каждый мешок участвует хотя бы в одном из двух взвешиваний, и недостача в участвующем мешке нарушила бы соответствующее равенство.",
