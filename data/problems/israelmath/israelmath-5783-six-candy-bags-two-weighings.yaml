        "title": "Найти мешок, из которого могли съесть конфеты",
        "text": "На складе стоят шесть мешков с шоколадными конфетами. На мешках написаны их веса: 1, 2, 3, 4, 5 и 6 килограммов. Однажды Итай открыл один из мешков и, возможно, съел из него часть конфет. Нужно с помощью двух взвешиваний на чашечных весах определить, из какого мешка, если вообще из какого-то, пропали конфеты.\n\nИтай мог съесть нецелое число килограммов, а мог и не съесть ничего.",
