      "id": "ub-at-most-33-true",
      "title": "Больше 33 истинных быть не может",
      "text": "Пусть истинны \\(k\\ge 34\\) карточки. Тогда ложных карточек не больше 66. Метки на истинных карточках различны и являются числами \\(2,4,\\ldots,200\\), поэтому среди \\(k\\) истинных карточек есть карточка с меткой не меньше \\(2k\\ge 68\\). Ее истинность требует как минимум 68 ложных утверждений слева, а всего ложных утверждений не больше 66. Противоречие.",
