        "title": "Максимум истинных утверждений",
        "text": "Имеется 100 карточек с надписями \"Слева от меня - как минимум 2 ложных утверждения\", \"Слева от меня - как минимум 4 ложных утверждения\", ..., \"Слева от меня - как минимум 200 ложных утверждений\". Петя разложил карточки в ряд слева направо в каком-то порядке. Какое наибольшее число утверждений могло оказаться истинными?",
