      "id": "str-example-with-33-true",
      "title": "Порядок, дающий 33 истинных утверждения",
      "text": "Разложим карточки с числами в порядке \\(200,198,2,196,194,4,192,190,6,\\ldots,72,70,66,68\\). Тогда истинными окажутся карточки с числами от 2 до 66, то есть ровно 33 карточки. Для карточки с числом \\(2m\\), где \\(1\\le m\\le 33\\), слева уже стоят ровно или более \\(2m\\) ложных утверждений за счет больших чисел, размещенных раньше; большие карточки при этом ложны.",
