        "id": "stmt-original",
        "title": "Кто справа рыцарь, а кто слева лжец",
        "text": "В ряд стоят несколько человек, каждый из которых - рыцарь или лжец. Рыцари всегда говорят только правду, а лжецы всегда лгут. Семеро из них на вопрос: \"Верно ли, что все люди, стоящие справа от Вас, - рыцари, а все люди слева от Вас - лжецы?\" ответили \"Да\", а остальные - \"Нет\". Известно, что среди стоящих есть и рыцари, и лжецы. Сколько среди них может быть лжецов?",
        "source_ids": ["src-utyum-official-local-archive"],
        "status": "ai_checked",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["state_space"]
      }
    ]
  },
  "ideas": [
