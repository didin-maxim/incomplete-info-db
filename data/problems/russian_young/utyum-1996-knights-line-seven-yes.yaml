      "id": "idea-leftmost-knight",
      "title": "Самый левый рыцарь задает границу разбора",
      "text": "Если рассмотреть самого левого рыцаря, то все участники слева от него уже известны как лжецы. Его ответ определяет, как интерпретировать ответы остальных.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-leftmost-knight-casework",
      "title": "Разбор по ответу самого левого рыцаря",
      "text": "Возьмем самого левого рыцаря. Если он ответил \"да\", то все справа от него - рыцари, все слева - лжецы. Тогда среди лжецов только крайний справа ответит \"нет\", а остальные лжецы ответят \"да\", и число лжецов совпадает с числом ответов \"да\", то есть равно 7. Если самый левый рыцарь ответил \"нет\", то справа от него есть лжец, а все рыцари отвечают \"нет\". Любой лжец слева от него лжет на утверждение, что справа все рыцари, а любой лжец справа лжет на утверждение, что слева все лжецы. Значит, в этом случае \"да\" ответили ровно лжецы, и их опять 7.",
      "standard_idea_ids": ["partition_state_space"],
