        "id": "stmt-original",
        "title": "Прибор сравнивает две монеты",
        "text": "У Васи есть 17 одинаковых по внешнему виду монет, среди которых 8 фальшивых и 9 настоящих, причем фальшивые монеты весят одинаково и легче настоящих, которые тоже весят одинаково. Еще у Васи есть прибор, который по двум положенным в него монетам определяет, равны монеты по весу, или нет. Вася выбрал одну монету из 17. Как за 8 таких испытаний он может установить, является ли выбранная монета настоящей?",
        "source_ids": ["src-utyum-official-local-archive"],
        "status": "ai_checked",
