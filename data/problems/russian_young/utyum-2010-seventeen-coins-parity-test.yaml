  "ideas": [
    {
      "id": "idea-parity-of-equal-pairs",
      "title": "Четность числа равных пар различает два случая",
      "text": "После удаления выбранной монеты оставшиеся 16 монет можно разбить на 8 пар. Четность числа пар с равными весами зависит от того, была ли выбранная монета настоящей.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-pair-all-other-coins",
      "title": "Разбить остальные монеты на пары",
      "text": "Разобьем 16 невыбранных монет на 8 произвольных пар и сравним монеты внутри каждой пары. Если выбранная монета настоящая, среди оставшихся 8 настоящих и 8 фальшивых; тогда число пар из двух настоящих равно числу пар из двух фальшивых, поэтому общее число равных пар четно. Если выбранная монета фальшивая, среди оставшихся 9 настоящих и 7 фальшивых; тогда пар из двух настоящих на одну больше, чем пар из двух фальшивых, поэтому число равных пар нечетно. По четности числа ответов \"равны\" определяется тип выбранной монеты.",
