    {
      "id": "idea-five-way-first-split",
      "title": "Первое взвешивание дает пять полезных случаев",
      "text": "Нежные весы дают больше информации, чем обычные: кроме равновесия и перевеса, отдельным исходом является поломка с указанием стороны. Первое взвешивание разбивает 17 соседних пар на найденные пары и три блока по шесть последовательных монет.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked"
    }
