        "id": "stmt-original",
        "title": "Нежные весы ломаются при большой разности",
        "text": "По кругу лежит 17 одинаковых на вид монет, из которых две лежащие рядом - фальшивые. Все настоящие монеты весят одинаково, и обе фальшивые монеты весят одинаково и при этом легче настоящих на 1 грамм. Имеются нежные весы: это чашечные весы, которые ломаются, если разность весов на чашах больше 1 грамма; при этом, однако, весы показывают, какая чаша перевесила. Как за два взвешивания на нежных весах без гирь найти обе фальшивые монеты?",
        "source_ids": ["src-yumt-official-local-archive"],
        "status": "ai_checked",
