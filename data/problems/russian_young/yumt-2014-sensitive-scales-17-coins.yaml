  "strategies": [
    {
      "id": "str-official-two-weighings",
      "title": "Сначала выделить блок из шести, затем решить малую задачу",
      "text": "Пронумеруем монеты по кругу от 1 до 17. Первым взвешиванием положим на одну чашу монеты \\(1,2,4,6,14,16\\), а на другую \\(3,5,7,8,10,12\\). Если весы сломались, фальшивая пара уже найдена: это \\((1,2)\\) или \\((7,8)\\), в зависимости от того, какая чаша легче. Если равновесие, кандидаты лежат среди шести последовательных монет 2-7; если первая чаша легче, среди 13,14,15,16,17,1; если вторая легче, среди 8-13. Остается найти соседнюю легкую пару среди шести последовательных монет. Для этого перенумеруем кандидатов 1-6 и взвесим \\(1,2\\) против \\(5,6\\). Поломка сразу указывает на пару \\((1,2)\\) или \\((5,6)\\); равновесие дает \\((3,4)\\); если первая чаша легче, пара \\((2,3)\\); если вторая легче, пара \\((4,5)\\).",
