  "strategies": [],
  "impossibility_proofs": [
    {
      "id": "lb-radius-two-packing",
      "title": "Возможные ответы для разных объектов не должны пересекаться",
      "text": "Если для двух разных объектов есть один и тот же набор ответов, который мог получиться при не более чем двух лжах, то гарантированное угадывание невозможно: этот набор не скажет, какой из двух объектов был задуман. Всего наборов из \\(q\\) ответов да/нет ровно \\(2^q\\), значит необходимо \\(N(1+q+\\binom q2)\\le 2^q\\).",
