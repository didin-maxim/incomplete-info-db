      "title": "Шары Хэмминга радиуса 2 не должны пересекаться",
      "text": "Каждому объекту соответствует истинное двоичное слово длины \\(q\\). Наблюдаемое слово может отличаться от него в 0, 1 или 2 позициях. Поэтому вокруг каждого истинного слова надо зарезервировать \\(1+q+\\binom q2\\) возможных наблюдений.",
