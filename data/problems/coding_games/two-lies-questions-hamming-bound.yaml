  "ideas": [
    {
      "id": "idea-radius-two-balls",
      "title": "Ответы при двух лжах не должны путать два объекта",
      "text": "Каждому объекту соответствует правильный набор из \\(q\\) ответов. Полученный набор может отличаться от него в 0, 1 или 2 местах. Поэтому вокруг каждого правильного набора надо зарезервировать \\(1+q+\\binom q2\\) возможных полученных наборов.",
