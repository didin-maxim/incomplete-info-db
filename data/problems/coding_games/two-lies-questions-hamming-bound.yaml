      "id": "lb-radius-two-packing",
      "title": "Упаковочная оценка",
      "text": "Если два разных объекта имеют пересекающиеся шары Хэмминга радиуса 2, то существует один и тот же набор ответов, совместимый с обоими объектами и не более чем двумя ложными ответами. Тогда гарантированное угадывание невозможно. Всего двоичных слов длины \\(q\\) ровно \\(2^q\\), значит необходимо \\(N(1+q+\\binom q2)\\le 2^q\\).",
