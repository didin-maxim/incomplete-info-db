        "text": "В ряд стоят \\(n\\) узников. Цвет каждой шляпы - один из \\(k\\) заранее занумерованных цветов \\(0,1,\\ldots,k-1\\). Каждый видит шляпы всех впереди. Ответы идут сзади наперед и слышны всем. Как гарантировать, что ошибется не более один узник?",
