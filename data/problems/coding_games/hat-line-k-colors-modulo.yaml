      "title": "Вычитать уже найденные цвета",
      "text": "Первый сзади объявляет сумму цветов всех впереди по модулю \\(k\\). Его собственный ответ может быть неверным. Каждый следующий знает этот исходный остаток, видит сумму цветов впереди себя и уже слышал определенные цвета людей позади, кроме первого кодового ответа. Поэтому он вычисляет свой цвет как разность между известным остатком и суммой видимых впереди цветов по модулю \\(k\\). После этого его настоящий цвет становится известен всем следующим.",
