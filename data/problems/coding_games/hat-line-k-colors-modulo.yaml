      "title": "Первый ответ передает остаток суммы цветов",
      "text": "Занумеруем цвета числами от 0 до \\(k-1\\). Первый говорящий складывает номера всех видимых колпаков, а если сумма стала не меньше \\(k\\), оставляет только остаток при делении на \\(k\\). Цвет с этим номером он и называет.",
