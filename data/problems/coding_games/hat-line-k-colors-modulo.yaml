        "text": "В ряд стоят \\(n\\) узников. Цвет каждого колпака - один из \\(k\\) заранее занумерованных цветов \\(0,1,\\ldots,k-1\\). Каждый видит колпаки всех впереди. Ответы идут сзади наперед и слышны всем. Как гарантировать, что ошибется не более одного узника?",
