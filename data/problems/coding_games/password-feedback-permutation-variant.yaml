      "text": "Можно сделать три проверочные попытки: AAAA, AABB, BCCC. Для каждой из 24 перестановок букв A, B, C, D тройка ответов, то есть три множества совпавших позиций, получается уникальной. Поэтому после этих трех ответов пароль однозначно восстановлен, и четвертая попытка открывает замок.\n\nДвух проверочных попыток недостаточно: полный перебор всех пар проверочных слов длины 4 над алфавитом A, B, C, D показывает, что всегда остаются две разные перестановки с одинаковой парой ответов. Значит, вместе с финальным вводом нужен минимум 4 попытки.",
