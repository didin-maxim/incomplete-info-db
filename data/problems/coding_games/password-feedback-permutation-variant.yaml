        "title": "Пароль из четырех разных букв",
        "text": "Замок требует ввести пароль из 4 букв. Известно, что в пароле каждая из букв A, B, C, D встречается ровно один раз. После каждой попытки компьютер сообщает, какие именно позиции, если такие есть, угаданы верно. Попытки тоже должны быть словами длины 4 из букв A, B, C, D, но в них буквы можно повторять. Какое минимальное число попыток гарантирует открытие замка?",
