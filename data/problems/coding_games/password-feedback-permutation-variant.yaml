      "title": "Три проверки перед финальным вводом",
      "text": "Можно сделать три проверочные попытки: AAAA, AABB, BCCC. Для каждой из 24 перестановок букв A, B, C, D тройка ответов, то есть три множества совпавших позиций, получается уникальной. Поэтому после этих трех ответов пароль однозначно восстановлен, и четвертая попытка открывает замок.\n\nДвух проверочных попыток недостаточно даже при адаптивном выборе второй попытки. Это проверяется конечным перебором дерева глубины 2: для каждого первого слова длины 4 строятся классы скрытых перестановок с одинаковым первым ответом, а затем проверяется, существует ли для каждого такого класса второе слово, разделяющее все перестановки внутри класса. Ни один первый ход этого не позволяет. Значит, вместе с финальным вводом нужен минимум 4 попытки.",
