  "ideas": [
    {
      "id": "idea-boundary-includes-all-genuine",
      "title": "Скрытое состояние - последняя настоящая монета",
      "text": "Так как все настоящие монеты стоят левее всех фальшивых и хотя бы одна настоящая есть, состояние задается номером последней настоящей монеты. В задаче Д.6 это один из девяти номеров; девятый номер означает, что фальшивых монет нет.",
      "standard_idea_ids": [
        "partition_state_space",
        "structural_constraint"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-add-imaginary-fake",
      "title": "Воображаемая фальшивая монета справа",
      "text": "Если мысленно добавить справа еще одну фальшивую монету, задача превращается в вариант, где оба типа точно есть и нужно найти границу между настоящими и фальшивыми. Добавленную монету нельзя класть на весы, но она помогает увидеть, почему число состояний равно числу исходов.",
      "standard_idea_ids": [
