      "id": "lb-more-than-3k-boundaries",
      "title": "Больше \\(3^k\\) монет нельзя",
      "text": "Для \\(n\\) монет возможны \\(n\\) положений последней настоящей монеты: от 1 до \\(n\\). Каждое взвешивание на чашечных весах дает не более трех исходов, поэтому \\(k\\) взвешиваний различают не более \\(3^k\\) состояний. Значит, при \\(n>3^k\\) гарантированного решения быть не может. Отдельно для \\(k=1\\) максимум равен 2, а не 3: при трех монетах ни одно одноразовое сравнение не дает три разных исхода для границ 1, 2, 3.",
