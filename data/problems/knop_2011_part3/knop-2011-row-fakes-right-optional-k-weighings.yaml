  "strategies": [
    {
      "id": "str-d6-explicit-two-weighings",
      "title": "Явная таблица для девяти монет",
      "text": "Обозначим через \\(t\\) номер последней настоящей монеты. Первым взвешиванием сравним монеты 4 и 5 с монетами 1 и 8. Если левая чаша легче, то \\(t=1,2,3\\); если равновесие, то \\(t=4,8,9\\); если левая чаша тяжелее, то \\(t=5,6,7\\).\n\nОставшуюся тройку различаем вторым взвешиванием. В ветви \\(t=1,2,3\\) сравним 2+3 с 1+4: левая легче, равенство и левая тяжелее дают соответственно \\(t=1,2,3\\). В ветви \\(t=5,6,7\\) сравним 6+7 с 1+8: исходы левая легче, равенство, левая тяжелее дают \\(t=5,6,7\\). В ветви \\(t=4,8,9\\) сравним 5+6 с 1+9: левая легче дает \\(t=4\\), левая тяжелее дает \\(t=8\\), равенство дает \\(t=9\\). После нахождения \\(t\\) монеты 1, ..., \\(t\\) настоящие, а остальные фальшивые.",
      "standard_idea_ids": [
        "partition_state_space",
        "ternary_search"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "balance_scale",
        "strategy"
      ]
    },
    {
      "id": "str-d7-k-weighings-outline",
      "title": "Ответ для k взвешиваний",
      "text": "Для \\(k\\ge2\\) решается ряд из \\(3^k\\) монет. Будем хранить не обязательно подряд идущий список \\(T=(t_1<\\dots<t_{3^r})\\) возможных номеров последней настоящей монеты; сначала это \\(1,2,\\ldots,3^k\\). Если список уже состоит из одного номера, граница найдена.\n\nПока \\(r>2\\), положим \\(q=3^{r-2}\\) и сравним монеты \\(t_{3q+1}+t_{4q+1}\\) с монетами \\(t_1+t_{7q+1}\\). Если настоящая граница равна \\(t_j\\), разность весов левой и правой чаши меняется только в четырех местах: после \\(t_1\\), \\(t_{3q+1}\\), \\(t_{4q+1}\\), \\(t_{7q+1}\\). Поэтому исходы такие: левая легче при \\(j=1,\\ldots,3q\\), равенство при \\(j=3q+1,\\ldots,4q\\) или \\(j=7q+1,\\ldots,9q\\), левая тяжелее при \\(j=4q+1,\\ldots,7q\\). Каждый раз остается ровно \\(3^{r-1}\\) возможных номеров; заменяем \\(T\\) соответствующим подсписком и продолжаем.\n\nКогда остается 9 возможных номеров \\(u_1<\\dots<u_9\\), применяем ту же двухходовую таблицу, что в Д.6, только вместо номеров 1,...,9 берем \\(u_1,\\ldots,u_9\\). Сначала сравниваем \\(u_4+u_5\\) с \\(u_1+u_8\\). В ветви \\(u_1,u_2,u_3\\) сравниваем \\(u_2+u_3\\) с \\(u_1+u_4\\); в ветви \\(u_5,u_6,u_7\\) сравниваем \\(u_6+u_7\\) с \\(u_1+u_8\\); в ветви \\(u_4,u_8,u_9\\) сравниваем \\(u_5+u_6\\) с \\(u_1+u_9\\). В каждой ветви три исхода дают три разных номера границы. Так за \\(k\\) взвешиваний определяется последняя настоящая монета.",
      "standard_idea_ids": [
        "decision_tree_lower_bound",
        "ternary_search"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "strategy"
      ]
    }
