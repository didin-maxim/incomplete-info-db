        "text": "В ряд выложены монеты. Среди них заведомо есть настоящие монеты, но фальшивых может и не быть. Все настоящие монеты весят по 10 г, все фальшивые - по 9 г, и каждая настоящая монета лежит левее любой фальшивой. Для каких чисел монет можно за \\(k\\) взвешиваний определить все настоящие монеты?",
