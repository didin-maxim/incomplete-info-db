        "id": "stmt-d6",
        "title": "Девять монет и возможный пустой суффикс фальшивых",
        "text": "Девять монет выложены в ряд. Среди них заведомо есть настоящие монеты, но фальшивых может и не быть. Все настоящие монеты весят по 10 г, все фальшивые - по 9 г, и каждая настоящая монета лежит левее любой фальшивой. Как за два взвешивания определить все настоящие монеты?",
