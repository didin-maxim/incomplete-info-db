      "title": "Сравнить 3 с 6",
      "text": "Пронумеруем предметы по кругу. Первым взвешиванием сравним 3 против 6. Если предмет 3 легче, возможны тройки 1-2-3, 2-3-4 или 3-4-5; если предмет 6 легче - тройки 4-5-6, 5-6-7 или 6-7-8; если равновесие - тройки 7-8-9, 8-9-1 или 9-1-2. В каждой оставшейся тройке второе взвешивание сравнивает две крайние возможные позиции; например, после первого результата “3 легче” сравним 1 против 5: более легкий крайний предмет указывает одну из крайних троек, а равновесие - среднюю тройку 2-3-4.",
