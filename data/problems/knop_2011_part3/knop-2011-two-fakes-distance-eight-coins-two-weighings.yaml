      "id": "str-first-12-vs-56",
      "title": "Первое взвешивание 1+2 против 5+6",
      "text": "Пронумеруем монеты слева направо. Сначала сравним 1+2 с 5+6. Если левая чаша легче, возможны пары (1,7), (1,8), (2,7), (2,8), то есть расстояния 5, 6, 4, 5. Вторым взвешиванием сравним 1 и 7: левая легче дает расстояние 6, правая легче - расстояние 4, равновесие - расстояние 5.\n\nЕсли правая чаша легче, симметрично возможны пары (3,5), (3,6), (4,5), (4,6), то есть расстояния 1, 2, 0, 1. Вторым взвешиванием сравним 3 и 5: левая легче дает расстояние 2, правая легче - расстояние 0, равновесие - расстояние 1.",
      "standard_idea_ids": ["state_space_encoding", "adaptive_strategy"],
