        "text": "В ряд лежат 8 монет, при этом из левых четырех одна фальшивая и из правых четырех тоже одна. Обе фальшивые легче настоящих и равны по весу друг другу. За два взвешивания найдите, сколько настоящих монет лежит между парой фальшивых; сами фальшивые монеты определять не обязательно.",
