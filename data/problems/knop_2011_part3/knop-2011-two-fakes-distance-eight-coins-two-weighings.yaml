      "id": "str-equality-branch",
      "title": "Равная ветвь",
      "text": "Если первое взвешивание дало равновесие, возможны пары (1,5), (1,6), (2,5), (2,6), (3,7), (3,8), (4,7), (4,8). Вторым взвешиванием, как в книге, сравним 1+3 с 5+7. Если левая чаша легче, расстояние равно 4; если правая легче, расстояние равно 2; если равновесие, расстояние равно 3.",
