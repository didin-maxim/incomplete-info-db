        "id": "stmt-knop-2011-part3",
        "title": "Пять монет, две равные фальшивые, найти настоящую",
        "text": "Среди пяти одинаковых на вид монет три настоящие и две фальшивые. Две фальшивые одинаковы по весу, но неизвестно, легче они настоящих или тяжелее. За какое наименьшее число взвешиваний можно найти хотя бы одну настоящую монету?",
