  "ideas": [
    {
      "id": "idea-two-equalities-or-inequalities",
      "title": "Сравнить две независимые пары",
      "text": "Две пары одиночных монет дают достаточно информации: если обе пары ведут себя одинаково, пятая монета не может быть фальшивой; если одна пара равна, две монеты из равной пары настоящие.",
      "standard_idea_ids": [
        "partition_state_space",
        "certificate_of_one_object"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-1-vs-2-and-3-vs-4",
      "title": "Два сравнения одиночных пар",
      "text": "Сравним 1 с 2 и 3 с 4. Если оба взвешивания дают равенство, то в каждой из двух пар либо обе монеты настоящие, либо обе фальшивые; так как фальшивых всего две, монета 5 настоящая. Если оба взвешивания дают неравенство, то в каждой из первых двух пар есть одна настоящая и одна фальшивая, значит обе фальшивые уже среди монет 1-4, и монета 5 настоящая. Если одно взвешивание дает равенство, а другое неравенство, то равная пара не может состоять из двух фальшивых, иначе в неравной паре не хватило бы второй фальшивой; поэтому обе монеты равной пары настоящие.",
      "standard_idea_ids": [
