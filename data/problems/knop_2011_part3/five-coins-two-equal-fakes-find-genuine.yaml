      "title": "Одного взвешивания недостаточно",
      "text": "Если сравнить одиночные монеты и получить неравенство, неясно, какая из них настоящая. Если сравнить по две монеты и получить неравенство, каждая из пяти монет еще может быть настоящей в некотором допустимом состоянии.",
