        "title": "13 эталонных гирек и одна испорченная",
        "text": "Даны 13 гирек-эталонов массами 1 г, 2 г, ..., 13 г. Одна гирька испорчена и немного отличается от правильного веса, но неизвестно, в какую сторону. Найдите испорченную гирьку за три взвешивания.",
