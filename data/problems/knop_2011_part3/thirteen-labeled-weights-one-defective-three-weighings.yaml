      "id": "str-three-planned-weighings",
      "title": "План из трех взвешиваний",
      "text": "В книге приведен план, не зависящий от результатов: \\(1+2+3+4+5+8\\) против \\(6+7+10\\); затем \\(1+2+3+6+9+10\\) против \\(8+11+12\\); затем \\(1+5+7+9+12\\) против \\(3+8+10+13\\). В каждом взвешивании суммы маркировок на чашах равны. После трех исходов дефектная гирька восстанавливается по своей судьбе: для тяжелой гирьки получается одна цепочка перекосов, для легкой - противоположная. В этом плане никакие две гирьки не имеют одинаковые или противоположные судьбы во всех трех взвешиваниях, поэтому все 26 состояний различаются.",
