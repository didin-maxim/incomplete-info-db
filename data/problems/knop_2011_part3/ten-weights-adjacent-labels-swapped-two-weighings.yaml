      "id": "idea-nine-adjacent-swaps",
      "title": "Девять возможных путаниц",
      "text": "Возможны только девять обменов соседних этикеток. Взвешивание вида \\(m+n\\) против \\(m+n\\) по этикеткам дает перекосы на единицу и может разделить эти девять вариантов на три тройки.",
