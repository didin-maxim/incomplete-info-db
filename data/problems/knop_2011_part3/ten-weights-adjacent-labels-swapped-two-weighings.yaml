        "title": "Перепутанные этикетки у соседних гирь",
        "text": "Есть 10 различных гирь массами 1 г, 2 г, ..., 10 г. Около каждой лежит этикетка с массой, но этикетки у каких-то двух гирь, массы которых отличаются на 1 г, перепутаны. За два взвешивания найдите эти две гири.",
