        "linear_signature"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-3-plus-5-vs-8",
      "title": "Первое взвешивание 3+5 против 8",
      "text": "Первым взвешиванием сравним гири с этикетками 3 и 5 против гири с этикеткой 8. Если левая чаша легче, перепутаны 2-3, 4-5 или 8-9; если левая тяжелее, перепутаны 3-4, 5-6 или 7-8; если равновесие, перепутаны 1-2, 6-7 или 9-10. Вторым взвешиванием можно, например, сравнить гири с этикетками 2 и 5 против гири с этикеткой 7; в каждой из трех оставшихся троек это снова дает три разных исхода.",
