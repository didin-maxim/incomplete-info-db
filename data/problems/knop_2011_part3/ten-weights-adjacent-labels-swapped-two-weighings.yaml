        "title": "Д.9: девять гирь и возможное отсутствие перепутанных этикеток",
        "text": "Дополнительная задача Д.9 формулирует близкий вариант: есть 9 различных гирь массой 1 г, 2 г, ..., 9 г; этикетки каких-то двух гирь соседних масс, возможно, перепутаны местами. Нужно за два взвешивания найти эти гири или установить, что перепутанных этикеток нет. Книга сводит этот вариант к задаче 3.6: в решении 3.6 гири с этикетками 9 и 10 не взвешиваются, поэтому случай без перепутанных этикеток среди 1-9 можно трактовать как виртуальную путаницу 9 и 10.",
