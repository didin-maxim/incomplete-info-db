      "id": "str-31-chain-binary-halving",
      "title": "Цепочка из 31 звена",
      "text": "Разрежем среднее, 16-е звено и сравним две получившиеся цепочки по 15 звеньев. Если одна цепочка легче, фальшивое звено находится в ней; если они равны, фальшиво разрезанное звено. В первом случае снова разрезаем середину подозрительной цепочки: 15 превращается в две цепочки по 7 и отдельное звено, затем 7 - в две цепочки по 3 и отдельное звено, затем 3 - в два крайних звена и среднее. После четвертого разреза сравнение крайних звеньев находит фальшивое либо оставляет среднее как единственный вариант.",
      "standard_idea_ids": ["binary_search", "partition_state_space"],
      "status": "ai_checked",
