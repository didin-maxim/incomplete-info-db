    {
      "id": "str-95-chain-reduction",
      "title": "Цепочка из 95 звеньев",
      "text": "Сначала разрежем 32-е и 64-е звенья. Останутся три неразрезанные цепочки по 31 звену и два отдельных звена. Сравним три большие цепочки между собой. Если одна цепочка легче или тяжелее двух других, фальшивое звено лежит в ней, а его знак уже известен; дальше используем схему для 31 звена, потратив еще четыре разреза. Для известного тяжелого звена та же схема работает с заменой слова «легче» на «тяжелее».\n\nЕсли все три большие цепочки равны, фальшивое звено не в них, а среди двух разрезанных. Возьмем любое звено из большой цепочки: оно настоящее. Сравним с ним одно из двух разрезанных звеньев. При неравенстве это звено фальшивое, при равенстве фальшиво второе разрезанное звено. Дополнительных разрезов не требуется, поэтому всего хватает шести разрезов.",
