        "text": "а) Незамкнутая цепочка составлена из 31 звена. Известно, что одно из звеньев фальшивое, оно легче остальных. Докажите, что при помощи взвешиваний можно найти фальшивое звено, разрезав не более четырех звеньев.\n\nб) Незамкнутая цепочка составлена из 95 звеньев. Известно, что одно из звеньев фальшивое, оно отличается по весу от остальных: неизвестно, легче оно или тяжелее. Докажите, что при помощи взвешиваний можно найти фальшивое звено, разрезав не более шести звеньев.",
