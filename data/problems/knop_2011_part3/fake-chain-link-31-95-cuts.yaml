      "title": "Разрезанное среднее звено становится отдельным третьим случаем",
      "text": "В цепочке длины \\(2n+1\\) один разрез среднего звена оставляет две одинаковые цепочки длины \\(n\\) и одно отдельное звено. Сравнение двух цепочек либо выбирает легкую половину, либо показывает, что фальшивым было именно разрезанное звено.",
