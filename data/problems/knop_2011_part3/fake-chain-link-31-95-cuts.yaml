      "title": "Случай неизвестного знака сначала сводится к легкому случаю",
      "text": "Цепочку из 95 звеньев можно двумя разрезами разбить на три равные цепочки по 31 звену. Если один блок отличается от двух других, знак отличия виден по сравнению блоков. Если все три блока равны, фальшивое звено одно из двух разрезанных; тогда любое звено большого блока уже служит настоящим эталоном.",
