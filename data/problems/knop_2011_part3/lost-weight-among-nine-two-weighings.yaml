  "ideas": [
    {
      "id": "idea-two-against-one",
      "title": "Искать взвешивание две против одной",
      "text": "Если пронумеровать оставшиеся гири по размеру от 1 до 8, то при потере гири массы \\(p\\) гиря с номером \\(k\\) весит \\(k\\) при \\(k<p\\) и \\(k+1\\) при \\(k\\ge p\\). Сравнение \\(m+n\\) против гири с номером \\(m+n\\) делит возможные потери по положению \\(p\\).",
      "standard_idea_ids": [
        "partition_state_space"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-first-3-plus-5-vs-8",
      "title": "Первое взвешивание 3+4 против 7",
      "text": "Пронумеруем оставшиеся гири по размеру числами 1-8. Первым взвешиванием сравним гири с номерами 3 и 4 против гири с номером 7. Если левая чаша тяжелее, потеряна одна из гирь 1, 2, 3; если левая чаша легче - одна из 5, 6, 7; если равновесие - одна из 4, 8, 9. Второе взвешивание разбивает соответствующую тройку: для 1, 2, 3 сравним 1+2 против 3; исходы >, =, < дают соответственно 1, 2, 3. Для 5, 6, 7 сравним 5+6 против 1+3+7; исходы >, =, < дают соответственно 5, 6, 7. Для 4, 8, 9 сравним 4+5 против 1+8; исходы >, <, = дают соответственно 4, 8, 9.",
