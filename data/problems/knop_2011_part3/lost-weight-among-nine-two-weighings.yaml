        "id": "stmt-knop-2011-part3",
        "title": "Потерянная гирька среди девяти",
        "text": "Было девять гирь массами 1 г, 2 г, ..., 9 г, причем большая масса соответствует большему размеру. Одна гиря потерялась. Оставшиеся восемь гирь можно упорядочить по размеру, но их исходные массы сдвинуты после пропажи. Как за два взвешивания выяснить, какая гиря потеряна?",
        "source_ids": [
          "src-knop-2011-weighings-algorithms"
        ],
