      "title": "Два заранее заданных сравнения",
      "text": "Сделаем два взвешивания: \\(1+2\\) против \\(3\\), затем \\(1+3\\) против \\(4\\). Возможные пары результатов дают восемь ответов: \\(<,<\\) означает, что гиря 1 легкая; \\(<,=\\) - гиря 2 легкая; \\(<,>\\) - гиря 3 тяжелая; \\(=,<\\) - гиря 4 тяжелая; \\(=,>\\) - гиря 4 легкая; \\(>,<\\) - гиря 3 легкая; \\(>,=\\) - гиря 2 тяжелая; \\(>,>\\) - гиря 1 тяжелая.",
