      "title": "Ответ «равно» можно поддерживать до последней монеты",
      "text": "Нет, гарантировать определение знака нельзя. Рассмотрим допустимый ход событий, где каждое информативное взвешивание равных по числу групп дает равновесие. Тогда все монеты, попавшие на чаши, становятся заведомо настоящими и по условию сразу выплачиваются. Из нечетного числа монет каждый раз удаляется четное число, поэтому до конца остается нечетное число невыданных монет; в предельном случае последняя монета может быть фальшивой. К этому моменту все настоящие монеты уже выданы и не участвуют во взвешиваниях, так что сравнить последнюю монету с настоящей невозможно. Два состояния - последняя монета легче настоящей и последняя монета тяжелее настоящей - дают один и тот же предыдущий протокол равенств.",
