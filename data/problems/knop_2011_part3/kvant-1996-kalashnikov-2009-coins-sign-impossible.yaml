        "title": "Настоящие монеты сразу выплачиваются",
        "text": "В кассе купца Калашникова появились деньги - 2009 монет. Известно, что одна из них фальшивая, отличающаяся по весу от настоящих. Работники требуют немедленной выдачи зарплаты настоящими монетами. У приказчика имеются чашечные весы без гирь. Как только становится ясно, что какие-либо монеты настоящие, они выплачиваются очередным работникам и в дальнейших взвешиваниях не участвуют. Любопытный приказчик хочет определить, легче фальшивая монета настоящей или тяжелее. Сможет ли он наверняка это сделать?",
