        "title": "Найти 4-граммовую монету",
        "text": "Из девяти внешне одинаковых монет 7 весят по 2 г, одна - 1 г и еще одна - 4 г. Как за 3 взвешивания на двухчашечных весах без гирь найти 4-граммовую монету?",
