  "ideas": [
    {
      "id": "idea-heavy-pan-keeps-four-gram-coin",
      "title": "Пары кандидатов удобно проверять одинаковым шаблоном",
      "text": "Сравнение двух пар монет грубо отделяет сторону, где может быть 4-граммовая монета, но 1-граммовая монета может сделать тяжелой пару без 4-граммовой. Поэтому после первого сравнения нужно не просто идти за тяжелой чашей, а повторить сравнение подозрительной пары с новой парой и затем проверить одну пару монет.",
      "standard_idea_ids": ["binary_search"],
      "status": "ai_checked"
    },
    {
      "id": "idea-equality-puts-heavy-outside",
      "title": "Равенство сужает поиск к еще не тронутым монетам",
      "text": "Если две пары дают равновесие, то среди них либо нет 4-граммовой монеты, либо отклонения скомпенсированы. В выбранной схеме оставшиеся варианты по 4-граммовой монете все равно попадают в одну из малых групп, которую можно проверить одним последним сравнением.",
      "standard_idea_ids": ["structural_constraint"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-weigh-4-then-2-then-1",
      "title": "Дерево из трех сравнений пар",
      "text": "Пронумеруем монеты 1-9. Сначала сравним 1+2 с 3+4.\n\nЕсли левая чаша тяжелее, сравним 1+2 с 5+6. При перевесе левой чаши сравним 1 с 2: тяжелая из них - 4-граммовая. При перевесе правой чаши сравним 1 с 5: если 5 тяжелее, ответ 5; если равновесие, ответ 6. При равновесии сравним 7 с 8: тяжелая из них - ответ, а при равновесии ответ 9.\n\nЕсли правая чаша тяжелее в первом взвешивании, действуем симметрично: сравним 3+4 с 5+6. При перевесе левой чаши сравним 3 с 4; при перевесе правой - сравним 3 с 5, где перевес 5 дает ответ 5, а равновесие дает ответ 6; при равновесии сравним 7 с 8, а равенство означает ответ 9.\n\nЕсли первое взвешивание дало равновесие, сравним 5+6 с 7+8. При перевесе левой чаши сравним 5 с 6: тяжелая из них - ответ, а при равновесии ответ 9. При перевесе правой чаши сравним 7 с 8: тяжелая из них - ответ, а при равновесии ответ 9.",
