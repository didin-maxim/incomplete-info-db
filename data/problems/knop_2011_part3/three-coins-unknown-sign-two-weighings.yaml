      "id": "idea-six-cases",
      "title": "Различать надо шесть случаев",
      "text": "У трех монет не три, а шесть возможных состояний: каждая монета может быть фальшивой легкой или фальшивой тяжелой. Первое взвешивание должно оставить не больше трех случаев.",
