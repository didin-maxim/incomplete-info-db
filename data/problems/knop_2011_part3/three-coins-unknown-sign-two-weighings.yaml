  "strategies": [
    {
      "id": "str-compare-1-2-then-1-3",
      "title": "Сравнить 1 с 2, затем 1 с 3",
      "text": "Сначала сравним монеты 1 и 2. Вторым взвешиванием сравним монеты 1 и 3. Пара результатов однозначно задает ответ: если оба раза левая чаша легче, то монета 1 легкая; если сначала левая легче, а затем равенство, то монета 2 тяжелая; если сначала равновесие, а затем левая чаша легче, то монета 3 тяжелая; если сначала равновесие, а затем левая чаша тяжелее, то монета 3 легкая; если сначала левая чаша тяжелее, а затем равенство, то монета 2 легкая; если оба раза левая чаша тяжелее, то монета 1 тяжелая. Две оставшиеся пары результатов невозможны при ровно одной фальшивой монете.",
