      "title": "Сначала 4 против 8",
      "text": "Первым взвешиванием положим на левую чашу любые 4 монеты, а на правую - любые другие 8 монет. Если перевесила правая чаша, фальшивая среди 4 левых монет; если перевесила левая - среди 8 правых; если равновесие - среди 9 монет вне весов. Все остальные монеты в соответствующей ветви становятся известными настоящими.",
