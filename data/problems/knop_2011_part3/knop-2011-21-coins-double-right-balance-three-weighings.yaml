        "id": "stmt-d8",
        "title": "Одна легкая монета и равновесие при правом грузе вдвое тяжелее",
        "text": "Среди 21 внешне одинаковых монет все, кроме одной, настоящие, весящие одинаково, и одна фальшивая, весящая легче настоящей. Имеются чашечные весы, которые оказываются в равновесии, если груз на правой их чашке ровно вдвое тяжелее, чем на левой. Если груз на правой чашке меньше, чем удвоенный груз на левой, то перевешивает левая чашка, а если больше, то правая. Как за три взвешивания на этих весах найти фальшивую монету?",
        "source_ids": ["src-knop-2011-weighings-algorithms"],
