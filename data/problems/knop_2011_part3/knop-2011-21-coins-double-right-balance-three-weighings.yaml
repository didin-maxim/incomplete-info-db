    {
      "id": "str-finish-with-ternary-splits",
      "title": "Дальше делить подозреваемых на три группы",
      "text": "В оставшиеся два взвешивания работаем с группой из 4, 8 или 9 подозреваемых. Остальные монеты в этой ветви уже настоящие. Делим подозреваемых на три части \\(A,B,C\\): для 9 монет - по 3, для 8 монет - 3, 3 и 2, для 4 монет - 1, 1 и 2. Кладем \\(A\\) на левую чашу, \\(B\\) на правую и добавляем на правую столько настоящих монет, сколько лежит в \\(A\\). Тогда при настоящих подозреваемых правая чаша ровно вдвое тяжелее левой.\n\nЕсли фальшивая монета в \\(A\\), левая чаша становится чуть легче, и перевешивает правая. Если фальшивая в \\(B\\), правый груз становится меньше удвоенного левого, и перевешивает левая. Если фальшивая в \\(C\\), сохраняется равновесие. После этого остается не больше трех подозреваемых. Последним взвешиванием делаем то же самое с разбиением 1, 1 и остаток: одну подозрительную кладем налево, вторую - направо вместе с одной настоящей монетой, остальные подозрительные оставляем вне весов. Три исхода указывают соответственно на первую, вторую или оставшуюся монету.",
