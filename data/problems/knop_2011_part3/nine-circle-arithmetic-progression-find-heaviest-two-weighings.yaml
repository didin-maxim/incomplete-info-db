      "id": "idea-nine-cyclic-shifts",
      "title": "Различить девять циклических сдвигов",
      "text": "Скрытое состояние - один из девяти сдвигов арифметической прогрессии на круге. Подходящее первое взвешивание делит эти сдвиги на три группы по три.",
