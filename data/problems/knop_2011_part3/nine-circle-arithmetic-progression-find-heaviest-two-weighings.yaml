  "strategies": [
    {
      "id": "str-k1-k3-vs-k6-k7",
      "title": "Первое взвешивание K1+K3 против K6+K7",
      "text": "Пронумеруем места \\(K_1,\\ldots,K_9\\) по часовой стрелке. Первым взвешиванием сравним \\(K_1+K_3\\) с \\(K_6+K_7\\). По таблице сдвигов результат \\(<\\) соответствует случаям \\(K_1=10,20,30\\), результат \\(>\\) - случаям \\(K_1=50,60,70\\), равновесие - случаям \\(K_1=40,80,90\\). Для каждой тройки второе взвешивание разделяет ее: например, после результата \\(<\\) сравним \\(K_1+K_5\\) с \\(K_7\\); после результата \\(>\\) сравним \\(K_1\\) с \\(K_6+K_8\\); после равновесия сравним \\(K_6\\) с \\(K_3+K_4\\). Узнав сдвиг, называем место котлеты весом 90 г.",
