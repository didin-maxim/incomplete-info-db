        "id": "stmt-knop-2011-part3",
        "title": "Две пары весов, одна всегда показывает равенство",
        "text": "Даны 9 одинаковых на вид монет, одна из них фальшивая и легче остальных. Есть две внешне неразличимые пары чашечных весов; одна пара исправна, а другая заедает и при любом взвешивании с равным числом монет на чашах показывает равенство. За какое наименьшее число взвешиваний можно найти фальшивую монету?",
        "source_ids": [
          "src-knop-2011-weighings-algorithms"
        ],
