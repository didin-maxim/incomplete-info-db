  "ideas": [
    {
      "id": "idea-find-good-scale-or-glue-cases",
      "title": "Найти исправные весы или склеить случаи",
      "text": "Неравенство сразу доказывает, что использованные весы исправны. Если подряд получаются равенства на разных весах, нужно объединять случаи, в которых фальшивая монета найдена, но неисправные весы не определены.",
      "standard_idea_ids": [
        "fault_tolerant_testing",
        "partition_state_space"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-three-weighings-sticking-balance",
      "title": "Три взвешивания",
      "text": "Сначала на одних весах сравним 1+2+3+4 с 5+6+7+8. Если есть неравенство, эти весы исправны, и за два обычных взвешивания на них находим легкую монету среди четырех с легкой чаши. Если равновесие, вторым взвешиванием на других весах сравним 1+2+3 с 5+6+7. Если есть неравенство, вторые весы исправны, и одним взвешиванием на них находим легкую монету среди трех с легкой чаши. Если снова равновесие, то либо первые весы исправны и фальшива 9, либо вторые исправны и фальшива одна из 4, 8, 9. Последним взвешиванием на вторых весах сравним 4 с 8: при неравенстве находим фальшивую, а при равенстве фальшива 9.",
      "standard_idea_ids": [
        "fault_tolerant_testing",
        "adaptive_strategy"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "balance_scale",
        "strategy"
      ]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-two-weighings-not-enough",
      "title": "Двух взвешиваний недостаточно",
      "text": "Если в первом взвешивании сравнить по четыре монеты и получить неравенство, то останутся четыре подозрительные монеты, а одним взвешиванием их не различить. Если на чашах меньше четырех монет, то отложены как минимум две монеты; второе взвешивание придется делать на других весах, и если именно они заедают, отложенные монеты останутся неразличимыми.",
