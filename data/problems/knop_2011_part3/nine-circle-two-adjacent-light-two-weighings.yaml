        "title": "Две соседние легкие котлеты на круге из девяти",
        "text": "По кругу лежат 9 одинаковых с виду котлет. Семь из них одинаковые, а две более легкие и лежат рядом; легкие котлеты не обязаны быть равны между собой. Найдите обе легкие котлеты за два взвешивания.",
