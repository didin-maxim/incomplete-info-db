  "strategies": [
    {
      "id": "str-23-vs-56",
      "title": "Сравнить 2+3 с 5+6",
      "text": "Пронумеруем котлеты по кругу. Первым взвешиванием сравним 2+3 против 5+6. Если левая чаша легче, возможны пары 1-2, 2-3 или 3-4; если правая легче - пары 4-5, 5-6 или 6-7; если равновесие - пары 7-8, 8-9 или 9-1. В каждой тройке второе взвешивание сравнивает две крайние подозрительные котлеты. Например, для тройки 1-2, 2-3, 3-4 сравним 1 против 4: если легче 1, пара 1-2; если легче 4, пара 3-4; если равновесие, пара 2-3.",
