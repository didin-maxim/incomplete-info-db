      "id": "idea-adjacent-pairs-nine",
      "title": "Скрытая соседняя пара",
      "text": "Есть девять возможных соседних пар. Первое взвешивание должно сгруппировать их по три, а второе сравнение одиночных подозрительных котлет разбивает оставшуюся тройку.",
