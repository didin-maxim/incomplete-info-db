  "strategies": [
    {
      "id": "str-first-1-8-vs-4-5",
      "title": "Сравнить 1+8 с 4+5",
      "text": "Первым взвешиванием сравним монеты 1 и 8 против монет 4 и 5. Если левая чаша тяжелее, последняя настоящая монета - 1-я, 2-я или 3-я; если левая чаша легче - 5-я, 6-я или 7-я; если равновесие - 4-я, 8-я или 9-я. В тройках 1, 2, 3 и 5, 6, 7 второе взвешивание сравнивает сумму двух пограничных монет с известной суммой 19 г: монета 1 настоящая, монета 10 фальшивая, поэтому 1+10 всегда весит 19 г. Для 1, 2, 3 сравним 2+3 против 1+10; исходы <, =, > дают соответственно 1, 2, 3. Для 5, 6, 7 сравним 6+7 против 1+10; исходы <, =, > дают соответственно 5, 6, 7. Для тройки 4, 8, 9 сравним 1+9 против 5+6; исходы >, <, = дают соответственно 4, 8, 9.",
