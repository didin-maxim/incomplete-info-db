        "id": "stmt-imo-2000-p4",
        "title": "По сумме двух карт определить третью коробку",
        "text": "У фокусника есть 100 карт с числами от 1 до 100. Он раскладывает их по трем коробкам: красной, белой и синей, причем каждая коробка непуста. Затем зритель выбирает две коробки, берет из каждой по одной карте и называет только сумму двух чисел. По этой сумме фокусник должен всегда определить, из какой коробки карта не была взята. Сколькими способами можно разложить карты по коробкам, чтобы такой фокус гарантированно работал? Два способа считаются разными, если хотя бы одна карта лежит в другой коробке.",
        "source_ids": [
          "src-aops-wiki-imo-2000-p4",
          "src-imo-official-2000-problems"
        ],
        "status": "ai_checked",
        "self_contained": {
