        "id": "stmt-imo-2012-p3",
        "title": "За каждые k+1 ответов хотя бы один правдив",
        "text": "Играют двое. Перед началом известны положительные целые числа \\(k\\) и \\(n\\). Первый игрок выбирает целые числа \\(x\\) и \\(N\\), где \\(1\\le x\\le N\\), сообщает второму игроку число \\(N\\), но скрывает \\(x\\). Второй игрок может сколько угодно раз задавать вопросы вида: «принадлежит ли \\(x\\) заданному множеству положительных целых чисел \\(S\\)?» На каждый вопрос первый игрок отвечает «да» или «нет» и может лгать, но среди любых \\(k+1\\) подряд идущих ответов хотя бы один обязан быть правдивым. После вопросов второй игрок называет множество \\(X\\) не более чем из \\(n\\) положительных целых чисел и выигрывает, если \\(x\\in X\\). Докажите: (a) если \\(n\\ge 2^k\\), то второй игрок имеет выигрышную стратегию; (b) при достаточно больших \\(k\\) существует \\(n\\ge 1.99^k\\), для которого второй игрок не может гарантировать выигрыш.",
        "source_ids": ["src-aops-wiki-imo-2012-p3", "src-imo-official-2012-shortlist-c6"],
        "status": "ai_checked",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["strategy", "information_lower_bound"]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-force-one-candidate-block-out",
      "title": "Серии длины k+1 позволяют постепенно исключать блоки",
      "text": "Если текущие кандидаты разбить на \\(2^k\\) блоков и спросить \\(k\\) битов номера блока, то какой-то блок получил бы цепочку из \\(k\\) ответов, совместимых с его отсутствием. Один дополнительный аккуратно выбранный вопрос вынуждает исключить хотя бы один блок, не нарушая ограничения на ложь.",
      "standard_idea_ids": ["binary_encoding", "knowledge_elimination"],
      "status": "ai_checked"
    },
    {
      "id": "idea-potential-keeps-all-candidates-alive",
      "title": "Потенциал отвечает за стратегию лгущего игрока",
      "text": "Для нижней оценки первый игрок следит за счетчиками, сколько раз подряд каждый кандидат был фактически отвергнут ответами. Выбирая ответ, который меньше увеличивает сумму экспоненциальных весов этих счетчиков, он не дает ни одному кандидату набрать \\(k+1\\) последовательных опровержений.",
      "standard_idea_ids": ["decision_tree_lower_bound"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-ben-wins-for-two-power-k",
      "title": "Стратегия спрашивающего при \\(n\\ge 2^k\\)",
      "text": "Пусть пока осталось множество кандидатов \\(T\\), среди которых точно находится \\(x\\), и \\(|T|\\ge 2^k\\). Разобьем часть кандидатов на \\(2^k\\) непустых групп, пронумерованных двоичными словами длины \\(k\\). В течение \\(k\\) вопросов спрашиваем биты номера группы, в которой лежит \\(x\\). После этих ответов для каждой группы известно, какие ответы были бы с ней несовместимы.\n\nСреди \\(2^k\\) двоичных слов есть слово, которое совпадает с отрицаниями полученных битов. Соответствующая группа за первые \\(k\\) вопросов получила \\(k\\) подряд ответов, отвергающих ее. Следующим коротким добором вопросов, как в официальном решении, можно гарантированно отвергнуть одну из групп: если ответ снова отвергает выбранную группу, ее исключаем; если нет, переходим к группе, которая отличается первым битом, затем вторым и так далее. Ограничение «не бывает \\(k+1\\) лжей подряд» не позволяет всем этим отвержениям оказаться ложными для настоящего \\(x\\).\n\nПовторяя процедуру, второй игрок уменьшает число возможных кандидатов, пока их не останется меньше \\(2^k\\). Тогда он называет все оставшиеся кандидаты; при \\(n\\ge 2^k\\) это допустимо.",
      "standard_idea_ids": ["binary_encoding", "knowledge_elimination"],
      "status": "needs_human_review",
      "definition_ids": ["strategy"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-potential-1-999",
      "title": "Контрстратегия через экспоненциальный потенциал",
      "text": "Для достаточно большого \\(k\\) выберем \\(n\\ge 1.99^k\\) так, чтобы \\(N=n+1\\) было заметно меньше \\(1.999^{k+1}\\). Первый игрок считает для каждого кандидата \\(i\\) величину \\(f_i\\): сколько последних подряд ответов были несовместимы с равенством \\(x=i\\). Если очередной вопрос про множество \\(S\\), ответ «да» увеличивает счетчики кандидатов вне \\(S\\), а ответ «нет» - счетчики кандидатов из \\(S\\); у остальных счетчик сбрасывается.\n\nРассмотрим потенциал \\(\\sum_i 1.999^{f_i}\\). Из двух возможных ответов первый игрок выбирает тот, после которого потенциал меньше. Среднее двух новых потенциалов контролируется предыдущим потенциалом и числом кандидатов, поэтому индукцией потенциал остается меньше \\(1.999^{k+1}\\). Значит, ни у одного кандидата счетчик не достигает \\(k+1\\), иначе один его вклад уже был бы не меньше \\(1.999^{k+1}\\). Все \\(N=n+1\\) кандидатов остаются совместимыми с некоторым допустимым поведением первого игрока, поэтому множество из \\(n\\) чисел не может гарантированно содержать \\(x\\).",
      "standard_idea_ids": ["decision_tree_lower_bound"],
      "status": "ai_checked",
      "definition_ids": ["information_lower_bound"]
    }
  ],
