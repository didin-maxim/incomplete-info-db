  "statements": {"original": [{"id": "stmt-original", "title": "Весы показывают, на сколько одна чаша тяжелее", "text": "Есть 11 мешков монет. В 10 мешках монеты настоящие, а в одном все монеты фальшивые. Масса фальшивой монеты отличается от настоящей, но неизвестно в какую сторону и на сколько. Весы сравнивают две чаши и показывают, какая тяжелее и на сколько. Нужно двумя взвешиваниями определить мешок с фальшивыми монетами.", "source_ids": ["src-problems-ru-78572"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["digital_scale", "state_space"]}]},
  "ideas": [{"id": "idea-ratio-cancels-unknown-delta", "title": "Отношение двух показаний убирает неизвестную разницу масс", "text": "Показание каждого взвешивания линейно по неизвестному отклонению \\(x\\). Если коэффициенты выбраны как 1 и \\(i\\) для мешка \\(i\\), то отношение числовых показаний дает номер мешка, а специальный мешок отделяется нецелым отношением.", "standard_idea_ids": ["weighted_sum_encoding"], "status": "ai_checked"}],
  "strategies": [{"id": "str-two-linear-signatures", "title": "Сравнить две линейные комбинации", "text": "Пронумеруем мешки 1-11. В первом взвешивании положим на одну чашу по одной монете из мешков 1-10, а на другую 10 монет из мешка 11. Во втором взвешивании положим на первую чашу 1 монету из мешка 1, 2 из мешка 2, ..., 10 из мешка 10, а на другую 55 монет из мешка 11. Пусть \\(x\\) - разность массы фальшивой и настоящей монеты. Если фальшивый мешок имеет номер \\(i\\le 10\\), первое показание пропорционально \\(x\\), а второе - \\(ix\\), поэтому отношение дает \\(i\\). Если фальшивый мешок 11, показания пропорциональны \\(-10x\\) и \\(-55x\\), отношение не совпадает с целым номером 1-10; значит это мешок 11.", "standard_idea_ids": ["weighted_sum_encoding"], "status": "ai_checked", "definition_ids": ["digital_scale"]}],
