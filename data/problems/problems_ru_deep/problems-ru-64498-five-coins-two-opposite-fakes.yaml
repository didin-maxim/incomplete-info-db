  "statements": {"original": [{"id": "stmt-original", "title": "Одна легче, другая настолько же тяжелее", "text": "Из пяти монет две фальшивые, а остальные три настоящие и одинакового веса. Одна фальшивая монета легче настоящей, а другая ровно на столько же тяжелее настоящей. Нужно за три взвешивания на чашечных весах без гирь найти обе фальшивые монеты.", "source_ids": ["src-problems-ru-64498"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "state_space"]}]},
  "ideas": [{"id": "idea-one-aside-two-pairs", "title": "Два первых сравнения создают эталон или две подозрительные пары", "text": "Если сравнить 1 с 2 и 3 с 4, то равновесие в одном сравнении сразу дает настоящие монеты, а два перекоса оставляют пятую монету настоящей. Третье взвешивание калибрует знак и выбирает фальшивые из перекошенных пар.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-two-single-comparisons", "title": "Сначала сравнить две пары одиночных монет", "text": "Сравним монеты 1 и 2, затем 3 и 4. Если одно из этих взвешиваний дало равновесие, то две монеты из равной пары настоящие. Сравним одну из них с пятой монетой: если равны, то обе фальшивые монеты лежат в неравной паре; если нет, то пятая фальшивая, а во второй неравной паре фальшивая монета имеет противоположный знак. Если оба первых взвешивания дали перекос, то пятая монета настоящая. Сравним ее с легкой монетой из первого перекоса: при равенстве в первой паре фальшива тяжелая, а во второй легкая; при неравенстве легкая из первой пары фальшива, а во второй паре фальшива тяжелая.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["balance_scale"]}],
