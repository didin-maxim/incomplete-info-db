  "statements": {"original": [{"id": "stmt-original", "title": "2018 ответов на один публичный вопрос", "text": "На острове живут рыцари, лжецы и подпевалы; каждый знает, кто есть кто. Всех 2018 жителей построили в ряд и по очереди спросили: «На острове рыцарей больше, чем лжецов?» Рыцари отвечают правду, лжецы лгут. Каждый подпевала отвечает так же, как большинство ответивших до него, а при равенстве может выбрать любой ответ. Все слышат предыдущие ответы. Оказалось, что ответов «да» ровно 1009. Нужно определить наибольшее возможное число подпевал.", "source_ids": ["src-tot-2018-19-fall-advanced-8-9-problems", "src-problems-ru-66722"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-balance-zero-crossings", "title": "Подпевалы увеличивают модуль текущего баланса", "text": "Разность числа ответов «да» и «нет» начинается и заканчивается нулем. Пока баланс имеет фиксированный знак, подпевала всегда отвечает в сторону большинства и увеличивает модуль баланса; возвращать баланс к нулю могут только принципиальные жители.", "standard_idea_ids": ["single_bit_as_public_signal"], "status": "ai_checked"}],
  "strategies": [{"id": "str-1009-mimics-example", "title": "Оценка и пример на 1009 подпевалов", "text": "Разобьем последовательность ответов по моментам, когда баланс \\(D=\\#да-\\#нет\\) равен нулю. Внутри каждого такого блока подпевала увеличивает \\(|D|\\), потому что повторяет текущее большинство. Чтобы блок вернулся к нулю, принципиальных жителей в нем должно быть не меньше, чем подпевал. Значит во всей очереди подпевалов не больше 1009. Эта граница достигается: сначала могут стоять 1009 подпевалов, которые при каждом равенстве или большинстве «нет» отвечают «нет», затем 1009 рыцарей отвечают «да». Тогда всего ответов «да» ровно 1009, и подпевалов тоже 1009.", "standard_idea_ids": ["single_bit_as_public_signal"], "status": "ai_checked", "definition_ids": ["state_space"]}],
  "impossibility_proofs": [{"id": "lb-principled-at-least-mimics", "title": "Принципиальных не меньше подпевалов", "text": "На любом отрезке между двумя нулевыми значениями баланса подпевалы не могут уменьшать модуль баланса. Поэтому каждый вклад подпевал в удаление от нуля должен быть компенсирован ответами рыцарей или лжецов. Следовательно, во всей последовательности принципиальных жителей не меньше, чем подпевал, а из 2018 жителей подпевалов не больше 1009.", "standard_idea_ids": ["indistinguishable_states"], "status": "ai_checked"}],
