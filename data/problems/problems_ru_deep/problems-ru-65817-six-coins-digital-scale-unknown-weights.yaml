  "statements": {"original": [{"id": "stmt-original", "title": "Веса настоящей и фальшивой монет неизвестны", "text": "Есть шесть монет, одна из них фальшивая. Она отличается по весу от настоящей, но ни вес настоящей монеты, ни вес фальшивой заранее неизвестны. Нужно за три взвешивания на весах, показывающих общий вес взвешиваемых монет, найти фальшивую монету.", "source_ids": ["src-tot-toronto-2005-fall-junior-o", "src-kvant-2006-02-m1991", "src-problems-ru-65817"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["digital_scale", "state_space"]}]},
  "ideas": [{"id": "idea-two-pair-calibration", "title": "Первые две пары калибруют возможные веса", "text": "Веса пар 1-2 и 3-4 задают два параметра \\(a\\) и \\(b\\). Если они равны, подозреваются только 5 и 6; если различны, третье взвешивание 1+3+5 имеет четыре разные предсказанные суммы для фальшивости 1, 2, 3 или 4.", "standard_idea_ids": ["numeric_signature_decoding"], "status": "ai_checked"}],
  "strategies": [{"id": "str-pair-pair-test-135", "title": "Взвесить пары, затем 1+3+5", "text": "Сначала взвесим монеты 1 и 2, пусть их суммарный вес \\(2a\\). Затем взвесим 3 и 4, пусть их суммарный вес \\(2b\\). Если \\(a=b\\), то среди первых четырех монет все настоящие, а фальшивая - 5 или 6; третьим взвешиванием взвешиваем монету 5 и сравниваем ее вес с \\(a\\). Если \\(a\\ne b\\), то фальшивая среди монет 1-4. Взвесим 1+3+5. Для случаев, когда фальшива 1, 2, 3 или 4, ожидаемые суммы соответственно равны \\(2a+b\\), \\(3b\\), \\(a+2b\\), \\(3a\\). При \\(a\\ne b\\) эти четыре значения различны, поэтому третье показание однозначно указывает фальшивую монету.", "standard_idea_ids": ["numeric_signature_decoding"], "status": "ai_checked", "definition_ids": ["digital_scale"]}],
