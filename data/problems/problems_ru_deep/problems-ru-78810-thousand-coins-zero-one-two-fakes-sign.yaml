  "statements": {"original": [{"id": "stmt-original", "title": "1000 монет, 0, 1 или 2 фальшивые", "text": "Есть 1000 монет, среди них 0, 1 или 2 фальшивые. Все фальшивые, если они есть, имеют одинаковую массу, отличную от массы настоящих. Нужно за три взвешивания на чашечных весах без гирь определить, есть ли фальшивые монеты и легче они или тяжелее настоящих; количество фальшивых определять не требуется.", "source_ids": ["src-problems-ru-78810"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "state_space"]}]},
  "ideas": [{"id": "idea-halves-detect-sign-not-location", "title": "Нужно различить знак, а не найти монеты", "text": "Большие равные разбиения позволяют не локализовать каждую фальшивую монету. После сравнения половин последующие взвешивания выбирают такие четверти, где наличие фальшивой монеты эквивалентно знаку отклонения.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-three-halving-tests", "title": "Сравнить половины, затем согласованные четверти", "text": "Разделим монеты на две группы \\(A\\) и \\(B\\) по 500 и сравним их. Если \\(A>B\\), то фальшивые есть. Разделим \\(A=A_1\\cup A_2\\), \\(B=B_1\\cup B_2\\) по 250 и сравним \\(A_1+B_1\\) с \\(A_2+B_2\\). При неравенстве, например \\(A_1+B_1>A_2+B_2\\), фальшивые либо тяжелые в \\(A_1\\), либо легкие в \\(B_2\\); сравнением \\(B_1\\) и \\(B_2\\) выбираем один из двух случаев. При равенстве фальшивые либо тяжелые по одной в \\(A_1,A_2\\), либо легкие по одной в \\(B_1,B_2\\); сравнение двух половин \\(A_1\\) решает, есть ли фальшивая в \\(A_1\\). Если первое взвешивание дало \\(A=B\\), то либо фальшивых нет, либо их две, по одной в \\(A\\) и \\(B\\). Тогда аналогичное деление и сравнение половин \\(A\\) позволяет отличить отсутствие фальшивых от тяжелой или легкой пары.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["balance_scale"]}],
