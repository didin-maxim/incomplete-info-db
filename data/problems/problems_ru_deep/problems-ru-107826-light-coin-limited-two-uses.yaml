    "original": [{"id": "stmt-original", "title": "Наибольшее число монет за n взвешиваний", "text": "Среди одинаковых на вид монет ровно одна фальшивая и известно, что она легче настоящих. Нужно определить наибольшее число монет, из которого можно гарантированно найти фальшивую за \\(n\\) взвешиваний на чашечных весах без гирь, если каждую монету разрешено класть на весы не более двух раз.", "source_ids": ["src-problems-ru-107826"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "decision_tree"]}],
