  },
  "ideas": [{"id": "idea-two-stage-limited-use", "title": "После перекоса остается задача с однократным использованием", "text": "Если первое неравновесное взвешивание кладет по \\(s\\) монет на чашу, то фальшивая лежит в легкой чаше, а эти \\(s\\) монет уже использованы один раз. Поэтому дальше их можно использовать только как в задаче, где каждую монету разрешено взвесить не более одного раза.", "standard_idea_ids": ["decision_tree_lower_bound"], "status": "ai_checked"}],
  "strategies": [{"id": "str-decreasing-odd-groups", "title": "Взвешивать максимальные нечетные группы", "text": "Обозначим максимум через \\(f(n)\\). При одном оставшемся взвешивании можно различить только 3 монеты: сравнить две, а третью оставить вне весов. Для общего \\(n\\) сначала кладем на чаши по \\(2n-1\\) монет. Если равновесие, исключены \\(4n-2\\) настоящих монет и остается такая же задача на \\(f(n-1)\\) монетах. Если одна чаша легче, фальшивая среди \\(2n-1\\) монет этой чаши, и каждую из них можно использовать только один раз; за \\(n-1\\) дальнейших взвешиваний это ровно предельный размер \\(2(n-1)+1=2n-1\\). Повторяя, получаем емкость \\(f(n)=f(n-1)+2(2n-1)=2n^2+1\\). Конструкция достигает этой оценки: на шагах равновесия берем группы размеров \\(2n-1,2n-3,\\ldots,3,1\\), а после первого перекоса добираем поиском по парам внутри легкой группы.", "standard_idea_ids": ["decision_tree_lower_bound"], "status": "ai_checked", "definition_ids": ["balance_scale", "decision_tree"]}],
  "impossibility_proofs": [{"id": "lb-recurrence-capacity", "title": "Рекуррентная верхняя оценка", "text": "Пусть в первом взвешивании на каждой чаше \\(s\\) монет. При неравновесии нужно уметь найти легкую фальшивую среди \\(s\\) уже использованных монет за \\(n-1\\) взвешиваний с однократным дальнейшим использованием, значит \\(s\\le 2n-1\\). При равновесии остается не более \\(f(n-1)\\) монет вне весов. Поэтому \\(f(n)\\le f(n-1)+2(2n-1)\\), что вместе с \\(f(1)=3\\) дает \\(f(n)\\le 2n^2+1\\).", "standard_idea_ids": ["decision_tree_lower_bound"], "status": "ai_checked", "definition_ids": ["information_lower_bound"]}],
