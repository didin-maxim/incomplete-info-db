  "statements": {"original": [{"id": "stmt-original", "title": "Цвет и число в очереди мудрецов", "text": "В ряд стоят \\(n\\) мудрецов, все смотрят в одном направлении; на каждом черная или белая шляпа, и каждый видит шляпы всех впереди. Они отвечают сзади наперед, называя цвет и натуральное число, причем все слышат предыдущие ответы. Мудрецы заранее договариваются о стратегии, но знают только, что ровно \\(k\\) из них безумны; безумный называет цвет и число независимо от договоренности. Нужно найти максимальное число правильных цветов, которое можно гарантировать при любом расположении безумных.", "source_ids": ["src-problems-ru-66710"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-moving-oracle", "title": "Последний надежный оракул передает цвет следующему", "text": "Каждый разумный мудрец кодирует видимые шляпы числом так, чтобы сообщить цвет шляпы любому стоящему за ним. Участники публично отслеживают текущего оракула: если следующий разумный послушался его, сам становится новым оракулом; безумные ответы могут быть проигнорированы.", "standard_idea_ids": ["public_communication"], "status": "ai_checked"}],
  "strategies": [{"id": "str-current-oracle", "title": "Стратегия текущего оракула", "text": "Заранее договоримся о кодировании любой видимой последовательности шляп числом от 1 до \\(2^i\\), если мудрец видит \\(i\\) шляп. Ответ предыдущего разумного мудреца тем самым сообщает цвет шляпы каждому следующему разумному. Начинающий разумный может ошибиться, потому что не получает информации о собственной шляпе; назовем его текущим оракулом. Каждый следующий разумный называет цвет, который ему указывает последний оракул. Если он действительно следует оракулу, то его собственный ответ с корректным числом делает его новым оракулом; если ответ не согласован, остальные считают, что оракул не сменился. Так как все ответы публичны, каждый может вести один и тот же счетчик оракула. Все разумные, кроме первого среди них, гарантированно угадывают, а \\(k\\) безумных и первый разумный могут ошибиться. Поэтому гарантируется \\(n-k-1\\) правильных цветов.", "standard_idea_ids": ["public_communication"], "status": "ai_checked", "definition_ids": ["state_space"]}],
  "impossibility_proofs": [{"id": "lb-madmen-and-first-sane", "title": "Больше \\(n-k-1\\) гарантировать нельзя", "text": "\\(k\\) безумных могут назвать неверный цвет независимо от стратегии. Кроме того, первый отвечающий среди разумных не получает никакого сообщения о собственной шляпе: две раскраски, отличающиеся только цветом его шляпы, неразличимы для него. Поэтому нельзя гарантировать больше \\(n-k-1\\) правильных ответов.", "standard_idea_ids": ["indistinguishability_argument"], "status": "ai_checked"}],
