  "ideas": [
    {
      "id": "idea-balanced-codewords",
      "title": "Сделать разные двоичные ответы, не нарушая сумму",
      "text": "Обычные заранее заданные вопросы различают \\(2^n\\) вариантов, если каждому числу соответствует свой двоичный набор ответов. Здесь надо дополнительно построить вопросы так, чтобы каждое спрашиваемое множество имело одну и ту же сумму.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked"
    },
    {
      "id": "idea-double-and-separate-pairs",
      "title": "Удваивать конструкцию и разделять пары",
      "text": "Если для \\(2^m\\) чисел уже есть \\(m\\) подходящих вопросов, то для \\(2^{m+1}\\) чисел первые \\(m\\) вопросов повторяют старые ответы на нижней и верхней половинах. После этого неразличимыми остаются только пары \\(t\\) и \\(t+2^m\\), а последний вопрос выбирает ровно одного из каждой пары.",
      "standard_idea_ids": ["partition_state_space", "nonadaptive_strategy"],
      "status": "ai_checked"
    }
