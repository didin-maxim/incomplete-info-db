  "strategies": [
    {
      "id": "str-inductive-balanced-questions",
      "title": "Построить вопросы индукцией по \\(n\\)",
      "text": "Начнем с \\(n=3\\). Подходят множества\n\\[\nB_1=\\{1,2,7,8\\},\\quad B_2=\\{1,3,6,8\\},\\quad B_3=\\{1,4,6,7\\}.\n\\]\nУ каждого сумма равна \\(18=2^{3-2}(2^3+1)\\), и восемь чисел дают разные тройки ответов.\n\nПусть для \\(m\\ge 3\\) уже построены множества \\(B_1,\\ldots,B_m\\subset\\{1,\\ldots,2^m\\}\\), каждое содержит \\(2^{m-1}\\) элементов, имеет сумму \\(2^{m-2}(2^m+1)\\), и ответы на вопросы о принадлежности этим множествам различают все \\(2^m\\) чисел. Для \\(i=1,\\ldots,m\\) положим\n\\[\nD_i=B_i\\cup\\{b+2^m: b\\in B_i\\}\\subset\\{1,\\ldots,2^{m+1}\\}.\n\\]\nТогда \\(D_i\\) содержит \\(2^m\\) элементов, а его сумма равна\n\\[\n2\\cdot 2^{m-2}(2^m+1)+2^m\\cdot 2^{m-1}=2^{m-1}(2^{m+1}+1),\n\\]\nто есть ровно нужной сумме для \\(m+1\\).\n\nПервые \\(m\\) вопросов различают все числа, кроме пар \\(t\\) и \\(t+2^m\\). Для последнего вопроса разбиваем \\(\\{1,\\ldots,2^m\\}\\) на два непересекающихся множества \\(P\\) и \\(Q\\) по \\(2^{m-1}\\) элементов и берем\n\\[\nD_{m+1}=P\\cup\\{q+2^m:q\\in Q\\}.\n\\]\nЕго сумма равна сумме всех чисел от \\(1\\) до \\(2^m\\) плюс \\(2^m\\) для каждого элемента из \\(Q\\):\n\\[\n2^{m-1}(2^m+1)+2^m\\cdot 2^{m-1}=2^{m-1}(2^{m+1}+1).\n\\]\nКроме того, из каждой пары \\(t,t+2^m\\) в \\(D_{m+1}\\) попадает ровно один элемент, поэтому последний ответ разделяет все оставшиеся пары. Индукция завершена, значит для исходного \\(n\\) существуют \\(n\\) заранее заданных разрешенных вопросов, по ответам на которые \\(x\\) определяется однозначно.",
      "standard_idea_ids": ["partition_state_space", "nonadaptive_strategy"],
      "status": "ai_checked",
      "definition_ids": ["state_space"]
    }
  ],
