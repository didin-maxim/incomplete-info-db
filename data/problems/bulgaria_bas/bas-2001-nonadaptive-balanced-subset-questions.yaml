      "title": "Почему меньше \\(n\\) вопросов не хватит",
      "text": "Каждый разрешенный вопрос имеет только два ответа: «да» или «нет». Поэтому \\(q\\) заранее заданных вопросов дают не больше \\(2^q\\) разных наборов ответов. Если \\(q<n\\), то \\(2^q<2^n\\), а неизвестных элементов в множестве \\(A\\) ровно \\(2^n\\). Значит какие-то два элемента неизбежно дали бы одинаковые ответы на все вопросы, и определить \\(x\\) было бы невозможно.",
