        "title": "Угадать число вопросами о множествах",
        "text": "Из множества \\(A=\\{1,2,\\ldots,2^n\\}\\), где \\(n\\ge 3\\), выбрали неизвестный элемент \\(x\\). Разрешается задавать только вопросы вида: «Принадлежит ли \\(x\\) множеству \\(B\\)?», где \\(B\\subset A\\) и сумма элементов \\(B\\) равна \\(2^{n-2}(2^n+1)\\). Докажите, что \\(x\\) можно определить ровно по \\(n\\) вопросам, заданным заранее.",
        "source_ids": ["src-bas-2001-all-problems"],
        "status": "source_verified",
