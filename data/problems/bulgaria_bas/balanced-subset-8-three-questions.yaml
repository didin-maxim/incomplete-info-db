        "title": "Угадать число тремя заранее выбранными вопросами",
        "text": "Загадано одно число от 1 до 8. Нужно заранее выбрать три вопроса вида: «Принадлежит ли загаданное число этому подмножеству?» Сумма чисел в каждом из трех выбранных подмножеств должна быть одной и той же. Можно ли выбрать вопросы так, чтобы по трем ответам «да»/«нет» загаданное число определялось однозначно? Желательно, чтобы общая сумма каждого подмножества была равна 18.",
