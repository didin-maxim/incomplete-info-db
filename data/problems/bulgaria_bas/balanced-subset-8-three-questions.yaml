      "title": "Взять три подмножества суммы 18",
      "text": "Подходят такие три вопроса:\n\\[\nA_1=\\{1,2,7,8\\},\\quad A_2=\\{1,3,6,8\\},\\quad A_3=\\{1,4,6,7\\}.\n\\]\nВ каждом подмножестве сумма равна 18:\n\\[\n1+2+7+8=18,\\quad 1+3+6+8=18,\\quad 1+4+6+7=18.\n\\]\nТеперь выпишем для каждого числа тройку ответов на вопросы об \\(A_1,A_2,A_3\\), где 1 означает «да», а 0 означает «нет»:\n\\[\n\\begin{array}{c|c}\n\\text{число} & \\text{ответы}\\\\\n1&111\\\\\n2&100\\\\\n3&010\\\\\n4&001\\\\\n5&000\\\\\n6&011\\\\\n7&101\\\\\n8&110\n\\end{array}\n\\]\nВсе восемь троек разные. Значит, когда ответы получены, достаточно найти в таблице ровно такую же тройку. Например, ответы «да, нет, да» дают код 101, а значит число 7. Ответы «нет, нет, нет» дают код 000, а значит число 5.\n\nИтак, три заранее выбранных вопроса работают, и дополнительное требование на одинаковую сумму тоже выполнено: каждая сумма равна 18.",
      "standard_idea_ids": ["partition_state_space", "nonadaptive_strategy"],
