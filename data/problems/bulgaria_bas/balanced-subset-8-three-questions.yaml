      "text": "После трех заранее заданных вопросов у каждого числа получается тройка из ответов «да» и «нет». Если две разные цифры дают одинаковую тройку, их уже нельзя различить. Поэтому задача сводится к тому, чтобы дать восьми числам восемь разных троек ответов и одновременно сохранить одинаковые суммы в вопросах.",
