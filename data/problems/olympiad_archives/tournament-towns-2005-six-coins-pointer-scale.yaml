      "id": "idea-average-signature",
      "title": "Сравнить средние веса пересекающихся наборов",
      "text": "Если взвесить пары и тройку с пересечениями, то равенства и линейные соотношения между средними весами однозначно указывают фальшивую монету.",
      "standard_idea_ids": ["partition_state_space"],
