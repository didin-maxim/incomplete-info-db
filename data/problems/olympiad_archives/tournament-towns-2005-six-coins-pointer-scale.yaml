        "id": "stmt-tot-2005-fall-junior-o-5",
        "title": "Одна фальшивая среди шести, веса настоящей и фальшивой неизвестны",
        "text": "Среди шести монет одна фальшивая. Все настоящие монеты имеют один и тот же вес, фальшивая имеет другой вес, но ни вес настоящей монеты, ни вес фальшивой заранее не известен. Весы показывают общий вес положенных на чашу монет. Найдите фальшивую монету за три взвешивания.",
