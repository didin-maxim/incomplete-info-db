  "strategies": [
    {
      "id": "str-three-averages",
      "title": "Три средних веса",
      "text": "Обозначим монеты \\(A,B,C,D,E,F\\). За три взвешивания найдем средний вес \\(m\\) монет \\(C,E\\), средний вес \\(n\\) монет \\(D,F\\) и средний вес \\(k\\) монет \\(B,E,F\\).\n\nЕсли \\(m=n=k\\), то фальшива монета \\(A\\), так как ни одно взвешивание ее не затронуло, а все увиденные средние совпали с весом настоящей монеты. Если \\(m=n\\ne k\\), фальшива \\(B\\). Если \\(m\\ne n=k\\), фальшива \\(C\\). Если \\(k=m\\ne n\\), фальшива \\(D\\). Если все три средних попарно различны, фальшива \\(E\\) или \\(F\\). Эти два случая различаются линейно: для \\(E\\) выполняется \\(2m+n=3k\\), а для \\(F\\) выполняется \\(m+2n=3k\\).",
      "standard_idea_ids": ["partition_state_space"],
