        "id": "stmt-mmo-2026-8-4",
        "title": "Ряд из 12 фальшивых монет в квадрате 12 на 12",
        "text": "В квадрате \\(12\\times 12\\) лежат 144 внешне одинаковые золотые монеты. Среди них ровно 12 фальшивых монет, и они образуют один полный ряд: горизонтальный или вертикальный. Все настоящие монеты одинаковы по весу, а каждая фальшивая легче настоящей; фальшивые между собой могут весить по-разному. Можно сделать два взвешивания на чашечных весах без гирь. Можно ли гарантированно указать 110 настоящих монет?",
