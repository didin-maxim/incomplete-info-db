  "impossibility_proofs": [
    {
      "id": "lb-110-is-maximal",
      "title": "Почему нельзя гарантировать больше 110",
      "text": "Всего есть 24 возможных положения фальшивого ряда. Два взвешивания дают не более 9 исходов, поэтому для некоторого исхода останутся совместимыми не менее трех рядов. Если три ряда параллельны, вне их гарантированно настоящих монет не больше \\(144-3\\cdot 12=108\\). Если среди трех рядов есть два одного направления и один другого, их объединение имеет размер \\(3\\cdot 12-2\\), так что гарантированно настоящих не больше \\(144-34=110\\).",
