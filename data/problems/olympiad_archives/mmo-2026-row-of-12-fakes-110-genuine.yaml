      "id": "idea-hit-main-diagonal",
      "title": "Сначала сузить набор возможных линий диагональю",
      "text": "Главная диагональ пересекает каждый возможный ряд фальшивых монет ровно в одной монете. Поэтому взвешивание двух четверок диагональных монет выделяет одну из трех групп по четыре возможные линии.",
      "standard_idea_ids": ["partition_state_space"],
