  "strategies": [
    {
      "id": "str-two-weighings-lines",
      "title": "Две развилки по диагонали и двум клеткам",
      "text": "Рассмотрим главную диагональ и разделим ее 12 монет на три четверки. Первым взвешиванием сравним первую и вторую четверки. Если одна чаша легче, то фальшивая диагональная монета находится в соответствующей четверке; если равновесие, то в третьей четверке. По симметрии пусть после первого взвешивания возможны только первые четыре строки и первые четыре столбца.\n\nВторым взвешиванием положим на левую чашу монеты в позициях \\((1,1)\\) и \\((1,2)\\), а на правую - монеты \\((2,3)\\) и \\((2,4)\\). Фальшивый ряд не может дать фальшивые монеты одновременно на обеих чашах. Если легче левая чаша, возможны первая строка, первый столбец или второй столбец; если легче правая - вторая строка, третий столбец или четвертый столбец; если равновесие - третья или четвертая строка. Во всех случаях монеты вне перечисленных возможных рядов точно настоящие: в первых двух случаях их 110, в третьем 120.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["balance_scale"]
    }
