      "id": "str-hidden-card-not-seen-by-kolya-case",
      "title": "Когда оставшаяся карта спрятана",
      "text": "Пусть реальная рука Гриши равна \\(A\\). Гриша выбирает любую тройку \\(B\\) из четырех карт, которых у него нет, и публично говорит: «У меня либо \\(A\\), либо \\(B\\)». Леша видит свою руку и поэтому понимает, какая из двух троек действительно рука Гриши: если \\(B\\) не совпадает с рукой Леши, то \\(B\\) содержит две карты Леши и спрятанную карту; если совпадает, то вторая тройка и есть рука Леши.\n\nПосле этого Леша строит свою фразу так, чтобы одна названная тройка была его реальной рукой, а другая - реальной рукой Гриши или такой тройкой из карт не Леши, которая отличается от руки Гриши ровно одной картой. Конкретно: если \\(B\\) не совпала с рукой Леши, Леша говорит: «У меня либо моя рука, либо \\(A\\)». Если \\(B\\) совпала с рукой Леши, он говорит: «У меня либо \\(B\\), либо \\(C\\)», где \\(C\\) - любая тройка из карт не Леши, не равная \\(A\\). В обоих случаях Гриша по второй фразе узнает руку Леши.\n\nПочему Коля не узнает местонахождение ни одной невидимой карты? В первом случае публично названы три тройки \\(A,B,C\\), где \\(C\\) - рука Леши, \\(B\\cap C\\) состоит из двух карт, Гриша сказал «\\(A\\) или \\(B\\)», а Леша сказал «\\(C\\) или \\(A\\)». Совместимы две картины: \\(G=A,L=C\\) и \\(G=B,L=A\\); в них меняется и владелец многих карт, и спрятанная карта. Второй случай симметричен: общая названная тройка \\(B\\) может быть либо рукой Леши, либо рукой Гриши в другой совместимой картине. Поэтому у каждой карты, которую Коля не видит, остается по крайней мере две возможные роли.",
      "standard_idea_ids": ["modular_sum_encoding", "partition_state_space"],
      "status": "ai_checked",
      "definition_ids": []
    },
    {
      "id": "str-hidden-card-known-to-kolya-case",
      "title": "Когда оставшаяся карта у Коли",
      "text": "Занумеруем семь карт числами \\(0,1,\\ldots,6\\). Гриша и Леша по очереди публично называют остатки по модулю 7 от суммы номеров своих трех карт. Зная свой набор и остаток другого, каждый восстанавливает номер карты, которая не принадлежит ни одному из них: это остаток, противоположный сумме двух названных остатков по модулю 7. После этого каждый знает три карты другого.\n\nКоля видит свою карту и слышит два остатка. Для любой другой карты с номером \\(s\\) она все еще могла быть у Гриши: надо дополнить ее двумя картами с суммой, равной названному Гришей остатку минус \\(s\\). Среди трех пар с нужной суммой по модулю 7 не более двух испорчены тем, что используют карту \\(s\\) или карту Коли, значит подходящая пара остается. То же рассуждение работает для Леши. Поэтому Коля не может определить местонахождение ни одной невидимой ему карты.",
