        "title": "Гриша и Леша сообщают карты, не раскрывая карту Коле",
        "text": "Из колоды вынули 7 карт, показали всем, перетасовали и раздали Грише и Леше по 3 карты, а оставшуюся карту либо спрятали, либо отдали Коле. Гриша и Леша могут по очереди вслух сообщать любую информацию о своих картах. Могут ли они сообщить друг другу свои карты так, чтобы Коля при этом не смог вычислить местонахождение ни одной из тех карт, которых он не видит? Переговоры происходят открытым текстом, без заранее оговоренного тайного кода.",
