  "strategies": [
    {
      "id": "str-four-comparisons",
      "title": "Сначала сравнить две пары, затем добить симметричные случаи",
      "text": "Обозначим монеты Александра \\(A_1,A_2,A_3\\), а монеты Бориса \\(B_1,B_2,B_3\\). Первыми двумя взвешиваниями сравним \\(A_1\\) с \\(B_1\\) и \\(A_2\\) с \\(B_2\\).\n\nЕсли оба раза равенство, то и \\(A_3=B_3\\). Третьим взвешиванием сравним \\(A_1+A_2\\) с \\(A_3+B_3\\). Возможны только суммы 9+10 против 11+11, 9+11 против 10+10 или 10+11 против 9+9, поэтому определяется вес пары \\(A_3,B_3\\) и два оставшихся веса с точностью до порядка. Четвертым взвешиванием сравним \\(A_1\\) и \\(A_2\\).\n\nВ остальных случаях третьим взвешиванием сравним \\(A_3\\) и \\(B_3\\). С точностью до переименования остаются два типа. Если \\(A_1<B_1\\), \\(A_2<B_2\\), \\(A_3>B_3\\), то \\(A_1,A_2\\) имеют веса 9 и 10, \\(A_3=11\\), \\(B_3=9\\), а \\(B_1,B_2\\) имеют веса 10 и 11; четвертое сравнение \\(A_1\\) с \\(A_2\\) завершает восстановление. Если \\(A_1<B_1\\), \\(A_2>B_2\\), \\(A_3=B_3\\), то \\(A_1=B_2\\) и \\(A_2=B_1\\); сравнение \\(A_1+A_2\\) с \\(A_3+B_3\\) определяет оставшиеся веса, а известное неравенство \\(A_1<A_2\\) снимает порядок.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["balance_scale"]
    }
