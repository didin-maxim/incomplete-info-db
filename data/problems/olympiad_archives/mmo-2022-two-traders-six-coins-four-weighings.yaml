        "title": "Два торговца объединяют лимит взвешиваний",
        "text": "У Александра есть три внешне неотличимые монеты весом 9, 10 и 11 граммов, и у Бориса есть такая же тройка. Каждый может воспользоваться чашечными весами без гирь два раза. Докажите, что если они объединят свои четыре взвешивания, то смогут определить веса всех шести монет.",
