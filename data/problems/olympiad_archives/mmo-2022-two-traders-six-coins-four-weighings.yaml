      "id": "idea-cross-compare-two-copies",
      "title": "Сравнить одинаково устроенные скрытые тройки попарно",
      "text": "Две независимые копии одного набора весов дают дополнительную структуру: результаты сравнений \\(A_i\\) с \\(B_i\\) ограничены тем, что суммы весов в тройках \\(A\\) и \\(B\\) одинаковы.",
      "standard_idea_ids": ["partition_state_space"],
