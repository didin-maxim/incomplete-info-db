    {
      "id": "str-three-groups-second-official",
      "title": "Группы 147, 258, 369",
      "text": "Пронумеруем монеты по кругу от 1 до 9. Разобьем их на группы \\(147\\), \\(258\\), \\(369\\). В двух группах находится по одной фальшивой монете, а в одной группе - две. Сначала сравним группы \\(147\\) и \\(258\\). Если одна из них тяжелее, то именно в ней две фальшивые; если равны, то две фальшивые в группе \\(369\\).\n\nПусть найдена группа из трех монет, где две фальшивые. Вторым взвешиванием сравним две монеты этой группы. Если одна легче, она настоящая, а две другие фальшивые. Если они равны, то обе сравниваемые фальшивые. После определения двух фальшивых монет в этой группе две монеты, лежащие между ними на круге, являются соседними настоящими; по чередованию вокруг круга восстанавливаются все четыре фальшивые монеты.",
