        "id": "stmt-mmo-2006-8-4",
        "title": "Девять монет по кругу, фальшивые не соседствуют",
        "text": "Девять одинаковых по виду монет расположены по кругу. Пять из них настоящие, а четыре фальшивые. Никакие две фальшивые монеты не лежат рядом. Настоящие монеты весят одинаково, фальшивые тоже одинаково, и фальшивая монета тяжелее настоящей. Как за два взвешивания на чашечных весах без гирь определить все фальшивые монеты?",
        "source_ids": ["src-mmo-2006-69-brochure", "src-problems-ru-105200"],
