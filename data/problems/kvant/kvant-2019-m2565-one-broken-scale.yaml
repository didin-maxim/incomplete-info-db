        "id": "stmt-original",
        "title": "n монет и n весов",
        "text": "Даны n монет попарно различных масс и n чашечных весов, n > 2. При каждом взвешивании разрешается выбрать одни весы, положить на их чаши по одной монете, посмотреть показания и снять монеты обратно. Одни из весов испорчены, но неизвестно какие; они могут случайно выдавать как правильный, так и неправильный результат. За какое наименьшее число взвешиваний можно гарантированно найти самую тяжелую монету?",
        "source_ids": ["src-kvant-2019-09-m2565"],
