      "title": "Два сравнения либо дают надежное превосходство, либо выявляют подозрительные весы",
      "text": "Если две монеты дважды сравнить на разных весах и победитель один и тот же, проигравшая монета уже не самая тяжелая. Если результаты противоречат или возникло равновесие, среди использованных весов есть испорченные, а третьи весы можно считать исправными.",
