  "strategies": [
    {
      "id": "str-induction-two-comparisons",
      "title": "Индукция по числу монет",
      "text": "Сравним две выбранные монеты на двух разных весах. Если оба раза тяжелее одна и та же монета a, то другая монета b точно не максимальна, потому что хотя бы одни из двух весов исправны. Исключаем b и решаем задачу для n-1 монет, потратив еще 2n-3 взвешивания. Если результаты первых двух сравнений противоречат или дали равновесие, одни из этих весов испорчены; берем третьи весы, которые исправны, и обычным турниром за n-1 сравнений находим максимум. В худшем случае получается 2n-1 взвешиваний.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["balance_scale"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-source-adversary",
      "title": "Нижняя оценка из журнального решения",
      "text": "Докажем, что \\(2n-2\\) взвешиваний недостаточно. Пусть некоторый алгоритм сделал первые \\(2n-3\\) сравнения. Представим себе последовательность ответов, в которой каждый раз перевешивает монета с большим номером. Среди монет \\(1,2,\\ldots,n-1\\) за эти \\(2n-3\\) сравнений найдется монета \\(k\\), которая проиграла не более одного раза: иначе суммарно уже было бы хотя бы \\(2n-2\\) проигрышей у первых \\(n-1\\) монет. Монета \\(n\\) при такой последовательности не проигрывала вовсе.\n\nПосле этих ответов совместимы две картины. В картине A массы возрастают вместе с номерами, и все показания были правильными. В картине B массы тоже возрастают, кроме монеты \\(k\\), которая является самой тяжелой; если \\(k\\) один раз проиграла, то именно использованные тогда весы были испорчены и дали неверный результат, а остальные показания были правильными. Обе картины согласуются с тем, что испорчены только одни весы.\n\nОсталось одно, \\((2n-2)\\)-е, сравнение. Если монета \\(k\\) в нем не участвует, противник снова отвечает, что перевесила монета с большим номером, и обе картины A и B остаются возможными. Если \\(k\\) участвует, противник отвечает, что перевесила \\(k\\). Тогда это совместимо с картиной A, если последнее сравнение выполнено на испорченных весах, и совместимо с картиной B, если весы в последний раз показали правильно. Значит, после \\(2n-2\\) взвешиваний алгоритм все еще не может отличить случай, где самая тяжелая монета \\(n\\), от случая, где самая тяжелая монета \\(k\\). Поэтому нужно не меньше \\(2n-1\\) взвешиваний.",
