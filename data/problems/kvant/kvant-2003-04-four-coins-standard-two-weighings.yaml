      "text": "Первым взвешиванием положим монеты 1 и 2 на левую чашу, а монету 3 и эталон - на правую. Если тяжелее левая чаша, возможны только случаи: 1 тяжелая, 2 тяжелая или 3 легкая. Если тяжелее правая: 1 легкая, 2 легкая или 3 тяжелая. Если равновесие: 4 легкая, 4 тяжелая или фальшивых нет. Во второй ветви достаточно сравнить 1 и 2; в равновесной ветви сравнить 4 с эталоном. Каждый раз один результат выбирает один из трех оставшихся случаев.",
