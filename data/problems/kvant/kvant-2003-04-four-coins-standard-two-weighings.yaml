        "text": "Даны четыре монеты. Возможны девять случаев: фальшивой монеты нет, либо ровно одна из четырех монет фальшивая и она может быть как легче, так и тяжелее настоящих. Фальшивая монета отличается по весу не настолько сильно, чтобы взвешивание разного числа подозрительных монет само по себе было полезным. Имеется также заведомо настоящая эталонная монета. Нужно определить случай за два взвешивания на чашечных весах.",
