      "id": "str-compare-123-with-567",
      "title": "Сравнить 1,2,3 с 5,6,7, затем 4 с 8",
      "text": "Пронумеруем монеты по кругу. Первым взвешиванием сравним монеты 1,2,3 с монетами 5,6,7. Если равновесие, то в каждой тройке по одной тяжелой монете; тогда второе взвешивание 4 против 8 указывает, какая из них тяжелая, а вместе с ней тяжелы две соседние монеты. Если первое взвешивание неравное, то в более тяжелой тройке две или три фальшивые монеты. Снова сравним 4 и 8. Если они равны, весь тяжелый блок лежит в более тяжелой тройке первого взвешивания. Если не равны, тяжелая из 4 и 8 является концом блока; две остальные фальшивые монеты - ее соседи со стороны более тяжелой тройки.",
