        "title": "Восемь монет по кругу",
        "text": "Восемь одинаковых на вид монет расположены по кругу. Известно, что три из них фальшивые и более тяжелые, причем эти три монеты лежат подряд. Все фальшивые монеты весят одинаково, все настоящие тоже. Можно ли определить все три фальшивые монеты двумя взвешиваниями на чашечных весах без гирь?",
