        "title": "Сколько честных на острове",
        "text": "На острове живут честные, лжецы и хитрецы. Все знают друг про друга, кто есть кто. Каждого жителя попросили написать, сколько среди них честных. Честные написали правильно, лжецы соврали, а хитрецы - кто как. Каждый записал двузначное число. Оказалось, что цифра 3 была написана 33 раза, цифра 5 была написана 66 раз, а цифра 7 была написана 77 раз. Никакие другие цифры написаны не были. Сколько всего честных среди жителей острова?",
