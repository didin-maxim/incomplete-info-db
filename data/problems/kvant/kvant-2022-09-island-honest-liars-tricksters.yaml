      "title": "Перебрать возможные двузначные числа",
      "text": "Всего написано 33 + 66 + 77 = 176 цифр, значит жителей 88. Число честных H двузначное и состоит только из цифр 3, 5, 7. Если H содержит цифру 3, то честные записи требуют как минимум H троек; это невозможно для H = 35, 37, 53, 73 и тем более для 33, потому что троек всего 33. Числа 55 и 75 невозможны из-за нехватки цифр 5, а 77 - из-за нехватки цифр 7. Остается H = 57. Он совместим со счетчиками: 57 честных пишут 57, расходуя 57 пятерок и 57 семерок, а остальные 31 житель могут дать оставшиеся 33 тройки, 9 пятерок и 20 семерок, не нарушая своих правил.",
