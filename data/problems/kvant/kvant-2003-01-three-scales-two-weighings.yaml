        "title": "Определить неисправные весы",
        "text": "Есть трое весов A, B, C. Известно, что одни весы неисправны; если взвешивание делают на них, результат может быть произвольным. Исправные весы показывают правильно. Нужно определить неисправные весы за наименьшее число взвешиваний, при этом сами весы можно взвешивать на других весах.",
