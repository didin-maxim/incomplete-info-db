      "id": "str-weigh-b-and-c-on-a",
      "title": "Взвесить B и C на A",
      "text": "Взвесим весы B и C на весах A. Если получилось равновесие, то A неисправны: если бы A были исправны, одни из B и C были бы неисправными и физически более легкими, так что равновесия быть не могло. Если равновесия нет, то весы, оказавшиеся на более тяжелой чаше, заведомо исправны. Действительно, если A исправны, более тяжелые из B и C не могут быть неисправными; если A неисправны и дали произвольный перекос, то B и C оба исправны. Вторым взвешиванием на заведомо исправных весах сравниваем два оставшихся кандидата и находим неисправные. Одного взвешивания недостаточно: если оно сделано на неисправных весах, произвольный результат может имитировать разные случаи.",
