        "title": "Определить неисправные весы",
        "text": "Есть трое одинаковых на вид чашечных весов A, B, C. В одних весах потерялась часть деталей: как предмет они легче исправных, а если взвешивание делают на них, результат может быть произвольным. Исправные весы имеют одинаковую массу и показывают правильно. Нужно определить неисправные весы за наименьшее число взвешиваний; сами весы разрешено класть на чаши других весов.",
