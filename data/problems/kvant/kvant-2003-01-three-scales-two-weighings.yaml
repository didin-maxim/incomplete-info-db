      "id": "str-weigh-b-and-c-on-a",
      "title": "Взвесить B и C на A",
      "text": "Взвесим весы B и C на весах A. Если получилось равновесие, то A неисправны: исправные весы B и C имеют одинаковый вес. Если равновесия нет, то одна из взвешиваемых пар весов тяжелее другой; значит, сами весы A сработали исправно, а более тяжелые из B и C заведомо исправны как физический объект. Вторым взвешиванием на заведомо исправных весах сравниваем оставшиеся кандидаты и находим неисправные. Одного взвешивания недостаточно: если оно сделано на неисправных весах, произвольный результат может имитировать любой случай.",
