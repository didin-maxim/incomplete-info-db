  "statements": {"original": [{"id": "stmt-ukmt-grey-kangaroo-2008-q13", "title": "Кан знает четность суммы карт Ру", "text": "Маг Гар написал числа от 1 до 7 на семи карточках и положил их в шляпу. Затем Кан случайно взял 3 карточки, а Ру взял 2 карточки; две карточки остались в шляпе. Кан сказал Ру: «Я могу вывести, что сумма чисел на твоих карточках четна». Какова была сумма чисел на карточках Кана?", "source_ids": ["src-ukmt-imok-2008-solutions-inside"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-certainty-about-parity-requires-removing-all-evens", "title": "Уверенность о четности требует исключить все варианты другой четности", "text": "Сумма двух карт Ру четна тогда и только тогда, когда обе карты одной четности. Кан видит только свои три карты, поэтому его уверенность должна следовать из того, какие четности вообще остались для Ру и двух карт в шляпе.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-kan-must-have-all-even-cards", "title": "Понять, какие карты должен держать Кан", "text": "Если Ру получил две карты с четной суммой, то они либо обе четные, либо обе нечетные. Кан не мог быть уверен, что Ру получил две четные карты: среди чисел 1, 3, 5, 7 четыре нечетные карты, и Кан взял только три карты, поэтому он не способен убрать все нечетные карты из возможных карт Ру. Зато Кан может гарантировать, что Ру получил две нечетные карты, если сам Кан взял все три четные карты 2, 4 и 6. Тогда оставшиеся четыре карты - 1, 3, 5, 7 - все нечетные, и любые две карты Ру имеют четную сумму. Значит сумма карт Кана равна 2+4+6=12.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
