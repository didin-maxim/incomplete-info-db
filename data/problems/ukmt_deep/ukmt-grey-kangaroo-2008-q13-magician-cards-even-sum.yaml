  "statements": {"original": [{"id": "stmt-ukmt-grey-kangaroo-2008-q13", "title": "Петя знает четность суммы карт Васи", "text": "Маг Гена написал числа от 1 до 7 на семи карточках и положил их в шляпу. Затем Петя случайно взял 3 карточки, а Вася взял 2 карточки; две карточки остались в шляпе. Петя сказал Васе: «Я могу вывести, что сумма чисел на твоих карточках четна». Какова была сумма чисел на карточках Пети?", "source_ids": ["src-ukmt-imok-2008-solutions-inside"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-certainty-about-parity-requires-removing-all-evens", "title": "Уверенность о четности требует исключить все варианты другой четности", "text": "Сумма двух карт Васи четна тогда и только тогда, когда обе карты одной четности. Петя видит только свои три карты, поэтому его уверенность должна следовать из того, какие четности вообще остались для Васи и двух карт в шляпе.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-kan-must-have-all-even-cards", "title": "Понять, какие карты должен держать Петя", "text": "Если Вася получил две карты с четной суммой, то они либо обе четные, либо обе нечетные. Петя не мог быть уверен, что Вася получил две четные карты: среди чисел 1, 3, 5, 7 четыре нечетные карты, и Петя взял только три карты, поэтому он не способен убрать все нечетные карты из возможных карт Васи. Зато Петя может гарантировать, что Вася получил две нечетные карты, если сам Петя взял все три четные карты 2, 4 и 6. Тогда оставшиеся четыре карты - 1, 3, 5, 7 - все нечетные, и любые две карты Васи имеют четную сумму. Значит сумма карт Пети равна 2+4+6=12.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
