  "statements": {"original": [{"id": "stmt-ukmt-imc-2013-q23", "title": "Кто из братьев говорит правду", "text": "Четыре брата обсуждают порядок своего рождения. Двое из них лгут, а двое говорят правду. Альфред говорит: «Бернард самый младший». Горацио говорит: «Бернард самый старший, а я самый младший». Иниго говорит: «Я родился последним». Бернард говорит: «Я не самый младший и не самый старший». Какие двое говорят правду?", "source_ids": ["src-ukmt-imc-2013-sol-extended"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-contradiction-graph-excludes-speaker", "title": "Противоречия показывают, кто не может входить в пару правдивых", "text": "Если реплика одного участника противоречит слишком многим другим репликам, то при заданном числе правдивых он не может быть одним из правдивых. Здесь Горацио противоречит каждому из остальных, а Альфред противоречит двум оставшимся кандидатам.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-eliminate-alfred-and-horatio", "title": "Исключить Горацио и Альфреда", "text": "Реплика Горацио противоречит словам Альфреда, Иниго и Бернарда: если Бернард самый старший, он не самый младший; если Горацио самый младший, Иниго не родился последним; если Бернард самый старший, Бернардова фраза ложна. Поэтому Горацио не может быть одним из двух правдивых. Реплика Альфреда противоречит и Иниго, и Бернарду, значит Альфред тоже не может входить в пару правдивых. Остаются Бернард и Иниго; такая ситуация возможна, например если порядок от старшего к младшему: Альфред, Бернард, Горацио, Иниго.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
