  "statements": {"original": [{"id": "stmt-ukmt-imc-2013-q23", "title": "Кто из братьев говорит правду", "text": "Четыре брата обсуждают порядок своего рождения. Двое из них лгут, а двое говорят правду. Петя говорит: «Коля самый младший». Вася говорит: «Коля самый старший, а я самый младший». Толя говорит: «Я родился последним». Коля говорит: «Я не самый младший и не самый старший». Какие двое говорят правду?", "source_ids": ["src-ukmt-imc-2013-sol-extended"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-contradiction-graph-excludes-speaker", "title": "Противоречия показывают, кто не может входить в пару правдивых", "text": "Если реплика одного участника противоречит слишком многим другим репликам, то при заданном числе правдивых он не может быть одним из правдивых. Здесь Вася противоречит каждому из остальных, а Петя противоречит двум оставшимся кандидатам.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-eliminate-alfred-and-horatio", "title": "Исключить Васю и Петю", "text": "Реплика Васи противоречит словам Пети, Толи и Коли: если Коля самый старший, он не самый младший; если Вася самый младший, Толя не родился последним; если Коля самый старший, фраза Коли ложна. Поэтому Вася не может быть одним из двух правдивых. Реплика Пети противоречит и Толе, и Коле, значит Петя тоже не может входить в пару правдивых. Остаются Коля и Толя; такая ситуация возможна, например если порядок от старшего к младшему: Петя, Коля, Вася, Толя.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
