  "statements": {"original": [{"id": "stmt-ukmt-smc-2016-investigation-22-1", "title": "Что можно вывести о четырех друзьях", "text": "Четыре друга делают заявления. Бен говорит: «Ровно один из Кэма, Дэна и Сэма говорит правду». Дэн говорит: «Ровно один из Бена, Кэма и Сэма говорит правду». Кэм говорит: «Ровно один из Бена, Дэна и Сэма говорит правду». Сэм говорит: «Ни Бен, ни Дэн, ни Кэм не говорят правду». Что можно вывести о том, кто говорит правду, а кто лжет?", "source_ids": ["src-ukmt-smc-2016-sol-extended"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-extension-has-family-of-models", "title": "Решение может определить только общий вид всех моделей", "text": "В отличие от трех друзей, здесь не определяется единственная пара правдивых. Условие вынуждает Сэма лгать и оставляет три симметричных варианта: среди Бена, Дэна и Кэма правдивы ровно двое.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-sam-false-two-of-three", "title": "Показать, что Сэм лжет, а из остальных правдивы двое", "text": "Если Сэм говорил бы правду, то Бен, Дэн и Кэм все лгали бы. Но тогда, например, у Бена среди Кэма, Дэна и Сэма ровно один правдив - сам Сэм, значит фраза Бена стала бы истинной. Противоречие, поэтому Сэм лжет. Теперь фраза Сэма ложна означает, что среди Бена, Дэна и Кэма есть хотя бы один правдивый. Если среди них правдив ровно один, то его собственная фраза ложна: он видит среди двух остальных и Сэма ноль правдивых. Если правдивы все трое, то каждая из их фраз тоже ложна: каждый видит среди двух остальных и Сэма двух правдивых. Остается ровно два правдивых среди Бена, Дэна и Кэма, и любой выбор такой пары согласован. Значит Сэм лжет, а из Бена, Дэна и Кэма правду говорят ровно двое, но по данным нельзя определить какие именно.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
  "impossibility_proofs": [{"id": "proof-which-pair-not-identifiable", "title": "Конкретная пара правдивых не определяется", "text": "Три расклада совместимы с высказываниями: правдивы Бен и Дэн; правдивы Бен и Кэм; правдивы Дэн и Кэм. Во всех трех случаях Сэм лжет, а каждый правдивый из первой тройки видит ровно одного правдивого среди названных им трех людей. Поэтому наблюдения не различают эти три пары.", "standard_idea_ids": ["indistinguishable_states"], "status": "ai_checked", "definition_ids": ["state_space"]}],
