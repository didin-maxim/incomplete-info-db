        "text": "Четыре школьника A, B, C и D участвовали в соревновании по решению логических задач и набрали попарно разные баллы. Перед соревнованием они сказали следующее. A: «Я выиграю». B: «Я мальчик и займу первое место». C: «Мальчики ошибаются; D займет место сразу после меня, и после A не будет мальчиков». D: «C прав, и после A не будет девочек». Известно, что среди участников два мальчика и две девочки, а из четырех высказываний ровно два оказались истинными и ровно два ложными. Найдите итоговые места и пол всех участников.",
