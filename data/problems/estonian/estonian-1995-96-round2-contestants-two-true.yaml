      "title": "Получить единственное совместимое состояние",
      "text": "Разберем истинность фразы C. Если C лжет, то D тоже лжет: первая часть фразы D утверждает, что C прав. Тогда, чтобы ровно две фразы были истинными, правду должны говорить A и B. Но A и B оба утверждают, что займут первое место, а места у всех разные. Значит, C не может лгать.\n\nПусть C говорит правду. Тогда все мальчики ошибаются, D идет сразу после C, а после A нет мальчиков. Из условия «мальчики ошибаются» следует, что B не может говорить правду. A тоже не может говорить правду: если бы A был первым, то после него находились бы три участника, и все они должны были бы быть девочками, хотя девочек только две. Значит, из двух истинных фраз одна - фраза C, а второй должна быть фраза D.\n\nФраза D истинна, поэтому после A нет девочек. Но из фразы C после A нет и мальчиков. Следовательно, после A вообще никого нет, то есть A занял четвертое место. Так как C и D говорят правду, они не мальчики, иначе мальчики не ошибались бы. Значит, C и D - девочки, A и B - мальчики. D идет сразу после C; при A на четвертом месте остается единственная расстановка: C на первом месте, D на втором, B на третьем, A на четвертом. В ней A и B действительно лгут, C и D говорят правду, поэтому это единственный ответ.",
