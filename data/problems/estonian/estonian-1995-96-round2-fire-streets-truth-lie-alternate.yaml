      "text": "Если звонивший живет на T, то обе фразы должны быть истинными. Тогда пожар должен быть на T из первой фразы и на H из второй, что невозможно. Если звонивший живет на H, то обе фразы имеют одну и ту же истинность: обе истинны при пожаре на H и обе ложны при пожаре не на H; чередования нет. Значит, звонивший с улицы L, и обе его фразы ложны. Первая фраза тогда дает: пожар не на L. Вторая дает: пожар не на H. Остается улица T.",
