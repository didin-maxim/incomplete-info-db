        "title": "На какую улицу ехать пожарным",
        "text": "В городе есть три улицы: T, L и H. Жители улицы T всегда говорят правду, жители улицы L всегда лгут, а у жителей улицы H истинные и ложные фразы в речи чередуются. Пожарные увидели над городом дым, и тут же зазвонил телефон. Звонивший сказал: «На нашей улице пожар!» Пожарный спросил: «Что это за улица?» Звонивший ответил: «Улица H». На какую улицу должны ехать пожарные?",
