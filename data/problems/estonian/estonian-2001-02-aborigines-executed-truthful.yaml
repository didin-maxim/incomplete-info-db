        "title": "Два опроса о друзьях",
        "text": "На острове жили n > 1 аборигенов. Каждый из них либо всегда говорит правду, либо всегда лжет, и у каждого был хотя бы один друг среди остальных. Новый губернатор спросил каждого, кого больше среди его друзей: правдивых, лжецов или поровну тех и других. Каждый ответил, что среди его друзей больше лжецов, чем правдивых. Затем губернатор велел казнить одного аборигена как лжеца и снова задал всем оставшимся тот же вопрос. На этот раз каждый ответил, что среди его друзей больше правдивых, чем лжецов. Определите, был ли казненный правдивым или лжецом, и кого больше осталось на острове: правдивых или лжецов.",
