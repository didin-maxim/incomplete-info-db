        "id": "stmt-original",
        "title": "Сколько дней в году каждый лжет",
        "text": "На планете лиариан год состоит из 2004 дней. Для каждого жителя каждый день является либо днем правды, когда он говорит только правду, либо днем лжи, когда он всегда лжет; дней каждого типа может быть и 0. Каждый день трех лиариан спрашивали: «Сколько дней в году ты лжешь?» В день k первый отвечал: «Ровно k дней», второй: «Не меньше k дней», третий: «Не больше k дней» для k = 1, 2, ..., 2004. Сколько дней в году на самом деле лжет каждый из трех лиариан?",
