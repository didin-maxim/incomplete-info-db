      "id": "str-count-truth-days",
      "title": "Посчитать истинные ответы для каждого типа фраз",
      "text": "У первого лиариана ответы «ровно k» попарно несовместимы, значит истинным может быть не более одного. Лгать все 2004 дней он не может: тогда ответ «ровно 2004» был бы истинным. Значит он говорит правду ровно один день, а лжет 2003 дня; истинный ответ был в день 2003. Пусть второй лжет n дней. Его фраза «не меньше k» истинна ровно для k <= n, то есть в n дней, а ложна в 2004 - n дней. Но число ложных дней равно n, поэтому n = 2004 - n и n = 1002. Пусть третий лжет n дней. Если n >= 1, то фраза «не больше k» ложна для k < n и истинна для k >= n, то есть ложных ответов n - 1, противоречие. При n = 0 все его ответы истинны, что подходит. Ответ: первый лжет 2003 дня, второй 1002 дня, третий 0 дней.",
