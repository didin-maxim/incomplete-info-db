      "title": "Число дней лжи определяет, какие ответы истинны",
      "text": "Если лиариан лжет n дней в году, то ровно 2004 - n его ответов должны быть истинными. Для трех типов ответов истинные дни считаются напрямую: один день, начальный отрезок или конечный отрезок.",
