        "title": "В какой день никто не лжет",
        "text": "Три монаха медитируют в пещере. Каждый монах лжет в два соседних дня недели, а во все остальные дни говорит правду. Никакие два монаха не лгут в один и тот же день. В понедельник один монах сказал: «Вчера я лгал». На следующий день второй монах сказал: «Забавное совпадение: я тоже вчера лгал». В какой день недели ни один монах не лжет?",
