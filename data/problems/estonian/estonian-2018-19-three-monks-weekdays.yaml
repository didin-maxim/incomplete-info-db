      "text": "Первый монах не мог лгать в понедельник: тогда из ложности фразы следовало бы, что в воскресенье он не лгал, а два соседних дня лжи были бы понедельник и вторник; но это сделало бы невозможной вторничную фразу второго монаха без совпадения дней лжи. Значит первый говорит правду в понедельник и лгал в воскресенье. Второй монах не мог лгать в понедельник: тогда во вторник его фраза «вчера я лгал» была бы истинной, а его два дня лжи были бы воскресенье и понедельник, совпадая с воскресной ложью первого. Поэтому второй говорит правду в понедельник; во вторник его фраза ложна, значит он лжет во вторник. Третий не может лгать в понедельник, потому что тогда второй его соседний день лжи был бы воскресеньем или вторником, уже занятым первым или вторым монахом. Следовательно, в понедельник не лжет никто.",
