      "title": "Заменить 0 на АБ, а 1 на БВ",
      "text": "Запишем число двоичной строкой длины 2022, разрешив ведущие нули, и заменим каждый 0 блоком АБ, а каждый 1 блоком БВ. Если стерта буква Б, то остались ровно буквы А и В, где А означает 0, а В означает 1. Если стерта А, то каждый оставшийся блок БВ распознается как 1, а одиночные Б - как 0. Если стерта В, симметрично каждый блок АБ означает 0, а одиночные Б - 1. Небольшие крайние случаи с полностью нулевой или полностью единичной записью можно выделить специальными строками, как в официальном решении.",
