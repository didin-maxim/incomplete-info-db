        "title": "Фокус с числом до 2^2022 и удалением одной буквы",
        "text": "Фокусник с помощником заранее договариваются о правиле. Зритель сообщает помощнику натуральное число от 1 до \\(2^{2022}\\). Помощник выписывает строку длины 4044 из букв А, Б, В. Зритель выбирает одну из трех букв и стирает все ее вхождения. После этого фокусник, видя только оставшуюся строку, должен угадать загаданное число. Могут ли фокусник и помощник договориться так, чтобы фокус гарантированно удался?",
