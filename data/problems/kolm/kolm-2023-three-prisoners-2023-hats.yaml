      "text": "Пронумеруем цвета остатками по модулю 2023. Если Антон видит на Ване и Боре цвета \\(x\\) и \\(y\\), он называет цвет с номером \\((x+y)/2\\) по модулю 2023, то есть умножает \\(x+y\\) на число, которое при умножении на 2 дает остаток 1. Так как \\(x\\ne y\\), этот номер отличается от обоих видимых цветов. Боря слышит среднее и видит \\(x\\), поэтому восстанавливает \\(y\\). Ваня слышит среднее и ответ Бори, поэтому восстанавливает \\(x\\). Значит, Боря и Ваня всегда правы; успех зависит только от случайного совпадения ответа Антона с его собственным цветом, что происходит с вероятностью \\(1/2021\\), потому что после двух видимых цветов ему остается 2021 возможный цвет.",
