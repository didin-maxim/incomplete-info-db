        "id": "stmt-kolm-2023-blind-wise-man",
        "title": "Определить длину полоски по ответам о крае и управлению по большему соседу",
        "text": "Царь завязал мудрецу глаза, выбрал натуральное \\(n\\), нарисовал полоску \\(1\\times n\\), расставил в ее клетках числа от 1 до \\(n\\) в неизвестном порядке и поставил фишку в одну из клеток. В начале каждого хода царь сообщает мудрецу, стоит ли фишка с краю; если стоит, то сообщает, на каком краю, и затем сдвигает фишку в соседнюю клетку. Если фишка не на краю, мудрец говорит, сдвинуть ее к большему из двух соседних чисел или к меньшему; царь делает этот ход, но не сообщает направление. Может ли мудрец после конечной серии ходов определить число \\(n\\)?",
        "source_ids": ["src-kolmogorov-2023-official"],
        "status": "needs_human_review",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["state_space"]
      }
