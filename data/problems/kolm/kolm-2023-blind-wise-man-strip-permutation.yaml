      "id": "str-reach-edge-then-reconstruct-arrows",
      "title": "Дойти до края, затем восстанавливать стрелки",
      "text": "В каждой внутренней клетке мысленно нарисуем стрелку к соседу с большим числом. Команда мудреца означает «идти по стрелке» или «идти против стрелки». Сначала он перечисляет все возможные ситуации и для очередной гипотезы выполняет маршрут, который в этой гипотезе привел бы к краю; когда реальная ситуация будет обработана, край будет достигнут. После попадания на край мудрец начинает восстанавливать стрелки от края внутрь: добирается до следующей клетки, пробует шаг по стрелке и проверяет, вернулся ли он к известному краю за ожидаемое число шагов. Повторяя это с краев, он в конечном итоге обнаруживает противоположный край и тем самым узнает \\(n\\).",
