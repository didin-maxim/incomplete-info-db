        "text": "На острове живут рыцари, всегда говорящие правду, и лжецы, всегда говорящие неправду. Путешественник подошел к группе из двадцати островитян. Первому он задал вопрос: «Сколько рыцарей среди вас?» Первый ответил, но путешественник не расслышал число. Тогда он спросил второго: «Что он сказал?» Второй ответил: «Он сказал, что среди нас 10 рыцарей». Третий сказал: «Не верьте второму, он лжет!» Затем четвертый так же обвинил третьего во лжи, и так далее до двадцатого включительно. Сколько в этой компании рыцарей?",
