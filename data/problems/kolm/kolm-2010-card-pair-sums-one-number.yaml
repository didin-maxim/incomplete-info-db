      "text": "Выберем любые три карточки с числами \\(a,b,c\\). Спросим суммы \\(a+b\\), \\(a+c\\) и \\(b+c\\). Тогда, например, \\(a=((a+b)+(a+c)-(b+c))/2\\), поэтому после трех вопросов известно даже не одно, а все три выбранных числа.",
