  "strategies": [
    {
      "id": "str-golomb-ruler-six-wallets",
      "title": "Использовать числа 1, 2, 6, 9, 18, 20",
      "text": "Для \\(n\\le 6\\) возьмем первые n чисел из набора 1, 2, 6, 9, 18, 20. Все положительные попарные разности этих шести чисел различны; значит, различны и все упорядоченные разности. По отклонению показания от нормального веса находим, какой кошелек тяжелый и какой легкий.",
