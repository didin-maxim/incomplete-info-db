        "id": "stmt-original",
        "title": "Один кошелек легкий, один тяжелый",
        "text": "Имеется n кошельков, по 20 монет в каждом. В одном кошельке все монеты на 1 г легче настоящих, в другом все монеты на 1 г тяжелее настоящих, в остальных кошельках монеты настоящие. Масса настоящей монеты известна. При каких n за одно взвешивание на весах со стрелкой можно наверняка определить, в каких кошельках какие монеты?",
