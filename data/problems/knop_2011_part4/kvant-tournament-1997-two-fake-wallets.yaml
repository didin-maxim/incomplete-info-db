      "id": "idea-distinct-differences",
      "title": "Нужны попарно различные разности",
      "text": "Если из кошелька i взять \\(a_i\\) монет, то при тяжелом кошельке i и легком j отклонение от нормального веса равно \\(a_i-a_j\\). Значит, все упорядоченные разности должны быть различны.",
      "status": "ai_checked",
