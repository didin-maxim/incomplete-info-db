  "impossibility_proofs": [
    {
      "id": "imp-n-at-most-six",
      "title": "При n больше 6 не хватит разностей",
      "text": "Для n кошельков нужно различить \\(n(n-1)\\) упорядоченных пар тяжелый-легкий. Все значения \\(a_i-a_j\\) лежат между -20 и 20, всего 41 целое значение; нулевая разность для разных кошельков невозможна. Поэтому нужно \\(n(n-1)\\le 40\\), откуда \\(n<7\\).",
