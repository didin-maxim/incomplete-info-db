  "strategies": [
    {
      "id": "str-three-weighings-124-13-23",
      "title": "Взвесить 1+2+4, 1+3 и 2+3",
      "text": "Пронумеруем монеты 1--4 и взвесим наборы 1+2+4, 1+3 и 2+3. Монета 4 участвует нечетное число раз, остальные в сумме трех показаний дают четный вклад; поэтому по четности суммы показаний узнаем вес монеты 4. После этого из уравнений \\(x_1+x_2=w_1-x_4\\), \\(x_1+x_3=w_2\\), \\(x_2+x_3=w_3\\) находятся веса первых трех монет.",
      "status": "ai_checked",
