        "title": "Стрелка и четность",
        "text": "Среди 21 монеты 10 настоящих и 11 фальшивых. Фальшивые монеты на 1 г легче настоящих. Как за одно взвешивание на двухчашечных весах со стрелкой узнать, фальшива ли заранее выбранная монета?",
