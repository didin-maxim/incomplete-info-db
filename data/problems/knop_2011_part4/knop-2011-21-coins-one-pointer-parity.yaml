  },
  "ideas": [
    {
      "id": "idea-parity-of-rest",
      "title": "Четность выдает тип оставшейся монеты",
      "text": "Если не взвешивать проверяемую монету, на чашах окажутся 20 остальных. В зависимости от того, настоящая она или фальшивая, среди этих 20 монет будет соответственно 10 или 11 фальшивых; это меняет четность возможной разности весов.",
      "status": "ai_checked",
      "standard_idea_ids": [
        "parity_invariant"
      ]
    }
  ],
  "strategies": [
    {
      "id": "str-weigh-ten-against-ten",
      "title": "Разложить остальные монеты поровну",
      "text": "Положим на каждую чашу по 10 монет из остальных двадцати. Если проверяемая монета фальшивая, то среди взвешенных монет 10 фальшивых и 10 настоящих, поэтому разность весов четна. Если проверяемая монета настоящая, среди взвешенных монет 11 фальшивых и 9 настоящих, поэтому разность весов нечетна. По четности показания стрелки определяем ответ.",
