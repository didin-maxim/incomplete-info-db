        "title": "Завхоз доказывает маркировку банок",
        "text": "Геологи взяли 80 банок консервов, веса которых все известны и различны. Надписи стали нечитаемыми, и только завхоз знает, где какая банка. Он должен доказать это всем, не вскрывая банки, пользуясь списком весов и двухчашечными весами со стрелкой, показывающей разницу весов. Докажите, что четырех взвешиваний достаточно, а трех недостаточно.",
