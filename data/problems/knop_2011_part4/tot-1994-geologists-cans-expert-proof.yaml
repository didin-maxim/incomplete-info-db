      "id": "str-four-ternary-levels",
      "title": "Четыре раза делить на трети",
      "text": "Добавим фиктивную банку нулевого веса и получим 81 предмет. На первом шаге завхоз кладет 27 самых легких известных ему банок на левую чашу и 27 самых тяжелых на правую. Показанная максимальная разность доказывает, что эти группы выбраны верно, а оставшиеся 27 имеют средние веса. Затем каждая из трех групп делится на три группы по 9 тем же приемом, потом на тройки, потом на одиночные банки. После четырех уровней все банки определены.",
