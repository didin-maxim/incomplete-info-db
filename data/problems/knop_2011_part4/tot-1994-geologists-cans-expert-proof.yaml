      "id": "idea-extreme-thirding-certificate",
      "title": "Крайние группы можно сертифицировать по максимальной разности",
      "text": "Если положить самые легкие банки на одну чашу, самые тяжелые на другую, то разность весов будет экстремальной и достигается единственным образом. Такое взвешивание разбивает банки на три сертифицированные группы: легкие, средние и тяжелые.",
