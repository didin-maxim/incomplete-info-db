        "id": "stmt-original",
        "title": "Три мешка и не более четырех монет",
        "text": "Имеются 3 мешка; некоторые из них наполнены фальшивыми монетами, остальные настоящими. Настоящая монета весит 10 г, фальшивая 9 г. Как найти все мешки с фальшивыми монетами за два взвешивания на одночашечных весах со стрелкой, использовав во взвешиваниях не более четырех монет?",
