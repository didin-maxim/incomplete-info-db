  "ideas": [
    {
      "id": "idea-two-small-linear-signatures",
      "title": "Две малые суммы различают восемь случаев",
      "text": "Нужно не просто дать мешкам двоичные веса, а подобрать две короткие линейные суммы, в которых всего участвуют четыре монеты. Пара числовых показаний должна быть различной для всех восьми наборов настоящих и фальшивых мешков.",
      "status": "ai_checked",
      "standard_idea_ids": [
        "weighted_sum_encoding"
      ]
    }
  ],
  "strategies": [
    {
      "id": "str-2a-plus-b-and-b-plus-c",
      "title": "Взвесить 2a+b и b+c",
      "text": "Обозначим веса монет из трех мешков через \\(a,b,c\\), каждый из них равен 9 или 10. Первым взвешиванием найдем \\(X=2a+b\\), вторым \\(Y=b+c\\). Для всех восьми троек \\((a,b,c)\\) пары \\((X,Y)\\) различны, поэтому по двум показаниям восстанавливаются все три мешка.",
      "status": "ai_checked",
      "standard_idea_ids": [
