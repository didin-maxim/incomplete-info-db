  "ideas": [
    {
      "id": "idea-four-by-four-partition",
      "title": "Первое взвешивание делит 16 положений на четыре четверки",
      "text": "Положение задается номером левой из трех легких гирь: всего 16 случаев. Одно числовое взвешивание выбранного набора сообщает, сколько из трех легких гирь туда попало, то есть один из четырех исходов. Нужно подобрать первое взвешивание так, чтобы каждый исход оставлял ровно четыре случая.",
      "status": "ai_checked",
