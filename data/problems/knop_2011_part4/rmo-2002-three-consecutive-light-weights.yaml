  "strategies": [
    {
      "id": "str-weigh-4-7-and-12-15",
      "title": "Сначала гири 4--7 и 12--15",
      "text": "Первым взвешиванием положим гири 4,5,6,7,12,13,14,15. Недостача от 800 г равна числу легких гирь среди них. Для каждого ответа 0,1,2,3 остается четыре возможных положения блока. Вторым взвешиванием в соответствующей четверке случаев выбираем набор так, чтобы он содержал соответственно 0, 1, 2 и 3 легкие гири в этих четырех вариантах; например, для ветви 0 подходят гири 10,11,16,17,18, а для ветви 3 - гири 7,13,14,15.",
