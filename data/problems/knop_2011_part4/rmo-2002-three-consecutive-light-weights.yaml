        "title": "Три легких подряд среди восемнадцати",
        "text": "В ряд выстроены 18 внешне одинаковых 100-граммовых гирь. Известно, что какие-то три рядом стоящие гири облегченные: они весят по 99 г. Как за два взвешивания на весах со стрелкой найти все фальшивые гири?",
