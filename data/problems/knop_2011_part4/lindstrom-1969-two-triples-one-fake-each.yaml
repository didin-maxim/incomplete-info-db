      "id": "idea-two-first-tests-leave-pairs",
      "title": "Две суммы почти разбивают девять случаев",
      "text": "После взвешиваний 1+A и 2+B каждый возможный ответ оставляет не более двух пар фальшивых монет. Тогда третьим взвешиванием одной подходящей монеты можно различить оставшуюся пару случаев.",
