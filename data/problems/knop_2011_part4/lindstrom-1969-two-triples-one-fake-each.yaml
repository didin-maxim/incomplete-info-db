  "strategies": [
    {
      "id": "str-weigh-1A-2B-then-adapt",
      "title": "Сравнить пары 1+A и 2+B",
      "text": "Назовем монеты первой тройки 1,2,3, второй A,B,C. Первые два взвешивания: 1+A и 2+B; по весам узнаем, сколько фальшивых монет попало в каждую пару. Если это сразу задает единственный случай, задача решена. В остальных ветвях остаются две возможности: пары 2,A и 1,B различаются взвешиванием A; пары 2,C и 3,B различаются взвешиванием B; пары 3,A и 1,C различаются взвешиванием C.",
      "status": "ai_checked",
      "standard_idea_ids": [
        "partition_state_space"
      ]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "imp-two-weighings-not-enough",
      "title": "Двух взвешиваний недостаточно",
      "text": "За два взвешивания возможны девять пар чисел: сколько фальшивых монет попало в первое и второе взвешивание. Чтобы различить девять состояний, все эти пары должны были бы реализоваться ровно по одному разу. Тогда существовали бы состояния (0,0) и (2,2); если это пары 1,A и 2,B, то состояния 1,B и 2,A дают одинаковые ответы (1,1).",
      "method": "counting_indistinguishability",
