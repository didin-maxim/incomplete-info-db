      "id": "idea-three-by-cycle",
      "title": "Три яблока восстанавливаются из трех пар",
      "text": "Для трех яблок суммы пар \\(a+b\\), \\(b+c\\), \\(c+a\\) вместе дают удвоенную сумму \\(a+b+c\\). Оставшиеся шесть яблок можно разбить на пары и взвесить напрямую.",
