      "title": "Сначала тройка, потом три пары",
      "text": "Взвесим пары первых трех яблок: 1+2, 2+3 и 1+3. Половина суммы трех показаний равна весу этих трех яблок. Остальные шесть яблок разобьем на три пары и взвесим каждую пару. Сумма полученного веса тройки и трех пар равна общему весу всех девяти яблок.",
