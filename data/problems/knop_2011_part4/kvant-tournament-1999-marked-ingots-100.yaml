      "id": "idea-graph-components",
      "title": "Каждое парное взвешивание соединяет слитки",
      "text": "Из-за ограничения 2500 г одновременно можно взвесить не больше двух слитков. Взвешивание пары дает ребро между двумя слитками; чтобы судья различил слитки внутри группы, граф связей должен достаточно связать почти все вершины.",
      "status": "ai_checked",
      "standard_idea_ids": [
        "graph_connectivity",
        "extremal_principle"
      ]
    }
  ],
  "strategies": [
    {
      "id": "str-two-per-triple",
      "title": "Разбить 99 слитков на тройки",
      "text": "Отложим самый тяжелый слиток. Остальные 99 слитков разобьем по возрастанию на тройки: 1001,1002,1003; 1004,1005,1006; и так далее. В каждой тройке двумя взвешиваниями эксперт показывает пары из самого легкого слитка с двумя другими. Суммы пар однозначно определяют все три веса в тройке. Так 33 тройки требуют 66 взвешиваний; последний отложенный слиток определяется как оставшийся.",
      "status": "ai_checked",
      "standard_idea_ids": [
