        "id": "stmt-original",
        "title": "Эксперт и слитки до 2500 г",
        "text": "Эксперту предъявлены 100 серебряных слитков весом 1001, 1002, ..., 1100 г, промаркированных неизвестными судье знаками. Весы показывают вес груза, только если этот вес не более 2500 г. За какое наименьшее число взвешиваний эксперт сможет убедить судью, что он знает веса всех слитков?",
