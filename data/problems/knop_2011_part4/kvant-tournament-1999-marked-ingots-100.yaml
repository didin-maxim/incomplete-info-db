  "impossibility_proofs": [
    {
      "id": "imp-sixty-five-not-enough",
      "title": "65 взвешиваний не хватит",
      "text": "Из-за ограничения 2500 г на весы можно положить не больше двух слитков. Рассмотрим граф, где вершины - слитки, а взвешенная пара соединяется ребром. За 65 взвешиваний число компонент среди 100 слитков уменьшится максимум до 35. Тогда найдутся две неразличимые одиночные компоненты или компонента с двумя слитками, чью перестановку судья не сможет исключить.",
