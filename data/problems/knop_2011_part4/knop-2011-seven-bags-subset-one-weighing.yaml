  "ideas": [
    {
      "id": "idea-subset-sum-deficit",
      "title": "Недостача веса указывает подмножество",
      "text": "Если взять из мешков разные степени двойки монет, то общая недостача веса равна сумме тех степеней двойки, которые соответствуют фальшивым мешкам. Двоичная запись этой недостачи восстанавливает весь набор мешков.",
      "status": "ai_checked",
      "standard_idea_ids": [
        "weighted_sum_encoding"
      ]
    }
  ],
  "strategies": [
    {
      "id": "str-powers-of-two-seven-bags",
      "title": "Взять 1, 2, 4, ..., 64 монеты",
      "text": "Пронумеруем мешки от 1 до 7 и возьмем из них соответственно \\(1,2,4,8,16,32,64\\) монеты. Если бы все выбранные монеты были настоящими, вес был бы 1270 г. Реальная недостача равна числу фальшивых монет на весах, то есть сумме степеней двойки по фальшивым мешкам. Записав недостачу в двоичной системе, получаем все фальшивые мешки.",
