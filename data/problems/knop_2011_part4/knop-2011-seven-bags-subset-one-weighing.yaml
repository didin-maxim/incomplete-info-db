        "title": "Фальшивые мешки могут быть в любом наборе",
        "text": "Имеются 7 мешков. В некоторых из них все монеты фальшивые, а в остальных все монеты настоящие. Настоящая монета весит 10 г, фальшивая 9 г. Как за одно взвешивание на весах со стрелкой найти все мешки с фальшивыми монетами?",
