  "ideas": [
    {
      "id": "idea-hamming-balls",
      "title": "У каждого объекта есть несколько возможных наборов ответов",
      "text": "Если бы никто не лгал, у объекта был бы один правильный набор из \\(q\\) ответов. При одной лжи наблюдаемый набор может совпасть с правильным или отличаться ровно в одном месте. Значит, одному объекту соответствует \\(q+1\\) возможных наборов ответов.",
      "standard_idea_ids": ["one_lie_redundancy"],
      "status": "ai_checked"
    }
  ],
  "strategies": [],
  "impossibility_proofs": [
    {
      "id": "lb-hamming-packing",
      "title": "Два объекта не должны путаться после одной лжи",
      "text": "Если все вопросы выбраны заранее, каждому объекту соответствует набор из \\(q\\) правдивых ответов. Если допускается одна ложь, то все наборы, которые могли получиться из-за одной лжи, для разных объектов должны быть различны. Иначе один и тот же полученный набор подходил бы сразу к двум объектам. Поэтому \\(N(q+1)\\le 2^q\\). Эта оценка также служит ориентиром для игры, где следующий вопрос зависит от ответа, хотя полная оптимальность таких стратегий требует более тонкого анализа.",
