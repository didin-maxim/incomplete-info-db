        "title": "Один ответ может быть ложным",
        "text": "Задуман один из \\(N\\) объектов. Можно задать \\(q\\) вопросов с ответами \"да\" или \"нет\". Среди ответов может быть не более одной лжи. Почему вопросов должно быть достаточно много?",
