        "id": "stmt-original",
        "title": "Один ответ может быть ложным",
        "text": "Задуман один из \\(N\\) объектов. Можно задать \\(q\\) вопросов с ответами \"да\" или \"нет\". Среди ответов может быть не более одной лжи. Какую информационную нижнюю оценку на \\(q\\) дает это условие?",
        "source_ids": ["src-folklore"],
        "status": "ai_checked",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["decision_tree", "error_correcting_code"]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-hamming-balls",
      "title": "У каждого объекта есть шар возможных ответов",
      "text": "Если истинный код объекта имеет длину \\(q\\), то при одной лжи наблюдаемый ответ может совпасть с ним или отличаться ровно в одной позиции. Значит, одному объекту соответствует \\(q+1\\) возможных наблюдаемых слов.",
      "standard_idea_ids": ["one_lie_redundancy"],
      "status": "ai_checked"
    }
  ],
  "strategies": [],
  "impossibility_proofs": [
    {
      "id": "lb-hamming-packing",
      "title": "Упаковочная нижняя оценка",
      "text": "В неадаптивной версии каждому объекту соответствует двоичное слово длины \\(q\\) - набор правдивых ответов. Если допускается одна ложь, то все слова на расстоянии не больше 1 от разных объектов должны быть различны, иначе одно и то же наблюдение было бы совместимо с двумя объектами. Поэтому \\(N(q+1)\\le 2^q\\). Эта оценка также служит ориентиром для адаптивной игры, хотя полная оптимальность адаптивных стратегий требует более тонкого анализа.",
