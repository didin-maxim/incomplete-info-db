        "id": "stmt-kangaroo-2014-78-q27",
        "title": "Сколько рыцарей на острове",
        "text": "На острове живут рыцари, которые всегда говорят правду, лжецы, которые всегда лгут, и хитрецы, каждый из которых поочередно отвечает на заданные ему вопросы то правду, то ложь. Каждому жителю острова было задано два вопроса: «Вы рыцарь?» и затем «Вы хитрец?». Ответ «Да» на первый вопрос дали 17 человек, а на второй - 12. Сколько рыцарей на острове?\n\n(A) 4; (Б) 5; (В) 17; (Г) 29; (Д) невозможно определить.",
