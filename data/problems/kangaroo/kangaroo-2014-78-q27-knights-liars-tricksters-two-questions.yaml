      "id": "idea-answer-pairs-by-type",
      "title": "Тип жителя задает пару ответов",
      "text": "Рыцарь отвечает «да» на первый вопрос и «нет» на второй. Лжец тоже отвечает «да» на первый вопрос, потому что он не рыцарь, и «да» на второй, потому что он не хитрец. Хитрец на этих двух вопросах дает либо пару «да, да», либо пару «нет, нет»: один ответ у него правдивый, другой ложный.",
