      "title": "Сравнить два числа ответов «да»",
      "text": "Обозначим число рыцарей через \\(R\\), число лжецов через \\(L\\), а через \\(T_1\\) - число хитрецов, которые на первом вопросе лгали, а на втором говорили правду. Тогда именно они среди хитрецов отвечают «да» на оба вопроса; остальные хитрецы отвечают «нет» на оба вопроса.\n\nНа вопрос «Вы рыцарь?» ответили «да» все рыцари, все лжецы и эти \\(T_1\\) хитрецов, поэтому\n\\[\nR+L+T_1=17.\n\\]\nНа вопрос «Вы хитрец?» ответили «да» все лжецы и те же \\(T_1\\) хитрецов, поэтому\n\\[\nL+T_1=12.\n\\]\nВычитая второе равенство из первого, получаем \\(R=17-12=5\\). Значит, на острове 5 рыцарей; в вариантах это ответ (Б).",
