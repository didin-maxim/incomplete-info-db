    {
      "id": "idea-difference-counts-knights",
      "title": "Разность счетчиков «да» равна числу рыцарей",
      "text": "Лжецы и хитрецы вносят одинаковый вклад в оба счетчика ответов «да»: лжец добавляет по одному «да» в каждый счетчик, а хитрец добавляет либо по одному, либо по нулю. Только рыцарь добавляет «да» в первый счетчик и не добавляет во второй.",
