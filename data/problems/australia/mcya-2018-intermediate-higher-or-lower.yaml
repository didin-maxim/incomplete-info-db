  "statements": {"original": [{"id": "stmt-mcya-2018-higher-or-lower", "title": "Выигрышные шансы в игре с подсказками выше/ниже", "text": "Два игрока играют в «Больше или меньше». Приз спрятан в одной из коробок, стоящих в ряд и пронумерованных слева направо. Все коробки равновероятны. Игроки по очереди называют номер коробки. Если номер верный, ведущий говорит, что ответ правильный, и этот игрок выигрывает. Если номер неверный, ведущий, знающий место приза, честно говорит, что приз находится выше или ниже названного номера. Оба игрока всегда следуют этим подсказкам. В задаче нужно сравнить стратегии первого хода для 3 и 4 коробок, а затем показать, что при 9 коробках у первого игрока есть стратегия с вероятностью выигрыша больше 1/2.", "source_ids": ["src-amt-australian-scene-2018"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["decision_tree"]}]},
  "ideas": [{"id": "idea-guess-splits-hidden-interval", "title": "Неверная догадка сужает скрытый интервал", "text": "Каждый ход либо сразу находит приз, либо разбивает текущее множество возможных коробок на левую и правую части. Подсказка ведущего выбирает одну из этих частей и передает ход сопернику, поэтому важна не только длина интервала, но и чей следующий ход.", "standard_idea_ids": ["decision_tree_lower_bound"], "status": "ai_checked"}],
  "strategies": [{"id": "str-edge-and-middle-recursion", "title": "Использовать маленькие игры как поддеревья", "text": "Для 3 коробок первый ход в край дает первому игроку шанс 2/3: он выигрывает сразу с вероятностью 1/3, а если получает подсказку, то в оставшихся двух коробках второй игрок либо угадывает, либо оставляет последнюю коробку первому. Для 4 коробок второй игрок может после любого первого хода обеспечить себе шанс 1/2. Для 9 коробок первый игрок называет среднюю коробку 5: с вероятностью 1/9 он выигрывает сразу, а иначе остается игра на 4 коробках, где теперь первый игрок получает роль второго в подыгре и может обеспечить себе 1/2. Итого шанс равен 1/9 + (8/9)(1/2) = 5/9.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["decision_tree"]}],
