  "statements": {"original": [{"id": "stmt-aimo-2017-aimosia-coins", "title": "Определить сумму трех монет Джимми", "text": "В стране Аймосии есть три вида монет, и их достоинства - разные целые числа долларов. У Джека, Джилл и Джимми есть хотя бы по одной монете каждого вида. У Джека 4 монеты на сумму 28 долларов, у Джилл 5 монет на сумму 21 доллар, а у Джимми ровно 3 монеты. Нужно найти общую стоимость монет Джимми.", "source_ids": ["src-amt-aimo-2017-paper-solutions"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-one-extra-coin-encodes-collection", "title": "Суммы Джека и Джилл задают базовую тройку плюс добавочные монеты", "text": "Поскольку каждый участник имеет хотя бы по одной монете каждого вида, 4 монеты Джека - это одна полная тройка номиналов и еще одна монета, а 5 монет Джилл - полная тройка и еще две монеты. Скрытое состояние состоит не только из трех номиналов, но и из того, какие добавочные монеты попали в две известные коллекции.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-bound-sum-and-eliminate-extras", "title": "Ограничить сумму трех номиналов и перебрать тип добавочной монеты", "text": "Обозначим номиналы через a, b, c. В коллекции Джека сумма равна a+b+c+d=28, где d - один из номиналов. В коллекции Джилл сумма равна a+b+c+e=21, где e - сумма двух номиналов с повторениями. Из минимальности положительных разных номиналов и из этих двух равенств получается короткий набор случаев для d и e. Официальное решение исключает невозможные варианты и получает номиналы 2, 4 и 11. Так как у Джимми ровно три монеты и есть хотя бы по одной каждого вида, его сумма равна 17.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
