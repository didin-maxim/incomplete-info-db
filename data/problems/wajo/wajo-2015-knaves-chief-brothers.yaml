      "id": "str-test-og-type",
      "title": "Начать с типа Ога",
      "text": "Если Ог рыцарь, его фраза истинна: Бог — вождь и лжец. Тогда фраза Бога ложна. Но Бог говорит, что Ог не вождь и Ог рыцарь; при найденном состоянии обе части истинны, значит фраза Бога была бы истинной, противоречие. Следовательно, Ог — лжец. Фраза Бога «Ог не вождь, и он рыцарь» содержит ложную часть «Ог рыцарь», поэтому Бог тоже лжец. Тогда утверждение Ога «Бог — вождь, и он лжец» должно быть ложным; поскольку Бог действительно лжец, ложной остается часть «Бог — вождь». Значит, вождь — Ог, и он лжец.",
