      "title": "Нужно узнать и вождя, и кто говорит правду",
      "text": "Нужно одновременно определить две вещи: кто является вождем и кто говорит правду. Каждая реплика связывает роль одного брата с правдивостью другого, поэтому отдельная проверка только роли или только правдивости недостаточна.",
