        "title": "Ог и Бог",
        "text": "Филип знает, что на острове есть вождь, но не знает, рыцарь он или лжец. Поиски сузились до двух братьев, Ога и Бога. Ог говорит: «Бог — вождь, и он лжец». Бог говорит: «Ог не вождь, и он рыцарь». Рыцари всегда говорят правду, лжецы всегда лгут. Кто вождь, и он рыцарь или лжец?",
