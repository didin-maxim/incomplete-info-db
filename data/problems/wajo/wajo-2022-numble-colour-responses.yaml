      "title": "Цветовой ответ разбивает пространство перестановок",
      "text": "После первой попытки часть цифр и позиций уже известна, а оставшиеся варианты образуют конечное пространство скрытых состояний. Следующая попытка должна делить эти состояния по возможным цветовым ответам; доказательство оптимальности требует не только стратегии, но и примера, где после меньшего числа попыток остается больше одного варианта.",
