        "id": "stmt-wajo-2022-numble",
        "title": "Пятизначное число дня",
        "text": "В игре Numble компьютер выбирает пятизначное число дня из пяти различных цифр; первая цифра может быть 0. Игрок вводит попытку — строку из пяти различных цифр. После попытки каждая позиция окрашивается: зеленый цвет означает правильную цифру на правильном месте, желтый — цифра есть в числе дня, но стоит в другом месте, красный — такой цифры в числе дня нет. Алиса всегда начинает с попытки 12345. Для заданных цветовых ответов YYGGG, YRGGG, RRGGG, YYYGG и YYYYG нужно для каждого случая найти число возможных чисел дня и наименьшее число попыток, за которое Алиса может гарантированно решить игру.",
