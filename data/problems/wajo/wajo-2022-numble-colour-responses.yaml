      "id": "str-numble-small-cases",
      "title": "Считать оставшиеся состояния и строить дерево попыток",
      "text": "Для простых ответов после 12345 можно считать варианты напрямую. Например, ответ YYGGG означает, что последние три цифры уже равны 345, а первые две — это 1 и 2 в обратном порядке, значит остается одно число 21345 и всего нужны две попытки. Ответ RRGGG означает, что первые две цифры — две различные цифры из {0,6,7,8,9}, поэтому вариантов 5·4=20; официальная стратегия пробует перестановку этих пяти цифр и гарантирует решение за четыре попытки. Для YYYYG остается девять допустимых перестановок первых четырех цифр; в официальном разборе строится вторая попытка, после которой в худшем случае остаются две возможности, поэтому требуется не более четырех попыток. Сжатая карточка фиксирует механизм, но полный разбор всех ветвей лучше проверять по официальному решению.",
