        "id": "stmt-komal-2020-k664",
        "title": "Минимум взвешиваний для нахождения одной легкой монеты",
        "text": "Есть шесть монет. Четыре весят по 100 граммов, а две оставшиеся - по 99 граммов. За сколько взвешиваний на чашечных весах без гирь можно гарантированно определить хотя бы одну из легких монет?",
