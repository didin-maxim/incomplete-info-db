  "ideas": [
    {
      "id": "idea-equal-first-weighing-still-gives-pair",
      "title": "Равновесие тоже оставляет известную одинаковую пару",
      "text": "Если сравнение двух пар монет дает равновесие, то либо на весах четыре настоящие монеты, либо в каждой паре по одной легкой. В обоих случаях две не взвешенные монеты имеют одинаковый вес, и это можно использовать как контроль во втором взвешивании.",
      "standard_idea_ids": [
