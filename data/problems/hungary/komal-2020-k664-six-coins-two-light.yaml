  "strategies": [
    {
      "id": "str-two-pair-then-control",
      "title": "Сравнить две пары, затем одну монету с контрольной",
      "text": "Обозначим монеты \\(A,B,C,D,E,F\\). Сначала сравним \\(A+B\\) и \\(C+D\\). Если, например, \\(A+B\\) легче, то среди \\(A,B\\) есть легкая монета, а \\(C,D\\) обе настоящие; вторым взвешиванием сравним \\(A\\) с \\(C\\). Если \\(A\\) легче, она искомая, иначе искомая \\(B\\). Если первое взвешивание дало равновесие, то \\(E\\) и \\(F\\) имеют одинаковый вес. Вторым взвешиванием сравним \\(A\\) и \\(E\\): при равновесии \\(A\\) настоящая и можно указать \\(B\\); если одна из них легче, укажем ее.",
