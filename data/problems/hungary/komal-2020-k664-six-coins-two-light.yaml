        "balance_scale"
      ]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-one-weighing-not-enough",
      "title": "Одно взвешивание не может указать конкретную легкую монету",
      "text": "Если за одно взвешивание положить на чаши разное число монет, то разница в числе настоящих монет не может быть компенсирована двумя граммами возможного дефекта; исход заранее определяется размерами чаш и не указывает общую легкую монету во всех 15 возможных парах. Поэтому достаточно рассмотреть сравнение равных групп.\n\nПри сравнении одной монеты с одной исход \"равновесие\" совместим как с двумя настоящими взвешенными монетами, так и с двумя легкими; общей гарантированно легкой монеты нет. При сравнении двух пар равновесие совместимо с двумя легкими вне весов и с одной легкой на каждой чаше; снова нет общей монеты, которую можно назвать. При сравнении трех против трех любой неравный исход лишь показывает, что обе легкие монеты находятся на более легкой стороне, но не выбирает одну из трех; равновесие оставляет по одной легкой на каждой чаше. Значит одного взвешивания недостаточно.",
