  "ideas": [{"id": "idea-columns-as-ternary-signatures", "title": "Задать монетам попарно противоположные записи", "text": "План взвешиваний можно записать таблицей из \\(-1,0,1\\): столбец монеты показывает, где она лежит в каждом взвешивании. Если фальшивая монета тяжелая, вектор исходов равен ее столбцу; если легкая, то противоположному столбцу. Поэтому достаточно выбрать \\(n\\) ненулевых столбцов так, чтобы ни два столбца не совпадали с точностью до знака, а в каждой строке было поровну левых и правых участий.", "standard_idea_ids": ["ternary_weighing_code"], "status": "ai_checked"}],
  "strategies": [{"id": "str-balanced-ternary-table", "title": "Построить сбалансированную таблицу взвешиваний", "text": "Выберем \\(n\\) столбцов из \\(k\\)-строк с числами \\(-1,0,1\\) так, чтобы вместе с противоположными столбцами они были различны, нулевой столбец не использовался, а сумма столбцов была нулевой. В \\(i\\)-м взвешивании монеты со знаком \\(+1\\) кладем на левую чашу, со знаком \\(-1\\) - на правую, со знаком \\(0\\) не используем. Условие нулевой суммы гарантирует равное число настоящих монет на чашах. Полученный вектор исходов сразу указывает либо столбец фальшивой монеты, либо его отрицание, то есть одновременно монету и знак отклонения.", "standard_idea_ids": ["ternary_weighing_code"], "status": "ai_checked", "definition_ids": ["balance_scale"]}],
