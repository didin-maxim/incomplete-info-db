  "statements": {"original": [{"id": "stmt-komal-2016-k517", "title": "Два дня высказываний о типах и фамилиях", "text": "В Нормалии есть город, где правдивцы всегда говорят правду, а все остальные жители говорят правду через день: один день правду, на следующий день ложь, затем снова правду и так далее. Фамилии Пети, Васи и Толи - Малый, Большой и Длинный в некотором порядке. В понедельник Петя сказал: «Вася сейчас не говорит правду»; Вася: «Я не правдивец»; Толя: «Среди нас есть правдивец». Во вторник Петя сказал: «Толя вчера сказал правду»; Вася: «Фамилия Пети - либо Большой, либо Малый»; Толя: «Фамилия Васи не Малый». Определите фамилии всех троих.", "source_ids": ["src-komal-2016-k517"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-alternator-day-links", "title": "Высказывание одного дня фиксирует режим следующего дня", "text": "Если участник не правдивец, то истинность его высказываний в понедельник и вторник противоположна. Поэтому, установив истинность одной реплики, можно перенести информацию на следующий день и затем использовать ее для фамилий.", "standard_idea_ids": ["knowledge_elimination"], "status": "ai_checked"}],
  "strategies": [{"id": "str-identify-types-then-surnames", "title": "Сначала определить типы, затем прочитать фамилии", "text": "Вася не может быть правдивцем: его фраза «я не правдивец» была бы ложной. Значит в понедельник он сказал правду как чередующий житель. Тогда фраза Пети в понедельник ложна, и Петя тоже не правдивец. Во вторник Петя должен говорить правду, откуда Толя действительно сказал правду в понедельник; следовательно, правдивец среди троих есть, и им является Толя. Вася во вторник лжет, поэтому фамилия Пети не Большой и не Малый, то есть Длинный. Толя во вторник говорит правду, значит фамилия Васи не Малый; ему остается Большой, а Толе - Малый.", "standard_idea_ids": ["knowledge_elimination"], "status": "ai_checked", "definition_ids": ["state_space"]}],
