  "statements": {"original": [{"id": "stmt-komal-2016-k517", "title": "Два дня высказываний о типах и фамилиях", "text": "В Нормалии есть город, где правдивцы всегда говорят правду, а все остальные жители говорят правду через день: один день правду, на следующий день ложь, затем снова правду и так далее. Фамилии Андрея, Барбары и Цецилии - Малый, Большой и Длинный в некотором порядке. В понедельник Андрей сказал: «Барбара сейчас не говорит правду»; Барбара: «Я не правдивец»; Цецилия: «Среди нас есть правдивец». Во вторник Андрей сказал: «Цецилия вчера сказала правду»; Барбара: «Фамилия Андрея - либо Большой, либо Малый»; Цецилия: «Фамилия Барбары не Малый». Определите фамилии всех троих.", "source_ids": ["src-komal-2016-k517"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-alternator-day-links", "title": "Высказывание одного дня фиксирует режим следующего дня", "text": "Если участник не правдивец, то истинность его высказываний в понедельник и вторник противоположна. Поэтому, установив истинность одной реплики, можно перенести информацию на следующий день и затем использовать ее для фамилий.", "standard_idea_ids": ["knowledge_elimination"], "status": "ai_checked"}],
  "strategies": [{"id": "str-identify-types-then-surnames", "title": "Сначала определить типы, затем прочитать фамилии", "text": "Барбара не может быть правдивцем: ее фраза «я не правдивец» была бы ложной. Значит в понедельник она сказала правду как чередующий житель. Тогда фраза Андрея в понедельник ложна, и Андрей тоже не правдивец. Во вторник Андрей должен говорить правду, откуда Цецилия действительно сказала правду в понедельник; следовательно, правдивец среди троих есть, и им является Цецилия. Барбара во вторник лжет, поэтому фамилия Андрея не Большой и не Малый, то есть Длинный. Цецилия во вторник говорит правду, значит фамилия Барбары не Малый; ей остается Большой, а Цецилии - Малый.", "standard_idea_ids": ["knowledge_elimination"], "status": "ai_checked", "definition_ids": ["state_space"]}],
