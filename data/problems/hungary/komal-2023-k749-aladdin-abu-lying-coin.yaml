  "statements": {"original": [{"id": "stmt-komal-2023-k749", "title": "Пять монет и три вопроса с условной ложью", "text": "Аладдин нашел в коробке пять монет, одна из них фальшивая. Только Абу знает, какая именно. За один вопрос Аладдин выбирает три монеты и одну из них дает Абу; после этого Абу говорит, есть ли фальшивая монета среди двух остальных выбранных монет. Если Абу получил настоящую монету, он говорит правду, а если получил фальшивую, то лжет. Можно ли определить фальшивую монету не более чем за три вопроса?", "source_ids": ["src-komal-2023-k749"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-give-certified-real-coin", "title": "Первый ответ создает пару заведомо настоящих монет", "text": "Если первый ответ «есть», то две монеты, не участвовавшие в проверяемой паре и не данные Абу, точно настоящие. Если первый ответ «нет», то монета у Абу и обе проверяемые монеты настоящие. После этого можно задавать обычные правдивые вопросы, отдавая Абу уже сертифицированную настоящую монету.", "standard_idea_ids": ["truth_liar_normalization"], "status": "ai_checked"}],
  "strategies": [{"id": "str-three-questions-certified-truth", "title": "Разветвить первый ответ и дальше спрашивать с настоящей монетой у Абу", "text": "В первом вопросе дадим Абу монету \\(A\\), а спрашивать будем про \\(B,C\\); монеты \\(D,E\\) остаются вне вопроса. Если Абу ответил «есть», то \\(D,E\\) настоящие: либо \\(B\\) или \\(C\\) фальшива, либо фальшива \\(A\\) и Абу лжет. Во втором вопросе даем Абу \\(D\\) и снова спрашиваем про \\(B,C\\). Ответ «нет» означает, что фальшива \\(A\\); ответ «есть» оставляет \\(B,C\\), и третьим вопросом с настоящей монетой у Абу различаем их.\n\nЕсли первый ответ «нет», то \\(A,B,C\\) настоящие: если бы \\(A\\) была фальшивой, Абу солгал бы и сказал «есть». Значит фальшивая среди \\(D,E\\). Во втором вопросе даем Абу \\(A\\) и спрашиваем про \\(B,E\\): ответ «есть» указывает на \\(E\\), ответ «нет» - на \\(D\\).", "standard_idea_ids": ["truth_liar_normalization", "partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
