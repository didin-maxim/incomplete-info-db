  "statements": {"original": [{"id": "stmt-komal-2011-a542", "title": "Цифровые взвешивания как да/нет тесты", "text": "Есть 1000 монет, из них 100 фальшивые. Вес настоящей монеты известен, а фальшивые легче настоящих, но могут иметь разные веса. За один тест можно взвесить любой набор монет; по результату становится известно, есть ли в этом наборе хотя бы одна фальшивая монета. Какое число тестов необходимо и достаточно, чтобы наверняка найти одну фальшивую монету?", "source_ids": ["src-komal-2011-a542"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space", "decision_tree"]}]},
  "ideas": [{"id": "idea-output-coin-set-size", "title": "Нижняя оценка считает не варианты, а возможные ответы алгоритма", "text": "После девяти да/нет тестов существует не более \\(2^9=512\\) разных цепочек ответов, значит алгоритм может указать не более 512 разных монет. Если все 100 фальшивых лежат среди остальных 488 монет, такой алгоритм обязательно ошибется.", "standard_idea_ids": ["decision_tree_lower_bound"], "status": "ai_checked"}],
  "strategies": [{"id": "str-halving-until-one-fake", "title": "Десять раз делить множество кандидатов примерно пополам", "text": "Храним набор, в котором гарантированно есть фальшивая монета. Сначала это все 1000 монет. Взвешиваем примерно половину текущего набора: если по результату теста внутри есть фальшивая, продолжаем с этой половиной; иначе продолжаем с дополнением, где фальшивая тоже гарантированно есть. После десяти двоичных шагов остается одна монета, и она фальшивая. Оптимальность следует из оценки \\(2^9<1000-100\\): за девять тестов алгоритм не может указать достаточно много разных монет.", "standard_idea_ids": ["binary_encoding", "decision_tree_lower_bound"], "status": "ai_checked", "definition_ids": ["decision_tree"]}],
  "impossibility_proofs": [{"id": "lb-nine-tests-not-enough", "title": "Девять тестов не покрывают все возможные ответы", "text": "Зафиксируем все случайные выборы алгоритма, если они есть. Каждый запуск кодируется строкой из девяти ответов да/нет, поэтому алгоритм может закончить указанием не более 512 монет. Остается как минимум 488 монет, которые алгоритм никогда не указывает; можно выбрать все 100 фальшивых среди них, и тогда ответ алгоритма будет настоящей монетой.", "standard_idea_ids": ["decision_tree_lower_bound"], "status": "ai_checked", "definition_ids": ["information_lower_bound"]}],
