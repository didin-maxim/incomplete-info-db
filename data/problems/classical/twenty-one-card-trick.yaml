      "title": "Трижды собрать выбранный столбец посередине",
      "text": "Разложим 21 карту в три столбца по 7 карт, например по одной карте в первый, второй, третий столбец и снова по кругу. Зритель указывает столбец с выбранной картой. Собираем карты так, чтобы этот столбец оказался между двумя другими стопками.\n\nПосле первого сбора выбранная карта находится среди позиций 8-14 в колоде. Снова раскладываем колоду в три столбца по 7 и снова кладем указанный столбец в середину. Поскольку раскладка распределяет подряд идущие возможные позиции по трем столбцам, второй ответ сужает возможные позиции до трех центральных мест. После третьего такого же шага возможная позиция становится единственной: выбранная карта оказывается на 11-й позиции в колоде.\n\nФокусник после третьего сбора отсчитывает 11-ю карту и называет ее. Стратегия работает потому, что каждый ответ дает один из трех вариантов, а три ответа различают до \\(3^3=27\\) случаев; 21 карта среди них помещается.",
