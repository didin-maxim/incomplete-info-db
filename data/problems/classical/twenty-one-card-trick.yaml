        "title": "c столбцов и r раундов",
        "text": "Зритель выбирает одну карту из набора из \\(N\\) карт. Фокусник проводит \\(r\\) раундов: в каждом раунде он может разложить карты в \\(c\\) столбцов, спросить, в каком столбце лежит выбранная карта, и затем снова собрать карты в выбранном им порядке. При каких \\(N\\), \\(c\\) и \\(r\\) можно заранее договориться о раскладках и сборах так, чтобы после \\(r\\) ответов фокусник всегда называл выбранную карту? Отдельно проверьте случай \\(N=21\\), \\(c=3\\), \\(r=3\\).",
