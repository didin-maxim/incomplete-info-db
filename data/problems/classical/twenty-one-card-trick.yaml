        "title": "c столбцов и r раундов",
        "text": "Тот же прием работает с любым числом столбцов: если раскладывать карты в \\(c\\) столбцов и после каждого ответа собирать указанный столбец в заранее выбранную центральную позицию, то \\(r\\) ответов различают до \\(c^r\\) возможных карт. Классическое число 21 - удобный частный случай при \\(c=3\\), \\(r=3\\): три ответа могут различить до 27 карт, так что есть небольшой запас.",
