        "text": "Из 21 карты зритель мысленно выбирает одну. Фокусник три раза раскладывает карты в три столбца по 7 карт и каждый раз спрашивает, в каком столбце лежит выбранная карта. После трех ответов фокусник называет карту. Опишите стратегию.",
