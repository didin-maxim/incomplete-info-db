        "title": "Нужно гарантированно узнать, что все побывали в комнате",
        "text": "Сто заключенных заранее договариваются о стратегии. Затем их по одному в произвольном порядке вызывают в комнату с лампочкой, которую можно включать и выключать. Заключенный видит только текущее состояние лампочки и может изменить его. В какой-то момент один заключенный должен заявить, что все заключенные уже побывали в комнате; если заявление верно, всех освобождают. Найдите стратегию, гарантирующую верное заявление, если каждый заключенный будет вызываться бесконечно много раз.",
