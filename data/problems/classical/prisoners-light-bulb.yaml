      "id": "str-designated-counter",
      "title": "Назначенный счетчик и одно включение",
      "text": "Перед началом выбирают одного заключенного счетчиком. Все остальные запоминают личный флаг: посылал ли он уже свой сигнал. Для определенности договоримся, что если несчетчик входит и видит лампочку выключенной, а свой сигнал он еще не посылал, он включает лампочку и считает свой сигнал отправленным. Во всех остальных случаях несчетчик ничего существенного не делает.\n\nСчетчик при каждом входе смотрит на лампочку. Если она включена, он выключает ее и увеличивает свой счет на 1; если выключена, ничего не меняет. Каждый несчетчик может увеличить счет не более одного раза, потому что после первого включения больше не посылает сигнал. Каждый несчетчик рано или поздно попадет в комнату при выключенной лампочке: счетчик вызывается бесконечно много раз и будет выключать лампочку после каждого сигнала. Поэтому все 99 несчетчиков со временем пошлют по одному сигналу.\n\nКогда счетчик насчитает 99 включений, он знает, что каждый из остальных 99 заключенных уже побывал в комнате. Сам счетчик тоже побывал, раз он ведет счет. Поэтому заявление в этот момент верно.",
