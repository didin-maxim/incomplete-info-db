        "title": "Первый передает четность",
        "text": "Заключенным надевают черные или белые колпаки и ставят в ряд. Каждый видит колпаки всех стоящих перед ним, но не свой и не колпаки позади. Начиная с последнего в ряду, каждый по очереди вслух называет цвет своего колпака. Заранее можно договориться о стратегии. Как гарантировать, что все, кроме возможно первого отвечающего, назовут свой цвет правильно?",
