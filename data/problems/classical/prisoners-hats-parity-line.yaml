    {
      "id": "str-parity-protocol",
      "title": "Сохранение четности черных колпаков",
      "text": "Договоримся: последний в ряду, который видит все колпаки перед собой, говорит \"черный\", если среди видимых им колпаков нечетное число черных, и \"белый\", если четное. Его собственный ответ может оказаться неверным, но он передает всем остальным четность числа черных колпаков среди них.\n\nСледующий заключенный видит все колпаки перед собой и слышит четность, объявленную первым. Он сравнивает эту четность с числом черных колпаков, которые сам видит. Если четность уже совпадает, его собственный колпак белый; если отличается, черный. После его ответа все следующие знают и цвет его колпака, и исходную четность.\n\nДалее каждый заключенный поддерживает тот же расчет: из исходной четности вычитает по модулю 2 уже названные черные колпаки позади себя и видимые черные колпаки впереди. Оставшаяся разница однозначно определяет цвет его собственного колпака. Поэтому все после первого отвечают правильно.",
      "standard_idea_ids": ["parity_encoding"],
      "status": "ai_checked",
      "definition_ids": ["state_space"]
    }
  ],
