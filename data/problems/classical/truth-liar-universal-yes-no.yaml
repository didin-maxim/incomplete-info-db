        "title": "Как узнать истинность любого утверждения",
        "text": "Собеседник либо всегда говорит правду, либо всегда лжет; какой это тип, неизвестно. Требуется одним вопросом с ответом \"да\" или \"нет\" узнать истинность заданного утверждения \\(P\\). Постройте вопрос, работающий для обоих типов собеседника.",
