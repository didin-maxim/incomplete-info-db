      "id": "idea-double-negation",
      "title": "Спросить о собственном ответе",
      "text": "Вопрос вида \"Вы бы ответили да на вопрос P?\" заставляет правдивого дать прямую истину, а лжеца солгать о своей будущей лжи, что снова дает прямую истину.",
      "standard_idea_ids": ["truth_liar_normalization"],
