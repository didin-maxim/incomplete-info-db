    }
  ],
  "strategies": [
    {
      "id": "str-would-you-say-yes",
      "title": "Вопрос \"Вы бы сказали да?\"",
      "text": "Зададим вопрос: \"Если бы я спросил вас, верно ли \\(P\\), вы бы ответили да?\"\n\nЕсли собеседник правдивый, то на внутренний вопрос он ответил бы \"да\" ровно тогда, когда \\(P\\) истинно; на внешний вопрос он также отвечает правдиво. Поэтому его ответ \"да\" эквивалентен истинности \\(P\\).\n\nЕсли собеседник лжец, то на внутренний прямой вопрос о \\(P\\) он ответил бы \"да\" ровно тогда, когда \\(P\\) ложно. Истинный ответ на внешний вопрос \"вы бы ответили да?\" тогда был бы \"да\" при ложном \\(P\\) и \"нет\" при истинном \\(P\\). Но лжец искажает внешний ответ, поэтому фактически говорит \"да\" ровно при истинном \\(P\\). В обоих случаях ответ \"да\" означает, что \\(P\\) истинно, а \"нет\" - что ложно.",
      "standard_idea_ids": ["truth_liar_normalization"],
