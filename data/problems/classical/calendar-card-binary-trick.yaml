      "title": "Карточки по битам двоичной записи",
      "text": "Для \\(q\\) карточек возьмем веса \\(1,2,4,\\ldots,2^{q-1}\\). На карточку веса \\(2^j\\) напечатаем ровно те числа, у которых в двоичной записи стоит единица в соответствующем разряде. В классическом случае \\(q=5\\) это веса 1, 2, 4, 8 и 16, а числа идут от 1 до 31.\n\nКогда зритель говорит, на каких карточках есть его число, фокусник складывает веса этих карточек. Например, если число есть на карточках 1, 4 и 16, сумма равна 21, значит загадано 21. У каждого числа двоичная запись единственна, поэтому набор карточек однозначно восстанавливает число.",
