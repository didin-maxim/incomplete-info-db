        "text": "Та же конструкция работает для любого \\(q\\): \\(q\\) карточек с двоичными признаками различают все числа от 1 до \\(2^q-1\\), а при разрешении пустого набора - до \\(2^q\\) состояний. Карточка с весом \\(2^j\\) содержит ровно числа с единицей в \\(j\\)-м бите.",
