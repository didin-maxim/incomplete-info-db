      "id": "str-powers-of-two-cards",
      "title": "Карточки по битам двоичной записи",
      "text": "Сделаем пять карточек с весами 1, 2, 4, 8 и 16. На карточку веса \\(2^j\\) напечатаем ровно те числа от 1 до 31, у которых в двоичной записи стоит единица в соответствующем разряде.\n\nКогда зритель говорит, на каких карточках есть его число, фокусник складывает веса этих карточек. Например, если число есть на карточках 1, 4 и 16, сумма равна 21, значит загадано 21. У каждого числа от 1 до 31 двоичная запись единственна, поэтому набор карточек однозначно восстанавливает число.",
