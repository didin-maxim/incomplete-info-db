      "id": "str-other-guard-question",
      "title": "Спросить, какую дверь указал бы другой",
      "text": "Выберем любую из двух дверей, например левую, и спросим любого стража: \"Если бы я спросил другого стража, ведет ли левая дверь к спасению, он ответил бы да?\"\n\nРазберем два случая. Если отвечающий правдивый, он честно сообщает ответ другого стража. Другой страж лжец, поэтому на прямой вопрос о безопасной левой двери он ответил бы противоположно истине. Значит, полученный ответ противоположен истинному ответу о левой двери. Если отвечающий лжец, то другой страж правдивый и на прямой вопрос ответил бы истину; но лжец искажает это сообщение, поэтому мы снова слышим противоположность истины.\n\nСледовательно, ответ \"да\" означает, что левая дверь не ведет к спасению, и надо выбрать правую. Ответ \"нет\" означает, что левая дверь безопасна.",
