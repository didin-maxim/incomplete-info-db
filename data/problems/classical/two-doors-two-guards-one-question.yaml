        "title": "Один всегда лжет, другой всегда говорит правду",
        "text": "Перед вами две двери: за одной спасение, за другой опасность. Рядом два стража: один всегда говорит правду, другой всегда лжет, но неизвестно, кто есть кто. Можно задать один вопрос одному стражу, на который он ответит \"да\" или \"нет\". Как выбрать безопасную дверь?",
