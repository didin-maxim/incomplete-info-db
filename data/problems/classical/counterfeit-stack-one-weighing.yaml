        "text": "Есть 10 стопок монет. В одной стопке все монеты фальшивые и каждая весит на 1 грамм меньше настоящей; в остальных стопках монеты настоящие. Есть весы, показывающие общий вес выбранных монет числом. Как одним взвешиванием определить фальшивую стопку?",
