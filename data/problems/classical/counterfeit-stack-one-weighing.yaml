        "text": "Есть 10 одинаковых открытых коробок, в каждой по 10 внешне одинаковых монет. В девяти коробках каждая монета весит 10 г, а в одной коробке каждая монета весит 9 г. Имеются обычные весы с одной чашей и числовым показанием массы. Как за одно взвешивание определить коробку с легкими монетами?",
