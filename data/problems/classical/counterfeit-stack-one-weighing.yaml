      "id": "str-take-index-many-coins",
      "title": "Взять из i-й стопки i монет",
      "text": "Занумеруем стопки от 1 до 10. Из первой стопки возьмем 1 монету, из второй 2 монеты, ..., из десятой 10 монет и положим все выбранные монеты на числовые весы.\n\nЕсли бы все монеты были настоящими, вес был бы заранее известен: вес одной настоящей монеты, умноженный на \\(1+2+\\cdots+10=55\\). На самом деле фальшивые монеты легче на 1 грамм каждая. Поэтому если фальшива \\(i\\)-я стопка, общий вес будет меньше ожидаемого ровно на \\(i\\) граммов. Из величины недостачи сразу читается номер фальшивой стопки.",
