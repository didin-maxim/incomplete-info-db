  "strategies": [
    {
      "id": "str-three-level-ternary-search",
      "title": "Поиск по 25 монетам делением на три",
      "text": "Общий алгоритм такой же, как троичный поиск: если осталось не больше \\(3^t\\) кандидатов и есть \\(t\\) взвешиваний, делим кандидатов на три группы размеров не больше \\(3^{t-1}\\), две равные группы взвешиваем, а по легкой чаше или равновесию выбираем одну из трех групп.\n\nДля 25 монет разделим их на группы 9, 9 и 7. Взвесим первые 9 против вторых 9. Если одна чаша легче, фальшивая монета находится в этой девятке; если равновесие, она среди оставшихся 7.\n\nКогда после первого шага осталось не больше 9 кандидатов, разделим их на группы 3, 3 и не более 3. Взвесим первые 3 против вторых 3. Легкая чаша указывает нужную тройку; равновесие указывает третью группу, причем если в ней меньше трех монет, кандидатов еще меньше.\n\nПосле второго шага осталось не больше 3 кандидатов. Третьим взвешиванием сравним две из этих монет. Если одна легче, она фальшивая. Если они равны, фальшивая - третий кандидат; если кандидатов было только два, равновесие невозможно при условии задачи. Так три взвешивания всегда находят легкую монету.",
      "standard_idea_ids": ["ternary_weighing_code"],
      "status": "ai_checked",
      "definition_ids": ["balance_scale"]
    }
