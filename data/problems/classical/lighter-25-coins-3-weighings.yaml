      "id": "idea-split-into-three-parts",
      "title": "Каждое взвешивание выбирает одну из трех частей",
      "text": "Если фальшивая монета заведомо легче, взвешивание равных групп делит кандидатов на три класса: легкая слева, легкая справа или вне взвешивания.",
