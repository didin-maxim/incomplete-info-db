        "id": "stmt-as-n-le-3q",
        "title": "Каждое взвешивание дает три исхода",
        "text": "Даны \\(N\\) одинаковых на вид монет, ровно одна из них фальшивая и заранее известно, что она легче настоящих. За \\(q\\) взвешиваний на чашечных весах можно гарантированно найти фальшивую монету тогда и только тогда, когда \\(N\\le 3^q\\). При \\(N=25\\), \\(q=3\\) условие выполнено: \\(25\\le 3^3\\), поэтому достаточно делить кандидатов на три почти равные части.",
