        "text": "На острове живут люди, каждый видит цвет глаз всех остальных, но не знает свой цвет глаз. Обсуждать цвет глаз запрещено. Путешественник публично говорит: \"На острове есть хотя бы один человек с голубыми глазами\". Если голубоглазых ровно \\(k\\), в какой день они смогут узнать свой цвет и уйти, при условии что все рассуждают безошибочно и это является общим знанием?",
