      "title": "Индукция по числу голубоглазых",
      "text": "Если \\(k=1\\), единственный голубоглазый не видит ни одного голубоглазого. После публичного объявления он понимает, что голубые глаза должны быть у него самого, и уходит в первый день.\n\nПусть утверждение верно для всех меньших чисел. При \\(k\\) голубоглазых каждый из них видит \\(k-1\\) голубоглазых. Он допускает два варианта: либо его глаза не голубые и всего голубоглазых \\(k-1\\), либо его глаза голубые и всего их \\(k\\). Если бы первый вариант был верен, то по индукционному предположению видимые им \\(k-1\\) голубоглазых ушли бы в \\((k-1)\\)-й день. Но этого не происходит. Поэтому в \\(k\\)-й день каждый голубоглазый исключает вариант, что его глаза не голубые, и уходит. Люди с другим цветом глаз видят \\(k\\) голубоглазых и не получают такого исключения.",
