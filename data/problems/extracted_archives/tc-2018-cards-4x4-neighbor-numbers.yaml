      "title": "Открытые средние столбцы запускают восстановление",
      "text": "Если открыть второй и третий столбцы, то у каждой открытой клетки есть не более одной закрытой соседней клетки по стороне. Поэтому любой еще не найденный числовой сосед открытого числа вынужден стоять в этой единственной закрытой клетке.",
      "standard_idea_ids": ["knowledge_elimination"],
      "status": "ai_checked"
