      "id": "str-eight-middle-columns",
      "title": "Открыть два средних столбца",
      "text": "Ответ: \\(8\\). Достаточно открыть все карточки во втором и третьем столбцах. Так как соседние по значению числа лежат в соседних клетках решетки, четности чисел чередуются по шахматной раскраске; по открытым клеткам становится известна четность на каждом цвете доски. Затем для каждой открытой клетки, у которой отсутствует числовой сосед, этот сосед вынужденно лежит в единственной закрытой соседней клетке. Так восстанавливаются многие закрытые клетки; углы, в которые не ведет такое указание, не могут содержать внутренние числа \\(2,\\ldots,15\\), значит там стоит 1 или 16, и четность выбирает нужное число. Повторяя этот шаг от восстановленных углов, получаем всю таблицу.\n\nМеньше 8 открыть нельзя: разобьем 16 клеток на восемь специальных пар. Для каждой пары есть две допустимые раскладки, которые отличаются только перестановкой двух чисел в этой паре. Если ни одна клетка пары не открыта, наблюдение одинаково для обеих раскладок, поэтому все числа определить невозможно. Нужно открыть хотя бы по одной клетке из каждой пары.",
      "standard_idea_ids": ["knowledge_elimination", "indistinguishability_argument"],
      "status": "ai_checked",
      "definition_ids": ["state_space"]
    }
