      "id": "idea-eight-indistinguishable-pairs",
      "title": "Восемь пар клеток дают нижнюю оценку",
      "text": "Клетки можно разбить на восемь пар так, что для каждой пары существуют две допустимые раскладки, отличающиеся только перестановкой чисел внутри этой пары. Если из некоторой пары не открыта ни одна карточка, эти две раскладки неразличимы.",
