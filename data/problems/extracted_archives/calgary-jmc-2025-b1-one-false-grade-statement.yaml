      "id": "str-eliminate-bao-dylan-ahn",
      "title": "Исключить Васю, Колю и Петю как лжецов",
      "text": "Если бы ложным было утверждение Васи, то Вася получил бы меньше 70%, и Коля, говоря правду, тоже получил бы меньше 70%. Но среди оценок ниже 70% есть только 61%, противоречие. Значит, Вася говорит правду.\n\nЕсли бы лгал Коля, остальные трое говорили бы правду, а сам Коля получил бы не меньше 70%. Тогда все четверо получили бы оценки выше 70%, хотя одна из данных оценок равна 61%. Противоречие, значит, Коля говорит правду и получил 61%.\n\nЕсли бы лгал Петя, то при уже занятой оценке 61% он должен был бы получить 97%. Но Толя, говоря правду, тоже должен был бы получить 97%, невозможно. Поэтому Петя говорит правду, а единственная ложная фраза - фраза Толи.\n\nСледовательно, Вася получил 97%, Коля - 61%, а Петя и Толя получили 85% и 73% в любом порядке. Утверждение Толи было ложным.",
