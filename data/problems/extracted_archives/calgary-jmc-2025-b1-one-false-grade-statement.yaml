        "id": "stmt-calgary-jmc-2025-b1",
        "title": "Четыре оценки и ровно одно ложное утверждение",
        "text": "Петя, Вася, Толя и Коля получили за тест оценки 97%, 85%, 73% и 61%, но неизвестно, кто какую оценку получил. После раздачи результатов они сказали:\n\nПетя: моя оценка была между 70% и 90%.\nВася: моя оценка была выше 70%.\nТоля: моя оценка была выше 90%.\nКоля: моя оценка была ниже 70%.\n\nИзвестно, что ровно одно из этих утверждений ложно, а остальные три истинны. Найдите все возможные оценки каждого ученика и определите, чье утверждение было ложным.",
