        "id": "stmt-mmo-2024-symposium",
        "title": "Ответы о знакомстве",
        "text": "На совместный симпозиум лжецов, которые всегда лгут, и рыцарей, которые всегда говорят правду, собрались 100 участников, среди которых не все лжецы и не все рыцари. Каждые два участника либо знакомы, либо незнакомы друг с другом. Каждый ответил \"да\" или \"нет\" на вопрос \"Знакомы ли вы?\" про каждого из остальных. Какое наименьшее количество ответов \"да\" могло быть получено?",
        "source_ids": ["src-mmo-2024-25-tasks-11-tur1-final", "src-mmo-2024-25-sol-11-tur1-final", "src-problems-ru-67459"],
        "status": "ai_checked",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["state_space"]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-mixed-pair-one-yes",
      "title": "Смешанная пара всегда дает один ответ \"да\"",
      "text": "Если один участник пары рыцарь, а другой лжец, то независимо от того, знакомы они или нет, из двух ответов ровно один будет \"да\". Пары одного типа дают 0 или 2 ответа \"да\", поэтому минимум определяется числом смешанных пар.",
      "standard_idea_ids": ["knowledge_elimination"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-count-mixed-pairs",
      "title": "Свести к размеру разреза между типами",
      "text": "Пусть лжецов \\(n\\), тогда рыцарей \\(100-n\\), причем \\(1\\le n\\le 99\\). Каждая смешанная пара лжец-рыцарь дает ровно один положительный ответ, значит уже есть не меньше \\(n(100-n)\\) ответов \"да\". Пары одного типа не уменьшают это число: два рыцаря дают либо два \"да\" при знакомстве, либо ноль при незнакомстве; два лжеца наоборот дают ноль при знакомстве и два при незнакомстве. Минимум \\(n(100-n)\\) на отрезке \\(1\\le n\\le 99\\) равен 99.\n\nОценка достижима: возьмем 99 лжецов и одного рыцаря и сделаем всех попарно знакомыми. Рыцарь ответит \"да\" про всех 99 лжецов, а каждый лжец на все вопросы ответит \"нет\". Итого ровно 99 положительных ответов.",
      "standard_idea_ids": ["knowledge_elimination"],
      "status": "ai_checked",
      "definition_ids": ["state_space"]
    }
  ],
