        "title": "Найти спрятанное сокровище по ответам Звонко, Горячо, Холодно",
        "text": "Хида прячет сокровище в одной клетке ряда. На каждом ходе Сика выбирает клетку. Если выбрана клетка с сокровищем, Хида отвечает «Звонко!» и игра заканчивается. Если выбрана соседняя с сокровищем клетка, Хида отвечает «Горячо!». Если выбранная клетка не является ни клеткой с сокровищем, ни соседней с ней, Хида отвечает «Холодно!». Докажите, что в ряду из 3 клеток Сика может найти сокровище не более чем за 2 хода, а в ряду из 9 клеток - не более чем за 4 хода.",
