      "id": "str-three-and-nine-squares",
      "title": "Сначала центр, затем маленькие блоки",
      "text": "Для трех клеток пронумеруем их 1, 2, 3. Сика сначала выбирает клетку 1. При «Звонко» все найдено; при «Горячо» сокровище в клетке 2; при «Холодно» - в клетке 3. Значит, второй ход всегда завершает поиск.\n\nДля девяти клеток пронумеруем их 1-9. Сика сначала выбирает клетку 5. При «Звонко» все найдено. При «Горячо» сокровище в 4 или 6, и эти две клетки можно проверить следующими двумя ходами. При «Холодно» остаются клетки 1, 2, 3, 7, 8, 9. Вторым ходом Сика выбирает клетку 2. Если ответ «Звонко», поиск закончен; если «Горячо», остаются 1 и 3, и их можно проверить двумя оставшимися ходами; если «Холодно», сокровище в блоке 7, 8, 9, а для трех клеток уже есть стратегия за два хода. Итого во всех случаях достаточно 4 ходов.",
