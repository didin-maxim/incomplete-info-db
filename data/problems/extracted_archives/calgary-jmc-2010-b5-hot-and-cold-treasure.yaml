        "id": "stmt-calgary-jmc-2010-b5",
        "title": "Найти спрятанное сокровище по ответам Ding, Hot, Cold",
        "text": "Хида прячет сокровище в одной клетке ряда. На каждом ходе Сика выбирает клетку. Если выбрана клетка с сокровищем, Хида отвечает «Ding!» и игра заканчивается. Если выбрана соседняя с сокровищем клетка, Хида отвечает «Hot!». Если выбранная клетка не является ни клеткой с сокровищем, ни соседней к ней, Хида отвечает «Cold!». Докажите, что на ряду из 3 клеток Сика может найти сокровище не более чем за 2 хода, а на ряду из 9 клеток - не более чем за 4 хода.",
