        "title": "Минимум попыток для пароля из букв A-E",
        "text": "Замок требует ввести пароль из 10 букв, каждая буква - одна из A, B, C, D, E. После каждой попытки компьютер сообщает, какие именно позиции, если такие есть, угаданы верно. Например, если пароль ABCDEABCDE, а попытка AABBDDCCEE, компьютер скажет, что верны 1-я, 8-я и 10-я буквы. Какое минимальное число попыток гарантирует открытие замка?",
