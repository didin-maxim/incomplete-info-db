        "id": "stmt-kvantland-mudretsy-card-players",
        "title": "У кого был туз?",
        "text": "Трём мудрецам показали 9 карт: шестёрку, семёрку, восьмёрку, девятку, десятку, валета, даму, короля и туза, перечисленные по возрастанию достоинства. Затем карты перемешали и каждому раздали по три карты. Каждый мудрец видит только свои карты. Первый сказал: «Моя старшая карта - валет». Тогда второй ответил: «Я знаю, какие карты у каждого из вас». У кого из мудрецов был туз?",
