      "id": "str-ace-with-third-wise-man",
      "title": "Туз вынужден быть у третьего",
      "text": "Слова первого оставляют ему валета и две карты из пяти младших: 6, 7, 8, 9, 10. Если бы у второго не было всех трёх оставшихся младших карт, то по его собственным картам оставались бы по крайней мере два варианта для пары младших карт первого, и второй не мог бы заявить, что знает весь расклад.\n\nЗначит, второй держит три карты из набора 6, 7, 8, 9, 10, которых нет у первого. Тогда все старшие карты дама, король и туз не могут быть ни у первого, ни у второго; они лежат у третьего мудреца. Поэтому туз был у третьего.",
