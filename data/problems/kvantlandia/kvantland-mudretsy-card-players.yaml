      "id": "idea-second-must-hold-remaining-low-cards",
      "title": "Второй узнаёт расклад только по трём оставшимся младшим картам",
      "text": "После слов первого известно, что у него валет и две карты из набора 6, 7, 8, 9, 10. Чтобы второй мог однозначно восстановить эти две младшие карты, он сам должен видеть ровно три остальные карты из этого набора.",
