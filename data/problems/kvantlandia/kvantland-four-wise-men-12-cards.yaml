  "strategies": [
    {
      "id": "str-a-has-1-8-9",
      "title": "Перебор совместимых троек вынуждает 1, 8, 9",
      "text": "Простые числа среди 1..12: 2, 3, 5, 7, 11; составные: 4, 6, 8, 9, 10, 12. Так как у A есть 8, число 8 не может быть у C. После первых трёх фраз возможные тройки C с общим простым делителем - это тройки из 4, 6, 10, 12, делящиеся на 2, и тройка 6, 9, 12, делящаяся на 3; B получает любые три оставшиеся простые числа.\n\nТеперь учитываем фразу D. Проверка этих конечных вариантов показывает: если D действительно может по своим картам однозначно восстановить всю раздачу, то у D две простые карточки и одна из карточек 6 или 12; у C соответственно либо 4, 6, 10, либо 4, 10, 12, а у B - три оставшиеся простые карточки. Во всех таких единственных для D раздачах карточки A равны 1, 8 и 9. Поэтому у A были карточки 1, 8, 9.",
