      "id": "idea-d-uniqueness-filters-deals",
      "title": "Фраза D означает единственность расклада для его трёх карт",
      "text": "Первые три фразы задают конечный список возможных раздач. Утверждение D оставляет только такие тройки карт D, при которых среди всех совместимых раздач ровно одна имеет эти карты у D.",
