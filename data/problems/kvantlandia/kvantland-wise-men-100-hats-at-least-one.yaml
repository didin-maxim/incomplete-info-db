      "text": "Занумеруем цвета числами \\(0,1,\\ldots,n-1\\) по модулю \\(n\\). Выберем \\(n\\) мудрецов и закрепим за ними разные целевые остатки \\(0,1,\\ldots,n-1\\); оставшиеся мудрецы при \\(n<100\\) могут отвечать произвольно.\n\nМудрец с целевым остатком \\(r\\) видит сумму номеров чужих колпаков \\(S\\) и записывает цвет с номером \\(r-S\\pmod n\\). Если настоящая полная сумма всех 100 цветов равна \\(R\\pmod n\\), то мудрец, за которым закреплен остаток \\(R\\), запишет ровно свой настоящий цвет. Поэтому хотя бы один мудрец гарантированно угадывает. В частности, это работает при \\(n=100\\).",
