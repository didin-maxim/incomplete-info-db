        "text": "Есть 100 мудрецов и неограниченный запас колпаков каждого из \\(n\\) различных цветов, где \\(n\\le 100\\) и число \\(n\\) известно мудрецам. Мудрецы одновременно закрывают глаза, и каждому надевают на голову колпак одного из этих цветов. Затем мудрецы открывают глаза: каждый видит цвета колпаков остальных, но не видит свой. После этого каждый мудрец записывает свою догадку о цвете собственного колпака, не сообщая ее остальным. При каком наибольшем \\(n\\) мудрецы могут заранее договориться так, чтобы при любой раскраске хотя бы один из них угадал цвет своего колпака?",
