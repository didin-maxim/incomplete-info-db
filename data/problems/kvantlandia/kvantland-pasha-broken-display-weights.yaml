        "id": "stmt-kvantland-pasha-broken-display-weights",
        "title": "Экран показывает только число цифр",
        "text": "У Паши есть 5 грузов, которые весят 1, 2, 3, 4 и 5 граммов. Паша это знает, но с виду грузы одинаковы. Есть электронные весы: если на них поставить один или несколько грузов, они покажут их суммарный вес. У весов сломался экран, поэтому вместо любой цифры они показывают «?». Например, число 6 эти весы покажут как один вопросительный знак, а число 2025 - как четыре вопросительных знака. Веса каких из этих 5 грузов можно однозначно восстановить, пользуясь только этими электронными весами? Можно делать сколько угодно взвешиваний.",
        "source_ids": ["src-kvantland-telegram-broken-display-weights", "src-kvantik-contest-2025-round-10"],
        "status": "source_verified",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["state_space"]
      }
    ]
  },
  "ideas": [
