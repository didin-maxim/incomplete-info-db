      "id": "idea-threshold-pair-graph",
      "title": "Экран даёт только порог: сумма не меньше 10 или меньше 10",
      "text": "Сумма всех грузов равна 15, поэтому у любого непустого набора экран показывает один или два вопросительных знака. Взвешивая дополнения к парам, можно узнать, у каких пар сумма не превосходит 5.",
      "standard_idea_ids": ["numeric_signature_decoding", "knowledge_elimination"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-recover-1-4-5",
      "title": "Восстановить грузы 1, 4 и 5 граммов",
      "text": "Для каждой пары грузов взвесим три оставшихся груза. Так как общая масса равна 15, результат «??» означает, что масса трёх оставшихся не меньше 10, то есть масса проверяемой пары не больше 5; результат «?» означает, что пара весит больше 5.\n\nПостроим граф: соединим два груза, если их пара весит не больше 5. Для настоящих весов 1,2,3,4,5 степени вершин равны соответственно 3,2,2,1,0: груз 1 г соединён с 2, 3 и 4; груз 4 г соединён только с 1; груз 5 г не соединён ни с кем. Поэтому можно однозначно найти грузы массой 1, 4 и 5 граммов. Два оставшихся груза имеют веса 2 и 3 грамма, но какой из них какой, такими весами не различить.",
      "standard_idea_ids": ["numeric_signature_decoding", "knowledge_elimination"],
      "status": "ai_checked",
      "definition_ids": ["state_space"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-two-and-three-indistinguishable",
      "title": "Грузы 2 и 3 грамма не различаются",
      "text": "Пусть два оставшихся после определения грузов имеют массы 2 и 3. Рассмотрим любой набор грузов. Если он содержит оба эти груза или не содержит ни одного, обмен 2 и 3 не меняет сумму. Если он содержит ровно один из них, сумма меняется на 1. Чтобы показание экрана изменилось, сумма должна перейти через границу между однозначным и двузначным числом, то есть между 9 и 10. Но вклад остальных грузов из множества 1,4,5 может быть только 0, 1, 4, 5, 6, 9 или 10; при добавлении 2 или 3 граница 9/10 не пересекается. Поэтому все возможные взвешивания дают один и тот же набор вопросительных знаков после обмена грузов 2 и 3.",
