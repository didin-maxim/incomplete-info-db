        "id": "stmt-kvantland-detective-70",
        "title": "Приглашать группы подозреваемых",
        "text": "Детектив расследует преступление. В деле замешаны 70 человек, среди которых один - преступник, ещё один - свидетель преступления, но неизвестно, кто это. Каждый день детектив может пригласить к себе одного или нескольких из этих 70 человек, и если среди приглашённых есть свидетель, но нет преступника, то свидетель сообщит, кто преступник. За какое наименьшее число дней детектив может заведомо раскрыть дело?",
        "source_ids": ["src-kvantland-telegram-detective-70", "src-problems-ru-66096"],
        "status": "source_verified",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["state_space", "strategy"]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-antichain-codes",
      "title": "Люди должны получить попарно несравнимые коды дней",
      "text": "Если человеку сопоставить множество дней, когда его приглашают, то для любой упорядоченной пары свидетель-преступник нужен день, входящий в код свидетеля и не входящий в код преступника. Поэтому коды любых двух людей не должны содержаться один в другом.",
      "standard_idea_ids": ["binary_encoding", "counting_bound"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-eight-days-weight-four",
      "title": "Восемь дней и 70 четырёхэлементных кодов",
      "text": "Ответ: 8 дней. Сопоставим 70 людям все \\(\\binom84=70\\) четырёхэлементные подмножества множества дней \\(1,2,\\ldots,8\\). В день \\(i\\) пригласим всех людей, в чьём коде есть \\(i\\).\n\nПусть настоящий свидетель - W, а преступник - C. Их коды различны, но имеют одинаковый размер 4. Значит, есть день, который входит в код W и не входит в код C. В этот день свидетель приглашён, преступник не приглашён, и свидетель сообщает детективу преступника.",
      "standard_idea_ids": ["binary_encoding"],
      "status": "ai_checked",
      "definition_ids": ["strategy"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-sperner-seven-days",
      "title": "Семи дней мало по теореме Шпернера",
      "text": "Пусть есть стратегия на \\(d\\) дней. Каждому человеку сопоставим множество дней, когда его приглашают. Для любых двух людей X и Y должно существовать и приглашение X без Y, и приглашение Y без X, потому что каждый из них может оказаться свидетелем при другом преступнике. Значит, эти множества образуют антицепь: ни одно не содержится в другом.\n\nПо теореме Шпернера максимальный размер антицепи в булевом кубе размерности \\(d\\) равен \\(\\binom d{\\lfloor d/2\\rfloor}\\). При \\(d=7\\) это \\(\\binom73=35<70\\), поэтому семи дней недостаточно. При \\(d=8\\) конструкция выше достигает ровно 70 человек.",
      "standard_idea_ids": ["counting_bound", "pigeonhole_principle"],
      "status": "ai_checked",
      "definition_ids": ["information_lower_bound"]
    }
  ],
