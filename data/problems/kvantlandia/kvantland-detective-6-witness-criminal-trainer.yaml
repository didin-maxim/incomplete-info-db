      "title": "Четыре дня и шесть двухэлементных кодов",
      "text": "Ответ: 4 дня. Сопоставим шести людям все \\(\\binom42=6\\) двухэлементные подмножества множества дней \\(1,2,3,4\\). В день \\(i\\) пригласим всех людей, в чьем коде есть \\(i\\).\n\nПусть настоящий свидетель - W, а преступник - C. Их коды различны, но имеют одинаковый размер 2. Поэтому есть день, который входит в код W и не входит в код C. В этот день свидетель приглашен, преступник не приглашен, и свидетель сообщает детективу преступника.",
      "standard_idea_ids": ["binary_encoding"],
