      "id": "lb-three-days-only-three-antichain",
      "title": "Трех дней мало по теореме Шпернера",
      "text": "Если стратегия занимает \\(d\\) дней, коды всех людей должны образовывать антицепь в булевом кубе размерности \\(d\\). По теореме Шпернера максимальный размер такой антицепи равен \\(\\binom d{\\lfloor d/2\\rfloor}\\). При \\(d=3\\) это \\(\\binom31=3<6\\), поэтому трех дней недостаточно. При \\(d=4\\) конструкция из всех двухэлементных кодов дает ровно 6 людей.",
