        "id": "stmt-kvantland-paid-questions-55",
        "title": "Заплатить за «да» дороже, чем за «нет»",
        "text": "Вася загадал натуральное число от 1 до 55. Петя может указать любой набор чисел и спросить, есть ли загаданное число в этом наборе. Вася всегда отвечает только правду, но за ответ «да» Петя должен заплатить 2 рубля, а за ответ «нет» - 1 рубль. Какая наименьшая сумма денег необходима Пете, чтобы наверняка угадать число?",
        "source_ids": ["src-kvantland-telegram-paid-questions-55"],
        "status": "source_verified",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["decision_tree", "strategy"]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-fibonacci-capacity",
      "title": "Неравные цены ветвей дают числа Фибоначчи",
      "text": "Если осталось \\(B\\) рублей бюджета, то после вопроса ветвь «нет» может обслужить случаи с бюджетом \\(B-1\\), а ветвь «да» - случаи с бюджетом \\(B-2\\). Поэтому максимальное число различимых состояний удовлетворяет рекурсии Фибоначчи.",
      "standard_idea_ids": ["decision_tree_lower_bound", "partition_state_space"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-fibonacci-split-55",
      "title": "Разбивать 55 как 21 и 34",
      "text": "Пусть \\(C(B)\\) - максимальное число кандидатов, которое можно гарантированно различить, имея бюджет \\(B\\). Для \\(C(0)=1\\), \\(C(1)=1\\) и \\(B\\ge2\\) можно задать вопрос о подмножестве размера \\(C(B-2)\\). Тогда при ответе «да» остается не больше \\(C(B-2)\\) чисел и бюджет \\(B-2\\), а при ответе «нет» остается не больше \\(C(B-1)\\) чисел и бюджет \\(B-1\\). Значит \\(C(B)=C(B-1)+C(B-2)\\).\n\nПолучаем \\(C(7)=21\\), \\(C(8)=34\\), \\(C(9)=55\\). Поэтому для 55 чисел хватает 9 рублей: сначала спросить про любые 21 число. Если ответ «да», перейти к такой же оптимальной стратегии для 21 числа с бюджетом 7; если «нет», перейти к стратегии для оставшихся 34 чисел с бюджетом 8. Дальше каждый раз делить оставшиеся кандидаты по той же рекурсии.",
      "standard_idea_ids": ["partition_state_space", "decision_tree_lower_bound"],
      "status": "ai_checked",
      "definition_ids": ["decision_tree", "strategy"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-fibonacci-capacity-8",
      "title": "За 8 рублей различить 55 чисел нельзя",
      "text": "Докажем по индукции, что при бюджете \\(B\\) любая стратегия различает не больше \\(C(B)\\) чисел, где \\(C(0)=C(1)=1\\) и \\(C(B)=C(B-1)+C(B-2)\\). Первый вопрос разбивает кандидатов на две ветви: в ветви «нет» бюджет уменьшается на 1, а в ветви «да» - на 2. По индукционному предположению эти ветви содержат не больше \\(C(B-1)\\) и \\(C(B-2)\\) чисел, суммарно не больше \\(C(B)\\). Так как \\(C(8)=34<55\\), восьми рублей недостаточно.",
