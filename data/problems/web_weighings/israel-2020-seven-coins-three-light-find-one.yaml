  "strategies": [
    {
      "id": "str-two-weighings-certify-one",
      "title": "Сравнить две пары, затем одну подходящую пару монет",
      "text": "Занумеруем монеты от 1 до 7. Сначала сравним пары \\(1,2\\) и \\(3,4\\).\n\nЕсли левая пара легче, то среди монет 1 и 2 фальшивых больше, чем среди 3 и 4. Вторым взвешиванием сравним 1 и 2. Если одна из них легче, она фальшивая. Если они равны, то 1 и 2 имеют одинаковый тип; так как в первой паре фальшивых больше, чем во второй, обе монеты 1 и 2 фальшивые, и можно назвать любую из них.\n\nЕсли правая пара легче, сравним 1 и 3. В этой ветви вариант «1 легче 3» невозможен. Если 3 легче 1, то 3 фальшивая. Если 1 и 3 равны, то фальшивая 4: действительно, правая пара \\(3,4\\) содержит больше фальшивых, чем \\(1,2\\), а равенство 1 и 3 оставляет единственную гарантированную монету в правой паре - монету 4.\n\nЕсли первое взвешивание дало равновесие, сравним 1 и 2. Если одна из них легче, она фальшивая. Если 1 и 2 равны, то из равенства пар \\(1,2\\) и \\(3,4\\) следует, что среди первых четырех монет фальшивых поровну в каждой паре; при равенстве 1 и 2 это возможно только когда все три фальшивые монеты находятся среди 5,6,7. Тогда можно назвать любую из монет 5,6,7.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["balance_scale", "decision_tree"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-one-weighing-not-enough",
      "title": "Одного взвешивания недостаточно",
      "text": "В стандартной модели чашечных весов сравнивают одинаковые по числу наборы монет. Если одним взвешиванием сравнить одну монету с одной, то исход равновесия не сертифицирует ни одну монету: обе сравниваемые монеты могут быть настоящими, а могут быть фальшивыми. Если сравнить две монеты с двумя или три с тремя, то для каждого возможного исхода остаются совместимые наборы трех фальшивых монет без общей монеты. Поэтому после одного взвешивания нельзя гарантированно назвать монету, которая фальшива во всех оставшихся вариантах.",
