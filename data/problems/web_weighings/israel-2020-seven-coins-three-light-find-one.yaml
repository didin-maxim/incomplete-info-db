        "id": "stmt-israel-seven-three",
        "title": "Три легкие фальшивые монеты",
        "text": "Даны семь одинаковых на вид монет. Из них четыре настоящие и три фальшивые. Все фальшивые монеты имеют один и тот же вес, все настоящие монеты тоже имеют один и тот же вес, причем фальшивая монета легче настоящей. За одно взвешивание можно положить на чаши одинаковое число монет и узнать, какая чаша легче, или что веса равны. Какое наименьшее число взвешиваний нужно, чтобы гарантированно найти хотя бы одну фальшивую монету?",
        "source_ids": ["src-aops-2020-israel-national-olympiad"],
