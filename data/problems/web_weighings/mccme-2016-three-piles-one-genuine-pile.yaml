  "strategies": [{"id": "str-one-comparison-certifies-a-pile", "title": "Одно сравнение 17 против 17", "text": "Обозначим кучки \\(A\\), \\(B\\), \\(C\\), где в них соответственно 17, 21 и 27 монет. Взвесим все 17 монет из \\(A\\) против любых 17 монет из \\(B\\).\n\nЕсли весы в равновесии, то кучка \\(A\\) точно настоящая. Действительно, если бы фальшивая монета лежала в \\(A\\), сравнение отличалось бы от сравнения настоящих монет; если фальшивая лежит в невыбранных четырех монетах кучки \\(B\\) или в кучке \\(C\\), кучка \\(A\\) все равно настоящая.\n\nЕсли равновесия нет, то фальшивая монета лежит либо в \\(A\\), либо среди выбранных 17 монет из \\(B\\). В кучке \\(C\\) тогда фальшивой монеты нет, значит все ее монеты настоящие. Поэтому при неравновесии предъявляем кучку \\(C\\).", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
