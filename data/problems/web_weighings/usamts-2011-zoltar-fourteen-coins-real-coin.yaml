      "id": "idea-unbalanced-single-comparison-produces-known-fake",
      "title": "Неравенство двух одиночных монет оставляет известную фальшивую",
      "text": "Если сравнить две одиночные монеты разных типов, более тяжелая настоящая монета будет забрана, а оставшаяся на другой стороне монета точно фальшивая. После этого известную фальшивую можно отложить, и среди неизвестных монет снова останется поровну настоящих и фальшивых.",
