  "strategies": [
    {
      "id": "str-reduce-to-two-real-two-fake",
      "title": "Последовательно уменьшить равные группы настоящих и фальшивых",
      "text": "Сначала сравниваем две одиночные монеты. Если они равны, заменяем одну из них новой монетой и снова сравниваем одиночные монеты; поскольку настоящих и фальшивых по семь, рано или поздно попадутся монеты разных типов. Тогда Золтар заберет настоящую монету из более тяжелой руки, а монета из другой руки станет известной фальшивой. Откладываем эту известную фальшивую. Среди оставшихся неизвестных монет теперь 6 настоящих и 6 фальшивых.\n\nПовторяем тот же прием: среди равного числа настоящих и фальшивых монет сравниваем одиночные монеты, пока не получим неравенство; после неравенства Золтар снова забирает одну настоящую монету, а у нас остается еще одна известная фальшивая, которую можно отложить. После четырех таких сокращений останутся 4 неизвестные монеты: 2 настоящие и 2 фальшивые.\n\nДля четырех монет пробуем разбиения на две пары и кладем одну пару в левую руку, другую - в правую. Среди трех способов разбить четыре монеты на две пары есть такой, где в одной руке лежат обе настоящие, а в другой обе фальшивые. Два остальных разбиения дают равенство, поэтому, перебрав разбиения до первого неравенства, мы найдем нужное. При неравенстве более тяжелая рука содержит две настоящие монеты; Золтар заберет одну из них, а вторая вернется и будет гарантированно настоящей.",
