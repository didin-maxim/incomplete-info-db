        "id": "stmt-zoltar-fourteen-coins",
        "title": "Семь настоящих и семь легких фальшивых",
        "text": "Есть 14 одинаковых на вид монет. Семь настоящих монет весят по 1 унции, а семь фальшивых - по 0.999 унции. Неизвестно, какие монеты настоящие. Робот Золтар умеет сравнивать две выбранные кучки монет. Если веса равны, он сообщает равенство и возвращает все монеты. Если одна рука тяжелее другой, он забирает одну случайную монету из более тяжелой руки, сообщает, какая рука была тяжелее, и возвращает остальные монеты. Нужно понять, существует ли стратегия, которая гарантированно позволит назвать одну настоящую монету, не забранную Золтаром.",
