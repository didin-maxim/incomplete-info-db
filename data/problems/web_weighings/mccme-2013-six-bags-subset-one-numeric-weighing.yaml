  "statements": {"original": [{"id": "stmt-mccme-2013-six-bags-subset", "title": "Фальшивые мешки не во всех мешках", "text": "Есть 6 мешков с монетами. Монеты весят целое число грамм. В некоторых мешках монеты фальшивые и весят на 1 грамм легче настоящих. Известно, что фальшивые монеты лежат не во всех мешках. Как за одно взвешивание на весах с числовым показанием определить, в каких мешках монеты фальшивые?", "source_ids": ["src-mccme-circle-2013-weighings"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["digital_scale", "state_space"]}]},
  "ideas": [{"id": "idea-binary-deficit-code", "title": "Дефицит веса записывает множество в двоичном коде", "text": "Если взять из мешков количества монет \\(1,2,4,8,16,32\\), то суммарная недостача веса равна сумме степеней двойки по фальшивым мешкам. Двоичная запись этой недостачи однозначно задает множество фальшивых мешков.", "standard_idea_ids": ["weighted_sum_encoding"], "status": "ai_checked"}],
  "strategies": [{"id": "str-powers-of-two", "title": "Взять 1, 2, 4, 8, 16 и 32 монеты", "text": "Пронумеруем мешки числами от 1 до 6 и возьмем из них соответственно \\(1,2,4,8,16,32\\) монеты. Пусть вес настоящей монеты равен \\(m\\) граммам; это целое число, одинаковое для всех настоящих монет. Если бы все выбранные монеты были настоящими, вес был бы \\(63m\\). Реальный вес равен \\(63m-d\\), где \\(d\\) - сумма чисел \\(1,2,4,8,16,32\\) по тем мешкам, которые фальшивые.\n\nТак как фальшивые монеты не во всех мешках, \\(0 \\le d \\le 62\\). По показанию весов находим остаток веса по модулю 63: он равен \\(-d\\) по модулю 63, то есть однозначно задает \\(d\\) в диапазоне от 0 до 62. Затем записываем \\(d\\) в двоичной системе: единицы в разрядах \\(1,2,4,8,16,32\\) указывают ровно на фальшивые мешки.", "standard_idea_ids": ["weighted_sum_encoding"], "status": "ai_checked", "definition_ids": ["state_space"]}],
