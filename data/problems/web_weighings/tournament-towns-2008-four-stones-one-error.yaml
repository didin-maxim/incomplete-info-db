  "strategies": [
    {
      "id": "str-four-linear-measurements",
      "title": "Четыре уравнения и исправление одной ошибки",
      "text": "Обозначим массы камней \\(A,B,C,D\\) через \\(a,b,c,d\\). Сделаем такие четыре взвешивания и запишем показанные разности как \\(w,x,y,z\\):\n\n\\(C+D\\) против \\(B\\), то есть в идеале \\(w=-b+c+d\\); \\(A\\) против \\(B+C+D\\), то есть \\(x=a-b-c-d\\); \\(A+B+C\\) против \\(D\\), то есть \\(y=a+b+c-d\\); \\(A+B+D\\) против \\(C\\), то есть \\(z=a+b-c+d\\).\n\nБез ошибки из этих уравнений сразу получается \\(a=(w+x+y+z)/3\\), \\(b=(y+z)/2-a\\), \\(c=a-(x+z)/2\\), \\(d=a-(x+y)/2\\). Если одно показание ошибочно на \\(1\\), то сумма \\(w+x+y+z\\) не делится на 3; ее остаток \\(\\varepsilon=\\pm1\\) показывает направление ошибки, потому что правильная сумма должна быть кратна 3. Остается понять, какое из четырех чисел исправлять. После подстановки правильного \\(a\\) величины \\(a-w,x,y,z\\) должны иметь одну и ту же четность; единственная величина другой четности указывает на испорченное показание. Исправив его на \\(-\\varepsilon\\), восстанавливаем все четыре массы по формулам выше.",
      "standard_idea_ids": ["error_correcting_code"],
      "status": "ai_checked",
      "definition_ids": []
    }
