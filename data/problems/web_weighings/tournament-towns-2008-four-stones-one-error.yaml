        "id": "stmt-tot-2008-fall-junior-a-2",
        "title": "Весы показывают разность масс, но один раз могут ошибиться на 1 грамм",
        "text": "Есть четыре камня, каждый весит целое число граммов. Весы с двумя чашами показывают, какая чаша тяжелее, и числовую разность масс на чашах в граммах. Можно ли за четыре взвешивания определить веса всех четырех камней, если не более чем в одном взвешивании показание может ошибиться на 1 грамм?",
