        "id": "stmt-inmo-2021-p4",
        "title": "Вопросы о соседних числах на закрытых картах",
        "text": "Фокусник кладет на стол лицом вниз карты с числами от 1 до 52. За один ход детектив выбирает две карты и спрашивает, стоят ли написанные на них числа подряд; фокусник отвечает правдиво. После конечного числа таких ходов детектив указывает две карты и выигрывает, если на них действительно стоят последовательные числа. Докажите, что детектив может гарантировать выигрыш тогда и только тогда, когда ему разрешено задать не меньше 50 вопросов.",
