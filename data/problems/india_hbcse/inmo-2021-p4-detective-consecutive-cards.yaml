  "impossibility_proofs": [
    {
      "id": "lb-forty-nine-questions-not-enough",
      "title": "Сорока девяти вопросов недостаточно",
      "text": "Пусть детектив сделал 49 обычных вопросов и затем указал финальную пару; всего есть 50 пар, для которых фокуснику нужно согласованно ответить или сделать итоговый выбор проигрышным для детектива. Рассмотрим граф на 52 позициях карт и удалим эти 50 пар. Официальное решение доказывает, что после удаления любых \\(N-2\\) ребер из полного графа \\(K_N\\) при \\(N>3\\) остается гамильтонов путь. Для \\(N=52\\) значит, что оставшиеся допустимые ребра можно расположить в путь из 52 вершин и подписать их числами \\(1,2,\\ldots,52\\) вдоль пути. Тогда все 50 удаленных пар получают несоседние числа, поэтому все ответы «нет» и финальная неудачная пара согласованы с некоторой раскладкой. Следовательно, при 49 вопросах детектив не может гарантировать выигрыш.",
