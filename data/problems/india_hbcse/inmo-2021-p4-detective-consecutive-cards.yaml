      "id": "str-ask-one-card-against-fifty",
      "title": "Сравнить одну карту с пятьюдесятью другими",
      "text": "Выберем карту \\(A\\). Детектив спрашивает про пары \\(A\\) с 50 из остальных 51 карт. Если на каком-то вопросе ответ «да», найденная пара уже выигрышная. Если все 50 ответов «нет», то единственная карта, которую не сравнивали с \\(A\\), обязана быть соседней с \\(A\\): у любого числа от 1 до 52 есть хотя бы один сосед, а все остальные кандидаты были исключены отрицательными ответами. Поэтому 50 вопросов достаточно.",
