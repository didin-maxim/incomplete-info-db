  "statements": {"original": [{"id": "stmt-original", "title": "Петя знает первую цифру, Вася - вторую", "text": "Ведущий загадал двузначное число и сообщил его первую цифру Пете, а вторую - Васе. Затем зрители задали три вопроса: является ли загаданное число точным квадратом, какая из цифр числа больше и различны ли цифры в числе. На первый вопрос Петя и Вася одновременно ответили «Нет», на второй - «Не знаю», а на третий - «Да». Какое число загадал ведущий?", "source_ids": ["src-kvantik-math-contest-2025-2026"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
