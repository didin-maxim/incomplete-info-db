  "statements": {"original": [{"id": "stmt-original", "title": "Делится ли ваше число?", "text": "В стране лжецов и рыцарей рыцари всегда говорят правду, а лжецы всегда лгут. Десяти жителям выдали различные числа от 1 до 10. Потом каждого спросили: «Делится ли ваше число на 2?» Утвердительный ответ дали 3 человека. На вопрос «Делится ли ваше число на 4?» утвердительный ответ дали 6 человек. На вопрос «Делится ли ваше число на 5?» утвердительно ответили 2 человека. Сколько было лжецов и какие у них были числа?", "source_ids": ["src-kvantik-math-contest-2016-2017"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["state_space"]}]},
  "ideas": [{"id": "idea-liar-complements-divisibility", "title": "Лжец меняет ответ на дополнение признака", "text": "Для каждого делителя число утвердительных ответов равно количеству рыцарей с делящимися числами плюс количеству лжецов с неделящимися числами.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-linear-counts", "title": "Сравнить три счетчика ответов", "text": "Пусть L - множество чисел лжецов. Для делителя d число ответов «да» равно числу чисел из {1,...,10}, делящихся на d, плюс поправка: лжецы с делящимися на d числами вместо «да» говорят «нет», а лжецы с неделящимися числами вместо «нет» говорят «да».\n\nПроверяя делимость на 2, 4 и 5, получаем единственный набор лжецов: 2, 5, 6 и 10. Действительно, для этих чисел ответы «да» по делимости на 2 дают только рыцари 4 и 8 плюс лжец 5, всего 3; по делимости на 4 дают рыцари 4 и 8 плюс лжецы 2, 5, 6, 10, всего 6; по делимости на 5 дают только рыцари с числами, делящимися на 5, отсутствуют, зато лжецы 2 и 6 отвечают «да», всего 2. Другой набор не удовлетворяет одновременно всем трем счетчикам.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked", "definition_ids": ["state_space"]}],
