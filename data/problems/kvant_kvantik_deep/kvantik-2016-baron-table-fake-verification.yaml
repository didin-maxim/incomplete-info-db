  "statements": {"original": [{"id": "stmt-original", "title": "Фальшивая монета осталась на столе?", "text": "На столе лежит кучка одинаковых с виду монет, одна из которых фальшивая: то ли легче, то ли тяжелее обычной. Барон Мюнхгаузен положил часть монет в карман, оставив на столе не менее двух монет, и заявил, что фальшивая монета осталась на столе. Как проверить слова барона с помощью чашечных весов без гирь, потратив как можно меньше взвешиваний? Доступны только монеты на столе, на весы можно класть любое число монет; решение может зависеть от количества оставшихся монет.", "source_ids": ["src-kvantik-math-contest-2016"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "state_space"]}]},
  "ideas": [{"id": "idea-even-table-one-test", "title": "При четном числе все доступные монеты можно проверить одним сравнением", "text": "Если доступных монет четное число, их можно разделить поровну. Неравенство доказывает, что фальшивая среди доступных; равновесие доказывает, что все доступные настоящие.", "standard_idea_ids": ["partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-even-one-odd-two", "title": "Один тест для четного числа, два для нечетного", "text": "Если на столе осталось четное число монет, делим их на две равные кучки и сравниваем. Если весы не в равновесии, фальшивая монета действительно осталась на столе; если равновесие, то все монеты на столе настоящие и барон соврал.\n\nЕсли на столе осталось нечетное число монет, одного взвешивания не хватит: если не взвесить какую-то монету, она может оказаться единственной фальшивой, а если пытаться положить все монеты, чаши нельзя сделать равными по числу. Двух взвешиваний достаточно. Сначала отложим одну монету и сравним две равные половины остальных. Если равновесия нет, фальшивая на столе. Если равновесие, все взвешенные монеты настоящие; вторым взвешиванием сравним отложенную монету с любой из них и проверим, фальшивая ли она.", "standard_idea_ids": ["partition_state_space", "decision_tree_lower_bound"], "status": "ai_checked", "definition_ids": ["balance_scale"]}],
  "impossibility_proofs": [{"id": "imp-odd-one-weighing", "title": "При нечетном числе одного взвешивания недостаточно", "text": "В одном взвешивании нельзя одновременно использовать все нечетное число монет равными по числу группами. Если часть монет не участвует и весы показывают равновесие, состояние «фальшивая среди неучаствующих» неотличимо от состояния «фальшивая у барона».", "standard_idea_ids": ["indistinguishability"], "status": "ai_checked"}],
  "incomplete_information_profile": {"hidden_state_space": "фальшивая монета либо среди доступных монет на столе, либо среди забранных бароном; знак отличия неизвестен", "observations": ["один или два результата чашечных весов"], "allowed_actions": ["выбирать равные по числу группы только из монет на столе"], "goal": ["verify_counterfeit_on_table"], "strategy_type": ["adaptive_strategy", "state_elimination"], "lower_bound_method": ["indistinguishability_argument"], "keywords": ["kvantik_math_contest_2016", "counterfeit_presence_test", "parity_of_available_coins"], "status": "ai_checked"},
