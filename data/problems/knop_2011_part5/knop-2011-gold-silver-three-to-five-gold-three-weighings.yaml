  "ideas": [
    {
      "id": "idea-product-state-trisection",
      "title": "Состояние - пара монет разных типов",
      "text": "Скрытое состояние задается парой: какая золотая и какая серебряная монета фальшивые. Одно взвешивание должно разбить это множество пар на ветви размера не больше \\(3^{r}\\), где \\(r\\) - число оставшихся взвешиваний.",
      "standard_idea_ids": [
        "partition_state_space",
        "ternary_weighing_code"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-balanced-metal-first-cut",
      "title": "Первый ход кладет одинаковые смешанные наборы",
      "text": "Для случаев б) и в) книга предлагает начать сравнением двух золотых и двух серебряных монет против двух золотых и двух серебряных. Такой ход сохраняет равенство нормальных масс и оставляет в каждой ветви не больше девяти возможных пар фальшивок. После этого каждой подозрительной монете можно дать двухбуквенный код из символов L, O, R: в двух оставшихся взвешиваниях она идет на левую чашу, не участвует или идет на правую. Для каждой допустимой пары золотая+серебряная получается свой двухбуквенный исход.",
      "standard_idea_ids": [
        "partition_state_space"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-case-a-separate-search",
      "title": "Случай а): искать металлы отдельно",
      "text": "Для 3 золотых и 9 серебряных монет достаточно разделить работу по типам. Одним взвешиванием сравниваем две золотые монеты: если одна легче, она фальшивая, а при равновесии фальшива третья. Оставшиеся два взвешивания - стандартный поиск одной легкой монеты среди девяти серебряных: разделить серебряные на три тройки, сравнить две тройки, затем внутри подозрительной тройки сравнить две монеты.",
      "standard_idea_ids": [
        "ternary_weighing_code"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "balance_scale",
        "strategy"
      ]
    },
    {
      "id": "str-cases-bc-first-weighing",
      "title": "Случаи б), в): первый смешанный разрез",
      "text": "Обозначим стороны первого взвешивания как L и R. В случаях б) и в) первым взвешиванием кладем на каждую чашу по 2 золотые и 2 серебряные монеты: \\(G_1,G_2,S_1,S_2\\) против \\(G_3,G_4,S_3,S_4\\). В случае б) остаются серебряные \\(S_5,S_6\\), а в случае в) остаются \\(G_5,S_5\\). Если левая чаша легче, то в б) возможны пары \\(G_1,G_2\\) с \\(S_1,S_2,S_5,S_6\\), а в в) пары \\(G_1,G_2\\) с \\(S_1,S_2,S_5\\) и \\(G_5\\) с \\(S_1,S_2\\). Равновесие оставляет только противоположные чаши, а в случае в) еще пару \\(G_5,S_5\\). Правая легкая ветвь получается симметричной заменой индексов 1,2 на 3,4.",
      "standard_idea_ids": [
        "partition_state_space",
        "state_space_encoding"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "balance_scale",
        "strategy"
      ]
    },
    {
      "id": "str-branch-code-tables",
      "title": "Коды для двух оставшихся взвешиваний",
      "text": "После первого взвешивания используем коды из двух символов L/O/R: символ показывает положение монеты в соответствующем из двух оставшихся взвешиваний. Слово исходов читаем как L, если левая чаша легче, O при равновесии и R, если правая легче. В ветви б-L назначаем \\(G_1=LL, G_2=OR, S_1=LO, S_2=OR, S_5=RL, S_6=RR\\); во втором из этих взвешиваний добавляем одну заведомо настоящую монету на левую чашу для баланса. В ветви б-O назначаем \\(G_1=LL, G_2=LO, G_3=LL, G_4=RO, S_1=OL, S_2=RO, S_3=LR, S_4=RR\\); в каждом из двух взвешиваний добавляем одну из \\(S_5,S_6\\) на правую чашу. В ветви в-L назначаем \\(G_1=LL, G_2=OO, G_5=LR, S_1=LO, S_2=RO, S_5=RR\\); в первом взвешивании кода добавляем настоящую монету на правую чашу, во втором - на левую. В ветви в-O назначаем \\(G_1=LL, G_2=LO, G_3=LL, G_4=RO, G_5=OO, S_1=OL, S_2=RO, S_3=LR, S_4=RR, S_5=RR\\); баланс уже соблюден. Для правой легкой ветви используются те же таблицы после симметричной замены левой и правой групп первого взвешивания. Прямой перебор допустимых пар дает разные двухбуквенные слова во всех четырех типовых ветвях: 8, 8, 8 и 9 слов соответственно.",
      "standard_idea_ids": [
        "decision_tree",
        "ternary_weighing_code"
      ],
      "status": "ai_checked",
