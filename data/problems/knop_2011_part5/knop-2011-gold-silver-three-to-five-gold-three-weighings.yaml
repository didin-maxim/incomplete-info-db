      {
        "id": "stmt-d24",
        "title": "Три варианта с 3-5 золотыми монетами",
        "text": "В цикле задач о золотых и серебряных монетах известно, что среди золотых монет ровно одна фальшивая и среди серебряных ровно одна фальшивая; золотые и серебряные различимы на вид; настоящие золотые и серебряные монеты имеют одинаковый вес; обе фальшивые монеты имеют одинаковый меньший вес и внешне неотличимы от настоящих монет своего металла. Нужно за три взвешивания найти обе фальшивые монеты в каждом из случаев: а) 3 золотые и 9 серебряных; б) 4 золотые и 6 серебряных; в) 5 золотых и 5 серебряных.",
