      "text": "Каждое чашечное взвешивание дает не более трех исходов, поэтому за три взвешивания можно различить не более \\(3^3=27\\) листьев дерева решений. Но возможных непустых множеств фальшивых монет \\(31\\). Значит, два разных множества неизбежно дадут одинаковую цепочку результатов, и все фальшивые монеты определить нельзя.",
