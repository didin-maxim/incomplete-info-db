        "id": "stmt-d28",
        "title": "Четыре заранее названных числа",
        "text": "Петя загадал натуральное число \\(A\\) от 1 до 16. Витя называет четыре числа \\(X_1\\), \\(X_2\\), \\(X_3\\), \\(X_4\\), после чего Петя сообщает, какие из них делятся на \\(A\\). Может ли Витя всегда угадать число \\(A\\)?",
