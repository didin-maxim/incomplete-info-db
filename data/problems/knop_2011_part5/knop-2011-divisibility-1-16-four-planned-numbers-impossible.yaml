  "ideas": [
    {
      "id": "idea-capacity-tight-but-divisibility-constrained",
      "title": "Информационной емкости ровно хватает, но не всякий код допустим",
      "text": "Четыре ответа да/нет дают ровно 16 слов, поэтому каждое из четырех чисел должно делить ровно половину возможных \\(A\\). Ограничение делимости не позволяет реализовать такую полную двоичную таблицу для чисел 1..16.",
      "standard_idea_ids": [
        "binary_encoding",
        "pigeonhole_principle"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [],
  "impossibility_proofs": [
    {
      "id": "imp-even-subproblem-contradiction",
      "title": "Четные числа дают противоречие",
      "text": "Если четыре проверки различают все 16 значений \\(A\\), то каждая проверка должна разбивать множество 1..16 на две восьмерки. Одна из проверок должна отличать 1 от 2; переименуем ее в \\(X_1\\). Тогда \\(X_1\\) не делится на 2, то есть нечетно.\n\nОставшиеся три проверки должны различать восемь четных значений \\(2,4,6,8,10,12,14,16\\), причем каждая снова обязана делить эту восьмерку пополам. Одна из них должна отличать 2 от 4. Если число делится на 2, но не делится на 4, то среди четных делителей из 1..16 у него должны быть ровно \\(2,6,10,14\\). Но тогда оно также делится на пять нечетных чисел \\(1,3,5,7,15\\). Всего получается как минимум девять делителей из 1..16, а нужно ровно восемь. Противоречие.",
      "standard_idea_ids": [
        "binary_encoding",
        "pigeonhole_principle"
      ],
