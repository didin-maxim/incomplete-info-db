  "strategies": [{"id": "str-balanced-metal-code", "title": "Назначить цветам согласованные троичные слова", "text": "Выбирают 27 различных троичных слов длины 3 и распределяют их между монетами так, чтобы каждая строка будущего плана была уравновешена настоящими монетами. Для серебряной монеты слово читается как поведение легкой фальшивки, для золотой — как поведение тяжелой фальшивки. После трех исходов полученное слово указывает единственную монету, если назначение слов сделано с учетом этого переворота знака.", "standard_idea_ids": ["ternary_weighing_code"], "status": "needs_human_review", "definition_ids": ["balance_scale", "strategy"]}],
