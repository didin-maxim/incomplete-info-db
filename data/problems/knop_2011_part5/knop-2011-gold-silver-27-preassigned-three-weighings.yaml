  "statements": {"original": [{"id": "stmt-part5-5-9", "title": "Фальшивая серебряная легче, фальшивая золотая тяжелее", "text": "Есть 27 монет, каждая из которых заранее названа золотой или серебряной. Ровно одна монета фальшивая. Если она серебряная, то она легче настоящих серебряных; если золотая, то тяжелее настоящих золотых. Нужно заранее назначить три взвешивания на чашечных весах и затем определить фальшивую монету.", "source_ids": ["src-knop-2011-weighings-algorithms"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "state_space", "strategy"]}]},
