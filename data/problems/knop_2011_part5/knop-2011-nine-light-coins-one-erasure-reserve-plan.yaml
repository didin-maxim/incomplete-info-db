  "statements": {"original": [{"id": "stmt-part5-5-11", "title": "Любое одно взвешивание можно выкинуть", "text": "Среди 9 внешне одинаковых монет ровно одна фальшивая, и она легче настоящих. Нужно заранее назначить 3 взвешивания на чашечных весах так, чтобы после этого можно было отбросить любое одно из них и по оставшимся двум результатам все равно определить фальшивую монету.", "source_ids": ["src-knop-2011-weighings-algorithms"], "status": "ai_checked", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "state_space", "strategy"]}]},
  "ideas": [{"id": "idea-erasure-code", "title": "Запасное взвешивание похоже на защиту от стирания", "text": "Каждая монета получает слово из положений в заранее назначенных взвешиваниях. Требование «можно выкинуть любое взвешивание» означает, что слова разных монет должны оставаться различными после удаления любой одной координаты.", "standard_idea_ids": ["ternary_weighing_code"], "status": "ai_checked"}],
  "strategies": [{"id": "str-use-erasure-separated-words", "title": "Код \\((a,b,a+b)\\) над тремя символами", "text": "Назначим девяти монетам слова длины 3, где 0 означает «не класть», Л - «на левую чашу», П - «на правую чашу»: 000, 0ЛЛ, 0ПП, Л0Л, ЛЛП, ЛП0, П0П, ПЛ0, ППЛ. В каждом из трех взвешиваний ровно три монеты стоят слева, три справа и три не участвуют, поэтому план сбалансирован. Любые два слова различаются как минимум в двух координатах: это код \\((a,b,a+b)\\) над полем из трех элементов. Поэтому после удаления любой одной координаты оставшиеся два результата однозначно указывают слово, а значит и легкую монету.", "standard_idea_ids": ["ternary_weighing_code"], "status": "ai_checked", "definition_ids": ["balance_scale", "strategy"]}],
