      "id": "idea-count-not-enough",
      "title": "Простой счет уже не запрещает решение",
      "text": "Возможных множеств фальшивых монет \\(\\binom52+\\binom53+\\binom54+\\binom55=26\\), а три взвешивания имеют 27 возможных цепочек исходов. Поэтому нужна более тонкая нижняя оценка по первому взвешиванию.",
      "standard_idea_ids": [
        "decision_tree_lower_bound"
      ],
      "status": "ai_checked"
    },
    {
      "id": "idea-first-weighing-bottleneck",
      "title": "В одной ветви первого взвешивания остается больше девяти случаев",
      "text": "После первого взвешивания должно оставаться не более девяти состояний в каждой ветви, иначе двух оставшихся взвешиваний не хватит. Но любое нетривиальное первое взвешивание на пяти монетах имеет слишком большую ветвь равновесия.",
      "standard_idea_ids": [
        "pigeonhole_principle",
        "decision_tree_lower_bound"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [],
  "impossibility_proofs": [
    {
      "id": "imp-first-weighing-equality-branch",
      "title": "Равновесная ветвь первого взвешивания слишком велика",
      "text": "После первого взвешивания каждая ветвь должна содержать не более \\(3^2=9\\) возможных множеств фальшивых монет. Достаточно рассмотреть осмысленные первые взвешивания с одинаковым числом монет на чашах.\n\nЕсли сравнить одну монету с одной, то равновесие означает, что эти две монеты одного типа. Возможны 8 случаев, когда обе они фальшивые, и 4 случая, когда обе настоящие, итого 12 состояний. Если сравнить две монеты с двумя, то равновесие означает одинаковое число фальшивых на чашах; получается 8 состояний с одной фальшивой на каждой чаше и 2 состояния с двумя фальшивыми на каждой чаше, итого 10. В обоих случаях равновесная ветвь больше 9, поэтому двумя оставшимися взвешиваниями все состояния уже не различить.",
