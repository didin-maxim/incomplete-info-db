      "title": "Грубая емкость не запрещает решение",
      "text": "Даже если считать все возможные наборы легких монет, \\(2^{19}\\le 3^{12}\\). Поэтому невозможность доказывается не числом всех листьев, а тем, что уже после первого взвешивания одна из ветвей слишком велика для оставшихся 11 взвешиваний.",
