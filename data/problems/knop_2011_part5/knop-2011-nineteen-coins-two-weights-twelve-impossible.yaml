    {
      "id": "idea-first-weighing-large-branch",
      "title": "Первое взвешивание неизбежно оставляет больше \\(3^{11}\\) случаев",
      "text": "Если на каждой чаше не более двух монет, то равновесная ветвь огромна. Если на каждой чаше хотя бы три монеты, то уже одна из ветвей неравенства содержит слишком много вариантов.",
