  "impossibility_proofs": [
    {
      "id": "imp-first-weighing-branch-counts",
      "title": "Ветвь первого взвешивания больше \\(3^{11}\\)",
      "text": "После первого взвешивания должно остаться не более \\(3^{11}=177147\\) состояний в каждой ветви. Рассмотрим первое взвешивание с \\(m\\) монетами на каждой чаше.\n\nЕсли \\(m\\le2\\), то наименьшая равновесная ветвь получается при \\(m=2\\). Тогда на двух чашах может быть поровну 0, 1 или 2 легкие монеты, а остальные 15 монет свободны: \\((1+4+1)\\cdot 2^{15}=196608\\) вариантов. Если в условии строго требовать, чтобы оба веса действительно встречались, из этого числа надо убрать только два крайних случая «все тяжелые» и «все легкие»; все равно остается \\(196606>177147\\).\n\nЕсли \\(m\\ge3\\), рассмотрим одну фиксированную ветвь неравенства, например когда на левой чаше легких монет больше, чем на правой. Число совместимых состояний равно \\(2^{19-2m}\\sum_{i>j}\\binom mi\\binom mj\\). Для \\(m=3,4,5,6,7,8,9\\) это соответственно \\(180224, 190464, 197632, 203008, 207232, 210664, 213524\\), то есть минимум уже при \\(m=3\\) больше \\(3^{11}\\). Значит, какое бы первое взвешивание ни выбрали, одна ветвь оставляет больше \\(3^{11}\\) состояний, и 12 взвешиваний недостаточно.",
      "standard_idea_ids": [
        "decision_tree_lower_bound",
        "pigeonhole_principle"
      ],
