      "id": "idea-one-weighing-to-27-states",
      "title": "Первый ход должен оставить не больше 27 пар",
      "text": "После первого взвешивания остаются три взвешивания, то есть не больше \\(3^3=27\\) различимых исходовых слов. Поэтому первый ход в случаях б), в) выбран так, чтобы каждая ветвь содержала не более 27 возможных пар фальшивок.",
