    {
      "id": "idea-two-type-sum-sign",
      "title": "Перекос зависит от суммы положений двух фальшивок",
      "text": "Если нормальные массы на чашах уравнены, результат взвешивания определяется тем, где лежат две легкие фальшивки. Равновесие возникает, когда их вклады в перекос компенсируются, а неравенство - когда суммарная недостача оказывается на одной стороне.",
      "standard_idea_ids": [
