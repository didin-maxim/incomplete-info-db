        "id": "stmt-d25",
        "title": "Три варианта за четыре взвешивания",
        "text": "В той же модели золотых и серебряных монет: среди золотых ровно одна фальшивая, среди серебряных ровно одна фальшивая; настоящие монеты обоих металлов равны по весу, а две фальшивые равны между собой и легче настоящих. Нужно за четыре взвешивания найти обе фальшивые монеты в каждом из случаев: а) 3 золотые и 27 серебряных; б) 4 золотые и 20 серебряных; в) 5 золотых и 16 серебряных.",
