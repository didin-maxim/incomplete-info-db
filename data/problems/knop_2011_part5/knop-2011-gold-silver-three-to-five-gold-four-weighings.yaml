    {
      "id": "str-case-b-first-cut",
      "title": "Случай б): первый разрез 1 золотая и 7 серебряных против таких же",
      "text": "Для 4 золотых и 20 серебряных книга предлагает первым взвешиванием положить на каждую чашу по 1 золотой и 7 серебряных монет. Пусть на левой чаше \\(G_1\\) и 7 серебряных, на правой \\(G_2\\) и 7 серебряных, а \\(G_3,G_4\\) и 6 серебряных вне весов. Если левая чаша легче, возможны два типа состояний: фальшивая золотая \\(G_1\\) и серебряная на левой чаше или вне весов, либо фальшивая золотая вне весов и серебряная на левой чаше. Это \\(1\\cdot(7+6)+2\\cdot7=27\\) состояний. Равновесие оставляет \\(G_1\\) с правыми серебряными, \\(G_2\\) с левыми серебряными или одну из \\(G_3,G_4\\) с одной из 6 серебряных вне весов: \\(7+7+12=26\\) состояний. Правая легкая ветвь симметрична.",
