      "title": "Случай в): первый разрез 2 золотые и 5 серебряных против таких же",
      "text": "Для 5 золотых и 16 серебряных первым взвешиванием кладем на каждую чашу по 2 золотые и по 5 серебряных, оставив 1 золотую и 6 серебряных вне весов. Если левая чаша легче, возможны пары: левая золотая с левой или внешней серебряной, либо внешняя золотая с левой серебряной. Их \\(2\\cdot(5+6)+1\\cdot5=27\\). При равновесии остаются противоположные чаши или две внешние монеты: \\(2\\cdot5+2\\cdot5+1\\cdot6=26\\). Правая легкая ветвь симметрична.",
