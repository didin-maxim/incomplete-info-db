      "title": "Случай а): 3 золотые и 27 серебряных",
      "text": "Как и в Д.24а, золотую фальшивку находим отдельно за одно взвешивание среди трех золотых. Серебряную фальшивку среди 27 серебряных находим стандартной трисекцией за три взвешивания: каждый раз делим подозрительную группу на три равные части и сравниваем две из них.",
