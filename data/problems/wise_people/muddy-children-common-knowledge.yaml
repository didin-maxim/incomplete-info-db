      "id": "idea-induction-on-k",
      "title": "Молчание исключает меньшие числа грязных",
      "text": "Если грязных \\(k\\), каждый грязный видит \\(k-1\\) грязных. Когда первые \\(k-1\\) раундов никто не отвечает, становится общим знанием, что случаев с меньшим числом грязных нет.",
