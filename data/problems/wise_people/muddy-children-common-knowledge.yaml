        "id": "stmt-original",
        "title": "Дети видят чужие лбы",
        "text": "Несколько детей стоят так, что каждый видит, у кого из остальных грязный лоб, но не видит свой. Известно, что хотя бы у одного ребенка лоб грязный, и взрослый публично объявляет этот факт. Затем в каждом раунде все дети одновременно отвечают, знают ли они, грязный ли у них лоб. Если грязных детей ровно \\(k\\), докажите, что первые \\(k-1\\) раундов никто не знает ответ, а в \\(k\\)-м раунде все грязные дети узнают, что они грязные.",
        "source_ids": ["src-common-knowledge-puzzles"],
        "status": "ai_checked",
