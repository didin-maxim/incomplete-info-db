  "strategies": [
    {
      "id": "str-common-knowledge-induction",
      "title": "Индукция по числу грязных детей",
      "text": "Докажем утверждение по \\(k\\). Если \\(k=1\\), единственный грязный ребенок не видит грязных лбов у других. После публичного объявления, что грязный лоб у кого-то есть, он сразу понимает, что грязный он сам, и отвечает в первом раунде.\n\nПусть утверждение доказано для всех меньших чисел грязных, и пусть на самом деле грязных \\(k\\). Каждый грязный ребенок видит ровно \\(k-1\\) грязных. Он рассуждает так: если мой лоб чистый, то грязных всего \\(k-1\\), и по предположению индукции эти \\(k-1\\) детей ответят в \\((k-1)\\)-м раунде. Но этого не происходит. Значит, мое предположение о чистом лбе неверно, и в \\(k\\)-м раунде каждый грязный ребенок узнает, что он грязный. Чистые дети видят \\(k\\) грязных и к этому моменту не получают основания считать себя грязными.",
      "standard_idea_ids": ["public_announcement_induction"],
