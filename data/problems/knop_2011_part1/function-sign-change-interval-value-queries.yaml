        "title": "Найти короткий отрезок со сменой знака",
        "text": "Петя знает функцию \\(f\\), определенную на \\([0;100]\\), для которой \\(f(0)f(100)\\leqslant 0\\). За один вопрос Витя называет Пете число \\(x\\), а Петя сообщает значение \\(f(x)\\). За какое наименьшее число вопросов Витя сможет найти отрезок \\([a;b]\\) длины не больше 1, для которого \\(f(a)f(b)\\leqslant 0\\)?",
