  ],
  "strategies": [
    {
      "id": "str-endpoint-then-seven-bisections",
      "title": "Спросить конец и семь раз делить пополам",
      "text": "Сначала Витя спрашивает значение \\(f(0)\\). Если оно равно нулю, подойдет любой отрезок \\([0;b]\\) с \\(0<b\\le 1\\). Иначе знак \\(f(100)\\) известен из условия: он противоположен знаку \\(f(0)\\) или равен нулю.\n\nТеперь Витя поддерживает отрезок \\([u;v]\\), для которого \\(f(u)f(v)\\leqslant 0\\). На каждом шаге он спрашивает значение в середине \\(m=(u+v)/2\\). Если \\(f(u)f(m)\\leqslant 0\\), оставляет \\([u;m]\\); иначе оставляет \\([m;v]\\). После семи таких вопросов длина отрезка не больше \\(100/2^7<1\\). Значит, достаточно 8 вопросов.",
      "standard_idea_ids": ["adaptive_questions", "partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["adaptive_strategy"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-eight-questions-needed",
      "title": "Почему семи вопросов недостаточно",
      "text": "Для нижней оценки достаточно рассмотреть функции, значения которых в запрошенных точках всегда равны \\(+1\\) или \\(-1\\), а смена знака спрятана в одном из 100 единичных промежутков. Один вопрос нужен, чтобы зафиксировать знак одного края; после этого каждый новый ответ имеет только две существенные возможности - оставить левую или правую часть текущего отрезка. Шесть дальнейших двоичных ответов различают не больше \\(2^6=64\\) единичных промежутков, а их 100. Поэтому 7 вопросов не гарантируют отрезок длины не больше 1; стратегия выше показывает оптимальность 8.",
