      "title": "Одного значения на конце хватает, чтобы начать бисекцию",
      "text": "Если узнать знак \\(f(0)\\), то из условия \\(f(0)f(100)\\leqslant 0\\) уже известен противоположный или нулевой знак на правом конце. Дальше каждый вопрос в середине текущего отрезка выбирает ту половину, на концах которой произведение значений неположительно.",
