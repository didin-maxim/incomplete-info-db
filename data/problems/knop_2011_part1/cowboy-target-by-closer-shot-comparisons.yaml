      "title": "Последовательно сужать квадрат поиска",
      "text": "Идея стратегии такая: выбирать пары выстрелов так, чтобы сравнение реализовывало вопрос, в какой половине текущего прямоугольника лежит цель. Сравнение двух симметрично выбранных точек по разные стороны от нужной разделяющей прямой сообщает нужную сторону этой прямой. Попеременно деля область поиска по двум координатам, за 17 сравнений после первого выстрела можно уменьшить возможную область до прямоугольника с диаметром меньше 1 см, после чего 18-й выстрел направляется в подходящую точку этой области.",
