  "strategies": [
    {
      "id": "str-coordinate-bisection",
      "title": "Последовательно сужать квадрат поиска",
      "text": "Будем считать размеры в сантиметрах, так что газета закрывает квадрат \\(100\\times100\\). Первый выстрел делаем в точку, не лежащую ни на одной из будущих средних линий двоичных делений. Это можно обеспечить заранее: таких линий за 16 делений конечное число.\n\nПусть после очередного ответа возможная область - прямоугольник, а предыдущий выстрел попал в точку \\(X\\). Если нужно узнать, по какую сторону от средней вертикальной или горизонтальной линии \\(\\ell\\) лежит цель, следующим выстрелом бьем в точку \\(X'\\), симметричную \\(X\\) относительно \\(\\ell\\). Серединный перпендикуляр к отрезку \\(XX'\\) как раз равен \\(\\ell\\), поэтому ответ «новая пуля ближе» или «предыдущая пуля ближе» сообщает нужную половину; при равенстве цель лежит на самой линии, что тоже не мешает оставить одну из половин вместе с границей.\n\nСделаем так 16 сравнений, попеременно деля текущий прямоугольник по вертикали и горизонтали. Для этого используются выстрелы со 2-го по 17-й. После восьми делений по каждой координате возможная область имеет размеры не больше \\(100/2^8\\) на \\(100/2^8\\), а ее диагональ меньше 1 см. Поэтому 18-м выстрелом можно бить, например, в центр оставшейся области.",
