        "id": "stmt-knop-d5",
        "title": "18-й выстрел не дальше сантиметра",
        "text": "Ковбой Джо может попасть в любую выбранную им точку. Ему нужно попасть в точку на стене, прикрытую газетой размера \\(1\\text{ м}\\times1\\text{ м}\\). После каждого выстрела начиная со второго ему сообщают, какая из двух пуль легла ближе к цели: эта или предыдущая. Докажите, что 18-м выстрелом он может попасть не дальше 1 см от нужной точки.",
        "source_ids": ["src-knop-2011-weighings-algorithms"],
