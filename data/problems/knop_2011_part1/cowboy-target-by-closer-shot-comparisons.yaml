  "ideas": [
    {
      "id": "idea-comparison-bisects-region",
      "title": "Сравнение двух точек задает серединную прямую",
      "text": "Если известны две точки выстрелов, ответ «какая ближе к цели» сообщает, по какую сторону от серединного перпендикуляра к отрезку между ними лежит цель. Так можно получать геометрические вопросы, делящие область поиска.",
      "standard_idea_ids": ["partition_state_space", "adaptive_questions"],
      "status": "ai_checked"
    }
