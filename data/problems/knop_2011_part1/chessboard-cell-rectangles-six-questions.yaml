      "title": "Три вопроса на строку и три на столбец",
      "text": "На доске \\(8\\times 8\\) сначала тремя прямоугольными вопросами делим строки пополам: верхние 4 строки или нижние 4, затем одну из двух пар строк, затем одну строку. После этого так же тремя вопросами делим восемь столбцов. Пересечение найденной строки и найденного столбца дает загаданную клетку.",
