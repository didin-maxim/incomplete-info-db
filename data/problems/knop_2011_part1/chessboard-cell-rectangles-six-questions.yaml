      "text": "Для доски \\(5\\times5\\) книга предлагает сначала очевидным прямоугольным вопросом оставить одну из частей размера не больше \\(3\\times5\\). Затем из прямоугольника \\(3\\times5\\) вторым ходом вырезается прямоугольник \\(2\\times4\\). Если клетка внутри него, дальше остаются восемь вариантов и трех вопросов достаточно. Если клетка вне него, оставшаяся каемка также делится следующим прямоугольным вопросом на две удобные части, после чего оставшихся вопросов хватает.",
