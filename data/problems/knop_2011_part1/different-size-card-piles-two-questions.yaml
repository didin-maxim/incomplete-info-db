        "title": "Найти карту двумя раскладками в разные стопки",
        "text": "Есть \\(N\\) карт, из которых задумана одна. Разрешается разложить карты на стопки с разным числом карт и спросить, в какой из стопок задумана карта. При каких \\(N\\) можно найти задуманную карту за два таких вопроса?",
