    {
      "id": "idea-pair-of-pile-sizes",
      "title": "Карта получает пару размеров стопок",
      "text": "После двух вопросов каждая карта описывается парой чисел: размером стопки, где она лежала в первой раскладке, и размером стопки во второй. Чтобы карту можно было восстановить, эти пары должны быть различными для всех карт.",
      "standard_idea_ids": ["partition_state_space", "encoding"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-triangular-numbers",
      "title": "Работают треугольные числа",
      "text": "Если \\(N=1+2+\\cdots+k\\), в первой раскладке сделаем стопки \\(A_1,A_2,\\ldots,A_k\\) размеров \\(1,2,\\ldots,k\\), а во второй - стопки \\(B_1,B_2,\\ldots,B_k\\) тех же размеров. Разложим карты так: в пересечении \\(A_i\\) и \\(B_j\\) лежит по одной карте ровно тогда, когда \\(i+j\\ge k+1\\). Тогда в строке \\(A_i\\) ровно \\(i\\) карт, а в столбце \\(B_j\\) ровно \\(j\\) карт. Два ответа называют одну строку и один столбец этой треугольной таблицы, значит определяют единственную карту.",
      "standard_idea_ids": ["encoding", "extremal_principle"],
      "status": "ai_checked",
      "definition_ids": ["state_space"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-triangular-only",
      "title": "Размеры стопок вынуждают треугольное число",
      "text": "Пусть в первой раскладке \\(r\\) стопок, а во второй \\(s\\) стопок. Чтобы два ответа определяли карту, пересечение любой стопки первой раскладки с любой стопкой второй раскладки содержит не больше одной карты. Поэтому размер каждой стопки первой раскладки не превосходит \\(s\\), а размер каждой стопки второй раскладки не превосходит \\(r\\).\n\nВ первой раскладке размеры стопок попарно различны, значит среди \\(r\\) положительных целых чисел, не превосходящих \\(s\\), должно быть \\(r\\le s\\). Аналогично из второй раскладки получаем \\(s\\le r\\). Следовательно, \\(r=s=k\\). Тогда \\(k\\) попарно различных положительных размеров, не превосходящих \\(k\\), обязаны быть числами \\(1,2,\\ldots,k\\). Поэтому \\(N=1+2+\\cdots+k\\).",
      "standard_idea_ids": ["extremal_principle"],
