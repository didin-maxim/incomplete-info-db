      "id": "str-triangular-numbers",
      "title": "Работают треугольные числа",
      "text": "Если \\(N=1+2+\\cdots+k\\), можно сделать первую раскладку на стопки размеров \\(1,2,\\ldots,k\\). Затем вторую раскладку устроить так, чтобы карты из стопки размера \\(i\\) попали по одной в стопки разных размеров, а в итоге каждая карта получила свою пару размеров. Тогда два ответа определяют карту.\n\nНеобходимость в книге выводится из принципа крайнего: пусть \\(k\\) - наибольший размер стопки, встречающийся в одной из двух раскладок. Карты из такой стопки должны во второй координате получить \\(k\\) разных размеров, значит появляются размеры 1,2,\\ldots,k\\), и суммарное число карт равно треугольному числу.",
      "standard_idea_ids": ["encoding", "extremal_principle"],
