      "title": "Подсчет листьев дерева решений",
      "text": "Перед взвешиванием возможны 4 состояния: фальшивая первая, вторая, третья или четвертая монета. Мы заранее выбираем одно взвешивание, а потом уже не можем задавать новые вопросы: окончательный ответ зависит только от полученного исхода. У чашечных весов исходов не больше трех: левая чаша тяжелее, правая чаша тяжелее или равновесие. Если бы одного взвешивания всегда хватало, четыре возможные фальшивые монеты должны были бы дать четыре различимых исхода. Но по принципу Дирихле какие-то два состояния дадут один и тот же исход, и после такого результата эти две монеты останутся неразличимыми. Следовательно, одного взвешивания недостаточно.",
