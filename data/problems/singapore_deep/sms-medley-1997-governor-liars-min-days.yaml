  "strategies": [
    {
      "id": "str-two-stage-find-truthful-then-classify",
      "title": "За два дня выбрать настоящий класс ответов",
      "text": "Ответ: 2 дня. В первый день губернатор собирает всех жителей. Пусть всего их N. Для каждого числового ответа x он считает, сколько людей дали этот ответ; обозначим это число c_x. Если x - настоящий ответ правдивцев, то лжецов ровно x, а правдивцев N-x, поэтому необходимо c_x=N-x. Оставим только такие кандидатные ответы x. Настоящий ответ среди них точно есть, потому что правдивцы существуют и все они сказали истинное число лжецов.\n\nВо второй день губернатор берет по одному представителю из каждого кандидатного класса ответов. Пусть таких классов k. Если настоящий класс - тот, из которого взят представитель A, то в этой новой группе ровно один правдивец, а остальные k-1 человек - лжецы. Поэтому A обязан ответить k-1, а все остальные, будучи лжецами, не имеют права назвать истинное число k-1. Значит ровно один человек во второй группе ответит k-1; его первый ответ и есть настоящий ответ L. После этого все жители, которые в первый день ответили L, - правдивцы, а остальные - лжецы.",
      "standard_idea_ids": [
        "truth_liar_normalization"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "state_space"
      ]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-one-day-indistinguishable-patterns",
      "title": "Одного дня недостаточно уже для трех жителей",
      "text": "Однодневная стратегия должна работать, в частности, для острова из трех жителей. Если за один день губернатор не спросил кого-то из них, то ответы выбранной группы не зависят от роли неспрошенного жителя; можно подобрать две картины с одинаковыми ответами выбранных людей, но с разной ролью неспрошенного. Значит, чтобы надеяться на гарантию за один день, нужно спросить всех троих.\n\nНо и общий опрос всех трех не всегда достаточен: ответы 2, 1, 1 совместимы с двумя разными картинами. Либо единственный правдивец - тот, кто ответил 2, и тогда лжецов двое; либо правдивцы - два человека, ответившие 1, и тогда лжец один. В обоих случаях лжецы действительно не называют истинное число лжецов. Поэтому один день не гарантирует успеха.",
