        "id": "stmt-sms-1997-governor-liars",
        "title": "Сколько дней нужно для классификации островитян",
        "text": "На острове каждый житель либо всегда говорит правду, либо всегда лжет. Новый губернатор хочет определить, кто лжец, а кто правдивец. Для этого каждый день он собирает некоторую группу жителей и спрашивает каждого из них, сколько лжецов в этой группе. Он записывает имена и ответы. Известно, что не все жители являются лжецами, и каждый житель знает, кто есть кто. Какое минимальное число дней нужно губернатору, чтобы гарантированно выполнить план?",
        "source_ids": [
