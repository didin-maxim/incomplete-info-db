  "ideas": [
    {
      "id": "idea-truthful-person-certifies-group-count",
      "title": "Первый общий опрос оставляет только несколько возможных классов правдивцев",
      "text": "Если спросить всех жителей сразу, настоящие правдивцы все назовут одно и то же число L - число лжецов на острове. Значит класс ответивших L имеет размер N-L. Любой другой ответ x может быть кандидатом только в том случае, если людей с ответом x ровно N-x; остальные варианты сразу невозможны.",
