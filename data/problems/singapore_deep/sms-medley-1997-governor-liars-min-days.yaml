  "impossibility_proofs": [
    {
      "id": "lb-one-day-indistinguishable-patterns",
      "title": "Один общий день не отделяет все типы без дополнительной структуры",
      "text": "Если за один день спросить только одну выбранную группу, жители вне группы не дают наблюдений, а внутри группы совпадающие числовые ответы могут быть совместимы с несколькими распределениями типов. Поэтому минимальность требует отдельного доказательства для конкретной оптимальной стратегии.",
