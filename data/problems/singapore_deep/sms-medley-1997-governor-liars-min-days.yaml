      "id": "str-two-stage-find-truthful-then-classify",
      "title": "Черновой план нельзя считать доказанной оптимальной стратегией",
      "text": "Карточка пока не содержит полного решения. Важно не использовать как доказательство идею \"в первый день спросить всех и взять самое согласованное значение\": лжецы могут дать одинаковый ложный числовой ответ, поэтому частота ответов сама по себе не сертифицирует правдивца и не дает минимальное число дней.\n\nДля публикации нужно восстановить из надежного разбора две части: явную адаптивную стратегию групповых запросов и отдельную нижнюю оценку на число дней. До этого карточка остается lead-карточкой с needs_human_review.",
