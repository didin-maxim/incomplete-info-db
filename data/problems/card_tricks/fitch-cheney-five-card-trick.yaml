        "id": "stmt-original",
        "title": "Помощник показывает четыре карты",
        "text": "Из стандартной колоды в 52 карты зритель выбирает 5 карт и показывает их помощнику. Помощник передает фокуснику 4 из этих карт в некотором порядке. Фокусник знает заранее согласованную стратегию, но не видел пятую карту. Докажите, что помощник может выбрать и упорядочить 4 карты так, чтобы фокусник всегда определял пятую.",
        "source_ids": ["src-fitch-cheney-five-card-trick", "src-problems-ru-98399"],
