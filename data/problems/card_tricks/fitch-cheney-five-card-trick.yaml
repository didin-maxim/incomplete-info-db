      "id": "str-suit-and-offset",
      "title": "Кодирование масти и смещения",
      "text": "В каждой масти упорядочим достоинства по циклу длины 13. Среди пяти выбранных карт найдутся две одной масти. На цикле между ними есть два расстояния, сумма которых равна 13, поэтому одно из направлений имеет расстояние от 1 до 6. Помощник скрывает вторую карту этой пары, а первую показывает первой: так фокусник узнает масть скрытой карты и начальную точку на цикле.\n\nОставшиеся три показанные карты можно упорядочить шестью способами. Заранее договоримся, какая перестановка кодирует каждое число от 1 до 6. Помощник ставит эти три карты в порядке, кодирующем расстояние от первой показанной карты до скрытой по циклу достоинств. Фокусник читает масть по первой карте, число - по порядку трех остальных, и восстанавливает скрытую карту.",
