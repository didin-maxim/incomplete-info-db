    "generalized": [
      {
        "id": "stmt-general-s-suits-m-ranks",
        "title": "Масти, порядок достоинств и порядок карт как подсказка",
        "text": "Та же конструкция переносится на колоду с \\(s\\) мастями и \\(m\\) циклическими рангами, если в руке \\(s+1\\) карт и \\((s-1)!\\) перестановок оставшихся показанных карт хватает, чтобы закодировать расстояние между двумя картами одной масти: \\(\\lfloor m/2\\rfloor\\le (s-1)!\\). Стандартная колода дает \\(s=4\\), \\(m=13\\), \\(\\lfloor 13/2\\rfloor=6=3!\\).",
