        "id": "stmt-general-s-suits-m-ranks",
        "title": "Масти, порядок достоинств и порядок карт как подсказка",
        "text": "В колоде есть \\(s\\) мастей, а в каждой масти \\(m\\) достоинств, расположенных по циклу. Зритель выбирает \\(s+1\\) карт и показывает их помощнику. Помощник должен скрыть одну карту, а остальные \\(s\\) карт передать фокуснику в некотором порядке, чтобы фокусник восстановил скрытую карту. Такая стратегия есть, если \\((s-1)!\\) перестановок карт после первой хватает для передачи расстояния между двумя картами одной масти: \\(\\lfloor m/2\\rfloor\\le (s-1)!\\). Стандартная колода дает \\(s=4\\), \\(m=13\\), \\(\\lfloor 13/2\\rfloor=6=3!\\).",
