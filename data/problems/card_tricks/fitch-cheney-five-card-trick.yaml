    {
      "id": "str-suit-and-offset",
      "title": "Передать масть и смещение",
      "text": "В каждой масти упорядочим достоинства по циклу длины \\(m\\). Среди \\(s+1\\) выбранных карт найдутся две одной масти. На цикле между ними есть два расстояния, сумма которых равна \\(m\\), поэтому одно из направлений имеет расстояние от 1 до \\(\\lfloor m/2\\rfloor\\). Помощник скрывает вторую карту этой пары, а первую показывает первой: так фокусник узнает масть скрытой карты и начальную точку на цикле.\n\nОставшиеся \\(s-1\\) показанные карты можно упорядочить \\((s-1)!\\) способами. Если \\(\\lfloor m/2\\rfloor\\le (s-1)!\\), заранее договоримся, какая перестановка передает каждое возможное короткое расстояние. Помощник ставит эти карты в нужном порядке, фокусник читает масть по первой карте, расстояние - по порядку остальных, и восстанавливает скрытую карту. В стандартной колоде это дает расстояние от 1 до 6 и шесть порядков трех карт.",
