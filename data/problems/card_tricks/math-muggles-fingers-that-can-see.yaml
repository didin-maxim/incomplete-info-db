        "id": "stmt-fingers-that-can-see",
        "title": "Разделить карты вслепую",
        "text": "Фокусник раскладывает на столе карты по одной; зритель каждый раз говорит, класть карту лицом вверх или вниз, и сам решает, когда остановиться. До завязывания глаз фокусник видит раскладку, но в фокусе разрешено сохранить в памяти только общее число карт лицом вверх, а не расположение отдельных карт. Затем ему завязывают глаза, и он должен разложить все карты на две кучки так, чтобы в обеих кучках оказалось одно и то же число карт лицом вверх. Как это сделать без подглядывания?",
        "source_ids": ["src-mathcircles-zeitz-mathematical-magic-for-muggles"],
        "status": "source_verified",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["hidden_state", "strategy"]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-count-up-cards-before-blindfold",
      "title": "До завязывания глаз запомнить только число открытых карт",
      "text": "Фокуснику не нужно помнить расположение всех карт. Достаточно знать число \\(u\\) карт лицом вверх в общей раскладке до завязывания глаз. После этого любые \\(u\\) карт можно взять в отдельную кучку: неизвестное число открытых карт внутри выбранной кучки компенсируется переворотом всей кучки.",
      "standard_idea_ids": ["invariant", "complement_counting"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-take-u-and-flip",
      "title": "Взять \\(u\\) карт и перевернуть всю кучку",
      "text": "Пусть перед завязыванием глаз фокусник насчитал \\(u\\) карт лицом вверх. Вслепую он берет любые \\(u\\) карт, не меняя их ориентации, кладет их в первую кучку, а остальные оставляет во второй. Затем он переворачивает всю первую кучку.\n\nЕсли среди выбранных \\(u\\) карт было \\(f\\) открытых, то закрытых среди них было \\(u-f\\). В невыбранной кучке открытых карт тоже \\(u-f\\), потому что всего открытых было \\(u\\), а \\(f\\) из них попали в первую кучку. После переворота первой кучки ее открытыми становятся ровно прежние закрытые, то есть \\(u-f\\). Значит, числа открытых карт в двух кучках равны.",
      "standard_idea_ids": ["invariant", "complement_counting"],
      "status": "ai_checked",
      "definition_ids": ["strategy"]
    }
