  "ideas": [
    {
      "id": "idea-two-parity-syndromes",
      "title": "Строка и столбец с неправильной четностью дают координаты ошибки",
      "text": "Фокусник заранее делает число открытых карт в каждой строке и каждом столбце нечетным. Переворот одной карты меняет четность ровно одной строки и ровно одного столбца. Их пересечение и есть измененная карта.",
      "standard_idea_ids": ["parity_code", "error_correcting_code"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-add-row-column-odd-parity",
      "title": "Достроить сетку до нечетной четности",
      "text": "Для каждой из четырех исходных строк фокусник выбирает добавленную карту в пятом столбце так, чтобы в этой строке стало нечетное число открытых карт. Затем для каждого из первых четырех столбцов он выбирает карту в пятой строке так, чтобы в этом столбце тоже стало нечетное число открытых карт.\n\nОстается нижняя правая карта. Ее ориентацию выбираем так, чтобы пятая строка имела нечетное число открытых карт. Тогда и пятый столбец автоматически будет иметь нечетное число открытых карт: сумма нечетностей по пяти строкам нечетна, а первые четыре столбца уже дают четную суммарную нечетность, значит последнему столбцу нужна нечетность.\n\nПосле переворота одной карты фокусник ищет единственную строку с четным числом открытых карт и единственный столбец с четным числом открытых карт. Их пересечение - перевернутая карта.",
      "standard_idea_ids": ["parity_code", "error_correcting_code"],
      "status": "ai_checked",
      "definition_ids": ["strategy"]
    }
