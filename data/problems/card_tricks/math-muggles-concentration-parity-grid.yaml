        "id": "stmt-concentration-parity-grid",
        "title": "Одна карта в сетке 5 на 5 изменила ориентацию",
        "text": "Зритель раскладывает карты в сетку \\(4\\times4\\), выбирая для каждой карты, лежит она лицом вверх или вниз. Фокусник добавляет еще один ряд и еще один столбец, получая сетку \\(5\\times5\\). Затем фокуснику завязывают глаза, зритель переворачивает ровно одну карту, после чего фокусник снимает повязку и должен указать, какая карта была изменена. Как фокуснику заранее расположить добавленные карты?",
        "source_ids": ["src-mathcircles-zeitz-mathematical-magic-for-muggles"],
        "status": "source_verified",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["state_space", "strategy"]
      }
