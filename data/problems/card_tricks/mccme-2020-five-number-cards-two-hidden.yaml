        "id": "stmt-mccme-2020-five-number-cards",
        "title": "Две спрятанные карточки из пяти",
        "text": "Зрителю дают пять карточек с номерами от 1 до 5, а фокуснику завязывают глаза. Зритель прячет две карточки, а три оставшиеся отдаёт ассистенту фокусника. Ассистент указывает зрителю на две из этих трёх карточек, и зритель называет их номера фокуснику. Порядок, в котором зритель назовёт два номера, ассистент не контролирует. Как фокуснику и ассистенту заранее договориться, чтобы фокус всегда удавался?",
        "source_ids": ["src-mccme-circle-2020-card-tricks"],
        "status": "source_verified",
