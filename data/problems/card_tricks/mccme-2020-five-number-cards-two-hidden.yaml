  "ideas": [
    {
      "id": "idea-matching-on-disjoint-pairs",
      "title": "Каждой спрятанной паре заранее поставить в пару показываемую пару",
      "text": "Спрятанная пара и показанная пара не должны пересекаться. Если заранее разбить все десять пар карточек на пять непересекающихся пар пар, то ассистент сможет показать пару, заранее связанную со спрятанной, а фокусник восстановит спрятанную пару по таблице.",
      "standard_idea_ids": ["prearranged_code"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-five-pair-matching",
      "title": "Таблица из пяти пар непересекающихся пар",
      "text": "Заранее договоримся о такой таблице:\n\n\\((1,2)\\leftrightarrow(3,4)\\), \\((1,3)\\leftrightarrow(2,5)\\), \\((1,4)\\leftrightarrow(3,5)\\), \\((1,5)\\leftrightarrow(2,4)\\), \\((2,3)\\leftrightarrow(4,5)\\).\n\nВ каждой строке две пары не имеют общих карточек. Поэтому, когда зритель спрятал пару, ассистент видит все карточки из парной ей пары и указывает именно на них. Фокусник слышит две показанные карточки как неупорядоченную пару, находит её в таблице и называет парную ей пару как спрятанную.\n\nНапример, если спрятаны 1 и 4, ассистент показывает 3 и 5; если фокусник услышал 3 и 5, по таблице он отвечает: спрятаны 1 и 4. Порядок произнесения двух номеров не важен, потому что таблица использует пары, а не перестановки.",
      "standard_idea_ids": ["prearranged_code"],
