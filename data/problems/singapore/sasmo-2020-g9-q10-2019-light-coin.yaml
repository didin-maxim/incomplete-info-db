        "title": "Минимум взвешиваний для 2019 монет",
        "text": "Среди 2019 внешне одинаковых монет ровно одна фальшивая, и она легче настоящих. Настоящие монеты имеют одинаковый вес. Есть чашечные весы; за одно взвешивание можно положить на чаши любые одинаковые количества монет. Какое наименьшее число взвешиваний гарантированно позволяет найти фальшивую монету?",
