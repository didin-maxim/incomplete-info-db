      "id": "idea-ceil-log3-known-light",
      "title": "Известно, что фальшивая монета легче",
      "text": "Когда направление отклонения известно заранее, каждое взвешивание делит кандидатов на три группы: левая подозрительная группа, правая подозрительная группа или группа вне весов.",
      "standard_idea_ids": ["ternary_search", "decision_tree_lower_bound"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-split-into-three-nearly-equal-parts",
      "title": "Делить кандидатов на три части",
      "text": "На каждом шаге делим оставшиеся подозрительные монеты на три как можно равные группы. Две равные группы кладем на чаши. Если левая легче, фальшивая в левой группе; если правая легче, в правой; если весы в равновесии, фальшивая в третьей группе, которая не взвешивалась. Так за q взвешиваний можно различить до \\(3^q\\) кандидатов. Поскольку \\(3^6=729<2019\\), шести взвешиваний недостаточно, а \\(3^7=2187\\), семи достаточно. Минимум равен 7.",
