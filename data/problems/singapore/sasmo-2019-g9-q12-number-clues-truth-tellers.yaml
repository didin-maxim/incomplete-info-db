  "ideas": [
    {
      "id": "idea-second-round-small-thresholds-force-liars",
      "title": "Самые малые пороги во втором раунде вынуждают ложь",
      "text": "Так как все числа положительные, фразы «меньше 1» и «меньше 2» не могут обе принадлежать рыцарям с учетом первых утверждений; кроме того, двенадцатый не может быть рыцарем и затем сказать любую фразу вида «меньше k» при \\(k\\le 12\\).",
