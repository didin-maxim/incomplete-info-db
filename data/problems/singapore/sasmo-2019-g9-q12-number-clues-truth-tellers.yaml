  "strategies": [
    {
      "id": "str-upper-bound-and-construction-ten",
      "title": "Доказать верхнюю оценку и построить пример",
      "text": "Если двенадцатый человек рыцарь, его число больше 12. Тогда во втором раунде он не мог бы истинно произнести ни одну из фраз «мое число меньше k» для k от 1 до 12. Значит, двенадцатый - лжец. Кроме того, фразы «мое число меньше 1» и «мое число меньше 2» не могут быть истинными для людей, чьи первые фразы совместимы с положительными различными числами, поэтому по крайней мере два человека лгут. Следовательно, рыцарей не больше 10.\n\nОценка достигается, например, если первые десять людей получили числа 2,3,...,11 соответственно, одиннадцатый получил 1, а двенадцатый получил 12. Тогда десять первых участников могут во втором раунде получить истинные фразы «мое число меньше 3», ..., «мое число меньше 12», а два лжеца получают ложные фразы «мое число меньше 1» и «мое число меньше 2». Поэтому максимум равен 10.",
      "standard_idea_ids": [
        "knowledge_elimination"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "state_space"
      ]
    }
  ],
