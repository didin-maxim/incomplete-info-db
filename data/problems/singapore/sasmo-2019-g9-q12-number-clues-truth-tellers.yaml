        "id": "stmt-sasmo-2019-g9-q12",
        "title": "Двенадцать разных чисел и два раунда фраз",
        "text": "Двенадцать человек получили двенадцать различных положительных целых чисел. В первом раунде первый сказал: «Мое число больше 1», второй: «Мое число больше 2», ..., двенадцатый: «Мое число больше 12». Во втором раунде те же люди в случайном порядке сказали фразы «Мое число меньше 1», «Мое число меньше 2», ..., «Мое число меньше 12». Каждый человек либо рыцарь и всегда говорит правду, либо лжец и всегда лжет. Каково наибольшее возможное число рыцарей среди этих двенадцати человек?",
        "source_ids": [
          "src-simcc-sasmo-2019-2020-g9-book"
        ],
        "status": "ai_checked",
        "self_contained": {
