  "strategies": [
    {
      "id": "str-two-stage-rotation-and-anchor",
      "title": "Разбить повороты на три случая и закрепить один вес",
      "text": "Проведем через центр линию, как на схеме. Обозначим девять нижних позиций слева направо через \\(L_1,\\ldots,L_9\\), а девять верхних позиций слева направо через \\(U_1,\\ldots,U_9\\). В каком бы положении ни оказался поднос, ниже линии лежат все веса \\(1,2,\\ldots,9\\), поэтому их сумма равна \\(45\\). Положим на одну чашу позиции \\(L_1,L_4,L_7,U_3,U_6,U_9\\), а на другую - оставшиеся шесть нижних позиций \\(L_2,L_3,L_5,L_6,L_8,L_9\\).\n\nПри одном из трех возможных классов поворота нижние позиции \\(L_1,L_4,L_7\\) имеют веса \\(1,4,7\\), при другом - \\(2,5,8\\), при третьем - \\(3,6,9\\); верхние позиции \\(U_3,U_6,U_9\\) имеют ту же тройку весов. Поэтому в первом взвешивании получаются соответственно пары сумм \\(2(1+4+7)=24\\) и \\(45-1-4-7=33\\), затем \\(30\\) и \\(30\\), затем \\(36\\) и \\(27\\). Значит, исход первого взвешивания говорит, где находятся монеты \\(3,6,9\\): это либо позиции \\(L_1,L_4,L_7,U_3,U_6,U_9\\), либо их соседи слева по кругу, либо их соседи справа.\n\nОбозначим эти шесть найденных позиций через \\(P_0,P_1,\\ldots,P_5\\) по часовой стрелке. Веса на них идут одним из трех циклических порядков \\(3,9,6,3,9,6\\), \\(6,3,9,6,3,9\\) или \\(9,6,3,9,6,3\\). Вторым взвешиванием сравним \\(P_0+P_1\\) и \\(P_2+P_5\\). Если \\(P_0=3\\), то сравниваются \\(3+9\\) и \\(6+6\\), равновесие; если \\(P_0=6\\), то \\(6+3<9+9\\); если \\(P_0=9\\), то \\(9+6>3+3\\). Поэтому определяется вес \\(P_0\\), а затем по известной круговой раскладке восстанавливаются все остальные монеты.",
