      "id": "idea-first-weighing-finds-residue-class",
      "title": "Первое взвешивание находит класс поворота",
      "text": "Пунктирная линия делит круг так, что ниже нее лежит по одной монете каждого веса, а сумма этих девяти монет равна \\(45\\). Если нижние позиции слева направо обозначить \\(L_1,\\ldots,L_9\\), то тройка \\(L_1,L_4,L_7\\) при неизвестном повороте содержит либо \\(1,4,7\\), либо \\(2,5,8\\), либо \\(3,6,9\\). Одно сравнение этой тройки вместе с соответствующей верхней тройкой против оставшихся шести нижних позиций дает три разных исхода и определяет класс поворота.",
