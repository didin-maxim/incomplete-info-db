        "title": "Восстановить веса после поворота",
        "text": "На круглом подносе лежат 18 одинаковых на вид монет: по две монеты каждого веса от 1 до 9 граммов. Монеты разложены по кругу, как на рисунке: начиная с верхней левой монеты и двигаясь по часовой стрелке, идут веса \\(1,9,8,7,6,5,4,3,2,1,9,8,7,6,5,4,3,2\\). Затем поднос повернули, и ориентация стала неизвестна. Нужно за два взвешивания на чашечных весах без гирь определить, где какая монета.",
