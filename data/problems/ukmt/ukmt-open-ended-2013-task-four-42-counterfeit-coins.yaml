      "text": "У четырех взвешиваний есть только \\(3^4=81\\) возможная последовательность исходов. Для каждой монеты, которая хотя бы раз реально проверяется, состояния «эта монета тяжелее» и «эта монета легче» не могут всегда идти по одному и тому же пути: уже в первом взвешивании, где монета участвует, они дают противоположные отклонения. Значит, такая монета требует двух разных конечных путей, даже если в ответе нужно назвать только номер монеты. Только одна монета может вообще не участвовать в информативных сравнениях и тем самым соответствовать одному пути равновесий. Поэтому для 42 монет нужно не меньше \\(2\\cdot42-1=83\\) конечных путей, а 81 пути не хватает. Следовательно, минимум равен пяти взвешиваниям.",
