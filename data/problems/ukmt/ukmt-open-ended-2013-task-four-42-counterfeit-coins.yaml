      "id": "str-five-weighings-for-42",
      "title": "Пять взвешиваний достаточно",
      "text": "Сначала взвесим 13 монет против других 13. Если равновесие, фальшивая монета среди оставшихся 16, а все 26 взвешенных монет уже заведомо настоящие. За четыре оставшихся взвешивания эти 16 монет можно разобрать стандартным тернарным кодом: каждой подозрительной монете назначаем ненулевое слово длины 4 над \\(\\{-,0,+\\}\\), не выбирая вместе два противоположных слова; в каждом взвешивании кладем монету налево при знаке \\(+\\), направо при знаке \\(-\\), а настоящими монетами уравниваем число монет на чашах. Полученное слово исходов или противоположное ему указывает монету, а при необходимости и знак отличия.\n\nЕсли первое взвешивание не дало равновесия, фальшивая монета среди 26 взвешенных: либо тяжелая на перевесившей чаше, либо легкая на другой. Остальные 16 монет настоящие. Теперь у каждого кандидата уже известен возможный знак отличия, поэтому нужно различить только 26 состояний. За четыре взвешивания это делается любым инъективным тернарным кодом длины 4 для 26 кандидатов: если кандидат имеет знак «может быть тяжелой», кладем его на сторону, соответствующую знаку кода; если «может быть легкой», кладем на противоположную сторону, чтобы ожидаемый исход все равно совпадал с кодовым словом. Настоящие монеты снова используются только для балансировки чаш. Так пять взвешиваний гарантированно находят фальшивую монету.",
