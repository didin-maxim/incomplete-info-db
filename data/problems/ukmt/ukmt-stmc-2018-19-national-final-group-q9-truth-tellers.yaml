        "title": "Алекс, Беатрис, Чармиан и Дензил",
        "text": "Алекс, Беатрис, Чармиан и Дензил либо рыцари, либо лжецы. Однажды они сказали следующее. Алекс: «Беатрис всегда лжет». Беатрис: «Алекс и Дензил либо оба рыцари, либо оба лжецы». Чармиан: «Беатрис и Дензил либо оба лжецы, либо оба рыцари». Дензил: «Я рыцарь». Кто точно лжет?",
