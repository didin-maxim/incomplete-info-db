      "title": "Разобрать два случая для Пети",
      "text": "Если Петя правдив, то Вася лжет. Фраза Васи тогда ложна, значит Петя и Коля разных типов; раз Петя правдив, Коля лжет. Тогда фраза Толи о Васе и Коле истинна, и Толя правдив. Если Петя лжет, то Вася правдив. Тогда Петя и Коля одного типа, значит Коля тоже лжет. Фраза Толи о Васе и Коле ложна, и Толя лжет. В обоих совместимых случаях Коля лжет, а остальные могут меняться. Значит, точно лжет Коля.",
