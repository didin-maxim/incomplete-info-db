        "title": "Петя, Вася, Толя и Коля",
        "text": "Петя, Вася, Толя и Коля либо рыцари, либо лжецы. Однажды они сказали следующее. Петя: «Вася всегда лжет». Вася: «Петя и Коля либо оба рыцари, либо оба лжецы». Толя: «Вася и Коля либо оба лжецы, либо оба рыцари». Коля: «Я рыцарь». Кто точно лжет?",
