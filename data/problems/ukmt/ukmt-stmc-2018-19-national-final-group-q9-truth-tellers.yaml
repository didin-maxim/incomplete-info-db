      "title": "Разобрать два случая для Алекса",
      "text": "Если Алекс правдив, то Беатрис лжет. Фраза Беатрис тогда ложна, значит Алекс и Дензил разных типов; раз Алекс правдив, Дензил лжет. Тогда фраза Чармиан о Беатрис и Дензиле истинна, и Чармиан правдива. Если Алекс лжет, то Беатрис правдива. Тогда Алекс и Дензил одного типа, значит Дензил тоже лжет. Фраза Чармиан о Беатрис и Дензиле ложна, и Чармиан лжет. В обоих совместимых случаях Дензил лжет, а остальные могут меняться. Значит, точно лжет Дензил.",
