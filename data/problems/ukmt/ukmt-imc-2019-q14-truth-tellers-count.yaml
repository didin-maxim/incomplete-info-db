        "title": "Четыре утверждения о числе рыцарей",
        "text": "Есть четыре человека. Некоторые из них всегда говорят правду, остальные всегда лгут. Первый сказал: «Нечетное число из нас всегда говорит правду». Второй сказал: «Четное число из нас всегда говорит правду». Третий сказал: «Простое число из нас всегда говорит правду». Четвертый сказал: «Квадратное число из нас всегда говорит правду». Сколько из этих четырех человек говорили правду?",
