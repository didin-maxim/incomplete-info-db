      "id": "idea-count-must-match-predicates",
      "title": "Число рыцарей должно совпасть с числом правдивых фраз",
      "text": "Для каждого возможного числа рыцарей можно проверить четыре свойства этого числа: нечетность, четность, простоту и квадратность. Подойдет только такое число, при котором количество правдивых фраз равно самому числу рыцарей.",
