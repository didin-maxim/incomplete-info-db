      "id": "str-eliminate-one-and-confirm-two",
      "title": "Исключить один и проверить два",
      "text": "Из первых двух фраз ровно одна истинна. Из фраз про простое и квадратное число одновременно истинной может быть не более одной. Значит, рыцарей один или два. Если рыцарь только один, то число 1 нечетно и является квадратом, поэтому истинны первая и четвертая фразы, то есть рыцарей уже два; противоречие. При числе 2 истинны ровно вторая и третья фразы: 2 четно и просто, но не нечетно и не квадрат. Поэтому рыцарей ровно два.",
