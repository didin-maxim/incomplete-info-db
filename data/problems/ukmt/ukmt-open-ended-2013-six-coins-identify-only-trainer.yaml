      "title": "Равновесие быстро создает настоящие монеты",
      "text": "Если первое сравнение двух монет против двух дало равновесие, четыре взвешенные монеты становятся заведомо настоящими. Если равновесия нет, невзвешенные монеты становятся настоящими, а у четырех взвешенных кандидатов уже известен возможный знак отличия.",
