        "id": "stmt-six-coins-identify-only",
        "title": "Фальшивая монета может быть легче или тяжелее",
        "text": "Есть 6 одинаковых на вид монет. Ровно одна из них фальшивая: она отличается по весу от остальных, но заранее неизвестно, легче она или тяжелее. За три взвешивания на чашечных весах нужно гарантированно определить номер фальшивой монеты. Определять, легче она или тяжелее, не требуется.",
