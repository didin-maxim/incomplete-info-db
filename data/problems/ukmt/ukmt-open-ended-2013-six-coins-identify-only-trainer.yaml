      "title": "Скрытые состояния остаются парами, а ответ склеивает знак",
      "text": "До взвешиваний есть 12 скрытых состояний: для каждой монеты два варианта, фальшивая тяжелее или легче. Но конечный ответ проверяется только по номеру монеты, поэтому два состояния с одной и той же монетой можно считать уже разделенными достаточно, когда других номеров в ветке не осталось.",
