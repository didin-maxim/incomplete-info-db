      "id": "str-first-two-against-two",
      "title": "Стратегия за три взвешивания",
      "text": "Первым взвешиванием сравним монеты 1, 2 с монетами 3, 4.\n\nЕсли получилось равновесие, то монеты 1-4 настоящие, а фальшивая среди 5 и 6. Вторым взвешиванием сравним 5 с 1. Если равновесия нет, фальшивая монета 5; если равновесие, фальшивая монета 6. Третье взвешивание в этой ветке не нужно.\n\nЕсли первая левая чаша тяжелее, то возможны только четыре случая: 1 тяжелая, 2 тяжелая, 3 легкая, 4 легкая. Монеты 5 и 6 настоящие. Вторым взвешиванием сравним 1, 3 с 2, 5. Если левая чаша тяжелее, ответ 1; если равновесие, ответ 4. Если правая чаша тяжелее, остаются варианты 2 тяжелая или 3 легкая; тогда третьим взвешиванием сравним 1, 4 с 3, 5. Равновесие укажет на монету 2, а перевес левой чаши - на монету 3.\n\nЕсли в первом взвешивании правая чаша тяжелее, действуем симметрично: считаем монеты 3, 4 кандидатами на тяжелые, а 1, 2 - кандидатами на легкие. То есть вторым взвешиванием сравниваем 3, 1 с 4, 5; при необходимости третьим сравниваем 3, 2 с 1, 5. Так в каждой возможной ветке остается только один номер фальшивой монеты.",
      "standard_idea_ids": ["partition_state_space", "ternary_weighing_code"],
      "status": "ai_checked",
      "definition_ids": ["balance_scale", "decision_tree"]
    }
