        "id": "stmt-moebius-cupscales-2-js-model",
        "title": "Серебряные и медные монеты в интерактиве",
        "text": "В интерактиве «Взвешивания-2» пользователь выбирает число монет \\(n\\) от 3 до 30. После начала игры сайт показывает \\(n\\) пронумерованных монет двух видимых типов: серебряные и медные. Монеты разных металлов отличаются и внешне, и по массе. Ровно одна монета фальшивая; после старта условие сообщает, легче она или тяжелее настоящей монеты того же металла. Нужно найти номер фальшивой монеты за \\(\\lceil \\log_3 n\\rceil\\) взвешиваний на чашечных весах.",
        "source_ids": ["src-moebius-tour-cupscales-2"],
        "status": "source_verified",
