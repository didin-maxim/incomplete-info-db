  "strategies": [
    {
      "id": "str-balanced-ternary-search-for-site-model",
      "title": "Троичный поиск с учетом металлов",
      "text": "Пусть осталось не больше \\(3^t\\) подозрительных монет и есть \\(t\\) взвешиваний. Разобьем подозрительные монеты на три группы \\(A,B,C\\) так, чтобы в каждой группе было не больше \\(3^{t-1}\\) монет, а группы \\(A\\) и \\(B\\) можно было сравнить с одинаковой нормальной массой на чашах. В начале это удобно делать попарно внутри каждого металла: кладем поровну серебряных и поровну медных монет в \\(A\\) и \\(B\\), остальные идут в \\(C\\). Если после предыдущих взвешиваний уже есть заведомо настоящие монеты, ими можно дополнять чаши по металлам, не меняя множества подозрительных монет.\n\nВзвесим \\(A\\) против \\(B\\) с таким балластом, чтобы при настоящих монетах чаши были равны. Если фальшивая заведомо легче, то левая чаша легче означает, что фальшивая в \\(A\\); правая легче - что она в \\(B\\); равновесие - что она в \\(C\\). Если фальшивая заведомо тяжелее, направления перекоса для \\(A\\) и \\(B\\) меняются местами, а равновесие по-прежнему указывает на \\(C\\).\n\nПосле результата все монеты вне выбранной группы становятся известными настоящими. Поэтому на следующем шаге повторяем тот же прием уже внутри оставшейся группы, используя известные настоящие монеты как эталоны и балласт. Когда остается одна монета, она и есть фальшивая. Когда остается две монеты одного металла, сравниваем их между собой; когда остаются две монеты разных металлов, сравниваем одну из них с уже известной настоящей монетой того же металла, а при равновесии выбираем вторую. Так дерево решений укладывается в \\(\\lceil \\log_3 n\\rceil\\) уровней для диапазона интерактива.",
      "standard_idea_ids": ["ternary_search", "knowledge_elimination"],
      "status": "needs_human_review",
      "definition_ids": ["balance_scale", "decision_tree"]
    }
  ],
