        "id": "stmt-moebius-2022-3x3-line-fakes",
        "title": "Найти строку или столбец фальшивых монет",
        "text": "В клетках доски \\(3\\times 3\\) лежат монеты, в каждой клетке ровно одна. Шесть монет настоящие, а три фальшивые. Все настоящие монеты весят одинаково, все фальшивые тоже весят одинаково, причем фальшивые легче настоящих. Известно, что все три фальшивые монеты лежат либо в одной строке, либо в одном столбце. Внешне монеты не различимы. Как за два взвешивания на чашечных весах без гирь найти все фальшивые монеты?",
        "source_ids": ["src-moebius-tour-10-problems"],
        "status": "source_verified",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["balance_scale", "state_space", "strategy"]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-cell-separates-row-and-column",
      "title": "Одна клетка различает проходящую строку и столбец",
      "text": "Если сравнить монету в клетке \\((1,1)\\) с монетой \\((2,2)\\), то каждый из трех исходов оставляет ровно две возможные линии: строку и столбец, проходящие через более легкую клетку, или две линии, не проходящие ни через одну из этих клеток.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked"
    },
    {
      "id": "idea-second-cell-test",
      "title": "Второе сравнение выбирает из двух линий",
      "text": "Когда после первого взвешивания остались две возможные линии, достаточно сравнить две клетки одной строки или одного столбца так, чтобы одна из линий давала равенство, а другая - перекос.",
      "standard_idea_ids": ["decision_tree"],
      "status": "ai_checked"
    }
