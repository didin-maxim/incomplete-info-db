  "strategies": [
    {
      "id": "str-two-single-coin-weighings",
      "title": "Два сравнения по одной монете",
      "text": "Обозначим строки \\(R_1,R_2,R_3\\), столбцы \\(C_1,C_2,C_3\\), а клетку в строке \\(i\\) и столбце \\(j\\) через \\((i,j)\\).\n\nПервым взвешиванием сравним монету \\((1,1)\\) с монетой \\((2,2)\\).\n\nЕсли левая монета легче, то фальшивая линия проходит через \\((1,1)\\) и не проходит через \\((2,2)\\). Возможны только \\(R_1\\) и \\(C_1\\). Вторым взвешиванием сравним \\((1,1)\\) с \\((1,2)\\). При равновесии вся первая строка фальшивая; если левая монета легче, фальшивый первый столбец.\n\nЕсли правая монета легче, то аналогично возможны только \\(R_2\\) и \\(C_2\\). Вторым взвешиванием сравним \\((1,1)\\) с \\((1,2)\\). При равновесии фальшивая вторая строка, а если правая монета легче - второй столбец.\n\nЕсли первое взвешивание дало равновесие, то фальшивая линия не проходит ровно через одну из этих клеток. Так как \\((1,1)\\) и \\((2,2)\\) лежат в разных строках и разных столбцах, остаются только \\(R_3\\) и \\(C_3\\). Вторым взвешиванием сравним \\((1,1)\\) с \\((1,3)\\). При равновесии фальшивая третья строка; если правая монета легче - третий столбец. Во всех случаях после двух взвешиваний известна вся строка или весь столбец из трех фальшивых монет.",
      "standard_idea_ids": ["partition_state_space", "decision_tree"],
      "status": "ai_checked",
      "definition_ids": ["balance_scale", "strategy"]
    }
