  "statements": {"original": [{"id": "stmt-moebius-2020-baron-stacks", "title": "Три стопки и одна фальшивая монета", "text": "Перед бароном Мюнхгаузеном на столе лежат три стопки одинаковых по виду монет из 10, 13 и 2020 монет. В одной из стопок есть фальшивая монета другого веса, внешне не отличающаяся от остальных; все настоящие монеты весят одинаково. За какое наименьшее число взвешиваний на чашечных весах без гирь барон сможет найти стопку, в которой все монеты настоящие?", "source_ids": ["src-moebius-tour-5-problems"], "status": "source_verified", "self_contained": {"status": "ai_checked"}, "definition_ids": ["balance_scale", "state_space", "strategy"]}]},
  "ideas": [{"id": "idea-equality-certifies-sampled-stack", "title": "Равновесие сертифицирует всю малую стопку", "text": "Если сравнить всю 10-монетную стопку с десятью монетами из огромной стопки, то равновесие означает, что 10-монетная стопка не содержит фальшивой монеты, а перекос означает, что третья, не участвующая стопка точно настоящая.", "standard_idea_ids": ["knowledge_elimination"], "status": "ai_checked"}],
  "strategies": [{"id": "str-one-weighing-small-against-big-sample", "title": "Взвесить 10 против 10", "text": "Взвесим все 10 монет из первой стопки против любых 10 монет из стопки на 2020 монет.\n\nЕсли весы уравновесились, то в первой стопке нет фальшивой монеты: если бы она была там, сравнение с десятью настоящими монетами из большой стопки дало бы перекос; если фальшивая монета оказалась среди выбранных десяти больших монет, перекос тоже был бы. Значит, первая стопка целиком настоящая.\n\nЕсли весы не уравновесились, то фальшивая монета лежит либо в первой стопке, либо среди выбранных монет большой стопки. В любом случае стопка из 13 монет не содержит фальшивой монеты, поэтому она целиком настоящая.\n\nНоль взвешиваний не хватает: до взвешивания фальшивая монета может лежать в любой из трех стопок, и нельзя гарантированно назвать настоящую стопку.", "standard_idea_ids": ["knowledge_elimination"], "status": "ai_checked", "definition_ids": ["balance_scale", "strategy"]}],
  "impossibility_proofs": [{"id": "lb-zero-weighings-insufficient", "title": "Без взвешиваний нельзя гарантировать ответ", "text": "Если заранее назвать одну стопку настоящей, фальшивая монета могла находиться именно в ней. Значит, хотя бы одно наблюдение необходимо.", "standard_idea_ids": ["indistinguishability_argument"], "status": "ai_checked", "definition_ids": ["state_space"]}],
