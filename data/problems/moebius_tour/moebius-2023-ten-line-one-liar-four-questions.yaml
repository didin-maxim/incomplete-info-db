  "statements": {"original": [{"id": "stmt-moebius-2023-ten-line-one-liar", "title": "Найти лжеца за четыре вопроса", "text": "В ряд стоит 10 человек, среди которых девять рыцарей и один лжец. Разрешается подойти к любому человеку в ряду и задать ему вопрос: \"Среди твоих соседей есть лжец?\" После ответа можно снова задать вопрос любому человеку в ряду. Как, задав не более четырех вопросов, точно определить лжеца?", "source_ids": ["src-moebius-tour-11-problems"], "status": "source_verified", "self_contained": {"status": "ai_checked"}, "definition_ids": ["truth_teller", "liar", "state_space", "strategy"]}]},
  "ideas": [{"id": "idea-answer-is-distance-at-most-one", "title": "Ответ \"да\" означает близость к лжецу", "text": "Если спросить человека с номером \\(i\\), ответ \"да\" прозвучит ровно тогда, когда лжец стоит на позиции \\(i-1\\), \\(i\\) или \\(i+1\\). Рыцари рядом с лжецом говорят правду, а сам лжец лжет на истинный ответ \"нет\".", "standard_idea_ids": ["truth_liar_normalization", "partition_state_space"], "status": "ai_checked"}, {"id": "idea-interval-splitting", "title": "Вопросы становятся тестами трехпозиционных окон", "text": "После этого наблюдения задача превращается в адаптивный поиск одной скрытой позиции среди десяти, где разрешенный тест спрашивает, попадает ли позиция в окно длины до трех вокруг выбранного человека.", "standard_idea_ids": ["binary_search", "partition_state_space"], "status": "ai_checked"}],
  "strategies": [{"id": "str-four-window-questions", "title": "Дерево из четырех вопросов", "text": "Пронумеруем людей слева направо от 1 до 10. Вопрос человеку \\(i\\) проверяет, находится ли лжец среди \\(i-1,i,i+1\\), с учетом концов ряда.\n\nСпросим человека 2. Если он ответил \"да\", лжец среди 1, 2, 3. Тогда спросим человека 1. Ответ \"нет\" сразу дает лжеца 3. При ответе \"да\" остаются 1 и 2; спросим человека 3. Ответ \"да\" дает лжеца 2, ответ \"нет\" - лжеца 1.\n\nЕсли человек 2 ответил \"нет\", спросим человека 5. Ответ \"да\" оставляет 4, 5, 6. Тогда спросим человека 3: при \"да\" лжец 4, при \"нет\" остаются 5 и 6; спросим человека 4, и ответ \"да\" дает 5, а \"нет\" дает 6.\n\nЕсли на вопросы к 2 и 5 получены ответы \"нет\", лжец среди 7, 8, 9, 10. Спросим человека 7. При ответе \"да\" остаются 7 и 8; спросим человека 6, и ответ \"да\" дает 7, а \"нет\" дает 8. При ответе \"нет\" остаются 9 и 10; спросим человека 8, и ответ \"да\" дает 9, а \"нет\" дает 10.", "standard_idea_ids": ["partition_state_space", "binary_search"], "status": "ai_checked", "definition_ids": ["truth_teller", "liar", "strategy"]}],
