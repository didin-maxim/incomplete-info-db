  "strategies": [{"id": "str-ask-one-person-about-first-two-coins", "title": "Спросить одного человека о первой и второй монете", "text": "Занумеруем монеты 1, 2, 3. Спросим Васю, есть ли фальшивая монета среди одной монеты 1. Затем спросим того же Васю, есть ли фальшивая монета среди одной монеты 2.\n\nЕсли ответы одинаковые, то монета 1 настоящая. Ответы \"да, да\" не мог дать рыцарь, поэтому Вася лжец и обе монеты 1 и 2 настоящие. Ответы \"нет, нет\" не мог дать лжец, поэтому Вася рыцарь и фальшива монета 3.\n\nЕсли ответы разные, то монета 3 настоящая. При ответах \"да, нет\" возможны только два случая: Вася рыцарь и фальшива монета 1, или Вася лжец и фальшива монета 2. При ответах \"нет, да\" симметрично фальшива либо 2, либо 1. В обоих разных случаях третья монета настоящая.", "standard_idea_ids": ["knowledge_elimination"], "status": "ai_checked", "definition_ids": ["truth_teller", "liar", "strategy"]}],
