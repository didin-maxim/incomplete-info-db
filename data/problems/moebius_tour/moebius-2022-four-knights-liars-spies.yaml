  "statements": {"original": [{"id": "stmt-moebius-2022-four-spies", "title": "Определить шпионов", "text": "Четверо рыцарей и лжецов - А, Б, В и Г - знают, что в их компании завелись шпионы, от одного до четырех. Между ними состоялся разговор. А: \"Я не шпион. Среди нас 2 лжеца\". Б: \"В точно шпион. Шпионов не больше 3\". В: \"А - шпион. Шпионов трое\". Г: \"Шпион только один. Все шпионы - лжецы\". Определите, кто из этих четверых шпионы.", "source_ids": ["src-moebius-tour-9-problems"], "status": "source_verified", "self_contained": {"status": "ai_checked"}, "definition_ids": ["truth_teller", "liar", "state_space"]}]},
  "ideas": [{"id": "idea-two-sentences-per-person", "title": "Каждый человек задает две булевы проверки", "text": "Рыцарь должен сказать две истинные фразы, а лжец - две ложные. Поэтому можно проверять совместимость числа лжецов, числа шпионов и принадлежности конкретных людей к шпионам одновременно.", "standard_idea_ids": ["knowledge_elimination"], "status": "ai_checked"}],
  "strategies": [{"id": "str-full-state-check", "title": "Проверить совместимость ролей", "text": "Единственный совместимый вариант такой: А и Б - рыцари, В и Г - лжецы; шпионы - Б и В.\n\nПроверка. А говорит правду: он не шпион, и лжецов ровно двое. Б говорит правду: В шпион, и шпионов не больше трех. В лжет в обеих фразах: А не шпион, и шпионов не трое. Г тоже лжет в обеих фразах: шпионов не один, и не все шпионы лжецы, потому что Б - рыцарь-шпион.\n\nПочему других вариантов нет: если человек рыцарь, обе его фразы истинны; если лжец, обе ложны. Перебор по числу лжецов и числу шпионов быстро отсекает все случаи. В частности, Г не может быть рыцарем, иначе шпион был бы ровно один и лжецом, что конфликтует с остальными репликами. Тогда фразы Г ложны, значит шпионов не один и среди них есть рыцарь. Фразы В не могут быть истинными одновременно с этим и с репликами А, Б, поэтому В лжец. После этого фраза А о двух лжецах истинна, а из слов Б следует, что второй шпион - В; рыцарь-шпион тогда обязан быть Б.", "standard_idea_ids": ["knowledge_elimination"], "status": "ai_checked", "definition_ids": ["truth_teller", "liar"]}],
