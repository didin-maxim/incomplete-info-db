      "title": "Первая фраза заставляет каждую парту быть смешанной",
      "text": "Фраза «я сижу рядом с лжецом» истинна для рыцаря ровно тогда, когда его сосед - лжец, а для лжеца она должна быть ложной, значит его сосед тоже не лжец. Поэтому за каждой партой сначала сидят один рыцарь и один лжец.",
      "standard_idea_ids": ["partition_state_space"],
