        "id": "stmt-cmo-2015-7-4",
        "title": "Сначала рядом с лжецом, потом рядом с рыцарем",
        "text": "В классе 26 учащихся. Они договорились, что каждый из них будет либо лжецом, который всегда лжет, либо рыцарем, который всегда говорит правду. Когда они пришли в класс и сели за парты, каждый сказал: «Я сижу рядом с лжецом». Затем некоторые учащиеся пересели за другие парты. Мог ли после этого каждый сказать: «Я сижу рядом с рыцарем»? Каждый раз за любой партой сидело ровно двое учащихся.",
