    {
      "id": "idea-second-seating-needs-even-equal-pairs",
      "title": "Вторая фраза потребовала бы пар одного типа",
      "text": "Фраза «я сижу рядом с рыцарем» может быть произнесена рыцарем только рядом с рыцарем, а лжецом - только рядом с лжецом. После пересадки все парты должны были бы разбиться на пары RR и LL, но рыцарей и лжецов по 13, а 13 не делится на 2.",
