      "id": "str-count-types-at-desks",
      "title": "Посчитать типы по партам",
      "text": "Из первой рассадки следует, что каждая парта смешанная: рыцарь не может сидеть рядом с рыцарем, иначе его первая фраза была бы ложной; лжец не может сидеть рядом с лжецом, иначе его первая фраза была бы истинной. Значит, в классе 13 рыцарей и 13 лжецов.\n\nВо второй рассадке фраза «я сижу рядом с рыцарем» означает обратное: рыцарь должен сидеть рядом с рыцарем, а лжец - рядом с лжецом. Тогда всех 13 рыцарей нужно разбить на пары и всех 13 лжецов тоже нужно разбить на пары, что невозможно из-за нечетности. Поэтому такая пересадка невозможна.",
