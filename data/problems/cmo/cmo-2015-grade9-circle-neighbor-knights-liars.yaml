      "title": "Оценка сверху и пример на 9",
      "text": "Предположим, что требуемую фразу сказали все 10 человек. Так как за столом есть хотя бы один рыцарь и хотя бы один лжец, где-то по кругу сидят рядом рыцарь и лжец. Тогда у этого рыцаря не оба соседа являются рыцарями, поэтому он не мог правдиво сказать указанную фразу. Противоречие, значит больше 9 человек сказать ее не могут.\n\nПример на 9 получается так: посадим за стол одного рыцаря и девять лжецов. Каждый лжец имеет хотя бы одного соседа-лжеца, поэтому фраза «оба моих соседа - рыцари» для него ложна, и он может ее произнести. Так фразу произносят все девять лжецов.",
