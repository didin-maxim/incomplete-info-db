      "title": "Девять лжецов и один рыцарь достигают оценки",
      "text": "Если за столом один рыцарь и девять лжецов, то каждый лжец, не сидящий напротив особого запрета, может ложно сказать, что оба его соседа - рыцари: у каждого лжеца среди соседей есть лжец. Все девять лжецов могут произнести фразу, а рыцарь не обязан ее произносить.",
