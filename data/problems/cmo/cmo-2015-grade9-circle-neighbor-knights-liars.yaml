        "id": "stmt-cmo-2015-9-1",
        "title": "Сколько человек могли сказать фразу о двух соседях",
        "text": "За круглым столом сидят 10 человек, некоторые из них - рыцари, а остальные - лжецы; рыцари всегда говорят правду, а лжецы всегда лгут. Известно, что среди них есть хотя бы один рыцарь и хотя бы один лжец. Какое наибольшее число из сидящих за столом может сказать: «Оба моих соседа - рыцари»? Ложным считается утверждение, которое хотя бы частично не является верным.",
