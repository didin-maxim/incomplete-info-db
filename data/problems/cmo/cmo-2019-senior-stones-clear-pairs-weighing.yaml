        "id": "stmt-cmo-2019-senior-day1-4",
        "title": "Минимум пар, чей порядок по весу можно выяснить",
        "text": "У Димы есть 100 камней, никакие два из которых не равны по массе. Также у него есть странные двухчашечные весы, на каждую чашку которых можно класть ровно 10 камней. Назовем пару камней ясной, если Дима может выяснить, какой из камней в этой паре тяжелее. Каково наименьшее возможное количество ясных пар?",
        "source_ids": ["src-cmo-2019-problems", "src-cmo-2019-day1-solutions"],
        "status": "source_verified",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["balance_scale", "state_space"]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-bad-pairs-form-cliques",
      "title": "Неразличимые пары образуют компоненты-клики",
      "text": "Назовем пару плохой, если порядок ее двух камней нельзя выяснить. Официальное решение показывает критерий: пара плохая тогда и только тогда, когда при любом допустимом взвешивании перестановка этих двух камней не меняет исход. Из этого сразу следует транзитивность плохости: если X неотличим от Y, а X неотличим от Z, то Y неотличим от Z.",
      "standard_idea_ids": ["indistinguishable_states"],
      "status": "ai_checked"
    },
    {
      "id": "idea-any-ten-pairs-among-twenty-has-clear",
      "title": "Среди десяти пар двадцати камней одна обязана быть ясной",
      "text": "Для любых 20 камней, разбитых на 10 пар, можно взвесить первые элементы всех пар против вторых. Если после последовательной замены пар исход должен в конце стать противоположным, то на каком-то шаге исход меняется, и соответствующая пара становится ясной. Если исход был равновесием, замена любой пары нарушает его и тоже выявляет порядок в этой паре.",
      "standard_idea_ids": ["indistinguishable_states"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-count-bad-components",
      "title": "Максимизировать число плохих пар",
      "text": "Ответ удобно получить через плохие пары. Плохая пара - это такая пара камней, порядок которой нельзя выяснить никакой последовательностью допустимых сравнений. По критерию из решения, если перестановка двух камней когда-нибудь меняет исход взвешивания, то порядок этих двух камней можно восстановить; если не меняет ни в одном взвешивании, пара плохая. Отсюда плохие пары образуют компоненты, каждая из которых является полным графом.\n\nДля любых 20 камней \\(A_1,\\ldots,A_{20}\\) среди пар \\(A_1A_2,A_3A_4,\\ldots,A_{19}A_{20}\\) хотя бы одна ясная. Взвесим \\(A_1,A_3,\\ldots,A_{19}\\) против \\(A_2,A_4,\\ldots,A_{20}\\). Если равновесие, замена любой пары разрушает равновесие и выявляет ее порядок. Если одна чаша тяжелее, будем менять пары по одной; после всех десяти замен знак перевеса станет противоположным, значит на каком-то шаге исход изменится, и соответствующая пара ясная.\n\nЗначит, в графе плохих пар нет паросочетания из 10 ребер: иначе эти 10 попарно не пересекающихся плохих пар дали бы 20 камней, среди которых одна из выбранных пар обязана быть ясной. Так как каждая компонента плохих пар является кликой размера \\(n_i\\), максимальное паросочетание в ней имеет размер \\(\\lfloor n_i/2\\rfloor\\). Поэтому \\(\\sum_i \\lfloor n_i/2\\rfloor\\le 9\\). При фиксированной этой сумме число плохих пар \\(\\sum_i \\binom{n_i}{2}\\) максимально, когда одна компонента имеет размер 19, а остальные компоненты одноэлементные. Следовательно, плохих пар не больше \\(\\binom{19}{2}=171\\), а ясных пар не меньше \\(\\binom{100}{2}-171=4779\\).\n\nЭта оценка достигается: возьмем 81 легкий камень масс \\(100,200,400,\\ldots,2^{80}\\cdot100\\) и 19 тяжелых камней масс \\(2^{100}+1,\\ldots,2^{100}+19\\). Любое сравнение двух десяток определяется главным образом тем, сколько тяжелых камней на чашах; если тяжелых поровну, различия легких степеней двойки не позволяют отличить перестановку двух тяжелых камней. Поэтому любые два тяжелых камня образуют плохую пару, а все остальные пары ясные. Получаем ровно \\(171\\) плохую пару и \\(4779\\) ясных пар.",
      "standard_idea_ids": ["indistinguishable_states"],
      "status": "ai_checked",
      "definition_ids": ["balance_scale", "state_space"]
    }
  ],
