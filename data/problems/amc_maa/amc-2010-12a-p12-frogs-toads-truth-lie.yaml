      "id": "str-truth-table-for-two-types",
      "title": "Построить таблицу для правдивого и лжеца",
      "text": "Пусть нужно проверить, ведет ли левая табличка к верной дороге. Спрашиваем: «Если бы я спросил тебя, верно ли указывает левая табличка, ты ответил бы “да”?»\n\nЕсли существо лягушка, оно честно сообщает свой прямой ответ, поэтому «да» означает, что левая табличка верна. Если существо жаба, то на прямой вопрос она ответила бы «да» ровно тогда, когда левая табличка неверна; но теперь она лжет о своем ответе на этот прямой вопрос. Поэтому ее фактическое «да» снова означает, что левая табличка верна. В обоих случаях ответ имеет одну и ту же интерпретацию.",
