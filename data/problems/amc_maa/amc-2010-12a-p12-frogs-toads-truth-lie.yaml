      "title": "Спросить о том, что сказал бы сам собеседник",
      "text": "Прямой вопрос о дороге ненадежен: лягушка ответит правильно, а жаба инвертирует ответ. Если спросить о собственном будущем ответе собеседника, то у жабы возникает двойная инверсия: она солжет и о дороге, и о том, какой ответ дала бы.",
