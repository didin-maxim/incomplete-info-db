        "id": "stmt-amc-2011-10a-p21",
        "title": "Десять монет, две фальшивые, равновесие двух выбранных",
        "text": "Есть 10 монет, среди них ровно 2 фальшивые. Все настоящие монеты имеют один вес, все фальшивые - другой вес. Случайно выбирают две монеты и кладут по одной на каждую чашу весов. Весы показывают равновесие. Нужно найти вероятность того, что обе выбранные монеты фальшивые.",
        "source_ids": ["src-aops-2011-amc10a-p21-index"],
        "status": "ai_checked",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["state_space"]
      }
    ]
  },
  "ideas": [
    {
      "id": "idea-condition-on-balance",
      "title": "Равновесие отбрасывает часть равновероятных скрытых случаев",
      "text": "До взвешивания все пары выбранных монет равновероятны. Равновесие возможно только в двух случаях: обе монеты настоящие или обе фальшивые. Пары с одной настоящей и одной фальшивой отбрасываются наблюдением весов.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-count-balanced-cases",
      "title": "Посчитать только случаи, совместимые с наблюдением",
      "text": "Всего после наблюдения равновесия возможны только пары одного типа. Пар из двух настоящих монет \\(\\binom{8}{2}=28\\), потому что настоящих монет восемь. Пар из двух фальшивых монет \\(\\binom{2}{2}=1\\).\n\nСреди \\(28+1=29\\) пар, совместимых с равновесием, только одна состоит из двух фальшивых монет. Поэтому искомая условная вероятность равна \\(1/29\\).",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["state_space"]
    }
  ],
