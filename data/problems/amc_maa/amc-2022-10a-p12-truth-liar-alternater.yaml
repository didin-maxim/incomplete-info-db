  "ideas": [
    {
      "id": "idea-alternater-forces-one-true-one-false",
      "title": "Одинаковый вопрос разделяет три типа по парам ответов",
      "text": "На вопрос «Ты правдивец?» правдивец дважды отвечает «да», лжец дважды тоже отвечает «да», потому что правдивый ответ для него был бы «нет». Чередующийся на два одинаковых вопроса дает один ответ «да» и один ответ «нет». Поэтому только чередующиеся меняют вклад в число ответов «да» между первым и вторым раундом.",
      "standard_idea_ids": ["knowledge_elimination"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-count-stable-and-changing-yeses",
      "title": "Сравнить стабильные и меняющиеся ответы",
      "text": "Правдивцы и лжецы на оба вопроса отвечают «да», значит каждый такой ребенок добавляет по одному «да» и в первом, и во втором раунде. Чередующийся ребенок дает ровно один ответ «да» за два раунда: либо в первом, либо во втором.\n\nВсего за два раунда прозвучало 22 + 15 = 37 ответов «да». Если не чередующихся детей было \\(n\\), они дали \\(2n\\) ответов «да», а чередующиеся дали \\(31-n\\) ответов «да». Поэтому \\(2n + (31-n) = 37\\), откуда \\(n=6\\). Значит чередующихся могло быть \\(31-6=25\\).",
      "standard_idea_ids": ["knowledge_elimination"],
      "status": "ai_checked",
      "definition_ids": ["state_space"]
    }
