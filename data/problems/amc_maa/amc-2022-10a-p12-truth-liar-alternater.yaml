        "id": "stmt-amc-2022-10a-p12",
        "title": "Сколько детей могло быть чередующимися",
        "text": "В комнате 31 ребенок. Каждый ребенок принадлежит к одному из трех типов: правдивец всегда говорит правду, лжец всегда лжет, а чередующийся при последовательных вопросах попеременно говорит правду и ложь. Каждому ребенку дважды подряд задали один и тот же вопрос: «Ты правдивец?» Сначала 22 ребенка ответили «да», потом 15 детей ответили «да». Нужно определить наибольшее возможное число чередующихся детей.",
        "source_ids": ["src-maa-2022-amc10a-problems", "src-aops-2022-amc10a-p12-index"],
