        "title": "Пять друзей отвечают детективу",
        "text": "Шесть друзей играют в детективов и шпионов. Один выбран детективом и ненадолго выходит из комнаты. Остальные пятеро выбирают среди себя двух шпионов. Шпионы всегда лгут, а все остальные всегда говорят правду. Детектив возвращается и слышит ответы: Аля (номер 1): \"Доминик - шпион\"; Бартек (номер 2): \"Целина не шпион\"; Целина (номер 4): \"Бартек точно не шпион\"; Доминик (номер 8): \"Эдек не шпион\"; Эдек (номер 16): \"Бартек - шпион\". Найдите сумму номеров шпионов.",
