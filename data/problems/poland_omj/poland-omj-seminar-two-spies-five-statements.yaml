      "text": "Из слов Али следует, что Аля и Доминик имеют разные роли. Из ответов Бартека и Целины следует, что Бартек и Целина имеют одну роль. Из ответа Доминика следует, что Доминик и Эдек имеют одну роль, а из ответа Эдека - что Эдек и Бартек имеют разные роли. Если Бартек и Целина оба шпионы, то вместе с Алей получается уже три шпиона, что запрещено. Значит, Бартек и Целина говорят правду, а шпионы - Доминик и Эдек. Их номера дают сумму \\(8+16=24\\).",
