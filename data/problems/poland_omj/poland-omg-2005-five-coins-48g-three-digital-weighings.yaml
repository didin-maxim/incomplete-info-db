        "title": "Пять монет, две из них легче",
        "text": "Настоящая монета весит 10 граммов, а фальшивая - 9 граммов. Даны 5 монет суммарным весом 48 граммов и электронные весы: за одно взвешивание можно положить на весы любой выбранный набор монет и узнать его суммарный вес. Можно ли не более чем за 3 взвешивания всегда определить, какие монеты фальшивые, а какие настоящие?",
