      "text": "Обозначим монеты A, B, C, D, E и назначим им столбцы \\(000,100,010,001,111\\). В первом взвешивании кладем монеты B и E, во втором - C и E, в третьем - D и E. Для каждого взвешивания сравниваем фактический вес с весом, который был бы у этих монет, если бы все они были настоящими; получаем число фальшивых монет в соответствующем наборе. Тройка таких дефицитов равна сумме двух столбцов фальшивых монет. Все 10 попарных сумм выбранных столбцов различны, поэтому пара фальшивых монет определяется однозначно.",
