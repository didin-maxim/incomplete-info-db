        "id": "stmt-lktg-2008-3-2",
        "title": "Грубая серийная верхняя оценка",
        "text": "Докажите, что тремя детекторами, из которых один сломан, можно найти одну фальшивую монету из \\(2^k\\) монет за \\(2k+1\\) тестирование. Докажите также, что тремя парами чашечных весов, из которых одна сломана, можно найти одну легкую фальшивую монету из \\(3^k\\) монет за \\(2k+1\\) взвешивание.",
