        "status": "ai_checked",
        "self_contained": {"status": "ai_checked"},
        "definition_ids": ["balance_scale", "strategy"]
      },
      {
        "id": "stmt-lktg-2008-3-3",
        "title": "Улучшение на квадратах степеней",
        "text": "Докажите, что \\(3^{2k}\\) монет можно обработать тремя весами с одним сломанным за \\(3k+1\\) взвешивание. Аналогично докажите, что \\(2^{2k}\\) монет можно обработать тремя детекторами с одним сломанным за \\(3k+2\\) тестирования.",
