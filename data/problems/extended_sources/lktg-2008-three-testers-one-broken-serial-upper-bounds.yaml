      "id": "idea-induction-reuses-small-cases",
      "title": "Индукция повторяет малые конструкции",
      "text": "Для оценки \\(2k+1\\) первый шаг либо честно делит кандидатов пополам или на три части, либо обнаруживает, что третий прибор исправен. Улучшенная оценка строит блоки из двух разрядов и повторяет конструкцию для 9 или 81 монеты.",
