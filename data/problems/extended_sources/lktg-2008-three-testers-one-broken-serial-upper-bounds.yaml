      "id": "str-induction-2k-plus-1",
      "title": "Индукция для оценки \\(2k+1\\)",
      "text": "Для детекторов база \\(k=1\\) получается проверкой одной монеты всеми тремя детекторами. Для перехода проверим половину монет первыми двумя детекторами. Если ответы совпали, они истинны, и задача сведена к \\(2^t\\) монетам. Если ответы различны, один из первых двух детекторов сломан, значит третий исправен; им обычным двоичным поиском завершаем задачу. Для весов та же схема использует деление на три равные группы и обычный троичный поиск исправными весами.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["strategy", "balance_scale"]
    },
    {
      "id": "str-square-power-recursion",
      "title": "Блоки по два разряда",
      "text": "Улучшение \\(3^{2k}\\) за \\(3k+1\\) для весов получается индукцией, где база \\(k=1\\) - задача о 9 монетах за 4 взвешивания, а переход повторяет идею задачи о 81 монете: первые проверки выделяют надежные эталоны или исправный прибор, затем остается меньшая задача. Детекторная оценка \\(2^{2k}\\) за \\(3k+2\\) строится аналогично от конструкции для 8 монет.",
