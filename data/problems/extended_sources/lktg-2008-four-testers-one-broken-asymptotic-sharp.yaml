      "id": "proof-four-testers-asymptotic-lower-bound",
      "title": "Добавка \\(\\log k\\) неизбежна",
      "text": "Нижняя оценка не зависит от того, что приборов ровно четыре. Если протокол из \\(d\\) детекторных тестов всегда находит фальшивую монету, то для фиксированной монеты есть как минимум \\(d+1\\) совместимых строк ответов: все ответы правдивы или ровно один из \\(d\\) ответов дан сломанным детектором. Разные монеты не могут иметь общую итоговую строку, значит \\(n(d+1)\\le 2^d\\). Для \\(n=2^k\\) и \\(d=k+s\\) это дает \\(2^s\\ge k+s+1\\), откуда \\(s\\ge \\log_2 k-O(1)\\). В весовой модели у одного хода три исхода, а для фиксированной монеты есть \\(2d+1\\) совместимых строк: все ответы верны или один из \\(d\\) ответов сломанного прибора заменен одним из двух неверных исходов. Поэтому \\(n(2d+1)\\le 3^d\\). При \\(n=3^k\\), \\(d=k+s\\) получаем \\(3^s\\ge 2(k+s)+1\\), то есть \\(s\\ge \\log_3 k-O(1)\\). Эти оценки совпадают с верхними формулами до ограниченной добавки.",
