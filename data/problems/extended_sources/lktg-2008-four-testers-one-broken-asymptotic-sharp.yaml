        "id": "stmt-lktg-2008-4-4",
        "title": "Асимптотика для четырех детекторов и четырех весов",
        "text": "Докажите точные формулы, из которых следуют асимптотики для четырех приборов с одним сломанным. Для четырех детекторов пусть \\(t_d\\) - наименьшее целое число, для которого \\(2^{t_d}\\ge k+t_d+1\\). Докажите, что одну фальшивую монету из \\(2^k\\) можно гарантированно найти ровно за \\(D_{4,1}(2^k)=k+t_d\\) тестирований; в частности, \\(D_{4,1}(2^k)=k+\\log_2 k+O(1)\\). Для четырех пар чашечных весов пусть \\(t_b\\) - наименьшее целое число, для которого \\(3^{t_b}\\ge 2(k+t_b)+1\\). Докажите, что одну легкую фальшивую монету из \\(3^k\\) можно гарантированно найти ровно за \\(B_{4,1}(3^k)=k+t_b\\) взвешиваний; в частности, \\(B_{4,1}(3^k)=k+\\log_3 k+O(1)\\).",
