    {
      "id": "str-four-balances-asymptotic",
      "title": "Весы: троичное деление значимости",
      "text": "Пусть \\(t\\) - наименьшее целое число, для которого \\(3^t\\ge 2(k+t)+1\\). Тогда \\(B_{4,1}(3^k)=k+t\\). Нижняя оценка получается из \\(3^k(2d+1)\\le 3^d\\): при \\(d=k+t-1\\) нужно было бы \\(3^{t-1}\\ge 2(k+t-1)+1\\), что запрещено минимальностью \\(t\\). Верхняя оценка повторяет детекторный метод, но с троичным потенциалом. За \\(m\\) взвешиваний до конца подозреваемая монета имеет вес \\(2m+1\\), почти исключенная - 1, стандартная - 0; общий потенциал должен быть не больше \\(3^m\\), а почти исключенных типов - не больше трех. Используем весы такого типа, которого нет среди почти исключенных. Если монеты разбиты на три исходные группы, то для подозреваемой монеты сумма вкладов по трем возможным исходам равна \\((2m-1)+1+1=2m+1\\), а почти исключенная сохраняется только в одной ветви; значит сумма трех новых потенциалов равна старому. Поэтому достаточно разбить монеты на три группы так, чтобы каждая ветвь имела потенциал не выше \\(3^{m-1}\\), каждая группа содержала старые почти исключенные не более двух типов, и две группы можно было сделать равномощными для сравнения на чашах весов. Типовое распределение обеспечивает лемма о трех автобусах: для трех классов \\(a_1\\le a_2\\le a_3\\) и емкостей \\(b_1\\le b_2\\le b_3\\) такое распределение существует тогда и только тогда, когда \\(b_1+b_2\\ge a_1\\). Первые \\(k\\) взвешиваний делят подозреваемые и почти исключенные монеты на три равные части; после них остается одна подозреваемая монета, а после первых двух ходов уже есть запас стандартных монет, достаточный для выравнивания чаш. Далее подозреваемых монет всегда не больше одной. Если ее нет, почти исключенные можно разделить на три почти равные группы; две группы, если нужно, доводятся до равного размера стандартными монетами. Если подозреваемая монета есть, кладем ее в первую группу. Тогда для старых почти исключенных доступны емкости \\(A=3^{m-1}-(2m-1)\\) в первой группе и \\(B=3^{m-1}-1\\) во второй и третьей: в первой ветви подозреваемая даст вклад \\(2m-1\\), в двух других ветвях она станет почти исключенной и даст вклад 1. Из инварианта следует, что число старых почти исключенных \\(R\\le A+2B\\). При этих емкостях сумма двух меньших емкостей больше трети общей емкости, а наименьший из трех типов имеет размер не больше \\(R/3\\); следовательно, лемма о трех автобусах позволяет разложить почти исключенные монеты так, чтобы ни одна группа не содержала все три старых типа. Стандарты добавляются только для физического выравнивания двух чаш и не меняют потенциал. Так каждый шаг переводит инвариант \\(3^m\\) в \\(3^{m-1}\\), что дает алгоритм за \\(k+t\\) взвешиваний.",
      "standard_idea_ids": ["counting_bound", "partition_state_space", "ternary_weighing_code"],
      "status": "ai_checked",
