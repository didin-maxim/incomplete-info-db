  "ideas": [
    {
      "id": "idea-four-testers-significance-balanced-splitting",
      "title": "Делить не монеты, а значимость оставшихся ситуаций",
      "text": "Правильная добавка появляется уже в нижней оценке: если весь протокол имеет длину \\(d\\), то для каждой монеты есть не один, а \\(d+1\\) или \\(2d+1\\) совместимых протоколов ответов, потому что один прибор мог быть сломан. Верхняя оценка строит почти равномерное деление не по числу монет, а по потенциалу. Монета бывает подозреваемой, если она совместима со всеми исправными ответами; почти исключенной типа \\(i\\), если для нее пришлось бы считать сломанным ровно \\(i\\)-й прибор; и надежно исключенной, если нужны два сломанных прибора. Подозреваемая монета получает вес, зависящий от числа оставшихся ходов, почти исключенная - вес 1, надежно исключенная - 0. На каждом шаге выбирают прибор того типа, которого сейчас нет среди почти исключенных монет, и разбивают текущие монеты так, чтобы после любого ответа потенциал попадал в следующий лимит, а почти исключенные монеты по-прежнему имели не более трех типов.",
      "standard_idea_ids": ["counting_bound", "partition_state_space"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-four-detectors-asymptotic",
      "title": "Детекторы: три типа почти исключенных монет",
      "text": "Пусть \\(t\\) - наименьшее целое число, для которого \\(2^t\\ge k+t+1\\). Тогда \\(D_{4,1}(2^k)=k+t\\). Нижняя оценка следует из \\(2^k(d+1)\\le 2^d\\): при \\(d=k+t-1\\) потребовалось бы \\(2^{t-1}\\ge k+t\\), что противоречит минимальности \\(t\\). Для верхней оценки в момент, когда осталось \\(m\\) тестирований, задаем потенциал: подозреваемая монета имеет вес \\(m+1\\), почти исключенная монета - вес 1, стандартная - вес 0. Инвариант: общий потенциал не превосходит \\(2^m\\), а почти исключенные монеты имеют не более трех типов. При тестировании прибором типа, отсутствующего среди почти исключенных, сумма потенциалов двух возможных новых ситуаций равна старому потенциалу: подозреваемая монета дает вклады \\(m\\) и 1, почти исключенная сохраняется ровно в одной ветви. Поэтому остается разложить монеты на две группы с потенциалами не выше \\(2^{m-1}\\) и с не более чем двумя старыми типами почти исключенных в каждой группе. Тогда после ответа в выбранной группе останутся эти старые типы, а из подозреваемых вне выбранной группы появится один новый тип; всего типов будет не больше трех. Нужное распределение старых типов дает лемма о двух автобусах: если классы имеют размеры \\(a_1\\le a_2\\le a_3\\), а две емкости \\(b_1\\le b_2\\) покрывают всех, то распределить классы так, чтобы в каждом автобусе было не более двух классов, можно тогда и только тогда, когда \\(b_1\\ge a_1\\). Первые \\(k\\) тестов делят подозреваемые монеты пополам и одновременно распределяют почти исключенные по этой лемме; после них остается одна подозреваемая монета. В оставшиеся ходы, если подозреваемой монеты уже нет, почти исключенные делятся почти пополам. Если подозреваемая монета есть, ее кладут в первую группу; к ней можно добавить до \\(2^{m-1}-m\\) почти исключенных. Если лемма о двух автобусах не применима, то каждого из трех типов больше чем \\(2^{m-1}-m\\), и потенциал был бы больше \\((m+1)+3(2^{m-1}-m+1)=2^m+(2^{m-1}-2m+4)>2^m\\), что противоречит инварианту. Значит шаг всегда выполним, и за \\(k+t\\) тестов монета определяется.",
      "standard_idea_ids": ["counting_bound", "partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["strategy", "information_lower_bound"]
