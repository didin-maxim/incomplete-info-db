      "title": "Аргумент через монеты, которым проверка не отказала",
      "text": "Назовем, что проверка отказала монете, если ее ответ исключает эту монету при условии исправности прибора. Если за \\(k+1\\) ходов можно было бы найти фальшивую монету, то после первых двух ходов для детекторов оставалось бы не больше \\(2^{k-1}\\) кандидатов, а для весов - не больше \\(3^{k-1}\\). Но первый ход при некотором ответе не отказывает хотя бы половине монет в детекторной модели и хотя бы трети монет в весовой модели; второй ход при некотором ответе не отказывает еще какой-нибудь монете. Значит, после двух ходов остается строго больше допустимой доли кандидатов. Это противоречит возможности завершить поиск оставшимися \\(k-1\\) ходами.",
