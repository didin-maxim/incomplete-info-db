    {
      "id": "idea-connectivity-certificate-by-queries",
      "title": "Связность как сертификат из ответов на запросы",
      "text": "Поскольку каждый тест может подтвердить связность только одной пары узлов, положительные ответы образуют обычный граф сертификата на узлах сети. Чтобы из этих ответов следовала связность всех узлов, граф проверенных пар сам должен быть связным.",
      "standard_idea_ids": ["decision_tree_lower_bound"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-test-a-spanning-tree",
      "title": "Проверить пары, образующие дерево",
      "text": "Для решетки \\(3\\times3\\) есть 16 узлов. Выберем любые 15 пар узлов, которые образуют связное дерево на этих 16 узлах, и проверим их. Например, можно идти змейкой по всем узлам решетки и каждый раз проверять соседнюю пару в этой цепочке. Все ответы будут положительными, потому что техник уже знает, что сеть связна. Из положительных ответов по ребрам дерева сразу следует, что любой узел соединен с любым другим через цепочку уже проверенных положительных связей. Значит, 15 тестов достаточно.\n\nДля решетки \\(5\\times5\\) узлов 36, и тем же способом достаточно 35 тестов: проверяем пары вдоль любого дерева, проходящего по всем 36 узлам.",
      "standard_idea_ids": ["decision_tree_lower_bound"],
      "status": "ai_checked",
      "definition_ids": ["strategy"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "lb-spanning-tree-tests-necessary",
      "title": "Почему меньше тестов не хватит",
      "text": "После \\(k\\) положительных тестов построим вспомогательный граф: его вершины - узлы сети, а ребра - проверенные пары. Если \\(k<n-1\\), где \\(n\\) - число узлов, этот граф не может быть связным. Тогда его вершины можно разбить на две непустые части так, что ни одна проверенная пара не идет между частями. Набор ответов на уже сделанные тесты был бы таким же, если бы внутри каждой части все узлы были соединены, а между частями исправных проводов не было. Значит, по таким ответам еще нельзя доказать связность всей сети. Нужно не меньше \\(n-1\\) тестов: для 16 узлов это 15, для 36 узлов это 35.",
