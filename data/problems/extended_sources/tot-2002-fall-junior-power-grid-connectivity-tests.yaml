        "id": "stmt-tot-2002-fall-junior-a-7",
        "title": "Техник проверяет связность решетчатой электросети",
        "text": "Электросеть имеет вид решетки \\(3\\times3\\): 16 узлов соединены проводами вдоль сторон маленьких квадратов. Некоторые провода могли перегореть. За один тест техник выбирает любую пару узлов и узнает, проходит ли ток между ними, то есть соединены ли они цепочкой исправных проводов. Техник уже знает, что ток проходит от любого узла к любому другому. Какое наименьшее число тестов нужно, чтобы доказать это? Ответьте на тот же вопрос для решетки \\(5\\times5\\) с 36 узлами.",
