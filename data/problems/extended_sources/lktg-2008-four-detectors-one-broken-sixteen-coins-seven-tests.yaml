        "id": "stmt-lktg-2008-4-1a",
        "title": "Ровно семь тестирований",
        "text": "Есть 16 одинаковых на вид монет, одна из них фальшивая. Есть четыре детектора, из которых один сломан: при каждом использовании он может отвечать произвольно. За одно тестирование выбранный детектор отвечает, есть ли фальшивая монета в указанном множестве монет. Докажите, что фальшивую монету можно гарантированно найти за 7 тестирований, а за 6 тестирований нельзя.",
