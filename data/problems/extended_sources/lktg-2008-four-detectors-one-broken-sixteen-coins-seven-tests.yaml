  "strategies": [
    {
      "id": "str-seven-tests-explicit-refuser-strategy",
      "title": "Семь тестирований через почти исключенные монеты",
      "text": "Назовем монету подозреваемой, если все уже полученные надежные сведения еще допускают, что она фальшивая. Если монету отверг ровно один детектор, будем называть ее почти исключенной типа этого детектора: она может быть фальшивой только в случае, если именно этот детектор сломан. Монета, отвергнутая двумя разными детекторами, уже настоящая.\n\nПервые четыре тестирования устроены одинаково: используем детектор, среди типов почти исключенных монет которого сейчас нет, и выбираем проверяемое множество так, чтобы оба возможных ответа оставляли равные по счету ситуации. В терминах размеров это можно записать так. Сначала первым детектором делим 16 монет на две восьмерки. Затем вторым детектором проверяем 4 подозреваемые монеты вместе с 4 почти исключенными монетами первого типа. Затем третьим детектором проверяем 2 подозреваемые монеты, 2 почти исключенные одного имеющегося типа и 2 почти исключенные другого типа. Наконец, четвертым детектором проверяем 1 подозреваемую монету и 3 почти исключенные монеты, взятые только из двух типов, так что вне проверки тоже остаются почти исключенные монеты не более чем двух типов.\n\nПосле любого ответа первых четырех тестирований остается ровно одна подозреваемая монета и четыре почти исключенные монеты трех типов; их количества по типам можно считать \\(2,1,1\\). Пятое тестирование делаем детектором того типа, которого среди этих трех типов нет. Проверяем подозреваемую монету вместе с одной почти исключенной монетой одиночного типа.\n\nЕсли пятый ответ говорит, что фальшивая монета в проверенной паре, остаются одна подозреваемая монета и одна почти исключенная. Шестым тестированием проверяем подозреваемую монету детектором не того типа, к которому относится почти исключенная. Если после этого остаются две почти исключенные монеты, седьмым тестированием берем детектор типа, отсутствующего среди этих двух, и проверяем одну из них.\n\nЕсли пятый ответ говорит, что фальшивая монета не в проверенной паре, подозреваемых монет больше нет, а остаются четыре почти исключенные монеты. Шестым тестированием делим их на две пары так, чтобы в каждой паре было не более двух типов, и проверяем одну пару детектором отсутствующего типа. Ответ оставляет одну пару кандидатов. Седьмым тестированием детектором типа, отсутствующего среди этой пары, проверяем одну из двух монет и находим фальшивую.",
      "standard_idea_ids": ["counting_bound", "partition_state_space"],
