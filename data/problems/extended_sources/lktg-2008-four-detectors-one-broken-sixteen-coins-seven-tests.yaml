      "id": "proof-six-tests-lower-bound",
      "title": "Почему шести тестирований мало",
      "text": "Зафиксируем любой алгоритм из \\(d\\) тестирований. Для каждой монеты должны быть допустимы как минимум \\(d+1\\) разные строки ответов: строка, где все ответы верны, и строки, где ровно один из \\(d\\) ответов мог быть произвольным ответом сломанного детектора. Разные монеты не могут иметь общую допустимую строку, иначе алгоритм не отличил бы их. Значит, необходимо \\(n(d+1)\\le 2^d\\). При \\(n=16\\) и \\(d=6\\) получаем \\(16\\cdot 7>64\\), поэтому 6 тестирований недостаточно.",
