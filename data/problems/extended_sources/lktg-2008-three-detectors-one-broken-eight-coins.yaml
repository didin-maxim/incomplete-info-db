  "strategies": [
    {
      "id": "str-four-pairs",
      "title": "Разбить на четыре пары",
      "text": "Разделим монеты на группы 1, 2, 3, 4 по две монеты. Первым детектором проверим объединение групп 1 и 2, вторым - объединение групп 1 и 3. По симметрии можно разобрать случай, когда оба ответа положительны. Третьим детектором проверим группы 2 и 3.\n\nЕсли ответ отрицателен, то фальшивая монета находится в группе 1: иначе два детектора ошиблись бы. Тогда одну монету этой пары проверяем всеми тремя детекторами, и два совпавших ответа решают, какая из двух монет фальшивая.\n\nЕсли третий ответ положителен, один из первых трех ответов ложный. Проверим группы 1 и 2 вторым детектором. Если ответ снова положителен, он совпал с ответом первого детектора и потому верен: фальшивая в группах 1 или 2, а первый детектор на первом ходе сказал правду, так что исправен либо второй, либо третий. Если ответ отрицателен, то исправен третий детектор, а фальшивая в группах 2 или 3. В обоих случаях известен один исправный детектор и осталось четыре кандидата; двумя дальнейшими проверками он находит фальшивую монету.",
