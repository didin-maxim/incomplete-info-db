      "id": "idea-four-groups-and-find-good-detector",
      "title": "Сначала найти группу или исправный детектор",
      "text": "Разбиение на четыре пары и три перекрестные проверки либо сразу выделяют одну пару, либо показывают, какой детектор точно исправен; после этого остается обычный двоичный поиск.",
