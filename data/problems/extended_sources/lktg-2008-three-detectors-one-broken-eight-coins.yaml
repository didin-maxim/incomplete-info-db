        "id": "stmt-lktg-2008-2-2a",
        "title": "Три детектора, один сломан",
        "text": "Даны 8 одинаковых на вид монет, одна из них фальшивая. Есть три детектора, из которых один сломан. За одно тестирование выбранный детектор должен отвечать, есть ли фальшивая монета в указанном множестве монет; сломанный детектор может отвечать произвольно. Докажите, что фальшивую монету можно найти за 6 тестирований.",
