      "id": "idea-nine-weighings-significance",
      "title": "Трехисходный счет с запасом на один сломанный прибор",
      "text": "Нижняя оценка считает не только обычные три исхода взвешивания, но и запас на один ненадежный прибор: у каждой еще возможной монеты есть несколько допустимых строк ответов. Верхняя оценка использует счет значимости из общей конструкции, но для \\(729\\) монет его можно довести конечной конструкцией: за первые 6 взвешиваний остаются 1 полностью подозреваемая монета и 12 почти исключенных, а последние 3 взвешивания разбирают этот малый остаток явно.",
