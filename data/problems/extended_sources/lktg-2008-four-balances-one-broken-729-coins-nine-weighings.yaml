        "id": "stmt-lktg-2008-4-1b",
        "title": "Ровно девять взвешиваний",
        "text": "Есть \\(3^6=729\\) одинаковых на вид монет, одна из них фальшивая и легче остальных. Есть четыре пары чашечных весов, причем одна пара сломана: при каждом использовании она может дать произвольный результат. За одно взвешивание выбранная пара весов сравнивает две группы с одинаковым числом монет и сообщает один из трех исходов: левая группа легче, правая группа легче или равновесие. Докажите, что фальшивую монету можно гарантированно найти за 9 взвешиваний, а за 8 взвешиваний нельзя.",
