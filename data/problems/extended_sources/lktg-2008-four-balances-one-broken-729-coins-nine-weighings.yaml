  "impossibility_proofs": [
    {
      "id": "proof-eight-weighings-lower-bound",
      "title": "Почему восьми взвешиваний мало",
      "text": "Докажем нижнюю оценку самодостаточно. Пусть некоторый алгоритм всегда находит фальшивую монету за \\(d\\) взвешиваний; если он иногда заканчивает раньше, добавим фиктивные взвешивания и считаем, что ходов ровно \\(d\\).\n\nПосле каждого ответа исправных весов один из трех блоков - левая чаша, правая чаша или оставшиеся вне чаш - объявляется блоком, где находится легкая фальшивая монета; два других блока получают отказ. Если монета получила отказы от двух разных пар весов, она точно настоящая: среди этих двух пар хотя бы одна исправна. Поэтому в любой момент достаточно различать три вида монет: подозреваемые, которым еще не отказала ни одна пара весов; отказники типа \\(i\\), которым мог отказать только \\(i\\)-й прибор; и настоящие монеты.\n\nЕсли до конца осталось \\(m\\) взвешиваний, зададим значимость: подозреваемая монета стоит \\(2m+1\\), отказник любого одного типа стоит 1, настоящая монета стоит 0. Рассмотрим следующее взвешивание на \\(i\\)-й паре весов. Для одной подозреваемой монеты среди трех возможных ответов один оставляет ее подозреваемой со значимостью \\(2m-1\\), а два делают ее отказником типа \\(i\\), каждый раз со значимостью 1; сумма равна \\(2m+1\\). Отказник другого типа \\(j\\ne i\\) при одном ответе остается отказником, а при двух ответах становится настоящим; сумма значимостей равна 1. Отказник типа \\(i\\) может остаться отказником при любом ответе этих же весов; сумма равна 3, то есть не меньше прежней 1. Значит, сумма значимостей трех возможных следующих ситуаций не меньше текущей значимости, поэтому хотя бы один ответ оставляет значимость не меньше трети текущей.\n\nВыбирая на каждом шаге такой допустимый ответ, получаем путь ответов, на котором значимость к концу не меньше начальной, деленной на \\(3^d\\). В начале все \\(n\\) монет подозреваемые, так что начальная значимость равна \\((2d+1)n\\). В конце алгоритм должен указать единственную возможную монету, значит значимость не превосходит 1. Поэтому необходимо \\((2d+1)n\\le 3^d\\).\n\nДля \\(n=3^6\\) и \\(d=8\\) это условие нарушается: \\((2\\cdot 8+1)3^6=17\\cdot 3^6>9\\cdot 3^6=3^8\\). Следовательно, восьми взвешиваний недостаточно.",
      "standard_idea_ids": ["counting_bound"],
      "status": "ai_checked",
      "definition_ids": ["information_lower_bound", "balance_scale"]
    }
