  "strategies": [
    {
      "id": "str-nine-weighings-direct-significance",
      "title": "Шесть равномерных ходов и малый остаток",
      "text": "Будем говорить, что ответ исправных весов указывает один из трех блоков: левая чаша, правая чаша или монеты вне чаш. Два других блока получают отказ. Если монета получила отказы от двух разных пар весов, она настоящая. Остальные монеты бывают двух видов: подозреваемые, которым еще не было отказа, и отказники типа \\(i\\), которым мог отказать только \\(i\\)-й прибор.\n\nЕсли осталось \\(m\\) взвешиваний, дадим подозреваемой монете значимость \\(2m+1\\), отказнику значимость 1, настоящей монете значимость 0. На каждом шаге будем брать пару весов, среди отказников типа которой сейчас нет; такая пара есть, потому что типов отказников не больше трех, а пар весов четыре. Нужно разбивать монеты на три блока так, чтобы в каждом блоке было не больше двух старых типов отказников. Тогда после любого ответа останется не больше трех типов: старые отказники из указанного блока и новый тип отказников, созданный только что использованными весами.\n\nПервые 6 взвешиваний делаем равномерно. Каждый раз делим подозреваемые монеты поровну на три блока, а старых отказников раскладываем так, чтобы в каждом блоке была ровно треть их общего числа и не больше двух их типов. Это возможно в нужных местах напрямую: один или два типа делятся очевидно; когда перед 4-м взвешиванием есть три типа по 54 отказника, кладем по одному типу в каждый блок; перед 6-м взвешиванием есть 30 отказников не более чем трех типов, и их можно разложить по \\(10,10,10\\), потому что самый малый тип имеет размер не больше 10. Здесь нужен только простой частный случай леммы о трех автобусах: три класса \\(a_1\\le a_2\\le a_3\\) можно разложить по трем местам вместимостей \\(b_1\\le b_2\\le b_3\\), не смешивая в одном месте больше двух классов, если и только если \\(b_1+b_2\\ge a_1\\). При равных вместимостях 10 это условие выполнено автоматически.\n\nПосле этих шести ходов, независимо от ответов, остается ровно 1 подозреваемая монета и 12 отказников. Действительно, числа \\((S,R)\\), где \\(S\\) - число подозреваемых, \\(R\\) - число отказников, проходят так: \\((729,0)\\), \\((243,486)\\), \\((81,324)\\), \\((27,162)\\), \\((9,72)\\), \\((3,30)\\), \\((1,12)\\). Значимость при этом каждый раз делится на 3: от \\(19\\cdot729\\) до \\(19\\).\n\nОстаются 3 взвешивания. Разложим 12 отказников на три блока по 4, снова не смешивая больше двух старых типов в одном блоке; это возможно по той же лемме, так как самый малый тип имеет размер не больше 4. Подозреваемую монету положим в третий блок, который не взвешиваем, а два блока по 4 сравним на свободной по типу паре весов.\n\nЕсли ответ указывает на один из взвешенных блоков, подозреваемая монета становится новым отказником, а в игре остается не больше 5 отказников и 2 взвешивания. Тогда свободной по типу парой весов делим их на группы размеров \\(2,2,1\\); после ответа останется не больше 2 кандидатов, и последним взвешиванием на свободной по типу паре весов различаем их.\n\nЕсли ответ указывает на невзвешенный блок, остаются подозреваемая монета и 4 отказника, а до конца 2 взвешивания. Следующим ходом сравниваем две пары отказников, оставляя подозреваемую монету вне чаш. Если ответ снова указывает вне чаш, подозреваемая монета найдена. Если ответ указывает на одну из пар, остаются не больше 3 отказников; последним взвешиванием на свободной по типу паре весов делим их на три одиночные группы и находим монету. Во всех сравнениях чаши равны по числу монет, а свободная по типу пара весов не может быть сломанной ни в одном из оставшихся вариантов, где кандидат является отказником этого типа.",
