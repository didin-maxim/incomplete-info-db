  "strategies": [
    {
      "id": "str-four-testers-ideal-outline",
      "title": "Свести все к продолжению из 4.4",
      "text": "Детекторный случай. Используем из доказательства 4.4 не асимптотическую формулу, а точную лемму продолжения: если за \\(m\\) ходов до конца каждая подозреваемая монета имеет значимость \\(m+1\\), каждая почти исключенная монета имеет значимость 1, общая значимость не больше \\(2^m\\), а почти исключенные монеты имеют не более трех типов, то четыре детектора позволяют закончить за \\(m\\) ходов. В следующем ходе выбирают детектор, типа которого еще нет среди почти исключенных; подозреваемые монеты делят почти пополам, а почти исключенные распределяют так, чтобы обе возможные ветви имели значимость не больше \\(2^{m-1}\\) и в каждой ветви осталось не более трех типов. Ровно это обеспечивает лемма о двух автобусах из 4.4.\n\nПусть \\(t\\) - минимальное число, для которого \\(2^{t-1}\\ge \\lceil n/2\\rceil t+(n-\\lceil n/2\\rceil)\\). Первый тест делит монеты на части размеров \\(\\lceil n/2\\rceil\\) и \\(n-\\lceil n/2\\rceil\\). После худшего ответа большая часть остается подозреваемой, а меньшая становится почти исключенной, поэтому значимость равна \\(\\lceil n/2\\rceil t+(n-\\lceil n/2\\rceil)\\le 2^{t-1}\\). Дальше применяется лемма продолжения с \\(m=t-1\\). Значит, четыре детектора справляются за \\(t\\) ходов.\n\nВесовой случай аналогичен, но с тремя исходами. Используем весовую лемму продолжения из 4.4: за \\(m\\) ходов до конца подозреваемая монета имеет значимость \\(2m+1\\), почти исключенная - 1, общая значимость не больше \\(3^m\\), почти исключенные монеты имеют не более трех типов, а две выбранные группы можно уравнять эталонными монетами; тогда четыре пары весов позволяют закончить за \\(m\\) ходов. Если \\(t\\) минимально удовлетворяет \\(3^{t-1}\\ge \\lceil n/3\\rceil(2t-1)+(n-\\lceil n/3\\rceil)\\), то первым взвешиванием делим монеты на три группы с наибольшим размером \\(\\lceil n/3\\rceil\\) и сравниваем две равные группы. В худшей ветви значимость после первого хода не превосходит указанного правого выражения, а дальше работает весовая лемма продолжения из 4.4. Поэтому четыре пары весов также достигают общего порога.",
      "standard_idea_ids": ["counting_bound", "partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["strategy", "balance_scale", "information_lower_bound"]
    }
