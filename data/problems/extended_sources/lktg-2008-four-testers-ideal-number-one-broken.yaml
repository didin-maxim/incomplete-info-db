        "text": "Есть \\(n\\) одинаковых на вид монет, одна из них фальшивая. Ровно один из доступных приборов сломан и при каждом использовании может давать произвольный ответ. Докажите, что если доступно больше четырех детекторов, то минимальное число тестирований не меньше и не больше, чем при четырех детекторах: \\(D_{x,1}(n)=D_{4,1}(n)\\) для всех \\(x>4\\). Докажите аналогичное утверждение для чашечных весов: \\(B_{x,1}(n)=B_{4,1}(n)\\) для всех \\(x>4\\).",
