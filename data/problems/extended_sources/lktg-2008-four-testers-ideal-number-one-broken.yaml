      "id": "idea-four-testers-ideal",
      "title": "Лишние приборы не улучшают нижнюю границу",
      "text": "Для любого числа приборов есть один и тот же первый-пороговый запрет: после первого ответа противник выбирает самую большую оставшуюся ветвь, и оставшейся емкости строк ответов уже может не хватить. Конструкция с четырьмя приборами достигает ровно этого порога, потому что после первого хода применяет точную лемму продолжения из доказательства 4.4. Поэтому пятый и следующие приборы не дают выигрыша по числу ходов.",
