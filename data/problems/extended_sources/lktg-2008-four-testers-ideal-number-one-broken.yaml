  "impossibility_proofs": [
    {
      "id": "proof-extra-testers-do-not-beat-general-bound",
      "title": "Нижняя оценка не зависит от числа приборов",
      "text": "Сначала монотонность: при \\(x>4\\) можно игнорировать лишние приборы, значит \\(D_{x,1}(n)\\le D_{4,1}(n)\\) и \\(B_{x,1}(n)\\le B_{4,1}(n)\\). Остается доказать обратное неравенство.\n\nДетекторы. Рассмотрим любой алгоритм, который якобы справляется за \\(t\\) ходов с любым числом детекторов. Первый вопрос делит монеты на две части; один из двух возможных ответов оставляет подозреваемыми не меньше \\(s=\\lceil n/2\\rceil\\) монет, а остальные \\(n-s\\) монет становятся почти исключенными: они еще возможны, если первый детектор был сломан. После этого остается \\(t-1\\) ответов, то есть не больше \\(2^{t-1}\\) строк. Для каждой подозреваемой монеты нужно различить как минимум \\(t\\) сценариев будущего: все дальнейшие ответы верны или ровно один из \\(t-1\\) дальнейших ответов произволен. Для каждой почти исключенной монеты нужен еще один сценарий: первым был сломан именно первый детектор, а дальше ответы верны. Поэтому необходимо \\(2^{t-1}\\ge st+(n-s)\\). Если \\(2^{t-1}<\\lceil n/2\\rceil t+(n-\\lceil n/2\\rceil)\\), никакое число детекторов не справится.\n\nВесы. Тот же подсчет с тремя исходами: после первого взвешивания противник выбирает группу размера \\(s\\ge\\lceil n/3\\rceil\\). Подозреваемая монета при \\(t-1\\) оставшихся взвешиваниях требует \\(2(t-1)+1=2t-1\\) сценариев: все ответы верны или один будущий ответ заменен одним из двух неверных исходов. Почти исключенная монета требует один сценарий. Значит, для любого числа весов необходимо \\(3^{t-1}\\ge s(2t-1)+(n-s)\\), в частности \\(3^{t-1}\\ge \\lceil n/3\\rceil(2t-1)+(n-\\lceil n/3\\rceil)\\).\n\nВерхняя часть из стратегии показывает, что четыре прибора достигают ровно этих общих порогов. Следовательно, ни пять, ни больше приборов не могут уменьшить минимальное число ходов.",
