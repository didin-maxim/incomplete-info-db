  "strategies": [
    {
      "id": "str-infinite-detectors-coordinate-search",
      "title": "Разряды, контроль и добор",
      "text": "Для детекторов занумеруем \\(2^k\\) монет двоичными словами длины \\(k\\). Первые \\(k\\) детекторов проверяют соответствующие разряды. Если все ответы указывают на нулевые разряды, то у фальшивой монеты не больше одной единицы в номере, иначе сломаться должны были бы два разных детектора. Следующий детектор проверяет монету \\(00\\ldots0\\). Если ответ положителен, это истина; если отрицателен, остается не больше \\(k+1\\) кандидата, и еще один заведомо исправный детектор находит нужную монету за \\(O(\\log k)\\) тестирований. Весовая версия аналогична с троичными разрядами и дает \\(k+o(k)\\) взвешиваний.",
      "standard_idea_ids": ["binary_encoding", "ternary_weighing_code"],
      "status": "ai_checked",
      "definition_ids": ["strategy", "balance_scale"]
    },
    {
      "id": "str-finite-number-of-testers-by-block-construction",
      "title": "Конечное число приборов через блочную конструкцию",
      "text": "В листе конечное число приборов выводится из следующей серийной конструкции: для трех приборов с одним сломанным доказываются оценки вида \\(D_{3,1}(2^{k(k+1)})\\le (k+1)^2\\) и \\(B_{3,1}(3^{k(k+1)})\\le (k+1)^2\\). Они дают асимптотику \\(k+o(k)\\) после замены параметра блоками длины \\(k(k+1)\\). Полный алгоритм блочного шага технический и в карточке не разворачивается.",
