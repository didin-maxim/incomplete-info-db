        "title": "Достаточно некоторого конечного числа приборов",
        "text": "Докажите, что для каждого \\(k\\) существует такое конечное число детекторов \\(x\\), что одну фальшивую монету из \\(2^k\\) можно найти за \\(k+o(k)\\) тестирований, если среди этих \\(x\\) детекторов ровно один сломан и может отвечать произвольно. Аналогично, для каждого \\(k\\) существует такое конечное число пар весов \\(x\\), что одну легкую фальшивую монету из \\(3^k\\) можно найти за \\(k+o(k)\\) взвешиваний, если среди этих \\(x\\) пар ровно одна пара сломана и может давать произвольные результаты.",
