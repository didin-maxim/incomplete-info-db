        "id": "stmt-lktg-2008-3-4",
        "title": "Бесконечно много приборов",
        "text": "Докажите, что при неограниченном запасе детекторов, из которых ровно один сломан и может отвечать произвольно, можно выявить одну фальшивую монету из \\(2^k\\) за \\(k+o(k)\\) тестирований; исправный детектор сообщает, лежит ли фальшивая монета в выбранном множестве. Аналогично докажите, что при неограниченном запасе пар чашечных весов, из которых ровно одна пара сломана и может давать произвольные результаты, можно выявить одну легкую фальшивую монету из \\(3^k\\) за \\(k+o(k)\\) взвешиваний.",
