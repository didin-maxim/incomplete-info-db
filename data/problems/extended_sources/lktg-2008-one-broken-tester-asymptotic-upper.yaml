      "id": "idea-coordinate-tests-leave-few-candidates",
      "title": "Координатные проверки оставляют мало подозрительных",
      "text": "Если первые \\(k\\) приборов проверяют разряды двоичной или троичной записи, то все ответы одновременно могут ошибаться только в одном разряде. После контрольной проверки остается всего около \\(k\\) кандидатов, которых новый исправный прибор добирает за логарифмически малое число ходов.",
      "standard_idea_ids": ["binary_encoding", "ternary_weighing_code", "partition_state_space"],
      "status": "ai_checked"
    }
