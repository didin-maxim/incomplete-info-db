      "text": "Первый мудрец может выбрать числа \\(1,2,3,22,23,24,25\\). Их сумма равна 100, а четвертое по величине число равно 22. Если второй мудрец слышит 22, то три меньших натуральных различных числа имеют сумму как минимум \\(1+2+3=6\\), а три больших различных натуральных числа имеют сумму как минимум \\(23+24+25=72\\). Вместе с 22 это уже дает 100, поэтому все минимумы должны достигаться. Значит, набор единственно возможен.",
