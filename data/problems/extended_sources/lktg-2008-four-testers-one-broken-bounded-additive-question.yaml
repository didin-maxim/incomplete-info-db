        "title": "Ограниченная добавка в точных асимптотиках",
        "text": "В первой модели есть четыре детектора, один из них сломан и при каждом использовании может отвечать произвольно; исправный детектор сообщает, лежит ли фальшивая монета в выбранном множестве. Пусть \\(D_{4,1}(n)\\) - минимальное число тестирований, достаточное для гарантированного нахождения одной фальшивой монеты среди \\(n\\) одинаковых на вид монет в этой модели. Во второй модели есть четыре пары чашечных весов, одна из них сломана и при каждом использовании может дать произвольный из трех ответов; исправные весы сравнивают две равные по числу группы, а фальшивая монета легче настоящих. Пусть \\(B_{4,1}(n)\\) - минимальное число взвешиваний, достаточное для гарантированного нахождения легкой фальшивой монеты среди \\(n\\) монет во второй модели.\n\nИзвестны точные формулы: \\(D_{4,1}(2^k)=k+t_d\\), где \\(t_d\\) - наименьшее целое число с \\(2^{t_d}\\ge k+t_d+1\\), и \\(B_{4,1}(3^k)=k+t_b\\), где \\(t_b\\) - наименьшее целое число с \\(3^{t_b}\\ge 2(k+t_b)+1\\). Поэтому можно записать \\(D_{4,1}(2^k)=k+\\log_2 k+c_{d,k}\\) и \\(B_{4,1}(3^k)=k+\\log_3 k+c_{b,k}\\), где последовательности \\(c_{d,k}\\) и \\(c_{b,k}\\) ограничены. Можно ли получить для этих последовательностей лучшую верхнюю оценку, чем просто ограниченность?",
        "source_ids": ["src-lktg-2008-broken-balances-problems-ru", "src-lktg-2008-broken-balances-solutions-ru"],
