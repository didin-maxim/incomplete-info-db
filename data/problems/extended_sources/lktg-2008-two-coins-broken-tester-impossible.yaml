      "text": "Если оба тестирования сделаны одним и тем же прибором, противник может объявить именно этот прибор сломанным; тогда оба ответа не дают надежной информации. Если тестирования сделаны разными приборами, возможна ветка, где ответы противоречат друг другу. В этой ветке одна модель говорит, что сломан первый прибор и фальшива первая монета, а другая - что сломан второй прибор и фальшива вторая монета. Наблюдения одинаково допустимы, поэтому гарантированного определения нет.",
