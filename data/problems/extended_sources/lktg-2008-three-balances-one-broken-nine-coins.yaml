        "title": "Найти фальшивую монету, если одна из трех пар весов сломана",
        "text": "Даны 9 одинаковых на вид монет. Одна из них фальшивая и легче остальных. Есть три пары чашечных весов, причем одна пара сломана: при каждом использовании она может дать произвольный ответ. Покажите, как за 4 взвешивания найти фальшивую монету.",
