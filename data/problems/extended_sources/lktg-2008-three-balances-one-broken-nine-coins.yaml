      "id": "str-nine-coins-one-broken-balance",
      "title": "Две координаты и одно контрольное разбиение",
      "text": "Занумеруем монеты парами цифр \\(00,01,\\ldots,22\\), где каждая цифра равна 0, 1 или 2. Первые весы сравнивают монеты с первой цифрой 0 и 1, вторые - с последней цифрой 0 и 1. Без ограничения общности считаем, что оба результата указывают на цифру 0; тогда четыре монеты без нулей точно настоящие, потому что хотя бы одни из первых двух весов исправны.\n\nТретьим взвешиванием на третьих весах сравним \\(00\\) вместе с одной заведомо настоящей монетой против \\(01+02\\). Если левая чаша легче, фальшива \\(00\\): при исправных третьих весах это прямой вывод, а при сломанных третьих весах первые две пары весов исправны и снова дают \\(00\\). Если правая чаша легче, то либо вторые весы сломаны, либо третьи; в обоих случаях первые весы исправны, поэтому фальшивая монета среди \\(00,01,02\\), и одно обычное взвешивание на первых весах различает эту тройку. Если равновесие, симметрично исправны вторые весы, фальшивая монета среди \\(00,10,20\\), и одно обычное взвешивание на вторых весах различает эту тройку.",
