      "id": "idea-ternary-labels-with-one-bad-tester",
      "title": "Три исхода и проверка противоречий",
      "text": "Монеты получают метки из двух цифр 0, 1, 2. Первые два взвешивания дают подозрительные цифры, а третье взвешивание устроено так, чтобы либо подтвердить обе цифры, либо обнаружить, какие весы точно исправны.",
      "standard_idea_ids": ["ternary_weighing_code"],
