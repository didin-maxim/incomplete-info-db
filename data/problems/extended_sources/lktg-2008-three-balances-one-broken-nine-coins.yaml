  "strategies": [
    {
      "id": "str-nine-coins-one-broken-balance",
      "title": "Две координаты и одно контрольное разбиение",
      "text": "Занумеруем монеты парами цифр \\(00,01,\\ldots,22\\), где каждая цифра равна 0, 1 или 2. Первые весы сравнивают монеты с первой цифрой 0 и 1, вторые - с последней цифрой 0 и 1. Без ограничения общности считаем, что оба результата указывают на цифру 0; тогда четыре монеты без нулей точно настоящие, если не сломаны сразу двое весов, что невозможно.\n\nТретьим взвешиванием на третьих весах сравнивают специально дополненные до равных размеров группы: \\(00\\), группу \\(01,02\\) и группу \\(10,20\\), добавляя заведомо настоящие монеты. Если результат указывает на \\(00\\), это истинно. Если он указывает на \\(01,02\\), то он противоречит второму взвешиванию, значит первые весы исправны и первая цифра фальшивой монеты равна 0; остается три кандидата, которые различаются одним обычным взвешиванием. Случай \\(10,20\\) симметричен.",
