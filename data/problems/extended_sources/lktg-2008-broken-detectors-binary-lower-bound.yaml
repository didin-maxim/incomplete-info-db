  "impossibility_proofs": [
    {
      "id": "proof-detector-candidates-halving",
      "title": "Противник оставляет не меньше половины кандидатов",
      "text": "После уже сделанных тестирований рассмотрим монеты, которые еще могут быть фальшивыми. Для каждой такой монеты существует хотя бы один ответ следующего детектора, при котором она остается возможной: неудобный ответ можно объяснить тем, что использованный детектор сломан. Значит, найдется ответ, который оставляет не меньше половины текущих кандидатов. На первом ходе противник вообще может считать использованный детектор сломанным, так что надежного уменьшения нет. За оставшиеся \\(k-1\\) ходов кандидатов можно уменьшить в худшем случае не более чем в \\(2^{k-1}\\) раз, и из \\(2^k\\) монет останется больше одной.",
