        "id": "stmt-lktg-2008-2-5a",
        "title": "Двоичная нижняя оценка для детекторов",
        "text": "Есть \\(2^k\\) одинаковых на вид монет, одна из них фальшивая. Можно пользоваться любым числом детекторов, но среди них есть сломанный; при каждом использовании сломанный детектор может отвечать произвольно. За одно тестирование детектор отвечает, есть ли фальшивая монета в выбранном множестве. Докажите, что за \\(k\\) тестирований гарантированно найти фальшивую монету невозможно.",
