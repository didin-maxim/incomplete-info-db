      "id": "idea-first-detector-can-be-worthless",
      "title": "Первый ответ может не дать надежной информации",
      "text": "Обычная двоичная емкость \\(2^k\\) не достигается, потому что один из \\(k\\) ответов может принадлежать сломанному прибору и ничего не ограничивать.",
