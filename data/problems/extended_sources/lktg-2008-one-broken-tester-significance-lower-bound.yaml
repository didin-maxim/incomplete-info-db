        "title": "Монотонность числа ходов по числу монет",
        "text": "Докажите монотонность задач с одним сломанным прибором: если \\(n<N\\), то минимальное число тестирований или взвешиваний для \\(n\\) монет не больше, чем для \\(N\\) монет. В листе отдельно предлагаются частные формулировки для \\(N=2^k\\) в детекторной модели и \\(N=3^k\\) в весовой модели.",
