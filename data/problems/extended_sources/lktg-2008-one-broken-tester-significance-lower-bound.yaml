  "ideas": [
    {
      "id": "idea-one-error-transcripts-and-significance",
      "title": "Нужен запас на один плохой ответ",
      "text": "В детекторной модели каждая монета должна подходить не к одной строке ответов, а хотя бы к \\(d+1\\) строкам: без ошибки и с ошибкой на каждом из \\(d\\) ходов. Для весов удобнее вести счет подозреваемых монет и монет, которые исключены только одним возможным прибором; в худшем исходе такой счет уменьшается не быстрее чем втрое.",
      "standard_idea_ids": ["error_correcting_code", "counting_bound", "adversary_strategy"],
      "status": "ai_checked"
    }
  ],
  "strategies": [],
  "impossibility_proofs": [
    {
      "id": "proof-detector-transcripts",
      "title": "Детекторы: \\(d+1\\) строк ответов на монету",
      "text": "Зафиксируем алгоритм длины \\(d\\). Каждая строка из \\(d\\) ответов да/нет определяет все сделанные тестирования и в успешном алгоритме указывает на одну фальшивую монету. Для каждой монеты допустимы как минимум \\(d+1\\) строк: все ответы верны, либо ровно один из \\(d\\) ответов неверен. Эти строки различны. Значит, \\(n(d+1)\\le 2^d\\).",
      "standard_idea_ids": ["error_correcting_code", "counting_bound"],
      "status": "ai_checked",
      "definition_ids": ["information_lower_bound"]
    },
    {
      "id": "proof-balance-significance",
      "title": "Весы: считаем, сколько кандидаты еще могут выдержать",
      "text": "После нескольких взвешиваний подозреваемыми считаем монеты, которые все приборы всегда помещали в возможную фальшивую группу; почти исключенными - монеты, которые исключил ровно один тип весов; настоящие монеты исключены как минимум двумя типами. Если до конца осталось \\(m\\) ходов, дадим подозреваемой монете вес в счете \\(2m+1\\), почти исключенной - 1, настоящей - 0. При очередном взвешивании сумма этих счетов для трех возможных ситуаций не меньше исходной суммы, значит есть исход, сохраняющий не меньше трети. В начале сумма равна \\((2d+1)n\\), а в конце успешного алгоритма она не должна превышать 1. Поэтому \\((2d+1)n\\le 3^d\\).",
      "standard_idea_ids": ["adversary_strategy", "counting_bound"],
