        "title": "Оценки, не зависящие от числа приборов",
        "text": "Пусть \\(d\\) - минимальное число тестирований, за которое можно найти одну фальшивую монету среди \\(n\\) монет при любом числе детекторов с одним сломанным среди них. Докажите, что \\(2^d/(d+1)\\ge n\\). Аналогично, если \\(d\\) - минимальное число взвешиваний на чашечных весах при одном сломанном приборе, докажите, что \\(3^d/(2d+1)\\ge n\\).",
