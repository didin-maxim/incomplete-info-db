        "id": "stmt-matprazdnik-2023-7-6",
        "title": "Определить вес монет в указанном мешке",
        "text": "У царя есть 7 мешков с золотыми монетами, в каждом по 100 монет. Известно, что в мешках лежат монеты весом 7, 8, 9, 10, 11, 12 и 13 граммов, по одному весу на мешок, но неизвестно, где какой вес. Царь указал мудрецу на один мешок. Можно ли с помощью больших чашечных весов без гирь определить вес монет в указанном мешке не более чем за два взвешивания?",
