      "title": "Сначала отделить 10 граммов и сторону, затем уточнить",
      "text": "Пусть вес монет в указанном мешке равен \\(x\\). Сначала сравним 70 монет из указанного мешка с 10 комплектами, где комплект содержит по одной монете из каждого мешка. Правая чаша весит \\(700\\) граммов, поэтому равенство сразу дает \\(x=10\\), перевес указанного мешка дает \\(x>10\\), а перевес комплектов дает \\(x<10\\).\n\nЕсли \\(x>10\\), вторым взвешиванием сравним 70 монет указанного мешка с 12 комплектами: результат различает \\(11,12,13\\). Если \\(x<10\\), сравним 70 монет с 8 комплектами: результат различает \\(7,8,9\\). В каждом случае двух трехисходных сравнений достаточно, а монет в мешках хватает.",
