      "id": "proof-2k-testers-not-enough",
      "title": "Две симметричные версии поломки",
      "text": "Докажем, что \\(2k\\) приборов недостаточно; меньшее число тем более не может помочь. Разобьем \\(2k\\) приборов на две группы по \\(k\\) приборов и выберем две разные монеты \\(A\\) и \\(B\\).\n\nБудем строить один и тот же протокол ответов для двух скрытых сценариев. В первом сценарии фальшива \\(A\\), а приборы первой группы сломаны; приборы второй группы исправны и отвечают так, как должны отвечать при фальшивой монете \\(A\\). Сломанные приборы первой группы пусть отвечают так, как исправные отвечали бы при фальшивой монете \\(B\\). Во втором сценарии наоборот: фальшива \\(B\\), сломана вторая группа, первая группа исправна. Тогда при любом вопросе или взвешивании каждый прибор дает в двух сценариях один и тот же ответ: первая группа отвечает как при монете \\(B\\), вторая - как при монете \\(A\\).\n\nАлгоритм видит одинаковый протокол, но правильные ответы в двух сценариях различны: в одном случае фальшива \\(A\\), в другом - \\(B\\). Значит, при \\(2k\\) приборах гарантировать успех нельзя. Поэтому минимальное число приборов равно \\(2k+1\\).",
