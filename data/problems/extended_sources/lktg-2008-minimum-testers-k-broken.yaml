        "title": "Минимальное число детекторов или весов",
        "text": "Для каждого натурального \\(k\\) найдите минимальное число \\(K\\) со следующим свойством. В детекторной модели есть \\(K\\) детекторов, из них \\(k\\) сломаны и при каждом использовании могут отвечать произвольно; исправный детектор сообщает, лежит ли фальшивая монета в выбранном множестве. При каком минимальном \\(K\\) можно гарантированно найти одну фальшивую монету среди любого числа одинаковых на вид монет? Тот же вопрос для весовой модели: есть \\(K\\) пар чашечных весов, из них \\(k\\) сломаны и могут давать произвольные результаты, исправные весы сравнивают две равные по числу группы, а единственная фальшивая монета легче настоящих.",
