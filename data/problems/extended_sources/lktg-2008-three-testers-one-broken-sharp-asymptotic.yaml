    {
      "id": "str-three-balances-asymptotic",
      "title": "Весы: тот же счет с троичным разрезанием",
      "text": "Пусть теперь \\(n=3^k\\), фальшивая монета легче настоящей, а одни из трех весов сломаны. Термины те же: подозреваемая монета еще не отвергнута ни одним типом весов, почти исключенная типа \\(T\\) возможна только если весы \\(T\\) сломаны, а отвергнутая двумя типами монета считается настоящей. Поддерживаем не более двух типов почти исключенных монет и каждый раз пользуемся весами третьего типа.\n\nВыберем \\(d\\) из условия \\((2d+1)+2\\cdot3^d\\ge n(2d+1)\\). Тогда \\(d=k+\\log_3 k+O(1)\\): если \\(d=k+t\\), условие требует только \\(3^t\\) порядка \\(k+t\\), и этого достаточно при \\(t=\\log_3 k+O(1)\\). За \\(i\\) взвешиваний до конца основного этапа зададим значимость подозреваемой монеты как \\(2i+1\\), почти исключенной как 1, настоящей как 0, и будем держать предел \\(y_i=(2i+1)+2\\cdot3^i\\). В начале значимость равна \\(n(2d+1)\\le y_d\\), а при \\(i=0\\) имеем \\(y_0=3\\), то есть после основного этапа останется не более трех возможных монет.\n\nПусть за \\(i\\) ходов до конца осталось \\(a\\) подозреваемых монет. Снова ставим в линию почти исключенные первого типа, затем подозреваемые, затем почти исключенные второго типа. Для разрезания считаем подозреваемую монету с коэффициентом \\(D=2i-2\\), почти исключенную с коэффициентом 1. При \\(i\\ge2\\) сумма коэффициентов не превосходит \\(y_i-3a\\), и по той же лемме о разрезании линию можно разбить на три последовательные части так, чтобы коэффициентная сумма каждой была не больше \\((y_i-3a+2D)/3\\). Тогда после любого исхода новая значимость не превосходит \\((y_i-3a+2D)/3+a=(y_i+2D)/3=y_{i-1}\\). При \\(i=1\\) имеем \\(3a+r\\le9\\); подозреваемые и почти исключенные можно вручную распределить по трем частям так, чтобы после любого исхода значимость была не больше 3: если подозреваемых много, кладем их по разным частям, если их мало, почти равномерно раскладываем почти исключенные.\n\nИнвариант по двум типам сохраняется по той же причине, что и для детекторов: часть с обоими старыми типами содержит всех подозреваемых, иначе остается не более одного старого типа плюс новый тип от подозреваемых вне указанной части. Остается только реализовать троичное разбиение на чашечных весах: две из трех частей должны иметь равное число монет на чашах, а третья остается вне весов. Первые два взвешивания можно выбрать с равными группами напрямую; после них, как в источнике, уже есть не менее \\(4n/9-2\\) заведомо настоящих монет. В дальнейших шагах среди трех полученных частей найдутся две, размеры которых отличаются не больше чем на треть от числа распределенных неэталонных монет; таких монет не больше \\(5n/9+2\\), поэтому для \\(n\\ge12\\) разность не больше \\(5n/27+1\\le4n/9-2\\). Эталонов хватает, чтобы дополнить меньшую из двух выбранных частей и сравнить равные количества монет. Малые \\(n\\) поглощаются константой. После \\(d\\) взвешиваний остается не более трех кандидатов, а три монеты с одними сломанными весами находятся за 3 дополнительных взвешивания проверкой пар на всех трех весах. Следовательно, \\(B_{3,1}(3^k)\\le d+3=k+\\log_3 k+O(1)\\).",
      "standard_idea_ids": ["partition_state_space", "counting_bound", "ternary_weighing_code"],
