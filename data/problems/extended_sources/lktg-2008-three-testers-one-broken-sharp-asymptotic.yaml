        "text": "Для четырех приборов с одним сломанным справедливы оценки \\(D_{4,1}(2^k)=k+\\log_2 k+O(1)\\) и \\(B_{4,1}(3^k)=k+\\log_3 k+O(1)\\). Выясните, верны ли оценки того же вида для трех детекторов и для трех пар чашечных весов с одним сломанным прибором.",
