      "id": "proof-three-testers-log-k-lower-bound",
      "title": "Нижняя оценка такая же по порядку",
      "text": "Нижняя оценка не зависит от того, три прибора или больше. В детекторной модели каждая фальшивая монета должна быть совместима как минимум с \\(d+1\\) строками ответов: все ответы верны или ровно один из \\(d\\) ответов произволен из-за сломанного детектора. Поэтому \\(2^k(d+1)\\le2^d\\). Если \\(d=k+t\\), то \\(2^t\\ge k+t+1\\), откуда \\(t\\ge\\log_2 k-O(1)\\). В весовой модели общая оценка значимости дает \\(3^k(2d+1)\\le3^d\\); при \\(d=k+t\\) получаем \\(3^t\\ge2(k+t)+1\\), то есть \\(t\\ge\\log_3 k-O(1)\\). Вместе с построениями выше это и дает точность до ограниченной добавки.",
