  "ideas": [
    {
      "id": "idea-three-testers-same-asymptotic",
      "title": "Ответ положительный: достаточно довести поиск до малого числа кандидатов",
      "text": "Да, для трех приборов добавка остается порядка \\(\\log k\\). Нижняя оценка вообще не зависит от числа исправных приборов сверх одного: на каждую монету должен приходиться запас строк ответов, соответствующий одному произвольному прибору. Верхняя оценка переносит технический прием из решения 4.4: вместо простого числа кандидатов считается значимость ситуации. Ситуацию поддерживают так, чтобы почти исключенные монеты имели не более двух типов; тогда всегда есть третий прибор, тип которого еще не встречался среди почти исключенных монет. Отличие от четырех приборов состоит в том, что мы не получаем точную формулу до одной монеты: после основного этапа остаются две монеты в детекторной модели или три монеты в весовой, а этот остаток добивается за константное число ходов.",
      "standard_idea_ids": ["counting_bound", "partition_state_space"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-three-detectors-asymptotic",
      "title": "Детекторы: значимость и разрезание линии на две части",
      "text": "Пусть всего \\(n=2^k\\) монет. Назовем монету подозреваемой, если она еще не получила отказа ни от одного детектора; почти исключенной типа \\(T\\), если она могла бы быть фальшивой только при условии, что детектор \\(T\\) сломан; монеты, отказанные двумя разными типами детекторов, уже надежно настоящие. Будем поддерживать, что почти исключенные монеты имеют не более двух типов. Тогда следующий тест всегда можно делать третьим типом детектора, который среди этих типов не встречается.\n\nВыберем число \\(d\\) так, чтобы \\(2^d+d+1\\ge n(d+1)\\); например, достаточно взять \\(d=k+\\lceil\\log_2(k+2)\\rceil+O(1)\\). Докажем, что за \\(d\\) тестирований можно оставить не более двух возможных монет. За \\(i\\) тестирований до конца основного этапа дадим подозреваемой монете значимость \\(i+1\\), почти исключенной - 1, настоящей - 0, и будем требовать общий предел \\(x_i=2^i+i+1\\). В начале значимость равна \\(n(d+1)\\le x_d\\), типов почти исключенных нет. При \\(i=0\\) предел равен \\(x_0=2\\), значит останется не более двух возможных монет.\n\nОсталось объяснить один шаг. Пусть за \\(i\\) ходов до конца есть \\(a\\) подозреваемых монет, а почти исключенные имеют типы \\(A\\) и \\(B\\). Разложим все возможные монеты в одну линию: сначала почти исключенные типа \\(A\\), затем подозреваемые, затем почти исключенные типа \\(B\\). Для разрезания временно считаем подозреваемую монету с коэффициентом \\(i-1\\), а почти исключенную с коэффициентом 1. Сумма этих коэффициентов не превосходит \\(x_i-2a\\). Элементарная лемма о разрезании говорит: если объекты стоят в линии, каждый имеет цену не больше \\(M\\), то линию можно разрезать на две части так, чтобы цена каждой части была не больше половины общей цены плюс \\(M/2\\). При \\(i\\ge2\\) берем \\(M=i-1\\) и получаем две части с коэффициентной суммой не больше \\((x_i-2a+i-1)/2\\). При \\(i=1\\) шаг проверяется вручную: из \\(2a+r\\le4\\), где \\(r\\) - число почти исключенных, следует \\(a\\le2\\); подозреваемые и почти исключенные можно разложить по двум частям так, что после любого ответа новая значимость не превосходит 2.\n\nТестируем одну из двух частей детектором третьего типа. Любой ответ указывает на одну из двух частей как на содержащую фальшивую монету. Новая значимость соответствующей ситуации равна коэффициентной сумме указанной части плюс \\(a\\): подозреваемые внутри указанной части получают вместо коэффициента \\(i-1\\) новую значимость \\(i\\), а подозреваемые вне ее становятся почти исключенными нового типа и дают по 1. Поэтому при \\(i\\ge2\\) новая значимость не превосходит \\((x_i-2a+i-1)/2+a=(x_i+i-1)/2=x_{i-1}\\), а случай \\(i=1\\) уже разобран. Инвариант по типам тоже сохраняется: если какая-то часть содержит почти исключенных обоих старых типов, то из-за выбранного порядка она содержит все подозреваемые монеты, а значит новый тип не появляется; иначе в указанной части есть не более одного старого типа, плюс возможный новый тип от подозреваемых вне части. Так за \\(d\\) ходов остаются не более двух кандидатов. Две монеты различаются еще за 3 тестирования большинством по трем детекторам, поэтому \\(D_{3,1}(2^k)\\le d+3=k+\\log_2 k+O(1)\\).",
      "standard_idea_ids": ["partition_state_space", "counting_bound"],
      "status": "ai_checked",
