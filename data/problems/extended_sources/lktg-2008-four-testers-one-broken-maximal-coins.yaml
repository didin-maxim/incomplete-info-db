  "strategies": [
    {
      "id": "str-compute-maximal-coins",
      "title": "Подставить ход в точную оценку",
      "text": "Ответы: а) \\(2^{11}\\); б) \\(3^{10}\\); в) \\(3^{36}\\).\n\nСначала покажем, что больше нельзя. Для детекторов из общей оценки \\(n(d+1)\\le 2^d\\) при \\(d=15\\) получаем \\(16n\\le 2^{15}\\), то есть \\(n\\le 2^{11}\\). Для весов из оценки \\(n(2d+1)\\le 3^d\\) при \\(d=13\\) получаем \\(27n\\le 3^{13}\\), то есть \\(n\\le 3^{10}\\); при \\(d=40\\) получаем \\(81n\\le 3^{40}\\), то есть \\(n\\le 3^{36}\\).\n\nТеперь докажем достижимость. Будем говорить, что монета подозреваемая, если она еще возможна без указания сломанного прибора, и почти исключенная типа \\(i\\), если она возможна только при условии, что сломан прибор \\(i\\). Монеты, исключенные двумя типами приборов, настоящие. Так как приборов четыре, а типов почти исключенных монет мы будем держать не больше трех, всегда есть прибор отсутствующего типа.\n\nНужна простая лемма о раскладке типов. Если предметы не более чем трех типов надо разложить в две коробки вместимостей \\(u\\le v\\), и \\(u\\) не меньше числа предметов самого малого типа, то это можно сделать так, чтобы в каждой коробке было не более двух типов. Для трех коробок вместимостей \\(u\\le v\\le w\\) достаточно условия \\(u+v\\) не меньше числа предметов самого малого типа. Доказательство одинаковое: выписать сначала все предметы малого типа, потом большого, потом среднего и разрезать эту строку по вместимостям.\n\nДетекторы, \\(2^{11}\\) монет за 15 тестов. Если до конца осталось \\(m\\) тестов, считаем значимость подозреваемой монеты равной \\(m+1\\), а почти исключенной - 1. Первые 11 тестов делают так. Пусть уже сделано \\(r\\) из этих 11 тестов; тогда осталось \\(m=15-r\\) тестов и есть \\(2^{11-r}\\) подозреваемых монет. Берем детектор отсутствующего типа, делим подозреваемые монеты пополам и раскладываем почти исключенные монеты в две части так, чтобы после любого ответа значимость стала не больше \\(2^{m-1}\\). Вместимости для старых почти исключенных монет в двух частях равны, а лемма о двух коробках позволяет сохранить не более двух старых типов в каждой части. После ответа появляются еще почти исключенные монеты типа использованного детектора, поэтому всего типов снова не больше трех. После 11 таких тестов остается одна подозреваемая монета и \\(2^4-5=11\\) почти исключенных монет.\n\nОставшиеся 4 теста добивают эту малую ситуацию. Первым из них кладем подозреваемую монету в одну часть вместе максимум с 4 почти исключенными, остальные максимум 7 почти исключенных - в другую часть; лемма о двух коробках позволяет это сделать по типам. Если ответ указывает на часть без подозреваемой монеты, остается не больше 8 почти исключенных монет, и три теста одним заведомо исправным детектором отсутствующего типа дают обычный двоичный поиск. Если ответ указывает на часть с подозреваемой монетой, остается одна подозреваемая и не больше 4 почти исключенных. Следующим тестом кладем подозреваемую монету в одну часть вместе максимум с 1 почти исключенной, остальные максимум 3 - в другую. В ветви без подозреваемой остается не больше 4 почти исключенных, что находится двумя обычными двоичными тестами отсутствующим детектором. В ветви с подозреваемой остается одна подозреваемая и максимум одна почти исключенная: один тест детектором другого типа либо сразу подтверждает подозреваемую монету, либо оставляет две почти исключенные монеты разных типов, которые последним тестом различает детектор отсутствующего типа.\n\nВесы, \\(3^{10}\\) за 13 и \\(3^{36}\\) за 40. Пусть \\(k=10,t=3\\) или \\(k=36,t=4\\); в обоих случаях \\(3^t=2(k+t)+1\\). Если до конца осталось \\(m\\) взвешиваний, значимость подозреваемой монеты равна \\(2m+1\\), почти исключенной - 1. Первые \\(k\\) взвешиваний устроены одинаково. После \\(r\\) из них осталось \\(m=k+t-r\\) взвешиваний и \\(3^{k-r}\\) подозреваемых монет. Берем весы отсутствующего типа, делим подозреваемые монеты на три равные группы и раскладываем старые почти исключенные монеты в три группы так, чтобы каждая возможная ветвь имела значимость не больше \\(3^{m-1}\\) и в каждой группе было не более двух старых типов. Это возможно по лемме о трех коробках: три вместимости для старых почти исключенных равны, а самый малый тип занимает не больше трети всех почти исключенных. Две группы кладем на чаши; если нужно, уже известными настоящими монетами выравниваем размеры. После ответа старые почти исключенные остаются только в указанной группе, а подозреваемые из двух других групп становятся почти исключенными типа использованных весов, так что типов снова не больше трех.\n\nПосле первых \\(k\\) взвешиваний остается одна подозреваемая монета и \\(3^t-(2t+1)\\) почти исключенных: при \\(t=3\\) это 20 монет, при \\(t=4\\) это 72 монеты. Для \\(t=3\\) делаем так. Одним взвешиванием помещаем подозреваемую монету в первую группу вместе максимум с 4 почти исключенными, а две другие группы имеют вместимость максимум 8 почти исключенных каждая; по лемме о трех коробках это можно сделать с не более чем двумя старыми типами в каждой группе. Если результат указывает на группу без подозреваемой, остается не больше 9 почти исключенных монет, и два обычных троичных взвешивания на весах отсутствующего типа находят фальшивую. Если результат указывает на группу с подозреваемой, остается одна подозреваемая и не больше 4 почти исключенных; следующим взвешиванием кладем подозреваемую отдельно, а почти исключенные делим на две группы вместимости 2. В ветви без подозреваемой остается не больше 3 почти исключенных, которые находятся одним обычным взвешиванием; в ветви с подозреваемой монета уже определена. Значит \\(3^{10}\\) монет находятся за \\(10+3=13\\) взвешиваний.\n\nДля \\(t=4\\) первое финальное взвешивание помещает подозреваемую монету в первую группу вместе максимум с 20 почти исключенными, а две другие группы имеют вместимость максимум 26 почти исключенных каждая. Лемма о трех коробках снова применима. Если результат указывает на первую группу, остается ровно задача предыдущего абзаца с тремя взвешиваниями. Если результат указывает на одну из двух других групп, подозреваемых монет больше нет и остается не больше 27 почти исключенных монет; три обычных троичных взвешивания на весах отсутствующего типа находят фальшивую. Значит \\(3^{36}\\) монет находятся за \\(36+4=40\\) взвешиваний.",
