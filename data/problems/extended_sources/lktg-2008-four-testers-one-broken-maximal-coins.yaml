  "impossibility_proofs": [
    {
      "id": "proof-maximal-coins-by-significance",
      "title": "Почему больше монет нельзя",
      "text": "Детекторы. Зафиксируем любой адаптивный алгоритм из \\(d\\) тестирований. Каждая строка из \\(d\\) ответов да/нет однозначно восстанавливает все заданные вопросы и, если алгоритм успешен, приводит к одному ответу о фальшивой монете. Для каждой фиксированной монеты есть как минимум \\(d+1\\) допустимых строк ответов: строка, где все ответы совпадают с истинными, и строки, где ровно на одном из \\(d\\) шагов дан противоположный ответ. Каждая такая строка допустима, потому что сломанный детектор может ошибиться именно на этом шаге и отвечать правильно на остальных. Эти \\(d+1\\) строк различны, а строки, допустимые для разных фальшивых монет, не могут совпасть в успешном алгоритме. Поэтому \\(n(d+1)\\le 2^d\\).\n\nВесы. После некоторого числа взвешиваний назовем монету подозреваемой, если она еще возможна без назначения конкретных весов сломанными. Если монету исключили только показания весов одного типа \\(i\\), назовем ее почти исключенной типа \\(i\\): она еще может быть фальшивой только если именно эти весы сломаны. Монета, исключенная двумя разными типами весов, уже настоящая. Если до конца осталось \\(m\\) взвешиваний, дадим подозреваемой монете значимость \\(2m+1\\), почти исключенной - 1, настоящей - 0.\n\nРассмотрим очередное взвешивание на весах типа \\(q\\). Подозреваемая монета для одного из трех исходов остается подозреваемой со значимостью \\(2m-1\\), а для двух других становится почти исключенной типа \\(q\\), поэтому сумма ее значимостей по трем исходам равна \\((2m-1)+1+1=2m+1\\). Почти исключенная монета типа не \\(q\\) может сохраниться только при одном истинном исходе, и сумма по исходам равна 1. Почти исключенная монета типа \\(q\\) может сохраниться при любом исходе, потому что именно эти весы могут быть сломаны, и сумма по исходам равна 3, то есть не меньше исходной 1. Значит сумма значимостей трех возможных ситуаций после взвешивания не меньше текущей значимости, и какой-то исход оставляет не меньше трети.\n\nПротивник может каждый раз выбирать такой исход. В начале значимость равна \\(n(2d+1)\\). После \\(d\\) взвешиваний успешный алгоритм должен оставить значимость не больше 1, иначе остается хотя бы одна неоднозначность. Поэтому \\(n(2d+1)\\le 3^d\\). Подстановка \\(d=15,13,40\\) в две полученные оценки дает соответственно \\(n\\le 2^{11}\\), \\(n\\le 3^{10}\\), \\(n\\le 3^{36}\\).",
      "standard_idea_ids": ["counting_bound"],
      "status": "ai_checked",
      "definition_ids": ["information_lower_bound"]
    }
