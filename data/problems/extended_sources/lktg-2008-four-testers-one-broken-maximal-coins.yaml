        "id": "stmt-lktg-2008-4-2",
        "title": "Максимальное число монет за заданное число ходов",
        "text": "Есть \\(n\\) одинаковых на вид монет, одна из них фальшивая. В первой модели есть четыре детектора, один из них сломан; за одно тестирование выбранный детектор отвечает, лежит ли фальшивая монета в указанном множестве. Во второй модели есть четыре пары чашечных весов, одна из них сломана; фальшивая монета легче настоящих, а исправные весы сравнивают две равные по числу монет группы. Сломанный прибор при каждом использовании может отвечать произвольно. Найдите наибольшее \\(n\\), для которого фальшивую монету можно гарантированно найти: а) детекторами за 15 тестирований; б) весами за 13 взвешиваний; в) весами за 40 взвешиваний.",
