  "ideas": [
    {
      "id": "idea-maximal-coins-lower-bound-attainment",
      "title": "Сначала ограничить число монет, затем попасть в границу",
      "text": "Сначала доказываем самодостаточную оценку невозможности: за \\(d\\) детекторных тестов можно обработать только \\(n\\) с \\(n(d+1)\\le 2^d\\), а за \\(d\\) взвешиваний только \\(n\\) с \\(n(2d+1)\\le 3^d\\). В трех числовых случаях это дает верхние границы \\(2^{11}\\), \\(3^{10}\\) и \\(3^{36}\\). Достижимость этих границ получается выписанным здесь частным случаем метода значимости: поддерживаем счет значимости и в конце отдельно разбираем малую задачу.",
      "standard_idea_ids": ["counting_bound", "partition_state_space"],
