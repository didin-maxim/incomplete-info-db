    {
      "id": "proof-no-finite-fair-division-protocol",
      "title": "Противник выбирает скрытые оценки после каждого разреза",
      "text": "Нормируем оценки так, что вся добыча для каждого разбойника стоит 100 долларов и 100 евро. Противник будет назначать оценки новых кусков так, чтобы для любого куска сумма долларовой и евровой оценок у первого разбойника равнялась такой же сумме у второго. Если при таком инварианте дележ оказался успешным, то первый получил часть суммарной стоимости не меньше 100; значит, и для второго эта часть имеет суммарную стоимость не меньше 100. Тогда оставшаяся часть, доставшаяся второму, имеет суммарную стоимость не больше 100, но должна стоить ему не меньше 50 долларов и не меньше 50 евро. Следовательно, второй получил ровно 50 долларов и ровно 50 евро; аналогично первый тоже получил ровно половину в обеих валютах.\n\nПусть перед очередным шагом успешного распределения еще не было. Один разбойник разрезает кусок на части \\(A\\) и \\(B\\). Если после разреза успешное распределение появилось, то \\(A\\) и \\(B\\) должны достаться разным разбойникам, иначе то же распределение существовало бы до разреза. Но оценки \\(A\\) и \\(B\\) для разбойника, который не делал этот разрез, можно назначить бесконечно многими способами, сохраняя инвариант сумм. Предположим, что при любом таком назначении успешное распределение возникает. Так как возможных распределений конечного набора кусков конечно, найдутся два разных назначения оценок, при которых успешно одно и то же распределение: например, \\(A\\) получает первый, а \\(B\\) получает второй. В этих двух назначениях стоимость \\(B\\) для второго различна, поэтому хотя бы в одном из них второй не получает ровно 50 долларов и ровно 50 евро. Это противоречит предыдущему абзацу. Значит, после каждого хода можно выбрать оценки так, что успешного точного дележа по-прежнему нет. Любой конечный протокол противник тем самым не дает завершить, поэтому гарантированного конечного протокола не существует.",
