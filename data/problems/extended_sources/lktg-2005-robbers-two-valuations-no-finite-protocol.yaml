        "id": "stmt-lktg-2005-robbers-side-problem",
        "title": "Два разбойника не знают оценок друг друга",
        "text": "Два разбойника делят безгранично делимую добычу. Каждый разбойник оценивает любую часть добычи в долларах и в евро; оценки могут быть разными у разных разбойников, и разбойники не знают оценочных функций друг друга. Каждый хочет получить часть, которая с его точки зрения стоит не меньше половины всей добычи и в долларах, и в евро. Разрешен следующий конечный протокол: на каждом шаге один из разбойников делит некоторую уже имеющуюся часть на две части с заданными им стоимостями, если такой разрез возможен; если после какого-то шага имеющиеся куски можно распределить так, что каждый получил желаемое, протокол останавливается. Докажите, что не существует протокола, который гарантированно осуществляет такой точный дележ.",
