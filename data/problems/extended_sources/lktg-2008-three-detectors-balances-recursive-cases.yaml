        "text": "Тремя детекторами, из которых один сломан, можно из 32 монет найти фальшивую за 9 тестирований. Детектор за одно тестирование отвечает, есть ли фальшивая монета в выбранном множестве; сломанный детектор может отвечать произвольно.",
