      "id": "str-32-detectors-by-eight-blocks",
      "title": "32 монеты: четыре блока по 8",
      "text": "Разделим 32 монеты на четыре группы по 8. Применим к этим группам тот же алгоритм, который в задаче про 8 монет применялся к четырем парам. В первом случае за три тестирования будет найдена группа из 8 монет, содержащая фальшивую; дальше внутри нее снова работает алгоритм для 8 монет. Во втором случае за четыре тестирования получаются две группы-кандидата и один исправный детектор; исправным детектором четыре дальнейших двоичных тестирования находят фальшивую среди 16 монет.",
      "standard_idea_ids": ["partition_state_space"],
      "status": "ai_checked",
      "definition_ids": ["strategy"]
    },
    {
      "id": "str-81-balances-by-four-ternary-digits",
      "title": "81 монета: четыре троичных разряда",
      "text": "Занумеруем монеты четырехзначными троичными словами. Первые два взвешивания проверяют первые два разряда на первых и вторых весах. Если оба раза подозрительна цифра 0, то монеты с ненулевыми первыми двумя разрядами точно настоящие. Третьим взвешиванием на третьих весах сравниваются три большие группы: начинающиеся с 00, с 01 или 02, и с 10 или 20, дополненные настоящими монетами до равных размеров. Если ответ указывает на 00, остается задача о 9 монетах за 4 взвешивания. Если ответ указывает на одну из двух других групп, он противоречит одному из первых двух приборов, поэтому другой из первых приборов точно исправен; тогда известен один разряд, и исправные весы находят оставшуюся монету обычным троичным поиском.",
