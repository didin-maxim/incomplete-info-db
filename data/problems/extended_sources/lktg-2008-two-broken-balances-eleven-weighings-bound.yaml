        "id": "stmt-lktg-2008-2-6c",
        "title": "Двое сломанных весов",
        "text": "Есть \\(n\\) одинаковых на вид монет, одна из них фальшивая и легче остальных. Можно пользоваться любым числом чашечных весов, но среди них есть двое сломанных весов, которые при каждом использовании могут отвечать произвольно. Докажите, что если \\(n>3^6\\), то за 11 взвешиваний фальшивую монету гарантированно найти нельзя.",
