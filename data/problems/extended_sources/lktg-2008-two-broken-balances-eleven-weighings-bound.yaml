      "id": "proof-243-transcripts",
      "title": "Подсчет строк ответов",
      "text": "Пусть алгоритм за 11 ходов всегда находит фальшивую монету. Каждая строка из 11 трехисходных ответов должна указывать на одну монету. Для каждой фиксированной монеты допустимы как минимум \\(1+2\\cdot 11+4\\cdot 55=243\\) различных строк: все ответы правильны; ровно один ответ неверен; ровно два ответа неверны. Эти строки различны и должны соответствовать той же монете. Поэтому всего строк не меньше \\(243n\\), но трехисходных строк длины 11 только \\(3^{11}\\). Получаем \\(243n\\le 3^{11}\\), то есть \\(n\\le 3^6\\).",
