      "id": "idea-two-errors-need-many-transcripts",
      "title": "Одна монета должна покрывать все варианты двух ошибок",
      "text": "Для фиксированной фальшивой монеты возможны как полностью правильная строка ответов, так и строки с одним или двумя неверными ответами. Эти строки должны оставаться за той же монетой, иначе алгоритм не выдержит двух сломанных приборов.",
