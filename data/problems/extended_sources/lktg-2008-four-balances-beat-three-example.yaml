        "id": "stmt-lktg-2008-4-3",
        "title": "Четвертая пара весов действительно помогает",
        "text": "Есть \\(n\\) одинаковых на вид монет, одна из них фальшивая и легче остальных. Есть несколько пар чашечных весов; ровно одна пара сломана и при каждом использовании может давать произвольный из трех ответов. Исправные весы сравнивают две равные по числу монет группы и показывают, в какой из трех частей разбиения находится легкая монета: слева, справа или вне чашек. Приведите такое значение \\(n\\), при котором четырьмя парами весов с одной сломанной фальшивую монету можно гарантированно найти за меньшее число взвешиваний, чем тремя парами весов с одной сломанной.",
        "source_ids": [
