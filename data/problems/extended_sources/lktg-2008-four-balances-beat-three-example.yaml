  "ideas": [
    {
      "id": "idea-four-beat-three-at-three-to-ten",
      "title": "Взять пограничный случай для четырех весов",
      "text": "Подходит \\(n=3^{10}\\). Для четырех пар весов не нужен весь асимптотический результат 4.4: достаточно численного частного случая \\(B_{4,1}(3^{10})\\le 13\\), который доказывается тем же счетом значимости и коротким финальным добором при \\(t=3\\). Для трех пар весов общая нижняя оценка \\(n(2d+1)\\le 3^d\\) при \\(n=3^{10}\\), \\(d=13\\) достигается с равенством; если бы три пары весов справлялись за 13 ходов, каждое взвешивание было бы обязано идеально делить значимость на три. Разбор первых трех взвешиваний показывает, что такое идеальное деление невозможно.",
      "standard_idea_ids": [
        "counting_bound",
        "partition_state_space"
      ],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-four-balances-beat-three-complete",
      "title": "Проверить \\(n=3^{10}\\)",
      "text": "Обозначим через \\(B_{x,1}(n)\\) минимальное число взвешиваний, достаточное для \\(n\\) монет при \\(x\\) парах весов, из которых ровно одна сломана. Покажем, что \\(B_{4,1}(3^{10})\\le 13\\), но \\(B_{3,1}(3^{10})>13\\).\n\nСначала докажем нужный частный случай для четырех весов. Если до конца осталось \\(m\\) взвешиваний, назовем монету подозреваемой, если она еще возможна без указания конкретных сломанных весов, и почти исключенной типа \\(i\\), если она возможна только при условии, что сломаны весы типа \\(i\\). Подозреваемой монете приписываем значимость \\(2m+1\\), почти исключенной - 1, уже надежно исключенной - 0. Будем поддерживать инвариант: общая значимость не превосходит \\(3^m\\), а почти исключенные монеты имеют не более трех типов. Тогда среди четырех пар весов всегда есть тип, которого нет среди почти исключенных; используем именно эти весы.\n\nНужна простая лемма о раскладке трех типов. Пусть предметы трех типов с размерами \\(a_1\\le a_2\\le a_3\\) надо разложить по трем коробкам вместимостей \\(b_1\\le b_2\\le b_3\\), причем суммарной вместимости хватает. Если \\(b_1+b_2\\ge a_1\\), то это можно сделать так, чтобы в каждой коробке было не более двух типов: выпишем сначала предметы самого малого типа, затем самого большого, затем среднего и разрежем строку по вместимостям. Тогда первая коробка не дойдет до среднего типа, третья не заденет малый тип, а средняя не может содержать все три типа; иначе она содержала бы весь большой тип и еще два непустых края, что противоречит \\(b_2\\le b_3\\).\n\nПервые 10 взвешиваний делят подозреваемые монеты на три равные группы. Старые почти исключенные монеты раскладываем по свободным вместимостям так, чтобы каждая возможная ветвь имела значимость не больше \\(3^{m-1}\\) и каждая группа содержала старые почти исключенные не более двух типов; лемма применима, потому что самый малый тип занимает не больше трети всех старых почти исключенных, а суммарная свободная вместимость достаточна по инварианту. Две равные по размеру группы кладем на чаши; после первых двух ходов уже есть надежно исключенные монеты, которыми можно выравнивать чаши, а в первые два хода равенство обеспечивается прямым равным делением. После ответа старые почти исключенные остаются только в указанной группе, а подозреваемые из двух других групп становятся почти исключенными типа использованных весов, поэтому типов снова не больше трех. После 10 таких ходов остается одна подозреваемая монета и не более \\(3^3-(2\\cdot3+1)=20\\) почти исключенных.\n\nОсталось три взвешивания. В первом из них кладем подозреваемую монету в первую группу; к ней можно добавить до 4 почти исключенных, а во вторую и третью группы - до 8 почти исключенных в каждую. Эти вместимости суммарно равны 20, и лемма о трех типах снова позволяет разложить почти исключенные монеты так, чтобы в каждой группе было не более двух старых типов. Если ответ указывает на группу без подозреваемой монеты, подозреваемых больше нет и остается не более 9 почти исключенных монет; весы типа, отсутствующего среди их типов, исправны во всех оставшихся вариантах, поэтому два обычных троичных взвешивания находят фальшивую монету. Если ответ указывает на группу с подозреваемой монетой, остается одна подозреваемая и не более 4 почти исключенных. Следующим взвешиванием кладем подозреваемую отдельно, а почти исключенные делим на две группы вместимости 2. При ответе на группу без подозреваемой остается не более 3 почти исключенных монет, которые находятся одним обычным троичным взвешиванием на весах отсутствующего типа; при ответе на группу с подозреваемой эта монета уже единственный возможный ответ. Значит, четырьмя весами \\(3^{10}\\) монет можно найти за 13 взвешиваний.\n\nТеперь докажем, что трех весов за 13 взвешиваний не хватит. Воспользуемся тем же счетом значимости из общей нижней оценки. При очередном взвешивании сумма значимостей трех возможных следующих ситуаций не меньше текущей значимости: подозреваемая монета дает вклады \\((2m-1)+1+1=2m+1\\), почти исключенная монета другого типа сохраняется только в одной ветви, а почти исключенная монета типа использованных весов может сохраниться во всех трех ветвях. Поэтому успешный алгоритм длины \\(d\\) обязан удовлетворять \\(n(2d+1)\\le 3^d\\).\n\nДля \\(n=3^{10}\\) и \\(d=13\\) это равенство: \\((2\\cdot 13+1)3^{10}=3^{13}\\). Значит, если бы алгоритм на трех парах весов за 13 ходов существовал, у него не было бы запаса: после каждого возможного ответа значимость должна была бы становиться ровно втрое меньше. Отсюда следуют два важных последствия. Во-первых, очередное взвешивание нельзя делать на весах того типа, почти исключенные монеты которого уже есть: иначе каждая такая монета дала бы вклад 3 в сумме трех продолжений вместо прежнего вклада 1. Во-вторых, после каждого ответа почти исключенные монеты могут иметь не более двух типов; в частности, эти типы не включают тип весов, выбранных для следующего взвешивания.\n\nПосле первого взвешивания рассмотрим любой ответ. Чтобы значимость стала ровно \\(3^{12}\\), ответ должен оставить \\(3^9\\) подозреваемых монет, а остальные \\(2\\cdot 3^9\\) монет станут почти исключенными типа первых весов. Итак, ситуация имеет вид \\((3^9,2\\cdot 3^9,0)\\), где первая координата - число подозреваемых монет, а две другие - числа почти исключенных монет двух имеющихся типов.\n\nВо втором взвешивании используются весы другого типа. Пусть подозреваемые монеты разбиты между тремя возможными исходами в количествах \\(a,b,c\\), так что \\(a+b+c=3^9\\). Рассмотрим ветку, где ответ указывает на первую из этих групп. После этого в ней \\(a\\) подозреваемых монет, \\(3^9-a\\) новых почти исключенных монет типа вторых весов, и некоторое число \\(t\\) старых почти исключенных монет типа первых весов. Значимость должна быть \\(3^{11}\\), поэтому\n\\[\n  23a+(3^9-a)+t=3^{11},\n\\]\nто есть \\(t=8\\cdot 3^9-22a\\). Из \\(t\\ge 0\\) получаем \\(a\\le \\frac4{11}3^9\\). То же верно для \\(b\\) и \\(c\\), а из \\(a+b+c=3^9\\) следует также \\(a,b,c\\ge \\frac3{11}3^9\\).\n\nРассмотрим третье взвешивание в ветке с числом \\(a\\). Все \\(a\\) подозреваемых монет не могут попасть в одну группу: тогда при ответе на эту группу значимость была бы как минимум \\(21a\\ge 21\\cdot \\frac3{11}3^9>3^{10}\\), а она обязана быть ровно \\(3^{10}\\). Значит, подозреваемые монеты лежат хотя бы в двух группах. Тогда для каждого возможного ответа появятся новые почти исключенные монеты типа третьих весов, а старые почти исключенные монеты, лежащие в указанной группе, сохранят свои прежние типы. Чтобы типов почти исключенных монет после ответа было не больше двух, каждая из трех групп может содержать старые почти исключенные монеты только одного типа. Поэтому одна из групп содержит все старые почти исключенные монеты некоторого типа; обозначим их число через \\(s\\), а число подозреваемых монет в этой группе через \\(x\\).\n\nЕсли третье взвешивание указывает именно на эту группу, то значимость после него равна\n\\[\n  21x+(a-x)+s=s+a+20x.\n\\]\nОна должна быть \\(3^{10}\\), значит \\(3^{10}-s-a\\) делится на 20. Но \\(s\\) может быть только одним из двух чисел почти исключенных монет в текущей ветке: либо \\(s=3^9-a\\), либо \\(s=8\\cdot 3^9-22a\\). В первом случае \\(3^{10}-s-a=2\\cdot 3^9\\), что не делится на 20. Во втором случае \\(3^{10}-s-a=21a-5\\cdot 3^9\\); делимость на 20 тогда влечет делимость \\(a\\) на 5.\n\nТот же аргумент применим к веткам, где второе взвешивание указывает на группы с \\(b\\) и \\(c\\) подозреваемыми монетами. Получаем, что \\(a,b,c\\) все делятся на 5. Но \\(a+b+c=3^9\\), а \\(3^9\\) на 5 не делится. Противоречие. Значит, \\(B_{3,1}(3^{10})>13\\), тогда как \\(B_{4,1}(3^{10})\\le 13\\). Следовательно, \\(n=3^{10}\\) - требуемый пример.",
