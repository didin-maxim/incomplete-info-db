      "id": "str-two-not-know-announcements-2002",
      "title": "От неделителей к единственному числу Mary",
      "text": "Пусть числа John и Mary равны \\(j\\) и \\(m\\). Если \\(j\\) не делит 2002, John понял бы, что показана сумма, и нашел бы \\(m=2002-j\\). Значит, из его незнания следует, что \\(j\\mid 2002\\), причем \\(j\\ne 2002\\), так что \\(j\\le 1001\\).\n\nMary слышит это рассуждение. Если бы \\(m\\ne 1001\\) и \\(m\\mid 2002\\), то она восстановила бы \\(j=2002/m\\); если бы \\(m\\) не делило 2002, то восстановила бы \\(j=2002-m\\) как в суммовом случае. Единственный способ сохранить неопределенность после слов John - \\(m=1001\\). Проверка показывает, что при \\(m=1001\\) действительно остаются совместимые сценарии.",
