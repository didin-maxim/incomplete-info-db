        "title": "Дима показывает одну карточку Пете и Васе",
        "text": "Петя и Вася выбрали по натуральному числу и сообщили их Диме. Дима записал сумму на одной карточке, произведение на другой, спрятал одну карточку и показал другую Пете и Васе. На показанной карточке было число 2002. Петя сказал, что не может определить число Васи. Услышав это, Вася сказал, что тоже не может определить число Пети. Определите число Васи.",
