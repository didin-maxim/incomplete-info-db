      "title": "От неделителей к единственному числу Васи",
      "text": "Пусть числа Пети и Васи равны \\(p\\) и \\(v\\). Если \\(p\\) не делит 2002, Петя понял бы, что показана сумма, и нашел бы \\(v=2002-p\\). Значит, из его незнания следует, что \\(p\\mid 2002\\), причем \\(p\\ne 2002\\), так что \\(p\\le 1001\\).\n\nВася слышит это рассуждение. Если бы \\(v\\ne 1001\\) и \\(v\\mid 2002\\), то он восстановил бы \\(p=2002/v\\); если бы \\(v\\) не делило 2002, то восстановил бы \\(p=2002-v\\) как в суммовом случае. Единственный способ сохранить неопределенность после слов Пети - \\(v=1001\\). Проверка показывает, что при \\(v=1001\\) действительно остаются совместимые сценарии.",
