        "text": "John and Mary each chose a natural number and told them to Bill. Bill wrote the sum on one card and the product on another, hid one card, and showed the other card to both John and Mary. The shown number was 2002. John said that he could not determine Mary's number. Knowing this, Mary said that she also could not determine John's number. Determine Mary's number.",
