      "title": "Противник сохраняет не меньше трети кандидатов",
      "text": "После каждого взвешивания для любой конкретной монеты существует хотя бы один ответ весов, при котором эта монета остается возможной фальшивой: если ответ неудобен, можно считать использованные весы сломанными. Следовательно, найдется ответ, который отсекает не более двух третей текущих кандидатов и оставляет не меньше трети.\n\nПервое взвешивание в худшем случае вообще не дает надежной информации, потому что могло быть сделано на сломанном приборе. После \\(k\\) взвешиваний у противника остается не меньше \\(3^k/3^{k-1}=3\\) возможных монет, значит единственная фальшивая монета не определена.",
