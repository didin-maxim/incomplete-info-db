      "title": "Тяжелый и легкий случаи дают противоположные исходы",
      "text": "Если монета участвует в некотором взвешивании слева, ее тяжелость сдвигает исход в сторону левой чаши, а легкость - в противоположную сторону. Поэтому одна подпись монеты кодирует сразу два состояния через пару \\(v\\) и \\(-v\\).",
