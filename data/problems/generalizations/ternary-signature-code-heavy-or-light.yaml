      "id": "str-assign-ternary-signatures",
      "title": "Назначить монетам по одной записи из пары",
      "text": "Выберем для каждой подозрительной монеты ненулевую запись \\(v_i\\in\\{-1,0,+1\\}^q\\), причем никакие две выбранные записи не равны и не противоположны. В \\(t\\)-м взвешивании кладем монеты со знаком \\(+1\\) на левую чашу, со знаком \\(-1\\) на правую, а знак 0 означает неучастие. Заведомо настоящие монеты используются только как балласт, чтобы чаши содержали равные массы настоящих монет в отсутствие фальшивки.\n\nПосле \\(q\\) взвешиваний получаем запись из трех исходов. Если она равна \\(v_i\\), то монета \\(i\\) тяжелее; если равна \\(-v_i\\), то монета \\(i\\) легче. Нулевую запись нельзя назначать подозрительной монете, потому что она не различила бы направление отличия. Всего ненулевых записей \\(3^q-1\\), они разбиваются на \\((3^q-1)/2\\) противоположных пар, что и дает предел этой схемы.",
