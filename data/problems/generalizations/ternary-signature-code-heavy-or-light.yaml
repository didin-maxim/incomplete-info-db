  "strategies": [
    {
      "id": "str-assign-ternary-signatures",
      "title": "Назначить монетам представители пар",
      "text": "Выберем для каждой подозрительной монеты ненулевое слово \\(v_i\\in\\{-1,0,+1\\}^q\\), причем никакие два выбранных слова не равны и не противоположны. В \\(t\\)-м взвешивании кладем монеты с координатой \\(+1\\) на левую чашу, с координатой \\(-1\\) на правую, а координата 0 означает неучастие. Заведомо настоящие монеты используются только как балласт, чтобы чаши содержали равные массы настоящих монет в отсутствие фальшивки.\n\nПосле \\(q\\) взвешиваний получаем тернарное слово исходов. Если оно равно \\(v_i\\), то монета \\(i\\) тяжелее; если равно \\(-v_i\\), то монета \\(i\\) легче. Нулевое слово не назначается подозрительной монете, потому что оно не различило бы знак отличия. Всего ненулевых тернарных слов \\(3^q-1\\), они разбиваются на \\((3^q-1)/2\\) противоположных пар, что и дает емкость этой сигнатурной схемы.",
