        "text": "Есть \\(N\\) подозрительных монет, ровно одна фальшивая, но неизвестно, легче она или тяжелее настоящих. Есть чашечные весы и достаточно заведомо настоящих монет для балансировки чаш. Как с помощью \\(q\\) заранее спроектированных взвешиваний закодировать монету и знак отличия?",
