        "id": "stmt-preassigned-two-uses",
        "title": "Тот же предел без изменения плана",
        "text": "Среди внешне одинаковых монет ровно одна фальшивая, и известно, что она легче настоящих. Нужно заранее, до получения каких-либо результатов, назначить все \\(n\\) взвешиваний на чашечных весах без гирь. Каждую монету разрешено класть на весы не более двух раз за весь план. Докажите, что так можно гарантированно найти легкую монету среди \\(2n^2+1\\) монет.",
