  "ideas": [
    {
      "id": "idea-short-ternary-words",
      "title": "Монета получает слово из Л, П и 0",
      "text": "Для каждой монеты заранее записываем слово длины \\(n\\). Буква Л означает: в этом взвешивании положить монету на левую чашу; П - на правую; 0 - не класть. Ограничение двух участий превращается в простое условие: в слове должно быть не больше двух ненулевых букв.",
      "standard_idea_ids": ["ternary_weighing_code"],
      "status": "ai_checked"
    },
    {
      "id": "idea-full-symmetric-family-balances",
      "title": "Полная симметричная таблица сама балансируется",
      "text": "Берем все слова длины \\(n\\) с нулем, одной или двумя ненулевыми буквами. Из-за симметрии Л и П в каждой фиксированной позиции таких слов с Л ровно столько же, сколько с П. Поэтому каждое заранее назначенное взвешивание содержит поровну монет на левой и правой чашах.",
      "standard_idea_ids": ["ternary_weighing_code", "symmetry_breaking"],
      "status": "ai_checked"
    }
  ],
  "strategies": [
    {
      "id": "str-all-words-of-weight-at-most-two",
      "title": "Назначить все короткие слова",
      "text": "Занумеруем монеты словами длины \\(n\\) над алфавитом \\(\\{Л,П,0\\}\\), в которых не больше двух ненулевых букв. Таких слов\n\\[\n1+2n+4\\binom n2=1+2n+2n(n-1)=2n^2+1.\n\\]\nПустое слово \\(00\\ldots0\\) тоже используется: соответствующая монета никогда не кладется на весы, и если все \\(n\\) результатов будут равновесиями, это как раз она.\n\nВ \\(i\\)-м взвешивании кладем на левую чашу все монеты, у которых в \\(i\\)-й позиции стоит Л, а на правую - все монеты, у которых там стоит П. У каждой монеты в ее слове не больше двух букв Л или П, значит она участвует не более чем в двух взвешиваниях.\n\nПроверим баланс строк. В фиксированной позиции \\(i\\) есть одно односимвольное слово с Л и одно с П. Для каждой другой позиции \\(j\\) и каждого выбора второй буквы получаются два слова с Л в позиции \\(i\\), и ровно два симметричных слова с П в позиции \\(i\\). Итого в строке \\(i\\) по \\(1+2(n-1)=2n-1\\) монет на каждой чаше.\n\nПосле всех взвешиваний записываем результат словом длины \\(n\\): Л, если левая чаша оказалась легче, П, если правая чаша оказалась легче, и 0 при равновесии. Если фальшивая легкая монета в своем слове имеет Л, то именно левая чаша становится легче; если П - правая; если 0 - эта монета в строке не участвует и равновесие не нарушается. Поэтому слово результатов в точности совпадает со словом фальшивой монеты. Все слова различны, значит монета определяется однозначно.",
      "standard_idea_ids": ["ternary_weighing_code"],
      "status": "ai_checked",
      "definition_ids": ["balance_scale", "strategy"]
    }
  ],
  "impossibility_proofs": [
    {
      "id": "ub-from-adaptive-problem",
      "title": "Почему больше в этих правилах нельзя",
      "text": "Любой заранее назначенный план является частным случаем адаптивной стратегии: адаптивной стратегии просто разрешили бы выбирать следующие взвешивания по результатам, но она может этого не делать. Для исходной задачи с тем же ограничением двух участий верхняя оценка \\(2n^2+1\\) доказывается рекуррентно: если в первом взвешивании на каждой чаше по \\(s\\) монет, то при перекосе нужно уметь за \\(n-1\\) шагов различить \\(s\\) уже один раз использованных монет, откуда \\(s\\le 2n-1\\); при равновесии вне весов остается не больше прежнего максимума для \\(n-1\\). Поэтому \\(f(n)\\le f(n-1)+2(2n-1)\\), \\(f(1)=3\\), и \\(f(n)\\le2n^2+1\\). Построенная выше неадаптивная таблица достигает этой же величины.",
      "standard_idea_ids": ["decision_tree_lower_bound"],
      "status": "ai_checked",
      "definition_ids": ["information_lower_bound"]
    }
  ],
