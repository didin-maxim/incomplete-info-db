      "id": "str-three-way-split",
      "title": "Сначала 3 против 3, затем 1 против 1",
      "text": "В общем случае, пока осталось не больше \\(3^t\\) кандидатов и есть \\(t\\) взвешиваний, разделим кандидатов на три группы размеров не больше \\(3^{t-1}\\). Две равные по размеру группы взвесим друг против друга; если одна группа тяжелее, фальшивая монета в ней, а если весы в равновесии, фальшивая в третьей группе. После этого остается не больше \\(3^{t-1}\\) кандидатов и \\(t-1\\) взвешиваний.\n\nДля 9 монет это выглядит так: разделим монеты на группы \\(A,B,C\\) по 3 монеты. Взвесим \\(A\\) против \\(B\\). Если одна из этих групп тяжелее, фальшивая монета находится в ней; если весы в равновесии, фальшивая монета находится в \\(C\\). После первого взвешивания остается ровно три подозрительные монеты. Вторым взвешиванием сравним две из них. Если одна тяжелее, она фальшивая; если весы в равновесии, фальшива третья.",
