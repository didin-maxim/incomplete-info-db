  "strategies": [
    {
      "id": "str-explicit-three-weighings",
      "title": "Разбор после первого взвешивания 4 против 4",
      "text": "Обозначим монеты числами от 1 до 12. Сначала взвесим \\(1,2,3,4\\) против \\(5,6,7,8\\).\n\nЕсли равновесие, то монеты 1-8 настоящие, а фальшивая среди 9-12. Взвесим \\(9,10,11\\) против \\(1,2,3\\). Если равновесие, фальшива 12-я; третьим взвешиванием сравним 12 с настоящей монетой и узнаем, легче она или тяжелее. Если левая чаша тяжелее, то одна из 9,10,11 тяжелая; третьим взвешиванием сравним 9 и 10, и либо тяжелая из них фальшива, либо при равновесии тяжелая 11. Если левая чаша легче, тот же разбор показывает, какая из 9,10,11 легкая.\n\nПусть теперь в первом взвешивании левая чаша тяжелее. Тогда возможны только два типа состояний: одна из 1,2,3,4 тяжелая или одна из 5,6,7,8 легкая; монеты 9-12 настоящие. Вторым взвешиванием сравним \\(1,2,5\\) против \\(3,6,9\\). Если левая чаша тяжелее, остаются варианты: 1 тяжелая, 2 тяжелая или 6 легкая. Третьим взвешиванием сравним 1 и 2: более тяжелая из них фальшива, а при равновесии фальшива легкая 6. Если во втором взвешивании правая чаша тяжелее, остаются варианты: 3 тяжелая или 5 легкая. Третьим взвешиванием сравним 3 с настоящей 9: если 3 тяжелее, фальшива 3; иначе фальшива легкая 5. Если второе взвешивание дает равновесие, остаются варианты: 4 тяжелая, 7 легкая или 8 легкая. Третьим взвешиванием сравним 7 и 8: если одна легче, она фальшива; если равновесие, фальшива тяжелая 4.\n\nСлучай, когда в первом взвешивании правая чаша тяжелее, полностью симметричен предыдущему: надо поменять местами группы 1-4 и 5-8, а слова \"тяжелая\" и \"легкая\" заменить на противоположные в соответствующих кандидатах.",
      "standard_idea_ids": [
        "ternary_weighing_code"
      ],
      "status": "ai_checked",
      "definition_ids": [
        "balance_scale"
      ]
    }
  ],
