        "id": "stmt-as-ternary-signature-code",
        "title": "Двенадцать монет и таблица трех взвешиваний",
        "text": "Даны 12 одинаковых на вид монет, среди которых одна фальшивая и может быть легче или тяжелее настоящих. Каждой монете можно заранее назначать схему участия в трех взвешиваниях; тяжелый и легкий случаи для одной монеты дают противоположные цепочки исходов. Число 12 существенно для версии без эталонной монеты: три взвешивания дают 27 вариантов исходов, но нулевой исход и требование уравновешенных чаш не позволяют просто взять все 13 противоположных пар.",
