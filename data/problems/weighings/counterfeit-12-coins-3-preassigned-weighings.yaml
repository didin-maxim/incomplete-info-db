        "id": "stmt-12-preassigned",
        "title": "Нельзя менять план после результатов",
        "text": "Даны 12 одинаковых на вид монет. Ровно одна монета фальшивая, но заранее неизвестно, легче она настоящих или тяжелее. Нужно за три взвешивания на чашечных весах найти фальшивую монету и определить, легче она или тяжелее. Все три взвешивания надо объявить заранее, до получения каких-либо результатов.",
