rnary-table&quot;, &quot;title&quot;: &quot;Построить сбалансированную таблицу взвешиваний&quot;, &quot;text&quot;: &quot;Выберем \\(n\\) столбцов из тернарных \\(k\\)-векторов так, чтобы вместе с противоположными столбцами они были различны, нулевой столбец не использовался, а сумма столбцов была нулевой. В \\(i\\)-м взвешивании монеты со знаком \\(+1\\) кладем на левую чашу, со знаком \\(-1\\) - на правую, со знаком \\(0\\) не используем. Условие нулевой суммы гарантирует равное число настоящих монет на чашах. Полученный вектор исходов сразу указывает либо столбец фальшивой монеты, либо его отрицание, то есть одновременно монету и знак отклонения.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;\\(2n=3^k-3\\) направленных состояний: какая монета фальшивая и тяжелее она или легче&quot;, &quot;observations&quot;: [&quot;\\(k\\) заранее заданных трехисходных взвешиваний&quot;], &quot;allowed_actions&quot;: [&quot;до начала опыта назначить для каждой монеты левую чашу, правую чашу или отсутствие в каждом взвешивании&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;, &quot;identify_heavy_or_light&quot;], &quot;strategy_type&quot;: [&quot;nonadaptive_strategy&quot;, &quot;ternary_code&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;komal_2010_a512&quot;, &quot;counterfeit_coin&quot;, &quot;nonadaptive_weighing&quot;, &quot;ternary_signature&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 12, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;heavier_or_lighter_unknown&quot;, &quot;weighing_count&quot;: 3, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_coin_and_sign_for_n=(3^k-3)/2&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_hard&quot;, &quot;local_score&quot;: 7, &quot;comment&quot;: &quot;A-level KöMaL; компактная общая конструкция через тернарные подписи.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;ternary_code&quot;, &quot;nonadaptive_strategy&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-komal-2010-a512&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Параметр object_count в профиле дан для случая k=3; сама карточка формулирует общее \\((3^k-3)/2\\).&quot;]}}, {&quot;id&quot;: &quot;komal-2020-k664-six-coins-two-light&quot;, &quot;title&quot;: &quot;KöMaL K.664: две легкие монеты из шести, найти одну&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;lower_bound&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-komal-2020-k664&quot;, &quot;title&quot;: &quot;Минимум взвешиваний для нахождения одной легкой монеты&quot;, &quot;text&quot;: &quot;Есть шесть монет. Четыре весят по 100 граммов, а две оставшиеся - по 99 граммов. За сколько взвешиваний на чашечных весах без гирь можно гарантированно определить хотя бы одну из легких монет?&quot;, &quot;source_ids&quot;: [&quot;src-komal-2020-k664&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-equal-first-weighing-still-gives-pair&quot;, &quot;title&quot;: &quot;Равновесие тоже оставляет известную одинаковую пару&quot;, &quot;text&quot;: &quot;Если сравнение двух пар монет дает равновесие, то либо на весах четыре настоящие монеты, либо в каждой паре по одной легкой. В обоих случаях две не взвешенные монеты имеют одинаковый вес, и это можно использовать как контроль во втором взвешивании.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-pair-then-control&quot;, &quot;title&quot;: &quot;Сравнить две пары, затем одну монету с контрольной&quot;, &quot;text&quot;: &quot;Обозначим монеты \\(A,B,C,D,E,F\\). Сначала сравним \\(A+B\\) и \\(C+D\\). Если, например, \\(A+B\\) легче, то среди \\(A,B\\) есть легкая монета, а \\(C,D\\) обе настоящие; вторым взвешиванием сравним \\(A\\) с \\(C\\). Если \\(A\\) легче, она искомая, иначе искомая \\(B\\). Если первое взвешивание дало равновесие, то \\(E\\) и \\(F\\) имеют одинаковый вес. Вторым взвешиванием сравним \\(A\\) и \\(E\\): при равновесии \\(A\\) настоящая и можно указать \\(B\\); если одна из них легче, укажем ее.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-one-weighing-not-enough&quot;, &quot;title&quot;: &quot;Одно взвешивание не может указать конкретную легкую монету&quot;, &quot;text&quot;: &quot;Если за одно взвешивание положить на чаши разное число монет, то разница в числе настоящих монет не может быть компенсирована двумя граммами возможного дефекта; исход заранее определяется размерами чаш и не указывает общую легкую монету во всех 15 возможных парах. Поэтому достаточно рассмотреть сравнение равных групп.\n\nПри сравнении одной монеты с одной исход \&quot;равновесие\&quot; совместим как с двумя настоящими взвешенными монетами, так и с двумя легкими; общей гарантированно легкой монеты нет. При сравнении двух пар равновесие совместимо с двумя легкими вне весов и с одной легкой на каждой чаше; снова нет общей монеты, которую можно назвать. При сравнении трех против трех любой неравный исход лишь показывает, что обе легкие монеты находятся на более легкой стороне, но не выбирает одну из трех; равновесие оставляет по одной легкой на каждой чаше. Значит одного взвешивания недостаточно.&quot;, &quot;standard_idea_ids&quot;: [&quot;indistinguishable_states&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;15 вариантов выбора двух легких монет среди шести&quot;, &quot;observations&quot;: [&quot;до двух трехисходных сравнений на чашечных весах&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно сравнивать равные по числу группы монет&quot;], &quot;goal&quot;: [&quot;identify_one_lighter_coin&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;state_space_partition&quot;], &quot;lower_bound_method&quot;: [&quot;indistinguishability&quot;], &quot;keywords&quot;: [&quot;komal_2020_k664&quot;, &quot;two_light_coins&quot;, &quot;find_one&quot;, &quot;six_coins&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 6, &quot;counterfeit_count&quot;: 2, &quot;counterfeit_type&quot;: &quot;lighter_known&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_one_light_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;K-level KöMaL; короткая стратегия с нижней оценкой на одно взвешивание.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;indistinguishability_argument&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-komal-2020-k664&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Добавлена как малая, но чистая задача про цель identify_one вместо полного восстановления.&quot;, &quot;2026-05-18 solution-ideas-review: нижняя оценка на одно взвешивание уточнена, чтобы покрывать неравные размеры чаш и все равные сравнения 1:1, 2:2, 3:3.&quot;]}}, {&quot;id&quot;: &quot;kvant-2002-05-eight-circle-three-heavy&quot;, &quot;title&quot;: &quot;Квант-2002: три соседние тяжелые монеты на круге&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Восемь монет по кругу&quot;, &quot;text&quot;: &quot;Восемь одинаковых на вид монет расположены по кругу. Известно, что три из них фальшивые и более тяжелые, причем эти три монеты лежат подряд. Все фальшивые монеты весят одинаково, все настоящие тоже. Можно ли определить все три фальшивые монеты двумя взвешиваниями на чашечных весах без гирь?&quot;, &quot;source_ids&quot;: [&quot;src-kvant-2003-02-young-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-circle-block-signature&quot;, &quot;title&quot;: &quot;Соседний блок дает мало скрытых состояний&quot;, &quot;text&quot;: &quot;Хотя монет восемь, скрытых состояний только восемь: начало блока из трех соседних тяжелых монет. Два взвешивания достаточно, если первое отделяет крупные классы, а второе проверяет границу блока.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-compare-123-with-567&quot;, &quot;title&quot;: &quot;Сравнить 1,2,3 с 5,6,7, затем 4 с 8&quot;, &quot;text&quot;: &quot;Пронумеруем монеты по кругу. Первым взвешиванием сравним монеты 1,2,3 с монетами 5,6,7. Если равновесие, то в каждой тройке по одной тяжелой монете; тогда второе взвешивание 4 против 8 указывает, какая из них тяжелая, а вместе с ней тяжелы две соседние монеты. Если первое взвешивание неравное, то в более тяжелой тройке две или три фальшивые монеты. Снова сравним 4 и 8. Если они равны, весь тяжелый блок лежит в более тяжелой тройке первого взвешивания. Если не равны, тяжелая из 4 и 8 является концом блока; две остальные фальшивые монеты - ее соседи со стороны более тяжелой тройки.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;8 возможных положений подряд идущего блока из трех тяжелых монет&quot;, &quot;observations&quot;: [&quot;два результата чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;выбирать равные по числу группы монет&quot;], &quot;goal&quot;: [&quot;identify_three_counterfeit_coins&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;ternary_code&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;kvant_math_6_8&quot;, &quot;consecutive_counterfeits&quot;, &quot;circle_symmetry&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 8, &quot;counterfeit_count&quot;: 3, &quot;counterfeit_type&quot;: &quot;heavier_known_consecutive&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_all_counterfeits&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Ключевое упрощение - использовать структурное ограничение подряд идущих фальшивых монет.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;ternary_code&quot;, &quot;structural_constraint&quot;, &quot;symmetry&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvant-2003-02-young-solutions&quot;, &quot;role&quot;: &quot;official_corrected_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvant_batch&quot;, &quot;notes&quot;: [&quot;В источнике указано, что в журнальном условии была неточность; карточка использует исправленный вариант из официального PDF решений.&quot;]}}, {&quot;id&quot;: &quot;kvant-2003-01-three-scales-two-weighings&quot;, &quot;title&quot;: &quot;Квант-2003: трое весов, одни неисправные&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Определить неисправные весы&quot;, &quot;text&quot;: &quot;Есть трое весов A, B, C. Известно, что одни весы неисправны; если взвешивание делают на них, результат может быть произвольным. Исправные весы показывают правильно. Нужно определить неисправные весы за наименьшее число взвешиваний, при этом сами весы можно взвешивать на других весах.&quot;, &quot;source_ids&quot;: [&quot;src-kvant-2003-02-young-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-weigh-the-instruments&quot;, &quot;title&quot;: &quot;Использовать весы как объекты взвешивания&quot;, &quot;text&quot;: &quot;Первое взвешивание можно устроить так, чтобы результат либо сразу указал на испорченный прибор, либо дал исправный прибор для проверочного второго шага.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-weigh-b-and-c-on-a&quot;, &quot;title&quot;: &quot;Взвесить B и C на A&quot;, &quot;text&quot;: &quot;Взвесим весы B и C на весах A. Если получилось равновесие, то A неисправны: исправные весы B и C имеют одинаковый вес. Если равновесия нет, то одна из взвешиваемых пар весов тяжелее другой; значит, сами весы A сработали исправно, а более тяжелые из B и C заведомо исправны как физический объект. Вторым взвешиванием на заведомо исправных весах сравниваем оставшиеся кандидаты и находим неисправные. Одного взвешивания недостаточно: если оно сделано на неисправных весах, произвольный результат может имитировать любой случай.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;три возможных варианта: неисправны A, B или C&quot;, &quot;observations&quot;: [&quot;исход взвешивания на выбранных весах, который может быть произвольным при неисправном приборе&quot;], &quot;allowed_actions&quot;: [&quot;выбрать весы-прибор и положить на них другие весы&quot;], &quot;goal&quot;: [&quot;identify_faulty_scale&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;fault_detection&quot;], &quot;lower_bound_method&quot;: [&quot;adversarial_faulty_observation&quot;], &quot;keywords&quot;: [&quot;kvant_for_younger_students&quot;, &quot;faulty_scale&quot;, &quot;instrument_as_object&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 3, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;faulty_instrument&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_faulty_scale&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Небольшая задача с нестандартным действием: взвешиваются сами весы.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;, &quot;indistinguishability_argument&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvant-2003-02-young-solutions&quot;, &quot;role&quot;: &quot;official_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvant_batch&quot;, &quot;notes&quot;: [&quot;Официальный PDF с решениями к задачам «Квант» для младших школьников, см. «Квант» №1 за 2003 г.&quot;]}}, {&quot;id&quot;: &quot;kvant-2003-04-four-coins-standard-two-weighings&quot;, &quot;title&quot;: &quot;Квант-2003: четыре монеты и эталон за два взвешивания&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;coding&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Одна подозрительная монета или ни одной&quot;, &quot;text&quot;: &quot;Даны четыре монеты. Возможны девять случаев: фальшивой монеты нет, либо ровно одна из четырех монет фальшивая и она может быть как легче, так и тяжелее настоящих. Фальшивая монета отличается по весу не настолько сильно, чтобы взвешивание разного числа подозрительных монет само по себе было полезным. Имеется также заведомо настоящая эталонная монета. Нужно определить случай за два взвешивания на чашечных весах.&quot;, &quot;source_ids&quot;: [&quot;src-kvant-2003-04-four-coins-standard&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-nine-cases-three-by-three&quot;, &quot;title&quot;: &quot;Девять случаев нужно разбить как 3 на 3&quot;, &quot;text&quot;: &quot;Два взвешивания дают до девяти исходов. Поэтому первое взвешивание должно оставить не больше трех случаев в каждой ветви; эталон позволяет добиться ровного разбиения.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-first-weigh-12-vs-3-standard&quot;, &quot;title&quot;: &quot;Первое взвешивание: 1,2 против 3 и эталона&quot;, &quot;text&quot;: &quot;Первым взвешиванием положим монеты 1 и 2 на левую чашу, а монету 3 и эталон - на правую. Если тяжелее левая чаша, возможны только случаи: 1 тяжелая, 2 тяжелая или 3 легкая. Если тяжелее правая: 1 легкая, 2 легкая или 3 тяжелая. Если равновесие: 4 легкая, 4 тяжелая или фальшивых нет. Во второй ветви достаточно сравнить 1 и 2; в равновесной ветви сравнить 4 с эталоном. Каждый раз один результат выбирает один из трех оставшихся случаев.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;9 случаев: нет фальшивой или одна из 4 монет легче/тяжелее&quot;, &quot;observations&quot;: [&quot;два тернарных исхода чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;взвешивать подозрительные монеты и заведомо настоящую эталонную монету&quot;], &quot;goal&quot;: [&quot;identify_case&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;ternary_code&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_leaf_count&quot;], &quot;keywords&quot;: [&quot;kvant_story_problem&quot;, &quot;standard_coin&quot;, &quot;nine_cases&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 4, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;heavier_or_lighter_or_none_with_standard&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_coin_and_sign_or_none&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Чистая задача на проектирование первого разбиения пространства состояний.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;ternary_code&quot;, &quot;decision_tree&quot;, &quot;weighted_sum_encoding&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvant-2003-04-four-coins-standard&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvant_batch&quot;, &quot;notes&quot;: [&quot;В PDF доступна страница с рассуждением и решением; начало рассказа находится на предыдущей странице журнала, поэтому условие сформулировано самодостаточно по перечисленным в источнике девяти случаям.&quot;]}}, {&quot;id&quot;: &quot;kvant-2013-one-light-coin-information-bound&quot;, &quot;title&quot;: &quot;Квант-2013: информационная граница для одной легкой монеты&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_article_problem&quot;, &quot;secondary&quot;: [&quot;lower_bound&quot;, &quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Одна легкая фальшивая монета среди N&quot;, &quot;text&quot;: &quot;Есть N монет, ровно одна из них фальшивая и известно, что она легче настоящих. Требуется найти фальшивую монету с помощью чашечных весов. Какова минимальная гарантирующая оценка числа взвешиваний через N?&quot;, &quot;source_ids&quot;: [&quot;src-kvant-2013-01-two-fake-coins-article&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-each-weighing-three-symbols&quot;, &quot;title&quot;: &quot;Результаты взвешиваний образуют тернарное слово&quot;, &quot;text&quot;: &quot;Если сделано k взвешиваний, каждый возможный случай должен получить отличимую строку из символов &lt;, =, &gt;. Поэтому число случаев не превосходит 3^k.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;, &quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-split-candidates-into-three-parts&quot;, &quot;title&quot;: &quot;Делить кандидатов на три почти равные части&quot;, &quot;text&quot;: &quot;Пусть k - наименьшее число, для которого 3^k &gt;= N. Делим текущие кандидаты на три группы, первые две сравниваем. Если одна группа легче, фальшивая монета в ней; если равновесие, она в третьей группе. Повторяя это деление, за k взвешиваний остаемся с одной монетой. Нижняя оценка совпадает с конструкцией: меньше k взвешиваний дают менее N возможных строк исходов.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;partition_state_space&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-log-three&quot;, &quot;title&quot;: &quot;Информационная граница&quot;, &quot;text&quot;: &quot;За k взвешиваний есть не более 3^k последовательностей исходов. Для гарантированного поиска все N возможных положений фальшивой монеты должны быть различимы, значит 3^k &gt;= N и k &gt;= ceil(log_3 N).&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;N возможных положений единственной легкой монеты&quot;, &quot;observations&quot;: [&quot;тернарная строка исходов чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно сравнивать равные по числу группы кандидатов&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;ternary_search&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_leaf_count&quot;], &quot;keywords&quot;: [&quot;kvant_2013&quot;, &quot;information_bound&quot;, &quot;known_lighter_coin&quot;, &quot;N_le_3^q&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 0, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;lighter_known&quot;, &quot;weighing_count&quot;: 0, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Базовая журнальная формулировка информационной границы.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;ternary_search&quot;, &quot;ternary_code&quot;, &quot;decision_tree_lower_bound&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvant-2013-01-two-fake-coins-article&quot;, &quot;role&quot;: &quot;official_article_statement_and_proof&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvant_batch&quot;, &quot;generalization_status&quot;: &quot;already_parameterized_same_solution&quot;, &quot;notes&quot;: [&quot;Карточка фиксирует вводную часть статьи К. Кнопа как самостоятельную модель неполной информации.&quot;, &quot;2026-05-18: карточка уже является общей N/q-формой для известной легкой монеты; частные числовые карточки следует связывать с ней как special_case.&quot;]}}, {&quot;id&quot;: &quot;kvant-2019-m2565-one-broken-scale&quot;, &quot;title&quot;: &quot;Квант-2019 M2565: самая тяжелая монета при одних испорченных весах&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;n монет и n весов&quot;, &quot;text&quot;: &quot;Даны n монет попарно различных масс и n чашечных весов, n &gt; 2. При каждом взвешивании разрешается выбрать одни весы, положить на их чаши по одной монете, посмотреть показания и снять монеты обратно. Какие-то одни весы неизвестно какие испорчены и могут случайно выдавать как правильный, так и неправильный результат. За какое наименьшее число взвешиваний можно гарантированно найти самую тяжелую монету?&quot;, &quot;source_ids&quot;: [&quot;src-kvant-2019-09-m2565&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-two-comparisons-test-a-scale&quot;, &quot;title&quot;: &quot;Два сравнения либо дают надежное превосходство, либо выявляют подозрительные весы&quot;, &quot;text&quot;: &quot;Если две монеты дважды сравнить на разных весах и победитель один и тот же, проигравшая монета уже не самая тяжелая. Если результаты противоречат или возникло равновесие, среди использованных весов есть испорченные, а третьи весы можно считать исправными.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-induction-two-comparisons&quot;, &quot;title&quot;: &quot;Индукция по числу монет&quot;, &quot;text&quot;: &quot;Сравним две выбранные монеты на двух разных весах. Если оба раза тяжелее одна и та же монета a, то другая монета b точно не максимальна, потому что хотя бы одни из двух весов исправны. Исключаем b и решаем задачу для n-1 монет, потратив еще 2n-3 взвешивания. Если результаты первых двух сравнений противоречат или дали равновесие, одни из этих весов испорчены; берем третьи весы, которые исправны, и обычным турниром за n-1 сравнений находим максимум. В худшем случае получается 2n-1 взвешивание.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-source-adversary&quot;, &quot;title&quot;: &quot;Нижняя оценка из журнального решения&quot;, &quot;text&quot;: &quot;Докажем, что \\(2n-2\\) взвешиваний недостаточно. Пусть некоторый алгоритм сделал первые \\(2n-3\\) сравнения. Представим себе последовательность ответов, в которой каждый раз перевешивает монета с большим номером. Среди монет \\(1,2,\\ldots,n-1\\) за эти \\(2n-3\\) сравнений найдется монета \\(k\\), которая проиграла не более одного раза: иначе суммарно уже было бы хотя бы \\(2n-2\\) проигрышей у первых \\(n-1\\) монет. Монета \\(n\\) при такой последовательности не проигрывала вовсе.\n\nПосле этих ответов совместимы две картины. В картине A массы возрастают вместе с номерами, и все показания были правильными. В картине B массы тоже возрастают, кроме монеты \\(k\\), которая является самой тяжелой; если \\(k\\) один раз проиграла, то именно использованные тогда весы были испорчены и дали неверный результат, а остальные показания были правильными. Обе картины согласуются с тем, что испорчены только одни весы.\n\nОсталось одно, \\((2n-2)\\)-е, сравнение. Если монета \\(k\\) в нем не участвует, противник снова отвечает, что перевесила монета с большим номером, и обе картины A и B остаются возможными. Если \\(k\\) участвует, противник отвечает, что перевесила \\(k\\). Тогда это совместимо с картиной A, если последнее сравнение выполнено на испорченных весах, и совместимо с картиной B, если весы в последний раз показали правильно. Значит, после \\(2n-2\\) взвешиваний алгоритм все еще не может отличить случай, где самая тяжелая монета \\(n\\), от случая, где самая тяжелая монета \\(k\\). Поэтому меньше \\(2n-1\\) взвешивания не хватает.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;полный порядок n различных масс и номер одних испорченных весов&quot;, &quot;observations&quot;: [&quot;исходы сравнений, один прибор может произвольно ошибаться&quot;], &quot;allowed_actions&quot;: [&quot;выбрать весы и две монеты для сравнения&quot;], &quot;goal&quot;: [&quot;identify_heaviest_coin&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;fault_tolerant_comparison&quot;], &quot;lower_bound_method&quot;: [&quot;adversarial_indistinguishability&quot;], &quot;keywords&quot;: [&quot;kvant_problem_m2565&quot;, &quot;broken_scale&quot;, &quot;heaviest_coin&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 0, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;one_faulty_scale&quot;, &quot;weighing_count&quot;: 0, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_heaviest_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Конструктивная часть короткая; нижняя оценка требует аккуратной состязательной проверки.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;, &quot;indistinguishability_argument&quot;, &quot;lie_detection&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvant-2019-09-m2565&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvant_batch&quot;, &quot;notes&quot;: [&quot;Нижняя оценка развернута по официальному решению Kvant 2019 №9, задача M2565(a).&quot;]}}, {&quot;id&quot;: &quot;kvantik-2013-fake-coin-direction-101&quot;, &quot;title&quot;: &quot;Квантик-2013: понять, легче или тяжелее фальшивая монета&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;101 монета и два взвешивания&quot;, &quot;text&quot;: &quot;Есть 101 монета. 100 из них одинаковые настоящие, а одна фальшивая, отличающаяся от настоящих по весу. Как с помощью двух взвешиваний на чашечных весах без гирь узнать, легче или тяжелее фальшивая монета, чем настоящая? Находить фальшивую монету не требуется.&quot;, &quot;source_ids&quot;: [&quot;src-kvantik-math-contest-2013&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;hidden_state&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-get-known-genuine&quot;, &quot;title&quot;: &quot;Сначала получить заведомо настоящую монету&quot;, &quot;text&quot;: &quot;Если первое взвешивание 50 монет против 50 не уравновесилось, оставшаяся монета точно настоящая. Если уравновесилось, фальшивая как раз оставшаяся.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-compare-with-leftover&quot;, &quot;title&quot;: &quot;Разбить 100 монет пополам&quot;, &quot;text&quot;: &quot;Отложим одну монету и взвесим 50 монет против других 50. Если весы в равновесии, фальшивая монета отложенная; вторым взвешиванием сравним ее с любой монетой из уравновешенных ста и узнаем, легче она или тяжелее.\n\nЕсли первое взвешивание не уравновесилось, отложенная монета настоящая. Возьмем одну монету с более тяжелой чаши и сравним ее с отложенной. Если она тяжелее настоящей, значит фальшивая монета тяжелая. Если она равна настоящей, то фальшивая лежала на более легкой чаше, значит она легче настоящих.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какая из 101 монеты фальшивая и является ли она более легкой или более тяжелой&quot;, &quot;observations&quot;: [&quot;два результата чашечных весов из трех возможных&quot;], &quot;allowed_actions&quot;: [&quot;класть равные по числу наборы монет на две чаши&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_direction_only&quot;], &quot;strategy_type&quot;: [&quot;decision_tree&quot;, &quot;known_genuine_reference&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;direction_without_location&quot;, &quot;leftover_genuine_coin&quot;, &quot;counterfeit_coin&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 101, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;heavier_or_lighter_unknown&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;determine_whether_counterfeit_is_heavier_or_lighter&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Трюк в том, что найти монету не нужно: достаточно быстро получить эталон настоящей монеты.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvantik-math-contest-2013&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvantik_batch&quot;, &quot;notes&quot;: [&quot;Математический конкурс Квантика 2013 года, задача 8. На странице конкурса дано условие; решение восстановлено редакционно.&quot;]}}, {&quot;id&quot;: &quot;kvantik-2016-baron-table-fake-verification&quot;, &quot;title&quot;: &quot;Квантик-2016: проверить слова барона о фальшивой монете на столе&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Фальшивая монета осталась на столе?&quot;, &quot;text&quot;: &quot;На столе лежит кучка одинаковых с виду монет, одна из которых фальшивая: то ли легче, то ли тяжелее обычной. Барон Мюнхгаузен положил часть монет в карман, оставив на столе не менее двух монет, и заявил, что фальшивая монета осталась на столе. Как проверить слова барона с помощью чашечных весов без гирь, потратив как можно меньше взвешиваний? Доступны только монеты на столе, на весы можно класть любое число монет; решение может зависеть от количества оставшихся монет.&quot;, &quot;source_ids&quot;: [&quot;src-kvantik-math-contest-2016&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-even-table-one-test&quot;, &quot;title&quot;: &quot;При четном числе все доступные монеты можно проверить одним сравнением&quot;, &quot;text&quot;: &quot;Если доступных монет четное число, их можно разделить поровну. Неравенство доказывает, что фальшивая среди доступных; равновесие доказывает, что все доступные настоящие.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-even-one-odd-two&quot;, &quot;title&quot;: &quot;Один тест для четного числа, два для нечетного&quot;, &quot;text&quot;: &quot;Если на столе осталось четное число монет, делим их на две равные кучки и сравниваем. Если весы не в равновесии, фальшивая монета действительно осталась на столе; если равновесие, то все монеты на столе настоящие и барон соврал.\n\nЕсли на столе осталось нечетное число монет, одного взвешивания не хватит: если не взвесить какую-то монету, она может оказаться единственной фальшивой, а если пытаться положить все монеты, чаши нельзя сделать равными по числу. Двух взвешиваний достаточно. Сначала отложим одну монету и сравним две равные половины остальных. Если равновесия нет, фальшивая на столе. Если равновесие, все взвешенные монеты настоящие; вторым взвешиванием сравним отложенную монету с любой из них и проверим, фальшивая ли она.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;imp-odd-one-weighing&quot;, &quot;title&quot;: &quot;При нечетном числе одного взвешивания недостаточно&quot;, &quot;text&quot;: &quot;В одном взвешивании нельзя одновременно использовать все нечетное число монет равными по числу группами. Если часть монет не участвует и весы показывают равновесие, состояние «фальшивая среди неучаствующих» неотличимо от состояния «фальшивая у барона».&quot;, &quot;standard_idea_ids&quot;: [&quot;indistinguishability&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;фальшивая монета либо среди доступных монет на столе, либо среди забранных бароном; знак отличия неизвестен&quot;, &quot;observations&quot;: [&quot;один или два результата чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;выбирать равные по числу группы только из монет на столе&quot;], &quot;goal&quot;: [&quot;verify_counterfeit_on_table&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;state_elimination&quot;], &quot;lower_bound_method&quot;: [&quot;indistinguishability_argument&quot;], &quot;keywords&quot;: [&quot;kvantik_math_contest_2016&quot;, &quot;counterfeit_presence_test&quot;, &quot;parity_of_available_coins&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 0, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;unknown_heavy_or_light&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;verify_presence_not_identify_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Цель слабее поиска монеты: нужно только проверить принадлежность фальшивки доступной кучке.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;indistinguishability_argument&quot;, &quot;decision_tree&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvantik-math-contest-2016&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvant_kvantik_deep&quot;, &quot;notes&quot;: [&quot;Математический конкурс «Квантика» 2016 года, задача 18; решение также опубликовано в PDF с ответами к туру.&quot;]}}, {&quot;id&quot;: &quot;kvantik-2021-three-by-three-fake-line-one-weighing&quot;, &quot;title&quot;: &quot;Квантик-2021/22: фальшивая линия монет в квадрате 3x3 за одно взвешивание&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Одна фальшивая монета в строке, столбце или диагонали&quot;, &quot;text&quot;: &quot;В каждой клетке квадрата 3x3 лежит монета. Некоторые монеты фальшивые: они весят одинаково, но легче настоящих; остальные монеты настоящие и тоже весят одинаково. Известно, что фальшивые монеты занимают целиком либо строку, либо столбец, либо диагональ. Как за одно взвешивание на чашечных весах без гирь найти хоть одну фальшивую монету?&quot;, &quot;source_ids&quot;: [&quot;src-kvantik-math-contest-2021-2022&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-lines-give-signatures&quot;, &quot;title&quot;: &quot;Строки, столбцы и диагонали получают разные суммы участия&quot;, &quot;text&quot;: &quot;Одно взвешивание не обязано определять всю фальшивую линию. Достаточно, чтобы для каждого возможного исхода все совместимые линии имели общую клетку.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-four-against-four-center-reserve&quot;, &quot;title&quot;: &quot;Сравнить четыре монеты против четырех&quot;, &quot;text&quot;: &quot;Обозначим клетки как\n1 2 3\n4 5 6\n7 8 9.\nПоложим на левую чашу монеты 1, 2, 3, 4, а на правую - 6, 7, 8, 9; центральную монету 5 не кладем.\n\nЕсли весы в равновесии, то фальшивая линия может быть только средней строкой, средним столбцом или одной из диагоналей; все эти линии содержат клетку 5, значит монета 5 фальшивая. Если левая чаша легче, то фальшива либо верхняя строка 1-2-3, либо левый столбец 1-4-7; в обоих случаях монета 1 фальшивая. Если правая чаша легче, то фальшива либо нижняя строка 7-8-9, либо правый столбец 3-6-9; в обоих случаях монета 9 фальшивая.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;8 возможных линий из трех легких фальшивых монет в квадрате 3x3&quot;, &quot;observations&quot;: [&quot;один результат чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;выбрать равные по числу наборы клеток для сравнения&quot;], &quot;goal&quot;: [&quot;identify_one_counterfeit_coin&quot;], &quot;strategy_type&quot;: [&quot;signature_code&quot;, &quot;state_space_partition&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;kvantik_math_contest_2021_2022&quot;, &quot;line_of_counterfeits&quot;, &quot;one_weighing_witness&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 9, &quot;counterfeit_count&quot;: 3, &quot;counterfeit_type&quot;: &quot;known_light_structured_line&quot;, &quot;weighing_count&quot;: 1, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;find_one_counterfeit_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Одно наблюдение не находит линию, но каждая ветвь оставляет общую фальшивую клетку.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;structural_constraint&quot;, &quot;linear_signature&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvantik-math-contest-2021-2022&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvant_kvantik_deep&quot;, &quot;notes&quot;: [&quot;Математический конкурс «Квантика» 2021/22 учебного года, задача 43a. Часть 9x9 в карточку не включена: это более крупная конструкция, требующая отдельной проверки.&quot;]}}, {&quot;id&quot;: &quot;lighter-25-coins-3-weighings&quot;, &quot;title&quot;: &quot;Одна легкая монета среди 25 за три взвешивания&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Фальшивая монета известно легче&quot;, &quot;text&quot;: &quot;Даны 25 одинаковых на вид монет. Ровно одна из них фальшивая и известно, что она легче настоящих. Нужно найти ее не более чем за три взвешивания на чашечных весах.&quot;, &quot;source_ids&quot;: [&quot;src-classical-coin-weighing&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;]}], &quot;reformulation&quot;: [{&quot;id&quot;: &quot;stmt-as-n-le-3q&quot;, &quot;title&quot;: &quot;Частный случай тернарного поиска&quot;, &quot;text&quot;: &quot;Это случай общей модели: если одна фальшивая монета заведомо легче, то \\(q\\) взвешиваний достаточно ровно тогда, когда \\(N\\le 3^q\\). Здесь \\(25\\le 3^3\\), поэтому тот же алгоритм делит кандидатов на три почти равные части.&quot;, &quot;source_ids&quot;: [&quot;src-kvant-2013-01-two-fake-coins-article&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-split-into-three-parts&quot;, &quot;title&quot;: &quot;Каждое взвешивание выбирает одну из трех частей&quot;, &quot;text&quot;: &quot;Если фальшивая монета заведомо легче, взвешивание равных групп делит кандидатов на три класса: легкая слева, легкая справа или вне взвешивания.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-three-level-ternary-search&quot;, &quot;title&quot;: &quot;Тернарный поиск по 25 монетам&quot;, &quot;text&quot;: &quot;Разделим 25 монет на группы 9, 9 и 7. Взвесим первые 9 против вторых 9. Если одна чаша легче, фальшивая монета находится в этой девятке; если равновесие, она среди оставшихся 7.\n\nКогда после первого шага осталось не больше 9 кандидатов, разделим их на группы 3, 3 и не более 3. Взвесим первые 3 против вторых 3. Легкая чаша указывает нужную тройку; равновесие указывает третью группу, причем если в ней меньше трех монет, кандидатов еще меньше.\n\nПосле второго шага осталось не больше 3 кандидатов. Третьим взвешиванием сравним две из этих монет. Если одна легче, она фальшивая. Если они равны, фальшивая - третий кандидат; если кандидатов было только два, равновесие невозможно при условии задачи. Так три взвешивания всегда находят легкую монету.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-two-weighings-not-enough&quot;, &quot;title&quot;: &quot;Двух взвешиваний недостаточно&quot;, &quot;text&quot;: &quot;Два взвешивания имеют не более \\(3^2=9\\) различных последовательностей исходов, а скрытых состояний 25. Значит, за два взвешивания гарантированно различить все монеты невозможно.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;25 возможных положений единственной легкой монеты&quot;, &quot;observations&quot;: [&quot;три исхода каждого взвешивания&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно выбирать равные по числу группы монет&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;ternary_search&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_leaf_count&quot;], &quot;keywords&quot;: [&quot;known_lighter_coin&quot;, &quot;ternary_search&quot;, &quot;balance_scale&quot;, &quot;N_le_3^q&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 25, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;lighter_known&quot;, &quot;weighing_count&quot;: 3, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Чистая тернарная версия поиска легкой монеты.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;ternary_search&quot;, &quot;decision_tree_lower_bound&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-classical-coin-weighing&quot;, &quot;role&quot;: &quot;folklore_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;seed_links&quot;, &quot;generalization_status&quot;: &quot;special_case_of_existing_N_q_card&quot;, &quot;notes&quot;: [&quot;2026-05-18: число 25 несущественно для стратегии; это запасной частный случай общей границы N &lt;= 3^q для известной легкой монеты.&quot;]}}, {&quot;id&quot;: &quot;lktg-2008-three-balances-one-broken-nine-coins&quot;, &quot;title&quot;: &quot;LKTG-2008: трое весов, одни сломанные, и фальшивая монета из 9 за 4 взвешивания&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;training_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;coding&quot;, &quot;fault_tolerance&quot;]}, &quot;language&quot;: &quot;en&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-lktg-2008-2-2b&quot;, &quot;title&quot;: &quot;Find a false coin using three balances, one of them broken&quot;, &quot;text&quot;: &quot;There are 9 coins, one of which is false and lighter than the others. There are three balances, and one of the balances is broken: whenever it is used, its answer may be arbitrary. Show how to find the false coin in 4 weighings.&quot;, &quot;source_ids&quot;: [&quot;src-lktg-2008-broken-balances-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;strategy&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-ternary-labels-with-one-bad-tester&quot;, &quot;title&quot;: &quot;Тернарные метки и проверка противоречий&quot;, &quot;text&quot;: &quot;Монеты получают метки из двух троичных цифр. Первые два взвешивания дают подозрительные цифры, а третье взвешивание устроено так, чтобы либо подтвердить обе цифры, либо обнаружить, какие весы точно исправны.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-nine-coins-one-broken-balance&quot;, &quot;title&quot;: &quot;Две координаты и одно контрольное разбиение&quot;, &quot;text&quot;: &quot;Занумеруем монеты парами троичных цифр \\(00,01,\\ldots,22\\). Первые весы сравнивают монеты с первой цифрой 0 и 1, вторые - с последней цифрой 0 и 1. Без ограничения общности считаем, что оба результата указывают на цифру 0; тогда четыре монеты без нулей точно настоящие, если не сломаны сразу двое весов, что невозможно.\n\nТретьим взвешиванием на третьих весах сравнивают специально дополненные до равных размеров группы: \\(00\\), группу \\(01,02\\) и группу \\(10,20\\), добавляя заведомо настоящие монеты. Если результат указывает на \\(00\\), это истинно. Если он указывает на \\(01,02\\), то он противоречит второму взвешиванию, значит первые весы исправны и первая цифра фальшивой монеты равна 0; остается три кандидата, которые различаются одним обычным взвешиванием. Случай \\(10,20\\) симметричен.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;9 вариантов фальшивой монеты и 3 варианта сломанных весов&quot;, &quot;observations&quot;: [&quot;результаты взвешиваний, один прибор может отвечать произвольно&quot;], &quot;allowed_actions&quot;: [&quot;выбирать, на каких весах и какие группы монет сравнивать&quot;], &quot;goal&quot;: [&quot;identify_false_coin&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;ternary_code&quot;, &quot;fault_tolerant_testing&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;broken_balance&quot;, &quot;lktg_2008&quot;, &quot;ternary_labels&quot;, &quot;fault_tolerance&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 9, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;lighter&quot;, &quot;weighing_count&quot;: 4, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_false_coin_with_one_broken_balance&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_hard&quot;, &quot;local_score&quot;: 5, &quot;comment&quot;: &quot;Тренировочный листок LKTG; существенная часть сложности в том, что один источник информации ненадежен.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;ternary_code&quot;, &quot;ternary_search&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-lktg-2008-broken-balances-solutions&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_v  вес в трехисходный тест.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-threshold-comparisons-seven-weights&quot;, &quot;title&quot;: &quot;Сначала отделить 10 граммов и сторону, затем уточнить&quot;, &quot;text&quot;: &quot;Пусть вес монет в указанном мешке равен \\(x\\). Сначала сравним 70 монет из указанного мешка с 10 комплектами, где комплект содержит по одной монете из каждого мешка. Правая чаша весит \\(700\\) граммов, поэтому равенство сразу дает \\(x=10\\), перевес указанного мешка дает \\(x&gt;10\\), а перевес комплектов дает \\(x&lt;10\\).\n\nЕсли \\(x&gt;10\\), вторым взвешиванием сравним 70 монет указанного мешка с 12 комплектами: результат различает \\(11,12,13\\). Если \\(x&lt;10\\), сравним 70 монет с 8 комплектами: результат различает \\(7,8,9\\). В каждом случае двух трехисходных сравнений достаточно, а монет в мешках хватает.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;7 возможных весов указанного мешка при неизвестной перестановке весов по мешкам&quot;, &quot;observations&quot;: [&quot;два результата чашечных весов: левая тяжелее, равенство, правая тяжелее&quot;], &quot;allowed_actions&quot;: [&quot;вынимать произвольные количества монет из мешков&quot;, &quot;сравнивать суммарные веса на чашечных весах&quot;], &quot;goal&quot;: [&quot;identify_selected_bag_weight&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;state_space_partition&quot;, &quot;threshold_testing&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;matprazdnik_2023&quot;, &quot;seven_bags&quot;, &quot;two_weighings&quot;, &quot;reference_sum&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 7, &quot;counterfeit_count&quot;: 0, &quot;counterfeit_type&quot;: &quot;seven_distinct_bag_weights_unknown_permutation&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_selected_bag_weight&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;7 класс, Математический праздник; идея эталонного комплекта делает задачу короткой, но информационно нетривиальной.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;ternary_search&quot;, &quot;linear_signature&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-matprazdnik-2023-solutions&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Условие и идея решения взяты с официальной страницы решений Математического праздника-2023.&quot;]}}, {&quot;id&quot;: &quot;matprazdnik-2025-eighteen-coins-rotated-tray&quot;, &quot;title&quot;: &quot;Матпраздник-2025: восемнадцать монет на повернутом подносе&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;weighing_strategy&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Восстановить веса после поворота&quot;, &quot;text&quot;: &quot;На круглом подносе лежат 18 одинаковых на вид монет: по две монеты каждого веса от 1 до 9 граммов. Монеты разложены по известному рисунку, но затем поднос повернули, и ориентация стала неизвестна. Нужно за два взвешивания на чашечных весах без гирь определить, где какая монета.&quot;, &quot;source_ids&quot;: [&quot;src-matprazdnik-2025-book&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;needs_diagram&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;hidden_state&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-first-weighing-finds-residue-class&quot;, &quot;title&quot;: &quot;Первое взвешивание находит класс поворота&quot;, &quot;text&quot;: &quot;Раскраска монет на рисунке выбирается так, что при трех возможных сдвигах сумма выбранных монет дает три разных исхода: левая чаша легче, равновесие или правая чаша легче.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-stage-rotation-and-anchor&quot;, &quot;title&quot;: &quot;Разбить повороты на три случая и закрепить один вес&quot;, &quot;text&quot;: &quot;Первым взвешиванием сравнивают две специально отмеченные группы монет из официального рисунка. В зависимости от результата становится известно, какая из трех троек весов 1,4,7; 2,5,8; 3,6,9 занимает отмеченные позиции, а значит известны места монет 3, 6 и 9 граммов с точностью до циклической перестановки. Вторым взвешиванием сравнивают две пары среди этих шести мест, например A+C и B+D. Три возможных исхода различают, какая из монет A имеет вес 3, 6 или 9; после этого весь круг восстанавливается по известному рисунку.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_stat одится по одной фальшивой монете, а в одной группе - две. Сначала сравним группы \\(147\\) и \\(258\\). Если одна из них тяжелее, то именно в ней две фальшивые; если равны, то две фальшивые в группе \\(369\\).\n\nПусть найдена группа из трех монет, где две фальшивые. Вторым взвешиванием сравним две монеты этой группы. Если одна легче, она настоящая, а две другие фальшивые. Если они равны, то обе сравниваемые фальшивые. После определения двух фальшивых монет в этой группе две монеты, лежащие между ними на круге, являются соседними настоящими; по чередованию вокруг круга восстанавливаются все четыре фальшивые монеты.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;9 возможных положений единственной пары соседних настоящих монет&quot;, &quot;observations&quot;: [&quot;два трехисходных результата чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;сравнивать равные по числу группы монет&quot;], &quot;goal&quot;: [&quot;identify_all_counterfeit_coins&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;state_space_partition&quot;, &quot;symmetry&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;mmo_2006&quot;, &quot;circle_coins&quot;, &quot;nonadjacent_fakes&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 9, &quot;counterfeit_count&quot;: 4, &quot;counterfeit_type&quot;: &quot;heavier_known_with_nonadjacency_constraint&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_all_counterfeit_coins&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &q
