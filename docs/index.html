 &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Расширение исходной задачи: появляется неединственность, которую нужно явно заметить.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;self_reference_truth&quot;, &quot;indistinguishability_argument&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-ukmt-smc-2016-sol-extended&quot;, &quot;role&quot;: &quot;official_extension_problem&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;ukmt_deep&quot;, &quot;notes&quot;: [&quot;Условие взято из раздела For investigation 22.1 официальных расширенных решений UKMT SMC 2016; решение восстановлено и записано русским пересказом.&quot;]}}, {&quot;id&quot;: &quot;ukmt-smc-2016-q22-three-friends-truth&quot;, &quot;title&quot;: &quot;UKMT SMC 2016 Q22: кто лжет среди трех друзей&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-ukmt-smc-2016-q22&quot;, &quot;title&quot;: &quot;Три взаимные фразы о числе правдивых&quot;, &quot;text&quot;: &quot;Три друга делают заявления. Бен говорит: «Ровно один из Дэна и Кэма говорит правду». Дэн говорит: «Ровно один из Бена и Кэма говорит правду». Кэм говорит: «Ни Бен, ни Дэн не говорят правду». Кто из трех друзей лжет?&quot;, &quot;source_ids&quot;: [&quot;src-ukmt-smc-2016-sol-extended&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-false-none-statement-forces-at-least-one-truth&quot;, &quot;title&quot;: &quot;Фраза «никто не правдив» сначала проверяется на самосогласованность&quot;, &quot;text&quot;: &quot;Если утверждение Кэма истинно, то Бен и Дэн лгут; но тогда одна из фраз Бена или Дэна немедленно становится истинной. Поэтому Кэм должен лгать, после чего оставшиеся две фразы симметрично вынуждают друг друга.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-cam-false-then-ben-dan-true&quot;, &quot;title&quot;: &quot;Сначала исключить правдивость Кэма&quot;, &quot;text&quot;: &quot;Предположим, что Кэм говорит правду. Тогда Бен и Дэн лгут. Но при таком раскладе среди Бена и Кэма ровно один правдив, значит фраза Дэна была бы истинной; противоречие. Значит Кэм лжет, и хотя бы один из Бена и Дэна говорит правду. Если Бен говорит правду, то среди Дэна и Кэма ровно один правдив; так как Кэм лжет, Дэн правдив. Аналогично, если Дэн правдив, то правдив и Бен. Следовательно, Бен и Дэн говорят правду, а Кэм лжет.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какие из трех друзей говорят правду&quot;, &quot;observations&quot;: [&quot;три публичных высказывания о правдивости остальных&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость набора правдивых с содержанием фраз&quot;], &quot;goal&quot;: [&quot;identify_liar&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;fixed_point_consistency&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;ukmt_smc_2016&quot;, &quot;truth_tellers&quot;, &quot;liars&quot;, &quot;mutual_statements&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;каждое высказывание либо истинно, либо ложно&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_lying_friend&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Маленькая самосогласованная система из трех высказываний.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;self_reference_truth&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-ukmt-smc-2016-sol-extended&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;ukmt_deep&quot;, &quot;notes&quot;: [&quot;Условие и решение взяты из официальных расширенных решений UKMT SMC 2016, вопрос 22; публичный текст дан русским пересказом.&quot;]}}, {&quot;id&quot;: &quot;ukmt-smc-2017-q13-guilty-liar&quot;, &quot;title&quot;: &quot;UKMT SMC 2017 Q13: виновный единственный лжец&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-ukmt-smc-2017-q13&quot;, &quot;title&quot;: &quot;Кто виновен, если лжет только виновный&quot;, &quot;text&quot;: &quot;Изобел говорит: «Джош невиновен». Дженотан говорит: «Тиган виновна». Джош говорит: «Дженотан виновен». Тиган говорит: «Изобел невиновна». Лжет только виновный человек; все остальные говорят правду. Кто виновен?&quot;, &quot;source_ids&quot;: [&quot;src-ukmt-smc-2017-sol-extended&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-guilty-person-is-liar&quot;, &quot;title&quot;: &quot;Вина и ложь сцеплены в одно скрытое состояние&quot;, &quot;text&quot;: &quot;Нельзя выбирать виновного и лжеца независимо: единственный виновный обязан быть единственным лжецом. Поэтому фразы, прямо обвиняющие друг друга, резко сокращают число возможных моделей.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-josh-genotan-case&quot;, &quot;title&quot;: &quot;Разобрать пару Джоша и Дженотана&quot;, &quot;text&quot;: &quot;Так как виновен ровно один человек, из фраз Дженотана и Джоша следует, что либо Дженотан, либо Джош лжет. Если бы лгал Джош, то Дженотан был бы невиновен и говорил бы правду, значит Тиган была бы виновна. Но тогда лжецом должна быть Тиган, а не Джош; противоречие. Следовательно, Джош не лжет. Его фраза истинна, поэтому виновен Дженотан. При этом фраза Дженотана о виновности Тиган ложна, а фразы Изобел и Тиган истинны, так что расклад согласован.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;кто из четырех людей виновен и тем самым является единственным лжецом&quot;, &quot;observations&quot;: [&quot;четыре публичных высказывания о виновности и невиновности&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость предполагаемого виновного с истинностью всех фраз&quot;], &quot;goal&quot;: [&quot;identify_guilty_person&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;truth_guilt_coupling&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;ukmt_smc_2017&quot;, &quot;guilty_liar&quot;, &quot;truth_tellers&quot;, &quot;liar&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;только виновный лжет, все невиновные говорят правду&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_guilty_person&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Небольшая truth-liar задача с дополнительным смыслом скрытого состояния: виновность.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;truth_liar_normalization&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-ukmt-smc-2017-sol-extended&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;ukmt_deep&quot;, &quot;notes&quot;: [&quot;Условие и решение взяты из официальных расширенных решений UKMT SMC 2017, вопрос 13; публичный текст дан русским пересказом.&quot;]}}, {&quot;id&quot;: &quot;ukmt-stmc-2018-19-national-final-group-q9-truth-tellers&quot;, &quot;title&quot;: &quot;UKMT STMC 2018-19 National Final Q9: кто точно лжет&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-ukmt-stmc-2018-19-q9&quot;, &quot;title&quot;: &quot;Алекс, Беатрис, Чармиан и Дензил&quot;, &quot;text&quot;: &quot;Алекс, Беатрис, Чармиан и Дензил либо всегда говорят правду, либо всегда лгут. Однажды они сказали следующее. Алекс: «Беатрис всегда лжет». Беатрис: «Алекс и Дензил либо оба правдивцы, либо оба лжецы». Чармиан: «Беатрис и Дензил либо оба лжецы, либо оба правдивцы». Дензил: «Я всегда говорю правду». Кто точно лжет?&quot;, &quot;source_ids&quot;: [&quot;src-ukmt-stmc-2018-19-national-final-group-round&quot;, &quot;src-ukmt-stmc-2018-19-national-final-supervisors&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-check-possible-models-for-definite-liar&quot;, &quot;title&quot;: &quot;Искать не единственный полный расклад, а общий элемент всех раскладов&quot;, &quot;text&quot;: &quot;Вопрос спрашивает, кто лжет обязательно. Поэтому достаточно перечислить совместимые расклады правдивцев и лжецов и пересечь множество лжецов во всех таких раскладах.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-cases-for-alex&quot;, &quot;title&quot;: &quot;Разобрать два случая для Алекса&quot;, &quot;text&quot;: &quot;Если Алекс правдив, то Беатрис лжет. Фраза Беатрис тогда ложна, значит Алекс и Дензил разных типов; раз Алекс правдив, Дензил лжет. Тогда фраза Чармиан о Беатрис и Дензиле истинна, и Чармиан правдива. Если Алекс лжет, то Беатрис правдива. Тогда Алекс и Дензил одного типа, значит Дензил тоже лжет. Фраза Чармиан о Беатрис и Дензиле ложна, и Чармиан лжет. В обоих совместимых случаях Дензил лжет, а остальные могут меняться. Значит, точно лжет Дензил.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какие из четырех детей являются правдивцами, а какие лжецами&quot;, &quot;observations&quot;: [&quot;четыре публичных утверждения о типах участников&quot;], &quot;allowed_actions&quot;: [&quot;перебирать совместимые назначения типов&quot;], &quot;goal&quot;: [&quot;identify_definite_liar&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;intersection_of_constraints&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;ukmt_stmc_2018_19&quot;, &quot;truth_tellers&quot;, &quot;liars&quot;, &quot;definite_liar&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 4, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;каждый ребенок либо всегда правдив, либо всегда лжет&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_definite_liar&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Нужно отличить полный расклад от свойства, общего для всех совместимых раскладов.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;truth_liar_normalization&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-ukmt-stmc-2018-19-national-final-group-round&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}, {&quot;source_id&quot;: &quot;src-ukmt-stmc-2018-19-national-final-supervisors&quot;, &quot;role&quot;: &quot;official_answer&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;ukmt_batch&quot;, &quot;notes&quot;: [&quot;Условие взято из официального/архивного листа Group Round, ответ Denzil подтвержден booklet для supervisors; русское решение восстановлено по проверке совместимых раскладов.&quot;]}}, {&quot;id&quot;: &quot;utyum-1993-logos-road-one-question&quot;, &quot;title&quot;: &quot;Один вопрос на острове рыцарей и лжецов&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;knowledge_puzzle&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Дорога в город рыцарей или лжецов&quot;, &quot;text&quot;: &quot;На острове Логос живут рыцари и лжецы. Рыцари всегда говорят правду, а лжецы всегда лгут. Что надо спросить у человека на острове Логос, чтобы узнать, куда ведет дорога: в город рыцарей или город лжецов?&quot;, &quot;source_ids&quot;: [&quot;src-utyum-official-local-archive&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-self-reference-cancels-lie&quot;, &quot;title&quot;: &quot;Вопрос о принадлежности спрашиваемого убирает неопределенность&quot;, &quot;text&quot;: &quot;Нужно спросить не прямо о дороге, а о том, ведет ли она к людям того же типа, что и отвечающий. Тогда ложь лжеца компенсирует неизвестный тип отвечающего.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-ask-own-kind&quot;, &quot;title&quot;: &quot;Спросить о городе себе подобных&quot;, &quot;text&quot;: &quot;Спросим: \&quot;Ведет ли эта дорога в город тебе подобных?\&quot; Если дорога ведет в город рыцарей, рыцарь правдиво ответит \&quot;да\&quot;, а лжец должен был бы правдиво ответить \&quot;нет\&quot;, но солжет и тоже скажет \&quot;да\&quot;. Если дорога ведет в город лжецов, рыцарь правдиво ответит \&quot;нет\&quot;, а лжец должен был бы правдиво ответить \&quot;да\&quot;, но солжет и скажет \&quot;нет\&quot;. Поэтому ответ \&quot;да\&quot; означает город рыцарей, а ответ \&quot;нет\&quot; - город лжецов.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;тип отвечающего и направление дороги&quot;, &quot;observations&quot;: [&quot;один ответ да/нет от рыцаря или лжеца&quot;], &quot;allowed_actions&quot;: [&quot;задать один вопрос да/нет&quot;], &quot;goal&quot;: [&quot;identify_road_destination&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;lie_cancellation&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;knights_and_knaves&quot;, &quot;one_question&quot;, &quot;self_reference&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 1, &quot;lies_allowed&quot;: &quot;respondent type is unknown: knight or liar&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_one_of_two_destinations&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Короткая задача на стандартную нейтрализацию лжеца.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;decision_tree&quot;, &quot;truth_liar_normalization&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-utyum-official-local-archive&quot;, &quot;role&quot;: &quot;official_statement_and_answer&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;russian_young_batch&quot;, &quot;notes&quot;: [&quot;Локальный источник: C:\\Users\\Admin\\Documents\\Codex\\graph-src\\utyum\\work\\utyum\\text\\1993\\1993_i_utyum_extracted.txt, строки 1-10.&quot;]}}, {&quot;id&quot;: &quot;wajo-2015-knaves-both-knaves&quot;, &quot;title&quot;: &quot;WAJO 2015: если один говорит «мы оба лжецы»&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-wajo-2015-knaves-a&quot;, &quot;title&quot;: &quot;Ивор и Джон&quot;, &quot;text&quot;: &quot;На острове каждый житель либо рыцарь, либо лжец. Рыцари всегда говорят правду, а лжецы всегда лгут; внешне их не отличить. Филип встречает двух островитян, Ивора и Джона. Ивор говорит: «Мы оба лжецы». Определите, кто Джон: рыцарь или лжец.&quot;, &quot;source_ids&quot;: [&quot;src-wajo-2015-qns-solns&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-speaker-cannot-assert-both-knaves-truthfully&quot;, &quot;title&quot;: &quot;Говорящий не может правдиво объявить себя лжецом&quot;, &quot;text&quot;: &quot;Если Ивор был бы рыцарем, его фраза была бы истинной, но тогда он сам оказался бы лжецом. Значит, Ивор не рыцарь. После этого фраза Ивора должна быть ложной, и ложность уже не может состоять в том, что Ивор не лжец; следовательно, Джон не лжец.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-eliminate-speaker-knight&quot;, &quot;title&quot;: &quot;Разобрать два типа говорящего&quot;, &quot;text&quot;: &quot;Предположим, что Ивор рыцарь. Тогда его утверждение «мы оба лжецы» истинно, в частности Ивор лжец, противоречие. Значит, Ивор лжец, а его утверждение ложно. Так как первая часть «Ивор лжец» уже верна, ложной должна быть часть про Джона: Джон не лжец. Поэтому Джон — рыцарь.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;типы Ивора и Джона: каждый может быть рыцарем или лжецом&quot;, &quot;observations&quot;: [&quot;публичная фраза Ивора о типах двух жителей&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость каждого возможного назначения типов с правилом правды и лжи&quot;], &quot;goal&quot;: [&quot;identify_type_of_john&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;truth_liar_reasoning&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;wajo_2015&quot;, &quot;knights_knaves&quot;, &quot;truth&quot;, &quot;lie&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;лжецы всегда лгут, рыцари всегда говорят правду&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;determine_john_type&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Короткое исключение невозможного типа говорящего.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-wajo-2015-qns-solns&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;wajo_batch&quot;, &quot;notes&quot;: []}}, {&quot;id&quot;: &quot;wajo-2015-knaves-chief-brothers&quot;, &quot;title&quot;: &quot;WAJO 2015: найти вождя среди двух братьев&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-wajo-2015-knaves-h&quot;, &quot;title&quot;: &quot;Ог и Бог&quot;, &quot;text&quot;: &quot;Филип знает, что на острове есть вождь, но не знает, рыцарь он или лжец. Поиски сузились до двух братьев, Ога и Бога. Ог говорит: «Бог — вождь, и он лжец». Бог говорит: «Ог не вождь, и он рыцарь». Рыцари всегда говорят правду, лжецы всегда лгут. Кто вождь, и он рыцарь или лжец?&quot;, &quot;source_ids&quot;: [&quot;src-wajo-2015-qns-solns&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-chief-and-type-linked-by-two-statements&quot;, &quot;title&quot;: &quot;Скрытое состояние включает и роль, и тип&quot;, &quot;text&quot;: &quot;Нужно одновременно определить две вещи: кто является вождем и кто говорит правду. Каждая реплика связывает роль одного брата с типом другого, поэтому отдельная проверка только типов или только роли недостаточна.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-test-og-type&quot;, &quot;title&quot;: &quot;Начать с типа Ога&quot;, &quot;text&quot;: &quot;Если Ог рыцарь, его фраза истинна: Бог — вождь и лжец. Тогда фраза Бога ложна. Но Бог говорит, что Ог не вождь и Ог рыцарь; при найденном состоянии обе части истинны, значит фраза Бога была бы истинной, противоречие. Следовательно, Ог — лжец. Фраза Бога «Ог не вождь, и он рыцарь» содержит ложную часть «Ог рыцарь», поэтому Бог тоже лжец. Тогда утверждение Ога «Бог — вождь, и он лжец» должно быть ложным; поскольку Бог действительно лжец, ложной остается часть «Бог — вождь». Значит, вождь — Ог, и он лжец.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;кто из двух братьев является вождем; тип каждого брата&quot;, &quot;observations&quot;: [&quot;две публичные фразы, каждая связывает роль и тип&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость роли и типов с правилом правды/лжи&quot;], &quot;goal&quot;: [&quot;identify_chief&quot;, &quot;identify_chief_type&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;wajo_2015&quot;, &quot;knights_knaves&quot;, &quot;truth&quot;, &quot;lie&quot;, &quot;chief&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 4, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;лжецы всегда лгут, рыцари всегда говорят правду&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;determine_chief_and_type&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Нужно удерживать две скрытые координаты: роль и тип.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-wajo-2015-qns-solns&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;wajo_batch&quot;, &quot;notes&quot;: []}}, {&quot;id&quot;: &quot;wajo-2015-knaves-three-counts&quot;, &quot;title&quot;: &quot;WAJO 2015: три островитянина спорят о числе лжецов&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-wajo-2015-knaves-g&quot;, &quot;title&quot;: &quot;Ксеркс, Йоррик и Захарий&quot;, &quot;text&quot;: &quot;Три островитянина Ксеркс, Йоррик и Захарий живут по правилу: рыцари всегда говорят правду, лжецы всегда лгут. Ксеркс говорит: «Среди нас ровно один лжец». Йоррик говорит: «Среди нас ровно два лжеца». Захарий говорит: «Мы все лжецы». Определите тип каждого из троих.&quot;, &quot;source_ids&quot;: [&quot;src-wajo-2015-qns-solns&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-exactly-one-count-can-match&quot;, &quot;title&quot;: &quot;Высказывания задают несовместимые числа лжецов&quot;, &quot;text&quot;: &quot;Фразы называют три разные величины: один лжец, два лжеца, три лжеца. Истинной может быть только та фраза, чье число совпадает с реальным числом лжецов, но число истинных фраз само равно числу рыцарей.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-check-number-of-knaves&quot;, &quot;title&quot;: &quot;Проверить возможное число лжецов&quot;, &quot;text&quot;: &quot;Если лжец один, то истинной была бы только фраза Ксеркса, значит рыцарей был бы один, а лжецов два: противоречие. Если лжецов два, истинной была бы только фраза Йоррика; тогда рыцарь один и лжецов действительно два. Это согласовано. Если лжецов три, фраза Захария «мы все лжецы» была бы истинной, но лжец не может говорить правду. Следовательно, Йоррик — рыцарь, а Ксеркс и Захарий — лжецы.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;типы трех островитян и реальное число лжецов среди них&quot;, &quot;observations&quot;: [&quot;три публичных утверждения о числе лжецов&quot;], &quot;allowed_actions&quot;: [&quot;перебирать возможное число лжецов и сверять его с числом истинных утверждений&quot;], &quot;goal&quot;: [&quot;identify_all_types&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;count_consistency&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;wajo_2015&quot;, &quot;knights_knaves&quot;, &quot;truth&quot;, &quot;lie&quot;, &quot;count&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 8, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;лжецы всегда лгут, рыцари всегда говорят правду&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;determine_three_types&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Нужно связать число лжецов с числом истинных утверждений.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-wajo-2015-qns-solns&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;wajo_batch&quot;, &quot;notes&quot;: []}}, {&quot;id&quot;: &quot;wajo-2015-knaves-unheard-answer&quot;, &quot;title&quot;: &quot;WAJO 2015: ответ не расслышан, но ложь о нем слышна&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-wajo-2015-knaves-e&quot;, &quot;title&quot;: &quot;Росс, Скотт и Теренс&quot;, &quot;text&quot;: &quot;На острове рыцари всегда говорят правду, а лжецы всегда лгут. Филип встречает Росса, Скотта и Теренса. Он спрашивает Росса: «Ты рыцарь или лжец?» Росс отвечает, но Филип не слышит ответ. Тогда Филип спрашивает Скотта: «Что сказал Росс?» Скотт отвечает: «Он сказал, что он лжец». Теренс говорит: «Не верь Скотту, это ложь!» Определите, кто Теренс: рыцарь или лжец.&quot;, &quot;source_ids&quot;: [&quot;src-wajo-2015-qns-solns&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-no-one-can-answer-i-am-knave&quot;, &quot;title&quot;: &quot;Ни рыцарь, ни лжец не произнесут «я лжец» как ответ о себе&quot;, &quot;text&quot;: &quot;Рыцарь на вопрос о своем типе ответил бы, что он рыцарь. Лжец тоже не может ответить «я лжец», потому что это было бы правдой; он обязан солгать и тоже скажет, что он рыцарь. Поэтому сообщение Скотта о словах Росса ложно.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-normalize-self-answer&quot;, &quot;title&quot;: &quot;Сначала определить возможный ответ Росса&quot;, &quot;text&quot;: &quot;На вопрос «ты рыцарь или лжец?» Росс в любом случае не мог ответить «я лжец»: рыцарь сказал бы правду, а лжец не имеет права правдиво назвать себя лжецом. Значит, Скотт сказал неправду. Теренс утверждает, что Скотт лжет, то есть говорит правду. Следовательно, Теренс — рыцарь.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;, &quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;типы Росса, Скотта и Теренса, а также неуслышанный ответ Росса&quot;, &quot;observations&quot;: [&quot;Филип не слышит ответ Росса&quot;, &quot;Скотт пересказывает ответ&quot;, &quot;Теренс оценивает пересказ Скотта&quot;], &quot;allowed_actions&quot;: [&quot;нормализовать возможные ответы рыцаря и лжеца&quot;, &quot;исключать невозможные пересказы&quot;], &quot;goal&quot;: [&quot;identify_type_of_terence&quot;], &quot;strategy_type&quot;: [&quot;truth_liar_normalization&quot;, &quot;state_elimination&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;wajo_2015&quot;, &quot;unheard_answer&quot;, &quot;truth&quot;, &quot;lie&quot;, &quot;ask&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 2, &quot;lies_allowed&quot;: &quot;лжецы всегда лгут, рыцари всегда говорят правду&quot;, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;determine_terence_type&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Ключевой ход — понять, что неуслышанный ответ фактически вынужден.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;truth_liar_normalization&quot;, &quot;lie_detection&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-wajo-2015-qns-solns&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;wajo_batch&quot;, &quot;notes&quot;: []}}, {&quot;id&quot;: &quot;wajo-2022-numble-colour-responses&quot;, &quot;title&quot;: &quot;WAJO 2022: Numble и стратегия по цветным ответам&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;strategy_analysis&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-wajo-2022-numble&quot;, &quot;title&quot;: &quot;Пятизначное число дня&quot;, &quot;text&quot;: &quot;В игре Numble компьютер выбирает пятизначное число дня из пяти различных цифр; первая цифра может быть 0. Игрок вводит попытку — строку из пяти различных цифр. После попытки каждая позиция окрашивается: зеленый цвет означает правильную цифру на правильном месте, желтый — цифра есть в числе дня, но стоит в другом месте, красный — такой цифры в числе дня нет. Алиса всегда начинает с попытки 12345. Для заданных цветовых ответов YYGGG, YRGGG, RRGGG, YYYGG и YYYYG нужно для каждого случая найти число возможных чисел дня и наименьшее число попыток, за которое Алиса может гарантированно решить игру.&quot;, &quot;source_ids&quot;: [&quot;src-wajo-2022-qns-solns&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-colour-response-partitions-permutations&quot;, &quot;title&quot;: &quot;Цветовой ответ разбивает пространство перестановок&quot;, &quot;text&quot;: &quot;После первой попытки часть цифр и позиций уже известна, а оставшиеся варианты образуют конечное пространство скрытых состояний. Следующая попытка должна делить эти состояния по возможным цветовым ответам; доказательство оптимальности требует не только стратегии, но и примера, где после меньшего числа попыток остается больше одного варианта.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-numble-small-cases&quot;, &quot;title&quot;: &quot;Считать оставшиеся состояния и строить дерево попыток&quot;, &quot;text&quot;: &quot;Для простых ответов после 12345 можно считать варианты напрямую. Например, ответ YYGGG означает, что последние три цифры уже равны 345, а первые две — это 1 и 2 в обратном порядке, значит остается одно число 21345 и всего нужны две попытки. Ответ RRGGG означает, что первые две цифры — две различные цифры из {0,6,7,8,9}, поэтому вариантов 5·4=20; официальная стратегия пробует перестановку этих пяти цифр и гарантирует решение за четыре попытки. Для YYYYG остается девять допустимых перестановок первых четырех цифр; в официальном разборе строится вторая попытка, после которой в худшем случае остаются две возможности, поэтому требуется не более четырех попыток. Сжатая карточка фиксирует механизм, но полный разбор всех ветвей лучше проверять по официальному решению.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;imp-numble-not-one-fewer&quot;, &quot;title&quot;: &quot;Почему иногда нельзя гарантировать на одну попытку меньше&quot;, &quot;text&quot;: &quot;Для оптимальности мало предъявить стратегию. Нужно показать, что после допустимой более короткой последовательности наблюдений могут оставаться по крайней мере два числа дня с одинаковыми цветными ответами. В официальном решении это делается отдельно для случаев с несколькими оставшимися перестановками; здесь этот аргумент пересказан только в общем виде.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;пятизначное число дня из пяти различных цифр, включая возможный начальный 0&quot;, &quot;observations&quot;: [&quot;цветовой ответ из пяти символов G/Y/R на каждую попытку&quot;], &quot;allowed_actions&quot;: [&quot;вводить новую строку из пяти различных цифр&quot;, &quot;адаптировать следующую попытку к предыдущим цветовым ответам&quot;], &quot;goal&quot;: [&quot;count_remaining_states&quot;, &quot;find_worst_case_guaranteed_tries&quot;], &quot;strategy_type&quot;: [&quot;decision_tree&quot;, &quot;state_elimination&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_collision&quot;], &quot;keywords&quot;: [&quot;wajo_2022&quot;, &quot;numble&quot;, &quot;strategy&quot;, &quot;colour_response&quot;, &quot;hidden_number&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 3, &quot;question_count&quot;: 5, &quot;lies_allowed&quot;: &quot;ответы не лживые, но неполные: каждый цвет сообщает только локальную информацию о цифре&quot;, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_hidden_five_digit_number&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 5, &quot;comment&quot;: &quot;Подсчет вариантов прост, но доказательство минимальности числа попыток требует аккуратного дерева решений.&quot;, &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;tags&quot;: [&quot;decision_tree&quot;, &quot;decision_tree_lower_bound&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-wajo-2022-qns-solns&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;needs_human_review&quot;, &quot;public_ready&quot;: false, &quot;relations_status&quot;: &quot;wajo_batch&quot;, &quot;notes&quot;: [&quot;Полное ветвление официального решения для всех цветовых ответов не перенесено в карточку; оставлено needs_human_review.&quot;]}}, {&quot;id&quot;: &quot;yumt-2014-false-statements-cards&quot;, &quot;title&quot;: &quot;Сто карточек с утверждениями о ложных утверждениях слева&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;optimality&quot;, &quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Максимум истинных утверждений&quot;, &quot;text&quot;: &quot;Имеется 100 карточек с надписями \&quot;Слева от меня - как минимум 2 ложных утверждения\&quot;, \&quot;Слева от меня - как минимум 4 ложных утверждения\&quot;, ..., \&quot;Слева от меня - как минимум 200 ложных утверждений\&quot;. Петя разложил карточки в ряд слева направо в каком-то порядке. Какое наибольшее число утверждений могло оказаться истинными?&quot;, &quot;source_ids&quot;: [&quot;src-yumt-official-local-archive&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-large-true-label-forces-many-false&quot;, &quot;title&quot;: &quot;Среди многих истинных карточек есть большая метка&quot;, &quot;text&quot;: &quot;Если истинных карточек слишком много, одна из истинных меток должна быть большой, а это требует больше ложных карточек слева, чем вообще может быть ложных.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-example-with-33-true&quot;, &quot;title&quot;: &quot;Порядок, дающий 33 истинных утверждения&quot;, &quot;text&quot;: &quot;Разложим карточки с числами в порядке \\(200,198,2,196,194,4,192,190,6,\\ldots,72,70,66,68\\). Тогда истинными окажутся карточки с числами от 2 до 66, то есть ровно 33 карточки. Для карточки с числом \\(2m\\), где \\(1\\le m\\le 33\\), слева уже стоят ровно или более \\(2m\\) ложных утверждений за счет больших чисел, размещенных раньше; большие карточки при этом ложны.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;ub-at-most-33-true&quot;, &quot;title&quot;: &quot;Больше 33 истинных быть не может&quot;, &quot;text&quot;: &quot;Пусть истинны \\(k\\ge 34\\) карточки. Тогда ложных карточек не больше 66. Метки на истинных карточках различны и являются числами \\(2,4,\\ldots,200\\), поэтому среди \\(k\\) истинных карточек есть карточка с меткой не меньше \\(2k\\ge 68\\). Ее истинность требует как минимум 68 ложных утверждений слева, а всего ложных утверждений не больше 66. Противоречие.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;порядок карточек и истинность самореферентных утверждений&quot;, &quot;observations&quot;: [&quot;число ложных утверждений слева от каждой карточки&quot;], &quot;allowed_actions&quot;: [&quot;выбрать порядок карточек&quot;], &quot;goal&quot;: [&quot;maximize_true_statements&quot;], &quot;strategy_type&quot;: [&quot;state_space_partition&quot;, &quot;extremal_construction&quot;], &quot;lower_bound_method&quot;: [&quot;counting_contradiction&quot;], &quot;keywords&quot;: [&quot;self_reference&quot;, &quot;false_statements&quot;, &quot;truth_assignment&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 100, &quot;lies_allowed&quot;: &quot;truth values are induced by the ordering&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;maximize_consistent_true_statements&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Экстремальная задача о правдивости утверждений, близкая к задачам о лжецах.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;self_reference_truth&quot;, &quot;counting_lower_bound&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-yumt-official-local-archive&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;russian_young_batch&quot;, &quot;notes&quot;: [&quot;Локальный источник: C:\\Users\\Admin\\Documents\\Codex\\graph-src\\yumt\\work\\yumt\\text\\2014\\2turstartresh.txt, строки 168-178.&quot;]}}, {&quot;id&quot;: &quot;amc-2011-10a-p21-counterfeit-coins-probability&quot;, &quot;title&quot;: &quot;AMC 2011 10A №21: две фальшивые монеты после равного взвешивания&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;probability&quot;, &quot;multiple_choice&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-amc-2011-10a-p21&quot;, &quot;title&quot;: &quot;Десять монет, две фальшивые, равновесие двух выбранных&quot;, &quot;text&quot;: &quot;Есть 10 монет, среди них ровно 2 фальшивые. Все настоящие монеты имеют один вес, все фальшивые - другой вес. Случайно выбирают две монеты и кладут по одной на каждую чашу весов. Весы показывают равновесие. Нужно найти вероятность того, что обе выбранные монеты фальшивые.&quot;, &quot;source_ids&quot;: [&quot;src-aops-2011-amc10a-p21-index&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-condition-on-balance&quot;, &quot;title&quot;: &quot;Равновесие отбрасывает часть равновероятных скрытых случаев&quot;, &quot;text&quot;: &quot;До взвешивания все пары выбранных монет равновероятны. Равновесие возможно только в двух случаях: обе монеты настоящие или обе фальшивые. Пары с одной настоящей и одной фальшивой отбрасываются наблюдением весов.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-count-balanced-cases&quot;, &quot;title&quot;: &quot;Посчитать только случаи, совместимые с наблюдением&quot;, &quot;text&quot;: &quot;Всего после наблюдения равновесия возможны только пары одного типа. Пар из двух настоящих монет \\(\\binom{8}{2}=28\\), потому что настоящих монет восемь. Пар из двух фальшивых монет \\(\\binom{2}{2}=1\\).\n\nСреди \\(28+1=29\\) пар, совместимых с равновесием, только одна состоит из двух фальшивых монет. Поэтому искомая условная вероятность равна \\(1/29\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какие две из 10 монет выбраны и являются ли они настоящими или фальшивыми&quot;, &quot;observations&quot;: [&quot;две выбранные монеты уравновесили друг друга на чашечных весах&quot;], &quot;allowed_actions&quot;: [&quot;условно пересчитать равновероятные выборы, совместимые с равновесием&quot;], &quot;goal&quot;: [&quot;compute_conditional_probability&quot;], &quot;strategy_type&quot;: [&quot;conditioning&quot;, &quot;state_space_filtering&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;amc_2011_10a&quot;, &quot;counterfeit_coins&quot;, &quot;conditional_probability&quot;, &quot;balance_scale&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 10, &quot;counterfeit_count&quot;: 2, &quot;counterfeit_type&quot;: &quot;known_direction_same_for_all_fakes&quot;, &quot;weighing_count&quot;: 1, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;compute_conditional_probability&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Это не задача на стратегию взвешиваний, а на пересчет скрытых состояний после результата взвешивания.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-aops-2011-amc10a-p21-index&quot;, &quot;role&quot;: &quot;statement_index&quot;, &quot;status&quot;: &quot;source_verified&quot;}, {&quot;source_id&quot;: &quot;src-maa-2011-amc10a-solutions-mirror&quot;, &quot;role&quot;: &quot;official_solution_mirrored_pdf&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;scope_review_needed&quot;, &quot;public_ready&quot;: false, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Официальный MAA-hosted PDF для 2011 AMC 10A не найден; решение сверено по зеркальной копии официального MAA solution pamphlet.&quot;, &quot;2026-05-18 scope-аудит: карточка снята с публичной готовности, потому что это задача на условную вероятность после наблюдения, а не на построение стратегии или доказательство невозможности.&quot;]}}, {&quot;id&quot;: &quot;cemc-2024-bcc-gifts-hidden-phone-weighing&quot;, &quot;title&quot;: &quot;CEMC Beaver 2024: подарок с телефоном ищут делением пополам&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;strategy_analysis&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-bcc-2024-gifts&quot;, &quot;title&quot;: &quot;В каком случае взвешиваний будет меньше всего&quot;, &quot;text&quot;: &quot;Бернард упаковал подарки для 14 учеников и пронумеровал их от 1 до 14. Он знает вес каждого подарка, но после упаковки понял, что случайно уронил телефон в один из подарков. Чтобы не распаковывать много подарков, он действует так. Сначала делит подарки на две стопки: 1-7 и 8-14. Взвешивает первую стопку. Если она тяжелее ожидаемого, оставляет ее, иначе оставляет вторую. Затем снова делит оставленную стопку на две части, насколько возможно равные; если число подарков нечетное, первая часть меньше второй, и меньшие номера идут в первую часть. Он повторяет процедуру, пока не останется один подарок. Среди вариантов: телефон в подарке 3, 13, 8 или 6. В каком случае Бернард взвесит меньше всего стопок?&quot;, &quot;source_ids&quot;: [&quot;src-cemc-2024-bcc-7-8-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-unbalanced-binary-search-tree&quot;, &quot;title&quot;: &quot;Деление почти пополам дает дерево поиска разной глубины&quot;, &quot;text&quot;: &quot;Каждое взвешивание оставляет одну из двух частей, то есть сообщает, в какой ветви дерева находится скрытый телефон. Из-за деления нечетных стопок на части разного размера некоторые листья достигаются быстрее.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-follow-retained-piles&quot;, &quot;title&quot;: &quot;Проследить дерево оставленных стопок&quot;, &quot;text&quot;: &quot;После первого взвешивания остаются либо \\(1-7\\), либо \\(8-14\\). Если телефон в подарке 8, первая стопка \\(1-7\\) не тяжелее ожидаемого, поэтому остается \\(8-14\\). При делении \\(8-14\\) первая часть \\(8,9,10\\), вторая \\(11,12,13,14\\). Телефон в 8 делает первую часть тяжелее, остается \\(8,9,10\\). Далее первая часть - только подарок 8, вторая - \\(9,10\\). Одно взвешивание подарка 8 сразу обнаруживает, что он тяжелее ожидаемого, и поиск заканчивается после трех взвешиваний.\n\nОфициальный разбор показывает, что за три взвешивания находятся только подарки 1 и 8. Среди предложенных вариантов это только подарок 8; остальные требуют четырех взвешиваний.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;номер подарка, в котором лежит телефон&quot;, &quot;observations&quot;: [&quot;выбранная стопка тяжелее ожидаемого или нет&quot;], &quot;allowed_actions&quot;: [&quot;взвешивать первую часть текущей стопки и оставлять одну из двух частей&quot;], &quot;goal&quot;: [&quot;identify_case_with_fewest_weighings&quot;], &quot;strategy_type&quot;: [&quot;binary_search&quot;, &quot;decision_tree&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;beaver_2024&quot;, &quot;hidden_phone&quot;, &quot;divide_and_conquer&quot;, &quot;weighing&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 14, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;one gift is heavier because it contains the phone&quot;, &quot;weighing_count&quot;: 3, &quot;outcome_count_per_weighing&quot;: 2, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;find_hidden_phone&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Нужно прочитать глубины листьев в заданном дереве поиска.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;binary_search&quot;, &quot;decision_tree&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-cemc-2024-bcc-7-8-solutions&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: []}}, {&quot;id&quot;: &quot;counterfeit-12-coins-3-weighings&quot;, &quot;title&quot;: &quot;Фальшивая монета среди двенадцати за три взвешивания&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Неизвестно легче или тяжелее&quot;, &quot;text&quot;: &quot;Даны 12 одинаковых на вид монет. Одна монета фальшивая, но неизвестно, легче она настоящих или тяжелее. За три взвешивания на чашечных весах найдите фальшивую монету и определите, легче она или тяжелее.&quot;, &quot;source_ids&quot;: [&quot;src-classical-coin-weighing&quot;, &quot;src-problems-ru-60922&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}, {&quot;id&quot;: &quot;stmt-nrich-great-weights&quot;, &quot;title&quot;: &quot;NRICH: один из двенадцати грузиков отличается&quot;, &quot;text&quot;: &quot;Даны 12 внешне одинаковых грузиков. Один из них отличается от остальных, но неизвестно, тяжелее он или легче. Есть чашечные весы. Можно ли за три взвешивания определить, какой грузик отличается, и узнать, тяжелее он или легче остальных?&quot;, &quot;source_ids&quot;: [&quot;src-nrich-great-weights-puzzle&quot;], &quot;status&quot;: &quot;source_verified&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;reformulation&quot;: [{&quot;id&quot;: &quot;stmt-as-ternary-signature-code&quot;, &quot;title&quot;: &quot;Двенадцать как почти полная тернарная сигнатура&quot;, &quot;text&quot;: &quot;Классическую задачу можно читать как частный случай сигнатурного кода: каждой монете назначают тернарный вектор участия во взвешиваниях, а тяжелый и легкий случаи дают противоположные исходы. Число 12 существенно для версии без эталонной монеты: три взвешивания дают 27 слов, но нулевой исход и требование уравновешенных чаш не позволяют просто взять все 13 противоположных пар.&quot;, &quot;source_ids&quot;: [&quot;src-classical-coin-weighing&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-ternary-signatures&quot;, &quot;title&quot;: &quot;Подписать состояния тернарными кодами&quot;, &quot;text&quot;: &quot;Каждая монета получает схему участия в трех взвешиваниях. Если монета тяжелая, наблюдается один тернарный код, а если легкая - противоположный код. Коды должны различать все 24 состояния.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-explicit-three-weighings&quot;, &quot;title&quot;: &quot;Разбор после первого взвешивания 4 против 4&quot;, &quot;text&quot;: &quot;Обозначим монеты числами от 1 до 12. Сначала взвесим \\(1,2,3,4\\) против \\(5,6,7,8\\).\n\nЕсли равновесие, то монеты 1-8 настоящие, а фальшивая среди 9-12. Взвесим \\(9,10,11\\) против \\(1,2,3\\). Если равновесие, фальшива 12-я; третьим взвешиванием сравним 12 с настоящей монетой и узнаем, легче она или тяжелее. Если левая чаша тяжелее, то одна из 9,10,11 тяжелая; третьим взвешиванием сравним 9 и 10, и либо тяжелая из них фальшива, либо при равновесии тяжелая 11. Если левая чаша легче, тот же разбор показывает, какая из 9,10,11 легкая.\n\nПусть теперь в первом взвешивании левая чаша тяжелее. Тогда возможны только два типа состояний: одна из 1,2,3,4 тяжелая или одна из 5,6,7,8 легкая; монеты 9-12 настоящие. Вторым взвешиванием сравним \\(1,2,5\\) против \\(3,6,9\\). Если левая чаша тяжелее, остаются варианты: 1 тяжелая, 2 тяжелая или 6 легкая. Третьим взвешиванием сравним 1 и 2: более тяжелая из них фальшива, а при равновесии фальшива легкая 6. Если во втором взвешивании правая чаша тяжелее, остаются варианты: 3 тяжелая или 5 легкая. Третьим взвешиванием сравним 3 с настоящей 9: если 3 тяжелее, фальшива 3; иначе фальшива легкая 5. Если второе взвешивание дает равновесие, остаются варианты: 4 тяжелая, 7 легкая или 8 легкая. Третьим взвешиванием сравним 7 и 8: если одна легче, она фальшива; если равновесие, фальшива тяжелая 4.\n\nСлучай, когда в первом взвешивании правая чаша тяжелее, полностью симметричен предыдущему: надо поменять местами группы 1-4 и 5-8, а слова \&quot;тяжелая\&quot; и \&quot;легкая\&quot; заменить на противоположные в соответствующих кандидатах.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-two-weighings-not-enough&quot;, &quot;title&quot;: &quot;Два взвешивания не могут хватить&quot;, &quot;text&quot;: &quot;Нужно различить 24 состояния: какая из 12 монет фальшивая и в какую сторону отличается. Два взвешивания дают не более \\(3^2=9\\) последовательностей исходов, поэтому двух взвешиваний недостаточно.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;
