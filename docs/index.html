если первая чаша легче, среди 13,14,15,16,17,1; если вторая легче, среди 8-13. Остается найти соседнюю легкую пару среди шести последовательных монет. Для этого перенумеруем кандидатов 1-6 и взвесим \\(1,2\\) против \\(5,6\\). Поломка сразу указывает на пару \\((1,2)\\) или \\((5,6)\\); равновесие дает \\((3,4)\\); если первая чаша легче, пара \\((2,3)\\); если вторая легче, пара \\((4,5)\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;17 возможных соседних пар фальшивых легких монет на цикле&quot;, &quot;observations&quot;: [&quot;равновесие&quot;, &quot;перевес без поломки&quot;, &quot;поломка с указанием стороны&quot;], &quot;allowed_actions&quot;: [&quot;выбрать равные по числу группы монет для нежных весов&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_pair&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;state_space_partition&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;sensitive_scale&quot;, &quot;adjacent_counterfeits&quot;, &quot;five_outcomes&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 17, &quot;counterfeit_count&quot;: 2, &quot;counterfeit_type&quot;: &quot;two_adjacent_lighter_known&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 5, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_counterfeit_pair&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Нестандартная модель весов; стратегия использует поломку как дополнительный исход.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-yumt-official-local-archive&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;russian_young_batch&quot;, &quot;notes&quot;: [&quot;Локальный источник: C:\\Users\\Admin\\Documents\\Codex\\graph-src\\yumt\\work\\yumt\\text\\2014\\3turstartresh.txt, строки 76-99.&quot;]}}, {&quot;id&quot;: &quot;blue-eyed-islanders&quot;, &quot;title&quot;: &quot;Голубоглазые островитяне&quot;, &quot;fragment&quot;: &quot;wise_people&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;knowledge_induction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Публичное объявление о голубых глазах&quot;, &quot;text&quot;: &quot;На острове живут люди, каждый видит цвет глаз всех остальных, но не знает свой цвет глаз. Обсуждать цвет глаз запрещено. Путешественник публично говорит: \&quot;На острове есть хотя бы один человек с голубыми глазами\&quot;. Если голубоглазых ровно \\(k\\), в какой день они смогут узнать свой цвет и уйти, при условии что все рассуждают безошибочно и это является общим знанием?&quot;, &quot;source_ids&quot;: [&quot;src-common-knowledge-puzzles&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;public_announcement&quot;, &quot;common_knowledge&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-no-departure-as-announcement&quot;, &quot;title&quot;: &quot;Неуход в предыдущие дни является публичным фактом&quot;, &quot;text&quot;: &quot;Каждый день без ухода исключает миры с меньшим числом голубоглазых людей, пока не остается только реальное число.&quot;, &quot;standard_idea_ids&quot;: [&quot;public_announcement_induction&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-induction-on-blue-eyed-count&quot;, &quot;title&quot;: &quot;Индукция по числу голубоглазых&quot;, &quot;text&quot;: &quot;Если \\(k=1\\), единственный голубоглазый не видит ни одного голубоглазого. После публичного объявления он понимает, что голубые глаза должны быть у него самого, и уходит в первый день.\n\nПусть утверждение верно для всех меньших чисел. При \\(k\\) голубоглазых каждый из них видит \\(k-1\\) голубоглазых. Он допускает два варианта: либо его глаза не голубые и всего голубоглазых \\(k-1\\), либо его глаза голубые и всего их \\(k\\). Если бы первый вариант был верен, то по индукционному предположению видимые им \\(k-1\\) голубоглазых ушли бы в \\((k-1)\\)-й день. Но этого не происходит. Поэтому в \\(k\\)-й день каждый голубоглазый исключает вариант, что его глаза не голубые, и уходит. Люди с другим цветом глаз видят \\(k\\) голубоглазых и не получают такого исключения.&quot;, &quot;standard_idea_ids&quot;: [&quot;public_announcement_induction&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;public_announcement&quot;, &quot;common_knowledge&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;собственный цвет глаз каждого островитянина&quot;, &quot;observations&quot;: [&quot;цвет глаз остальных&quot;, &quot;публичное объявление&quot;, &quot;факт ухода или неухода по дням&quot;], &quot;allowed_actions&quot;: [&quot;уйти, когда собственный цвет определен&quot;], &quot;goal&quot;: [&quot;identify_own_state&quot;], &quot;strategy_type&quot;: [&quot;knowledge_induction&quot;], &quot;lower_bound_method&quot;: [&quot;indistinguishable_worlds_until_day_k&quot;], &quot;keywords&quot;: [&quot;blue_eyes&quot;, &quot;common_knowledge&quot;, &quot;public_announcement&quot;, &quot;k_blue_eyed_agents&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;knowledge_profile&quot;: {&quot;agents&quot;: &quot;islanders&quot;, &quot;public_announcements&quot;: 1, &quot;communication_rounds&quot;: &quot;k days&quot;, &quot;visibility&quot;: &quot;each agent sees all other eye colors&quot;, &quot;objective&quot;: &quot;blue-eyed agents learn own eye color&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Классическая форма индукции по общему знанию.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;common_knowledge&quot;, &quot;public_announcement&quot;, &quot;public_announcement_induction&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-common-knowledge-puzzles&quot;, &quot;role&quot;: &quot;folklore_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;seed_links&quot;, &quot;generalization_status&quot;: &quot;already_parameterized_same_solution&quot;, &quot;notes&quot;: [&quot;2026-05-18: задача уже записана через k голубоглазых; решение не зависит от конкретного числа и остается индукцией по дням.&quot;]}}, {&quot;id&quot;: &quot;cheryls-birthday-sasmo&quot;, &quot;title&quot;: &quot;День рождения Шерил&quot;, &quot;fragment&quot;: &quot;wise_people&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;knowledge_elimination&quot;, &quot;olympiad_problem&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-sasmo-2015&quot;, &quot;title&quot;: &quot;Альберт знает месяц, Бернард знает день&quot;, &quot;text&quot;: &quot;Шерил называет Альберту и Бернарду десять возможных дат своего дня рождения: 15, 16, 19 мая; 17, 18 июня; 14, 16 июля; 14, 15, 17 августа. Затем она сообщает Альберту только месяц, а Бернарду только число. Альберт говорит: «Я не знаю, когда день рождения Шерил, но я знаю, что Бернард тоже не знает». Бернард отвечает: «Сначала я не знал, но теперь знаю». Альберт говорит: «Теперь и я знаю». Когда день рождения Шерил?&quot;, &quot;source_ids&quot;: [&quot;src-sasmo-2015-grade-9-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;common_knowledge&quot;, &quot;public_announcement&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-public-replies-delete-dates&quot;, &quot;title&quot;: &quot;Каждая реплика удаляет невозможные даты&quot;, &quot;text&quot;: &quot;Реплики участников становятся публичными фактами. Поэтому удаляются не только даты, которые противоречат словам говорящего, но и даты, при которых говорящий не мог бы быть уверен в знаниях другого.&quot;, &quot;standard_idea_ids&quot;: [&quot;public_announcement_induction&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-eliminate-by-common-knowledge&quot;, &quot;title&quot;: &quot;Последовательное исключение дат&quot;, &quot;text&quot;: &quot;Уникальные числа в исходном списке - 18 и 19. Если бы месяц был май или июнь, Альберт не мог бы заранее знать, что Бернард не знает: при мае возможен день 19, при июне - день 18. Значит первая реплика Альберта публично исключает май и июнь.\n\nОстаются даты 14, 16 июля и 14, 15, 17 августа. Бернард слышит это исключение. Если бы его число было 14, у него все еще оставались бы две даты: 14 июля и 14 августа. Но Бернард говорит, что теперь знает дату, значит число не 14. Остаются 16 июля, 15 августа и 17 августа.\n\nАльберт слышит вторую реплику. Если бы его месяц был август, у него оставались бы две возможные даты: 15 и 17 августа. Он не смог бы сказать, что теперь знает дату. Поэтому месяц Альберта - июль, и единственная оставшаяся дата - 16 июля.&quot;, &quot;standard_idea_ids&quot;: [&quot;public_announcement_induction&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;common_knowledge&quot;, &quot;public_announcement&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;одна из десяти возможных дат&quot;, &quot;observations&quot;: [&quot;Альберт знает месяц&quot;, &quot;Бернард знает число&quot;, &quot;три публичные реплики о знании&quot;], &quot;allowed_actions&quot;: [&quot;делать истинные публичные утверждения о собственном знании&quot;], &quot;goal&quot;: [&quot;identify_hidden_date&quot;], &quot;strategy_type&quot;: [&quot;knowledge_elimination&quot;, &quot;public_announcement&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;cheryls_birthday&quot;, &quot;sasmo_2015&quot;, &quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;knowledge_profile&quot;: {&quot;agents&quot;: [&quot;Albert&quot;, &quot;Bernard&quot;], &quot;public_announcements&quot;: 3, &quot;visibility&quot;: &quot;month to Albert, day to Bernard&quot;, &quot;objective&quot;: &quot;identify Cheryl&#x27;s birthday&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Короткая классическая задача на публичное исключение вариантов.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;common_knowledge&quot;, &quot;knowledge_elimination&quot;, &quot;public_announcement&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-sasmo-2015-grade-9-solutions&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Публичный текст переведен на русский, так как источник англоязычный.&quot;]}}, {&quot;id&quot;: &quot;ebert-seven-hats-hamming-code&quot;, &quot;title&quot;: &quot;Семь шляп и код Хэмминга&quot;, &quot;fragment&quot;: &quot;wise_people&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;hat_puzzle&quot;, &quot;coding&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-ebert-hats-seven&quot;, &quot;title&quot;: &quot;Угадать без ошибок, разрешено промолчать&quot;, &quot;text&quot;: &quot;Семь участников получают черные или белые шляпы. Каждый видит шляпы всех остальных, но не свою. После предварительного сговора они одновременно либо называют цвет своей шляпы, либо молчат. Команда выигрывает, если хотя бы один участник назвал свой цвет верно и никто не ошибся. Постройте стратегию с вероятностью успеха \\(7/8\\) при равновероятных независимых цветах.&quot;, &quot;source_ids&quot;: [&quot;src-ebert-hat-game-reference&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;error_correcting_code&quot;]}], &quot;generalized&quot;: [{&quot;id&quot;: &quot;stmt-general-hamming-length&quot;, &quot;title&quot;: &quot;2^m-1 участников и совершенный код Хэмминга&quot;, &quot;text&quot;: &quot;Та же кодовая схема работает для \\(2^m-1\\) участников, когда проигрышные конфигурации образуют двоичный совершенный код Хэмминга длины \\(2^m-1\\) с минимальным расстоянием 3. Вероятность успеха равна \\(1-2^{-m}\\), потому что проигрышные слова занимают долю \\(2^{-m}\\) всех раскрасок.&quot;, &quot;source_ids&quot;: [&quot;src-ebert-hat-game-reference&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;error_correcting_code&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-hamming-code-bad-configurations&quot;, &quot;title&quot;: &quot;Проигрышные конфигурации образуют код Хэмминга&quot;, &quot;text&quot;: &quot;Выбирается совершенный двоичный код длины 7 с минимальным расстоянием 3. Конфигурации-кодовые слова объявляются проигрышными, а все соседние с ними конфигурации покрываются единственным верным угадывающим.&quot;, &quot;standard_idea_ids&quot;: [&quot;error_correcting_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-hamming-losing-codewords&quot;, &quot;title&quot;: &quot;Назначить кодовые слова проигрышными&quot;, &quot;text&quot;: &quot;Отождествим цвета шляп с битами и заранее выберем двоичный код Хэмминга \\([7,4,3]\\): 16 слов длины 7, каждое двоичное слово длины 7 находится на расстоянии не более 1 ровно от одного кодового слова.\n\nСтратегия каждого игрока такая. Он смотрит на шесть чужих битов и рассматривает две возможные полные конфигурации: с его битом 0 и с его битом 1. Если ровно одна из этих двух конфигураций является кодовым словом, игрок называет другой цвет - тот, при котором полная конфигурация не является кодовым словом. Если кодового слова среди двух вариантов нет, он молчит.\n\nЕсли реальная конфигурация не является кодовым словом, то по свойству совершенного кода она отличается ровно в одной координате от единственного кодового слова. Игрок в этой координате увидит, что противоположный его реальному цвету вариант является кодовым, и назовет реальный цвет. Все остальные игроки молчат: при изменении любой другой координаты получилась бы строка на расстоянии 2 от того же кодового слова, а значит не кодовое слово. Если реальная конфигурация сама является кодовым словом, каждый игрок называет противоположный своему реальному цвет, и команда проигрывает. Таких конфигураций 16 из 128, поэтому вероятность успеха равна \\(1-16/128=7/8\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;error_correcting_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;error_correcting_code&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;двоичная строка длины 7 - цвета всех шляп&quot;, &quot;observations&quot;: [&quot;каждый видит все биты кроме своего&quot;], &quot;allowed_actions&quot;: [&quot;одновременно назвать цвет или промолчать&quot;], &quot;goal&quot;: [&quot;maximize_success_probability_without_wrong_guess&quot;], &quot;strategy_type&quot;: [&quot;error_correcting_code&quot;, &quot;hamming_code&quot;], &quot;lower_bound_method&quot;: [&quot;sphere_covering_bound&quot;], &quot;keywords&quot;: [&quot;ebert_hat_game&quot;, &quot;hamming_code&quot;, &quot;pass_allowed&quot;, &quot;2^m_minus_1_players&quot;, &quot;perfect_code_family&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;knowledge_profile&quot;: {&quot;agents&quot;: 7, &quot;visibility&quot;: &quot;each agent sees all other hats&quot;, &quot;objective&quot;: &quot;at least one correct guess and no wrong guesses&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_hard&quot;, &quot;local_score&quot;: 5, &quot;comment&quot;: &quot;Красивая связь со совершенными кодами; проверка сводится к свойству совершенного кода Хэмминга.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;error_correcting_code&quot;, &quot;hamming_bound&quot;, &quot;hat_puzzle&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-ebert-hat-game-reference&quot;, &quot;role&quot;: &quot;reference_topic&quot;, &quot;status&quot;: &quot;needs_human_review&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;generalization_status&quot;: &quot;same_solution_parameterized&quot;, &quot;notes&quot;: [&quot;Публичный текст переведен на русский; версия с одновременным ответом или молчанием явно зафиксирована.&quot;, &quot;2026-05-18: добавлена семейная формулировка для длин 2^m-1; число 7 является случаем m=3 совершенного кода Хэмминга.&quot;]}}, {&quot;id&quot;: &quot;estonian-2001-02-aborigines-executed-truthful&quot;, &quot;title&quot;: &quot;Эстония 2001-02: кого казнили после двух опросов островитян&quot;, &quot;fragment&quot;: &quot;wise_people&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;knowledge_puzzle&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Два опроса о друзьях&quot;, &quot;text&quot;: &quot;На острове жили n &gt; 1 аборигенов. Каждый из них либо всегда говорит правду, либо всегда лжет, и у каждого был хотя бы один друг среди остальных. Новый губернатор спросил каждого, кого больше среди его друзей: правдивых, лжецов или поровну тех и других. Каждый ответил, что среди его друзей больше лжецов, чем правдивых. Затем губернатор велел казнить одного аборигена как лжеца и снова задал всем оставшимся тот же вопрос. На этот раз каждый ответил, что среди его друзей больше правдивых, чем лжецов. Определите, был ли казненный правдивым или лжецом, и кого больше осталось на острове: правдивых или лжецов.&quot;, &quot;source_ids&quot;: [&quot;src-estonian-2001-02-selected-problems&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-one-removal-cannot-flip-majority-for-truthful&quot;, &quot;title&quot;: &quot;Удаление одного человека не меняет большинство лжецов на большинство правдивых&quot;, &quot;text&quot;: &quot;Для правдивого оставшегося обе его фразы должны быть истинными. Но из строгого большинства лжецов среди друзей после удаления одного человека нельзя получить строгое большинство правдивых.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-executed-truthful&quot;, &quot;title&quot;: &quot;Показать, что правдивых после казни не осталось&quot;, &quot;text&quot;: &quot;Сначала на острове должен был быть хотя бы один правдивый: если бы все были лжецами, то у каждого все друзья были бы лжецами, и первый ответ оказался бы истинным, что невозможно для лжецов. Теперь предположим, что после казни остался правдивый. Его первый ответ до казни был истинным: среди его друзей было больше лжецов, чем правдивых. Его второй ответ после казни тоже должен быть истинным: среди оставшихся друзей стало больше правдивых, чем лжецов. Удаление одного человека не может превратить строгое преимущество лжецов в строгое преимущество правдивых, значит такого правдивого после казни нет. Следовательно, единственный правдивый был казнен, а все оставшиеся - лжецы; значит после казни лжецов больше.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;кто правдивый, кто лжец, и граф дружбы&quot;, &quot;observations&quot;: [&quot;все первые ответы одинаковы&quot;, &quot;после удаления одного человека все вторые ответы одинаковы&quot;], &quot;allowed_actions&quot;: [&quot;сравнивать возможные составы друзей до и после удаления&quot;], &quot;goal&quot;: [&quot;determine_type_of_removed_agent&quot;, &quot;determine_majority_after_removal&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;indistinguishability&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;estonian_2001_02&quot;, &quot;truthful_liars&quot;, &quot;friends&quot;, &quot;execution&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;knowledge_profile&quot;: {&quot;agents&quot;: &quot;n &gt; 1 islanders&quot;, &quot;public_announcements&quot;: &quot;two rounds of identical answers, separated by removing one islander&quot;, &quot;communication_rounds&quot;: 2, &quot;visibility&quot;: &quot;friendship graph is not specified; only answer patterns are known&quot;, &quot;objective&quot;: &quot;determine type of removed islander and remaining majority&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Ключевой шаг - строгие неравенства в составе друзей не могут смениться так сильно после удаления одного человека.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;indistinguishability_argument&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-estonian-2001-02-selected-problems&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;estonian_batch&quot;, &quot;notes&quot;: [&quot;Официальный английский буклет содержит условие и решение; карточка является русским пересказом.&quot;]}}, {&quot;id&quot;: &quot;hat-line-k-colors-modulo&quot;, &quot;title&quot;: &quot;Шляпы в ряд при k цветах: сумма по модулю k&quot;, &quot;fragment&quot;: &quot;wise_people&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;coding&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Обобщение четности на k цветов&quot;, &quot;text&quot;: &quot;В ряд стоят \\(n\\) узников. Цвет каждой шляпы - один из \\(k\\) заранее занумерованных цветов \\(0,1,\\ldots,k-1\\). Каждый видит шляпы всех впереди. Ответы идут сзади наперед и слышны всем. Как гарантировать, что ошибется не более один узник?&quot;, &quot;source_ids&quot;: [&quot;src-folklore&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-modulo-sum&quot;, &quot;title&quot;: &quot;Первый ответ передает сумму цветов по модулю k&quot;, &quot;text&quot;: &quot;Номер цвета можно считать элементом группы \\(\\mathbb Z/k\\mathbb Z\\). Первый говорящий объявляет цвет с номером, равным сумме номеров всех видимых шляп по модулю \\(k\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;modular_sum_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-running-modulo-sum&quot;, &quot;title&quot;: &quot;Вычитать уже найденные цвета&quot;, &quot;text&quot;: &quot;Первый сзади объявляет сумму цветов всех впереди по модулю \\(k\\). Его собственный ответ может быть неверным. Каждый следующий знает эту исходную сумму, видит сумму цветов впереди себя и слышал уже определенные цвета людей позади, кроме первого кодового ответа. Поэтому он вычисляет свой цвет как разность между известной суммой остатка и суммой видимых впереди цветов по модулю \\(k\\). После этого его настоящий цвет становится известен всем следующим.&quot;, &quot;standard_idea_ids&quot;: [&quot;modular_sum_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;k^n раскрасок шляп&quot;, &quot;observations&quot;: [&quot;видимые шляпы впереди&quot;, &quot;публичные ответы&quot;], &quot;allowed_actions&quot;: [&quot;назвать один из k цветов&quot;], &quot;goal&quot;: [&quot;maximize_correct_guesses&quot;], &quot;strategy_type&quot;: [&quot;encoding&quot;, &quot;public_announcement&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;hat_puzzle&quot;, &quot;modular_sum&quot;, &quot;all_but_one&quot;, &quot;n_prisoners_k_colors&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;knowledge_profile&quot;: {&quot;agents&quot;: &quot;n&quot;, &quot;public_announcements&quot;: true, &quot;visibility&quot;: &quot;each agent sees all hats ahead&quot;, &quot;hat_colors&quot;: &quot;k&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;То же ядро, что в бинарной задаче о шляпах, но с группой по модулю k.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;hat_puzzle&quot;, &quot;modular_sum_code&quot;, &quot;public_announcement&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-folklore&quot;, &quot;role&quot;: &quot;folklore_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;seed_links&quot;, &quot;generalization_status&quot;: &quot;already_parameterized_same_solution&quot;, &quot;notes&quot;: [&quot;2026-05-18: карточка уже является естественным обобщением бинарного паритета на n участников и k цветов; дополнительных числовых параметров не требуется.&quot;]}}, {&quot;id&quot;: &quot;kvantik-2025-two-digit-three-public-questions&quot;, &quot;title&quot;: &quot;Квантик-2025/26: двузначное число по ответам двух знающих цифры&quot;, &quot;fragment&quot;: &quot;wise_people&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Петя знает первую цифру, Вася - вторую&quot;, &quot;text&quot;: &quot;Ведущий загадал двузначное число и сообщил его первую цифру Пете, а вторую - Васе. Затем зрители задали три вопроса: является ли загаданное число точным квадратом, какая из цифр числа больше и различны ли цифры в числе. На первый вопрос Петя и Вася одновременно ответили «Нет», на второй - «Не знаю», а на третий - «Да». Какое число загадал ведущий?&quot;, &quot;source_ids&quot;: [&quot;src-kvantik-math-contest-2025-2026&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-public-answers-refine-digit-sets&quot;, &quot;title&quot;: &quot;Каждый общий ответ сужает возможные цифры обоих участников&quot;, &quot;text&quot;: &quot;Ответы даются людьми с разной частичной информацией. После каждого публичного ответа следующий вопрос нужно интерпретировать уже на сокращенном множестве возможных чисел.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-filter-digits&quot;, &quot;title&quot;: &quot;Последовательно отфильтровать возможные числа&quot;, &quot;text&quot;: &quot;Если оба уверенно отвечают «Нет» на вопрос о квадрате, то ни первая, ни вторая цифра не должны допускать квадрат среди совместимых двузначных чисел. Это оставляет только десятки 5, 7, 9 и единицы 0, 2, 3, 7, 8.\n\nНа вопрос, какая цифра больше, оба отвечают «Не знаю». После первого шага это возможно только для чисел 57, 58, 77, 78: при других оставшихся цифрах хотя бы один из участников уже знал бы отношение цифр. Наконец, оба отвечают «Да» на вопрос о различии цифр. Из четырех кандидатов только 58 имеет разные цифры так, что и Петя по первой цифре 5, и Вася по второй цифре 8 знают различие однозначно. Значит, ведущий загадал 58.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;двузначное число; Петя знает только десятки, Вася только единицы&quot;, &quot;observations&quot;: [&quot;три публичных пары одинаковых ответов двух участников&quot;], &quot;allowed_actions&quot;: [&quot;обновлять множество возможных чисел после каждого публичного ответа&quot;], &quot;goal&quot;: [&quot;identify_hidden_number&quot;], &quot;strategy_type&quot;: [&quot;knowledge_elimination&quot;, &quot;public_announcement&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;kvantik_math_contest_2025_2026&quot;, &quot;two_agents_digits&quot;, &quot;public_answers&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;knowledge_profile&quot;: {&quot;agents&quot;: 2, &quot;private_observations&quot;: [&quot;первая цифра&quot;, &quot;вторая цифра&quot;], &quot;public_rounds&quot;: 3, &quot;objective&quot;: &quot;deduce_two_digit_number&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Миниатюрная задача на публичное обновление знания после ответов двух участников.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;knowledge_elimination&quot;, &quot;public_announcement&quot;, &quot;common_knowledge&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvantik-math-contest-2025-2026&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvant_kvantik_deep&quot;, &quot;notes&quot;: [&quot;Математический конкурс «Квантика» 2025/26 учебного года, задача 43; решение восстановлено редакционно.&quot;]}}, {&quot;id&quot;: &quot;muddy-children-common-knowledge&quot;, &quot;title&quot;: &quot;Грязные лбы и публичное объявление&quot;, &quot;fragment&quot;: &quot;wise_people&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;knowledge_induction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Дети видят чужие лбы&quot;, &quot;text&quot;: &quot;Несколько детей стоят так, что каждый видит, у кого из остальных грязный лоб, но не видит свой. Известно, что хотя бы у одного ребенка лоб грязный, и взрослый публично объявляет этот факт. Затем в каждом раунде все дети одновременно отвечают, знают ли они, грязный ли у них лоб. Если грязных детей ровно \\(k\\), докажите, что первые \\(k-1\\) раундов никто не знает ответ, а в \\(k\\)-м раунде все грязные дети узнают, что они грязные.&quot;, &quot;source_ids&quot;: [&quot;src-common-knowledge-puzzles&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;public_announcement&quot;, &quot;common_knowledge&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-induction-on-k&quot;, &quot;title&quot;: &quot;Молчание исключает меньшие числа грязных&quot;, &quot;text&quot;: &quot;Если грязных \\(k\\), каждый грязный видит \\(k-1\\) грязных. Когда первые \\(k-1\\) раундов никто не отвечает, становится общим знанием, что случаев с меньшим числом грязных нет.&quot;, &quot;standard_idea_ids&quot;: [&quot;public_announcement_induction&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-common-knowledge-induction&quot;, &quot;title&quot;: &quot;Индукция по числу грязных детей&quot;, &quot;text&quot;: &quot;Докажем утверждение по \\(k\\). Если \\(k=1\\), единственный грязный ребенок не видит грязных лбов у других. После публичного объявления, что грязный лоб у кого-то есть, он сразу понимает, что грязный он сам, и отвечает в первом раунде.\n\nПусть утверждение доказано для всех меньших чисел грязных, и пусть на самом деле грязных \\(k\\). Каждый грязный ребенок видит ровно \\(k-1\\) грязных. Он рассуждает так: если мой лоб чистый, то грязных всего \\(k-1\\), и по предположению индукции эти \\(k-1\\) детей ответят в \\((k-1)\\)-м раунде. Но этого не происходит. Значит, мое предположение о чистом лбе неверно, и в \\(k\\)-м раунде каждый грязный ребенок узнает, что он грязный. Чистые дети видят \\(k\\) грязных и к этому моменту не получают основания считать себя грязными.&quot;, &quot;standard_idea_ids&quot;: [&quot;public_announcement_induction&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;public_announcement&quot;, &quot;common_knowledge&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;для каждого ребенка скрыт его собственный статус&quot;, &quot;observations&quot;: [&quot;статусы лбов остальных детей&quot;, &quot;публичное объявление&quot;, &quot;молчание в предыдущих раундах&quot;], &quot;allowed_actions&quot;: [&quot;одновременно объявить, знает ли ребенок свой статус&quot;], &quot;goal&quot;: [&quot;identify_own_state&quot;], &quot;strategy_type&quot;: [&quot;knowledge_induction&quot;], &quot;lower_bound_method&quot;: [&quot;indistinguishable_worlds_until_round_k&quot;], &quot;keywords&quot;: [&quot;muddy_children&quot;, &quot;common_knowledge&quot;, &quot;silence_as_information&quot;, &quot;k_dirty_children&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;knowledge_profile&quot;: {&quot;agents&quot;: &quot;n children&quot;, &quot;public_announcements&quot;: 1, &quot;communication_rounds&quot;: &quot;k&quot;, &quot;visibility&quot;: &quot;each agent sees all other foreheads&quot;, &quot;objective&quot;: &quot;dirty agents learn their own status&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Классический пример общего знания.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;common_knowledge&quot;, &quot;public_announcement&quot;, &quot;public_announcement_induction&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-common-knowledge-puzzles&quot;, &quot;role&quot;: &quot;folklore_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;seed_links&quot;, &quot;generalization_status&quot;: &quot;already_parameterized_same_solution&quot;, &quot;notes&quot;: [&quot;2026-05-18: задача уже записана в параметрах n и k; конкретные числа не нужны, решение остается индукцией по k.&quot;]}}, {&quot;id&quot;: &quot;prisoners-hats-parity-line&quot;, &quot;title&quot;: &quot;Заключенные в ряд и паритет шляп&quot;, &quot;fragment&quot;: &quot;wise_people&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;communication_strategy&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Первый передает один бит паритета&quot;, &quot;text&quot;: &quot;Заключенным надевают черные или белые шляпы и ставят в ряд. Каждый видит шляпы всех стоящих перед ним, но не свою и не шляпы позади. Начиная с последнего в ряду, каждый по очереди вслух называет цвет своей шляпы. Заранее можно договориться о стратегии. Как гарантировать, что все, кроме возможно первого отвечающего, назовут свой цвет правильно?&quot;, &quot;source_ids&quot;: [&quot;src-common-knowledge-puzzles&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}, {&quot;id&quot;: &quot;stmt-folklore-100-prisoners&quot;, &quot;title&quot;: &quot;Фольклорная версия со 100 узниками&quot;, &quot;text&quot;: &quot;Сто узников стоят в ряд. На каждом черная или белая шляпа. Каждый видит шляпы всех впереди, но не свою и не шляпы позади. Начиная с последнего в ряду, узники по очереди называют цвет своей шляпы вслух. Перед началом можно договориться о стратегии. Как гарантировать, что ошибется не более один узник?&quot;, &quot;source_ids&quot;: [&quot;src-folklore&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-first-answer-parity&quot;, &quot;title&quot;: &quot;Первый ответ кодирует паритет видимых черных шляп&quot;, &quot;text&quot;: &quot;Первый отвечающий не может узнать свою шляпу, зато его слово можно использовать как один бит информации для всех остальных.&quot;, &quot;standard_idea_ids&quot;: [&quot;parity_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-parity-protocol&quot;, &quot;title&quot;: &quot;Сохранение паритета черных шляп&quot;, &quot;text&quot;: &quot;Договоримся: последний в ряду, который видит все шляпы перед собой, говорит \&quot;черная\&quot;, если среди видимых им шляп нечетное число черных, и \&quot;белая\&quot;, если четное. Его собственный ответ может оказаться неверным, но он передает всем остальным паритет числа черных шляп среди них.\n\nСледующий заключенный видит все шляпы перед собой и слышит паритет, объявленный первым. Он сравнивает этот паритет с числом черных шляп, которые сам видит. Если паритет уже совпадает, его собственная шляпа белая; если отличается, черная. После его ответа все следующие знают и цвет его шляпы, и исходный паритет.\n\nДалее каждый заключенный поддерживает тот же расчет: из исходного паритета вычитает по модулю 2 уже названные черные шляпы позади себя и видимые черные шляпы впереди. Оставшаяся разница однозначно определяет цвет его собственной шляпы. Поэтому все после первого отвечают правильно.&quot;, &quot;standard_idea_ids&quot;: [&quot;parity_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-first-may-be-wrong&quot;, &quot;title&quot;: &quot;Первый отвечающий не различает два состояния&quot;, &quot;text&quot;: &quot;У первого отвечающего одинаковые наблюдения при двух вариантах, отличающихся только цветом его собственной шляпы. Поэтому никакая стратегия не может гарантировать правильность его ответа во всех состояниях.&quot;, &quot;standard_idea_ids&quot;: [&quot;indistinguishable_states&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;двоичная раскраска шляп всех заключенных&quot;, &quot;observations&quot;: [&quot;шляпы впереди&quot;, &quot;предыдущие ;От неделителей к единственному числу Mary&quot;, &quot;text&quot;: &quot;Пусть числа John и Mary равны \\(j\\) и \\(m\\). Если \\(j\\) не делит 2002, John понял бы, что показана сумма, и нашел бы \\(m=2002-j\\). Значит, из его незнания следует, что \\(j\\mid 2002\\), причем \\(j\\ne 2002\\), так что \\(j\\le 1001\\).\n\nMary слышит это рассуждение. Если бы \\(m\\ne 1001\\) и \\(m\\mid 2002\\), то она восстановила бы \\(j=2002/m\\); если бы \\(m\\) не делило 2002, то восстановила бы \\(j=2002-m\\) как в суммовом случае. Единственный способ сохранить неопределенность после слов John - \\(m=1001\\). Проверка показывает, что при \\(m=1001\\) действительно остаются совместимые сценарии.&quot;, &quot;standard_idea_ids&quot;: [&quot;public_announcement_induction&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: []}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;две натуральные величины и неизвестно, показаны ли сумма или произведение&quot;, &quot;observations&quot;: [&quot;показанное число 2002&quot;, &quot;публичное заявление John о незнании&quot;, &quot;публичное заявление Mary о незнании&quot;], &quot;allowed_actions&quot;: [&quot;делать истинные публичные заявления о возможности определить чужое число&quot;], &quot;goal&quot;: [&quot;identify_marys_number&quot;], &quot;strategy_type&quot;: [&quot;public_announcement&quot;, &quot;iterated_elimination&quot;, &quot;divisibility_filter&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;tournament_of_towns_2002&quot;, &quot;sum_product&quot;, &quot;public_ignorance&quot;, &quot;2002&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;knowledge_profile&quot;: {&quot;agents&quot;: [&quot;John&quot;, &quot;Mary&quot;, &quot;Bill&quot;], &quot;public_announcements&quot;: [&quot;John cannot determine Mary&#x27;s number&quot;, &quot;Mary cannot determine John&#x27;s number&quot;], &quot;private_i остались в шляпе. Кан сказал Ру: «Я могу вывести, что сумма чисел на твоих карточках четна». Какова была сумма чисел на карточках Кана?&quot;, &quot;source_ids&quot;: [&quot;src-ukmt-imok-2008-solutions-inside&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-certainty-about-parity-requires-removing-all-evens&quot;, &quot;title&quot;: &quot;Уверенность о четности требует исключить все варианты другой четности&quot;, &quot;text&quot;: &quot;Сумма двух карт Ру четна тогда и только тогда, когда обе карты одной четности. Кан видит только свои три карты, поэтому его уверенность должна следовать из того, какие четности вообще остались для Ру и двух карт в шляпе.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-kan-must-have-all-even-cards&quot;, &quot;title&quot;: &quot;Понять, какие карты должен держать Кан&quot;, &quot;text&quot;: &quot;Если Ру получил две карты с четной суммой, то они либо обе четные, либо обе нечетные. Кан не мог быть уверен, что Ру получил две четные карты: среди чисел 1, 3, 5, 7 четыре нечетные карты, и Кан взял только три карты, поэтому он не способен убрать все нечетные карты из возможных карт Ру. Зато Кан может гарантировать, что Ру получил две нечетные карты, если сам Кан взял все три четные карты 2, 4 и 6. Тогда оставшиеся четыре карты - 1, 3, 5, 7 - все нечетные, и любые две карты Ру имеют четную сумму. Значит сумма карт Кана равна 2+4+6=12.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;распределе tion 13; публичный текст дан русским пересказом.&quot;]}}, {&quot;id&quot;: &quot;utyum-1996-knights-line-seven-yes&quot;, &quot;title&quot;: &quot;Семь ответов «да» в шеренге рыцарей и лжецов&quot;, &quot;fragment&quot;: &quot;wise_people&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;knowledge_puzzle&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Кто справа рыцарь, а кто слева лжец&quot;, &quot;text&quot;: &quot;В ряд стоят несколько человек, каждый из которых - рыцарь или лжец. Рыцари всегда говорят только правду, а лжецы всегда лгут. Семеро из них на вопрос: \&quot;Верно ли, что все люди, стоящие справа от Вас, - рыцари, а все люди слева от Вас - лжецы?\&quot; ответили \&quot;Да\&quot;, а остальные - \&quot;Нет\&quot;. Известно, что среди стоящих есть и рыцари, и лжецы. Сколько среди них может быть лжецов?&quot;, &quot;source_ids&quot;: [&quot;src-utyum-official-local-archive&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-leftmost-knight&quot;, &quot;title&quot;: &quot;Самый левый рыцарь задает границу разбора&quot;, &quot;text&quot;: &quot;Если рассмотреть самого левого рыцаря, то все участники слева от него уже известны как лжецы. Его ответ определяет, как интерпретировать ответы остальных.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-leftmost-knight-casework&quot;, &quot;title&quot;: &quot;Разбор по ответу самого левого рыцаря&quot;, &quot;text&quot;: &quot;Возьмем самого левого рыцаря. Если он ответил \&quot;да\&quot;, то все справа от него - рыцари, все слева - лжецы. Тогда среди лжецов только крайний справа ответит \&quot;нет\&quot;, а остальные лжецы ответят \&quot;да\&quot;, и число лжецов совпадает с числом ответов \&quot;да\&quot;, то есть равно 7. Если самый левый рыцарь ответил \&quot;нет\&quot;, то справа от него есть лжец, а все рыцари отвечают \&quot;нет\&quot;. Любой лжец слева от него лжет на утверждение, что справа все рыцари, а любой лжец справа лжет на утверждение, что слева все лжецы. Значит, в этом случае \&quot;да\&quot; ответили ровно лжецы, и их опять 7.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;расположение рыцарей и лжецов в шеренге&quot;, &quot;observations&quot;: [&quot;публично известны семь ответов да и остальные ответы нет&quot;], &quot;allowed_actions&quot;: [&quot;логически восстановить число лжецов&quot;], &quot;goal&quot;: [&quot;determine_number_of_liars&quot;], &quot;strategy_type&quot;: [&quot;knowledge_elimination&quot;, &quot;case_analysis&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;knights_and_knaves&quot;, &quot;line_order&quot;, &quot;leftmost_knight&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;knowledge_profile&quot;: {&quot;agents&quot;: &quot;unknown finite number&quot;, &quot;public_announcements&quot;: &quot;all answers to one common question&quot;, &quot;communication_rounds&quot;: 1, &quot;visibility&quot;: &quot;line order and answer counts are known&quot;, &quot;objective&quot;: &quot;determine number of liars&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Небольшой разбор возможных миров по крайнему рыцарю.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_induction&quot;, &quot;indistinguishability_argument&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-utyum-official-local-archive&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;russian_young_batch&quot;, &quot;notes&quot;: [&quot;Локальный источник: C:\\Users\\Admin\\Documents\\Codex\\graph-src\\utyum\\work\\utyum\\text\\1996\\tur1psol_extracted.txt, строки 1-9.&quot;]}}, {&quot;id&quot;: &quot;utyum-2010-vasya-two-liars-line&quot;, &quot;title&quot;: &quot;Вася и ровно два лжеца между ним и отвечающим&quot;, &quot;fragment&quot;: &quot;wise_people&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;knowledge_puzzle&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Десять человек в шеренге&quot;, &quot;text&quot;: &quot;10 человек выстроены в шеренгу. Каждый из них либо рыцарь, который всегда говорит правду, либо лжец, который всегда лжет. Ровно один из них - Вася. Каждый из них, кроме Васи, сказал: \&quot;Между мной и Васей ровно два лжеца\&quot;. Сколько лжецов может быть в этой шеренге?&quot;, &quot;source_ids&quot;: [&quot;src-utyum-official-local-archive&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-distance-from-vasya&quot;, &quot;title&quot;: &quot;Ближние к Васе участники вынужденно лгут&quot;, &quot;text&quot;: &quot;Соседи Васи и люди через одного от него не могут иметь между собой и Васей ровно двух лжецов, поэтому они точно лжецы. Дальше типы фиксируются движением от ближайшего гарантированного рыцаря.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-count-by-vasya-position&quot;, &quot;title&quot;: &quot;Посчитать принудительных лжецов около Васи&quot;, &quot;text&quot;: &quot;Люди, стоящие рядом с Васей и через одного от него, заведомо лгут: между ними и Васей меньше двух человек. Тот, между кем и Васей ровно два человека, говорит правду, и при движении дальше от Васи в ту же сторону все следующие также оказываются рыцарями. Число принудительных лжецов около Васи равно 2, если Вася крайний, 3, если он второй с краю, и 4, если он стоит не у края и не вторым с края. Сам Вася не произносил утверждения, поэтому он может быть как рыцарем, так и лжецом. Отсюда возможны ровно 2, 3, 4 или 5 лжецов.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;позиция Васи и тип каждого из 10 участников&quot;, &quot;observations&quot;: [&quot;одинаковые публичные утверждения всех, кроме Васи&quot;], &quot;allowed_actions&quot;: [&quot;логически исключать невозможные типы&quot;], &quot;goal&quot;: [&quot;determine_possible_number_of_liars&quot;], &quot;strategy_type&quot;: [&quot;knowledge_elimination&quot;, &quot;case_analysis&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;knights_and_knaves&quot;, &quot;line_order&quot;, &quot;forced_liars&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;knowledge_profile&quot;: {&quot;agents&quot;: 10, &quot;public_announcements&quot;: &quot;nine identical statements&quot;, &quot;communication_rounds&quot;: 1, &quot;visibility&quot;: <script>
const db = JSON.parse(document.getElementById('payload').textContent);

const fragment = document.getElementById('fragment');
const list = document.getElementById('list');
const detail = document.getElementById('detail');
const fragments = [...new Set(db.problems.map(p => p.fragment))].sort();
for (const f of fragments) {
  const o = document.createElement('option');

}
function textOf(x) { return JSON.stringify(x).toLowerCase(); }
function renderList() {
  const q = query.value.toLowerCase().trim();
  list.innerHTML = '';

    if (q && !textOf(p).includes(q)) continue;

    b.className = 'item';
    b.innerHTML = `<strong>${p.title}</strong><div class="meta">${p.id} · ${p.fragment}</div>`;

    list.appendChild(b);
  }
}
function renderDetail(id) {

    <div class="meta">${p.id} · ${p.fragment} · ${p.difficulty?.main || ''}</div>

    <h3>Условие</h3><p>${stmt.text || ''}</p>

    <h3>Невозможность / нижние оценки</h3>${(p.impossibility_proofs || []).map(s => `<p><b>${s.title}</b></p><pre>${s.text}</pre>`).join('') || '<p class="meta">Нет отдельного доказательства.</p>'}
    <h3>Связи</h3>${rels.map(r => `<p><b>${r.type}</b>: ${r.from} → ${r.to}<br>${r.forward_text}</p>`).join('') || '<p class="meta">Нет связей.</p>'}
  `;
