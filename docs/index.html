&quot;: &quot;problems.ru 35224: четыре монеты на весах без надежного равновесия&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;coding&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Весы произвольно выбирают чашу при равных массах&quot;, &quot;text&quot;: &quot;Есть четыре монеты, одна из них фальшивая и отличается по весу от трех настоящих. Чашечные весы без гирь устроены так: если массы на чашах равны, может перевесить любая чаша, а если массы различны, обязательно перевешивает более тяжелая. Нужно за три взвешивания определить фальшивую монету и понять, легче она или тяжелее настоящих.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-35224&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-avoid-equality-as-signal&quot;, &quot;title&quot;: &quot;Не полагаться на равновесие как на исход&quot;, &quot;text&quot;: &quot;Поскольку равные массы дают произвольный перекос, стратегия должна строиться только на знаке сравнения в заведомо неравных состояниях. Парные сравнения создают подпись участия каждой монеты.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-all-three-pair-partitions&quot;, &quot;title&quot;: &quot;Сравнить все три разбиения на пары&quot;, &quot;text&quot;: &quot;Обозначим монеты \\(a,b,c,d\\). Проведем три взвешивания: \\(a+b\\) против \\(c+d\\), затем \\(a+c\\) против \\(b+d\\), затем \\(a+d\\) против \\(b+c\\). Фальшивая монета участвует в каждом взвешивании и каждый раз делает чашу со своим участием соответственно тяжелее или легче, если она тяжелая или легкая. Для настоящей монеты такого постоянного признака нет: в одном из сравнений ее положение маскируется фальшивой монетой на другой чаше. Поэтому ровно одна монета оказывается на чаше, которая во всех трех сравнениях последовательно побеждает или проигрывает; это фальшивая монета, а направление этих трех исходов дает ее знак.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;8 состояний: одна из 4 монет тяжелая или легкая&quot;, &quot;observations&quot;: [&quot;три двоичных знака перекоса, равновесие не является надежным наблюдением&quot;], &quot;allowed_actions&quot;: [&quot;сравнивать пары монет так, чтобы равные массы не требовали отдельного сигнала&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;, &quot;identify_heavy_or_light&quot;], &quot;strategy_type&quot;: [&quot;nonadaptive_strategy&quot;, &quot;signature_code&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;problems_ru_35224&quot;, &quot;unreliable_equality&quot;, &quot;pair_partitions&quot;, &quot;K4_pair_partitions&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 4, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;heavier_or_lighter_unknown&quot;, &quot;weighing_count&quot;: 3, &quot;outcome_count_per_weighing&quot;: 2, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_coin_and_sign&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Интересный вариант монетной задачи с отказом одного из трех обычных исходов весов.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;nonadaptive_strategy&quot;, &quot;linear_signature&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-35224&quot;, &quot;role&quot;: &quot;web_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;problems_ru_batch&quot;, &quot;generalization_status&quot;: &quot;numbers_essential_for_recorded_solution&quot;, &quot;notes&quot;: [&quot;Существенный вариант четырехмонетных задач: канал наблюдения фактически двоичный, потому что равенство испорчено.&quot;, &quot;2026-05-18: обобщение не добавлено: решение использует ровно три разбиения четырех монет на пары (структуру K4); перенос на большее n становится задачей о специальных сигнатурах/блок-дизайнах, а не тем же коротким решением.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-64498-five-coins-two-opposite-fakes&quot;, &quot;title&quot;: &quot;problems.ru 64498: две противоположные фальшивые монеты из пяти&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Одна легче, другая настолько же тяжелее&quot;, &quot;text&quot;: &quot;Из пяти монет две фальшивые. Одна фальшивая монета легче настоящей, а другая ровно на столько же тяжелее настоящей. Нужно за три взвешивания на чашечных весах без гирь найти обе фальшивые монеты.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-64498&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-one-aside-two-pairs&quot;, &quot;title&quot;: &quot;Два первых сравнения создают эталон или две подозрительные пары&quot;, &quot;text&quot;: &quot;Если сравнить 1 с 2 и 3 с 4, то равновесие в одном сравнении сразу дает настоящие монеты, а два перекоса оставляют пятую монету настоящей. Третье взвешивание калибрует знак и выбирает фальшивые из перекошенных пар.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-single-comparisons&quot;, &quot;title&quot;: &quot;Сначала сравнить две пары одиночных монет&quot;, &quot;text&quot;: &quot;Сравним монеты 1 и 2, затем 3 и 4. Если одно из этих взвешиваний дало равновесие, то две монеты из равной пары настоящие. Сравним одну из них с пятой монетой: если равны, то фальшивые две монеты из неравной пары; если нет, то пятая фальшивая, а во второй неравной паре фальшива монета противоположного знака. Если оба первых взвешивания дали перекос, то пятая монета настоящая. Сравним ее с легкой монетой из первого перекоса: при равенстве в первой паре фальшива тяжелая, а во второй легкая; при неравенстве легкая из первой пары фальшива, а во второй паре фальшива тяжелая.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;20 состояний: выбор легкой и тяжелой фальшивых монет среди пяти&quot;, &quot;observations&quot;: [&quot;три исхода каждого взвешивания&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно сравнивать отдельные монеты или пары&quot;], &quot;goal&quot;: [&quot;identify_all_counterfeit_coins&quot;, &quot;identify_heavy_and_light_roles&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;case_split&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;problems_ru_64498&quot;, &quot;two_counterfeits&quot;, &quot;opposite_weight_deviations&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 5, &quot;counterfeit_count&quot;: 2, &quot;counterfeit_type&quot;: &quot;one_lighter_one_heavier_equal_delta&quot;, &quot;weighing_count&quot;: 3, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_two_coins&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Небольшое адаптивное дерево случаев для двух фальшивых монет с компенсирующими отклонениями.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-64498&quot;, &quot;role&quot;: &quot;web_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;problems_ru_deep_batch&quot;, &quot;notes&quot;: [&quot;Первоисточник по problems.ru: Окружная олимпиада (Москва), 2013, 5 класс, задача 5.5.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-65055-paid-weighings-genuine-coin&quot;, &quot;title&quot;: &quot;problems.ru 65055: найти настоящую монету, платя монетами за взвешивания&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Взвешивания с расходом монет&quot;, &quot;text&quot;: &quot;Есть чашечные весы и 100 монет. Среди них есть фальшивые монеты, но их больше 0 и меньше 99. Все фальшивые одинаковы и легче настоящих, все настоящие одинаковы. Перед каждым взвешиванием нужно заплатить одну из монет, после чего она больше не участвует. Нужно доказать, что можно гарантированно обнаружить настоящую монету.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-65055&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;strategy&quot;]}], &quot;generalized&quot;: [{&quot;id&quot;: &quot;stmt-general-n-paid-weighings&quot;, &quot;title&quot;: &quot;n монет, не все фальшивые и не единственная настоящая&quot;, &quot;text&quot;: &quot;Тот же протокол работает для любого \\(n\\ge 3\\), если фальшивых от 1 до \\(n-2\\): отложить одну монету как первую плату, а остальные \\(n-1\\) сравнивать соседней цепочкой, платя уже исключенными или предыдущими монетами. Первый перекос дает настоящую как более тяжелую, а цепочка равенств доказывает, что весь большой набор настоящий.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-65055&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;strategy&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-chain-equalities&quot;, &quot;title&quot;: &quot;Цепочка равенств либо находит тяжелую, либо доказывает одинаковость большого набора&quot;, &quot;text&quot;: &quot;Так как настоящих монет не меньше двух, среди 99 монет после отложения одной платы есть настоящая. Последовательные сравнения соседних монет либо сразу дают настоящую как более тяжелую, либо показывают, что весь большой набор имеет один вес.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-pay-previous-coin&quot;, &quot;title&quot;: &quot;Отложить плату и сравнивать соседние монеты&quot;, &quot;text&quot;: &quot;Сначала отложим одну монету. Среди оставшихся 99 есть хотя бы одна настоящая. Пронумеруем эти 99 монет. Сравним первую со второй, заплатив отложенной монетой. Если одна из них тяжелее, она настоящая.\n\nЕсли они равны, сравним вторую с третьей, заплатив первой; затем третью с четвертой, заплатив второй, и так далее. При первом неравенстве более тяжелая из двух сравниваемых монет настоящая. Если все такие сравнения дали равенство, то все 99 пронумерованных монет весят одинаково. Среди них есть настоящая, значит все они настоящие, и любую оставшуюся из них можно указать.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;неизвестное множество фальшивых монет при ограничении 1..98 фальшивых из 100&quot;, &quot;observations&quot;: [&quot;равенство или направление перекоса в последовательных сравнениях&quot;], &quot;allowed_actions&quot;: [&quot;платить одной монетой перед каждым взвешиванием и сравнивать две оставшиеся монеты&quot;], &quot;goal&quot;: [&quot;identify_genuine_coin&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;state_elimination&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;problems_ru_65055&quot;, &quot;paid_weighings&quot;, &quot;genuine_coin&quot;, &quot;n_coin_chain_equalities&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 100, &quot;counterfeit_count&quot;: 98, &quot;counterfeit_type&quot;: &quot;lighter_known_variable_count&quot;, &quot;weighing_count&quot;: 98, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_one_genuine_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Ограничение на расход монет меняет обычную модель доступа к объектам.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-65055&quot;, &quot;role&quot;: &quot;web_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;problems_ru_batch&quot;, &quot;generalization_status&quot;: &quot;same_solution_parameterized&quot;, &quot;notes&quot;: [&quot;Источник указывает олимпиаду имени Леонарда Эйлера, 2009 год, задача 4.&quot;, &quot;2026-05-18: число 100 несущественно для цепочки равенств; важны условия хотя бы одна фальшивая и хотя бы две настоящие монеты.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-65817-six-coins-digital-scale-unknown-weights&quot;, &quot;title&quot;: &quot;problems.ru 65817: шесть монет на весах с числовым показанием&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Вес настоящей и фальшивой монеты неизвестны&quot;, &quot;text&quot;: &quot;Есть шесть монет, одна из них фальшивая. Она отличается по весу от настоящей, но ни вес настоящей монеты, ни вес фальшивой заранее неизвестны. Нужно за три взвешивания на весах, показывающих общий вес взвешиваемых монет, найти фальшивую монету.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-65817&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;digital_scale&quot;, &quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-two-pair-calibration&quot;, &quot;title&quot;: &quot;Первые две пары калибруют возможные веса&quot;, &quot;text&quot;: &quot;Веса пар 1-2 и 3-4 задают два параметра \\(a\\) и \\(b\\). Если они равны, подозреваются только 5 и 6; если различны, третье взвешивание 1+3+5 имеет четыре разные предсказанные суммы для фальшивости 1, 2, 3 или 4.&quot;, &quot;standard_idea_ids&quot;: [&quot;linear_signature&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-pair-pair-test-135&quot;, &quot;title&quot;: &quot;Взвесить пары, затем 1+3+5&quot;, &quot;text&quot;: &quot;Сначала взвесим монеты 1 и 2, пусть их суммарный вес \\(2a\\). Затем взвесим 3 и 4, пусть их суммарный вес \\(2b\\). Если \\(a=b\\), то среди первых четырех монет все настоящие, а фальшивая - 5 или 6; третьим взвешиванием взвешиваем монету 5 и сравниваем ее вес с \\(a\\). Если \\(a\\ne b\\), то фальшивая среди монет 1-4. Взвесим 1+3+5. Для случаев, когда фальшива 1, 2, 3 или 4, ожидаемые суммы соответственно равны \\(2a+b\\), \\(3b\\), \\(a+2b\\), \\(3a\\). При \\(a\\ne b\\) эти четыре значения различны, поэтому третье показание однозначно указывает фальшивую монету.&quot;, &quot;standard_idea_ids&quot;: [&quot;linear_signature&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;digital_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;6 вариантов фальшивой монеты и два неизвестных веса настоящей и фальшивой монет&quot;, &quot;observations&quot;: [&quot;три числовых суммарных веса&quot;], &quot;allowed_actions&quot;: [&quot;выбирать подмножества монет для взвешивания на цифровых весах&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;linear_signature&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;problems_ru_65817&quot;, &quot;unknown_true_weight&quot;, &quot;unknown_fake_weight&quot;, &quot;digital_scale&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 6, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;unknown_sign_unknown_weights&quot;, &quot;weighing_count&quot;: 3, &quot;outcome_count_per_weighing&quot;: &quot;numeric_weight&quot;, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Числовые весы дают линейные подписи, хотя базовые веса не известны заранее.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;digital_scale&quot;, &quot;linear_signature&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-65817&quot;, &quot;role&quot;: &quot;web_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;problems_ru_deep_batch&quot;, &quot;notes&quot;: [&quot;problems.ru указывает первоисточники: Турнир городов 2005/2006, 27-й, осенний тур, тренировочный вариант, 8-9 классы задача 5 и 10-11 классы задача 3; также публикация в Кванте, 2006, №2, задача М1991.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-78572-eleven-bags-two-numeric-balance-weighings&quot;, &quot;title&quot;: &quot;problems.ru 78572: 11 мешков и неизвестный знак отклонения&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Весы показывают, на сколько одна чаша тяжелее&quot;, &quot;text&quot;: &quot;Есть 11 мешков монет. В 10 мешках монеты настоящие, а в одном все монеты фальшивые. Масса фальшивой монеты отличается от настоящей, но неизвестно в какую сторону и на сколько. Весы сравнивают две чаши и показывают, какая тяжелее и на сколько. Нужно двумя взвешиваниями определить мешок с фальшивыми монетами.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-78572&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;digital_scale&quot;, &quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-ratio-cancels-unknown-delta&quot;, &quot;title&quot;: &quot;Отношение двух показаний убирает неизвестную разницу масс&quot;, &quot;text&quot;: &quot;Показание каждого взвешивания линейно по неизвестному отклонению \\(x\\). Если коэффициенты выбраны как 1 и \\(i\\) для мешка \\(i\\), то отношение числовых показаний дает номер мешка, а специальный мешок отделяется нецелым отношением.&quot;, &quot;standard_idea_ids&quot;: [&quot;weighted_sum_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-linear-signatures&quot;, &quot;title&quot;: &quot;Сравнить две линейные комбинации&quot;, &quot;text&quot;: &quot;Пронумеруем мешки 1-11. В первом взвешивании положим на одну чашу по одной монете из мешков 1-10, а на другую 10 монет из мешка 11. Во втором взвешивании положим на первую чашу 1 монету из мешка 1, 2 из мешка 2, ..., 10 из мешка 10, а на другую 55 монет из мешка 11. Пусть \\(x\\) - разность массы фальшивой и настоящей монеты. Если фальшивый мешок имеет номер \\(i\\le 10\\), первое показание пропорционально \\(x\\), а второе - \\(ix\\), поэтому отношение дает \\(i\\). Если фальшивый мешок 11, показания пропорциональны \\(-10x\\) и \\(-55x\\), отношение не совпадает с целым номером 1-10; значит это мешок 11.&quot;, &quot;standard_idea_ids&quot;: [&quot;weighted_sum_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;digital_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;11 вариантов мешка и неизвестный ненулевой параметр отклонения массы&quot;, &quot;observations&quot;: [&quot;два числовых показания разности масс&quot;], &quot;allowed_actions&quot;: [&quot;неадаптивно выбрать количества монет из мешков для двух сравнений&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_stack&quot;], &quot;strategy_type&quot;: [&quot;nonadaptive_strategy&quot;, &quot;linear_signature&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;problems_ru_78572&quot;, &quot;unknown_delta&quot;, &quot;ratio_encoding&quot;, &quot;two_numeric_weighings&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: &quot;11 bags&quot;, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;one_bag_all_counterfeit_unknown_sign_and_delta&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: &quot;numeric_difference&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_stack&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;В отличие от классической задачи с известной недостачей, неизвестное отклонение устраняется отношением двух линейных подписей.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;digital_scale&quot;, &quot;weighted_sum_encoding&quot;, &quot;linear_signature&quot;, &quot;nonadaptive_strategy&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-78572&quot;, &quot;role&quot;: &quot;web_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;problems_ru_deep_batch&quot;, &quot;notes&quot;: [&quot;Первоисточник по problems.ru: Московская математическая олимпиада, 1965, 28-я, вариант 1, 9 класс, 2 тур, задача 1.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-78810-thousand-coins-zero-one-two-fakes-sign&quot;, &quot;title&quot;: &quot;problems.ru 78810: есть ли фальшивые и каков знак отклонения&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;1000 монет, 0, 1 или 2 фальшивые&quot;, &quot;text&quot;: &quot;Есть 1000 монет, среди них 0, 1 или 2 фальшивые. Все фальшивые, если они есть, имеют одинаковую массу, отличную от массы настоящих. Нужно за три взвешивания на чашечных весах без гирь определить, есть ли фальшивые монеты и легче они или тяжелее настоящих; количество фальшивых определять не требуется.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-78810&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-halves-detect-sign-not-location&quot;, &quot;title&quot;: &quot;Нужно различить знак, а не найти монеты&quot;, &quot;text&quot;: &quot;Большие равные разбиения позволяют не локализовать каждую фальшивую монету. После сравнения половин последующие взвешивания выбирают такие четверти, где наличие фальшивой монеты эквивалентно знаку отклонения.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-three-halving-tests&quot;, &quot;title&quot;: &quot;Сравнить половины, затем согласованные четверти&quot;, &quot;text&quot;: &quot;Разделим монеты на две группы \\(A\\) и \\(B\\) по 500 и сравним их. Если \\(A&gt;B\\), то фальшивые есть. Разделим \\(A=A_1\\cup A_2\\), \\(B=B_1\\cup B_2\\) по 250 и сравним \\(A_1+B_1\\) с \\(A_2+B_2\\). При неравенстве, например \\(A_1+B_1&gt;A_2+B_2\\), фальшивые либо тяжелые в \\(A_1\\), либо легкие в \\(B_2\\); сравнением \\(B_1\\) и \\(B_2\\) выбираем один из двух случаев. При равенстве фальшивые либо тяжелые по одной в \\(A_1,A_2\\), либо легкие по одной в \\(B_1,B_2\\); сравнение двух половин \\(A_1\\) решает, есть ли фальшивая в \\(A_1\\). Если первое взвешивание дало \\(A=B\\), то либо фальшивых нет, либо их две, по одной в \\(A\\) и \\(B\\). Тогда аналогичное деление и сравнение половин \\(A\\) позволяет отличить отсутствие фальшивых от тяжелой или легкой пары.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;0, 1 или 2 одинаково отклоняющиеся фальшивые монеты среди 1000, знак отклонения неизвестен&quot;, &quot;observations&quot;: [&quot;три исхода каждого из трех взвешиваний&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно сравнивать большие равные группы монет&quot;], &quot;goal&quot;: [&quot;detect_presence_of_counterfeits&quot;, &quot;identify_heavy_or_light&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;coarse_state_classification&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;problems_ru_78810&quot;, &quot;zero_one_two_counterfeits&quot;, &quot;sign_detection_without_count&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 1000, &quot;counterfeit_count&quot;: &quot;0_or_1_or_2&quot;, &quot;counterfeit_type&quot;: &quot;same_unknown_sign&quot;, &quot;weighing_count&quot;: 3, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;detect_presence_and_sign&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Стратегия работает за счет ослабленной цели: не требуется ни число, ни местоположение фальшивых монет.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-78810&quot;, &quot;role&quot;: &quot;web_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;problems_ru_deep_batch&quot;, &quot;notes&quot;: [&quot;Первоисточник по problems.ru: Московская математическая олимпиада, 1972, 35-я, 8 класс, 1 тур, задача 3.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-88304-denomination-coins&quot;, &quot;title&quot;: &quot;problems.ru 88304: монеты 1, 2, 3 и 5 копеек за два взвешивания&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;case_analysis&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Один номинал испорчен&quot;, &quot;text&quot;: &quot;Есть четыре бронзовые монеты номиналами 1, 2, 3 и 5 копеек. Настоящие монеты этих номиналов весят соответственно 1, 2, 3 и 5 граммов. Ровно одна монета фальшивая и отличается от своего настоящего веса. Нужно двумя взвешиваниями на чашечных весах без гирь определить, какая монета фальшивая.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-88304&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-use-nominal-linear-relation&quot;, &quot;title&quot;: &quot;Использовать равенство настоящих весов 2 + 3 = 5&quot;, &quot;text&quot;: &quot;Первое взвешивание проверяет линейное соотношение между номинальными весами. Равновесие сразу исключает фальшь в участвующих монетах, а перекос оставляет малый набор направленных случаев.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-23-vs-5-then-21-vs-3&quot;, &quot;title&quot;: &quot;Сначала 2 и 3 против 5&quot;, &quot;text&quot;: &quot;Сравним монеты 2 и 3 копейки с монетой 5 копеек. Если равновесие, то все три участвующие монеты имеют правильные веса, значит фальшива монета 1 копейка.\n\nЕсли чаша с 5 копейками тяжелее, вторым взвешиванием сравним 2 + 1 с 3. При равновесии фальшива 5-копеечная монета. Если тяжелее 3, то фальшива 2-копеечная монета и она легче нормы. Если тяжелее 2 + 1, то фальшива 3-копеечная монета и она легче нормы. Случай, когда в первом взвешивании 5-копеечная монета легче, разбирается тем же вторым взвешиванием с обратными направлениями: равновесие указывает на 5 копеек, перекосы различают тяжелые 2 или 3 копейки.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какая из четырех монет имеет неверный вес и в какую сторону она отклоняется&quot;, &quot;observations&quot;: [&quot;два трехисходных результата чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;сравнивать выбранные суммы номинальных монет&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;linear_signature&quot;, &quot;case_elimination&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;problems_ru_88304&quot;, &quot;denomination_weights&quot;, &quot;linear_relation&quot;, &quot;2_plus_3_equals_5&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 4, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;unknown_offset_from_known_nominal_weight&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Небольшая, но не чисто симметричная задача: важны числовые веса номиналов.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;linear_signature&quot;, &quot;decision_tree&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-88304&quot;, &quot;role&quot;: &quot;web_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;problems_ru_batch&quot;, &quot;generalization_status&quot;: &quot;numbers_essential_for_recorded_solution&quot;, &quot;notes&quot;: [&quot;Источник - кружковая задача МЦНМО 2004/2005, занятие 5, задача 5.8.&quot;, &quot;2026-05-18: обобщение не добавлено: стратегия опирается на конкретное соотношение номиналов 2+3=5 и отдельную монету 1 для второго теста; замена чисел меняет систему линейных различений.&quot;]}}, {&quot;id&quot;: &quot;sasmo-2020-g9-q10-2019-light-coin&quot;, &quot;title&quot;: &quot;SASMO 2020 G9 Q10: одна легкая монета среди 2019&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;weighing_strategy&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-sasmo-2020-g9-q10&quot;, &quot;title&quot;: &quot;Минимум взвешиваний для 2019 монет&quot;, &quot;text&quot;: &quot;Среди 2019 внешне одинаковых монет ровно одна фальшивая, и она легче настоящих. Настоящие монеты имеют одинаковый вес. Есть чашечные весы; за одно взвешивание можно положить на чаши любые одинаковые количества монет. Какое наименьшее число взвешиваний гарантированно позволяет найти фальшивую монету?&quot;, &quot;source_ids&quot;: [&quot;src-simcc-sasmo-2019-2020-g9-book&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-ceil-log3-known-light&quot;, &quot;title&quot;: &quot;Известно, что фальшивая монета легче&quot;, &quot;text&quot;: &quot;Когда направление отклонения известно заранее, каждое взвешивание делит кандидатов на три группы: левая подозрительная группа, правая подозрительная группа или группа вне весов.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_search&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-split-into-three-nearly-equal-parts&quot;, &quot;title&quot;: &quot;Делить кандидатов на три части&quot;, &quot;text&quot;: &quot;На каждом шаге делим оставшиеся подозрительные монеты на три как можно равные группы. Две равные группы кладем на чаши. Если левая легче, фальшивая в левой группе; если правая легче, в правой; если весы в равновесии, фальшивая в третьей группе, которая не взвешивалась. Так за q взвешиваний можно различить до \\(3^q\\) кандидатов. Поскольку \\(3^6=729&lt;2019\\), шести взвешиваний недостаточно, а \\(3^7=2187\\), семи достаточно. Минимум равен 7.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_search&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-six-weighings-only-729-leaves&quot;, &quot;title&quot;: &quot;Шести взвешиваний недостаточно&quot;, &quot;text&quot;: &quot;У чашечных весов три исхода, поэтому дерево из шести взвешиваний имеет не больше \\(3^6=729\\) листьев. Для 2019 возможных положений легкой монеты этого недостаточно.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какая из 2019 монет является единственной более легкой фальшивой&quot;, &quot;observations&quot;: [&quot;до семи трехисходных результатов чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно сравнивать равные по числу группы монет&quot;], &quot;goal&quot;: [&quot;identify_light_counterfeit_coin&quot;, &quot;minimize_weighings&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;ternary_search&quot;, &quot;decision_tree&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_leaf_count&quot;], &quot;keywords&quot;: [&quot;sasmo_2020&quot;, &quot;2019_coins&quot;, &quot;light_counterfeit&quot;, &quot;ceil_log3_n&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 2019, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;known_lighter&quot;, &quot;weighing_count&quot;: 7, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;find_minimum_weighings&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Прямое применение тернарного поиска и нижней оценки по числу листьев.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;ternary_search&quot;, &quot;decision_tree_lower_bound&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-simcc-sasmo-2019-2020-g9-book&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;singapore_batch&quot;, &quot;notes&quot;: [&quot;Англоязычное условие и решение из официального SIMCC/SASMO practice book пересказаны по-русски.&quot;]}}, {&quot;id&quot;: &quot;savin-12-six-coins-two-fakes-two-weighings&quot;, &quot;title&quot;: &quot;Турнир Савина XII: две фальшивые монеты в двух группах&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;weighing_strategy&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Адаптивно и с отложенными результатами&quot;, &quot;text&quot;: &quot;В ряд лежат шесть монет. Среди первых четырех ровно одна фальшивая, среди последних двух тоже ровно одна фальшивая. Фальшивые монеты одинаковы и легче настоящих. Нужно определить обе фальшивые монеты за два взвешивания на чашечных весах; отдельно спрашивается, можно ли выбрать оба взвешивания заранее, если результаты станут известны только на следующий день.&quot;, &quot;source_ids&quot;: [&quot;src-tursavin-12-problems&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;hidden_state&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-eight-states-two-ternary-answers&quot;, &quot;title&quot;: &quot;Восемь состояний помещаются в два тернарных наблюдения&quot;, &quot;text&quot;: &quot;Скрытое состояние задается одной монетой из первых четырех и одной из последних двух. Два взвешивания могут дать до девяти пар исходов, поэтому нужно построить разные сигнатуры для восьми состояний.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-adaptive-first-15-vs-26&quot;, &quot;title&quot;: &quot;Адаптивная стратегия через первое сравнение 1+5 и 2+6&quot;, &quot;text&quot;: &quot;Сначала сравним монеты 1+5 с 2+6. Если равновесие, возможны только пары фальшивых (1,6) и (2,5), и второе сравнение 1 с 2 их различит. Если левая чаша легче, то фальшивая среди последних двух равна 5, а первая фальшивая одна из 1,3,4; сравнение 1 с 3 различает три случая. Если левая чаша тяжелее, то фальшивая среди последних двух равна 6, а первая фальшивая одна из 2,3,4; сравнение 2 с 3 различает эти три случая.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}, {&quot;id&quot;: &quot;str-nonadaptive-signature-table&quot;, &quot;title&quot;: &quot;Неадаптивная стратегия через две заранее заданные подписи&quot;, &quot;text&quot;: &quot;Для заранее выбранных взвешиваний достаточно назначить монетам 1..6 подписи (-1,-1), (-1,0), (0,1), (1,-1), (0,1), (1,0), где координата -1 означает положить монету на правую чашу соответствующего взвешивания, 1 - на левую, 0 - не класть. В каждом взвешивании суммарное число монет на чашах одинаково. Пара исходов равна знаку суммы подписей двух фальшивых монет и для восьми допустимых пар получается разной; значит, оба взвешивания можно провести заранее.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;8 пар фальшивых монет: одна из {1,2,3,4} и одна из {5,6}&quot;, &quot;observations&quot;: [&quot;два результата чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;сравнивать равные по числу наборы монет&quot;, &quot;во втором пункте выбрать оба сравнения заранее&quot;], &quot;goal&quot;: [&quot;identify_two_light_coins&quot;], &quot;strategy_type&quot;: [&quot;adaptive_branching&quot;, &quot;nonadaptive_signature&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;savin_12&quot;, &quot;six_coins&quot;, &quot;two_light_fakes&quot;, &quot;delayed_results&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 6, &quot;counterfeit_count&quot;: 2, &quot;counterfeit_type&quot;: &quot;two_light_with_group_constraints&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_two_counterfeits&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Турнир Савина, задача с адаптивной и неадаптивной версиями.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;ternary_code&quot;, &quot;nonadaptive_strategy&quot;, &quot;decision_tree&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-tursavin-12-problems&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;needs_human_review&quot;, &quot;public_ready&quot;: false, &quot;relations_status&quot;: &quot;matprazdnik_savin_batch&quot;, &quot;notes&quot;: [&quot;Официальный PDF XII турнира Савина содержит условие; решение восстановлено редакционно и требует человеческой сверки.&quot;, &quot;2026-05-18: public_ready снят редакторской проверкой до ручной сверки решения.&quot;]}}, {&quot;id&quot;: &quot;ternary-signature-code-heavy-or-light&quot;, &quot;title&quot;: &quot;Тернарные подписи для монеты неизвестного знака&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;generalization&quot;, &quot;secondary&quot;: [&quot;coding&quot;, &quot;strategy_construction&quot;, &quot;lower_bound&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-q-signature-code&quot;, &quot;title&quot;: &quot;q взвешиваний как код противоположных слов&quot;, &quot;text&quot;: &quot;Есть \\(N\\) подозрительных монет, ровно одна фальшивая, но неизвестно, легче она или тяжелее настоящих. Есть чашечные весы и достаточно заведомо настоящих монет для балансировки чаш. Как с помощью \\(q\\) заранее спроектированных взвешиваний закодировать монету и знак отличия?&quot;, &quot;source_ids&quot;: [&quot;src-classical-coin-weighing&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;state_space&quot;]}], &quot;generalized&quot;: [{&quot;id&quot;: &quot;stmt-capacity&quot;, &quot;title&quot;: &quot;Емкость противоположных ненулевых тернарных слов&quot;, &quot;text&quot;: &quot;Сигнатурная схема различает до \\((3^q-1)/2\\) подозрительных монет: из каждой пары противоположных ненулевых слов длины \\(q\\) выбирается не более одного представителя. Совпадение наблюдаемого слова с подписью означает тяжелую монету, противоположное слово - легкую.&quot;, &quot;source_ids&quot;: [&quot;src-classical-coin-weighing&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-opposite-signatures&quot;, &quot;title&quot;: &quot;Тяжелый и легкий случаи дают противоположные исходы&quot;, &quot;text&quot;: &quot;Если монета участвует в некотором взвешивании слева, ее тяжелость сдвигает исход в сторону левой чаши, а легкость - в противоположную сторону. Поэтому одна подпись монеты кодирует сразу два состояния через пару \\(v\\) и \\(-v\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-assign-ternary-signatures&quot;, &quot;title&quot;: &quot;Назначить монетам представители пар&quot;, &quot;text&quot;: &quot;Выберем для каждой подозрительной монеты ненулевое слово \\(v_i\\in\\{-1,0,+1\\}^q\\), причем никакие два выбранных слова не равны и не противоположны. В \\(t\\)-м взвешивании кладем монеты с координатой \\(+1\\) на левую чашу, с координатой \\(-1\\) на правую, а координата 0 означает неучастие. Заведомо настоящие монеты используются только как балласт, чтобы чаши содержали равные массы настоящих монет в отсутствие фальшивки.\n\nПосле \\(q\\) взвешиваний получаем тернарное слово исходов. Если оно равно \\(v_i\\), то монета \\(i\\) тяжелее; если равно \\(-v_i\\), то монета \\(i\\) легче. Нулевое слово не назначается подозрительной монете, потому что оно не различило бы знак отличия. Всего ненулевых тернарных слов \\(3^q-1\\), они разбиваются на \\((3^q-1)/2\\) противоположных пар, что и дает емкость этой сигнатурной схемы.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-opposite-pairs&quot;, &quot;title&quot;: &quot;В одной паре нельзя разместить две монеты&quot;, &quot;text&quot;: &quot;Если двум разным монетам назначить одинаковые или противоположные подписи, то один из тяжелых/легких случаев даст тот же наблюдаемый исход, что случай для другой монеты. Поэтому в сигнатурной схеме каждой монете нужна отдельная пара противоположных ненулевых слов.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;2N состояний: монета и знак отклонения&quot;, &quot;observations&quot;: [&quot;тернарное слово из q исходов чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;заранее назначить подписи участия монет во взвешиваниях&quot;, &quot;использовать заведомо настоящие монеты как балласт&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;, &quot;identify_heavy_or_light&quot;], &quot;strategy_type&quot;: [&quot;ternary_code&quot;, &quot;nonadaptive_strategy&quot;, &quot;signature_code&quot;], &quot;lower_bound_method&quot;: [&quot;opposite_pair_count&quot;], &quot;keywords&quot;: [&quot;ternary_signature_code&quot;, &quot;heavy_or_light&quot;, &quot;q_weighings&quot;, &quot;(3^q-1)/2_capacity&quot;, &quot;known_genuine_ballast&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 0, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;heavier_or_lighter_unknown&quot;, &quot;weighing_count&quot;: 0, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_coin_and_sign_by_signature_code&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Общая кодовая форма классических задач про неизвестно легкую или тяжелую монету.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;ternary_code&quot;, &quot;nonadaptive_strategy&quot;, &quot;counting_lower_bound&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-classical-coin-weighing&quot;, &quot;role&quot;: &quot;folklore_generalization&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;generalizations_batch&quot;, &quot;generalization_status&quot;: &quot;new_related_generalization_changes_solution_level&quot;, &quot;notes&quot;: [&quot;Создана как родственная карточка, потому что переход от конкретных 12/13 монет к q взвешиваниям меняет решение с дерева случаев на сигнатурный код.&quot;, &quot;Формулировка явно требует достаточно известных настоящих монет для баланса; частный случай с одной эталонной монетой при q=3 сохранен отдельной карточкой.&quot;]}}, {&quot;id&quot;: &quot;thirteen-coins-known-genuine-three-weighings&quot;, &quot;title&quot;: &quot;13 монет и одна эталонная монета за три взвешивания&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;weighing_strategy&quot;, &quot;coding&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-13-with-known-good&quot;, &quot;title&quot;: &quot;Фальшивая монета легче или тяжелее&quot;, &quot;text&quot;: &quot;Есть 13 подозрительных монет и одна заведомо настоящая монета. Среди 13 подозрительных ровно одна фальшивая; неизвестно, легче она настоящих или тяжелее. Нужно за три взвешивания на чашечных весах определить фальшивую монету и сказать, легче она или тяжелее.&quot;, &quot;source_ids&quot;: [&quot;src-balance-puzzle-reference&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;]}], &quot;reformulation&quot;: [{&quot;id&quot;: &quot;stmt-as-q-signature-code&quot;, &quot;title&quot;: &quot;q=3 в коде противоположных тернарных подписей&quot;, &quot;text&quot;: &quot;С эталонной монетой задача становится точным случаем общей сигнатурной схемы: \\(q\\) взвешиваний дают \\((3^q-1)/2\\) пар противоположных ненулевых тернарных слов, каждая пара кодирует одну подозрительную монету и два возможных знака отклонения. При \\(q=3\\) это ровно 13 монет.&quot;, &quot;source_ids&quot;: [&quot;src-balance-puzzle-reference&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-nonzero-ternary-signatures&quot;, &quot;title&quot;: &quot;Монетам назначаются противоположные тернарные подписи&quot;, &quot;text&quot;: &quot;Три взвешивания дают тернарное слово. Монета с подписью \\(v\\) при тяжелой фальшивости дает исходы \\(v\\), а при легкой - противоположные исходы. Нужно выбрать 13 представителей из 13 пар ненулевых противоположных тернарных слов.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-balanced-ternary-signature-table&quot;, &quot;title&quot;: &quot;Таблица трех взвешиваний&quot;, &quot;text&quot;: &quot;Обозначим исход каждого взвешивания как \\(+\\), если левая чаша тяжелее, \\(-\\), если правая тяжелее, и \\(0\\), если равновесие. Для каждой подозрительной монеты выберем ненулевую подпись длины 3 над \\(\\{-,0,+\\}\\), причем никакие две подписи не должны быть противоположными. Если монета стоит слева в данном взвешивании, пишем \\(+\\); справа - \\(-\\); не участвует - \\(0\\). Эталонную монету добавляем там, где нужно уравнять число монет на чашах.\n\nОдин сбалансированный набор подписей для монет 1-13: \\((+++),(--0),(++-),(+0+),(+00),(-0+),(-+-),(-+0),(-++),(0--),(0-0),(0-+),(00-)\\). В каждом из трех взвешиваний кладем на левую чашу монеты со знаком \\(+\\), на правую - со знаком \\(-\\). В первом взвешивании справа на одну подозрительную монету больше, поэтому эталонную монету кладем слева; во втором и третьем слева на одну подозрительную монету больше, поэтому эталонную монету кладем справа.\n\nПосле трех взвешиваний получаем исходное слово \\(w\\). Если \\(w\\) совпало с подписью монеты, эта монета тяжелее настоящих. Если \\(w\\) противоположно подписи монеты, эта монета легче настоящих. Нулевое слово невозможно, потому что по условию одна из 13 подозрительных монет фальшивая и каждая имеет ненулевую подпись. Эталонная монета не создает скрытого состояния: она нужна только для балансировки чаш.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-13-is-capacity-with-known-good&quot;, &quot;title&quot;: &quot;Почему 13 - предельная емкость для трех взвешиваний&quot;, &quot;text&quot;: &quot;Три взвешивания имеют \\(3^3=27\\) исходов. Сценарии «монета \\(i\\) тяжелая» и «монета \\(i\\) легкая» должны давать разные ненулевые исходы, причем они естественно идут противоположными парами. Ненулевых исходов 26, то есть 13 пар. Поэтому с известной настоящей монетой можно закодировать не больше 13 подозрительных монет.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;26 состояний: какая из 13 монет фальшивая и легче/тяжелее ли она&quot;, &quot;observations&quot;: [&quot;три исхода чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;три заранее заданных или адаптивных взвешивания с использованием эталонной монеты&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;, &quot;identify_heavy_or_light&quot;], &quot;strategy_type&quot;: [&quot;ternary_code&quot;, &quot;nonadaptive_strategy&quot;], &quot;lower_bound_method&quot;: [&quot;ternary_outcome_count&quot;], &quot;keywords&quot;: [&quot;13_coins&quot;, &quot;known_genuine_coin&quot;, &quot;balanced_ternary_code&quot;, &quot;q_ternary_signature_code&quot;, &quot;(3^q-1)/2_capacity&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 13, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;heavier_or_lighter_unknown&quot;, &quot;weighing_count&quot;: 3, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;find counterfeit and direction using one known genuine coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Кодовая версия классической задачи о 12 монетах; таблица уравновешена эталонной монетой на каждом шаге.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;ternary_code&quot;, &quot;nonadaptive_strategy&quot;, &quot;counting_lower_bound&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-balance-puzzle-reference&quot;, &quot;role&quot;: &quot;reference_topic&quot;, &quot;status&quot;: &quot;needs_human_review&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;generalization_status&quot;: &quot;special_case_of_new_signature_generalization&quot;, &quot;notes&quot;: [&quot;Проверено: в первом взвешивании эталонная монета добавляется слева, во втором и третьем - справа; подписи не содержат противоположных пар.&quot;, &quot;2026-05-18: добавлена реформа как q=3 общей схемы противоположных тернарных подписей; общая карточка вынесена в data/problems/generalizations/.&quot;]}}, {&quot;id&quot;: &quot;tournament-towns-2005-six-coins-pointer-scale&quot;, &quot;title&quot;: &quot;Tournament of Towns 2005: фальшивая монета на весах с числовым показанием&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;coding&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-tot-2005-fall-junior-o-5&quot;, &quot;title&quot;: &quot;Одна фальшивая среди шести, веса настоящей и фальшивой неизвестны&quot;, &quot;text&quot;: &quot;Среди шести монет одна фальшивая. Все настоящие монеты имеют один и тот же вес, фальшивая имеет другой вес, но ни вес настоящей монеты, ни вес фальшивой заранее не известен. Весы показывают общий вес положенных на чашу монет. Найдите фальшивую монету за три взвешивания.&quot;, &quot;source_ids&quot;: [&quot;src-tot-toronto-2005-fall-junior-o&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;strategy&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-average-signature&quot;, &quot;title&quot;: &quot;Сравнить средние веса пересекающихся наборов&quot;, &quot;text&quot;: &quot;Если взвесить пары и тройку с пересечениями, то равенства и линейные соотношения между средними весами образуют подпись фальшивой монеты.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-three-averages&quot;, &quot;title&quot;: &quot;Три средних веса&quot;, &quot;text&quot;: &quot;Обозначим монеты \\(A,B,C,D,E,F\\). За три взвешивания найдем средний вес \\(m\\) монет \\(C,E\\), средний вес \\(n\\) монет \\(D,F\\) и средний вес \\(k\\) монет \\(B,E,F\\).\n\nЕсли \\(m=n=k\\), то фальшива монета \\(A\\), так как ни одно взвешивание ее не затронуло, а все увиденные средние совпали с весом настоящей монеты. Если \\(m=n\\ne k\\), фальшива \\(B\\). Если \\(m\\ne n=k\\), фальшива \\(C\\). Если \\(k=m\\ne n\\), фальшива \\(D\\). Если все три средних попарно различны, фальшива \\(E\\) или \\(F\\). Эти два случая различаются линейно: для \\(E\\) выполняется \\(2m+n=3k\\), а для \\(F\\) выполняется \\(m+2n=3k\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: []}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;6 вариантов положения фальшивой монеты плюс два неизвестных числовых веса&quot;, &quot;observations&quot;: [&quot;три числовых значения общего веса выбранных наборов&quot;], &quot;allowed_actions&quot;: [&quot;взвешивать выбранные подмножества монет на весах с показанием общего веса&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;], &quot;strategy_type&quot;: [&quot;nonadaptive_strategy&quot;, &quot;linear_encoding&quot;, &quot;state_space_partition&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;tournament_of_towns_2005&quot;, &quot;pointer_scale&quot;, &quot;averages&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 6, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;different_weight_unknown_sign_and_unknown_true_weight&quot;, &quot;weighing_count&quot;: 3, &quot;outcome_count_per_weighing&quot;: 0, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_counterfeit_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Junior O-Level Tournament of Towns; решение является небольшой линейной кодировкой.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;digital_scale&quot;, &quot;linear_signature&quot;, &quot;nonadaptive_strategy&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-tot-toronto-2005-fall-junior-o&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Источник: архив Tournament of Towns в Торонто, Fall 2005 Junior O-Level problems and solutions.&quot;]}}, {&quot;id&quot;: &quot;ukmt-open-ended-2013-task-four-42-counterfeit-coins&quot;, &quot;title&quot;: &quot;UKMT Open Ended 2013 Task Four: 42 монеты и нижняя оценка в пять взвешиваний&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;open_ended&quot;, &quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-ukmt-open-ended-2013-task-four&quot;, &quot;title&quot;: &quot;Найти фальшивую монету чашечными весами&quot;, &quot;text&quot;: &quot;В кошельке 42 монеты по одному фунту. Они выглядят одинаково, но одна монета фальшивая и имеет другой вес, а все остальные весят одинаково. Есть только чашечные весы. Сколько раз нужно использовать весы, чтобы найти фальшивую монету? Затем предлагается рассмотреть другие количества таких монет, понять, какие количества легче или труднее, и найти наилучшую стратегию для произвольного числа монет.&quot;, &quot;source_ids&quot;: [&quot;src-ukmt-open-ended-2013-primary&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;state_space&quot;, &quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-counterfeit-heavier-or-lighter-doubles-states&quot;, &quot;title&quot;: &quot;Состояние включает не только номер монеты, но и направление отличия&quot;, &quot;text&quot;: &quot;Так как фальшивая монета просто другого веса, заранее неизвестно, тяжелее она или легче настоящих. Поэтому для 42 монет естественное пространство состояний имеет 84 варианта: выбор монеты и выбор знака отличия.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-five-weighings-for-42&quot;, &quot;title&quot;: &quot;Пять взвешиваний достаточно&quot;, &quot;text&quot;: &quot;Сначала взвесим 13 монет против других 13. Если равновесие, фальшивая монета среди оставшихся 16, а все 26 взвешенных монет уже заведомо настоящие. За четыре оставшихся взвешивания эти 16 монет можно разобрать стандартным тернарным кодом: каждой подозрительной монете назначаем ненулевое слово длины 4 над \\(\\{-,0,+\\}\\), не выбирая вместе два противоположных слова; в каждом взвешивании кладем монету налево при знаке \\(+\\), направо при знаке \\(-\\), а настоящими монетами уравниваем число монет на чашах. Полученное слово исходов или противоположное ему указывает монету, а при необходимости и знак отличия.\n\nЕсли первое взвешивание не дало равновесия, фальшивая монета среди 26 взвешенных: либо тяжелая на перевесившей чаше, либо легкая на другой. Остальные 16 монет настоящие. Теперь у каждого кандидата уже известен возможный знак отличия, поэтому нужно различить только 26 состояний. За четыре взвешивания это делается любым инъективным тернарным кодом длины 4 для 26 кандидатов: если кандидат имеет знак «может быть тяжелой», кладем его на сторону, соответствующую знаку кода; если «может быть легкой», кладем на противоположную сторону, чтобы ожидаемый исход все равно совпадал с кодовым словом. Настоящие монеты снова используются только для балансировки чаш. Так пять взвешиваний гарантированно находят фальшивую монету.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-four-weighings-not-enough-for-42&quot;, &quot;title&quot;: &quot;Четырех взвешиваний недостаточно&quot;, &quot;text&quot;: &quot;У четырех взвешиваний есть только \\(3^4=81\\) возможная последовательность исходов. Для каждой монеты, которая хотя бы раз реально проверяется, состояния «эта монета тяжелее» и «эта монета легче» не могут всегда идти по одному и тому же пути: уже в первом взвешивании, где монета участвует, они дают противоположные отклонения. Значит, такая монета требует двух разных конечных путей, даже если в ответе нужно назвать только номер монеты. Только одна монета может вообще не участвовать в информативных сравнениях и тем самым соответствовать одному пути равновесий. Поэтому для 42 монет нужно не меньше \\(2\\cdot42-1=83\\) конечных путей, а 81 пути не хватает. Следовательно, минимум равен пяти взвешиваниям.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какая из 42 монет фальшивая и тяжелее она или легче настоящих&quot;, &quot;observations&quot;: [&quot;каждое взвешивание дает один из трех исходов: левая чаша тяжелее, равновесие, правая чаша тяжелее&quot;], &quot;allowed_actions&quot;: [&quot;выбирать группы монет для сравнения на чашечных весах&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;, &quot;optionally_identify_weight_direction&quot;], &quot;strategy_type&quot;: [&quot;decision_tree&quot;, &quot;ternary_code&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;keywords&quot;: [&quot;ukmt_open_ended_2013&quot;, &quot;counterfeit_coin&quot;, &quot;42_coins&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 42, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;one_coin_different_weight_unknown_direction&quot;, &quot;weighing_count&quot;: 5, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot; я монета настоящей?&quot;, &quot;source_ids&quot;: [&quot;src-utyum-official-local-archive&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-parity-of-equal-pairs&quot;, &quot;title&quot;: &quot;Четность числа равных пар различает два случая&quot;, &quot;text&quot;: &quot;После удаления выбранной монеты оставшиеся 16 монет можно разбить на 8 пар. Четность числа пар с равными весами зависит от того, была ли выбранная монета настоящей.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-pair-all-other-coins&quot;, &quot;title&quot;: &quot;Разбить остальные монеты на пары&quot;, &quot;text&quot;: &quot;Разобьем 16 невыбранных монет на 8 произвольных пар и сравним монеты внутри каждой пары. Если выбранная монета настоящая, среди оставшихся 8 настоящих и 8 фальшивых; тогда число пар из двух настоящих равно числу пар из двух фальшивых, поэтому общее число равных пар четно. Если выбранная монета фальшивая, среди оставшихся 9 настоящих и 7 фальшивых; тогда пар из двух настоящих на одну больше, чем пар из двух фальшивых, поэтому число равных пар нечетно. По четности числа ответов \&quot;равны\&quot; определяется тип выбранной монеты.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;выбранная монета настоящая или фальшивая при известных количествах 9 и 8&quot;, &quot;observations&quot;: [&quot;8 бинарных результатов равны/не равны&quot;], &quot;allowed_actions&quot;: [&quot;сравнить две монеты прибором на равенство веса&quot;], &qu
