&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-role-equations&quot;, &quot;title&quot;: &quot;Свести ответы к равенствам ролей&quot;, &quot;text&quot;: &quot;Из слов Али следует, что Аля и Доминик имеют разные роли. Из ответов Бартека и Целины следует, что Бартек и Целина имеют одну роль. Из ответа Доминика следует, что Доминик и Эдек имеют одну роль, а из ответа Эдека - что Эдек и Бартек имеют разные роли. Если Бартек и Целина оба шпионы, то вместе с Алей получается уже три шпиона, что запрещено. Значит, Бартек и Целина говорят правду, а шпионы - Доминик и Эдек. Их номера дают сумму \\(8+16=24\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;truth_teller&quot;, &quot;liar&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;выбор двух шпионов из пяти отвечающих&quot;, &quot;observations&quot;: [&quot;пять публичных утверждений о том, кто является или не является шпионом&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость истинности утверждений с правилом: шпионы лгут, остальные говорят правду&quot;], &quot;goal&quot;: [&quot;identify_sum_of_spy_numbers&quot;, &quot;identify_spies&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;truth_liar_constraints&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;omj_seminar&quot;, &quot;spies&quot;, &quot;truth_liar&quot;, &quot;role_constraints&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 10, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;ровно два участника являются систематическими лжецами&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_spies_from_public_statements&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Небольшая система ролей; ключевой шаг - заменить каждую реплику отношением одинаковости или противоположности.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-omj-seminar-casework-czyzewska&quot;, &quot;role&quot;: &quot;official_training_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Задача взята из официального семинара OMJ \&quot;O rozważaniu przypadków\&quot;; публичный текст дан русским пересказом.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-66431-knights-liars-tricksters-table&quot;, &quot;title&quot;: &quot;problems.ru 66431: рыцари, лжецы и хитрецы за круглым столом&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Две фразы соседям слева и справа&quot;, &quot;text&quot;: &quot;За круглым столом сидят 100 представителей трех племен: рыцари всегда говорят правду, лжецы всегда лгут, хитрецы могут говорить как правду, так и ложь. Каждый произнес две фразы: слева от него сидит лжец; справа от него сидит хитрец. Известно, что половина присутствующих - хитрецы. Нужно найти число рыцарей и число лжецов.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-66431&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;generalized&quot;: [{&quot;id&quot;: &quot;stmt-general-n-t-tricksters&quot;, &quot;title&quot;: &quot;n мест и t хитрецов&quot;, &quot;text&quot;: &quot;Тот же аргумент не использует число 100, кроме итогового подсчета: если за круглым столом \\(n\\) людей и известно, что хитрецов \\(t\\), то все не-хитрецы разбиваются на пары «лжец справа от рыцаря». Поэтому при четном \\(n-t\\) рыцарей и лжецов по \\((n-t)/2\\).&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-66431&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-local-pairing&quot;, &quot;title&quot;: &quot;Локальные высказывания образуют пары лжец-рыцарь&quot;, &quot;text&quot;: &quot;Правдивость двух соседних утверждений запрещает лжецу иметь справа лжеца или хитреца; справа от каждого лжеца должен стоять рыцарь, а слева от каждого рыцаря - лжец.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-pair-liars-and-knights&quot;, &quot;title&quot;: &quot;Спарить всех не-хитрецов&quot;, &quot;text&quot;: &quot;Если человек рыцарь, его первая фраза истинна, значит слева от него сидит лжец. Если человек лжец, его вторая фраза ложна, поэтому справа от него не хитрец; справа от него также не может сидеть лжец, иначе тот правдиво сказал бы, что слева лжец. Значит справа от каждого лжеца сидит рыцарь. Получается взаимное соответствие между лжецами и рыцарями среди 50 не-хитрецов, поэтому тех и других по 25.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &qu а 100 и 50 заменяются параметрами n и t; решение сохраняется как взаимное спаривание рыцарей и лжецов.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-66436-sixty-knights-next-five&quot;, &quot;title&quot;: &quot;problems.ru 66436: 60 рыцарей и лжецов, фраза о пяти справа&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Хотя бы двое лжецов среди пяти справа&quot;, &quot;text&quot;: &quot;За круглым столом сидят 60 человек, каждый из них рыцарь или лжец. Каждый сказал: среди пяти человек подряд справа от меня хотя бы двое лжецы. Нужно определить, сколько рыцарей может сидеть за столом.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-66436&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;generalized&quot;: [{&quot;id&quot;: &quot;stmt-general-6m-cycle&quot;, &quot;title&quot;: &quot;Цикл длины 6m&quot;, &quot;text&quot;: &quot;Та же блоковая логика работает для любого круга из \\(6m\\) людей с той же фразой про пять следующих справа: каждый блок из шести подряд содержит ровно двух лжецов, значит всего лжецов \\(2m\\), а рыцарей \\(4m\\).&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-66436&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-blocks-of-six&quot;, &quot;title&quot;: &quot;Любые шесть подряд содержат ровно двух лжецов&quot;, &quot;text&quot;: &quot;Высказывание первого человека в блоке из шести ограничивает число лжецов среди следующих пяти; проверка первого лжеца или рыцаря в блоке дает точное значение.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-ten-blocks&quot;, &quot;title&quot;: &quot;Разбить круг на десять блоков по шесть&quot;, &quot;text&quot;: &quot;Разобьем 60 мест на 10 последовательных блоков по 6. Рассмотрим первый человек в блоке. Если он рыцарь, среди следующих пяти есть хотя бы два лжеца. Их не может быть больше двух: тогда первый лжец среди этих пяти сказал бы истинную фразу. Значит в блоке ровно два лжеца. Если первый человек лжец, то среди следующих пяти не более одного лжеца; хотя бы один там должен быть, иначе первый рыцарь среди следующих пяти сказал бы ложь. С учетом первого человека в блоке снова ровно два лжеца. Поэтому в каждом блоке 4 рыцаря, всего 40.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;расположение рыцарей и лжецов на цикле из 60 мест&quot;, &quot;observations&quot;: [&quot;одинаковая публичная фраза каждого участника о пяти соседях справа&quot;], &quot;allowed_actions&quot;: [&quot;анализировать локальные блоки из шести мест&quot;], &quot;goal&quot;: [&quot;count_truth_tellers&quot;], &quot;strategy_type&quot;: [&quot;structural_counting&quot;, &quot;local_constraint_propagation&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;problems_ru_66436&quot;, &quot;knights_liars&quot;, &quot;block_of_six&quot;, &quot;6m_cycle&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 60, &quot;lies_allowed&quot;: &quot;liars always lie&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_number_of_knights&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Короткая задача на локальные ограничения правды и лжи.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;structural_constraint&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-66436&quot;, &quot;role&quot;: &quot;web_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;problems_ru_batch&quot;, &quot;generalization_status&quot;: &quot;same_solution_parameterized&quot;, &quot;notes&quot;: [&quot;Источник: Окружная олимпиада (Москва), 2017, задача 6.5.&quot;, &quot;2026-05-18: число 60 классифицировано как 10 блоков по 6; естественное обобщение на 6m сохраняет тот же подсчет.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-66705-distance-to-nearest-liar&quot;, &quot;title&quot;: &quot;problems.ru 66705: расстояние до ближайшего лжеца за два вопроса&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Десять человек в вершинах правильного десятиугольника&quot;, &quot;text&quot;: &quot;В стране рыцарей и лжецов за круглым столом в вершинах правильного десятиугольника сидят 10 человек, среди них есть лжецы. Путешественник может выбрать точку вне стола и спросить всех: каково расстояние от меня до ближайшего лжеца среди вас? Все точно измеряют расстояния; рыцари отвечают правду, лжецы лгут. Нужно найти минимальное число вопросов, достаточное, чтобы гарантированно определить всех лжецов.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-66705&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;generalized&quot;: [{&quot;id&quot;: &quot;stmt-general-regular-n-gon&quot;, &quot;title&quot;: &quot;Правильный n-угольник&quot;, &quot;text&quot;: &quot;Та же двухвопросная калибровка переносится на правильный \\(n\\)-угольник: после первого вопроса либо все ответы одинаковы, либо разные ответы дают пару, среди которой есть лжец; вторую точку выбирают рядом с этой парой так, чтобы ближайшие вершины были именно они. Тогда истинное расстояние до ближайшего лжеца известно и все ответы классифицируются.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-66705&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-one-known-liar-distance-calibrates&quot;, &quot;title&quot;: &quot;Известное расстояние до лжеца калибрует второй вопрос&quot;, &quot;text&quot;: &quot;Если найдена пара соседей с разными ответами, хотя бы один из них лжец. Точка, равноудаленная от этой пары, задает известное расстояние до ближайшего лжеца; дальше правдивые ответы совпадают с этим расстоянием.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-questions&quot;, &quot;title&quot;: &quot;Первый вопрос ищет различающихся соседей, второй классифицирует всех&quot;, &quot;text&quot;: &quot;Зададим первый вопрос из произвольной разрешенной точки. Если все ответы одинаковы, то все сидящие лжецы: рыцарь и лжец не могли бы дать один и тот же ответ на вопрос с фиксированным истинным расстоянием. Иначе найдутся соседи, ответившие по-разному. Встанем в середину дуги между ними и зададим тот же вопрос. Среди этих двух соседей есть лжец, поэтому истинное расстояние до ближайшего лжеца теперь известно. Все, кто называют это расстояние, рыцари; остальные лжецы.\n\nОдного вопроса недостаточно: если точка вопроса разбивает вершины на несколько классов равных расстояний, можно построить две разные расстановки типов, дающие одинаковую картину ответов.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-one-question-not-enough&quot;, &quot;title&quot;: &quot;Один вопрос не гарантирует различение&quot;, &quot;text&quot;: &quot;При одном вопросе люди разбиваются на группы одинакового расстояния до путешественника. Для подходящих ответов можно согласовать как вариант, где ближайшая группа состоит из рыцарей, так и вариант, где она состоит из лжецов, сохранив те же наблюдаемые ответы. Значит одного вопроса недостаточно.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;indistinguishability&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;непустое множество лжецов среди 10 вершин десятиугольника&quot;, &quot;observations&quot;: [&quot;числовые ответы всех участников на один и тот же геометрический вопрос&quot;], &quot;allowed_actions&quot;: [&quot;выбирать точку вопроса вне стола и получать ответы всех участников&quot;], &quot;goal&quot;: [&quot;identify_all_liars&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;calibration_question&quot;], &quot;lower_bound_method&quot;: [&quot;indistinguishability&quot;], &quot;keywords&quot;: [&quot;problems_ru_66705&quot;, &quot;distance_to_liar&quot;, &quot;two_questions&quot;, &quot;regular_n_gon&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 10, &quot;question_count&quot;: 2, &quot;lies_allowed&quot;: &quot;liars always give a false distance&quot;, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_all_liars&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Турнир городов: есть и стратегия, и оценка невозможности одного вопроса.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;decision_tree&quot;, &quot;indistinguishability_argument&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-66705&quot;, &quot;role&quot;: &quot;web_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;problems_ru_batch&quot;, &quot;generalization_status&quot;: &quot;same_solution_parameterized_with_geometric_condition&quot;, &quot;notes&quot;: [&quot;Источник: Турнир городов 2017/18, весенний тур, сложный вариант 8-9 классы, задача 6.&quot;, &quot;2026-05-18: число 10 несущественно для калибровочного приема, если сохраняется геометрическое условие правильного n-угольника и возможность выбрать точку с заданной ближайшей соседней парой.&quot;]}}, {&quot;id&quot;: &quot;samf-training-triplets-one-liar-age&quot;, &quot;title&quot;: &quot;SAMF/SAMO training: три одинаковых брата и один лжец&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_training_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-samf-triplets-liar-age&quot;, &quot;title&quot;: &quot;Кто из двух встреченных братьев лжец&quot;, &quot;text&quot;: &quot;Джек, Джон и Джеймс - одинаковые с виду тройняшки. Джека и Джона невозможно отличить по внешности, и они всегда говорят правду; Джеймс всегда лжет. Известно, что всем троим от 20 до 30 лет включительно. Однажды вы встретили двух из них и спросили, сколько им лет. Один сказал: «Нам от 20 до 29 лет включительно». Другой сказал две фразы: «Нам от 21 до 30 лет включительно» и «Один из нас двоих лжет». Определите, кто из двух встреченных братьев лжец, и найдите их возраст.&quot;, &quot;source_ids&quot;: [&quot;src-samf-training-manual-2014-scribd&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-liar-cannot-truthfully-say-one-lies&quot;, &quot;title&quot;: &quot;Лжец не может правдиво объявить, что среди двоих есть лжец&quot;, &quot;text&quot;: &quot;Если второй брат был бы Джеймсом-лжецом, его фраза «один из нас двоих лжет» оказалась бы истинной: ведь он сам лжец, а другой брат говорит правду. Это невозможно для систематического лжеца.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-normalize-two-speakers&quot;, &quot;title&quot;: &quot;Сначала определить тип второго говорящего, затем возраст&quot;, &quot;text&quot;: &quot;Предположим, что второй говорящий - лжец. Тогда его утверждение «один из нас двоих лжет» истинно, что противоречит условию. Значит, второй говорящий говорит правду, а лжец - первый. Из истинности фразы второго следует, что возраст находится между 21 и 30 включительно. Из ложности фразы первого следует, что неверно, будто возраст между 20 и 29 включительно. Единственный совместимый возраст - 30 лет.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какие двое из трех братьев встречены и их общий возраст от 20 до 30&quot;, &quot;observations&quot;: [&quot;три публичных утверждения двух неразличимых внешне говорящих&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость типов говорящих с истинностью их фраз&quot;], &quot;goal&quot;: [&quot;identify_liar&quot;, &quot;determine_age&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;truth_liar_consistency&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;samo_training&quot;, &quot;triplets&quot;, &quot;truth&quot;, &quot;lie&quot;, &quot;liar&quot;, &quot;age&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 1, &quot;lies_allowed&quot;: &quot;один из трех братьев является систематическим лжецом&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_liar_and_age&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Ключевой шаг - заметить самозапрет фразы лжеца о наличии лжеца среди двух.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;self_reference_truth&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-samf-training-manual-2014-scribd&quot;, &quot;role&quot;: &quot;training_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;south_africa_batch&quot;, &quot;notes&quot;: [&quot;Источник - доступная веб-копия учебного пособия SAMF; официальная страница покупки SAMF подтверждает издание, но открытого PDF на сайте SAMF не найдено.&quot;]}}, {&quot;id&quot;: &quot;sasmo-2019-g5-q14-one-liar-tallest&quot;, &quot;title&quot;: &quot;SASMO 2019 G5 Q14: один лжец и самый высокий&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;truth_liar_reasoning&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-sasmo-2019-g5-q14&quot;, &quot;title&quot;: &quot;Четыре утверждения о самом высоком и самом низком&quot;, &quot;text&quot;: &quot;Четверо друзей сделали заявления. Киран сказал: «Я не самый низкий». Франклин сказал: «Я не самый высокий и не самый низкий». Мэйбл сказала: «Я самая низкая». Джефф сказал: «Я самый высокий». Известно, что ровно один из них солгал. Кто самый высокий?&quot;, &quot;source_ids&quot;: [&quot;src-simcc-sasmo-2019-2020-g5-book&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-single-liar-extreme-roles&quot;, &quot;title&quot;: &quot;Кандидат на лжеца проверяется через крайние роли&quot;, &quot;text&quot;: &quot;Если назначить ложь каждому участнику по очереди, истинные фразы остальных либо оставляют возможного самого высокого, либо приводят к противоречию с существованием самого высокого или самого низкого.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-test-four-liar-candidates&quot;, &quot;title&quot;: &quot;Перебрать, кто мог быть единственным лжецом&quot;, &quot;text&quot;: &quot;Если солгал Киран, то он был бы самым низким, но фраза Мэйбл «я самая низкая» тогда тоже была бы истинной только для Мэйбл; два разных человека не могут быть единственными самыми низкими, значит Киран не лгал. Если солгал Франклин, то истинные фразы Мэйбл и Джеффа уже задают самого низкого и самого высокого, а Франклин действительно не крайний, поэтому его фраза не была бы ложной.\n\nЕсли солгала Мэйбл, то истинные фразы Кирана и Франклина вместе с ложностью фразы Мэйбл не оставляют согласованного единственного самого низкого. Значит, Мэйбл тоже не лгала. Остается Джефф: его фраза «я самый высокий» ложна, а истинные фразы Мэйбл и Франклина исключают их из роли самого высокого; Киран не самый низкий и может быть самым высоким. Следовательно, самый высокий - Киран.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;порядок роста четырех друзей и то, чье заявление ложно&quot;, &quot;observations&quot;: [&quot;четыре публичных утверждения о крайних местах роста&quot;, &quot;ровно одно утверждение ложно&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость кандидата на роль лжеца с уникальными крайними ролями&quot;], &quot;goal&quot;: [&quot;identify_tallest_person&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;sasmo_2019&quot;, &quot;single_liar&quot;, &quot;tallest_shortest&quot;, &quot;truth_statements&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;ровно одно из четырех заявлений ложно&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_tallest_person&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Короткая проверка четырех кандидатов на роль единственного лжеца.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-simcc-sasmo-2019-2020-g5-book&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;singapore_deep&quot;, &quot;notes&quot;: [&quot;Англоязычное условие и решение из официального SIMCC/SASMO practice book пересказаны по-русски.&quot;, &quot;Добавлено после дубль-чека: это не дубль SASMO G6 marathon, но использует тот же прием единственного лжеца на другой модели крайних ролей.&quot;]}}, {&quot;id&quot;: &quot;sasmo-2019-g6-q13-marathon-truth-slowest&quot;, &quot;title&quot;: &quot;SASMO 2019 G6 Q13: три правды о марафоне&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-sasmo-2019-g6-q13&quot;, &quot;title&quot;: &quot;Кто самый медленный&quot;, &quot;text&quot;: &quot;Четыре спортсмена пробежали марафон и сделали заявления. Том сказал, что он самый быстрый. Джек сказал, что он самый медленный. Лайонел сказал, что он не самый медленный и не самый быстрый. Роберт сказал, что он не самый быстрый. Известно, что ровно трое сказали правду. Кто был самым медленным?&quot;, &quot;source_ids&quot;: [&quot;src-simcc-sasmo-2019-2020-g6-book&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-one-lie-forces-slowest&quot;, &quot;title&quot;: &quot;Единственная ложь проверяется по противоречию ролей&quot;, &quot;text&quot;: &quot;Так как лжет ровно один спортсмен, можно по очереди назначить ложь каждому заявлению и проверить, остается ли возможным уникальное распределение мест.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-test-the-single-liar&quot;, &quot;title&quot;: &quot;Проверить, кто мог быть единственным лжецом&quot;, &quot;text&quot;: &quot;Если лжет Том, то остальные трое говорят правду: Джек самый медленный, Лайонел не крайний, Роберт не самый быстрый. Тогда никто не может быть самым быстрым, противоречие. Если лжет Джек, то Том самый быстрый, Лайонел не крайний, Роберт не самый быстрый, а сам Джек не самый медленный; значит самым медленным остается Роберт. Аналогичная проверка показывает, что ложь Лайонела или Роберта невозможна. Следовательно, самый медленный - Роберт.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;порядок четырех спортсменов от самого быстрого до самого медленного и то, кто произнес ложное заявление&quot;, &quot;observations&quot;: [&quot;четыре публичных заявления о крайних местах&quot;, &quot;ровно три заявления истинны&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость вариантов с условием о единственной лжи&quot;], &quot;goal&quot;: [&quot;identify_slowest_runner&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;sasmo_2019&quot;, &quot;truth_statements&quot;, &quot;single_liar&quot;, &quot;fastest_slowest&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;ровно одно из четырех заявлений ложно&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_slowest_runner&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Короткая проверка четырех кандидатов на роль единственного лжеца.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-simcc-sasmo-2019-2020-g6-book&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;singapore_batch&quot;, &quot;notes&quot;: [&quot;Англоязычное условие и решение из официального SIMCC/SASMO practice book пересказаны по-русски.&quot;]}}, {&quot;id&quot;: &quot;sasmo-2019-g8-q14-gift-box-truth-liars&quot;, &quot;title&quot;: &quot;SASMO 2019 G8 Q14: подарок и соседи-лжецы&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;truth_liar_reasoning&quot;, &quot;structural_constraint&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-sasmo-2019-g8-q14&quot;, &quot;title&quot;: &quot;Шесть ответов вокруг стола&quot;, &quot;text&quot;: &quot;Лидер спросил шестерых сидящих за круглым столом последователей, что находится в подарочной коробке. Два правдивца сидят рядом друг с другом. Два лжеца тоже сидят рядом друг с другом. Оставшиеся двое каждый могут быть правдивцем или лжецом, но они не сидят рядом. По кругу были даны ответы: «ноутбук», «кошелек», «камера», «часы», «камера», «ноутбук» (в порядке обхода стола). Что находится в коробке: камера, ноутбук, кошелек, часы или данных недостаточно?&quot;, &quot;source_ids&quot;: [&quot;src-simcc-sasmo-2019-2020-g8-book&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-adjacent-blocks-filter-answer&quot;, &quot;title&quot;: &quot;Соседние пары ограничивают возможные истинные ответы&quot;, &quot;text&quot;: &quot;Все правдивцы называют один и тот же предмет, поэтому кандидатом на содержимое коробки может быть только ответ, который встречается в допустимых местах для соседнего блока правдивцев.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-adjacent-truth-cases&quot;, &quot;title&quot;: &quot;Разобрать два возможных соседних блока правдивцев&quot;, &quot;text&quot;: &quot;Условие о двух соседних правдивцах и двух соседних лжецах оставляет две существенные схемы расположения типов вокруг стола. В первой схеме правдивцами были бы участники, отвечающие «камера», но тогда лжецы с ответами «ноутбук» и «кошелек» сидят рядом, а две оставшиеся роли также оказываются соседними, что запрещено условием. Значит, эта схема невозможна. Во второй допустимой схеме единственный общий истинный ответ - «часы». Следовательно, в коробке часы.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;содержимое коробки и тип каждого из шести участников: правдивец или лжец&quot;, &quot;observations&quot;: [&quot;шесть публичных ответов по кругу&quot;, &quot;существует соседняя пара правдивцев&quot;, &quot;существует соседняя пара лжецов&quot;, &quot;двое остальных не сидят рядом&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость круговых расположений типов с ответами&quot;], &quot;goal&quot;: [&quot;identify_hidden_object&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;structural_constraint&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;sasmo_2019&quot;, &quot;truth_tellers&quot;, &quot;liars&quot;, &quot;round_table&quot;, &quot;gift_box&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;каждый участник либо всегда говорит правду, либо лжет в своем ответе о содержимом коробки&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_gift_box_content&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Нужно совместить истинность ответов с круговым ограничением на соседние пары.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-simcc-sasmo-2019-2020-g8-book&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;singapore_batch&quot;, &quot;notes&quot;: [&quot;Ответы из рисунка в PDF перенесены в текст карточки по кругу; условие и решение пересказаны по-русски.&quot;]}}, {&quot;id&quot;: &quot;sasmo-2019-g9-q12-number-clues-truth-tellers&quot;, &quot;title&quot;: &quot;SASMO 2019 G9 Q12: максимум правдивцев в числовых подсказках&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;truth_liar_reasoning&quot;, &quot;extremal_logic&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-sasmo-2019-g9-q12&quot;, &quot;title&quot;: &quot;Двенадцать разных чисел и два раунда фраз&quot;, &quot;text&quot;: &quot;Двенадцать человек получили двенадцать различных положительных целых чисел. В первом раунде первый сказал: «Мое число больше 1», второй: «Мое число больше 2», ..., двенадцатый: «Мое число больше 12». Во втором раунде те же люди в случайном порядке сказали фразы «Мое число меньше 1», «Мое число меньше 2», ..., «Мое число меньше 12». Каждый человек либо правдивец и всегда говорит правду, либо лжец и всегда лжет. Каково наибольшее возможное число правдивцев среди этих двенадцати человек?&quot;, &quot;source_ids&quot;: [&quot;src-simcc-sasmo-2019-2020-g9-book&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-second-round-small-thresholds-force-liars&quot;, &quot;title&quot;: &quot;Самые малые пороги во втором раунде вынуждают ложь&quot;, &quot;text&quot;: &quot;Так как все числа положительные, фразы «меньше 1» и «меньше 2» не могут обе принадлежать правдивцам с учетом первых утверждений; кроме того, двенадцатый не может быть правдивцем и затем сказать любую фразу вида «меньше k» при k &lt;= 12.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-upper-bound-and-construction-ten&quot;, &quot;title&quot;: &quot;Доказать верхнюю оценку и построить пример&quot;, &quot;text&quot;: &quot;Если двенадцатый человек правдивец, его число больше 12. Тогда во втором раунде он не мог бы истинно произнести ни одну из фраз «мое число меньше k» для k от 1 до 12. Значит, двенадцатый - лжец. Кроме того, фразы «мое число меньше 1» и «мое число меньше 2» не могут быть истинными для людей, чьи первые фразы совместимы с положительными различными числами, поэтому по крайней мере два человека лгут. Следовательно, правдивцев не больше 10.\n\nОценка достигается, например, если первые десять людей получили числа 2,3,...,11 соответственно, одиннадцатый получил 1, а двенадцатый получил 12. Тогда десять первых участников могут во втором раунде получить истинные фразы «мое число меньше 3», ..., «мое число меньше 12», а два лжеца получают ложные фразы «мое число меньше 1» и «мое число меньше 2». Поэтому максимум равен 10.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-at-least-two-liars&quot;, &quot;title&quot;: &quot;Правдивцев не может быть больше десяти&quot;, &quot;text&quot;: &quot;Двенадцатый не может быть правдивцем, потому что его первое истинное утверждение требовало бы числа больше 12, а во втором раунде нет подходящей истинной фразы «меньше k» с k &lt;= 12. Минимальные фразы второго раунда дополнительно вынуждают ложь, так что по крайней мере два участника лгут.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;назначение двенадцати различных положительных чисел участникам, их типы и распределение фраз второго раунда&quot;, &quot;observations&quot;: [&quot;первый раунд пороговых утверждений по номерам участников&quot;, &quot;второй раунд пороговых утверждений в случайном порядке&quot;, &quot;каждый участник стабильно правдивец или лжец&quot;], &quot;allowed_actions&quot;: [&quot;строить совместимое назначение чисел и доказывать невозможность большего числа правдивцев&quot;], &quot;goal&quot;: [&quot;maximize_truth_tellers&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;extremal_construction&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;sasmo_2019&quot;, &quot;truth_tellers&quot;, &quot;liars&quot;, &quot;threshold_statements&quot;, &quot;maximum_truth_tellers&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;каждый человек либо всегда правдив, либо всегда лжет в обоих раундах&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;maximize_number_of_truth_tellers&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Экстремальная логическая задача: нужна верхняя оценка и совместимый пример.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-simcc-sasmo-2019-2020-g9-book&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;singapore_batch&quot;, &quot;notes&quot;: [&quot;Англоязычное условие и решение из официального SIMCC/SASMO practice book пересказаны по-русски.&quot;]}}, {&quot;id&quot;: &quot;sasmo-2020-g4-q14-avengers-two-liars&quot;, &quot;title&quot;: &quot;SASMO 2020 G4 Q14: кто смотрел фильм, если двое солгали&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;truth_liar_reasoning&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-sasmo-2020-g4-q14&quot;, &quot;title&quot;: &quot;Три ответа о фильме&quot;, &quot;text&quot;: &quot;Среди Джорджа, Хелен и Айрин ровно один человек смотрел фильм «Avengers». Когда их спросили об этом, Джордж сказал: «Хелен смотрела его». Хелен сказала: «Я его не смотрела». Айрин сказала: «Я его не смотрела». Если двое из них солгали, кто смотрел фильм?&quot;, &quot;source_ids&quot;: [&quot;src-simcc-sasmo-2019-2020-g4-book&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-count-lies-by-hidden-watcher&quot;, &quot;title&quot;: &quot;Каждый кандидат задает число ложных ответов&quot;, &quot;text&quot;: &quot;Скрытое состояние - кто единственный смотрел фильм. Для каждого кандидата истинность трех фраз вычисляется напрямую, и подходит только тот случай, где ложных фраз ровно две.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-check-three-watchers&quot;, &quot;title&quot;: &quot;Проверить трех возможных зрителей&quot;, &quot;text&quot;: &quot;Если фильм смотрел Джордж, то фраза Джорджа о Хелен ложна, а Хелен и Айрин правдиво сказали, что не смотрели фильм; ложь только одна. Если фильм смотрела Хелен, то Джордж сказал правду, Хелен солгала, Айрин сказала правду; снова ложь только одна.\n\nЕсли фильм смотрела Айрин, то Джордж солгал, Хелен правдиво сказала, что не смотрела фильм, а Айрин солгала. В этом случае ровно две ложные фразы, как и требуется. Значит, фильм смотрела Айрин.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;один из трех людей смотрел фильм&quot;, &quot;observations&quot;: [&quot;три публичных утверждения о том, кто смотрел фильм&quot;, &quot;ровно два утверждения ложны&quot;], &quot;allowed_actions&quot;: [&quot;проверять число ложных фраз при каждом скрытом состоянии&quot;], &quot;goal&quot;: [&quot;identify_movie_watcher&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;sasmo_2020&quot;, &quot;two_liars&quot;, &quot;movie_watcher&quot;, &quot;truth_statements&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;ровно два из трех утверждений ложны&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_unique_watcher&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Минимальная truth/lie-задача: три скрытых состояния и счет ложных фраз.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-simcc-sasmo-2019-2020-g4-book&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;singapore_deep&quot;, &quot;notes&quot;: [&quot;Англоязычное условие и решение из официального SIMCC/SASMO practice book пересказаны по-русски.&quot;, &quot;Оставлена как чистая маленькая карточка по lie_detection; это не обычная logic-grid задача, а счет лжи в ограниченном наборе публичных ответов.&quot;]}}, {&quot;id&quot;: &quot;sms-medley-1997-governor-liars-min-days&quot;, &quot;title&quot;: &quot;SMS Mathematical Medley 1997: губернатор ищет лжецов группами&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;truth_liar_reasoning&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-sms-1997-governor-liars&quot;, &quot;title&quot;: &quot;Сколько дней нужно для классификации островитян&quot;, &quot;text&quot;: &quot;На острове каждый житель либо всегда говорит правду, либо всегда лжет. Новый губернатор хочет определить, кто лжец, а кто правдивец. Для этого каждый день он собирает некоторую группу жителей и спрашивает каждого из них, сколько лжецов в этой группе. Он записывает имена и ответы. Известно, что не все жители являются лжецами, и каждый житель знает, кто есть кто. Какое минимальное число дней нужно губернатору, чтобы гарантированно выполнить план?&quot;, &quot;source_ids&quot;: [&quot;src-sms-medley-1997-competition-corner&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-truthful-person-certifies-group-count&quot;, &quot;title&quot;: &quot;Один найденный правдивец превращает ответы в проверку группы&quot;, &quot;text&quot;: &quot;Так как известно, что хотя бы один правдивец существует, стратегия может сначала получить свидетеля-правдивца, а затем использовать его ответ о выбранной группе как истинное число лжецов в ней.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-stage-find-truthful-then-classify&quot;, &quot;title&quot;: &quot;Черновой план нельзя считать доказанной оптимальной стратегией&quot;, &quot;text&quot;: &quot;Карточка пока не содержит полного решения. Важно не использовать как доказательство идею \&quot;в первый день спросить всех и взять самое согласованное значение\&quot;: лжецы могут дать одинаковый ложный числовой ответ, поэтому частота ответов сама по себе не сертифицирует правдивца и не дает минимальное число дней.\n\nДля публикации нужно восстановить из надежного разбора две части: явную адаптивную стратегию групповых запросов и отдельную нижнюю оценку на число дней. До этого карточка остается lead-карточкой с needs_human_review.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-one-day-indistinguishable-patterns&quot;, &quot;title&quot;: &quot;Один общий день не отделяет все типы без дополнительной структуры&quot;, &quot;text&quot;: &quot;Если за один день спросить только одну выбранную группу, жители вне группы не дают наблюдений, а внутри группы совпадающие числовые ответы могут быть совместимы с несколькими распределениями типов. Поэтому минимальность требует отдельного доказательства для конкретной оптимальной стратегии.&quot;, &quot;standard_idea_ids&quot;: [&quot;indistinguishable_states&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;разбиение жителей острова на правдивцев и лжецов при условии, что правдивец существует&quot;, &quot;observations&quot;: [&quot;числовые ответы выбранных за день жителей о числе лжецов в выбранной группе&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно выбирать группу жителей для ежедневного опроса&quot;], &quot;goal&quot;: [&quot;classify_all_islanders_as_truthful_or_liar&quot;, &quot;minimize_days&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;truth_liar_normalization&quot;], &quot;lower_bound_method&quot;: [&quot;indistinguishability&quot;], &quot;keywords&quot;: [&quot;singapore_mathematical_society&quot;, &quot;mathematical_medley_1997&quot;, &quot;islanders&quot;, &quot;liars&quot;, &quot;group_queries&quot;, &quot;minimum_days&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: &quot;integer_count&quot;, &quot;question_count&quot;: &quot;minimum_days&quot;, &quot;lies_allowed&quot;: &quot;liars always give a false numerical answer, truth-tellers give the true count&quot;, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;classify_all_islanders&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_hard&quot;, &quot;local_score&quot;: 6, &quot;comment&quot;: &quot;Активная стратегия групповых запросов; условие официально найдено, но оптимальное решение требует ручной сверки.&quot;, &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;truth_liar_normalization&quot;, &quot;decision_tree&quot;, &quot;indistinguishability_argument&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-sms ит \&quot;да\&quot; ровно при истинном \\(P\\). В обоих случаях ответ \&quot;да\&quot; означает, что \\(P\\) истинно, а \&quot;нет\&quot; - что ложно.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;истинность P и тип собеседника&quot;, &quot;observations&quot;: [&quot;один ответ да/нет&quot;], &quot;allowed_actions&quot;: [&quot;задать один вложенный вопрос да/нет&quot;], &quot;goal&quot;: [&quot;determine_truth_of_statement&quot;], &quot;strategy_type&quot;: [&quot;lie_normalization&quot;, &quot;self_reference_question&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;truth_teller_liar&quot;, &quot;universal_question&quot;, &quot;double_negation&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 1, &quot;lies_allowed&quot;: &quot;respondent may be systematic liar&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;determine_truth_value&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Стандартный шаблон для задач с правдивым и лжецом.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;truth_liar_normalization&quot;, &quot;self_reference_question&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-truth-liar-questions&quot;, &quot;role&quot;: &quot;folklore_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}, {&quot;source_id&quot;: &quot;src-problems-ru-89935&quot;, &quot;role&quot;: &quot;web_statement_and_solution_variant&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot t;: 0, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_one_of_N_states&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Базовая модель дерева решений.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;binary_search&quot;, &quot;decision_tree&quot;, &quot;decision_tree_lower_bound&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-folklore&quot;, &quot;role&quot;: &quot;folklore_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;seed_links&quot;, &quot;generalization_status&quot;: &quot;already_parameterized_same_solution&quot;, &quot;notes&quot;: [&quot;2026-05-18: карточка уже записана в параметрах N и q; конкретное число вопросов определяется емкостью 2^q.&quot;]}}, {&quot;id&quot;: &quot;two-doors-two-guards-one-question&quot;, &quot;title&quot;: &quot;Две двери, два стража и один вопрос&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Один всегда лжет, другой всегда говорит правду&quot;, &quot;text&quot;: &quot;Перед вами две двери: за одной спасение, за другой опасность. Рядом два стража: один всегда говорит правду, другой всегда лжет, но неизвестно, кто есть кто. Можно задать один вопрос одному стражу, на который он ответит \&quot;да\&quot; или \&quot;нет\&quot;. Как выбрать безопасную дверь?&quot;, &quot;source_ids&quot;: [&quot;src-truth-liar-questions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-ask-about-other-answer&quot;, &quot;title&quot;: &quot;Вложенный вопрос делает правду и ложь одинаковыми&quot;, &quot;text&quot;: &quot;Если спросить, что сказал бы другой страж, правдивый передает ложный ответ, а лжец искажает правдивый ответ. В обоих случаях получается отрицание истины.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-other-guard-question&quot;, &quot;title&quot;: &quot;Спросить, какую дверь указал бы другой&quot;, &quot;text&quot;: &quot;Выберем любую из двух дверей, например левую, и спросим любого стража: \&quot;Если бы я спросил другого стража, ведет ли левая дверь к спасению, он ответил бы да?\&quot;\n\nРазберем два случая. Если отвечающий правдивый, он честно сообщает ответ другого стража. Другой страж лжец, поэтому на прямой вопрос о безопасной левой двери он ответил бы противоположно истине. Значит, полученный ответ противоположен истинному ответу о левой двери. Если отвечающий лжец, то другой страж правдивый и на прямой вопрос ответил бы истину; но лжец искажает это сообщение, поэтому мы снова слышим противоположность истины.\n\nСледовательно, ответ \&quot;да\&quot; означает, что левая дверь не ведет к спасению, и надо выбрать правую. Ответ \&quot;нет\&quot; означает, что левая дверь безопасна.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какая дверь безопасна и какой страж правдив&quot;, &quot;observations&quot;: [&quot;один ответ да/нет от выбранного стража&quot;], &quot;allowed_a KMT IMC 2013 Q23: два правдивых брата&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-ukmt-imc-2013-q23&quot;, &quot;title&quot;: &quot;Кто из братьев говорит правду&quot;, &quot;text&quot;: &quot;Четыре брата обсуждают порядок своего рождения. Двое из них лгут, а двое говорят правду. Альфред говорит: «Бернард самый младший». Горацио говорит: «Бернард самый старший, а я самый младший». Иниго говорит: «Я родился последним». Бернард говорит: «Я не самый младший и не самый старший». Какие двое говорят правду?&quot;, &quot;source_ids&quot;: [&quot;src-ukmt-imc-2013-sol-extended&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-contradiction-graph-excludes-speaker&quot;, &quot;title&quot;: &quot;Противоречия показывают, кто не может входить в пару правдивых&quot;, &quot;text&quot;: &quot;Если реплика одного участника противоречит слишком многим другим репликам, то при заданном числе правдивых он не может быть одним из правдивых. Здесь Горацио противоречит каждому из остальных, а Альфред противоречит двум оставшимся кандидатам.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-eliminate-alfred-and-horatio&quot;, &quot;title&quot;: &quot;Исключить Горацио и Альфреда&quot;, &quot;text&quot;: &quot;Реплика Горацио противоречит словам Альфреда, Иниго и Бернарда: если Бернард самый старший, он не самый младший; если Горацио самый младший, Иниго не родился последним; если Бернард самый старший, Бернардова фраза ложна. Поэтому Горацио не может быть одним из двух правдивых. Реплика Альфреда противоречит и Иниго, и Бернарду, значит Альфред тоже не может входить в пару правдивых. Остаются Бернард и Иниго; такая ситуация возможна, например если порядок от старшего к младшему: Альфред, Бернард, Горацио, Иниго.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;порядок рождения четырех братьев и истинность четырех высказываний&quot;, &quot;observations&quot;: [&quot;четыре публичных высказывания и условие, что ровно два из них истинны&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость высказываний с порядком рождения&quot;], &quot;goal&quot;: [&quot;identify_truth_tellers&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;consistency_check&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;ukmt_imc_2013&quot;, &quot;truth_tellers&quot;, &quot;liars&quot;, &quot;birth_order&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;ровно два высказывания ложны&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_two_truth_tellers&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Короткая задача на совместимость истинности с относительным порядком.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-ukmt-imc-2013-sol-extended&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;ukmt_deep&quot;, &quot;notes&quot;: [&quot;Условие и решение взяты из официальных расширенных решений UKMT IMC 2013, вопрос 23; публичный текст дан русским пересказом.&quot;]}}, {&quot;id&quot;: &quot;ukmt-imc-2019-q14-truth-tellers-count&quot;, &quot;title&quot;: &quot;UKMT IMC 2019 Q14: сколько правдивцев среди четырех&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-ukmt-imc-2019-q14&quot;, &quot;title&quot;: &quot;Четыре утверждения о числе правдивцев&quot;, &quot;text&quot;: &quot;Есть четыре человека. Некоторые из них всегда говорят правду, остальные всегда лгут. Первый сказал: «Нечетное число из нас всегда говорит правду». Второй сказал: «Четное число из нас всегда говорит правду». Третий сказал: «Простое число из нас всегда говорит правду». Четвертый сказал: «Квадратное число из нас всегда говорит правду». Сколько из этих четырех человек говорили правду?&quot;, &quot;source_ids&quot;: [&quot;src-ukmt-imc-2019-sol-extended&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-count-must-match-predicates&quot;, &quot;title&quot;: &quot;Число правдивцев должно само выбирать истинные предикаты&quot;, &quot;text&quot;: &quot;Для каждого возможного числа правдивцев можно проверить четыре свойства этого числа: нечетность, четность, простоту и квадратность. Согласованным будет только такое число, при котором количество истинных свойств равно самому числу правдивцев.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-eliminate-one-and-confirm-two&quot;, &quot;title&quot;: &quot;Исключить один и проверить два&quot;, &quot;text&quot;: &quot;Из первых двух фраз ровно одна истинна. Из фраз про простое и квадратное число одновременно истинной может быть не более одной. Значит, правдивцев один или два. Если правдивец только один, то число 1 нечетно и является квадратом, поэтому истинны первая и четвертая фразы, то есть правдивцев уже два; противоречие. При числе 2 истинны ровно вторая и третья фразы: 2 четно и просто, но не нечетно и не квадрат. Поэтому правдивцев ровно два.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какие из четырех людей являются правдивцами&quot;, &quot;observations&quot;: [&quot;четыре публичных утверждения о количестве правдивцев&quot;], &quot;allowed_actions&quot;: [&quot;сопоставлять предполагаемое число правдивцев с истинностью высказанных свойств&quot;], &quot;goal&quot;: [&quot;identify_number_of_truth_tellers&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;fixed_point_consistency&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;ukmt_imc_2019&quot;, &quot;truth_tellers&quot;, &quot;liars&quot;, &quot;self_count&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;каждый участник либо всегда правдив, либо всегда лжет&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_number_of_truth_tellers&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Небольшая самосогласованная задача на число истинных утверждений.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;truth_liar_normalization&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-ukmt-imc-2019-sol-extended&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;ukmt_batch&quot;, &quot;notes&quot;: [&quot;Условие и решение взяты из расширенных решений UKMT IMC 2019, вопрос 14; карточка содержит русский пересказ.&quot;]}}, {&quot;id&quot;: &quot;ukmt-jmc-2015-q17-knaves-truth-chain&quot;, &quot;title&quot;: &quot;UKMT JMC 2015 Q17: цепочка высказываний валетов&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-ukmt-jmc-2015-q17&quot;, &quot;title&quot;: &quot;Сколько валетов сказали правду&quot;, &quot;text&quot;: &quot;Валет червей сказал: «Я украл пироги». Валет треф сказал: «Валет червей лжет». Валет бубен сказал: «Валет треф лжет». Валет пик сказал: «Валет бубен лжет». Сколько из четырех валетов сказали правду?&quot;, &quot;source_ids&quot;: [&quot;src-ukmt-jmc-2015-sol-extended&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-chain-flips-truth-value&quot;, &quot;title&quot;: &quot;Каждая следующая реплика меняет истинность предыдущей&quot;, &quot;text&quot;: &quot;После выбора истинности первой фразы вся цепочка уже вынуждена: утверждение «предыдущий лжет» имеет противоположное значение к предыдущему высказыванию.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-cases-for-first-knave&quot;, &quot;title&quot;: &quot;Разобрать два случая для первой фразы&quot;, &quot;text&quot;: &quot;Если валет червей действительно украл пироги, его фраза истинна; тогда валет треф лжет, валет бубен говорит правду, а валет пик лжет. Если валет червей не украл пироги, первая фраза ложна; тогда валет треф говорит правду, валет бубен лжет, а валет пик говорит правду. В обоих случаях истинны ровно две фразы, хотя сам факт кражи не определяется.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;украл ли валет червей пироги&quot;, &quot;observations&quot;: [&quot;четыре публичные фразы, образующие цепочку отрицаний&quot;], &quot;allowed_actions&quot;: [&quot;логически проверять совместимость двух возможных состояний&quot;], &quot;goal&quot;: [&quot;identify_number_of_true_statements&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;structural_constraint&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;ukmt_jmc_2015&quot;, &quot;knaves&quot;, &quot;truth_chain&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;истинность фраз определяется скрытым фактом и ссылками на предыдущие фразы&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_number_of_true_statements&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Короткая цепочка отрицаний с двумя возможными начальными состояниями.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-ukmt-jmc-2015-sol-extended&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;ukmt_batch&quot;, &quot;notes&quot;: [&quot;Условие и решение взяты из расширенных решений UKMT JMC 2015, вопрос 17; текст карточки дан русским пересказом.&quot;]}}, {&quot;id&quot;: &quot;ukmt-smc-2015-q13-knave-days&quot;, &quot;title&quot;: &quot;UKMT SMC 2015 Q13: валеты и дни правды&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-ukmt-smc-2015-q13&quot;, &quot;title&quot;: &quot;В какой день оба сказали о вчерашней лжи&quot;, &quot;text&quot;: &quot;Валет червей говорит только правду в понедельник, вторник, среду и четверг, а во все остальные дни только лжет. Валет бубен говорит только правду в пятницу, субботу, воскресенье и понедельник, а во все остальные дни только лжет. В один день на прошлой неделе они оба сказали: «Вчера я лгал». В какой день недели это было?&quot;, &quot;source_ids&quot;: [&quot;src-ukmt-smc-2015-sol-extended&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-statement-true-exactly-at-boundary&quot;, &quot;title&quot;: &quot;Фраза возможна только на границе между правдой и ложью&quot;, &quot;text&quot;: &quot;Фраза «вчера я лгал» согласована либо когда сегодня день правды и вчера был день лжи, либо когда сегодня день лжи и вчера был день правды. Поэтому для каждого валета подходят только дни перехода между режимами.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-intersect-boundary-days&quot;, &quot;title&quot;: &quot;Найти пересечение подходящих дней&quot;, &quot;text&quot;: &quot;У валета червей переходы между правдой и ложью дают понедельник и пятницу: в понедельник он правдиво говорит о воскресной лжи, а в пятницу лживо говорит о четверговой правде. У валета бубен по той же причине подходят пятница и вторник. Общий день только один: пятница.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;день недели, в который были произнесены одинаковые фразы&quot;, &quot;observations&quot;: [&quot;для каждого валета известен календарь правдивости и одна произнесенная фраза&quot;], &quot;allowed_actions&quot;: [&quot;проверять дни недели на согласованность с режимом правды или лжи&quot;], &quot;goal&quot;: [&quot;identify_day&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;intersection_of_constraints&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;ukmt_smc_2015&quot;, &quot;knave_days&quot;, &quot;truth_schedule&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;каждый валет в заданные дни всегда правдив, в остальные дни всегда лжет&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_day&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Нужно увидеть, что информативны только границы календарных режимов.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-ukmt-smc-2015-sol-extended&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;ukmt_batch&quot;, &quot;notes&quot;: [&quot;Условие и решение взяты из расширенных решений UKMT SMC 2015, вопрос 13; карточка содержит русский пересказ.&quot;]}}, {&quot;id&quot;: &quot;ukmt-smc-2016-investigation-22-1-four-friends-truth&quot;, &quot;title&quot;: &quot;UKMT SMC 2016 Investigation 22.1: Сэм лжет, но пара правдивых не определяется&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;extension_problem&quot;, &quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-ukmt-smc-2016-investigation-22-1&quot;, &quot;title&quot;: &quot;Что можно вывести о четырех друзьях&quot;, &quot;text&quot;: &quot;Четыре друга делают заявления. Бен говорит: «Ровно один из Кэма, Дэна и Сэма говорит правду». Дэн говорит: «Ровно один из Бена, Кэма и Сэма говорит правду». Кэм говорит: «Ровно один из Бена, Дэна и Сэма говорит правду». Сэм говорит: «Ни Бен, ни Дэн, ни Кэм не говорят правду». Что можно вывести о том, кто говорит правду, а кто лжет?&quot;, &quot;source_ids&quot;: [&quot;src-ukmt-smc-2016-sol-extended&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-extension-has-family-of-models&quot;, &quot;title&quot;: &quot;Решение может определить только общий вид всех моделей&quot;, &quot;text&quot;: &quot;В отличие от трех друзей, здесь не определяется единственная пара правдивых. Условие вынуждает Сэма лгать и оставляет три симметричных варианта: среди Бена, Дэна и Кэма правдивы ровно двое.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-sam-false-two-of-three&quot;, &quot;title&quot;: &quot;Показать, что Сэм лжет, а из остальных правдивы двое&quot;, &quot;text&quot;: &quot;Если Сэм говорил бы правду, то Бен, Дэн и Кэм все лгали бы. Но тогда, например, у Бена среди Кэма, Дэна и Сэма ровно один правдив - сам Сэм, значит фраза Бена стала бы истинной. Противоречие, поэтому Сэм лжет. Теперь фраза Сэма ложна означает, что среди Бена, Дэна и Кэма есть хотя бы один правдивый. Если среди них правдив ровно один, то его собственная фраза ложна: он видит среди двух остальных и Сэма ноль правдивых. Если правдивы все трое, то каждая из их фраз тоже ложна: каждый видит среди двух остальных и Сэма двух правдивых. Остается ровно два правдивых среди Бена, Дэна и Кэма, и любой выбор такой пары согласован. Значит Сэм лжет, а из Бена, Дэна и Кэма правду говорят ровно двое, но по данным нельзя определить какие именно.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;proof-which-pair-not-identifiable&quot;, &quot;title&quot;: &quot;Конкретная пара правдивых не определяется&quot;, &quot;text&quot;: &quot;Три расклада совместимы с высказываниями: правдивы Бен и Дэн; правдивы Бен и Кэм; правдивы Дэн и Кэм. Во всех трех случаях Сэм лжет, а каждый правдивый из первой тройки видит ровно одного правдивого среди названных им трех людей. Поэтому наблюдения не различают эти три пары.&quot;, &quot;standard_idea_ids&quot;: [&quot;indistinguishable_states&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какие из четырех друзей говорят правду&quot;, &quot;observations&quot;: [&quot;четыре публичных высказывания о количестве правдивых среди остальных&quot;], &quot;allowed_actions&quot;: [&quot;перебирать совместимые наборы истинных высказываний&quot;], &quot;goal&quot;: [&quot;deduce_invariant_truth_pattern&quot;, &quot;show_non_identifiability_of_pair&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;indistinguishable_models&quot;], &quot;lower_bound_method&quot;: [&quot;indistinguishability&quot;], &quot;keywords&quot;: [&quot;ukmt_smc_2016&quot;, &quot;truth_tellers&quot;, &quot;liars&quot;, &quot;non_unique_solution&quot;, &quot;investigation&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: &quot;compatible truth assignments&quot;, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;каждое высказывание либо истинно, либо ложно&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_what_is_forced&quot;}, &quot;difficulty&quot;: {&quot;main&quot;:
