1 до 31.&quot;, &quot;standard_idea_ids&quot;: [&quot;binary_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-powers-of-two-cards&quot;, &quot;title&quot;: &quot;Карточки по битам двоичной записи&quot;, &quot;text&quot;: &quot;Сделаем пять карточек с весами 1, 2, 4, 8 и 16. На карточку веса \\(2^j\\) напечатаем ровно те числа от 1 до 31, у которых в двоичной записи стоит единица в соответствующем разряде.\n\nКогда зритель говорит, на каких карточках есть его число, фокусник складывает веса этих карточек. Например, если число есть на карточках 1, 4 и 16, сумма равна 21, значит загадано 21. У каждого числа от 1 до 31 двоичная запись единственна, поэтому набор карточек однозначно восстанавливает число.&quot;, &quot;standard_idea_ids&quot;: [&quot;binary_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-four-cards-not-enough&quot;, &quot;title&quot;: &quot;Четырех карточек недостаточно для 31 числа&quot;, &quot;text&quot;: &quot;Четыре карточки дают только \\(2^4=16\\) различных наборов ответов \&quot;есть/нет\&quot;. Для 31 возможного числа этого недостаточно.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;31 возможное загаданное число&quot;, &quot;observations&quot;: [&quot;пять ответов о принадлежности карточкам&quot;], &quot;allowed_actions&quot;: [&quot;заранее выбрать инцидентность чисел и карточек&quot;], &quot;goal&quot;: [&quot;identify_hidden_number&quot;], &quot;strategy_type&quot;: [&quot;nonadaptive_strategy&quot;, &quot;binary_code&quot;], &quot;lower_bound_method&quot;: [&quot;bit_counting&quot;], &quot;keywords&quot;: [&quot;binary_cards&q _strategy&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Помощник показывает четыре карты&quot;, &quot;text&quot;: &quot;Из стандартной колоды в 52 карты зритель выбирает 5 карт и показывает их помощнику. Помощник передает фокуснику 4 из этих карт в некотором порядке. Фокусник знает заранее согласованную стратегию, но не видел пятую карту. Докажите, что помощник может выбрать и упорядочить 4 карты так, чтобы фокусник всегда определял пятую.&quot;, &quot;source_ids&quot;: [&quot;src-fitch-cheney-five-card-trick&quot;, &quot;src-problems-ru-98399&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;generalized&quot;: [{&quot;id&quot;: &quot;stmt-general-s-suits-m-ranks&quot;, &quot;title&quot;: &quot;Масти, циклические ранги и перестановочный канал&quot;, &quot;text&quot;: &quot;Та же конструкция переносится на колоду с \\(s\\) мастями и \\(m\\) циклическими рангами, если в руке \\(s+1\\) карт и \\((s-1)!\\) перестановок оставшихся показанных карт хватает, чтобы закодировать расстояние между двумя картами одной масти: \\(\\lfloor m/2\\rfloor\\le (s-1)!\\). Стандартная колода дает \\(s=4\\), \\(m=13\\), \\(\\lfloor 13/2\\rfloor=6=3!\\).&quot;, &quot;source_ids&quot;: [&quot;src-fitch-cheney-five-card-trick&quot;, &quot;src-problems-ru-98399&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-two-same-suit-and-six-orders&quot;, &quot;title&quot;: &quot;Одна карта задает масть, порядок задает расстояние&quot;, &quot;text&quot;: &quot;Среди 5 карт есть две одной масти. Одну из них показывают первой, чтобы сообщить масть скрытой карты; порядок оставшихся трех кодирует число от 1 до 6.&quot;, &quot;standard_idea_ids&quot;: [&quot;permutation_encodes_offset&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-suit-and-offset&quot;, &quot;title&quot;: &quot;Кодирование масти и смещения&quot;, &quot;text&quot;: &quot;В каждой масти упорядочим достоинства по циклу длины 13. Среди пяти выбранных карт найдутся две одной масти. На цикле между ними есть два расстояния, сумма которых равна 13, поэтому одно из направлений имеет расстояние от 1 до 6. Помощник скрывает вторую карту этой пары, а первую показывает первой: так фокусник узнает масть скрытой карты и начальную точку на цикле.\n\nОставшиеся три показанные карты можно упорядочить шестью способами. Заранее договоримся, какая перестановка кодирует каждое число от 1 до 6. Помощник ставит эти три карты в порядке, кодирующем расстояние от первой показанной карты до скрытой по циклу достоинств. Фокусник читает масть по первой карте, число - по порядку трех остальных, и восстанавливает скрытую карту.&quot;, &quot;standard_idea_ids&quot;: [&quot;permutation_encodes_offset&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;выбор скрытой карты из пяти выбранных&quot;, &quot;observations&quot;: [&quot;четыре открытые карты&quot;, &quot;порядок четырех карт&quot;], &quot;allowed_actions&quot;: [&quot;помощник выбирает скрытую карту и порядок остальных&quot;], &quot;goal&quot;: [&quot;communicate_hidden_card&quot;], &quot;strategy_type&quot;: [&quot;nonverbal_communication&quot;, &quot;encoding&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;five_card_trick&quot;, &quot;permutation_channel&quot;, &quot;pigeonhole_same_suit&quot;, &quot;s_suits_m_ranks&quot;, &quot;factorial_distance_code&q &quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;communication_strategy&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Зритель сообщает только столбец&quot;, &quot;text&quot;: &quot;Из 21 карты зритель мысленно выбирает одну. Фокусник три раза раскладывает карты в три столбца по 7 карт и каждый раз спрашивает, в каком столбце лежит выбранная карта. После трех ответов фокусник называет карту. Опишите стратегию.&quot;, &quot;source_ids&quot;: [&quot;src-card-trick-folklore&quot;, &quot;src-problems-ru-60905&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;generalized&quot;: [{&quot;id&quot;: &quot;stmt-general-c-columns-r-rounds&quot;, &quot;title&quot;: &quot;c столбцов и r раундов&quot;, &quot;text&quot;: &quot;Тот же прием является тернарным, точнее \\(c\\)-арным, сужением: если раскладывать карты в \\(c\\) столбцов и после каждого ответа собирать указанный столбец в заранее выбранную центральную позицию, то \\(r\\) ответов различают до \\(c^r\\) возможных карт. Классическое число 21 - удобный частный случай при \\(c=3\\), \\(r=3\\), где емкость 27 имеет запас.&quot;, &quot;source_ids&quot;: [&quot;src-folklore&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;, &quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-middle-pile-shrinks-interval&quot;, &quot;title&quot;: &quot;Кладем выбранный столбец в середину&quot;, &quot;text&quot;: &quot;Каждый ответ выбирает одну треть текущих возможностей, а сбор с выбранным столбцом посередине удерживает выбранную карту в сужающемся центральном интервале.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_search&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-three-middle-collections&quot;, &quot;title&quot;: &quot;Трижды собрать выбранный столбец посередине&quot;, &quot;text&quot;: &quot;Разложим 21 карту в три столбца по 7 карт, например по одной карте в первый, второй, третий столбец и снова по кругу. Зритель указывает столбец с выбранной картой. Собираем карты так, чтобы этот столбец оказался между двумя другими стопками.\n\nПосле первого сбора выбранная карта находится среди позиций 8-14 в колоде. Снова раскладываем колоду в три столбца по 7 и снова кладем указанный столбец в середину. Поскольку раскладка распределяет подряд идущие возможные позиции по трем столбцам, второй ответ сужает возможные позиции до трех центральных мест. После третьего такого же шага возможная позиция становится единственной: выбранная карта оказывается на 11-й позиции в колоде.\n\nФокусник после третьего сбора отсчитывает 11-ю карту и называет ее. Стратегия работает потому, что каждый ответ дает один из трех вариантов, а три ответа различают до \\(3^3=27\\) состояний; 21 карта помещается в эту емкость.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_search&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;21 вариант выбранной карты&quot;, &quot;observations&quot;: [&quot;три ответа о столбце&quot;], &quot;allowed_actions&quot;: [&quot;раскладывать карты и выбирать порядок сборки стопок&quot;], &quot;goal&quot;: [&quot;identify_selected_card&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;ternary_search&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_leaf_count&quot;], &quot;keywords&quot;: [&quot;21_card_trick&quot;, &quot;three_columns&quot;, &quot;ternary_answers&quot;, &quot;c_ary_interval_shrinking&quot;, &quot;c^r_capacity&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;card_trick_profile&quot;: {&quot;deck_size&quot;: 21, &quot;hand_size&quot;: 21, &quot;shown_cards&quot;: 21, &quot;hidden_cards&quot;: 1, &quot;ordering_channel&quot;: false, &quot;encoded_values_by_order&quot;: &quot;three column answers over three rounds&quot;, &quot;strategy_type&quot;: &quot;ternary_interval_shrinking&quot;}, &quot;communication_profile&quot;: {&quot;senders&quot;: 1, &quot;receivers&quot;: 1, &quot;message&quot;: &quot;which of three columns contains selected card&quot;, &quot;message_capacity&quot;: &quot;3 choices per round for 3 rounds&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Классический фокус как тернарное сужение пространства состояний.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;card_trick&quot;, &quot;ternary_search&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-card-trick-folklore&quot;, &quot;role&quot;: &quot;folklore_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}, {&quot;source_id&quot;: &quot;src-problems-ru-60905&quot;, &quot;role&quot;: &quot;web_statement_and_solution_variant&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;seed_links&quot;, &quot;generalization_status&quot;: &quot;same_solution_parameterized&quot;, &quot;notes&quot;: [&quot;2026-05-18: число 21 отмечено как несущественное для механизма; та же стратегия работает как c-арное сужение с емкостью c^r.&quot;, &quot;2026-05-18: problems.ru 60905 добавлена как версия с 27 картами и тремя равными кучками из учебника Алфутовой и Устинова; отдельная карточка не заведена, так как механизм тот же тернарный фокус.&quot;]}}, {&quot;id&quot;: &quot;mmo-2000-seven-cards-public-communication&quot;, &quot;title&quot;: &quot;ММО-2000: семь карт, публичные сообщения и приватность расклада&quot;, &quot;fragment&quot;: &quot;communication&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;coding&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-mmo-2000-10-6&quot;, &quot;title&quot;: &quot;Гриша и Леша сообщают карты, не раскрывая карту Коле&quot;, &quot;text&quot;: &quot;Из колоды вынули 7 карт, показали всем, перетасовали и раздали Грише и Леше по 3 карты, а оставшуюся карту либо спрятали, либо отдали Коле. Гриша и Леша могут по очереди вслух сообщать любую информацию о своих картах. Могут ли они сообщить друг другу свои карты так, чтобы Коля при этом не смог вычислить местонахождение ни одной из тех карт, которых он не видит? Переговоры происходят открытым текстом, без заранее оговоренного тайного кода.&quot;, &quot;source_ids&quot;: [&quot;src-mmo-2000-63-archive&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;strategy&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-mod-seven-public-sums&quot;, &quot;title&quot;: &quot;Остатки сумм по модулю 7&quot;, &quot;text&quot;: &quot;Нумерация карт остатками \\(0,1,\\ldots,6\\) позволяет двум игрокам сообщить достаточно информации друг другу, но оставить для наблюдателя несколько совместимых раскладов для каждой невидимой карты.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-hidden-card-not-seen-by-kolya-case&quot;, &quot;title&quot;: &quot;Когда оставшаяся карта спрятана&quot;, &quot;text&quot;: &quot;Пусть реальная рука Гриши равна \\(A\\). Гриша выбирает любую тройку \\(B\\) из четырех карт, которых у него нет, и публично говорит: «У меня либо \\(A\\), либо \\(B\\)». Леша видит свою руку и поэтому понимает, какая из двух троек действительно рука Гриши: если \\(B\\) не совпадает с рукой Леши, то \\(B\\) содержит две карты Леши и спрятанную карту; если совпадает, то вторая тройка и есть рука Леши.\n\nПосле этого Леша строит свою фразу так, чтобы одна названная тройка была его реальной рукой, а другая - реальной рукой Гриши или такой тройкой из карт не Леши, которая отличается от руки Гриши ровно одной картой. Конкретно: если \\(B\\) не совпала с рукой Леши, Леша говорит: «У меня либо моя рука, либо \\(A\\)». Если \\(B\\) совпала с рукой Леши, он говорит: «У меня либо \\(B\\), либо \\(C\\)», где \\(C\\) - любая тройка из карт не Леши, не равная \\(A\\). В обоих случаях Гриша по второй фразе узнает руку Леши.\n\nПочему Коля не узнает местонахождение ни одной невидимой карты? В первом случае публично названы три тройки \\(A,B,C\\), где \\(C\\) - рука Леши, \\(B\\cap C\\) состоит из двух карт, Гриша сказал «\\(A\\) или \\(B\\)», а Леша сказал «\\(C\\) или \\(A\\)». Совместимы две картины: \\(G=A,L=C\\) и \\(G=B,L=A\\); в них меняется и владелец многих карт, и спрятанная карта. Второй случай симметричен: общая названная тройка \\(B\\) может быть либо рукой Леши, либо рукой Гриши в другой совместимой картине. Поэтому у каждой карты, которую Коля не видит, остается по крайней мере две возможные роли.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: []}, {&quot;id&quot;: &quot;str-hidden-card-known-to-kolya-case&quot;, &quot;title&quot;: &quot;Когда оставшаяся карта у Коли&quot;, &quot;text&quot;: &quot;Занумеруем семь карт числами \\(0,1,\\ldots,6\\). Гриша и Леша по очереди публично называют остатки по модулю 7 от суммы номеров своих трех карт. Зная свой набор и остаток другого, каждый восстанавливает номер карты, которая не принадлежит ни одному из них: это остаток, противоположный сумме двух названных остатков по модулю 7. После этого каждый знает три карты другого.\n\nКоля видит свою карту и слышит два остатка. Для любой другой карты с номером \\(s\\) она все еще могла быть у Гриши: надо дополнить ее двумя картами с суммой, равной названному Гришей остатку минус \\(s\\). Среди трех пар с нужной суммой по модулю 7 не более двух испорчены тем, что используют карту \\(s\\) или карту Коли, значит подходящая пара остается. То же рассуждение работает для Леши. Поэтому Коля не может определить местонахождение ни одной невидимой ему карты.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: []}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;расклады 7 карт между двумя руками по 3 карты и одной внешней картой&quot;, &quot;observations&quot;: [&quot;публичные сообщения об остатках сумм по модулю 7&quot;], &quot;allowed_actions&quot;: [&quot;делать открытые истинные сообщения о своей руке&quot;], &quot;goal&quot;: [&quot;mutual_identification_of_hands&quot;, &quot;privacy_against_observer&quot;], &quot;strategy_type&quot;: [&quot;public_communication&quot;, &quot;modular_encoding&quot;, &quot;state_space_partition&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;mmo_2000&quot;, &quot;public_communication&quot;, &quot;card_privacy&quot;, &quot;mod_7&quot;, &quot;numbers_7_3_privacy_design&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;communication_profile&quot;: {&quot;agents&quot;: [&quot;Grisha&quot;, &quot;Lesha&quot;, &quot;Kolya&quot;], &quot;channel&quot;: &quot;public_announcements&quot;, &quot;message_capacity&quot;: &quot;one residue modulo 7 from each informed player&quot;, &quot;privacy_goal&quot;: &quot;observer cannot locate any unseen card&quot;}, &quot;card_trick_profile&quot;: {&quot;deck_size&quot;: 7, &quot;hand_size&quot;: 3, &quot;hidden_cards&quot;: 1, &quot;transmitted_cards&quot;: 3}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_hard&quot;, &quot;local_score&quot;: 5, &quot;comment&quot;: &quot;10 класс ММО; это уже не фокус, а публичный протокол с требованием приватности.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;card_trick&quot;, &quot;modular_sum_code&quot;, &quot;public_announcement&quot;, &quot;public_communication&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-mmo-2000-63-archive&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;generalization_status&quot;: &quot;numbers_essential_for_recorded_solution&quot;, &quot;notes&quot;: [&quot;Добавлены обе конструкции из официального решения: для спрятанной карты и для карты, отданной Коле.&quot;, &quot;2026-05-18: обобщение не добавлено: числа 7, 3, 3 и модуль 7 участвуют в проверке приватности через пары с заданной суммой; перенос на другие размеры требует отдельного дизайна, а не той же записи решения.&quot;]}}, {&quot;id&quot;: &quot;mmo-2019-wise-men-seven-numbers-median&quot;, &quot;title&quot;: &quot;ММО-2019: семь чисел, сумма 100 и передача через четвертое число&quot;, &quot;fragment&quot;: &quot;communication&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;one_message&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-mmo-2019-9-1&quot;, &quot;title&quot;: &quot;Второй мудрец знает только четвертое по величине число&quot;, &quot;text&quot;: &quot;Первый мудрец задумывает 7 различных натуральных чисел с суммой 100 и тайно сообщает их королю. Король называет второму мудрецу только четвертое по величине из этих чисел. У мудрецов нет возможности сговориться. Могут ли мудрецы гарантированно справиться с заданием, чтобы второй отгадал все семь чисел?&quot;, &quot;source_ids&quot;: [&quot;src-mmo-2019-82-brochure&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;strategy&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-unique-middle-value-code&quot;, &quot;title&quot;: &quot;Сделать передаваемое число уникальным кодом всего набора&quot;, &quot;text&quot;: &quot;Так как первый мудрец сам выбирает набор, ему достаточно выбрать такой набор, у которого четвертое по величине число однозначно указывает на весь набор в заранее известной математической ситуации.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-singleton-fiber-under-fourth-number&quot;, &quot;title&quot;: &quot;Выбрать набор с единственной возможной серединой&quot;, &quot;text&quot;: &quot;Первый мудрец может выбрать числа \\(1,2,3,22,23,24,25\\). Их сумма равна 100, а четвертое по величине число равно 22. Если второй мудрец слышит 22, то три меньших натуральных различных числа имеют сумму как минимум \\(1+2+3=6\\), а три больших различных натуральных числа имеют сумму как минимум \\(23+24+25=72\\). Вместе с 22 это уже дает 100, поэтому все минимумы должны достигаться. Значит, набор единственно возможен.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: []}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;семерки различных натуральных чисел с суммой 100&quot;, &quot;observations&quot;: [&quot;одно публичное сообщение: четвертое по величине число&quot;], &quot;allowed_actions&quot;: [&quot;первый мудрец выбирает скрытый набор&quot;, &quot;король сообщает только четвертую порядковую статистику&quot;], &quot;goal&quot;: [&quot;make_hidden_set_identifiable_from_single_number&quot;], &quot;strategy_type&quot;: [&quot;one_message_code&quot;, &quot;singleton_fiber&quot;, &quot;extremal_minimum&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;mmo_2019&quot;, &quot;wise_men&quot;, &quot;median_code&quot;, &quot;single_message&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;communication_profile&quot;: {&quot;agents&quot;: [&quot;first_sage&quot;, &quot;king&quot;, &quot;second_sage&quot;], &quot;channel&quot;: &quot;single_number_chosen_by_rule&quot;, &quot;message_capacity&quot;: &quot;fourth_order_statistic&quot;, &quot;privacy_goal&quot;: &quot;none&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;9 класс ММО; хорошая короткая карточка про однозначное кодирование через один параметр.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;public_communication&quot;, &quot;linear_signature&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-mmo-2019-82-brochure&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Добавлена как минимальная задача о передаче скрытого состояния одним к можно использовать как безошибочный код мощности 6.&quot;, &quot;standard_idea_ids&quot;: [&quot;permutation_encodes_offset&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-table-of-permutations&quot;, &quot;title&quot;: &quot;Заранее согласовать таблицу перестановок&quot;, &quot;text&quot;: &quot;Стороны фиксируют таблицу: первому сообщению соответствует порядок \\(ABC\\), второму \\(ACB\\), третьему \\(BAC\\), четвертому \\(BCA\\), пятому \\(CAB\\), шестому \\(CBA\\). Отправитель выбирает нужный порядок, а получатель читает сообщение по той же таблице.&quot;, &quot;standard_idea_ids&quot;: [&quot;permutation_encodes_offset&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-more-than-six-impossible&quot;, &quot;title&quot;: &quot;Семь сообщений так передать нельзя&quot;, &quot;text&quot;: &quot;Наблюдений у получателя только шесть: все перестановки трех предметов. Если сообщений семь или больше, по принципу Дирихле двум сообщениям придется соответствовать один порядок, и получатель не сможет различить их.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;одно из шести сообщений&quot;, &quot;observations&quot;: [&quot;порядок трех различимых предметов&quot;], &quot;allowed_actions&quot;: [&quot;выбрать одну перестановку предметов&quot;], &quot;goal&quot;: [&quot;communicate_hidden_message&quot;], &quot;strategy_type&quot;: [&quot;encoding&quot;, &quot;nonverbal_communication&quot;], &quot;lower_bound_method&quot;: [&quot;message_capacity_count&quot;], &quot;keywords&quot;: [&quot;permutation_channel&quot;, &quot;factorial_code&quot;, &quot;six_messages&quot;, &quot;m_factorial_messages&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;communication_profile&quot;: {&quot;senders&quot;: 1, &quot;receivers&quot;: 1, &quot;message&quot;: &quot;one of six prearranged messages&quot;, &quot;message_capacity&quot;: &quot;3! ordered displays&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Минимальная самостоятельная лемма для задач с кодированием порядком.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;permutation_order_code&quot;, &quot;counting_lower_bound&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-folklore&quot;, &quot;role&quot;: &quot;folklore_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;seed_links&quot;, &quot;generalization_status&quot;: &quot;same_solution_parameterized&quot;, &quot;notes&quot;: [&quot;2026-05-18: число 6 классифицировано как емкость 3!; добавлена общая версия для m! сообщений.&quot;]}}, {&quot;id&quot;: &quot;prisoners-100-boxes-cycle-strategy&quot;, &quot;title&quot;: &quot;100 заключенных и 100 ящиков&quot;, &quot;fragment&quot;: &quot;communication&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;probabilistic_strategy&quot;, &quot;permutation_strategy&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-names-in-boxes&quot;, &quot;title&quot;: &quot;Найти свое имя за 50 открытий&quot;, &quot;text&quot;: &quot;Имена 100 заключенных лежат в 100 ящиках, по одному имени в каждом. Заключенные могут заранее договориться о стратегии, затем заходят в комнату по одному. Каждый может открыть не более 50 ящиков, должен оставить комнату как была и после начала испытания не может общаться с остальными. Все выживают, если каждый находит свое имя. Найдите стратегию, вероятность успеха которой больше 30%.&quot;, &quot;source_ids&quot;: [&quot;src-winkler-seven-puzzles&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;generalized&quot;: [{&quot;id&quot;: &quot;stmt-general-n-boxes-half-openings&quot;, &quot;title&quot;: &quot;n заключенных и n/2 открытий&quot;, &quot;text&quot;: &quot;Для четного \\(n\\) тот же цикл-following протокол применим к \\(n\\) заключенным и \\(n\\) ящикам, если каждый открывает не более \\(n/2\\) ящиков. Успех стратегии эквивалентен отсутствию в случайной перестановке циклов длины больше \\(n/2\\).&quot;, &quot;source_ids&quot;: [&quot;src-winkler-seven-puzzles&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-follow-permutation-cycles&quot;, &quot;title&quot;: &quot;Перестановка разбивается на циклы&quot;, &quot;text&quot;: &quot;Если ящики заранее пронумерованы именами заключенных, содержимое ящиков задает перестановку. Следование из своего ящика к ящику с найденным именем идет ровно по циклу этой перестановки.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-cycle-following&quot;, &quot;title&quot;: &quot;Идти по своему циклу&quot;, &quot;text&quot;: &quot;До испытания заключенные нумеруют ящики своими именами. Заключенный \\(i\\) сначала открывает ящик с номером \\(i\\). Если там лежит его имя, он закончил. Если там имя \\(j\\), следующим он открывает ящик \\(j\\), затем ящик с номером найденного там имени и так далее, пока не найдет свое имя или не сделает 50 открытий.\n\nЭто не независимые случайные попытки. Все заключенные выигрывают тогда и только тогда, когда в перестановке «номер ящика -&gt; имя внутри» нет цикла длины больше 50. Если цикл длины \\(m \\le 50\\), каждый заключенный из этого цикла, начав со своего ящика, найдет свое имя ровно за \\(m\\) шагов или раньше. Если есть цикл длины \\(m&gt;50\\), все участники этого цикла не успеют пройти его целиком, и стратегия проиграет.\n\nВероятность не иметь цикла длины больше 50 равна \\(1 - \\sum_{m=51}^{100} 1/m\\), потому что для каждого \\(m&gt;50\\) в перестановке не может быть двух таких длинных циклов, а вероятность, что фиксированная перестановка содержит цикл длины \\(m\\), равна \\(1/m\\). Численно это примерно 0.3118, то есть больше 30%.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;случайная перестановка имен по ящикам&quot;, &quot;observations&quot;: [&quot;имена в открытых ящиках одного заключенного&quot;], &quot;allowed_actions&quot;: [&quot;каждый заключенный открывает до 50 ящиков&quot;, &quot;предварительно согласовать стратегию&quot;], &quot;goal&quot;: [&quot;maximize_success_probability&quot;, &quot;all_agents_find_own_state&quot;], &quot;strategy_type&quot;: [&quot;permutation_cycle_strategy&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;100_prisoners&quot;, &quot;names_in_boxes&quot;, &quot;cycle_following&quot;, &quot;n_prisoners&quot;, &quot;long_cycle_threshold&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;communication_profile&quot;: {&quot;agents&quot;: 100, &quot;channel&quot;: &quot;no communication after protocol choice&quot;, &quot;message_capacity&quot;: &quot;observations are private box contents&quot;, &quot;privacy_goal&quot;: &quot;not applicable&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Стратегия проста, но вероятностный анализ циклов требует аккуратности.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;structural_constraint&quot;, &quot;symmetry_breaking&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-winkler-seven-puzzles&quot;, &quot;role&quot;: &quot;statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;generalization_status&quot;: &quot;same_solution_parameterized&quot;, &quot;notes&quot;: [&quot;Публичный текст переведен на русский, так как источник англоязычный.&quot;, &quot;2026-05-18: добавлена версия для четного n; число 100 несущественно для стратегии, но нужно для классической вероятности 1 - sum_{m=51}^{100} 1/m.&quot;]}}, {&quot;id&quot;: &quot;prisoners-chessboard-one-coin-xor&quot;, &quot;title&quot;: &quot;Шахматная доска, 64 монеты и один переворот&quot;, &quot;fragment&quot;: &quot;communication&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;communication_strategy&quot;, &quot;coding&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-chessboard-coin&quot;, &quot;title&quot;: &quot;Передать клетку одним переворотом монеты&quot;, &quot;text&quot;: &quot;На 64 клетках шахматной доски лежат монеты, каждая орлом или решкой вверх. Два заключенных заранее договариваются о стратегии. Затем первый видит доску и клетку, под которой спрятан ключ, и обязан перевернуть ровно одну монету. После этого второй видит только итоговую доску и должен указать клетку с ключом. Как гарантировать успех при любом исходном расположении монет и любой клетке с ключом?&quot;, &quot;source_ids&quot;: [&quot;src-winkler-mathematical-mind-benders&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;, &quot;review_notes&quot;: &quot;Фольклорная формулировка сверена по устойчивым пересказам; книжный источник указан как стабильный, но конкретная страница не проверена.&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;generalized&quot;: [{&quot;id&quot;: &quot;stmt-general-2q-squares&quot;, &quot;title&quot;: &quot;2^q клеток и q-битный XOR&quot;, &quot;text&quot;: &quot;Та же стратегия работает для любого множества из \\(2^q\\) позиций, занумерованных элементами \\(\\mathbb F_2^q\\). Контрольная сумма XOR номеров отмеченных монет является \\(q\\)-битным сообщением, а один переворот меняет ее на XOR с номером выбранной позиции.&quot;, &quot;source_ids&quot;: [&quot;src-folklore&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-xor-address&quot;, &quot;title&quot;: &quot;XOR всех клеток с орлами кодирует адрес&quot;, &quot;text&quot;: &quot;Нумерация клеток шестибитными словами превращает вид доски в шестибитную контрольную сумму. Переворот одной монеты меняет эту сумму на XOR с номером перевернутой клетки.&quot;, &quot;standard_idea_ids&quot;: [&quot;modular_sum_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-xor-single-flip&quot;, &quot;title&quot;: &quot;Перевернуть клетку с нужной разностью контрольных сумм&quot;, &quot;text&quot;: &quot;Заранее присвоим 64 клеткам номера \\(0,1,\\ldots,63\\), то есть шестибитные векторы. Договоримся считать орел значением 1, решку значением 0. Для любой позиции доски вычислим \\(S\\): XOR номеров всех клеток, на которых лежит орел.\n\nПусть ключ лежит под клеткой с номером \\(K\\). Первый заключенный видит исходную сумму \\(S\\). Если он перевернет монету на клетке \\(F\\), то новая сумма станет \\(S \\oplus F\\): номер \\(F\\) либо добавится в XOR, либо удалится, но в обоих случаях операция с XOR одинакова. Поэтому нужно выбрать \\(F = S \\oplus K\\). Такая клетка всегда существует и единственна среди 64 номеров.\n\nПосле переворота второй заключенный вычисляет XOR номеров клеток с орлами на итоговой доске. Он получает \\(S \\oplus F = S \\oplus (S \\oplus K)=K\\), то есть номер клетки с ключом. Условие «ровно одну монету» не мешает даже когда \\(S=K\\): тогда \\(F=0\\), и переворачивается заранее выбранная нулевая клетка, которая не меняет код кроме обязательной операции с номером 0.&quot;, &quot;standard_idea_ids&quot;: [&quot;modular_sum_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;клетка с ключом и исходная ориентация 64 монет&quot;, &quot;observations&quot;: [&quot;первый видит ключ и исходную доску&quot;, &quot;второй видит только итоговую доску&quot;], &quot;allowed_actions&quot;: [&quot;первый переворачивает ровно одну монету&quot;], &quot;goal&quot;: [&quot;communicate_hidden_square&quot;], &quot;strategy_type&quot;: [&quot;binary_code&quot;, &quot;single_bit_signal&quot;, &quot;xor_checksum&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;chessboard_prisoners&quot;, &quot;xor&quot;, &quot;single_coin_flip&quot;, &quot;2^q_positions&quot;, &quot;vector_space_checksum&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;communication_profile&quot;: {&quot;senders&quot;: 1, &quot;receivers&quot;: 1, &quot;message&quot;: &quot;one of 64 squares&quot;, &quot;message_capacity&quot;: &quot;one forced coin flip interpreted against the full board state&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Классический XOR-код: короткая стратегия, но неочевидный выбор контрольной суммы.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;binary_code&quot;, &quot;parity_code&quot;, &quot;single_bit_signal&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-winkler-mathematical-mind-benders&quot;, &quot;role&quot;: &quot;stable_book_reference&quot;, &quot;status&quot;: &quot;needs_human_review&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;needs_human_review&quot;, &quot;public_ready&quot;: false, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;review_notes&quot;: &quot;Нужна ручная проверка точной библиографической привязки к книжному источнику.&quot;, &quot;generalization_status&quot;: &quot;same_solution_parameterized&quot;, &quot;notes&quot;: [&quot;Публичный текст переведен на русский, так как устойчивые источники и пересказы англоязычные.&quot;, &quot;2026-05-18: добавлена формулировка для 2^q позиций; 64 - шахматный частный случай шестибитного XOR-кода.&quot;, &quot;2026-05-18 solution-ideas-review: standard_idea_ids уточнены с общего partition_state_space на modular_sum_encoding, потому что решение держится на XOR-контрольной сумме.&quot;]}}, {&quot;id&quot;: &quot;prisoners-light-bulb&quot;, &quot;title&quot;: &quot;Заключенные и лампочка в комнате&quot;, &quot;fragment&quot;: &quot;communication&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;communication_strategy&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Нужно гарантированно узнать, что все побывали в комнате&quot;, &quot;text&quot;: &quot;Сто заключенных заранее договариваются о стратегии. Затем их по одному в произвольном порядке вызывают в комнату с лампочкой, которую можно включать и выключать. Заключенный видит только текущее состояние лампочки и может изменить его. В какой-то момент один заключенный должен заявить, что все заключенные уже побывали в комнате; если заявление верно, всех освобождают. Найдите стратегию, гарантирующую верное заявление, если каждый заключенный будет вызываться бесконечно много раз.&quot;, &quot;source_ids&quot;: [&quot;src-prisoners-switch-puzzles&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}, {&quot;id&quot;: &quot;stmt-folklore-n-prisoners&quot;, &quot;title&quot;: &quot;Параметрическая версия с известным начальным состоянием&quot;, &quot;text&quot;: &quot;Есть \\(n\\) узников. Время от времени одного узника заводят в комнату с лампочкой; он видит, включена она или выключена, и может изменить ее состояние. Узники заранее договариваются о стратегии, затем общаться не могут. Каждый узник будет попадать в комнату бесконечно много раз. Как одному из них однажды гарантированно объявить, что все уже побывали в комнате?&quot;, &quot;source_ids&quot;: [&quot;src-folklore&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-one-counter-many-signals&quot;, &quot;title&quot;: &quot;Лампочка переносит одноразовые сигналы счетчику&quot;, &quot;text&quot;: &quot;Один заключенный назначается счетчиком, а каждый другой заключенный ровно один раз создает сигнал, включая лампочку.&quot;, &quot;standard_idea_ids&quot;: [&quot;single_bit_as_public_signal&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-designated-counter&quot;, &quot;title&quot;: &quot;Назначенный счетчик и одно включение&quot;, &quot;text&quot;: &quot;Перед началом выбирают одного заключенного счетчиком. Все остальные запоминают личный флаг: посылал ли он уже свой сигнал. Для определенности договоримся, что если несчетчик входит и видит лампочку выключенной, а свой сигнал он еще не посылал, он включает лампочку и считает свой сигнал отправленным. Во всех остальных случаях несчетчик ничего существенного не делает.\n\nСчетчик при каждом входе смотрит на лампочку. Если она включена, он выключает ее и увеличивает свой счет на 1; если выключена, ничего не меняет. Каждый несчетчик может увеличить счет не более одного раза, потому что после первого включения больше не посылает сигнал. Каждый несчетчик рано или поздно попадет в комнату при выключенной лампочке: счетчик вызывается бесконечно много раз и будет выключать лампочку после каждого сигнала. Поэтому все 99 несчетчиков со временем пошлют по одному сигналу.\n\nКогда счетчик насчитает 99 включений, он знает, что каждый из остальных 99 заключенных уже побывал в комнате. Сам счетчик тоже побывал, раз он ведет счет. Поэтому заявление в этот момент верно.&quot;, &quot;standard_idea_ids&quot;: [&quot;single_bit_as_public_signal&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;множество заключенных, уже побывавших в комнате&quot;, &quot;observations&quot;: [&quot;личная память заключенного&quot;, &quot;текущее состояние лампочки при входе&quot;], &quot;allowed_actions&quot;: [&quot;включить или выключить лампочку&quot;, &quot;сделать финальное заявление&quot;], &quot;goal&quot;: [&quot;certify_all_visited&quot;], &quot;strategy_type&quot;: [&quot;distributed_protocol&quot;, &quot;one_bit_communication&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;prisoners_light_bulb&quot;, &quot;one_bit_signal&quot;, &quot;designated_counter&quot;, &quot;n_prisoners_counter_protocol&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;communication_profile&quot;: {&quot;senders&quot;: &quot;99 non-counter prisoners&quot;, &quot;receivers&quot;: &quot;designated counter&quot;, &quot;channel&quot;: &quot;one shared light bulb&quot;, &quot;message_capacity&quot;: &quot;one persistent bit per room visit&quot;, &quot;objective&quot;: &quot;aggregate one visit signal from each participant&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Классический протокол с общей однобитной памятью.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;single_bit_signal&quot;, &quot;designated_counter_protocol&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-prisoners-switch-puzzles&quot;, &quot;role&quot;: &quot;folklore_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}, {&quot;source_id&quot;: &quot;src-folklore&quot;, &quot;role&quot;: &quot;folklore_parameterized_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;seed_links&quot;, &quot;generalization_status&quot;: &quot;already_parameterized_same_solution&quot;, &quot;notes&quot;: [&quot;Условие явно включает бесконечные вызовы каждого заключенного; без этого стратегия не гарантирует завершение.&quot;, &quot;2026-05-18: в карточку слит дубль prisoner-light-bulb-counter; источник сохранен как параметрическая формулировка.&quot;, &quot;2026-05-18: числа 100 и 99 классифицированы как частный случай общего протокола для n узников: счетчик ждет n-1 одноразовых сигналов.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-66710-hats-with-madmen-oracle&quot;, &quot;title&quot;: &quot;problems.ru 66710: шляпы с k безумными мудрецами&quot;, &quot;fragment&quot;: &quot;communication&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;communication_strategy&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Цвет и число в очереди мудрецов&quot;, &quot;text&quot;: &quot;В ряд стоят \\(n\\) мудрецов, все смотрят в одном направлении; на каждом черная или белая шляпа, и каждый видит шляпы всех впереди. Они отвечают сзади наперед, называя цвет и натуральное число, причем все слышат предыдущие ответы. Мудрецы заранее договариваются о стратегии, но знают только, что ровно \\(k\\) из них безумны; безумный называет цвет и число независимо от договоренности. Нужно найти максимальное число правильных цветов, которое можно гарантировать при любом расположении безумных.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-66710&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-moving-oracle&quot;, &quot;title&quot;: &quot;Последний надежный оракул передает цвет следующему&quot;, &quot;text&quot;: &quot;Каждый разумный мудрец кодирует видимые шляпы числом так, чтобы сообщить цвет шляпы любому стоящему за ним. Участники публично отслеживают текущего оракула: если следующий разумный послушался его, сам становится новым оракулом; безумные ответы могут быть проигнорированы.&quot;, &quot;standard_idea_ids&quot;: [&quot;public_communication&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-current-oracle&quot;, &quot;title&quot;: &quot;Стратегия текущего оракула&quot;, &quot;text&quot;: &quot;Заранее договоримся о кодировании любой видимой последовательности шляп числом от 1 до \\(2^i\\), если мудрец видит \\(i\\) шляп. Ответ предыдущего разумного мудреца тем самым сообщает цвет шляпы каждому следующему разумному. Начинающий разумный может ошибиться, потому что не получает информации о собственной шляпе; назовем его текущим оракулом. Каждый следующий разумный называет цвет, который ему указывает последний оракул. Если он действительно следует оракулу, то его собственный ответ с корректным числом делает его новым оракулом; если ответ не согласован, остальные считают, что оракул не сменился. Так как все ответы публичны, каждый может вести один и тот же счетчик оракула. Все разумные, кроме первого среди них, гарантированно угадывают, а \\(k\\) безумных и первый разумный могут ошибиться. Поэтому гарантируется \\(n-k-1\\) правильных цветов.&quot;, &quot;standard_idea_ids&quot;: [&quot;public_communication&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-madmen-and-first-sane&quot;, &quot;title&quot;: &quot;Больше \\(n-k-1\\) гарантировать нельзя&quot;, &quot;text&quot;: &quot;\\(k\\) безумных могут назвать неверный цвет независимо от стратегии. Кроме того, первый отвечающий среди разумных не получает никакого сообщения о собственной шляпе: две раскраски, отличающиеся только цветом его шляпы, неразличимы для него. Поэтому нельзя гарантировать больше \\(n-k-1\\) правильных ответов.&quot;, &quot;standard_idea_ids&quot;: [&quot;indistinguishability_argument&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;раскраска n шляп и множество k безумных мудрецов&quot;, &quot;observations&quot;: [&quot;видимые шляпы впереди&quot;, &quot;публичная последовательность цветов и чисел&quot;], &quot;allowed_actions&quot;: [&quot;заранее договориться о кодировании и правилах обновления оракула&quot;], &quot;goal&quot;: [&quot;maximize_guaranteed_correct_answers&quot;], &quot;strategy_type&quot;: [&quot;public_communication&quot;, &quot;robust_protocol&quot;], &quot;lower_bound_method&quot;: [&quot;indistinguishability&quot;], &quot;keywords&quot;: [&quot;problems_ru_66710&quot;, &quot;hat_puzzle&quot;, &quot;madmen&quot;, &quot;oracle_protocol&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;communication_profile&quot;: {&quot;senders&quot;: &quot;n sequential agents&quot;, &quot;receivers&quot;: &quot;later agents&quot;, &quot;message&quot;: &quot;color plus arbitrary natural number&quot;, &quot;message_capacity&quot;: &quot;unbounded numeric side channel, corrupted by k uncontrolled agents&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_hard&quot;, &quot;local_score&quot;: 5, &quot;comment&quot;: &quot;Шляпная коммуникационная стратегия с отказоустойчивым публичным протоколом.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;hat_puzzle&quot;, &quot;public_communication&quot;, &quot;indistinguishability_argument&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-66710&quot;, &quot;role&quot;: &quot;web_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;problems_ru_deep_batch&quot;, &quot;notes&quot;: [&quot;Первоисточник по problems.ru: Турнир городов, 2017/18, 39-й, весенний тур, сложный вариант, 10-11 классы, задача 7.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-66722-knights-liars-mimics-public-majority&quot;, &quot;title&quot;: &quot;problems.ru 66722: подпевалы и публичное большинство ответов&quot;, &quot;fragment&quot;: &quot;communication&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;2018 ответов на один публичный вопрос&quot;, &quot;text&quot;: &quot;На острове живут рыцари, лжецы и подпевалы; каждый знает, кто есть кто. Всех 2018 жителей построили в ряд и по очереди спросили: «На острове рыцарей больше, чем лжецов?» Рыцари отвечают правду, лжецы лгут. Каждый подпевала отвечает так же, как большинство ответивших до него, а при равенстве может выбрать любой ответ. Все слышат предыдущие ответы. Оказалось, что ответов «да» ровно 1009. Нужно определить наибольшее возможное число подпевал.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-66722&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-balance-zero-crossings&quot;, &quot;title&quot;: &quot;Подпевалы увеличивают модуль текущего баланса&quot;, &quot;text&quot;: &quot;Разность числа ответов «да» и «нет» начинается и заканчивается нулем. Пока баланс имеет фиксированный знак, подпевала всегда отвечает в сторону большинства и увеличивает модуль баланса; возвращать баланс к нулю могут только принципиальные жители.&quot;, &quot;standard_idea_ids&quot;: [&quot;single_bit_signal&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-1009-mimics-example&quot;, &quot;title&quot;: &quot;Оценка и пример на 1009 подпевалов&quot;, &quot;text&quot;: &quot;Разобьем последовательность ответов по моментам, когда баланс \\(D=\\#да-\\#нет\\) равен нулю. Внутри каждого такого блока подпевала увеличивает \\(|D|\\), потому что повторяет текущее большинство. Чтобы блок вернулся к нулю, принципиальных жителей в нем должно быть не меньше, чем подпевал. Значит во всей очереди подпевалов не больше 1009. Эта граница достигается: сначала могут стоять 1009 подпевалов, которые при каждом равенстве или большинстве «нет» отвечают «нет», затем 1009 рыцарей отвечают «да». Тогда всего ответов «да» ровно 1009, и подпевалов тоже 1009.&quot;, &quot;standard_idea_ids&quot;: [&quot;single_bit_signal&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-principled-at-least-mimics&quot;, &quot;title&quot;: &quot;Принципиальных не меньше подпевалов&quot;, &quot;text&quot;: &quot;На любом отрезке между двумя нулевыми значениями баланса подпевалы не могут уменьшать модуль баланса. Поэтому каждый вклад подпевал в удаление от нуля должен быть компенсирован ответами рыцарей или лжецов. Следовательно, во всей последовательности принципиальных жителей не меньше, чем подпевал, а из 2018 жителей подпевалов не больше 1009.&quot;, &quot;standard_idea_ids&quot;: [&quot;indistinguishability_argument&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;типы 2018 жителей: рыцарь, лжец или подпевала&quot;, &quot;observations&quot;: [&quot;публичная последовательность ответов да/нет&quot;, &quot;итоговое число ответов да&quot;], &quot;allowed_actions&quot;: [&quot;ответы идут последовательно и слышны всем; подпевала зависит от прошлого большинства&quot;], &quot;goal&quot;: [&quot;maximize_possible_mimics_count&quot;], &quot;strategy_type&quot;: [&quot;public_communication&quot;, &quot;balance_invariant&quot;], &quot;lower_bound_method&quot;: [&quot;invariant_bound&quot;], &quot;keywords&quot;: [&quot;problems_ru_66722&quot;, &quot;knights_liars_mimics&quot;, &quot;public_majority&quot;, &quot;balance_process&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 2018, &quot;lies_allowed&quot;: &quot;liars always lie; mimics copy previous majority&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;maximize_type_count&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Публичная последовательность ответов с динамическим правилом третьего типа.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;public_communication&quot;, &quot;single_bit_signal&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-66722&quot;, &quot;role&quot;: &quot;web_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;problems_ru_deep_batch&quot;, &quot;notes&quot;: [&quot;Первоисточник по problems.ru: Турнир городов, 2018/19, 40-й, осенний тур, сложный вариант, 8-9 классы задача 2 и 10-11 классы задача 1.&quot;]}}, {&quot;id&quot;: &quot;uct-2015-digits-composite-after-six-deletions&quot;, &quot;title&quot;: &quot;UCT Olympiad 2015: порядок цифр, устойчивый к удалению шести цифр&quot;, &quot;fragment&quot;: &quot;communication&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;encoding&quot;, &quot;robust_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-uct-2015-digits-composite&quot;, &quot;title&quot;: &quot;Любые четыре оставшиеся цифры дают составное число&quot;, &quot;text&quot;: &quot;Нужно расположить десять цифр 0, 1, 2, ..., 9 в ряд так, чтобы после удаления любых шести цифр оставшиеся четыре цифры, записанные в прежнем порядке, образовывали составное число.&quot;, &quot;source_ids&quot;: [&quot;src-uct-2015-olympiad-senior-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-protect-one-exceptional-subsequence&quot;, &quot;title&quot;: &quot;Нужно контролировать единственный опасный случай&quot;, &quot;text&quot;: &quot;Если первые четыре цифры образуют составное число, а все остальные цифры делают последнюю цифру оставшегося числа четной, равной 0 или равной 5, то любой выбор с хотя бы одной поздней цифрой автоматически дает составное число.&quot;, &quot;standard_idea_ids&quot;: [&quot;error_correcting_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-place-1397-first&quot;, &quot;title&quot;: &quot;Поставить в начало составное число из нечетных цифр&quot;, &quot;text&quot;: &quot;Один работающий порядок начинается с цифр 1, 3, 9, 7, после чего идут остальные шесть цифр в любом порядке, например 0, 2, 4, 5, 6, 8. Если удалены ровно последние шесть цифр, остается 1397, а это \\(11\\cdot127\\), то есть составное число. Во всех остальных случаях среди оставшихся четырех цифр есть хотя бы одна из последних шести; последняя оставшаяся из них стоит правее первых четырех и равна 0, 5 или четной цифре, поэтому полученное четырехзначное число делится на 2 или 5.&quot;, &quot;standard_idea_ids&quot;: [&quot;error_correcting_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какие шесть из десяти позиций будут удалены&quot;, &quot;observations&quot;: [&quot;оставшаяся подпоследовательность из четырех цифр&quot;], &quot;allowed_actions&quot;: [&quot;заранее выбрать порядок десяти цифр&quot;], &quot;goal&quot;: [&quot;guarantee_composite_number_after_any_deletion&quot;], &quot;strategy_type&quot;: [&quot;nonadaptive_strategy&quot;, &quot;robust_encoding&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;uct_2015&quot;, &quot;digits&quot;, &quot;cards&quot;, &quot;strategy&quot;, &quot;erasure&quot;, &quot;composite&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;communication_profile&quot;: {&quot;agents&quot;: [&quot;arranger&quot;, &quot;deleter&quot;], &quot;public_announcements&quot;: [], &quot;message&quot;: &quot;порядок десяти цифр задает защиту от любого удаления шести позиций&quot;, &quot;objective&quot;: &quot;guarantee_property_for_all_hidden_deletions&quot;, &quot;strategy_type&quot;: &quot;erasure_robust_ordering&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Трудность в том, чтобы свести все удаления к одному исключительному случаю.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;nonadaptive_strategy&quot;, &quot;error_correcting_code&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-uct-2015-olympiad-senior-solutions&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;south_africa_batch&quot;, &quot;notes&quot;: [&quot;В UCT 2015 эта задача есть и в junior paper; карточка привязана к senior solutions, где приведен полный разбор.&quot;]}}, {&quot;id&quot;: &quot;heavier-4-coins-one-weighing-impossible&quot;, &quot;title&quot;: &quot;Почему одной проверки не хватает для четырех монет&quot;, &quot;fragment&quot;: &quot;impossibility&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;lemma&quot;, &quot;secondary&quot;: [&quot;information_lower_bound&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Четыре состояния и три исхода&quot;, &quot;text&quot;: &quot;Среди 4 одинаковых на вид монет одна фальшивая и тяжелее остальных. Докажите, что одним взвешиванием на чашечных весах нельзя гарантированно найти фальшивую монету.&quot;, &quot;source_ids&quot;: [&quot;src-classical-coin-weighing&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-three-outcomes-four-states&quot;, &quot;title&quot;: &quot;Три исхода не различают четыре состояния&quot;, &quot;text&quot;: &quot;Как бы ни было выбрано взвешивание, его результат имеет только три возможных значения.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;proof-three-outcomes&quot;, &quot;title&quot;: &quot;Подсчет листьев дерева решений&quot;, &quot;text&quot;: &quot;Перед взвешиванием возможны 4 состояния: фальшивая первая, вторая, третья или четвертая монета. Одно взвешивание на чашечных весах имеет не более трех исходов. Если бы стратегия всегда находила фальшивую монету, каждому из четырех состояний должен был бы соответствовать свой исход, иначе после одинакового результата две монеты оставались бы неразличимыми. Но трех исходов меньше, чем четырех состояний. Следовательно, одного взвешивания недостаточно.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;decision_tree&quot;, &quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;4 возможные тяжелые монеты&quot;, &quot;observations&quot;: [&quot;один исход чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;одно взвешивание&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;], &quot;strategy_type&quot;: [&quot;impossibility_proof&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_leaf_count&quot;], &quot;keywords&quot;: [&quot;three_outcomes_four_states&quot;, &quot;weighing_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 4, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;heavier_known&quot;, &quot;weighing_count&quot;: 1, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;prove_impossible&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Минимальная карточка для фрагмента невозможности.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;decision_tree_lower_bound&quot;, &quot;indistinguishability_argument&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-classical-coin-weighing&quot;, &quot;role&quot;: &quot;folklore_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;seed_links&quot;, &quot;notes&quot;: []}}, {&quot;id&quot;: &quot;lktg-2008-broken-balances-ternary-lower-bound&quot;, &quot;title&quot;: &quot;LKTG-2008: почему с одними сломанными весами нельзя найти монету из 3^k за k взвешиваний&quot;, &quot;fragment&quot;: &quot;impossibility&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;impossibility_problem&quot;, &quot;secondary&quot;: [&quot;lower_bound&quot;, &quot;fault_tolerance&quot;]}, &quot;language&quot;: &quot;en&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-lktg-2008-2-5b&quot;, &quot;title&quot;: &quot;No k-weighing strategy with one broken balance&quot;, &quot;text&quot;: &quot;There are \\(3^k\\) coins, one of which is false and lighter than the others. Any number of balances is available, but one of them is broken and may answer arbitrarily. Prove that it is impossible to find the false coin in \\(k\\) weighings.&quot;, &quot;source_ids&quot;: [&quot;src-lktg-2008-broken-balances-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-first-test-can-be-worthless&quot;, &quot;title&quot;: &quot;Первое сообщение может полностью принадлежать неисправному прибору&quot;, &quot;text&quot;: &quot;Если очередное взвешивание сделано на сломанном приборе, противник может выбрать ответ, сохраняющий много кандидатов. Поэтому обычная оценка \\(3^k\\) листьев недостаточна: нужно платить за неизвестную надежность канала.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;proof-broken-balance-k-weighing-lower-bound&quot;, &quot;title&quot;: &quot;Противник сохраняет не меньше трети кандидатов&quot;, &quot;text&quot;: &quot;После каждого взвешивания для любой конкретной монеты существует хотя бы один ответ весов, при котором эта монета остается возможной фальшивой: если ответ неудобен, можно считать использованные весы сломанными. Следовательно, найдется ответ, который отсекает не более двух третей текущих кандидатов и оставляет не меньше трети.\n\nПервое взвешивание в худшем случае вообще не дает надежной информации, потому что могло быть сделано на сломанном приборе. После \\(k\\) взвешиваний у противника остается не меньше \\(3^k/3^{k-1}=3\\) возможных монет, значит единственная фальшивая монета не определена.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;фальшивая монета и неизвестный сломанный прибор&quot;, &quot;observations&quot;: [&quot;до k трехисходных ответов, один источник может быть произвольным&quot;], &quot;allowed_actions&quot;: [&quot;использовать любые весы и любые сравнения&quot;], &quot;goal&quot;: [&quot;prove_no_strategy_identifies_false_coin&quot;], &quot;strategy_type&quot;: [&quot;adversary_argument&quot;, &quot;decision_tree_lower_bound&quot;], &quot;lower_bound_method&quot;: [&quot;adversary_preserves_candidates&quot;, &quot;faulty_channel&quot;], &quot;keywords&quot;: [&quot;broken_balance&quot;, &quot;lower_bound&quot;, &quot;lktg_2008&quot;, &quot;ternary&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_hard&quot;, &quot;local_score&quot;: 5, &quot;comment&quot;: &quot;Короткая, но концептуальная нижняя оценка для задач с ненадежными измерителями.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;counting_lower_bound&quot;, &quot;decision_tree_lower_bound&quot;, &quot;ternary_code&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-lktg-2008-broken-balances-solutions&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Карточка вынесена как чистый пример нижней оценки для неполной информации с одним ненадежным каналом.&quot;]}}, {&quot;id&quot;: &quot;aimo-2017-aimosia-three-coin-values&quot;, &quot;title&quot;: &quot;AIMO 2017: три скрытых номинала монет в Аймосии&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;state_elimination&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-aimo-2017-aimosia-coins&quot;, &quot;title&quot;: &quot;Определить сумму трех монет Джимми&quot;, &quot;text&quot;: &quot;В стране Аймосии есть три вида монет, и их достоинства - разные целые числа долларов. У Джека, Джилл и Джимми есть хотя бы по одной монете каждого вида. У Джека 4 монеты на сумму 28 долларов, у Джилл 5 монет на сумму 21 доллар, а у Джимми ровно 3 монеты. Нужно найти общую стоимость монет Джимми.&quot;, &quot;source_ids&quot;: [&quot;src-amt-aimo-2017-paper-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-one-extra-coin-encodes-collection&quot;, &quot;title&quot;: &quot;Суммы Джека и Джилл задают базовую тройку плюс добавочные монеты&quot;, &quot;text&quot;: &quot;Поскольку каждый участник имеет хотя бы по одной монете каждого вида, 4 монеты Джека - это одна полная тройка номиналов и еще одна монета, а 5 монет Джилл - полная тройка и еще две монеты. Скрытое состояние состоит не только из трех номиналов, но и из того, какие добавочные монеты попали в две известные коллекции.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-bound-sum-and-eliminate-extras&quot;, &quot;title&quot;: &quot;Ограничить сумму трех номиналов и перебрать тип добавочной монеты&quot;, &quot;text&quot;: &quot;Обозначим номиналы через a, b, c. В коллекции Джека сумма равна a+b+c+d=28, где d - один из номиналов. В коллекции Джилл сумма равна a+b+c+e=21, где e - сумма двух номиналов с повторениями. Из минимальности положительных разных номиналов и из этих двух равенств получается короткий набор случаев для d и e. Официальное решение исключает невозможные варианты и получает номиналы 2, 4 и 11. Так как у Джимми ровно три монеты и есть хотя бы по одной каждого вида, его сумма равна 17.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;три различных целых номинала монет и распределение добавочных монет в коллекциях Джека и Джилл&quot;, &quot;observations&quot;: [&quot;число монет и общая стоимость двух коллекций&quot;], &quot;allowed_actions&quot;: [&quot;сопоставлять возможные номиналы и кратности с двумя суммами&quot;], &quot;goal&quot;: [&quot;determine_value_of_jimmys_three_coins&quot;], &quot;strategy_type&quot;: [&quot;state_space_partition&quot;, &quot;case_elimination&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;aimo_2017&quot;, &quot;coin_values&quot;, &quot;hidden_denominations&quot;, &quot;aggregate_sums&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: &quot;positive integers&quot;, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: 0, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;recover_hidden_denominations_from_aggregate_information&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Короткая задача на скрытые номиналы: сложность в том, что неизвестны и значения монет, и кратности в известных суммах.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-amt-aimo-2017-paper-solutions&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;scope_review_needed&quot;, &quot;public_ready&quot;: false, &quot;relations_status&quot;: &quot;australia_batch&quot;, &quot;notes&quot;: [&quot;2026-05-18 scope-аудит: карточка снята с публичной готовности как статическая задача на восстановление номиналов по двум суммам; нет проектируемого канала наблюдений, вопросов, взвешиваний или стратегии передачи информации.&quot;]}}, {&quot;id&quot;: &quot;amc-2010-12a-p12-frogs-toads-truth-lie&quot;, &quot;title&quot;: &quot;AMC 2010 12A №12: лягушки, жабы и таблички&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_puzzle&quot;, &quot;multiple_choice&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-amc-2010-12a-p12&quot;, &quot;title&quot;: &quot;Кто говорит правду у двух дорожных табличек&quot;, &quot;text&quot;: &quot;На острове живут лягушки, которые всегда говорят правду, и жабы, которые всегда лгут. Путник подходит к развилке с двумя табличками: одна указывает верную дорогу, другая неверную. Рядом сидит существо, но неизвестно, лягушка это или жаба. Нужно выбрать вопрос, ответ на который позволит узнать верную дорогу.&quot;, &quot;source_ids&quot;: [&quot;src-aops-2010-amc12a-p12-index&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-normalize-frog-toad-answer&quot;, &quot;title&quot;: &quot;Спросить о том, что сказал бы сам собеседник&quot;, &quot;text&quot;: &quot;Прямой вопрос о дороге ненадежен: лягушка ответит правильно, а жаба инвертирует ответ. Если спросить о собственном будущем ответе собеседника, то у жабы возникает двойная инверсия: она солжет и о дороге, и о том, какой ответ дала бы.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-truth-table-for-two-types&quot;, &quot;title&quot;: &quot;Построить таблицу для правдивого и лжеца&quot;, &quot;text&quot;: &quot;Пусть нужно проверить, ведет ли левая табличка к верной дороге. Спрашиваем: «Если бы я спросил тебя, верно ли указывает левая табличка, ты ответил бы “да”?»\n\nЕсли существо лягушка, оно честно сообщает свой прямой ответ, поэтому «да» означает, что левая табличка верна. Если существо жаба, то на прямой вопрос она ответила бы «да» ровно тогда, когда левая табличка неверна; но теперь она лжет о своем ответе на этот прямой вопрос. Поэтому ее фактическое «да» снова означает, что левая табличка верна. В обоих случаях ответ имеет одну и ту же интерпретацию.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;тип существа и то, какая табличка указывает верную дорогу&quot;, &quot;observations&quot;: [&quot;один ответ да/нет на выбранный вопрос&quot;], &quot;allowed_actions&quot;: [&quot;задать один вложенный вопрос с ответом да/нет&quot;], &quot;goal&quot;: [&quot;choose_correct_sign&quot;], &quot;strategy_type&quot;: [&quot;lie_normalization&quot;, &quot;truth_table&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;amc_2010_12a&quot;, &quot;frogs&quot;, &quot;toads&quot;, &quot;truth_lie&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 1, &quot;lies_allowed&quot;: &quot;respondent may be systematic liar&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;choose_correct_sign&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Короткая AMC-версия стандартного приема с правдивцем и лжецом.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;truth_liar_normalization&quot;, &quot;self_reference_question&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-aops-2010-amc12a-p12-index&quot;, &quot;role&quot;: &quot;statement_index&quot;, &quot;status&quot;: &quot;source_verified&quot;}, {&quot;source_id&quot;: &quot;src-maa-2010-amc12a-solutions-mirror&quot;, &quot;role&quot;: &quot;official_solution_mirrored_pdf&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Официальный MAA-hosted PDF для 2010 AMC 12A не найден; решение сверено по зеркальной копии официального MAA solution pamphlet.&quot;]}}, {&quot;id&quot;: &quot;amc-2022-10a-p12-truth-liar-alternater&quot;, &quot;title&quot;: &quot;AMC 2022 10A №12: 31 ребенок и три типа ответов&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_p
