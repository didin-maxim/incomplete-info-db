ochure&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;strategy&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-cross-compare-two-copies&quot;, &quot;title&quot;: &quot;Сравнить одинаково устроенные скрытые тройки попарно&quot;, &quot;text&quot;: &quot;Две независимые копии одного набора весов дают дополнительную структуру: результаты сравнений \\(A_i\\) с \\(B_i\\) ограничены тем, что суммы весов в тройках \\(A\\) и \\(B\\) одинаковы.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-four-comparisons&quot;, &quot;title&quot;: &quot;Сначала сравнить две пары, затем добить симметричные случаи&quot;, &quot;text&quot;: &quot;Обозначим монеты Александра \\(A_1,A_2,A_3\\), а монеты Бориса \\(B_1,B_2,B_3\\). Первыми двумя взвешиваниями сравним \\(A_1\\) с \\(B_1\\) и \\(A_2\\) с \\(B_2\\).\n\nЕсли оба раза равенство, то и \\(A_3=B_3\\). Третьим взвешиванием сравним \\(A_1+A_2\\) с \\(A_3+B_3\\). Возможны только суммы 9+10 против 11+11, 9+11 против 10+10 или 10+11 против 9+9, поэтому определяется вес пары \\(A_3,B_3\\) и два оставшихся веса с точностью до порядка. Четвертым взвешиванием сравним \\(A_1\\) и \\(A_2\\).\n\nВ остальных случаях третьим взвешиванием сравним \\(A_3\\) и \\(B_3\\). С точностью до переименования остаются два типа. Если \\(A_1&lt;B_1\\), \\(A_2&lt;B_2\\), \\(A_3&gt;B_3\\), то \\(A_1,A_2\\) имеют веса 9 и 10, \\(A_3=11\\), \\(B_3=9\\), а \\(B_1,B_2\\) имеют веса 10 и 11; четвертое сравнение \\(A_1\\) с \\(A_2\\) завершает восстановление. Если \\(A_1&lt;B_1\\), \\(A_2&gt;B_2\\), \\(A_3=B_3\\), то \\(A_1=B_2\\) и \\(A_2=B_1\\); сравнение \\(A_1+A_2\\) с \\(A_3+B_3\\) определяет оставшиеся веса, а известное неравенство \\(A_1&lt;A_2\\) снимает порядок.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;36 раскладов: две независимые перестановки весов 9, 10, 11&quot;, &quot;observations&quot;: [&quot;четыре трехисходных сравнения на чашечных весах&quot;], &quot;allowed_actions&quot;: [&quot;сравнивать отдельные монеты или равные по числу пары монет&quot;], &quot;goal&quot;: [&quot;identify_all_six_weights&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;symmetry&quot;, &quot;state_space_partition&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;mmo_2022&quot;, &quot;two_copies&quot;, &quot;cross_comparison&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 6, &quot;counterfeit_count&quot;: 0, &quot;counterfeit_type&quot;: &quot;three_known_distinct_weights_in_each_copy&quot;, &quot;weighing_count&quot;: 4, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_all_weights&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;8 класс ММО; стратегия использует две одинаковые скрытые тройки.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;symmetry_breaking&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-mmo-2022-85-brochure&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Схема переписана из официального разбора ММО-2022.&quot;]}}, {&quot;id&quot;: &quot;mmo-2026-row-of-12-fakes-110-genuine&quot;, &quot;title&quot;: &quot;ММО-2026: найти 110 настоящих монет при скрытом ряде фальшивых&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-mmo-2026-8-4&quot;, &quot;title&quot;: &quot;Ряд из 12 фальшивых монет в квадрате 12 на 12&quot;, &quot;text&quot;: &quot;В квадрате \\(12\\times 12\\) лежат 144 внешне одинаковые золотые монеты. Среди них ровно 12 фальшивых монет, и они образуют один полный ряд: горизонтальный или вертикальный. Все настоящие монеты одинаковы по весу, а каждая фальшивая легче настоящей; фальшивые между собой могут весить по-разному. Можно сделать два взвешивания на чашечных весах без гирь. Можно ли гарантированно указать 110 настоящих монет?&quot;, &quot;source_ids&quot;: [&quot;src-mmo-2026-89-brochure&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;strategy&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-hit-main-diagonal&quot;, &quot;title&quot;: &quot;Сначала сузить набор возможных линий диагональю&quot;, &quot;text&quot;: &quot;Главная диагональ пересекает каждый возможный ряд фальшивых монет ровно в одной монете. Поэтому взвешивание двух четверок диагональных монет выделяет одну из трех групп по четыре возможные линии.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-weighings-lines&quot;, &quot;title&quot;: &quot;Две развилки по диагонали и двум клеткам&quot;, &quot;text&quot;: &quot;Рассмотрим главную диагональ и разделим ее 12 монет на три четверки. Первым взвешиванием сравним первую и вторую четверки. Если одна чаша легче, то фальшивая диагональная монета находится в соответствующей четверке; если равновесие, то в третьей четверке. По симметрии пусть после первого взвешивания возможны только первые четыре строки и первые четыре столбца.\n\nВторым взвешиванием положим на левую чашу монеты в позициях \\((1,1)\\) и \\((1,2)\\), а на правую - монеты \\((2,3)\\) и \\((2,4)\\). Фальшивый ряд не может дать фальшивые монеты одновременно на обеих чашах. Если легче левая чаша, возможны первая строка, первый столбец или второй столбец; если легче правая - вторая строка, третий столбец или четвертый столбец; если равновесие - третья или четвертая строка. Во всех случаях монеты вне перечисленных возможных рядов точно настоящие: в первых двух случаях их 110, в третьем 120.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-110-is-maximal&quot;, &quot;title&quot;: &quot;Почему нельзя гарантировать больше 110&quot;, &quot;text&quot;: &quot;Всего есть 24 возможных положения фальшивого ряда. Два взвешивания дают не более 9 исходов, поэтому для некоторого исхода останутся совместимыми не менее трех рядов. Если три ряда параллельны, вне их гарантированно настоящих монет не больше \\(144-3\\cdot 12=108\\). Если среди трех рядов есть два одного направления и один другого, их объединение имеет размер \\(3\\cdot 12-2\\), так что гарантированно настоящих не больше \\(144-34=110\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;24 положения фальшивого ряда: 12 строк или 12 столбцов&quot;, &quot;observations&quot;: [&quot;два трехисходных результата чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;класть любые множества монет на две чаши&quot;], &quot;goal&quot;: [&quot;certify_110_genuine_coins&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;state_space_partition&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_leaf_count&quot;, &quot;pigeonhole_principle&quot;], &quot;keywords&quot;: [&quot;mmo_2026&quot;, &quot;row_of_fake_coins&quot;, &quot;certify_genuine_objects&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 144, &quot;counterfeit_count&quot;: 12, &quot;counterfeit_type&quot;: &quot;lighter_row_variable_weights&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;certify_many_genuine_coins&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;8 класс ММО; сильная часть - не только стратегия, но и оптимальность числа 110.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;structural_constraint&quot;, &quot;decision_tree_lower_bound&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-mmo-2026-89-brochure&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Официальное решение переформулировано без рисунка; координаты второго взвешивания соответствуют случаю первых четырех диагональных монет.&quot;]}}, {&quot;id&quot;: &quot;nrich-balance-power-balanced-ternary&quot;, &quot;title&quot;: &quot;NRICH: Balance Power и сбалансированная троичная запись&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;nrich_problem&quot;, &quot;secondary&quot;: [&quot;measurement_encoding&quot;, &quot;balanced_ternary&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-nrich-balance-power&quot;, &quot;title&quot;: &quot;Какими гирями взвесить все целые массы&quot;, &quot;text&quot;: &quot;Нужно подобрать как можно меньше гирь, чтобы на чашечных весах взвешивать все целые массы от 1 до 60, если гири кладутся только на одну чашу, противоположную предмету. Затем тот же вопрос задается для всех масс от 1 до 1000 и от 1 до \\(n\\). Как изменится ответ, если гири разрешено класть на обе чаши, то есть часть гирь может лежать на той же чаше, что и предмет?&quot;, &quot;source_ids&quot;: [&quot;src-nrich-balance-power&quot;], &quot;status&quot;: &quot;source_verified&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-binary-one-pan&quot;, &quot;title&quot;: &quot;Одна сторона дает двоичный код&quot;, &quot;text&quot;: &quot;Если каждая гиря либо используется, либо нет, то набор гирь с массами \\(1,2,4,8,\\ldots\\) кодирует массу как сумму выбранных степеней двойки.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}, {&quot;id&quot;: &quot;idea-balanced-ternary-two-pans&quot;, &quot;title&quot;: &quot;Две стороны дают цифры -1, 0, 1&quot;, &quot;text&quot;: &quot;Если гирю можно положить и к предмету, и на противоположную чашу, ее вклад становится отрицательным, нулевым или положительным. Поэтому естественный набор масс - степени тройки, а представление массы становится сбалансированной троичной записью.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-powers-two-and-three&quot;, &quot;title&quot;: &quot;Степени 2 для одной чаши, степени 3 для двух чаш&quot;, &quot;text&quot;: &quot;Если гири разрешено класть только на чашу, противоположную предмету, то шесть гирь \\(1,2,4,8,16,32\\) взвешивают все массы от 1 до 63, значит и от 1 до 60. Для масс до 1000 достаточно десяти гирь \\(1,2,4,\\ldots,512\\), потому что ими покрываются массы до \\(2^{10}-1=1023\\).\n\nЕсли гири можно класть на обе чаши, каждая гиря получает коэффициент \\(-1,0\\) или \\(1\\). Тогда массы \\(1,3,9,27,81\\) покрывают весь диапазон от 1 до 121 по абсолютной величине, в частности 1-60. Например, 8 можно получить как \\(9-1\\), положив гирю 9 на чашу против предмета, а гирю 1 - вместе с предметом. В общем случае степени тройки работают потому, что каждая новая гиря \\(3^k\\) перекрывает весь предыдущий диапазон и добавляет соседний без разрывов.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;неизвестная целая масса предмета в заданном диапазоне&quot;, &quot;observations&quot;: [&quot;равновесие чашечных весов при выбранном размещении гирь&quot;], &quot;allowed_actions&quot;: [&quot;выбирать набор гирь и сторону для каждой гири&quot;], &quot;goal&quot;: [&quot;represent_every_integer_mass&quot;, &quot;minimize_number_of_weights&quot;], &quot;strategy_type&quot;: [&quot;binary_code&quot;, &quot;ternary_code&quot;, &quot;nonadaptive_strategy&quot;], &quot;lower_bound_method&quot;: [&quot;counting_range&quot;], &quot;keywords&quot;: [&quot;nrich&quot;, &quot;balance_power&quot;, &quot;balanced_ternary&quot;, &quot;powers_of_three&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 1000, &quot;counterfeit_count&quot;: 0, &quot;counterfeit_type&quot;: &quot;unknown_integer_mass&quot;, &quot;weighing_count&quot;: 1, &quot;outcome_count_per_weighing&quot;: 2, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;measure_all_integer_masses_with_few_weights&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Не фальшивая монета, а кодирование скрытой массы через размещение гирь на чашах.&quot;, &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;binary_code&quot;, &quot;ternary_code&quot;, &quot;weighted_sum_encoding&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-nrich-balance-power&quot;, &quot;role&quot;: &quot;official_statement_and_student_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;needs_human_review&quot;, &quot;public_ready&quot;: false, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Включено как релевантная задача о кодировании неизвестной массы; NRICH отмечает, что доказательство общей части остается открытым для учащихся.&quot;, &quot;2026-05-18: public_ready снят редакторской проверкой до ручной сверки.&quot;]}}, {&quot;id&quot;: &quot;nrich-nine-weights-two-three-weighings&quot;, &quot;title&quot;: &quot;NRICH: 9 Weights, тернарный поиск по весам&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;nrich_problem&quot;, &quot;secondary&quot;: [&quot;multi_part_problem&quot;, &quot;ternary_search&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-nrich-nine-weights&quot;, &quot;title&quot;: &quot;Девять, двадцать семь и неизвестное направление отличия&quot;, &quot;text&quot;: &quot;Даны 9 внешне одинаковых грузиков, один из которых немного тяжелее остальных. Можно ли всегда найти тяжелый грузик за два взвешивания на чашечных весах? Можно ли сделать то же самое для 10 грузиков? Затем дано 27 грузиков, один из которых тяжелее остальных: можно ли найти его за три взвешивания? Наконец, снова даны 9 грузиков, но известно только, что один отличается по весу, а тяжелее он или легче, неизвестно. Можно ли за три взвешивания найти отличающийся грузик и определить направление отличия? Можно ли так же гарантировать успех для 10 грузиков?&quot;, &quot;source_ids&quot;: [&quot;src-nrich-9-weights&quot;], &quot;status&quot;: &quot;source_verified&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-known-heavy-split-thirds&quot;, &quot;title&quot;: &quot;Когда направление известно, делить на три части&quot;, &quot;text&quot;: &quot;Если фальшивый грузик заведомо тяжелее, каждое взвешивание может выбрать одну из трех равных групп: левая тяжелее, правая тяжелее или обе нормальны и искомый вне весов.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}, {&quot;id&quot;: &quot;idea-unknown-sign-costs-extra-information&quot;, &quot;title&quot;: &quot;Неизвестное направление удваивает состояния&quot;, &quot;text&quot;: &quot;Когда грузик может быть как тяжелее, так и легче, скрытое состояние включает и номер грузика, и знак отличия. Поэтому задача с 9 грузиками уже содержит 18 вариантов, и стратегия должна кодировать не только предмет, но и направление.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-known-heavy-nine-and-twenty-seven&quot;, &quot;title&quot;: &quot;Известно, что один грузик тяжелее&quot;, &quot;text&quot;: &quot;Для 9 грузиков разделим их на три тройки. Взвесим первую тройку против второй. Если одна сторона тяжелее, искомый грузик в этой тройке; если равновесие, он в третьей. Вторым взвешиванием сравним два грузика из найденной тройки: более тяжелый и есть искомый, а при равновесии искомый - третий.\n\nДля 27 грузиков сначала разделим их на три девятки и одним взвешиванием найдем девятку, где лежит тяжелый грузик. Оставшиеся два взвешивания применяют предыдущую стратегию для 9 грузиков. Для 10 грузиков за два взвешивания гарантии нет: дерево имеет только \\(3^2=9\\) конечных исходов.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}, {&quot;id&quot;: &quot;str-nine-unknown-heavy-or-light&quot;, &quot;title&quot;: &quot;Когда неизвестно, тяжелее или легче&quot;, &quot;text&quot;: &quot;Один рабочий способ для 9 грузиков: сначала взвесить \\(1,2,3\\) против \\(4,5,6\\). Если равновесие, необычный грузик среди \\(7,8,9\\); вторым взвешиванием сравнить 7 с 8, а третьим при необходимости сравнить подозреваемый грузик с заведомо нормальным из первых шести, чтобы определить знак.\n\nЕсли первая чаша тяжелее, то возможны только состояния: 1,2,3 тяжелые или 4,5,6 легкие; грузики 7,8,9 нормальны. Вторым взвешиванием можно сравнить \\(1,4,7\\) против \\(2,5,8\\). Его исход оставляет не больше трех согласованных кандидатов, которые третьим взвешиванием различаются прямым сравнением пары подозреваемых или сравнением одного подозреваемого с нормальным грузиком. Случай, когда первая чаша легче, симметричен.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-ten-known-heavy-two-weighings&quot;, &quot;title&quot;: &quot;Десять известных тяжелых кандидатов не помещаются в два взвешивания&quot;, &quot;text&quot;: &quot;Если известно, что фальшивый грузик тяжелее, нужно различить \\(N\\) возможных номеров. За два взвешивания есть не больше девяти последовательностей исходов, поэтому для \\(N=10\\) гарантированной стратегии быть не может.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;номер отличающегося грузика; в последней части также знак отличия&quot;, &quot;observations&quot;: [&quot;две или три последовательные трехисходные реакции чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно выбирать равные по числу группы грузиков&quot;], &quot;goal&quot;: [&quot;identify_odd_weight&quot;, &quot;sometimes_identify_heavy_or_light&quot;, &quot;test_capacity_limits&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;ternary_search&quot;, &quot;decision_tree&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_leaf_count&quot;], &quot;keywords&quot;: [&quot;nrich&quot;, &quot;9_weights&quot;, &quot;known_heavier&quot;, &quot;unknown_heavy_or_light&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 9, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;known_heavier_then_heavier_or_lighter_unknown&quot;, &quot;weighing_count&quot;: 3, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objectiv м за два взвешивания?&quot;, &quot;source_ids&quot;: [&quot;src-nrich-spot-the-fake&quot;], &quot;status&quot;: &quot;source_verified&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-three-outcomes-two-levels&quot;, &quot;title&quot;: &quot;Два взвешивания дают не больше девяти листьев&quot;, &quot;text&quot;: &quot;У каждого взвешивания три исхода: левая чаша тяжелее, правая тяжелее или равновесие. Поэтому дерево из двух взвешиваний имеет не больше \\(3^2=9\\) конечных ответов.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-nine-coins-by-thirds&quot;, &quot;title&quot;: &quot;Разделить монеты на тройки&quot;, &quot;text&quot;: &quot;Сначала докажем верхнюю оценку. После двух взвешиваний возможно не больше девяти разных последовательностей исходов, а каждая монета должна соответствовать своему конечному ответу. Значит, \\(N\\le 9\\).\n\nДля девяти монет стратегия есть. Разделим их на группы \\(1,2,3\\), \\(4,5,6\\), \\(7,8,9\\). Сначала взвесим первую тройку против второй. Если одна тройка тяжелее, фальшивая монета в ней; если равновесие, фальшивая в третьей тройке. Вторым взвешиванием сравним две монеты из найденной тройки: если одна тяжелее, она фальшивая, а если равновесие, фальшивая третья. Поэтому максимальное значение \\(N\\) равно 9.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;information_lower_bound&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-more-than-nine-impossible&quot;, &quot;title&quot;: &quot;Больше девяти монет не различить&quot;, &quot;text&quot;: &quot;Два взвешивания на чашечных весах дают максимум \\(3^2=9\\) разных путей в дереве решений. Если монет больше девяти, две разные монеты неизбежно попадут в один и тот же путь исходов, и стратегия не сможет указать единственную фальшивую монету.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какая из N монет является единственной более тяжелой фальшивой&quot;, &quot;observations&quot;: [&quot;два трехисходных результата чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно сравнивать равные по числу группы монет&quot;], &quot;goal&quot;: [&quot;maximize_identifiable_coin_count&quot;, &quot;identify_heavy_counterfeit&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;decision_tree&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_leaf_count&quot;], &quot;keywords&quot;: [&quot;nrich&quot;, &quot;spot_the_fake&quot;, &quot;two_weighings&quot;, &quot;ternary_tree&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: 9, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;known_heavier&quot;, &quot;weighing_count&quot;: 2, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;find_maximum_n_and_strategy&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Оптимальная задача на дерево решений с простой конструкцией и оценкой.&quot;, &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;, &quot;decision_tree_lower_bound&quot;, &quot;ternary_search&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-nrich-spot-the-fake&quot;, &quot;r шивых монет&quot;, &quot;text&quot;: &quot;Если бы все 5 монет были настоящими, они весили бы 50 граммов. Наблюдаемый вес 48 граммов означает дефицит 2 грамма, то есть ровно две монеты фальшивые.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, {&quot;id&quot;: &quot;idea-three-binary-tests-separate-ten-pairs&quot;, &quot;title&quot;: &quot;Три взвешивания кодируют пару фальшивых монет&quot;, &quot;text&quot;: &quot;Каждой монете можно назначить двоичный столбец длины 3 так, чтобы суммы столбцов для любых двух монет различались. Тогда три дефицита веса однозначно декодируют неизвестную пару.&quot;, &quot;standard_idea_ids&quot;: [&quot;binary_encoding&quot;, &quot;weighted_sum_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-columns-000-100-010-001-111&quot;, &quot;title&quot;: &quot;Взвесить наборы по столбцам кода&quot;, &quot;text&quot;: &quot;Обозначим монеты A, B, C, D, E и назначим им столбцы \\(000,100,010,001,111\\). В первом взвешивании кладем монеты B и E, во втором - C и E, в третьем - D и E. Для каждого взвешивания сравниваем фактический вес с весом, который был бы у этих монет, если бы все они были настоящими; получаем число фальшивых монет в соответствующем наборе. Тройка таких дефицитов равна сумме двух столбцов фальшивых монет. Все 10 попарных сумм выбранных столбцов различны, поэтому пара фальшивых монет определяется однозначно.&quot;, &quot;standard_idea_ids&quot;: [&quot;binary_encoding&quot;, &quot;weighted_sum_encoding&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;digital_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;10 возможных пар фальшивых монет среди пяти&quot;, &quot;observations&quot;: [&quot;три числовых результата электронных взвешиваний; каждый результат дает дефицит веса  архива I OMG, задача 6; тот же текст включен в официальный семинар OMJ о разборе случаев. Решение записано русским пересказом через двоичное кодирование наборов.&quot;]}}, {&quot;id&quot;: &quot;problems-ru-107826-light-coin-limited-two-uses&quot;, &quot;title&quot;: &quot;problems.ru 107826: легкая монета при ограничении двух участий&quot;, &quot;fragment&quot;: &quot;weighings&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;web_archive_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;optimality&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Наибольшее число монет за n взвешиваний&quot;, &quot;text&quot;: &quot;Среди одинаковых на вид монет ровно одна фальшивая и известно, что она легче настоящих. Нужно определить наибольшее число монет, из которого можно гарантированно найти фальшивую за \\(n\\) взвешиваний на чашечных весах без гирь, если каждую монету разрешено класть на весы не более двух раз.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-107826&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;]}], &quot;special_case&quot;: [{&quot;id&quot;: &quot;stmt-n7-99-coins&quot;, &quot;title&quot;: &quot;99 монет за 7 взвешиваний&quot;, &quot;text&quot;: &quot;Частный случай \\(n=7\\): среди 99 монет одна легкая фальшивая; требуется найти ее за 7 взвешиваний, не взвешивая ни одну монету более двух раз.&quot;, &quot;source_ids&quot;: [&quot;src-problems-ru-107633&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-two-stage-limited-use&quot;, &quot;title&quot;: &quot;После перекоса остается задача с однократным использованием&quot;, &quot;text&quot;: &quot;Если первое неравновесное взвешивание кладет по \\(s\\) монет на чашу, то фальшивая лежит в легкой чаше, а эти \\(s\\) монет уже использованы один раз. Поэтому дальше их можно использовать только как в задаче, где каждую монету разрешено взвесить не более одного раза.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-decreasing-odd-groups&quot;, &quot;title&quot;: &quot;Взвешивать максимальные нечетные группы&quot;, &quot;text&quot;: &quot;Обозначим максимум через \\(f(n)\\). При одном оставшемся взвешивании можно различить только 3 монеты: сравнить две, а третью оставить вне весов. Для общего \\(n\\) сначала кладем на чаши по \\(2n-1\\) монет. Если равновесие, исключены \\(4n-2\\) настоящих монет и остается такая же задача на \\(f(n-1)\\) монетах. Если одна чаша легче, фальшивая среди \\(2n-1\\) монет этой чаши, и каждую из них можно использовать только один раз; за \\(n-1\\) дальнейших взвешиваний это ровно предельный размер \\(2(n-1)+1=2n-1\\). Повторяя, получаем емкость \\(f(n)=f(n-1)+2(2n-1)=2n^2+1\\). Конструкция достигает этой оценки: на шагах равновесия берем группы размеров \\(2n-1,2n-3,\\ldots,3,1\\), а после первого перекоса добираем поиском по парам внутри легкой группы.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;, &quot;decision_tree&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-recurrence-capacity&quot;, &quot;title&quot;: &quot;Рекуррентная верхняя оценка&quot;, &quot;text&quot;: &quot;Пусть в первом взвешивании на каждой чаше \\(s\\) монет. При неравновесии нужно уметь найти легкую фальшивую среди \\(s\\) уже использованных монет за \\(n-1\\) взвешиваний с однократным дальнейшим использованием, значит \\(s\\le 2n-1\\). При равновесии остается не более \\(f(n-1)\\) монет вне весов. Поэтому \\(f(n)\\le f(n-1)+2(2n-1)\\), что вместе с \\(f(1)=3\\) дает \\(f(n)\\le 2n^2+1\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;\\(2n^2+1\\) возможных положений легкой фальшивой монеты&quot;, &quot;observations&quot;: [&quot;до n исходов чашечных весов&quot;], &quot;allowed_actions&quot;: [&quot;адаптивные взвешивания равных групп&quot;, &quot;каждая монета участвует не более двух раз&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;, &quot;maximize_guaranteed_object_count&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;recurrence_strategy&quot;], &quot;lower_bound_method&quot;: [&quot;adversary_recurrence&quot;], &quot;keywords&quot;: [&quot;problems_ru_107826&quot;, &quot;problems_ru_107633&quot;, &quot;limited_use_weighing&quot;, &quot;2n^2_plus_1&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;weighing_profile&quot;: {&quot;object_count&quot;: &quot;2n^2+1&quot;, &quot;counterfeit_count&quot;: 1, &quot;counterfeit_type&quot;: &quot;lighter_known&quot;, &quot;weighing_count&quot;: &quot;n&quot;, &quot;outcome_count_per_weighing&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_hard&quot;, &quot;local_score&quot;: 5, &quot;comment&quot;: &quot;Оптимальная рекуррентная задача с дополнительным ограничением на число участий монеты.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;balance_scale&quot;, &quot;decision_tree_lower_bound&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-problems-ru-107826&quot;, &quot;role&quo ot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-identify-side-not-coin&quot;, &quot;title&quot;: &quot;Достаточно отличить знак отклонения, а не монету&quot;, &quot;text&quot;: &quot;Первое взвешивание выбирает большую группу, в которой знак фальши проявляется по-разному: если фальшивая внутри тяжелой половины, она тяжелая; если вне нее, то она легкая. Второе взвешивание проверяет, сохранился ли перекос при разбиении или сравнении с третьей группой.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-three-cases-100-99-98&quot;, &quot;title&quot;: &quot;Разбор 100, 99 и 98 монет&quot;, &quot;text&quot;: &quot;Для 100 монет сравним 50 и 50. Затем более тяжелую половину разобьем на две группы по 25 и сравним их. Если второе взвешивание дает равновесие, фальшивая монета была в другой половине и она легче; если нет, она в более тяжелой четверти и тяжелее.\n\nДля 99 монет разделим монеты на три группы по 33 и сравним две группы. При равновесии сравним одну из них с третьей: если третья легче, фальшивая легкая, иначе тяжелая. При неравенстве сравним более тяжелую из первых двух групп с третьей: равновесие означает легкую фальшивую в более легкой первой группе, новый перекос - тяжелую фальшивую.\n\nДля 98 монет отложим две монеты, остальные разделим на две группы по 48 и сравним. Если равновесие, сравним две отложенные монеты с любыми двумя уже уравновешенными: направление второго перекоса дает знак. Если первое взвешивание неравно, разобьем более тяжелую группу на две группы по 24 и сравним их; равновесие означает легкую фальшивую вне этой группы, неравенство - тяжелую внутри нее.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profil t;, &quot;title&quot;: &quot;Каждое взвешивание выбирает одну треть кандидатов&quot;, &quot;text&quot;: &quot;Если фальшивая монета заведомо легче, сравнение равных групп имеет три однозначных исхода: легкая монета слева, справа или вне взвешивания.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-9-3-1-search&quot;, &quot;title&quot;: &quot;Разбивать кандидатов на группы 9, 3, 1&quot;, &quot;text&quot;: &quot;Разделим 27 монет на три группы по 9 и сравним две из них. Если одна группа легче, фальшивая находится в ней; если равновесие, фальшивая в третьей группе. Затем выбранные 9 монет делим на три тройки и повторяем тот же прием. После второго взвешивания останутся 3 кандидата; третьим взвешиванием сравним две монеты из этой тройки. Более легкая из них фальшивая, а при равновесии фальшива третья монета.&quot;, &quot;standard_idea_ids&quot;: [&quot;ternary_weighing_code&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;balance_scale&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-three-needed-for-27&quot;, &quot;title&quot;: &quot;Два взвешивания не могут различить 27 монет&quot;, &quot;text&quot;: &quot;Два взвешивания имеют не более \\(3^2=9\\) последовательностей исходов, а возможных положений легкой фальшивой монеты 27. Поэтому трех взвешиваний в худшем случае необходимо.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;27 возможных положений единственной легкой монеты&quot;, &quot;observations&quot;: [&quot;три исхода каждого взвешивания&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно сравнивать равные по числу группы
