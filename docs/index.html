roblem&quot;, &quot;secondary&quot;: [&quot;logic_puzzle&quot;, &quot;multiple_choice&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-amc-2022-10a-p12&quot;, &quot;title&quot;: &quot;Сколько детей могли быть чередующимися&quot;, &quot;text&quot;: &quot;В комнате 31 ребенок. Каждый ребенок принадлежит к одному из трех типов: правдивец всегда говорит правду, лжец всегда лжет, а чередующийся при последовательных вопросах попеременно говорит правду и ложь. Каждому ребенку дважды подряд задали один и тот же вопрос: «Ты правдивец?» Сначала 22 ребенка ответили «да», потом 15 детей ответили «да». Нужно определить наибольшее возможное число чередующихся детей.&quot;, &quot;source_ids&quot;: [&quot;src-maa-2022-amc10a-problems&quot;, &quot;src-aops-2022-amc10a-p12-index&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-alternater-forces-one-true-one-false&quot;, &quot;title&quot;: &quot;Одинаковый вопрос разделяет три типа по парам ответов&quot;, &quot;text&quot;: &quot;На вопрос «Ты правдивец?» правдивец дважды отвечает «да», лжец дважды тоже отвечает «да», потому что правдивый ответ для него был бы «нет». Чередующийся на два одинаковых вопроса дает один ответ «да» и один ответ «нет». Поэтому только чередующиеся меняют вклад в число ответов «да» между первым и вторым раундом.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-count-stable-and-changing-yeses&quot;, &quot;title&quot;: &quot;Сравнить стабильные и меняющиеся ответы&quot;, &quot;text&quot;: &quot;Правдивцы и лжецы на оба вопроса отвечают «да», значит каждый такой ребенок добавляет по одному «да» и в первом, и во втором раунде. Чередующийся ребенок дает ровно один ответ «да» за два раунда: либо в первом, либо во втором.\n\nВсего за два раунда прозвучало 22 + 15 = 37 ответов «да». Если не чередующихся детей было \\(n\\), они дали \\(2n\\) ответов «да», а чередующиеся дали \\(31-n\\) ответов «да». Поэтому \\(2n + (31-n) = 37\\), откуда \\(n=6\\). Значит чередующихся могло быть \\(31-6=25\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;тип каждого из 31 ребенка: правдивец, лжец или чередующийся&quot;, &quot;observations&quot;: [&quot;22 ответа «да» на первый вопрос&quot;, &quot;15 ответов «да» на второй такой же вопрос&quot;], &quot;allowed_actions&quot;: [&quot;использовать правила правды, лжи и чередования для двух одинаковых вопросов&quot;], &quot;goal&quot;: [&quot;maximize_number_of_alternaters&quot;], &quot;strategy_type&quot;: [&quot;counting&quot;, &quot;structural_constraint&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;amc_2022_10a&quot;, &quot;truth_teller&quot;, &quot;liar&quot;, &quot;alternater&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet&quot;: [&quot;yes&quot;, &quot;no&quot;], &quot;question_count&quot;: 2, &quot;lie_count&quot;: &quot;truth-tellers, liars, and alternating truth-lie speakers&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;maximize_number_of_alternaters&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Ключ - заметить, что правдивец и лжец дают одинаковую пару ответов на вопрос о себе.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-maa-2022-amc10a-problems&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}, {&quot;source_id&quot;: &quot;src-maa-2022-amc10a-solutions&quot;, &quot;role&quot;: &quot;official_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}, {&quot;source_id&quot;: &quot;src-aops-2022-amc10a-p12-index&quot;, &quot;role&quot;: &quot;index_and_cross_check&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: []}}, {&quot;id&quot;: &quot;amc-au-2016-intermediate-q17-truth-liars-circle&quot;, &quot;title&quot;: &quot;Australian AMC 2016 Intermediate Q17: правдивцы и лжецы за кругом&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;state_elimination&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-amc-au-2016-i17-circle&quot;, &quot;title&quot;: &quot;Сколько человек говорят правду&quot;, &quot;text&quot;: &quot;Пять человек сидят по кругу. Некоторые из них всегда говорят правду, остальные всегда лгут. Каждый утверждает, что сидит между двумя лжецами. Сколько из них говорят правду?&quot;, &quot;source_ids&quot;: [&quot;src-amt-amc-2016-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;truth_value&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-local-truth-condition-on-cycle&quot;, &quot;title&quot;: &quot;Истинность фразы задает локальное условие на двух соседей&quot;, &quot;text&quot;: &quot;Правдивец действительно должен иметь двух соседей-лжецов. Лжец, наоборот, не может иметь двух соседей-лжецов. Поэтому на круге запрещены две соседние правдивые позиции и три подряд идущих лжеца.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-forbidden-runs-on-cycle&quot;, &quot;title&quot;: &quot;Исключить запрещенные соседства&quot;, &quot;text&quot;: &quot;Если кто-то правдив, то его два соседа - лжецы, значит две правдивые позиции рядом невозможны. Если бы три лжеца сидели подряд, средний лжец на самом деле сидел бы между двумя лжецами и сказал бы правду, что невозможно. На цикле из пяти мест эти два запрета оставляют чередование с двумя правдивцами и тремя лжецами. Поэтому ответ: 2.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;truth_value&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;тип каждого из пяти людей: правдивец или лжец&quot;, &quot;observations&quot;: [&quot;пять одинаковых публичных утверждений о двух соседях&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость истинности утверждения с типами соседей&quot;], &quot;goal&quot;: [&quot;determine_number_of_truth_tellers&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;local_consistency&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;australian_amc_2016&quot;, &quot;truth_tellers&quot;, &quot;liars&quot;, &quot;cycle&quot;, &quot;local_statement&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;some people are systematic liars&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;determine_number_of_truth_tellers&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Небольшая задача на локальные ограничения на круге.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;structural_constraint&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-amt-amc-2016-solutions&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;australia_batch&quot;, &quot;notes&quot;: [&quot;Официальная книга AMC 2016 Solutions доступна как легальный цифровой продукт AMT; карточка содержит краткий русский пересказ.&quot;]}}, {&quot;id&quot;: &quot;boolos-hardest-logic-puzzle&quot;, &quot;title&quot;: &quot;Три бога Boolos: нормализация лжи на неизвестном языке&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;classical_problem&quot;, &quot;secondary&quot;: [&quot;logic_puzzle&quot;, &quot;questions_with_lies&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-boolos-1996&quot;, &quot;title&quot;: &quot;Три вопроса на неизвестном языке&quot;, &quot;text&quot;: &quot;Перед вами три бога A, B и C. Один из них True и всегда говорит правду, один False и всегда лжет, один Random; Random при каждом ответе случайно ведет себя как правдивый или как лжец. Боги понимают русский, но отвечают только словами «da» и «ja», причем вы не знаете, какое из них означает «да». Можно задать три вопроса, каждый ровно одному богу, и следующие вопросы могут зависеть от предыдущих ответов. Как определить, кто есть кто?&quot;, &quot;source_ids&quot;: [&quot;src-boolos-hardest-logic-puzzle&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;, &quot;note&quot;: &quot;Используется версия, где Random на каждый вопрос произвольно отвечает как правдивый или как лжец; стратегия не полагается на содержательность его ответа.&quot;}, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-embedded-question-normalizes-language-and-lie&quot;, &quot;title&quot;: &quot;Вложенный вопрос нормализует и ложь, и неизвестные слова&quot;, &quot;text&quot;: &quot;Вопрос вида «Если бы я спросил тебя Q, сказал бы ты ja?» позволяет получить предсказуемый ответ от неслучайного бога, не зная, означает ли ja «да».&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-find-non-random-then-identify&quot;, &quot;title&quot;: &quot;Сначала найти неслучайного бога&quot;, &quot;text&quot;: &quot;Будем использовать нормализующий шаблон \\(N(Q)\\): «Если бы я спросил тебя \\(Q\\), сказал бы ты ja?» Для True и False ответ на \\(N(Q)\\) одинаково интерпретируется: ответ ja означает, что \\(Q\\) истинно, а ответ da означает, что \\(Q\\) ложно. Это работает потому, что лжец лжет и о своем гипотетическом ответе, а неизвестность значения ja/da компенсируется тем, что спрашивается именно о слове ja.\n\nПервый вопрос зададим A: \\(N(\\text{B является Random})\\). Если A сам не Random, ответ сообщает, является ли B Random; тогда один из B и C точно не Random. Если A является Random, то B и C оба не Random, и независимо от ответа можно выбрать одного из них как неслучайного по правилу: при ответе ja далее работаем с C, при ответе da далее работаем с B. Это правило гарантирует, что выбранный бог не Random.\n\nПусть выбранный неслучайный бог обозначен X, а два остальных - Y и Z. Второй вопрос X: \\(N(\\text{X является True})\\). По ответу узнаем, True он или False. Третий вопрос X: \\(N(\\text{Y является Random})\\). Теперь известно, кто из Y и Z Random; оставшийся неслучайный имеет тип, противоположный X. Так определяются все три роли.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;перестановка ролей True, False, Random и значение слов da/ja&quot;, &quot;observations&quot;: [&quot;ответы da/ja на адаптивные вопросы&quot;], &quot;allowed_actions&quot;: [&quot;задать три да-нет вопроса, каждый одному богу&quot;], &quot;goal&quot;: [&quot;identify_all_roles&quot;], &quot;strategy_type&quot;: [&quot;truth_liar_normalization&quot;, &quot;adaptive_questions&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;boolos&quot;, &quot;hardest_logic_puzzle&quot;, &quot;three_gods&quot;, &quot;unknown_yes_no&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 3, &quot;lies_allowed&quot;: &quot;one fixed liar plus one random-role respondent&quot;, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_roles_and_language&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_hard&quot;, &quot;local_score&quot;: 7, &quot;comment&quot;: &quot;Классическая сложная задача: нужно одновременно нормализовать ложь, неизвестные слова da/ja и роль Random.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;decision_tree&quot;, &quot;lie_detection&quot;, &quot;self_reference_question&quot;, &quot;truth_liar_normalization&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-boolos-hardest-logic-puzzle&quot;, &quot;role&quot;: &quot;original_article&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Публичный текст переведен на русский, так как источник англоязычный; трактовка Random явно указана.&quot;]}}, {&quot;id&quot;: &quot;cemc-2024-bcc-online-class-hidden-row&quot;, &quot;title&quot;: &quot;CEMC Beaver 2024: восстановить ряд учеников по соседям&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_puzzle&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-bcc-2024-online-class&quot;, &quot;title&quot;: &quot;Экран показывает соседей каждого ученика&quot;, &quot;text&quot;: &quot;Девять учеников сидят в библиотеке в один ряд, а учитель видит онлайн-урок со своего ноутбука. Для каждого ученика на экране указано, кто сидит справа и кто слева. Даны пары соседей: у Elke справа James и слева Diana; у Maya справа Raul и слева никого; у Busara справа Hannah и слева Anichka; у Lee справа Diana и слева Hannah; у Raul справа Anichka и слева Maya; у Hannah справа Lee и слева Busara; у Diana справа Elke и слева Lee; у Anichka справа Busara и слева Raul; у James справа никого и слева Elke. Кто сидит в середине ряда, то есть на пятом месте?&quot;, &quot;source_ids&quot;: [&quot;src-cemc-2024-bcc-7-8-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-neighbor-links-form-chain&quot;, &quot;title&quot;: &quot;Соседские сведения задают скрытую цепочку&quot;, &quot;text&quot;: &quot;Состояние - полный порядок учеников. Записи о левом и правом соседе являются локальными наблюдениями; если начать с края, где один сосед отсутствует, цепочка восстанавливается однозначно.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-chain-from-left-end&quot;, &quot;title&quot;: &quot;Начать с ученика без левого соседа&quot;, &quot;text&quot;: &quot;У Maya слева никого, значит она сидит первой слева. Справа от Maya сидит Raul; справа от Raul - Anichka; справа от Anichka - Busara; справа от Busara - Hannah; справа от Hannah - Lee; справа от Lee - Diana; справа от Diana - Elke; справа от Elke - James. Получаем ряд: Maya, Raul, Anichka, Busara, Hannah, Lee, Diana, Elke, James. Пятый ученик - Hannah.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;полный порядок девяти учеников в ряду&quot;, &quot;observations&quot;: [&quot;для каждого ученика известны ближайшие соседи слева и справа&quot;], &quot;allowed_actions&quot;: [&quot;соединять локальные сведения в одну цепочку&quot;], &quot;goal&quot;: [&quot;identify_middle_student&quot;], &quot;strategy_type&quot;: [&quot;constraint_propagation&quot;, &quot;chain_reconstruction&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;beaver_2024&quot;, &quot;online_class&quot;, &quot;hidden_order&quot;, &quot;neighbors&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet&quot;: [&quot;student_name&quot;], &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;determine_middle_position&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Восстановление цепочки из локальных наблюдений.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-cemc-2024-bcc-7-8-solutions&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;scope_review_needed&quot;, &quot;public_ready&quot;: false, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;2026-05-18 scope-аудит: карточка снята с публичной готовности как обычное восстановление цепочки по полной таблице соседей; неполная информация здесь слишком близка к общей задаче на ограничения, без проектирования стратегии запросов или кодирования.&quot;]}}, {&quot;id&quot;: &quot;cemc-2025-bcc-flower-pots-key-parity&quot;, &quot;title&quot;: &quot;CEMC Beaver 2025: горшки с цветами кодируют место ключа&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-bcc-2025-flower-pots&quot;, &quot;title&quot;: &quot;Четность цветов направляет поиск ключа&quot;, &quot;text&quot;: &quot;Бобр ставит в ряд восемь горшков \\(A,B,C,D,E,F,G,H\\) и прячет ключ под одним из них. В некоторые горшки он сажает по одному цветку, чтобы друг мог найти ключ по правилу: если в рассматриваемом отрезке горшков общее число цветов четно, ключ в левой половине; если нечетно, ключ в правой половине. Затем рассматривается только выбранная половина, и правило повторяется, пока не останется один горшок. Ключ спрятан под горшком \\(C\\). Нужно выбрать такой ряд цветов из предложенных вариантов, который приведет друга к горшку \\(C\\). Варианты можно записать по горшкам с цветами: (A) \\(A,C,D,E,F,H\\); (B) \\(A,B,D,E,F,H\\); (C) \\(C,F\\); (D) \\(D,G\\).&quot;, &quot;source_ids&quot;: [&quot;src-cemc-2025-bcc-7-8-contest&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-parity-bits-select-halves&quot;, &quot;title&quot;: &quot;Каждая четность дает один бит маршрута&quot;, &quot;text&quot;: &quot;Чтобы попасть в \\(C\\), путь деления пополам должен быть: левая половина \\(A-D\\), затем правая половина \\(C-D\\), затем левая половина \\(C\\). Значит, нужные проверки четности должны дать последовательность: четно, нечетно, четно.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-check-parity-route-to-c&quot;, &quot;title&quot;: &quot;Проверить четности на трех уровнях&quot;, &quot;text&quot;: &quot;Для правильного варианта A всего в восьми горшках 6 цветов, это четное число, поэтому выбирается левая половина \\(A,B,C,D\\). В этих четырех горшках 3 цветка, это нечетное число, поэтому выбирается правая половина \\(C,D\\). В горшках \\(C,D\\) 2 цветка, это четное число, поэтому выбирается левая половина, то есть \\(C\\).\n\nВ остальных вариантах первые два шага также доводят до пары \\(C,D\\), но в этой паре ровно 1 цветок. Тогда последний шаг ведет вправо, к \\(D\\), а не к \\(C\\). Поэтому подходит только вариант A.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;decision_tree&quot;], &quot;examples&quot;: [{&quot;type&quot;: &quot;image&quot;, &quot;asset&quot;: &quot;data/assets/examples/cemc-2025-bcc-flower-pots-key-parity/flower-pots-options.png&quot;, &quot;caption&quot;: &quot;Официальные варианты ответа: A имеет цветы в A,C,D,E,F,H; B - в A,B,D,E,F,H; C - в C,F; D - в D,G.&quot;, &quot;alt&quot;: &quot;Четыре ряда из восьми горшков A-H. В варианте A цветы стоят в A,C,D,E,F,H; в B - A,B,D,E,F,H; в C - C,F; в D - D,G.&quot;}]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;горшок, под которым спрятан ключ, и цветочный код на горшках&quot;, &quot;observations&quot;: [&quot;четность числа цветов в текущем подотрезке&quot;], &quot;allowed_actions&quot;: [&quot;повторно делить текущий отрезок пополам по четности&quot;], &quot;goal&quot;: [&quot;encode_hidden_key_location&quot;], &quot;strategy_type&quot;: [&quot;binary_decision_path&quot;, &quot;parity_signal&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;beaver_2025&quot;, &quot;flower_pots&quot;, &quot;hidden_key&quot;, &quot;parity&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet&quot;: [&quot;left&quot;, &quot;right&quot;], &quot;question_count&quot;: 3, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;locate_hidden_key&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Двоичный маршрут задается тремя проверками четности.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;parity&quot;, &quot;binary_code&quot;, &quot;decision_tree&quot;, &quot;single_bit_signal&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-cemc-2025-bcc-7-8-contest&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}, {&quot;source_id&quot;: &quot;src-cemc-2025-bcc-7-8-solutions&quot;, &quot;role&quot;: &quot;official_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Варианты ответа перенесены как локальный asset и продублированы текстовым описанием.&quot;]}}, {&quot;id&quot;: &quot;cemc-2025-pascal-three-question-quiz&quot;, &quot;title&quot;: &quot;CEMC Pascal 2025: скрытые правильные ответы теста&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_puzzle&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-pascal-2025-q15&quot;, &quot;title&quot;: &quot;Три ученика, три вопроса, у каждого ровно две верные ответы&quot;, &quot;text&quot;: &quot;Три ученика написали тест из трех вопросов. Учитель записал их ответы. Ученик A ответил: \\(15,36,24\\). Ученик B ответил: \\(20,38,24\\). Ученик C ответил: \\(15,54,24\\). Каждый ученик ответил ровно на два вопроса правильно. Чему равна сумма правильных ответов на три вопроса?&quot;, &quot;source_ids&quot;: [&quot;src-cemc-2025-pascal-contest&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-one-wrong-answer-per-student&quot;, &quot;title&quot;: &quot;Ровно одна ошибка у каждого исключает невозможные ключи&quot;, &quot;text&quot;: &quot;Скрытое состояние - тройка правильных ответов. Условие \&quot;у каждого ровно два правильных\&quot; означает \&quot;у каждого ровно одна ошибка\&quot;, и это жестко связывает столбцы таблицы.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-eliminate-wrong-third-and-first&quot;, &quot;title&quot;: &quot;Сначала зафиксировать общий третий ответ&quot;, &quot;text&quot;: &quot;Если третий правильный ответ не равен 24, то все три ученика ошиблись в третьем вопросе. Тогда, поскольку у каждого ровно одна ошибка, все трое должны были бы правильно ответить на второй вопрос. Но во втором вопросе их ответы разные: 36, 38 и 54. Это невозможно. Значит, третий правильный ответ равен 24.\n\nТеперь предположим, что первый правильный ответ не равен 15. Тогда ученики A и C ошиблись бы в первом вопросе, а значит оба должны были бы правильно ответить на второй. Но у них во втором вопросе разные ответы, 36 и 54. Это невозможно. Значит, первый правильный ответ равен 15.\n\nУченик B ошибся в первом вопросе, поэтому его ответы на второй и третий вопросы верны. Второй правильный ответ равен 38. Сумма правильных ответов: \\(15+38+24=77\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;тройка правильных ответов на вопросы теста&quot;, &quot;observations&quot;: [&quot;таблица ответов трех учеников&quot;, &quot;каждый ученик имеет ровно два правильных ответа&quot;], &quot;allowed_actions&quot;: [&quot;исключать варианты ключа, нарушающие число ошибок&quot;], &quot;goal&quot;: [&quot;determine_sum_of_correct_answers&quot;], &quot;strategy_type&quot;: [&quot;knowledge_elimination&quot;, &quot;consistency_check&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;pascal_2025&quot;, &quot;quiz_answers&quot;, &quot;hidden_answer_key&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet&quot;: [&quot;integer_answer_key&quot;], &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;recover_hidden_answer_key_sum&quot;}, &quot;difficulty&quot;: {&quot;main& то сразу после меня, и после A не будет мальчиков». D: «C прав, и после A не будет девочек». Известно, что среди участников два мальчика и две девочки, а из четырех высказываний ровно два оказались истинными и ровно два ложными. Найдите итоговые места и пол всех участников.&quot;, &quot;source_ids&quot;: [&quot;src-estonian-1995-96-selected-problems&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-self-referential-truth-count&quot;, &quot;title&quot;: &quot;Истинность C связывает пол и истинность мальчиков&quot;, &quot;text&quot;: &quot;Фраза C одновременно задает условие о местах, о поле участников после A и о ложности фраз всех мальчиков. Поэтому удобно искать совместимое состояние: места, пол и четыре значения истинности.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-force-c-and-d&quot;, &quot;title&quot;: &quot;Получить единственное совместимое состояние&quot;, &quot;text&quot;: &quot;Если фраза C истинна, то все мальчики сказали ложь, D идет сразу после C, а после A нет мальчиков. Фраза D тогда истинна ровно тогда, когда после A нет девочек. Единственная расстановка, при которой истинны ровно две фразы, такова: C на первом месте, D на втором, B на третьем, A на четвертом; A и B - мальчики, C и D - девочки. Тогда A и B действительно сказали ложь, а C и D - правду. Если пытаться сделать C ложной, условие D «C прав» уже делает D ложной или требует невозможной второй истинной фразы вместе с ограничениями на два пола и два первых места; полный перебор конечных вариантов не дает другого состояния.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;перестановка мест A,B,C,D; пол каждого участника; истинность четырех предсказаний&quot;, &quot;observations&quot;: [&quot;четыре публичных высказывания&quot;, &quot;ровно два мальчика и две девочки&quot;, &quot;ровно две истинные фразы&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость конечных состояний&quot;], &quot;goal&quot;: [&quot;identify_full_hidden_state&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;self_reference&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;estonian_1995_96&quot;, &quot;exactly_two_true&quot;, &quot;statements&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 24, &quot;question_count&quot;: 0, &quot;lies_allowed&quot;: &quot;среди четырех публичных высказываний ровно два истинны и ровно два ложны&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;determine_places_and_genders&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Небольшая самоссылочная проверка совместимости; полное доказательство единственности лучше перепроверить вручную.&quot;, &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;tags&quot;: [&quot;self_reference_truth&quot;, &quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-estonian-1995-96-selected-problems&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;needs_human_review&quot;, &quot;public_ready&quot;: false, &quot;relations_status&quot;: &quot;estonian_batch&quot;, &quot;notes&quot;: [&quot;Официальный английский буклет дает условие без решения; ответ проверен конечным перебором, но развернутое ручное доказательство единственности оставлено на review.&quot;]}}, {&quot;id&quot;: &quot;estonian-1995-96-round2-fire-streets-truth-lie-alternate&quot;, &quot;title&quot;: &quot;Эстония 1995-96, 2-й тур: пожар на улицах правды, лжи и чередования&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;На какую улицу ехать пожарным&quot;, &quot;text&quot;: &quot;В городе есть три улицы: T, L и H. Жители улицы T всегда говорят правду, жители улицы L всегда лгут, а у жителей улицы H истинные и ложные фразы в речи чередуются. Пожарные увидели над городом дым, и тут же зазвонил телефон. Звонивший сказал: «На нашей улице пожар!» Пожарный спросил: «Что это за улица?» Звонивший ответил: «Улица H». На какую улицу должны ехать пожарные?&quot;, &quot;source_ids&quot;: [&quot;src-estonian-1995-96-selected-problems&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-test-caller-street&quot;, &quot;title&quot;: &quot;Проверить тип звонившего по двум фразам&quot;, &quot;text&quot;: &quot;Скрытое состояние состоит из двух частей: с какой улицы звонит человек и где пожар. Две его фразы должны иметь допустимый рисунок истинности для улицы звонившего: две истины, две лжи или чередование.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-eliminate-streets&quot;, &quot;title&quot;: &quot;Исключить T и H, затем определить пожар&quot;, &quot;text&quot;: &quot;Если звонивший живет на T, то обе фразы должны быть истинными. Тогда пожар должен быть на T из первой фразы и на H из второй, что невозможно. Если звонивший живет на H, то обе фразы имеют одну и ту же истинность: обе истинны при пожаре на H и обе ложны при пожаре не на H; чередования нет. Значит, звонивший с улицы L, и обе его фразы ложны. Первая фраза тогда дает: пожар не на L. Вторая дает: пожар не на H. Остается улица T.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;улица звонившего и улица, на которой горит пожар&quot;, &quot;observations&quot;: [&quot;две публичные фразы звонившего&quot;], &quot;allowed_actions&quot;: [&quot;сопоставлять истинность фраз с типом улицы&quot;], &quot;goal&quot;: [&quot;determine_hidden_location&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;truth_liar_normalization&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;estonian_1995_96&quot;, &quot;truth_lie_alternate&quot;, &quot;fire_street&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 3, &quot;question_count&quot;: 2, &quot;lies_allowed&quot;: &quot;у жителей L все фразы ложны, у жителей H истинность соседних фраз чередуется&quot;, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;determine_fire_street&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Короткий перебор трех типов говорящего.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;truth_liar_normalization&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-estonian-1995-96-selected-problems&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;estonian_batch&quot;, &quot;notes&quot;: [&quot;Официальный английский буклет дает условие без решения; решение является коротким исчерпывающим перебором трех типов улиц.&quot;]}}, {&quot;id&quot;: &quot;estonian-2003-04-liarians-2004-days&quot;, &quot;title&quot;: &quot;Эстония 2003-04: лиариане и 2004 дня правды и лжи&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Сколько дней в году каждый лжет&quot;, &quot;text&quot;: &quot;На планете лиариан год состоит из 2004 дней. Для каждого жителя каждый день является либо днем правды, когда он говорит только правду, либо днем лжи, когда он всегда лжет; дней каждого типа может быть и 0. Каждый день трех лиариан спрашивали: «Сколько дней в году ты лжешь?» В день k первый отвечал: «Ровно k дней», второй: «Не меньше k дней», третий: «Не больше k дней» для k = 1, 2, ..., 2004. Сколько дней в году на самом деле лжет каждый из трех лиариан?&quot;, &quot;source_ids&quot;: [&quot;src-estonian-2003-04-selected-problems&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-truth-days-as-fixed-points&quot;, &quot;title&quot;: &quot;Число дней лжи определяет, какие ответы истинны&quot;, &quot;text&quot;: &quot;Если лиариан лжет n дней в году, то ровно 2004 - n его ответов должны быть истинными. Для трех типов ответов истинные дни считаются напрямую: один день, начальный отрезок или конечный отрезок.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-count-truth-days&quot;, &quot;title&quot;: &quot;Посчитать истинные ответы для каждого типа фраз&quot;, &quot;text&quot;: &quot;У первого лиариана ответы «ровно k» попарно несовместимы, значит истинным может быть не более одного. Лгать все 2004 дней он не может: тогда ответ «ровно 2004» был бы истинным. Значит он говорит правду ровно один день, а лжет 2003 дня; истинный ответ был в день 2003. Пусть второй лжет n дней. Его фраза «не меньше k» истинна ровно для k &lt;= n, то есть в n дней, а ложна в 2004 - n дней. Но число ложных дней равно n, поэтому n = 2004 - n и n = 1002. Пусть третий лжет n дней. Если n &gt;= 1, то фраза «не больше k» ложна для k &lt; n и истинна для k &gt;= n, то есть ложных ответов n - 1, противоречие. При n = 0 все его ответы истинны, что подходит. Ответ: первый лжет 2003 дня, второй 1002 дня, третий 0 дней.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;для каждого из трех лиариан число дней лжи в году&quot;, &quot;observations&quot;: [&quot;2004 ответов каждого лиариана с разными порогами k&quot;], &quot;allowed_actions&quot;: [&quot;считать, сколько ответов истинно при заданном числе дней лжи&quot;], &quot;goal&quot;: [&quot;determine_number_of_lie_days&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;fixed_point&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;estonian_2003_04&quot;, &quot;liarians&quot;, &quot;truth_days&quot;, &quot;lie_days&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2005, &quot;question_count&quot;: 2004, &quot;lies_allowed&quot;: &quot;у каждого лиариана заранее фиксирован набор дней лжи; в эти дни все его ответы ложны&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;determine_lie_day_counts&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Три независимых подсчета истинных ответов по числу дней лжи.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;self_reference_truth&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-estonian-2003-04-selected-problems&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;estonian_batch&quot;, &quot;notes&quot;: [&quot;Официальный английский буклет содержит условие, ответ и решение; карточка является русским пересказом.&quot;]}}, {&quot;id&quot;: &quot;estonian-2018-19-three-monks-weekdays&quot;, &quot;title&quot;: &quot;Эстония 2018-19: три монаха и два соседних дня лжи&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;В какой день никто не лжет&quot;, &quot;text&quot;: &quot;Три монаха медитируют в пещере. Каждый монах лжет в два соседних дня недели, а во все остальные дни говорит правду. Никакие два монаха не лгут в один и тот же день. В понедельник один монах сказал: «Вчера я лгал». На следующий день второй монах сказал: «Забавное совпадение: я тоже вчера лгал». В какой день недели ни один монах не лжет?&quot;, &quot;source_ids&quot;: [&quot;src-estonian-2018-19-selected-problems&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-yesterday-statement-pins-neighboring-lie-days&quot;, &quot;title&quot;: &quot;Фраза о вчерашней лжи связывает два соседних дня&quot;, &quot;text&quot;: &quot;Если фраза «вчера я лгал» истинна, то предыдущий день входит в пару дней лжи говорящего, а текущий день не входит. Если фраза ложна, то предыдущий день не был днем лжи, а текущий день был.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-eliminate-monday-liars&quot;, &quot;title&quot;: &quot;Исключить ложь каждого монаха в понедельник&quot;, &quot;text&quot;: &quot;Первый монах не мог лгать в понедельник: тогда из ложности фразы следовало бы, что в воскресенье он не лгал, а два соседних дня лжи были бы понедельник и вторник; но это сделало бы невозможной вторничную фразу второго монаха без совпадения дней лжи. Значит первый говорит правду в понедельник и лгал в воскресенье. Второй монах не мог лгать в понедельник: тогда во вторник его фраза «вчера я лгал» была бы истинной, а его два дня лжи были бы воскресенье и понедельник, совпадая с воскресной ложью первого. Поэтому второй говорит правду в понедельник; во вторник его фраза ложна, значит он лжет во вторник. Третий не может лгать в понедельник, потому что тогда второй его соседний день лжи был бы воскресеньем или вторником, уже занятым первым или вторым монахом. Следовательно, в понедельник не лжет никто.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;для каждого монаха пара соседних дней недели, когда он лжет&quot;, &quot;observations&quot;: [&quot;фраза первого монаха в понедельник&quot;, &quot;фраза второго монаха во вторник&quot;, &quot;запрет совпадения дней лжи у разных монахов&quot;], &quot;allowed_actions&quot;: [&quot;проверять совместимость недельных расписаний лжи&quot;], &quot;goal&quot;: [&quot;determine_day_with_no_liars&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;structural_constraint&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;estonian_2018_19&quot;, &quot;monks&quot;, &quot;weekdays&quot;, &quot;consecutive_lie_days&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 7, &quot;question_count&quot;: 2, &quot;lies_allowed&quot;: &quot;каждый монах лжет ровно в два соседних дня недели; дни лжи разных монахов не совпадают&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;find_day_with_no_liars&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Небольшой разбор недельных случаев с запретом совпадения дней лжи.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;, &quot;structural_constraint&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-estonian-2018-19-selected-problems&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;
