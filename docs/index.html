xt&quot;: &quot;Если \\(N\\le 2^q\\), назначим каждому объекту различное двоичное слово длины \\(q\\). Вопрос номер \\(i\\): равен ли \\(i\\)-й бит слова скрытого объекта единице. Полученные ответы дают ровно назначенное слово, значит объект найден.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-only-2q-answer-words&quot;, &quot;title&quot;: &quot;Больше \\(2^q\\) объектов различить нельзя&quot;, &quot;text&quot;: &quot;Существует только \\(2^q\\) разных двоичных наборов ответов. Если объектов больше, две разные скрытые возможности дадут один и тот же набор ответов на все заранее выбранные вопросы. После такого наблюдения их невозможно различить.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;N возможных объектов&quot;, &quot;observations&quot;: [&quot;двоичное слово длины q&quot;], &quot;allowed_actions&quot;: [&quot;заранее выбрать \\(q\\) вопросов да/нет&quot;], &quot;goal&quot;: [&quot;identify_hidden_object&quot;], &quot;strategy_type&quot;: [&quot;nonadaptive_strategy&quot;, &quot;encoding&quot;], &quot;lower_bound_method&quot;: [&quot;answer_word_count&quot;], &quot;keywords&quot;: [&quot;nonadaptive_questions&quot;, &quot;binary_code&quot;, &quot;state_space&quot;, &quot;N_q_parameterized&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: &quot;ceil(log2 N)&quot;, &quot;lies_allowed&quot;: 0, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_one_of_N_states&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 1, &quot;comment&quot;: &quot;Базовая кодовая интерпретация неадаптивных вопросов.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;binary_code&quot;, &quot;nonadaptive_strategy&quot;, &quot;counting_lower_bound&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-folklore&quot;, &quot;role&quot;: &quot;folklore_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;seed_links&quot;, &quot;generalization_status&quot;: &quot;already_parameterized_same_solution&quot;, &quot;notes&quot;: [&quot;2026-05-18: карточка уже является общей N/q-формой для неадаптивных двоичных вопросов; числовые частные случаи не нужны.&quot;]}}, {&quot;id&quot;: &quot;inmo-2021-p4-detective-consecutive-cards&quot;, &quot;title&quot;: &quot;INMO 2021 №4: детектив ищет две соседние карты&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;optimality&quot;, &quot;adversary_argument&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-inmo-2021-p4&quot;, &quot;title&quot;: &quot;Вопросы о соседних числах на закрытых картах&quot;, &quot;text&quot;: &quot;Фокусник кладет на стол лицом вниз карты с числами от 1 до 52. За один ход детектив выбирает две карты и спрашивает, стоят ли написанные на них числа подряд; фокусник отвечает правдиво. После конечного числа таких ходов детектив указывает две карты и выигрывает, если на них действительно стоят последовательные числа. Докажите, что детектив может гарантировать выигрыш тогда и только тогда, когда ему разрешено задать не меньше 50 вопросов.&quot;, &quot;source_ids&quot;: [&quot;src-hbcse-inmo-2021-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;, &quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-fixed-card-star&quot;, &quot;title&quot;: &quot;Одна фиксированная карта оставляет ровно один непроверенный соседний шанс&quot;, &quot;text&quot;: &quot;Если сравнить выбранную карту со всеми остальными, кроме одной, то либо уже получен ответ «да», либо единственная не проверенная с ней карта вынужденно является соседней по числу.&quot;, &quot;standard_idea_ids&quot;: [&quot;adaptive_questions&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, {&quot;id&quot;: &quot;idea-no-answers-as-missing-edges&quot;, &quot;title&quot;: &quot;Отрицательные ответы удаляют ребра, но гамильтонов путь еще может остаться&quot;, &quot;text&quot;: &quot;Ответы «нет» можно читать как запреты на пары позиций, которым нельзя назначить соседние числа. Чтобы показать недостаточность 49 вопросов, нужно доказать, что после удаления 50 таких запретных пар все еще можно расставить числа вдоль пути, обходящего все позиции.&quot;, &quot;standard_idea_ids&quot;: [&quot;adversary_strategy&quot;, &quot;indistinguishability&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-ask-one-card-against-fifty&quot;, &quot;title&quot;: &quot;Сравнить одну карту с пятьюдесятью другими&quot;, &quot;text&quot;: &quot;Выберем карту \\(A\\). Детектив спрашивает про пары \\(A\\) с 50 из остальных 51 карт. Если на каком-то вопросе ответ «да», найденная пара уже выигрышная. Если все 50 ответов «нет», то единственная карта, которую не сравнивали с \\(A\\), обязана быть соседней с \\(A\\): у любого числа от 1 до 52 есть хотя бы один сосед, а все остальные кандидаты были исключены отрицательными ответами. Поэтому 50 вопросов достаточно.&quot;, &quot;standard_idea_ids&quot;: [&quot;adaptive_questions&quot;, &quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-forty-nine-questions-not-enough&quot;, &quot;title&quot;: &quot;Сорока девяти вопросов недостаточно&quot;, &quot;text&quot;: &quot;Пусть детектив сделал 49 обычных вопросов и затем указал финальную пару; всего есть 50 пар, для которых фокуснику нужно согласованно ответить или сделать итоговый выбор проигрышным для детектива. Рассмотрим граф на 52 позициях карт и удалим эти 50 пар. Официальное решение доказывает, что после удаления любых \\(N-2\\) ребер из полного графа \\(K_N\\) при \\(N&gt;3\\) остается гамильтонов путь. Для \\(N=52\\) значит, что оставшиеся допустимые ребра можно расположить в путь из 52 вершин и подписать их числами \\(1,2,\\ldots,52\\) вдоль пути. Тогда все 50 удаленных пар получают несоседние числа, поэтому все ответы «нет» и финальная неудачная пара согласованы с некоторой раскладкой. Следовательно, при 49 вопросах детектив не может гарантировать выигрыш.&quot;, &quot;standard_idea_ids&quot;: [&quot;adversary_strategy&quot;, &quot;graph_path_argument&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;, &quot;state_space&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;перестановка чисел 1..52 на закрытых позициях карт&quot;, &quot;observations&quot;: [&quot;правдивые ответы да/нет на вопросы о том, являются ли две выбранные карты последовательными по числам&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно выбирать пары карт для вопроса&quot;, &quot;после вопросов указать финальную пару&quot;], &quot;goal&quot;: [&quot;guarantee_find_consecutive_pair&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;knowledge_elimination&quot;, &quot;adversary_argument&quot;], &quot;lower_bound_method&quot;: [&quot;graph_adversary&quot;, &quot;indistinguishability&quot;], &quot;keywords&quot;: [&quot;inmo_2021&quot;, &quot;detective&quot;, &quot;magician&quot;, &quot;cards&quot;, &quot;consecutive_numbers&quot;, &quot;truthful_answers&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 50, &quot;lies_allowed&quot;: 0, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;find_one_consecutive_pair&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_hard&quot;, &quot;local_score&quot;: 5, &quot;comment&quot;: &quot;Верхняя оценка короткая, нижняя требует нетривиального графового аргумента против любой стратегии детектива.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;decision_tree&quot;, &quot;indistinguishability_argument&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-hbcse-inmo-2021-solutions&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;india_hbcse_batch&quot;, &quot;notes&quot;: [&quot;Официальный PDF HBCSE/TIFR: INMO 2021 Official Solutions, Problem 4, pages 5-6.&quot;, &quot;При поиске по архивам HBCSE/RMO/INMO большинство совпадений по keywords относились к геометрическим фразам вроде &#x27;lies on&#x27; или служебному слову &#x27;question&#x27;; новых задач про лжецов, взвешивания или скрытую информацию среди проверенных официальных материалов не найдено.&quot;]}}, {&quot;id&quot;: &quot;komal-2011-a542-thousand-coins-hundred-fakes&quot;, &quot;title&quot;: &quot;KöMaL A.542: найти одну фальшивую среди 1000, если фальшивых 100&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;, &quot;lower_bound&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-komal-2011-a542&quot;, &quot;title&quot;: &quot;Цифровые взвешивания как да/нет тесты&quot;, &quot;text&quot;: &quot;Есть 1000 монет, из них 100 фальшивые. Вес настоящей монеты известен, а фальшивые легче настоящих, но могут иметь разные веса. За один тест можно взвесить любой набор монет; по результату становится известно, есть ли в этом наборе хотя бы одна фальшивая монета. Сколько тестов нужно и достаточно, чтобы наверняка найти одну фальшивую монету?&quot;, &quot;source_ids&quot;: [&quot;src-komal-2011-a542&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;, &quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-output-coin-set-size&quot;, &quot;title&quot;: &quot;Нижняя оценка считает не варианты, а возможные ответы алгоритма&quot;, &quot;text&quot;: &quot;После девяти да/нет тестов существует не более \\(2^9=512\\) различных протоколов, значит детерминированный алгоритм может указать не более 512 разных монет. Если все 100 фальшивых лежат среди остальных 488 монет, такой алгоритм обязательно ошибется.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-halving-until-one-fake&quot;, &quot;title&quot;: &quot;Десять раз делить множество кандидатов примерно пополам&quot;, &quot;text&quot;: &quot;Храним набор, в котором гарантированно есть фальшивая монета. Сначала это все 1000 монет. Взвешиваем примерно половину текущего набора: если тест говорит, что внутри есть фальшивая, продолжаем с этой половиной; иначе продолжаем с дополнением, где фальшивая тоже гарантированно есть. После десяти двоичных шагов остается одна монета, и она фальшивая. Оптимальность следует из оценки \\(2^9&lt;1000-100\\): за девять тестов алгоритм не может иметь достаточно много возможных указанных монет.&quot;, &quot;standard_idea_ids&quot;: [&quot;binary_encoding&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}], &quot;impossibility_proofs&quot;: [{&quot;id&quot;: &quot;lb-nine-tests-not-enough&quot;, &quot;title&quot;: &quot;Девять тестов не покрывают все возможные ответы&quot;, &quot;text&quot;: &quot;Зафиксируем все случайные выборы алгоритма, если они есть. Каждый запуск кодируется строкой из девяти ответов да/нет, поэтому алгоритм может закончить указанием не более 512 монет. Остается как минимум 488 монет, которые алгоритм никогда не указывает; можно выбрать все 100 фальшивых среди них, и тогда ответ алгоритма будет настоящей монетой.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;100-элементные множества фальшивых монет среди 1000 монет&quot;, &quot;observations&quot;: [&quot;двоичный ответ каждого теста: содержит выбранный набор фальшивую монету или нет&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно выбирать подмножество монет для теста&quot;], &quot;goal&quot;: [&quot;identify_one_counterfeit_coin&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;binary_search&quot;], &quot;lower_bound_method&quot;: [&quot;decision_tree_leaf_count&quot;], &quot;keywords&quot;: [&quot;komal_2011_a542&quot;, &quot;group_testing&quot;, &quot;find_one_defective&quot;, &quot;binary_questions&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 10, &quot;lies_allowed&quot;: &quot;none&quot;, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_one_counterfeit&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 5, &quot;comment&quot;: &quot;A-level KöMaL; простая стратегия, но нижняя оценка использует аккуратный подсчет возможных выходов алгоритма.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;binary_search&quot;, &quot;decision_tree_lower_bound&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-komal-2011-a542&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Формально это групповое тестирование, а не чашечные весы: наблюдение двоичное.&quot;]}}, {&quot;id&quot;: &quot;komal-2016-k517-normalia-truth-alternators&quot;, &quot;title&quot;: &quot;KöMaL K.517: правдивцы и чередующие правду жители Нормалии&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;logic_puzzle&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-komal-2016-k517&quot;, &quot;title&quot;: &quot;Два дня высказываний о типах и фамилиях&quot;, &quot;text&quot;: &quot;В Нормалии есть город, где правдивцы всегда говорят правду, а все остальные жители говорят правду через день: один день правду, на следующий день ложь, затем снова правду и так далее. Фамилии Андрея, Барбары и Цецилии - Малый, Большой и Длинный в некотором порядке. В понедельник Андрей сказал: «Барбара сейчас не говорит правду»; Барбара: «Я не правдивец»; Цецилия: «Среди нас есть правдивец». Во вторник Андрей сказал: «Цецилия вчера сказала правду»; Барбара: «Фамилия Андрея - либо Большой, либо Малый»; Цецилия: «Фамилия Барбары не Малый». Определите фамилии всех троих.&quot;, &quot;source_ids&quot;: [&quot;src-komal-2016-k517&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-alternator-day-links&quot;, &quot;title&quot;: &quot;Высказывание одного дня фиксирует режим следующего дня&quot;, &quot;text&quot;: &quot;Если участник не правдивец, то истинность его высказываний в понедельник и вторник противоположна. Поэтому, установив истинность одной реплики, можно перенести информацию на следующий день и затем использовать ее для фамилий.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-identify-types-then-surnames&quot;, &quot;title&quot;: &quot;Сначала определить типы, затем прочитать фамилии&quot;, &quot;text&quot;: &quot;Барбара не может быть правдивцем: ее фраза «я не правдивец» была бы ложной. Значит в понедельник она сказала правду как чередующий житель. Тогда фраза Андрея в понедельник ложна, и Андрей тоже не правдивец. Во вторник Андрей должен говорить правду, откуда Цецилия действительно сказала правду в понедельник; следовательно, правдивец среди троих есть, и им является Цецилия. Барбара во вторник лжет, поэтому фамилия Андрея не Большой и не Малый, то есть Длинный. Цецилия во вторник говорит правду, значит фамилия Барбары не Малый; ей остается Большой, а Цецилии - Малый.&quot;, &quot;standard_idea_ids&quot;: [&quot;knowledge_elimination&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;типы трех жителей и перестановка трех фамилий&quot;, &quot;observations&quot;: [&quot;шесть публичных высказываний за два дня&quot;], &quot;allowed_actions&quot;: [&quot;логически проверять совместимость истинности реплик с типами жителей&quot;], &quot;goal&quot;: [&quot;identify_surnames&quot;, &quot;identify_truth_patterns&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;temporal_truth_pattern&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;komal_2016_k517&quot;, &quot;truth_tellers&quot;, &quot;alternating_liars&quot;, &quot;two_days&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 6, &quot;lies_allowed&quot;: &quot;non-truetellers alternate truth and lie by day&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_types_and_surnames&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;K-level KöMaL; небольшая задача на исключение состояний с необычным режимом лжи.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;knowledge_elimination&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-komal-2016-k517&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Не дублирует классических рыцарей/лжецов: здесь ложь зависит от дня.&quot;]}}, {&quot;id&quot;: &quot;komal-2023-k749-aladdin-abu-lying-coin&quot;, &quot;title&quot;: &quot;KöMaL K.749: Аладдин, Абу и фальшивая монета, из-за которой лгут&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-komal-2023-k749&quot;, &quot;title&quot;: &quot;Пять монет и три вопроса с условной ложью&quot;, &quot;text&quot;: &quot;Аладдин нашел в коробке пять монет, одна из них фальшивая. Только Абу знает, какая именно. За один вопрос Аладдин выбирает три монеты и одну из них дает Абу; после этого Абу говорит, есть ли фальшивая монета среди двух остальных выбранных монет. Если Абу получил настоящую монету, он говорит правду, а если получил фальшивую, то лжет. Можно ли определить фальшивую монету не более чем за три вопроса?&quot;, &quot;source_ids&quot;: [&quot;src-komal-2023-k749&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-give-certified-real-coin&quot;, &quot;title&quot;: &quot;Первый ответ создает пару заведомо настоящих монет&quot;, &quot;text&quot;: &quot;Если первый ответ «есть», то две монеты, не участвовавшие в проверяемой паре и не данные Абу, точно настоящие. Если первый ответ «нет», то монета у Абу и обе проверяемые монеты настоящие. После этого можно задавать обычные правдивые вопросы, отдавая Абу уже сертифицированную настоящую монету.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-three-questions-certified-truth&quot;, &quot;title&quot;: &quot;Разветвить первый ответ и дальше спрашивать с настоящей монетой у Абу&quot;, &quot;text&quot;: &quot;В первом вопросе дадим Абу монету \\(A\\), а спрашивать будем про \\(B,C\\); монеты \\(D,E\\) остаются вне вопроса. Если Абу ответил «есть», то \\(D,E\\) настоящие: либо \\(B\\) или \\(C\\) фальшива, либо фальшива \\(A\\) и Абу лжет. Во втором вопросе даем Абу \\(D\\) и снова спрашиваем про \\(B,C\\). Ответ «нет» означает, что фальшива \\(A\\); ответ «есть» оставляет \\(B,C\\), и третьим вопросом с настоящей монетой у Абу различаем их.\n\nЕсли первый ответ «нет», то \\(A,B,C\\) настоящие: если бы \\(A\\) была фальшивой, Абу солгал бы и сказал «есть». Значит фальшивая среди \\(D,E\\). Во втором вопросе даем Абу \\(A\\) и спрашиваем про \\(B,E\\): ответ «есть» указывает на \\(E\\), ответ «нет» - на \\(D\\).&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;, &quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;5 возможных положений единственной фальшивой монеты&quot;, &quot;observations&quot;: [&quot;до трех ответов да/нет от Абу, истинность ответа зависит от данной ему монеты&quot;], &quot;allowed_actions&quot;: [&quot;адаптивно выбрать тройку монет, одну монету дать Абу и спросить о двух остальных&quot;], &quot;goal&quot;: [&quot;identify_counterfeit_coin&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;truth_liar_normalization&quot;, &quot;state_space_partition&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;komal_2023_k749&quot;, &quot;lying_oracle&quot;, &quot;counterfeit_coin&quot;, &quot;three_questions&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 3, &quot;lies_allowed&quot;: &quot;respondent lies exactly when handed the counterfeit coin&quot;, &quot;adaptive&quot;: true, &quot;objective&quot;: &quot;identify_counterfeit_coin&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;K-level KöMaL; хороший небольшой пример, где ложь нейтрализуется сертифицированной настоящей монетой.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;truth_liar_normalization&quot;, &quot;decision_tree&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-komal-2023-k749&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;new_links&quot;, &quot;notes&quot;: [&quot;Сюжет сочетает вопросы с ложью и фальшивую монету, но без физических взвешиваний.&quot;]}}, {&quot;id&quot;: &quot;kvant-2000-duma-knights-liars-removal&quot;, &quot;title&quot;: &quot;Квант-2000: Дума из 101 рыцаря и лжеца после удаления одного депутата&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Что будет, если вывести меня из Думы&quot;, &quot;text&quot;: &quot;В Думе 101 депутат, каждый из них либо рыцарь, всегда говорящий правду, либо лжец, всегда лгущий. Каждый депутат заявил: «Если вывести меня из состава Думы, то среди оставшихся депутатов рыцарей будет меньше, чем лжецов». Сколько рыцарей в Думе?&quot;, &quot;source_ids&quot;: [&quot;src-kvant-2000-04-young-solutions&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-removed-type-changes-inequality&quot;, &quot;title&quot;: &quot;Истинность фразы зависит только от типа удаленного депутата&quot;, &quot;text&quot;: &quot;Если говорит рыцарь, его фраза истинна после удаления рыцаря. Если говорит лжец, та же фраза должна быть ложной после удаления лжеца.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-two-inequalities&quot;, &quot;title&quot;: &quot;Получить две соседние оценки&quot;, &quot;text&quot;: &quot;Пусть в Думе x рыцарей и 101 - x лжецов. Если вывести рыцаря, его правдивая фраза дает x - 1 &lt; 101 - x, откуда x &lt; 51. Если вывести лжеца, его фраза ложна; после удаления лжеца утверждение «рыцарей меньше, чем лжецов» неверно, то есть x &gt;= 100 - x, откуда x &gt;= 50. Следовательно, x = 50.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;число рыцарей и лжецов среди 101 депутата&quot;, &quot;observations&quot;: [&quot;одинаковое публичное высказывание каждого депутата о результате его удаления&quot;], &quot;allowed_actions&quot;: [&quot;сопоставить истинность высказывания с типом говорящего&quot;], &quot;goal&quot;: [&quot;identify_number_of_truth_tellers&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;inequality_signature&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;kvant_for_younger_students&quot;, &quot;duma_knights_liars&quot;, &quot;removal_statement&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 101, &quot;lies_allowed&quot;: &quot;systematic liars&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;count_truth_tellers&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Короткая задача: правдивое и ложное прочтение одной фразы дают соседние неравенства.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;truth_liar_normalization&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvant-2000-04-young-solutions&quot;, &quot;role&quot;: &quot;official_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvant_kvantik_deep&quot;, &quot;notes&quot;: [&quot;Официальный PDF «Кванта» №4 за 2000 год содержит решение задачи 4 раздела «Квант» для младших школьников; формулировка восстановлена по решению.&quot;]}}, {&quot;id&quot;: &quot;kvant-2022-09-island-honest-liars-tricksters&quot;, &quot;title&quot;: &quot;Квант-2022: честные, лжецы и хитрецы пишут число честных&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Сколько честных на острове&quot;, &quot;text&quot;: &quot;На острове живут честные, лжецы и хитрецы. Все знают друг про друга, кто есть кто. Каждого жителя попросили написать, сколько среди них честных. Честные написали правильно, лжецы соврали, а хитрецы - кто как. Каждый записал двузначное число. Оказалось, что цифра 3 была написана 33 раза, цифра 5 была написана 66 раз, а цифра 7 была написана 77 раз. Никакие другие цифры написаны не были. Сколько всего честных среди жителей острова?&quot;, &quot;source_ids&quot;: [&quot;src-kvant-2022-09-young-problems&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-honest-writes-consume-digits&quot;, &quot;title&quot;: &quot;Честные записи уже расходуют часть счетчиков цифр&quot;, &quot;text&quot;: &quot;Если честных H, то каждый из H честных написал одно и то же число H. Поэтому цифры числа H должны поместиться в заданные общие количества цифр 3, 5 и 7.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-test-two-digit-candidates&quot;, &quot;title&quot;: &quot;Перебрать возможные двузначные числа&quot;, &quot;text&quot;: &quot;Всего написано 33 + 66 + 77 = 176 цифр, значит жителей 88. Число честных H двузначное и состоит только из цифр 3, 5, 7. Если H содержит цифру 3, то честные записи требуют как минимум H троек; это невозможно для H = 35, 37, 53, 73 и тем более для 33, потому что троек всего 33. Числа 55 и 75 невозможны из-за нехватки цифр 5, а 77 - из-за нехватки цифр 7. Остается H = 57. Он совместим со счетчиками: 57 честных пишут 57, расходуя 57 пятерок и 57 семерок, а остальные 31 житель могут дать оставшиеся 33 тройки, 9 пятерок и 20 семерок, не нарушая своих правил.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;число честных и распределение записей лжецов и хитрецов&quot;, &quot;observations&quot;: [&quot;агрегированные количества написанных цифр 3, 5, 7&quot;], &quot;allowed_actions&quot;: [&quot;логически проверять совместимость кандидатов&quot;], &quot;goal&quot;: [&quot;identify_number_of_truth_tellers&quot;], &quot;strategy_type&quot;: [&quot;state_elimination&quot;, &quot;counting_signature&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;kvant_for_younger_students&quot;, &quot;truth_liar_trickster&quot;, &quot;digit_counts&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 9, &quot;question_count&quot;: 1, &quot;lies_allowed&quot;: &quot;liars always write a wrong number; tricksters arbitrary&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_number_of_truth_tellers&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Младшая задача на совместимость публичной статистики с истинными ответами.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;truth_liar_normalization&quot;, &quot;linear_signature&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvant-2022-09-young-problems&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvant_batch&quot;, &quot;notes&quot;: [&quot;В источнике виден раздел «Квант» для младших школьников; решение добавлено редакционно как короткая проверка совместимости.&quot;]}}, {&quot;id&quot;: &quot;kvantik-2013-four-magic-balls-three-tests&quot;, &quot;title&quot;: &quot;Квантик-2013: четыре шарика и три измерения детектором&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Детектор считает волшебные шарики&quot;, &quot;text&quot;: &quot;Имеются красный, синий, зеленый и черный шарики, среди которых могут быть волшебные. Детектор позволяет определить, сколько из помещенных в него шариков волшебны. Как узнать, какие шарики волшебные, а какие - нет, всего за три измерения?&quot;, &quot;source_ids&quot;: [&quot;src-kvantik-math-contest-2013&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;hidden_state&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-binary-signature-subset-sums&quot;, &quot;title&quot;: &quot;Дать каждому шарику свой трехмерный код&quot;, &quot;text&quot;: &quot;Каждый шарик участвует в некоторых из трех измерений. Тройка полученных чисел равна сумме кодов всех волшебных шариков, поэтому коды надо выбрать так, чтобы разные наборы давали разные суммы.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-three-detector-subsets&quot;, &quot;title&quot;: &quot;Измерить три специально выбранных набора&quot;, &quot;text&quot;: &quot;Обозначим шарики К, С, З, Ч: красный, синий, зеленый, черный. Проведем такие измерения: 1) З и Ч; 2) С и Ч; 3) К, С и З.\n\nТогда волшебный красный шарик добавляет к тройке результатов (0, 0, 1), синий - (0, 1, 1), зеленый - (1, 0, 1), черный - (1, 1, 0). Для этих четырех кодов все суммы по подмножествам различны, поэтому тройка показаний однозначно задает набор волшебных шариков. Например, (0, 0, 0) означает, что волшебных нет, (0, 0, 1) - только красный, (1, 1, 0) - только черный, а (2, 2, 3) - все четыре.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;hidden_state&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;любой из 16 наборов волшебных шариков среди четырех цветов&quot;, &quot;observations&quot;: [&quot;три числовых ответа детектора о количестве волшебных шариков в выбранном наборе&quot;], &quot;allowed_actions&quot;: [&quot;выбрать подмножество шариков и узнать число волшебных в нем&quot;], &quot;goal&quot;: [&quot;identify_all_magic_balls&quot;], &quot;strategy_type&quot;: [&quot;binary_signature&quot;, &quot;subset_sum_code&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;detector_queries&quot;, &quot;subset_sum_signature&quot;, &quot;magic_balls&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 5, &quot;question_count&quot;: 3, &quot;lies_allowed&quot;: &quot;none&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_boolean_state_of_four_objects&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Нужно увидеть измерения как кодовые слова объектов и избежать совпадений сумм.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;binary_code&quot;, &quot;linear_signature&quot;, &quot;nonadaptive_strategy&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvantik-math-contest-2013&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvantik_batch&quot;, &quot;notes&quot;: [&quot;Математический конкурс Квантика 2013 года, задача 30. На странице конкурса дано условие; решение восстановлено редакционно.&quot;]}}, {&quot;id&quot;: &quot;kvantik-2013-three-cards-one-question&quot;, &quot;title&quot;: &quot;Квантик-2013: три карточки и один вопрос с ответом «не знаю»&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Да, нет или не знаю&quot;, &quot;text&quot;: &quot;Перед Андреем и Сережей на столе лежат три перевернутые карточки, под одной из которых написано «1», под второй «2» и под третьей «3». Андрей их перемешал и вытащил одну из них, но какую - Сереже не сказал. Сережа может задать ему только один вопрос, на который тот, подумав, должен честно ответить «Да», «Нет» или «Не знаю», после чего Сережа должен наверняка отгадать число, которое вытащил Андрей. Как ему это сделать?&quot;, &quot;source_ids&quot;: [&quot;src-kvantik-math-contest-2013&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-use-unknown-as-third-symbol&quot;, &quot;title&quot;: &quot;Ответ «не знаю» становится третьим информационным символом&quot;, &quot;text&quot;: &quot;Нужно спросить о событии, которое при одной карточке точно истинно, при другой точно ложно, а при третьей зависит от случайного выбора из двух оставшихся карточек.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-random-remaining-card-question&quot;, &quot;title&quot;: &quot;Спросить про случайно открытую оставшуюся карточку&quot;, &quot;text&quot;: &quot;Сережа спрашивает: «Если я наугад открою одну из двух оставшихся на столе карточек, будет ли на ней число меньше твоего?»\n\nЕсли Андрей вытащил 1, обе оставшиеся карточки больше, поэтому честный ответ - «Нет». Если он вытащил 3, обе оставшиеся карточки меньше, поэтому ответ - «Да». Если он вытащил 2, среди оставшихся карточек есть 1 и 3, так что ответ зависит от того, какая из них будет открыта; Андрей должен ответить «Не знаю».&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;одно из трех чисел 1, 2, 3 на вытянутой карточке&quot;, &quot;observations&quot;: [&quot;один честный ответ из трех вариантов: да, нет, не знаю&quot;], &quot;allowed_actions&quot;: [&quot;задать один вопрос человеку, который знает свою карточку&quot;], &quot;goal&quot;: [&quot;identify_hidden_card&quot;], &quot;strategy_type&quot;: [&quot;ternary_answer_design&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;three_answer_question&quot;, &quot;unknown_answer_as_signal&quot;, &quot;card_guessing&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 3, &quot;question_count&quot;: 1, &quot;lies_allowed&quot;: &quot;none&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_one_of_three_cards&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Короткая задача на проектирование вопроса с тремя различимыми ответами.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;ternary_code&quot;, &quot;decision_tree&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvantik-math-contest-2013&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvantik_batch&quot;, &quot;notes&quot;: [&quot;Математический конкурс Квантика 2013 года, задача 24. На странице конкурса дано условие; решение восстановлено редакционно.&quot;]}}, {&quot;id&quot;: &quot;kvantik-2015-parity-four-integers-three-questions&quot;, &quot;title&quot;: &quot;Квантик-2015: четность одного числа по трем вопросам&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;strategy_construction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Сумма трех чисел четная или нечетная&quot;, &quot;text&quot;: &quot;Загаданы четыре целых числа a, b, c, d. Разрешается выбрать любые три из них и спросить: их сумма четная или нечетная? Как за три таких вопроса узнать, четно или нечетно число a?&quot;, &quot;source_ids&quot;: [&quot;src-kvantik-math-contest-2015&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;parity&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-cancel-other-parities&quot;, &quot;title&quot;: &quot;Сложить ответы так, чтобы лишние четности сократились&quot;, &quot;text&quot;: &quot;Если спросить суммы abc, abd и acd, то четности b, c, d войдут по два раза и исчезнут по модулю 2, а четность a останется.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-three-triples-with-a&quot;, &quot;title&quot;: &quot;Спросить три тройки, содержащие a&quot;, &quot;text&quot;: &quot;Спросим четность сумм a+b+c, a+b+d и a+c+d. Сложим три полученных ответа по модулю 2, считая «нечетная» за 1, а «четная» за 0. Получится \\((a+b+c)+(a+b+d)+(a+c+d) \\equiv a \\pmod 2\\), потому что b, c и d встречаются по два раза. Поэтому итоговая четность этой суммы ответов и есть четность числа a.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;parity&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;четности четырех неизвестных целых чисел&quot;, &quot;observations&quot;: [&quot;три бинарных ответа о четности выбранной суммы из трех чисел&quot;], &quot;allowed_actions&quot;: [&quot;выбрать любые три из четырех чисел и узнать четность их суммы&quot;], &quot;goal&quot;: [&quot;identify_parity_of_a&quot;], &quot;strategy_type&quot;: [&quot;linear_combination_over_mod_2&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;parity_queries&quot;, &quot;mod2_cancellation&quot;, &quot;hidden_bits&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 3, &quot;lies_allowed&quot;: &quot;none&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_one_hidden_parity_bit&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;Линейное кодирование четностей: три ответа складываются в нужный бит.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;parity&quot;, &quot;parity_code&quot;, &quot;linear_signature&quot;, &quot;nonadaptive_strategy&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvantik-math-contest-2015&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvantik_batch&quot;, &quot;notes&quot;: [&quot;Математический конкурс Квантика 2015 года, задача 42. На странице конкурса дано условие; решение восстановлено редакционно.&quot;]}}, {&quot;id&quot;: &quot;kvantik-2016-divisibility-knights-liars&quot;, &quot;title&quot;: &quot;Квантик-2016/17: лжецы и рыцари отвечают о делимости своих чисел&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Делится ли ваше число?&quot;, &quot;text&quot;: &quot;В стране лжецов и рыцарей рыцари всегда говорят правду, а лжецы всегда лгут. Десяти жителям выдали различные числа от 1 до 10. Потом каждого спросили: «Делится ли ваше число на 2?» Утвердительный ответ дали 3 человека. На вопрос «Делится ли ваше число на 4?» утвердительный ответ дали 6 человек. На вопрос «Делится ли ваше число на 5?» утвердительно ответили 2 человека. Сколько было лжецов и какие у них были числа?&quot;, &quot;source_ids&quot;: [&quot;src-kvantik-math-contest-2016-2017&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-liar-complements-divisibility&quot;, &quot;title&quot;: &quot;Лжец меняет ответ на дополнение признака&quot;, &quot;text&quot;: &quot;Для каждого делителя число утвердительных ответов равно количеству рыцарей с делящимися числами плюс количеству лжецов с неделящимися числами.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-linear-counts&quot;, &quot;title&quot;: &quot;Сравнить три счетчика ответов&quot;, &quot;text&quot;: &quot;Пусть L - множество чисел лжецов. Для делителя d число ответов «да» равно числу чисел из {1,...,10}, делящихся на d, плюс поправка: лжецы с делящимися на d числами вместо «да» говорят «нет», а лжецы с неделящимися числами вместо «нет» говорят «да».\n\nПроверяя делимость на 2, 4 и 5, получаем единственный набор лжецов: 2, 5, 6 и 10. Действительно, для этих чисел ответы «да» по делимости на 2 дают только рыцари 4 и 8 плюс лжец 5, всего 3; по делимости на 4 дают рыцари 4 и 8 плюс лжецы 2, 5, 6, 10, всего 6; по делимости на 5 дают только рыцари с числами, делящимися на 5, отсутствуют, зато лжецы 2 и 6 отвечают «да», всего 2. Другой набор не удовлетворяет одновременно всем трем счетчикам.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;какие из десяти жителей являются лжецами и какие числа они получили&quot;, &quot;observations&quot;: [&quot;три агрегированных количества утвердительных ответов на вопросы о делимости&quot;], &quot;allowed_actions&quot;: [&quot;использовать, что каждый лжец систематически инвертирует истинный ответ&quot;], &quot;goal&quot;: [&quot;identify_liars_and_numbers&quot;], &quot;strategy_type&quot;: [&quot;counting_signature&quot;, &quot;state_elimination&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;kvantik_math_contest_2016_2017&quot;, &quot;divisibility_questions&quot;, &quot;truth_liar_counts&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 3, &quot;lies_allowed&quot;: &quot;systematic liars&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;identify_liars_numbers&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 3, &quot;comment&quot;: &quot;Три групповых счетчика дают линейную подпись множества лжецов.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;linear_signature&quot;, &quot;nonadaptive_strategy&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvantik-math-contest-2016-2017&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-18&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvant_kvantik_deep&quot;, &quot;notes&quot;: [&quot;Математический конкурс «Квантика» 2016/17 учебного года, задача 53; решение восстановлено редакционно по счетчикам ответов.&quot;]}}, {&quot;id&quot;: &quot;kvantik-2016-round-table-right-liar-count&quot;, &quot;title&quot;: &quot;Квантик-2016: сколько ответов «справа лжец» возможно за круглым столом&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Десять рыцарей и лжецов за кругом&quot;, &quot;text&quot;: &quot;За круглым столом сидят десять человек: рыцари и лжецы, и те, и другие присутствуют. Рыцари всегда говорят правду, а лжецы всегда лгут. Каждого спросили, кто сидит справа от него - рыцарь или лжец. Могло ли число ответов «справа от меня сидит лжец» равняться а) двум; б) одному?&quot;, &quot;source_ids&quot;: [&quot;src-kvantik-math-contest-2016&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;truth_teller&quot;, &quot;liar&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-yes-means-type-change&quot;, &quot;title&quot;: &quot;Ответ «справа лжец» отмечает смену типа&quot;, &quot;text&quot;: &quot;Рыцарь говорит такой ответ ровно перед лжецом, а лжец - ровно перед рыцарем, потому что ложный ответ на вопрос о правом соседе меняет истину на противоположную.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-count-color-changes-on-cycle&quot;, &quot;title&quot;: &quot;Свести ответы к границам между типами&quot;, &quot;text&quot;: &quot;Если человек и его правый сосед одного типа, ответ «справа лжец» не прозвучит: рыцарь перед рыцарем честно скажет «рыцарь», а лжец перед лжецом соврет и тоже скажет «рыцарь». Если типы разные, такой ответ прозвучит: рыцарь перед лжецом скажет правду, а лжец перед рыцарем соврет.\n\nЗначит, нужное число равно числу переходов между рыцарями и лжецами при обходе круга. На круге число переходов между двумя типами всегда четно. Так как присутствуют и рыцари, и лжецы, переходов как минимум два. Поэтому два ответа возможны, например если все рыцари сидят подряд и все лжецы подряд, а один ответ невозможен.&quot;, &quot;standard_idea_ids&quot;: [&quot;truth_liar_normalization&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;truth_teller&quot;, &quot;liar&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;расположение рыцарей и лжецов на цикле из десяти мест&quot;, &quot;observations&quot;: [&quot;десять ответов о типе правого соседа&quot;], &quot;allowed_actions&quot;: [&quot;логически нормализовать ответы лжецов и рыцарей&quot;], &quot;goal&quot;: [&quot;decide_possible_number_of_specific_answers&quot;], &quot;strategy_type&quot;: [&quot;truth_liar_normalization&quot;, &quot;cycle_parity&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;knights_liars_cycle&quot;, &quot;type_changes&quot;, &quot;right_neighbor&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 10, &quot;lies_allowed&quot;: &quot;liars always lie, knights always tell truth&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;characterize_possible_answer_count&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;После нормализации ответов задача становится подсчетом границ двух цветов на цикле.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;truth_liar_normalization&quot;, &quot;parity&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-kvantik-math-contest-2016&quot;, &quot;role&quot;: &quot;official_statement&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;kvantik_batch&quot;, &quot;notes&quot;: [&quot;Математический конкурс Квантика 2016 года, задача 26. На странице конкурса дано условие; решение восстановлено редакционно.&quot;]}}, {&quot;id&quot;: &quot;kvantik-2016-window-two-truths&quot;, &quot;title&quot;: &quot;Квантик-2016: разбитое окно и два правдивых ответа&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;journal_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quo ядке. За один вопрос можно назвать несколько различных букв и получить запись суммы соответствующих цифр, но тоже в буквенном шифре. Нужно за пять вопросов восстановить соответствие букв и цифр.&quot;, &quot;source_ids&quot;: [&quot;src-matprazdnik-2022-book&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;query&quot;, &quot;hidden_state&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-complement-sums-peel-pairs&quot;, &quot;title&quot;: &quot;Суммы всех еще неизвестных букв снимают пары с краев&quot;, &quot;text&quot;: &quot;Сумма всех цифр равна 45. Ответ на сумму всех нерасшифрованных букв каждый раз показывает две крайние цифры очередной суммы: сначала 4 и 5, затем 3 и 6, затем 2 и 7, затем 1 и 8, затем 0 и 9.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-ask-all-remaining&quot;, &quot;title&quot;: &quot;Каждый раз спрашивать сумму всех нерасшифрованных букв&quot;, &quot;text&quot;: &quot;Первым вопросом называют все десять букв; сумма 45 раскрывает буквы, которыми записаны 4 и 5. Эти две буквы исключают. Вторым вопросом спрашивают сумму оставшихся восьми цифр, равную 36, и узнают буквы 3 и 6. Далее аналогично получают пары 2 и 7, 1 и 8. После пятого вопроса оставшаяся пара различается по записи суммы 9: становится ясно, где 9, а где 0.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;query&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;10! возможных соответствий букв и цифр&quot;, &quot;observations&quot;: [&quot;пять ответов, каждый является шифрованной десятичной записью суммы выбранных цифр&quot;], &quot;allowed_actions&quot;: [ nal&quot;, &quot;title&quot;: &quot;Определить соседний обмен&quot;, &quot;text&quot;: &quot;Шесть шкатулок с надписями 1,2,3,4,5,6 содержат монеты соответствующих масс. Мудрец расставляет шкатулки в прямоугольнике 2 на 3. Затем шах либо ничего не делает, либо тайно меняет местами монеты в двух соседних по стороне шкатулках. После этого мудрец выбирает несколько шкатулок, узнает суммарный вес монет в них и должен определить действие шаха.&quot;, &quot;source_ids&quot;: [&quot;src-matprazdnik-2024-book&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;hidden_state&quot;, &quot;strategy&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-edge-changes-have-distinct-deltas&quot;, &quot;title&quot;: &quot;Каждому возможному обмену нужен свой сдвиг суммы&quot;, &quot;text&quot;: &quot;Если спрашивать сумму в клетках одной доли шахматной раскраски, то любой соседний обмен меняет сумму на разность двух чисел. Расстановка подбирается так, чтобы семь обменов и нулевой ход давали разные суммы.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-arrange-263-451-ask-235&quot;, &quot;title&quot;: &quot;Расстановка 2 6 3 / 4 5 1 и запрос по клеткам 2,3,5&quot;, &quot;text&quot;: &quot;Поставим в верхнем ряду шкатулки 2,6,3, а в нижнем 4,5,1. Спросим сумму монет в шкатулках с крышками 2,3,5; без обмена она равна 10. Для семи соседних пар получаются попарно разные суммы: 12,11,8,9,14,6,13. Поэтому ответ шаха однозначно указывает либо на отсутствие обмена, либо на конкретную соседнюю пару.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;hidden_state&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quo &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;logic_deduction&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-original&quot;, &quot;title&quot;: &quot;Кто самый медленный&quot;, &quot;text&quot;: &quot;Есть три участника: один самый ловкий и всегда лжет, один самый смелый и всегда говорит правду, третий самый быстрый и может говорить как правду, так и ложь. Йог говорит, что самый быстрый смелее его; бульдог говорит, что он быстрее самого ловкого; носорог говорит, что он ловчее самого смелого. Нужно определить самого медленного.&quot;, &quot;source_ids&quot;: [&quot;src-matprazdnik-2025-book&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;truth_teller&quot;, &quot;liar&quot;, &quot;hidden_state&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-role-elimination&quot;, &quot;title&quot;: &quot;Исключить роли, в которых высказывание противоречит статусу говорящего&quot;, &quot;text&quot;: &quot;Роли правдивца, лжеца и свободного говорящего связаны с первыми местами по трем качествам. Проверка невозможных назначений быстро фиксирует, кто является самым быстрым, кто самым ловким и кто самым смелым.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-eliminate-rhino-then-yog&quot;, &quot;title&quot;: &quot;Сначала определить роль носорога, затем йога&quot;, &quot;text&quot;: &quot;Носорог не может быть самым смелым: тогда его фраза была бы истинной, но утверждала бы, что он ловчее самого себя. Он не может быть и самым ловким: тогда он должен был бы лгать, хотя его фраза стала бы истинной. Значит, носорог самый быстрый. Йог не может быть самым смелым, потому что тогда его фраза тоже стала бы истинной невозможным образом. Следовательно, йог самый ловкий, бульдог самый смелый. Из фразы бульдога следует, что он быстрее йога; носорог быстрее всех, поэтому йог самый медленный.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;truth_teller&quot;, &quot;liar&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;распределение трех первых мест по ловкости, смелости и быстроте и истинность трех высказываний&quot;, &quot;observations&quot;: [&quot;три публичных высказывания с разными режимами истинности&quot;], &quot;allowed_actions&quot;: [&quot;логически исключать несовместимые назначения ролей&quot;], &quot;goal&quot;: [&quot;identify_slowest_participant&quot;], &quot;strategy_type&quot;: [&quot;role_elimination&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;matprazdnik_2025&quot;, &quot;truth_liar&quot;, &quot;role_assignment&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 3, &quot;lies_allowed&quot;: &quot;one designated liar, one designated truth-teller, one unconstrained speaker&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;deduce_order_information&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;standard&quot;, &quot;local_score&quot;: 2, &quot;comment&quot;: &quot;6 класс, короткое исключение ролей.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: [&quot;lie_detection&quot;, &quot;truth_liar_normalization&quot;, &quot;indistinguishability_argument&quot;], &quot;sources&quot;: [{&quot;source_id&quot;: &quot;src-matprazdnik-2025-book&quot;, &quot;role&quot;: &quot;official_statement_and_solution&quot;, &quot;status&quot;: &quot;source_verified&quot;}], &quot;editorial&quot;: {&quot;created_by&quot;: &quot;ai&quot;, &quot;created_at&quot;: &quot;2026-05-17&quot;, &quot;review_status&quot;: &quot;ai_checked&quot;, &quot;public_ready&quot;: true, &quot;relations_status&quot;: &quot;matprazdnik_savin_batch&quot;, &quot;notes&quot;: [&quot;Официальная брошюра, 36-й Математический праздник, 6 класс, задача 2.&quot;]}}, {&quot;id&quot;: &quot;mcya-2018-intermediate-higher-or-lower&quot;, &quot;title&quot;: &quot;MCYA 2018 Intermediate: игра Higher or Lower со скрытым призом&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;olympiad_problem&quot;, &quot;secondary&quot;: [&quot;strategy_analysis&quot;, &quot;probability&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-mcya-2018-higher-or-lower&quot;, &quot;title&quot;: &quot;Выигрышные шансы в игре с подсказками выше/ниже&quot;, &quot;text&quot;: &quot;Два игрока играют в Higher or Lower. Приз спрятан в одной из коробок, стоящих в ряд и пронумерованных слева направо. Все коробки равновероятны. Игроки по очереди называют номер коробки. Если номер верный, ведущий говорит, что ответ правильный, и этот игрок выигрывает. Если номер неверный, ведущий, знающий место приза, честно говорит, что приз находится выше или ниже названного номера. Оба игрока всегда следуют этим подсказкам. В задаче нужно сравнить стратегии первого хода для 3 и 4 коробок, а затем показать, что при 9 коробках у первого игрока есть стратегия с вероятностью выигрыша больше 1/2.&quot;, &quot;source_ids&quot;: [&quot;src-amt-australian-scene-2018&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-guess-splits-hidden-interval&quot;, &quot;title&quot;: &quot;Неверная догадка сужает скрытый интервал&quot;, &quot;text&quot;: &quot;Каждый ход либо сразу находит приз, либо разбивает текущее множество возможных коробок на левую и правую части. Подсказка ведущего выбирает одну из этих частей и передает ход сопернику, поэтому важна не только длина интервала, но и чей следующий ход.&quot;, &quot;standard_idea_ids&quot;: [&quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-edge-and-middle-recursion&quot;, &quot;title&quot;: &quot;Использовать маленькие игры как поддеревья&quot;, &quot;text&quot;: &quot;Для 3 коробок первый ход в край дает первому игроку шанс 2/3: он выигрывает сразу с вероятностью 1/3, а если получает подсказку, то в оставшихся двух коробках второй игрок либо угадывает, либо оставляет последнюю коробку первому. Для 4 коробок второй игрок может после любого первого хода обеспечить себе шанс 1/2. Для 9 коробок первый игрок называет среднюю коробку 5: с вероятностью 1/9 он выигрывает сразу, а иначе остается игра на 4 коробках, где теперь первый игрок получает роль второго в подыгре и может обеспечить себе 1/2. Итого шанс равен 1/9 + (8/9)(1/2) = 5/9.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;decision_tree&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;номер коробки, в которой спрятан приз&quot;, &quot;observations&quot;: [&quot;на каждую неверную догадку ведущий сообщает направление: выше или ниже&quot;], &quot;allowed_actions&quot;: [&quot;называть номер коробки с учетом предыдущих подсказок&quot;], &quot;goal&quot;: [&quot;maximize_probability_of_winning&quot;], &quot;strategy_type&quot;: [&quot;adaptive_strategy&quot;, &quot;decision_tree&quot;, &quot;state_space_partition&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;mcya_2018&quot;, &quot;higher_or_lower&quot;, &quot;hidden_prize&quot;, &quot;binary_feedback& у; никакие два дня рождения не находятся в одном месяце; день рождения Эбони ровно на три недели позже дня рождения Дилана; день рождения Энни был в тот же день недели, что и день рождения Дилана, в 2020 году, но не в 2021 году; день рождения Бэзила каждый год на 33 дня позже дня рождения Энни; Эбони родилась не в июле. Нужно определить месяцы и заполнить все возможные доски.&quot;, &quot;source_ids&quot;: [&quot;src-amt-australian-scene-2022&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-digit-multiset-plus-calendar-constraints&quot;, &quot;title&quot;: &quot;Мультимножество цифр соединяется с календарными ограничениями&quot;, &quot;text&quot;: &quot;Скрытое состояние - пять дат. Ограничение по общему числу цифровых карточек сразу запрещает многие месяцы и первые цифры дней, а календарные расстояния в 21 и 33 дня связывают соседние даты.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-eliminate-months-then-weekday&quot;, &quot;title&quot;: &quot;Сначала исключить месяцы, затем использовать день недели&quot;, &quot;text&quot;: &quot;Из порядка имен и количества карточек для месяцев следует, что Энни родилась в январе, Бэзил - в феврале, а все третьи цифры дат-месяцев равны 0. Для Дилана остаются только май, июль или август; август невозможен из-за повторяющихся вторых цифр дней, май невозможен из-за несовместимости первых цифр дней при сдвиге Эбони на 21 день. Значит, Дилан родился в июле, Эбони - в августе. Условие о днях недели в 2020 и 2021 годах выбирает 26 января для Энни и 28 февраля для Бэзила; остаются две доски, различающиеся только датой Кэрол: 15 апреля или 14 мая.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status t;: false, &quot;relations_status&quot;: &quot;australia_batch&quot;, &quot;notes&quot;: [&quot;2026-05-18 scope-аудит: карточка снята с публичной готовности как календарно-табличная задача на согласование ограничений; она близка к общей логической реконструкции, но не к ядру базы про стратегии при неполной информации.&quot;]}}, {&quot;id&quot;: &quot;nrich-knights-and-knaves-queue&quot;, &quot;title&quot;: &quot;NRICH: рыцари и лжецы в очереди&quot;, &quot;fragment&quot;: &quot;questions&quot;, &quot;kind&quot;: {&quot;primary&quot;: &quot;nrich_problem&quot;, &quot;secondary&quot;: [&quot;truth_liar_reasoning&quot;, &quot;hidden_types&quot;]}, &quot;language&quot;: &quot;ru&quot;, &quot;statements&quot;: {&quot;original&quot;: [{&quot;id&quot;: &quot;stmt-nrich-knights-queue&quot;, &quot;title&quot;: &quot;Очередь из 25 островитян&quot;, &quot;text&quot;: &quot;На острове каждый житель либо рыцарь, который всегда говорит правду, либо лжец, который всегда лжет. В очереди стоят 25 островитян. Первый сказал: \&quot;Все, кто стоит за мной, лжецы\&quot;. Каждый из остальных сказал: \&quot;Человек прямо передо мной - лжец\&quot;. Сколько рыцарей стоит в очереди?&quot;, &quot;source_ids&quot;: [&quot;src-nrich-knights-and-knaves&quot;], &quot;status&quot;: &quot;source_verified&quot;, &quot;self_contained&quot;: {&quot;status&quot;: &quot;ai_checked&quot;}, &quot;definition_ids&quot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-first-person-cannot-be-knight&quot;, &quot;title&quot;: &quot;Сначала проверить первое утверждение&quot;, &quot;text&quot;: &quot;Если первый был бы рыцарем, то все остальные были бы лжецами. Но тогда второй, называя первого лжецом, действительно лгал бы, а третий, называя второго лжецом, говорил бы правду. Значит, все после первого не могут быть лжецами одновременно.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-alternating-queue&quot;, &quot;title&quot;: &quot;Разбор очереди слева направо&quot;, &quot;text&quot;: &quot;Первый не может быть рыцарем: иначе все 24 человека позади него были бы лжецами, но тогда среди их фраз о предыдущем человеке неизбежно появилась бы правдивая фраза. Значит, первый - лжец.\n\nВторой говорит, что первый - лжец, и это правда, поэтому второй - рыцарь. Третий говорит, что второй - лжец, это неправда, поэтому третий - лжец. Дальше рассуждение повторяется: после первого идут попеременно рыцарь, лжец, рыцарь, лжец.\n\nВ 25 местах нечетные позиции заняты лжецами, а четные - рыцарями. Четных позиций от 1 до 25 ровно 12, поэтому в очереди 12 рыцарей.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;тип каждого из 25 жителей: рыцарь или лжец&quot;, &quot;observations&quot;: [&quot;публичные высказывания о людях позади или непосредственно впереди&quot;], &quot;allowed_actions&quot;: [&quot;логически сопоставлять истинность фразы с типом говорящего&quot;], &quot;goal&quot;: [&quot;count_knights&quot;], &quot;strategy_type&quot;: [&quot;truth_liar_elimination&quot;, &quot;sequential_propagation&quot;], &quot;lower_bound_method&quot;: [], &quot;keywords&quot;: [&quot;nrich&quot;, &quot;knights_and_knaves&quot;, &quot;queue&quot;, &quot;hidden_types&quot;], &quot;status&quot;: &quot;needs_human_review&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: 25, &quot;lies_allowed&quot;: &quot;each speaker is either always truthful or always lying&quot;, &quot;adaptive&quot;: false, &quot;objective&quot;: &quot;infer_number_of_knights&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;intro&quot;, &quot;local_score&quot;:  &quot;Упаковочная нижняя оценка&quot;, &quot;text&quot;: &quot;В неадаптивной версии каждому объекту соответствует двоичное слово длины \\(q\\) - набор правдивых ответов. Если допускается одна ложь, то все слова на расстоянии не больше 1 от разных объектов должны быть различны, иначе одно и то же наблюдение было бы совместимо с двумя объектами. Поэтому \\(N(q+1)\\le 2^q\\). Эта оценка также служит ориентиром для адаптивной игры, хотя полная оптимальность адаптивных стратегий требует более тонкого анализа.&quot;, &quot;standard_idea_ids&quot;: [&quot;one_lie_redundancy&quot;, &quot;decision_tree_lower_bound&quot;], &quot;status&quot;: &quot;ai_checked&quot;, &quot;definition_ids&quot;: [&quot;error_correcting_code&quot;, &quot;information_lower_bound&quot;]}], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;N возможных объектов&quot;, &quot;observations&quot;: [&quot;двоичное слово ответов с возможной одной ошибкой&quot;], &quot;allowed_actions&quot;: [&quot;задать вопросы да/нет&quot;], &quot;goal&quot;: [&quot;identify_hidden_object&quot;], &quot;strategy_type&quot;: [&quot;error_correcting_code&quot;, &quot;lie_detection&quot;], &quot;lower_bound_method&quot;: [&quot;hamming_ball_packing&quot;], &quot;keywords&quot;: [&quot;one_lie&quot;, &quot;twenty_questions_with_lies&quot;, &quot;hamming_bound&quot;, &quot;N_q_parameterized&quot;], &quot;status&quot;: &quot;ai_checked&quot;}, &quot;questions_profile&quot;: {&quot;answer_alphabet_size&quot;: 2, &quot;question_count&quot;: &quot;q&quot;, &quot;lies_allowed&quot;: 1, &quot;adaptive&quot;: &quot;separate cases&quot;, &quot;objective&quot;: &quot;identify_one_of_N_states&quot;}, &quot;difficulty&quot;: {&quot;main&quot;: &quot;olympiad_medium&quot;, &quot;local_score&quot;: 4, &quot;comment&quot;: &quot;Стартовая карточка нижней оценки; конструктивные оптимальные стратегии можно добавлять отдельными карточками.&quot;, &quot;status&quot;: &quot;ai_checked&quot;}, &quot;tags&quot;: uot;: [&quot;state_space&quot;]}]}, &quot;ideas&quot;: [{&quot;id&quot;: &quot;idea-one-subject-separates-a-pair&quot;, &quot;title&quot;: &quot;Для каждой пары учеников достаточно закрепить один различающий предмет&quot;, &quot;text&quot;: &quot;Скрытое состояние - личность ученика. Чтобы выбранные предметы различали всех, нужно для каждой пары оставить хотя бы один предмет, по которому их оценки различаются.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;ai_checked&quot;}], &quot;strategies&quot;: [{&quot;id&quot;: &quot;str-pick-minimal-separating-set&quot;, &quot;title&quot;: &quot;Последовательно уточнять разбиение учеников по выбранным предметам&quot;, &quot;text&quot;: &quot;Начнем с пустого набора выбранных предметов: все 7 учеников пока лежат в одном классе, потому что по выбранным предметам они не различаются. Если текущее разбиение еще не состоит из одноэлементных классов, то в некотором классе есть два разных ученика. По условию их полные 12-мерные наборы оценок различаются, значит существует предмет, который разделяет хотя бы один текущий класс на две непустые части. Добавим такой предмет.\n\nКаждый добавленный предмет увеличивает число классов разбиения хотя бы на 1. Был 1 класс, а нужно получить 7 одноэлементных классов, поэтому достаточно не более 6 добавлений. После этого любые два ученика различаются хотя бы по одному из выбранных предметов. Если предметов получилось меньше 6, можно добавить произвольные оставшиеся предметы до ровно шести.&quot;, &quot;standard_idea_ids&quot;: [&quot;partition_state_space&quot;], &quot;status&quot;: &quot;needs_human_review&quot;, &quot;definition_ids&quot;: [&quot;state_space&quot;]}], &quot;impossibility_proofs&quot;: [], &quot;incomplete_information_profile&quot;: {&quot;hidden_state_space&quot;: &quot;один из семи учеников&quot;, &quot;observations&quot;: [&quot;оценки выбранного ученика по выбранным шести предметам&quot;], &quot;allowed_actions&quot;: [&quo
